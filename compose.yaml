# Frenchia development stack. Always invoked as `docker compose -p frenchia` (see justfile)
# so start/stop never touch other projects' containers. All ports bind to 127.0.0.1.
# Native inference services (LLM, TTS) run outside Docker under launchd (Phase 2).
name: frenchia

x-backend: &backend
  image: frenchia-backend:dev
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    AUDIO_CACHE_DIR: /var/frenchia/audio
    CONTENT_DIR: /content
    # uvicorn --reload misses some edits through the Docker Desktop bind mount; poll instead.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./backend:/app
    # Content-addressed TTS cache, kept on the host (var/ is gitignored)
    - ./var/audio:/var/frenchia/audio
    # Content as code: read by the importer, drafts written by the generation pipeline
    - ./content:/content
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    # No auto-reload: a code reload would kill a running generation. `just restart worker` to pick
    # up code changes; jobs interrupted by a restart are requeued at startup.
    command: ["sh", "-c", "python manage.py recover_jobs && exec python manage.py db_worker --no-reload"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    # node_modules lives in a volume (Linux binaries) so it never collides with the host's
    # macOS node_modules; reinstall only when package-lock.json changes.
    command:
      - sh
      - -c
      - |
        h=$$(sha256sum package-lock.json | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lockhash 2>/dev/null)" != "$$h" ]; then
          npm ci --no-audit --no-fund && echo "$$h" > node_modules/.lockhash
        fi
        exec npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  pgdata:
  frontend_node_modules:
