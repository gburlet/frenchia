- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Numbers and Currency'
  body: When it comes to large numbers, the grammar is identical in both Québec and France. However, there
    are some cultural and stylistic nuances regarding how we talk about money and dates. In both Québec
    and France, the currency sign follows the amount (e.g., 50 $ in Québec, 50 € in France). Additionally,
    while the word 'milliard' is used in both regions, it is important to note the difference between
    'milliard' and 'billion'. In French, un milliard = 1 000 000 000 (the English 'billion'), while un
    billion = 1 000 000 000 000 (a million de millions), which is not used for one thousand million. For
    the most part, the rules for *million* and *milliard* are universal across the Francophonie.
  variants: []
