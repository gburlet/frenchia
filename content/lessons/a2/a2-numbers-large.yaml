sections:
- type: explanation
  id: explanation
  heading: Mastering Large Numbers in French
  body: Moving beyond 100, French numbers follow a logical structure, but there are a few specific rules
    regarding punctuation and grouping that differ from English.  In French, we use a space as the thousands
    separator, rather than a comma. For example, 1 500 is written as **1 500**. In French the comma marks
    decimals (1,5 = 1.5; 1,8 million = 1.8 million). When dealing with millions and billions, the words
    *million* and *milliard* are nouns, which means they must be pluralized if they are greater than one.
     **Examples:**  - **Deux millions d'habitants** (Two million inhabitants)  - **Cinq milliards de dollars**
    (Five billion dollars)  **Key Differences and Pitfalls:**  1. **The 'Milliard' vs. 'Billion' Trap:**
    This is a common mistake for English speakers. In English, a 'billion' is a thousand million. In French,
    **un milliard** is the word for a thousand million (1,000,000,000). The word **un billion** refers
    to a million million (1,000,000,000,000), which is not used to mean one thousand million.  2. **The
    'De' Rule:** When you have a number followed by a noun (like *dollars* or *personnes*), you must use
    the preposition *de* after the words *million* and *milliard*.  - **Trois millions de personnes**
    (Three million people)  - **Dix milliards d'euros** (Ten billion euros)  3. **Prices:** In Québec,
    when stating a price, we often say **ça coûte** (it costs) or **c'est** (it is).  - **Le souper coûte
    cinquante dollars.** (Supper costs fifty dollars.)
