  title: Le projet de rénovation
  passage_fr: "Ma sœur et moi avons un grand projet pour notre maison à Québec. Nous voulons rénover la\
    \ cuisine et le salon. Le budget total pour les travaux est de 150 000 $. C'est une grosse dépense,\
    \ mais nous avons trouvé une promotion intéressante dans un magasin de construction. Nous avons obtenu\
    \ un rabais de 2 000 $ sur les matériaux. \n\nLe prix des meubles est aussi important. J'ai vu un\
    \ beau divan pendant les soldes, il coûte seulement 800 $ au lieu de 1 200 $. Ma sœur regarde aussi\
    \ les prix des appareils électroménagers. Elle veut acheter un frigo moderne. Pour financer tout cela,\
    \ nous avons ouvert un compte en banque spécial. Le taux d'intérêt est très bas, ce qui est parfait\
    \ pour notre projet. Nous espérons finir les travaux avant la fin de l'année."
  translation_en: |-
    My sister and I have a big project for our house in Quebec City. We want to renovate the kitchen and the living room. The total budget for the work is $150,000. It is a big expense, but we found an interesting promotion in a construction store. We obtained a discount of $2,000 on the materials.

    The price of the furniture is also important. I saw a beautiful sofa during the sale; it costs only $800 instead of $1,200. My sister is also looking at the prices of household appliances. She wants to buy a modern fridge. To finance all of this, we opened a special bank account. The interest rate is very low, which is perfect for our project. We hope to finish the work before the end of the year.
