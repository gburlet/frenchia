- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Demonstrative Adjectives'
  body: "In terms of grammar, the use of demonstrative adjectives (*ce, cet, cette, ces*) is identical\
    \ in both Québec and France. They follow the same rules of gender and number agreement. However, in\
    \ spoken Québec French, it is very common to add the particle « -là » after the noun to emphasize\
    \ distance or to point something out more specifically. While this is common in casual speech, it\
    \ is less frequent in formal writing. \n\nNote that while the grammar is the same, the nouns you point\
    \ to will often differ between the two regions. For example, when pointing at a vehicle, a Québécois\
    \ would use the word *char*, whereas someone in France would use *voiture*."
