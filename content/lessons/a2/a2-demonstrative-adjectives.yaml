- type: reading
  id: reading
  title: Une visite en ville
  passage_fr: |-
    C’est la fin de semaine et je suis en ville avec mon ami. Nous marchons dans le centre-ville pour **magasiner**. Regarde ce magasin ! Il est magnifique et il y a beaucoup de vêtements originaux. Juste à côté, cet appartement est très moderne avec de grandes fenêtres.

    Nous avons faim, alors nous entrons dans une boulangerie pour prendre un café. Le café est excellent et les croissants sont délicieux. Après le **déjeuner**, nous voyons un homme près du parc. Cet homme est un artiste ; il peint un tableau sur le **trottoir**.

    Plus tard, nous aperçons un **char** bleu garé devant un petit **magasin d’alimentation**. C’est le char de mon cousin. Nous décidons de mettre ces chaussures confortables pour marcher plus longtemps avant de rentrer à la maison.
  translation_en: |-
    It is the weekend and I am in town with my friend. We are walking downtown to **shop**. Look at this store! It is magnificent and there are many original clothes. Right next to it, this apartment is very modern with large windows.

    We are hungry, so we enter a bakery to have a coffee. The coffee is excellent and the croissants are delicious. After **breakfast**, we see a man near the park. This man is an artist; he is painting a picture on the **sidewalk**.

    Later, we notice a **blue car** parked in front of a small **grocery store**. It is my cousin’s car. We decide to put on these comfortable shoes to walk longer before going home.
