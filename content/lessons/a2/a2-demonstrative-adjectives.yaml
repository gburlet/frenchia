sections:
- type: explanation
  id: explanation
  heading: Les adjectifs démonstratifs
  body: |-
    In French, demonstrative adjectives are used to point out specific people or objects, similar to the English words 'this,' 'that,' and 'these.' While English uses different words for both 'this' and 'that,' French uses the same set of adjectives based on the gender and number of the noun.

    Here is how they are formed:

    1. **Ce** (Masculine singular): Used before a masculine noun starting with a consonant.
       - **Ce char est rouge.** (This car is red.)

    2. **Cet** (Masculine singular): Used before a masculine noun starting with a vowel or a silent 'h.' This is used to avoid a clashing sound.
       - **Cet homme est gentil.** (This man is kind.)

    3. **Cette** (Feminine singular): Used before all feminine nouns.
       - **Cette maison est grande.** (This house is big.)

    4. **Ces** (Plural): Used for both masculine and feminine plural nouns.
       - **Ces fleurs sont belles.** (These flowers are beautiful.)

    **Common Pitfalls for English Speakers:**

    - **Forgetting 'Cet':** English speakers often try to use *ce* for everything masculine. Remember that if the next word starts with a vowel (like *ami* or *ordinateur*), you must switch to *cet*.
    - **Gender Agreement:** Unlike English, you must identify the gender of the noun before choosing the adjective. For example, even if a word feels masculine in English, if it is feminine in French, you must use *cette*.

    **Québec Note:** In spoken Québec French, you will often hear the particle **-là** added to the end of a noun to emphasize 'that' or 'this' (e.g., *ce char-là*). This is considered familiar usage. In formal writing, stick to the standard demonstrative adjectives.
