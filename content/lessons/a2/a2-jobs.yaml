- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Talking about jobs'
  body: "In everyday Québec French the feminine forms *professeure, ingénieure, autrice* are the norm\
    \ and are taught in schools. In France the masculine *professeur, ingénieur, auteur* is still the\
    \ default when the gender is not specified, and the feminine forms are sometimes seen as newer or\
    \ “politically correct”. Québec also uses the familiar noun *une job* for a temporary or part‑time\
    \ position; in France people would say *un emploi* or *un petit boulot*.\n\n**Typical variants**\n\
    1. professeure (QC) / professeur (FR) – teacher\n2. ingénieure (QC) / ingénieur (FR) – engineer\n\
    3. autrice (QC) / auteur (FR) – author\n4. une job (fam., QC) / un emploi, un petit boulot (FR) –\
    \ a job\n5. caissière (QC & FR) – cashier (both use the feminine form)\n6. travailleur social / travailleuse\
    \ sociale (QC & FR) – social worker (gender‑aware in both regions)   \nThe rest of the vocabulary\
    \ (policier/policière, serveur/serveuse, etc.) is identical in Québec and France."
