- type: explanation
  id: explanation
  heading: Les métiers et les professions – Vocabulary (A2)
  body: |-
    **What you’ll learn** – In this short unit you’ll be able to name common jobs, talk about where people work, and use the feminine forms that are especially common in Québec.  The only grammar you need to remember is the article‑noun agreement; the rest is pure vocabulary.

    ### 1. The basic pattern
    In French a job title is a **noun** that normally follows the article **un / une** (or **le / la** when you speak about the profession in general).  The gender of the noun matches the gender of the person you are describing.

    - **un médecin** – a (male) doctor
    - **une infirmière** – a (female) nurse
    - **un ingénieur** – a (male) engineer
    - **une ingénieure** – a (female) engineer (Québec usage; in France you’ll more often see *un ingénieur* for both genders)
    - **une professeure** – a (female) teacher (Québec; in France *une professeure* is also accepted, but *un professeur* is the default masculine form)
    - **une autrice** – a (female) author (more common in Québec; *un auteur* is the generic masculine)

    When you want to say “She works as a …” you simply place the article before the title:

    - **Elle travaille comme **une professeure** au cégep.**
    - **Elle est **une ingénieure** chez Hydro‑Québec.**

    ### 2. The familiar word *une job*
    In everyday Québec speech you’ll hear the Anglicism **une job** (familiar) meaning “a job, a position”.  It behaves like any feminine noun:

    - **J’ai trouvé **une job** au dépanneur.** (I found a job at the convenience store.)
    - **C’est une bonne **job** pour commencer.**

    *Tip*: In formal writing you should still use **un emploi** or **un poste**; reserve *une job* for conversation with friends.

    ### 3. Common pitfalls
    1. **Forgetting the feminine ending** – Many learners keep the masculine form when they know the person is female (e.g., *une ingénieur*).  In Québec the feminine ending **‑eure / ‑euse / ‑rice** is standard, so add it.
    2. **Mixing up *déjeuner* and *dîner*** – When you talk about a workplace you might say *le déjeuner* (breakfast) and *le dîner* (lunch).  Québec calls the midday meal **dîner** and the evening meal **souper**; keep that in mind when you describe a work‑day schedule.

    Now you have a handy list of job titles and the rule to match them to the person’s gender.  Practice by describing the people you see around you – *un policier*, *une policière*, *une serveuse* at the café, *un chef* in the restaurant, etc.  Soon it will feel as natural as saying *I’m a teacher* in English!
