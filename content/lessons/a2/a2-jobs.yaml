- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Talking about jobs'
  body: |-
    In everyday Québec French the feminine forms *professeure, ingénieure, auteure* (autrice is also used) are the norm and are taught in schools. In France the masculine *professeur, ingénieur, auteur* is still the default when the gender is not specified, and the feminine forms are sometimes seen as newer or “politically correct”. Québec also uses the familiar noun *une job* for any job (temporary, part-time or permanent); in France people would say *un emploi* or, in informal speech, *un petit boulot*.

    **Typical variants**
    1. professeure (QC) / professeur (FR) – teacher
    2. ingénieure (QC) / ingénieur (FR) – engineer
    3. auteure (QC) / auteur (FR) – author (autrice is an alternative used in both regions)
    4. une job (fam., QC) / un emploi, un petit boulot (FR) – a job
  variants:
  - qc: une job
    fr: un emploi / un petit boulot
    en: a job
    formality: standard
