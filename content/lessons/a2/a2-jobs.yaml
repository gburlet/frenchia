- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Talking about jobs'
  body: In everyday Québec French the feminine forms *professeure, ingénieure, auteure* (autrice is also
    used) are the norm and are taught in schools. In France the masculine *professeur, ingénieur, auteur*
    is still the default when the gender is not specified, and the feminine forms are sometimes seen as
    newer or “politically correct”. Québec also uses the familiar noun *une job* for a temporary or part-time
    position; in France people would say *un emploi* or *un petit boulot*.<br><br>**Typical variants**<br>1. professeure
    (QC) / professeur (FR) – teacher<br>2. ingénieure (QC) / ingénieur (FR) – engineer<br>3. auteure (QC) / auteur
    (FR) – author (autrice is an alternative used in both regions)<br>4. une job (fam., QC) / un emploi,
    un petit boulot (FR) – a job<br>5. caissière (QC & FR) – cashier (both use the feminine form)<br>6. travailleur
    social / travailleuse sociale (QC & FR) – social worker (gender-aware in both regions)   <br>The rest
    of the vocabulary (policier/policière, serveur/serveuse, etc.) is identical in Québec and France.
