    example_fr: L’auteure relit son manuscrit avant de l’envoyer à l’éditeur.
    example_en: The author rereads her manuscript before sending it to the publisher.
  - fr: patrouiller
    en: to patrol
    pos: verb
    region: fr
    formality: standard
    example_fr: Le policier patrouillait le long de la rue principale.
    example_en: The police officer was patrolling along the main street.
