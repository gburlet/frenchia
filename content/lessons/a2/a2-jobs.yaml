  title: Une journée au magasin du coin
  passage_fr: À l'heure du dîner, je suis allé(e) à l'épicerie du quartier pour acheter du pain et du
    lait. En entrant, j’ai vu **la caissière** qui souriait déjà. Elle m’a demandé si je voulais un sac
    en papier ; j’ai répondu que non, j’ai mon sac réutilisable. Derrière le comptoir, **le barista**
    du petit café du même bâtiment préparait des cafés pour les clients pressés. **L’infirmière** qui
    travaille au centre de santé à côté est venue prendre son **dîner**. Elle a commandé un sandwich au
    jambon et une soupe du jour. **L’auteure** du roman que je **lisais** hier était assise à une table,
    en train de corriger son manuscrit. Elle m’a raconté qu’elle écrit surtout des histoires se déroulant
    **dans les petites villes du Canada**. Après avoir payé, je suis sorti(e) et j’ai salué **le policier**
    qui patrouillait près du parc. C’était une **journée très typique** de la vie dans notre communauté.
  translation_en: At lunchtime, I went to the neighbourhood grocery store to buy bread and milk. As I
    entered, I saw the cashier already smiling. She asked me if I wanted a paper bag; I said no, I have
    my reusable bag. Behind the counter, the barista of the little café in the same building was preparing
    coffees for the hurried customers. The nurse who works at the health centre next door came to have
    her lunch. She ordered a ham sandwich and the soup of the day. The author of the novel I was reading
    yesterday was sitting at a table, correcting her manuscript. She told me that she mostly writes stories
    set in the small towns of Canada. After paying, I went out and greeted the police officer who was
    patrolling near the park. It was a very typical day in our community life.
