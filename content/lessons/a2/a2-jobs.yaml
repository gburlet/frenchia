sections:
- type: explanation
  id: explanation
  heading: Les métiers et les professions – Vocabulary (A2)
  body: '**What you’ll learn** – In this short unit you’ll be able to name common jobs, talk about where
    people work, and use the feminine forms that are especially common in Québec. The only grammar you
    need to remember is the article-noun agreement; the rest is pure vocabulary.<br><br>### 1. The basic
    pattern<br>In French a job title is a **noun** that normally follows the article **un / une** (or
    **le / la** when you speak about the profession in general). The gender of the noun matches the gender
    of the person you are describing.<br><br>- **un médecin** – a (male) doctor<br>- **une infirmière**
    – a (female) nurse<br>- **un ingénieur** – a (male) engineer<br>- **une ingénieure** – a (female)
    engineer (Québec usage; in France you’ll more often see *un ingénieur* for both genders)<br>- **une
    professeure** – a (female) teacher (Québec; in France *une professeure* is also accepted, but *un
    professeur* is the default masculine form)<br>- **une auteure** – a (female) author (Québec usage;
    *autrice* is an alternative form)<br><br>When you want to say “She works as a …” you simply place
    the title after **comme** or use **être** without an article:<br><br>- **Elle travaille comme professeure
    au cégep.**<br>- **Elle est ingénieure chez Hydro-Québec.**<br><br>### 2. The familiar word *une job*<br>In
    everyday Québec speech you’ll hear the Anglicism **une job** (familiar) meaning “a job, a position”.
    It behaves like any feminine noun:<br><br>- **J’ai trouvé une job au dépanneur.** (I found a job at
    the convenience store.)<br>- **C’est une bonne job pour commencer.**<br><br>*Tip*: In formal writing
    you should still use **un emploi** or **un poste**; reserve *une job* for conversation with friends.<br><br>###
    3. Common pitfalls<br>1. **Forgetting the feminine ending** – Many learners keep the masculine form
    when they know the person is female (e.g., *une ingénieur*). In Québec the feminine endings **-eure
    / -euse / -rice** are standard, so add them.<br>2. **Mixing up *déjeuner* and *dîner*** – When you
    talk about a workplace you might say *le déjeuner* (breakfast) and *le dîner* (lunch). Québec calls
    the midday meal **dîner** and the evening meal **souper**; keep that in mind when you describe a work-day
    schedule.<br><br>Now you have a handy list of job titles and the rule to match them to the person’s
    gender. Practice by describing the people you see around you – *un policier*, *une policière*, *une
    serveuse* at the café, *un chef* in the restaurant, etc. Soon it will feel as natural as saying *I’m
    a teacher* in English!'
