- type: explanation
  id: explanation
  heading: Les métiers et les professions – Vocabulary (A2)
  body: |-
    **What you’ll learn** – In this short unit you’ll be able to name common jobs, talk about where people work, and use the feminine forms that are especially common in Québec. The only grammar you need to remember is the article-noun agreement; the rest is pure vocabulary.

    ### 1. The basic pattern
    In French a job title is a **noun** that normally follows the article **un / une** (or **le / la** when you speak about the profession in general). The gender of the noun matches the gender of the person you are describing.

    - **un médecin** – a (male) doctor
    - **une infirmière** – a (female) nurse
    - **un ingénieur** – a (male) engineer
    - **une ingénieure** – a (female) engineer (Québec usage; in France you’ll more often see *un ingénieur* for both genders)
    - **une professeure** – a (female) teacher (Québec; in France *une professeure* is also accepted, but *un professeur* is the default masculine form)
    - **une auteure** – a (female) author (Québec usage; *autrice* is an alternative form)

    When you want to say “She works as a …” you simply place the title after **comme** or use **être** without an article:

    - **Elle travaille comme professeure au cégep.**
    - **Elle est ingénieure chez Hydro-Québec.**

    ### 2. The familiar word *une job*
    In everyday Québec speech you’ll hear the Anglicism **une job** (familiar) meaning “a job, a position”. It behaves like any feminine noun.

    - **J’ai trouvé une job à la bibliothèque municipale.** (I found a job at the municipal library.)
    - **C’est une bonne job pour développer mes compétences.** (It’s a good job to develop my skills.)

    *Tip*: In formal writing you should still use **un emploi** or **un poste**; reserve *une job* for conversation with friends.

    ### 3. Common pitfalls
    1. **Forgetting the feminine ending** – Many learners keep the masculine form when they know the person is female (e.g., *une ingénieur*). In Québec the feminine endings **-eure / -euse / -rice** are standard, so add them.
    2. **Gender of job titles** – Most job titles keep the same form for both genders (e.g., *un/une journaliste*, *un/une secrétaire*). Some nouns change their ending when the person is female (e.g., *un ingénieur* → *une ingénieure*, *un acteur* → *une actrice*, *un serveur* → *une serveuse*). Québec also uses *une médecin* as the regular feminine form of *médecin*; *docteure* is a title rather than a regular noun.

    Now you have a handy list of job titles and the rule to match them to the person’s gender. Practice by describing the people you see around you – *un policier*, *une policière*, *une serveuse* au café, *un chef* dans le restaurant, *une assistante* au bureau, etc. Soon it will feel as natural as saying *I’m a teacher* in English!
