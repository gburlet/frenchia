sections:
- type: explanation
  id: explanation
  heading: 'L''imparfait : Setting the Scene'
  body: 'Now that you can describe specific actions that happened in the past using the *passé composé*,
    it is time to learn the **imparfait**. While the *passé composé* is like a snapshot of a completed
    action, the *imparfait* is like the scenery in a movie. It describes ongoing actions, habits, and
    background information.  ### How to Form the Imparfait  To conjugate most verbs in the *imparfait*,
    you take the **nous** form of the present tense, drop the *-ons* ending, and add the following endings:  -
    Je: **-ais**  - Tu: **-ais**  - Il/Elle/On: **-ait**  - Nous: **-ions**  - Vous: **-iez**  - Ils/Elles:
    **-aient**  *Example:* For **parler** (nous parlons), the stem is *parl-*.   - **Je parlais** (I was
    speaking / I used to speak)  - **Nous parlions** (We were speaking / We used to speak)  *Note:* The
    verb **être** is irregular. Its stem is **ét-** (e.g., **J''étais**, **Tu étais**).  ### When to Use
    It  1. **Habits:** Actions that happened repeatedly.   *Example:* **Quand j''étais jeune, je mangeais
    souvent des bleuets.** (When I was young, I often ate blueberries.)  2. **Descriptions:** Weather,
    time, feelings, or physical descriptions.   *Example:* **Il faisait beau et il faisait chaud.** (The
    weather was beautiful and it was hot.)  3. **Ongoing Actions:** Actions that were in progress when
    something else happened.   *Example:* **Je regardais la télé quand le téléphone a sonné.** (I was
    watching TV when the phone rang.)  ### Common Pitfalls  English speakers often struggle with the choice
    between *passé composé* and *imparfait*. A good rule of thumb: if you can translate it as “was/were
    [verb]-ing” or “used to,” use the *imparfait*. If it is a completed action with a clear beginning
    and end (I ate, I went, I bought), use the *passé composé*.  In French, the *imparfait* is commonly
    used to describe your childhood or your old neighbourhood. For example: **Ma maison était près d''une
    école** (or **d''un parc**).'
