sections:
- type: explanation
  id: explanation
  heading: 'L''imparfait : Setting the Scene'
  body: "Now that you can describe specific actions that happened in the past using the *passé composé*,\
    \ it is time to learn the **imparfait**. While the *passé composé* is like a snapshot of a completed\
    \ action, the *imparfait* is like the scenery in a movie. It describes ongoing actions, habits, and\
    \ background information.\n\n### How to Form the Imparfait\nTo conjugate most verbs in the *imparfait*,\
    \ you take the **nous** form of the present tense, drop the *-ons* ending, and add the following endings:\n\
    - Je: **-ais**\n- Tu: **-ais**\n- Il/Elle/On: **-ait**\n- Nous: **-ions**\n- Vous: **-iez**\n- Ils/Elles:\
    \ **-aient**\n\n*Example:* For **parler** (nous parlons), the stem is *parl-*. \n- **Je parlais**\
    \ (I was speaking / I used to speak)\n- **Nous parlions** (We were speaking / We used to speak)\n\n\
    *Note:* The verb **être** is irregular. Its stem is **ét-** (e.g., **J'étais**, **Tu étais**).\n\n\
    ### When to Use It\n1. **Habits:** Actions that happened repeatedly. \n*Example:* **Quand j'étais\
    \ jeune, je mangeais souvent des bleuets.** (When I was young, I often ate blueberries.)\n2. **Descriptions:**\
    \ Weather, time, feelings, or physical descriptions. \n*Example:* **Il faisait beau et il faisait\
    \ chaud.** (The weather was beautiful and it was hot.)\n3. **Ongoing Actions:** Actions that were\
    \ in progress when something else happened. \n*Example:* **Je regardais la télé quand le téléphone\
    \ a sonné.** (I was watching TV when the phone rang.)\n\n### Common Pitfalls\nEnglish speakers often\
    \ struggle with the choice between *passé composé* and *imparfait*. A good rule of thumb: if you can\
    \ translate it as \"was/were [verb]-ing\" or \"used to,\" use the *imparfait*. If it is a completed\
    \ action with a clear beginning and end (I ate, I went, I bought), use the *passé composé*.\n\nIn\
    \ French, the *imparfait* is commonly used to describe your childhood or your old neighborhood. For\
    \ example: **Ma maison était près d'un dépanneur.** (My house was near a convenience store.)"
