- type: reading
  id: reading
  title: Mes souvenirs d'hiver
  passage_fr: "Quand j'étais enfant, j'habitais dans une petite maison à Québec. Pendant l'hiver, il neigeait\
    \ presque tous les jours. C'était magnifique ! Chaque matin, je prenais mon déjeuner dans la cuisine\
    \ pendant que mon père lisait le journal. Ma mère préparait souvent des crêpes pour nous. \n\nLe samedi,\
    \ nous allions souvent au parc avec mes cousins. Il faisait très froid, mais nous portions des mitaines\
    \ et des tuques épaisses. Nous jouions dans la neige pendant des heures. Après avoir joué, nous revenions\
    \ à la maison pour boire du chocolat chaud. Je me souvenais toujours de ces moments simples. C'était\
    \ une époque très heureuse et je n'avais aucune préoccupation. Aujourd'hui, je travaille beaucoup,\
    \ mais je pense souvent à ces fins de semaine."
  translation_en: |-
    When I was a child, I lived in a small house in Quebec City. During the winter, it snowed almost every day. It was magnificent! Every morning, I had my breakfast in the kitchen while my father read the newspaper. My mother often prepared pancakes for us.

    On Saturdays, we often went to the park with my cousins. It was very cold, but we wore mittens and thick tuques. We played in the snow for hours. After playing, we came back home to drink hot chocolate. I always remembered those simple moments. It was a very happy time and I had no worries. Today, I work a lot, but I often think about those weekends.
