  type: multiple_choice
  question: Which sentence correctly uses the imparfait to describe a past habit?
  options:
  - Chaque samedi, nous avons mangé au restaurant.
  - Chaque samedi, nous mangions au restaurant.
  - Chaque samedi, nous mangeons au restaurant.
  - Chaque samedi, nous avons mangé.
  answer_index: 1
  explanation: The correct answer is **nous mangions**. In French, the *imparfait* is the specific tense
    used to describe ongoing habits or repeated actions in the past.  - The first option (Chaque samedi,
    nous avons mangé au restaurant) uses the *passé composé*. While grammatically possible, it describes
    a series of completed, individual events rather than a continuous habit. - The third option (Chaque
    samedi, nous mangeons au restaurant) is the present tense. - The fourth option (Chaque samedi, nous
    avons mangé) is also the *passé composé*, which does not convey the sense of a habitual routine like
    the *imparfait* does.
