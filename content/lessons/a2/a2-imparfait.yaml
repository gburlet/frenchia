- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the Imparfait'
  body: In terms of grammar, the *imparfait* is used almost identically in both Québec and France. It
    remains the primary tense for setting the scene, describing weather, and expressing habits or states
    of being in the past. You won't find major grammatical shifts here! However, because the *imparfait*
    is often used to describe daily life and routines, the specific vocabulary you choose to describe
    those scenes will reflect local culture. For example, a Québécois person would talk about their « fin
    de semaine » and say they « magasinaient », whereas a speaker from France would say « week-end » and
    « faire du shopping ». The grammar stays the same; the scenery changes.
  variants: []
- type: reading
  id: reading
  title: Mes souvenirs d'hiver
  passage_fr: |-
    Quand j'étais enfant, j'habitais dans une petite maison à Québec. Pendant l'hiver, il neigeait presque tous les jours. C'était magnifique ! Chaque matin, je prenais mon déjeuner dans la cuisine pendant que mon père lisait le journal. Ma mère préparait souvent des crêpes pour nous.

    Le samedi, nous allions au parc avec mes cousins. Il faisait très froid, mais nous portions des mitaines et des tuques épaisses. Nous faisions des bonhommes de neige, nous glissions sur la glissade et nous jouions à la balle pendant des heures. Après avoir joué, nous rentrions à la maison pour boire du chocolat chaud. Je me souviens toujours de ces moments simples. C'était une époque très heureuse et je n'avais aucune préoccupation. Aujourd'hui, je travaille beaucoup, mais je pense souvent à ces fins de semaine.
  translation_en: |-
    When I was a child, I lived in a small house in Quebec City. During the winter, it snowed almost every day. It was magnificent! Every morning, I had my breakfast in the kitchen while my father read the newspaper. My mother often prepared pancakes for us.

    On Saturdays, we went to the park with my cousins. It was very cold, but we wore mittens and thick tuques. We built snowmen, slid down the hill and played ball for hours. After playing, we went back home to drink hot chocolate. I always remember those simple moments. It was a very happy time and I had no worries. Today, I work a lot, but I often think about those weekends.
