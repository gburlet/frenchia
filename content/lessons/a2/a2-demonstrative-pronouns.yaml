- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: demonstrative pronouns'
  body: Demonstrative pronouns work the same way in Québec French and in France. The forms *-ci* (near)
    and *-là* (far) are used to distinguish “this one” from “that one”. In both varieties the pronoun
    must be followed by one of these suffixes (or by a relative clause, *qui/que/dont*, or by *de* + noun).
    The suffixes are not informal; they are part of standard French. The grammar, gender agreement and
    usage are identical in the two varieties.
  variants: []
- type: reading
  id: reading
  title: 'Une après-midi au parc : le choix des jeux'
  passage_fr: 'Samedi, ma sœur et moi sommes allés dans un parc de la ville. Il y avait deux terrains
    de jeu : **celui-ci** était plein de toboggans et **celui-là** avait un grand bac à sable. Nous avons
    d’abord essayé **celui-ci**, parce que les toboggans étaient très rapides. Après, ma petite sœur a
    préféré **celui-là** ; elle a construit un château avec du sable et des seaux. Au même moment, nos
    amis sont arrivés avec leurs ballons. **Ceux-ci** étaient gonflés à l’hélium, **ceux-là** étaient
    remplis d’air. Nous avons lancé **ceux-là** dans le ciel et les avons attrapés avant qu’ils retombent.
    Vers la fin de la journée, nous avons tous mangé un sandwich au jambon que nous avions préparé à la
    maison, puis nous sommes rentrés, fatigués mais contents.'
  translation_en: 'Saturday, my sister and I went to a city park. There were two playground areas: **this
    one** was full of slides and **that one** had a big sand pit. We first tried **this one** because
    the slides were very fast. Afterwards, my little sister preferred **that one**; she built a castle
    with sand and buckets. At the same time, our friends arrived with their balloons. **These** were filled
    with helium, **those** were filled with air. We threw **those** into the sky and caught them before
    they fell back down. Near the end of the day, we all ate a ham sandwich that we had prepared at home,
    then we went back, tired but happy.'
