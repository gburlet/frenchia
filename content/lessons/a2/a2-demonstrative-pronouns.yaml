  title: 'Une après‑midi au parc : le choix des jeux'
  passage_fr: 'Samedi, ma sœur et moi sommes allés au parc du Vieux‑Québec. Il y avait deux terrains de
    jeu : **celui‑ci** était plein de toboggans et **celui‑là** avait un grand bac à sable. Nous avons
    d’abord essayé **celui‑ci**, parce que les toboggans étaient très rapides. Après, ma petite sœur a
    préféré **celui‑là**; elle a construit un château avec du sable et des seaux. Au même moment, nos
    amis sont arrivés avec leurs ballons. **Ceux‑ci** étaient gonflés à l’hélium, **ceux‑là** étaient
    remplis d’air. Nous avons lancé **ceux‑ci** dans le ciel et les avons attrapés avant qu’ils retombent.
    Vers la fin de la fin de semaine, nous avons tous mangé un sandwich au jambon au dépanneur du coin,
    puis nous sommes rentrés à la maison, fatigués mais contents.'
  translation_en: 'Saturday, my sister and I went to the Vieux‑Québec park. There were two playground
    areas: **this one** was full of slides and **that one** had a big sand pit. We first tried **this
    one** because the slides were very fast. Afterwards, my little sister preferred **that one**; she
    built a castle with sand and buckets. At the same time, our friends arrived with their balloons. **These
    ones** were filled with helium, **those ones** were filled with air. We launched **these** into the
    sky and caught them before they fell back down. Near the end of the weekend, we all ate a ham sandwich
    from the corner dépanneur, then we went home, tired but happy.'
