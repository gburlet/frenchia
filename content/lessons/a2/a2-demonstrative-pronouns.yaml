sections:
- type: explanation
  id: explanation
  heading: Les pronoms démonstratifs – A2
  body: "***\n### What they are\nA demonstrative pronoun replaces a noun that has already been mentioned,\
    \ pointing to **which one** you’re talking about. In Québec French the set is the same as in France,\
    \ but you’ll hear the informal suffixes *‑ci* (close) and *‑là* (far) a lot, especially in spoken\
    \ language.\n\n### Forms\n| Masculine singular | Feminine singular | Masculine plural | Feminine plural\
    \ |\n|-------------------|-------------------|------------------|-----------------|\n| **celui** (+ ‑ci/‑là)\
    \ | **celle** (+ ‑ci/‑là) | **ceux** (+ ‑ci/‑là) | **celles** (+ ‑ci/‑là) |\n\nAdd **‑ci** for something\
    \ near the speaker, **‑là** for something farther away or already mentioned earlier.\n\n### Basic\
    \ patterns\n1. **Celui‑ci** / **celui‑là** – *That one (masc.)*  \n   *Ex.* **Celui‑ci** est mon nouveau\
    \ vélo. *(This one is my new bike.)*\n2. **Celle‑ci** / **celle‑là** – *That one (fem.)*  \n   *Ex.*\
    \ **Celle‑là** est la robe que j’ai achetée au dépanneur. *(That one is the dress I bought at the\
    \ corner store.)*\n3. **Ceux‑ci** / **ceux‑là** – *Those (masc. pl.)*  \n   *Ex.* **Ceux‑là** sont\
    \ mes amis de la fin de semaine. *(Those are my weekend friends.)*\n4. **Celles‑ci** / **celles‑là**\
    \ – *Those (fem. pl.)*  \n   *Ex.* **Celles‑ci** sont les soupes que ma mère prépare. *(These are\
    \ the soups my mother makes.)*\n\n### With **qui** and **de**\nWhen the pronoun is the subject of\
    \ a relative clause, use **qui**:\n- **Celui‑qui** vient d’arriver est mon cousin. *(The one who just\
    \ arrived is my cousin.)*\nWhen it replaces a complement introduced by *de*, use **de qui / de quoi**:\n\
    - J’ai besoin **de celle‑dont** tu parles. *(I need the one you’re talking about.)*  *(Note: *dont*\
    \ replaces *de qui* or *de quoi* when the verb requires *de*.)*\n\n### Common pitfalls for English\
    \ speakers\n1. **Confusing *celui‑ci* with *celui‑là* for “this/that.”** In English *this* is always\
    \ near, *that* far; in French the choice is about the speaker’s perspective, not strictly about time.\
    \ You can say **celui‑ci** for something you’re holding and **celui‑là** for something you just mentioned.\n\
    2. **Forgetting agreement in gender and number.** English pronouns don’t change, but French does.\
    \ Always match the pronoun to the noun it replaces (e.g., *la voiture* → **celle‑ci**, not *celui‑ci*).\n\
    \n### Quick practice\n- Point to two books and say: **Ceux‑ci** sont mes livres de français.  \n-\
    \ Referring to a bag you left at the café: **Celle‑là** était dans le coin du comptoir.\n\nUse these\
    \ patterns whenever you’d say “this one/that one/these/those” in English, and you’ll sound natural\
    \ in Québec French.***"
