  type: multiple_choice
  question: Which demonstrative pronoun correctly completes the sentence? « J’ai deux vestes ; ___-ci
    est en cuir et ___-là est en laine. »
  options:
  - celle, celle
  - celui, celle
  - celle, celui
  - celui, celui
  answer_index: 0
  explanation: The noun *veste* is feminine. Each demonstrative pronoun refers to one single vest, so
    we need the **singular feminine** form. The singular feminine demonstrative pronoun is **celle**;
    when we add the suffixes we get *celle-ci* (this one) and *celle-là* (that one). The plural form would
    be *celles* (e.g., *celles-ci*), but it is not appropriate here because we are talking about each
    vest individually. Therefore the correct choice is **celle, celle**. The other options mix masculine
    (*celui*) with feminine or use the wrong gender altogether, which makes the sentence ungrammatical.
