sections:
- type: explanation
  id: explanation
  heading: Les pronoms démonstratifs – A2
  body: '***  ### What they are  A demonstrative pronoun replaces a noun that has already been mentioned,
    pointing to **which one** you’re talking about. In Québec French the set is the same as in France;
    the suffixes *-ci* (near) and *-là* (far) are used in both varieties, especially in spoken language.  ###
    Forms  | Masculine singular | Feminine singular | Masculine plural | Feminine plural | |-------------------|-------------------|------------------|-----------------|
    | **celui** (+ -ci/-là) | **celle** (+ -ci/-là) | **ceux** (+ -ci/-là) | **celles** (+ -ci/-là) |  Add
    **-ci** for something close to the speaker, **-là** for something farther away or already mentioned.  ###
    Basic patterns  1. **celui-ci** / **celui-là** – *this one / that one (masc.)*  *Ex.* **Celui-ci**
    est mon nouveau vélo. *(This one is my new bike.)*  2. **celle-ci** / **celle-là** – *this one / that
    one (fem.)*  *Ex.* **Celle-là** est la robe que j’ai achetée à la boutique. *(That one is the dress
    I bought at the shop.)*  3. **ceux-ci** / **ceux-là** – *these / those (masc. pl.)*  *Ex.* **Ceux-là**
    sont mes amis de la fin de semaine. *(Those are my weekend friends.)*  4. **celles-ci** / **celles-là**
    – *these / those (fem. pl.)*  *Ex.* **Celles-ci** sont les soupes que ma mère prépare. *(These are
    the soups my mother makes.)*  ### With **qui**, **que**, **dont**, **de**  The demonstrative pronoun
    can be followed by:  - **-ci / -là** (e.g., *celui-ci, celle-là*)  - a relative clause introduced
    by **qui**, **que**, **dont** (or **de qui** when the verb requires *de*)  - **de + noun** to express
    possession  **Examples**  - *Subject of a relative clause* → **qui**: *Celui qui vient d’arriver est
    mon cousin.* *(The one who just arrived is my cousin.)*  - *Object of a relative clause* → **que**:
    *Celui que j’ai vu hier était au magasin.* *(The one I saw yesterday was at the store.)*  - *Introduced
    by **de*** → **dont** (or **de qui** for people): *J’ai besoin de celle dont tu parles.* *(I need
    the one you’re talking about.)*  - *Possessive use* → **de + noun**: *Mon vélo est celui de Paul.*
    *(My bike is Paul’s.)*  **Note:** When you want to refer to “what” (as in “what you said”), you use
    **ce** (e.g., *ce dont tu parles*), not *celui*/*celle*.  ### Common pitfalls for English speakers  1.
    **ci vs. là** – *-ci* means “this/these” (near), *-là* means “that/those” (far). They are not “informal”;
    they are the normal way to form demonstrative pronouns.  2. **The pronoun cannot stand alone** – it
    must be followed by *-ci*/*-là*, a relative clause (qui, que, dont, de qui), **or** *de + noun* (e.g.,
    *celui de Paul*).  3. **Gender and number agreement** – match the pronoun to the noun it replaces
    (e.g., *la voiture* → **celle-ci**, not *celui-ci*).  ### Quick practice  - Point to two books and
    say: **Ceux-ci** sont mes livres de français.  - Referring to a bag you left at the café: **Celui-là**
    était dans le coin du comptoir.  Use these patterns whenever you would say “this one/that one/these/those”
    in English, and you’ll sound natural in Québec French.***'
