- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: demonstrative pronouns'
  body: |-
    In everyday Québec French the pair *‑ci / ‑là* is heard in almost every conversation – even in relatively formal contexts – because speakers love to point out exactly which object or person they mean. In France the same forms exist, but they are used a bit more sparingly; speakers often rely on the simple pronoun (*celui, celle, ceux, celles*) plus a relative clause instead. The pronunciation is also slightly different: Quebecers frequently reduce *celui‑ci* to *c’‑ci* or *c’‑là* in rapid speech, something you’ll rarely hear in France. Otherwise the grammar and gender agreement are identical.

    **Variants**
    1. *celui‑ci* = “this one” (Québec & France) – English “this one”.
    2. *celui‑là* = “that one” (Québec & France) – English “that one”.
    3. *celle‑ci / celle‑là* – same meanings, gender‑specific.
    4. *ceux‑ci / ceux‑là* – plural forms, identical in both varieties.
    5. Pronounced *c’‑ci / c’‑là* in casual Québec speech (France usually keeps the full form).
    6. In written Québec French you will still see the full *‑ci / ‑là* spelling; the shortened spoken form is only oral.

    Overall, the set of demonstrative pronouns is the same; the main difference is how frequently and how informally the *‑ci / ‑là* suffixes are used in Québec.
