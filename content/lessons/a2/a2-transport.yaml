- type: explanation
  id: explanation
  heading: Les moyens de transport – Prepositions with transport (A2)
  body: "**How to talk about getting around**\n\nIn French the preposition you use depends on whether\
    \ you are *inside* the vehicle or *using* it as a means of travel.\n\n| Situation | Preposition |\
    \ Example |\n|-----------|-------------|---------|\n| Inside a vehicle (you are a passenger) | **en**\
    \ (before nouns that are feminine or start with a vowel) **ou** **dans** (more informal) | **Je suis\
    \ en autobus** / **Je suis dans le métro** |\n| Using a vehicle as a means of travel (you drive or\
    \ ride it) | **à** (with most modes) **ou** **en** (with bicycles, scooters, etc.) | **Je vais à vélo**\
    \ – *I go by bike.*<br>**Je vais à char** – *I go by car.* |\n| Specific Québec terms | **en** for\
    \ *le char* (masc.) and *le traversier* (masc.) | **Je me déplace en char** – *I get around by car.*<br>**Nous\
    \ prenons le traversier en été** – *We take the ferry in summer.* |\n\n### Key points\n- **en + transport**\
    \ is used when you are *inside* the vehicle or when the vehicle is considered a generic means of travel\
    \ (en bus, en métro, en char, en vélo). \n- **à + transport** is used with *personal* means that you\
    \ operate yourself (à pied, à vélo, à char). In Québec, **à char** is the everyday way to say “by\
    \ car.”\n- When the noun begins with a vowel or a mute *h*, use **en** (en autobus, en hélicoptère).\
    \ \n- For *stationnement* (parking lot) you use the verb **stationner**: **Je stationne mon char au\
    \ stationnement du centre.**\n\n### Common pitfalls for English speakers\n1. **Confusing “en” and\
    \ “à”** – English speakers often say *« je vais à le bus »* (directly translating “by bus”). The correct\
    \ form is **en autobus** or **dans le bus**.\n2. **Forgetting gender agreement** – *le char* is masculine,\
    \ so you say **en char**, not *en la char*.\n\nPractice: \n- **Je vais au travail en autobus.** (I\
    \ go to work by bus.)\n- **Je stationne mon char près du dépanneur.** (I park my car near the convenience\
    \ store.)\n\nThese patterns will let you describe daily trips around Québec with confidence."
