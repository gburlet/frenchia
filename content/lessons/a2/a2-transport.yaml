- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: prepositions with means of transport'
  body: In Québec the same preposition rules (en/à + transport) apply as in France, but the nouns you
    pair with them often differ. The most common Québec terms are **char** (car), **autobus** (bus), **stationnement**
    (parking lot) and **traversier** (ferry). In France you would say *voiture*, *bus* and *parking*,
    and *ferry* for the same vessel. The preposition **en** is used before feminine or vowel‑initial nouns
    (en autobus, en tramway) and **à** before the vehicle you drive (à char, à voiture). Both varieties
    use **à pied** for walking and **en vélo** for cycling. The rest of the grammar – inside the vehicle
    = en/dans, using it as a means = à – is identical.
  variants:
  - qc: char
    fr: voiture
    en: car
    formality: standard
  - qc: stationnement
