sections:
- type: explanation
  id: explanation
  heading: Les moyens de transport – Prépositions avec les transports (A2)
  body: |-
    **How to talk about getting around** | In French the preposition you use depends on the type of transport, not on whether you are the driver or a passenger.  |   | Situation | Préposition(s) | Exemple |  |-----------|----------------|---------|  | Enclosed vehicle you **enter** (car, bus, train, métro, airplane, taxi, char, traversier) | **en** (generic) or **dans** when you want to stress that you are physically inside the vehicle (requires an article) | **Je suis en autobus.** – *I’m on the bus.*
    **Je suis dans le métro.** – *I’m in the subway.* |  | Open or straddled modes that you move on yourself (on foot, bike, motorcycle, horse) | **à** | **Je vais à pied.** – *I go on foot.*
    **Je vais à vélo.** – *I go by bike.*
    **Je vais à moto.** – *I go by motorcycle.*
    **Je vais à cheval.** – *I go on horseback.* |  | Specific Québec terms | **en** is also used with the familiar word **char** (masc.) and with **traversier** (masc.) when you travel on a ferry. | **Je me déplace en char.** – *I travel by car.*
    **Nous prenons le traversier en été.** – *We take the ferry in summer.* |  ### Key points  - **en + transport** is used for vehicles you sit inside of (en voiture, en char, en autobus, en train, en métro, en avion, en taxi, en traversier).  - **dans le/la + transport** can replace **en** when you want to emphasise that you are physically inside (e.g., *dans le bus*, *dans le train*).  - **à + transport** is used with open or straddled modes that you move on yourself (à pied, à vélo, à moto, à cheval).  - In Québec, a parking lot is called a **stationnement**; the verb **stationner** is used with it: **Je stationne mon auto (ou mon char) au stationnement du centre commercial.**  *(In France the usual verb is **garer**, e.g., « Je gare ma voiture au parking ».)*  ### Common pitfalls for English speakers  1. **Confusing “en” and “à”** – Learners often say *« je vais à le bus »* (a literal translation of “by bus”). The correct form is **en autobus** (or **dans le bus** if you want to stress being inside).  2. **Using the wrong preposition with personal modes** – The most usual forms are **à vélo**, **à moto**, **à pied**, **à cheval**. **En vélo** and **en moto** exist, especially in Québec, but they are less typical and can sound informal.  3. **Mixing up “char” and “voiture”** – Both take **en** (en char, en voiture). The only difference is register: *char* is familiar Québécois.  ### Practice  - **Je vais au travail en autobus.** – *I go to work by bus.*  - **Je stationne mon char au stationnement du centre-ville.** – *I park my car in the downtown parking lot.*  - **Nous marchons à pied jusqu’à la gare, puis nous prenons le métro pour rentrer chez nous.** – *We walk on foot to the train station, then we take the subway to go home.*
