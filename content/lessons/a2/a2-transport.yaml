- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: prepositions with means of transport'
  body: |-
    In Québec the same preposition rules ( **en** + vehicle you travel **inside**, **à** + vehicle you travel **on** or **by foot** ) apply as in France, but the nouns you pair with them are often the local terms. The most common Québec words are **char** (car) and **stationnement** (parking lot). In France you would say *voiture* and *parking*.

    **en** is used with enclosed vehicles that you get into: **en voiture, en char, en autobus, en train, en métro, en avion, en taxi**.
    **à** is used with open or ridden modes and with walking: **à pied, à vélo, à moto, à cheval**.
    When you want to stress that you are physically **inside** a vehicle, you can also use **dans** followed by the definite article (e.g., *dans le bus, dans le train*). Both varieties use the same prepositions; the only difference is the vocabulary (char vs. voiture, stationnement vs. parking).
  variants:
  - qc: char
    fr: voiture
    en: car
    formality: standard
  - qc: stationnement
    fr: parking
    en: parking lot
    formality: standard
- type: reading
  id: reading
  title: Une journée de déplacements à Québec
  passage_fr: Ce matin, je me lève tôt et je prends mon **char** pour aller au **stationnement** du centre-ville.
    J’y gare le véhicule, puis je marche **à pied** jusqu’à l’**arrêt de bus**. J’attends le **bus**,
    je monte **dans le bus** et je descends à la **gare routière**. De là, je prends le **train** qui
    part à 9 h 15 et qui me conduit à la **gare** de l’**aéroport**. À l’aéroport, je prends un **taxi**
    qui me dépose à mon rendez-vous en moins de dix minutes. Le soir, je rentre chez moi en **tramway**
    ; le **tramway** passe près du **marché** où je m’arrête parfois pour acheter des produits frais.
  translation_en: This morning I get up early and take my **car** to the downtown **parking lot**. I park
    the vehicle, then I walk **on foot** to the **bus stop**. I wait for the **bus**, get **on the bus**,
    and get off at the **bus station**. From there I take the **train** that leaves at 9:15 a.m. and brings
    me to the **airport station**. At the airport I take a **taxi** that drops me at my appointment in
    less than ten minutes. In the evening I go home by **tram**; the **tram** passes near the **market**
    where I sometimes stop to buy fresh produce.
