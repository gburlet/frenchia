  type: multiple_choice
  question: Which sentence correctly says that he goes to the bank by car?
  options:
  - Il se rend à la banque en voiture.
  - Il se rend à la banque sur la voiture.
  - Il se rend à la banque à voiture.
  answer_index: 0
  explanation: 'When you travel **by** a vehicle that you drive (voiture, camion, etc.), the preposition
    **en** is used: *en voiture*, *en camion*, *en autobus*, etc. The preposition **à** is reserved for
    open or straddled means of travel (*à pied*, *à vélo*, *à moto*, *à cheval*). *Sur* or *au* with *voiture*
    are not idiomatic for expressing the means of transport; they would refer to a physical location on
    the car. Therefore the only sentence that means ‘He goes to the bank by car’ is the first one, *Il
    se rend à la banque en voiture.*'
