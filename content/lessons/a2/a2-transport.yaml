  type: multiple_choice
  question: |-
    Which preposition correctly completes the sentence?

    _Je vais ___ métro pour aller au travail._
  options:
  - à
  - en
  - dans
  - sur
  answer_index: 1
  explanation: "When you talk about the means of transport you use, the preposition **en** is used with\
    \ vehicles you ride inside, such as **en métro**, **en autobus**, **en train**, **en avion**, etc.\
    \ Therefore the correct sentence is **Je vais en métro pour aller au travail**. \n\n**À** is used\
    \ with open or straddled modes (à pied, à vélo, à moto, à cheval) and is not idiomatic with the métro.\
    \ \n**Dans** can mean “inside” a vehicle, but it does not express the idea of taking the metro as\
    \ a means of travel. \n**Sur** is never used with transport nouns like métro.​"
- id: ex-07
  grammar_topics:
