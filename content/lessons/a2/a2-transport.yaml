    en: supper
    formality: standard
- type: reading
  id: reading
  title: Une journée de déplacements à Québec
  passage_fr: Ce matin, je me lève tôt et je prends mon **char** pour aller au **stationnement** du centre‑ville.
    J’y gare le véhicule et je marche **à pied** jusqu’à l’**autobus** qui me conduit à la **gare**. Le
    trajet dure vingt minutes; je suis **dans l’autobus** et je regarde les vitrines du **dépanneur**
    qui passent. À la **gare**, je prends le **train** qui part à 9 h 15. Le **train** arrive à l’**aéroport**
    où je prends un **taxi** pour me rendre à mon rendez‑vous. Le **taxi** me dépose **en** moins de dix
    minutes. Le soir, je rentre chez moi en **tramway**; le **tramway** passe près du **marché** où je
    fais souvent du **covoiturage** avec mes voisins pour le **souper** du dimanche.
  translation_en: This morning I get up early and take my **car** to the downtown **parking lot**. I park
    the vehicle and walk **on foot** to the **bus** that takes me to the **train station**. The ride lasts
    twenty minutes; I am **in the bus** and I watch the shop windows of the **convenience store** that
    pass by. At the **station**, I take the **train** that leaves at 9:15 a.m. The **train** arrives at
    the **airport** where I take a **taxi** to get to my appointment. The **taxi** drops me **in** less
    than ten minutes. In the evening I go home by **tram**; the **tram** passes near the **market** where
    I often **car‑pool** with my neighbours for Sunday **dinner**.
  glossary:
  - fr: départ
    en: departure
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le départ du train est à 8 h.
    example_en: The train's departure is at 8 a.m.
  - fr: arrivée
    en: arrival
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: L’arrivée à l’aéroport était ponctuelle.
    example_en: The arrival at the airport was on time.
  - fr: marché
    en: market
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le marché du Vieux‑Québec est très animé.
    example_en: The Old Quebec market is very lively.
  - fr: covoiturage
    en: car‑pooling
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le covoiturage réduit le trafic.
    example_en: Car‑pooling reduces traffic.
  - fr: souper
    en: dinner (evening meal)
    pos: noun
    gender: m
    region: qc
    formality: standard
    example_fr: Nous mangeons le souper à 19 h.
    example_en: We eat dinner at 7 p.m.
