- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Sports and Leisure'
  body: 'In Québec, sports and leisure activities are closely linked to the local geography and climate.
    While the basic verbs *jouer à* and *faire de* are the same in both regions, the specific activities
    mentioned often differ. For example, *le ski de fond* (cross-country skiing) and *le camping* are
    classic Québec winter and summer pastimes. In France, you will more often hear people talking about
    *le football* (soccer) or *le rugby* as the main team sports, whereas *le hockey* is the undisputed
    king of sports in Québec. The term for the weekend also varies: in Québec, people say *la fin de semaine*,
    while in France the standard expression is *le week-end*.'
  variants:
  - qc: la fin de semaine
    fr: le week-end
    en: the weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine active en famille
  passage_fr: |-
    C’est la fin de semaine et il fait très beau. Ma famille et moi aimons rester actifs. Le samedi matin, nous allons souvent au parc. Mon frère joue au soccer avec ses amis, mais moi, je préfère faire de la randonnée dans la forêt. C’est très relaxant !

    L’après-midi, nous rentrons à la maison. Ma sœur peint dans le jardin, et mon père fait de la musculation au gymnase. Le soir, nous jouons à des jeux de société.

    En hiver, nos activités changent. Nous ne faisons plus de randonnée. Au lieu de ça, nous allons au chalet pour faire du ski de fond ou du camping d’hiver. Parfois, je joue au hockey avec des voisins au centre sportif. J’adore mes loisirs parce que je peux voir mes amis et rester en forme.
  translation_en: |-
    It's the weekend and the weather is very nice. My family and I like to stay active. On Saturday mornings, we often go to the park. My brother plays soccer with his friends, but I prefer to go hiking in the forest. It's very relaxing!

    In the afternoon, we return home. My sister paints in the garden, and my father does weight-training at the gym. In the evening, we play board games.

    In winter, our activities change. We no longer go hiking. Instead, we go to the cottage to do cross-country skiing or winter camping. Sometimes, I play hockey with neighbors at the sports centre. I love my hobbies because I can see my friends and stay in shape.
