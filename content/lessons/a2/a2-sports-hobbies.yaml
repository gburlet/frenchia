sections:
- type: explanation
  id: explanation
  heading: 'Talking about your passions: Jouer à vs. Faire de'
  body: 'When talking about your hobbies and sports in French, the most important thing to master is which
    verb to use: *jouer* or *faire*. While English often uses “play” for almost everything, French is
    more specific. ⟶  We use **jouer à** for team sports, games, and activities that involve a ball or
    a specific set of rules. ⟶  We use **faire de** for individual sports, artistic activities, or general
    exercises. ⟶  Below are the patterns you need to remember. ⟶  --- ⟶  **Jouer à** + article + noun
    (team sport, game) ⟶  - **Je joue au football.** (I play soccer.) ⟶  - **Elle joue aux cartes.** (She
    plays cards.) ⟶  **Faire de** + contraction of *de* + article (*du, de la, de l’, des*) + noun (individual
    sport, activity) ⟶  - **Je fais du ski de fond.** (I go cross-country skiing.) ⟶  - **Nous faisons
    de la randonnée.** (We go hiking.) ⟶  - **Il fait du dessin.** (He does drawing.) ⟶  --- ⟶  **The
    article after *faire de*** ⟶  *Faire de* is followed by the contracted form of *de* + the definite
    article (*du, de la, de l’, des*). In this construction the article does **not** act as a true partitive;
    it simply links the verb to the activity as a whole. ⟶  - Correct: **Je fais du ski.** (not *Je fais
    ski.*) ⟶  - Correct: **Nous faisons de la natation.** ⟶  --- ⟶  **Common pitfalls** ⟶  1. **Don’t
    use *jouer* for individual sports.** You would not say *« Je joue du ski »*; you must say *« Je fais
    du ski »*. ⟶  2. **Watch the contraction with *jouer à*.** *Jouer à* becomes *au* (masculine singular),
    *à la* (feminine singular), and *aux* (plural). ⟶  --- ⟶  **Everyday example** ⟶  - **Après les cours,
    je joue aux échecs avec mes amis.** (After class, I play chess with my friends.) ⟶  - **Le dimanche,
    nous faisons de la natation à la piscine municipale.** (On Sunday, we go swimming at the community
    pool.)'
