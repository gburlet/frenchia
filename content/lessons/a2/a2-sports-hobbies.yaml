- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Sports and Leisure'
  body: 'In Québec, sports and leisure activities are deeply tied to the local geography and climate.
    While the basic verbs *jouer à* and *faire de* are identical in both regions, the specific activities
    mentioned often differ. For example, *le ski de fond* (cross-country skiing) and *le camping* are
    quintessential Québec winter and summer pastimes. In France, while these exist, you are more likely
    to hear people discussing *le football* (soccer) or *le rugby* as primary team sports, whereas *le
    hockey* is the undisputed king of sports in Québec. Additionally, the term for the weekend is a key
    distinction: in Québec, we always say *la fin de semaine*, whereas in France, *le week-end* is the
    standard.'
  variants:
  - qc: la fin de semaine
    fr: le week-end
    en: the weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine active au Québec
  passage_fr: "C’est la fin de semaine et il fait très beau. Ma famille et moi, nous aimons être actifs.\
    \ Le samedi matin, nous allons souvent au parc. Mon frère joue au soccer avec ses amis, mais moi,\
    \ je préfère faire de la randonnée dans la forêt. C'est très relaxant ! \n\nL'après-midi, nous retournons\
    \ à la maison. Ma sœur fait de la peinture dans le jardin, et mon père fait de la musculation au gym.\
    \ Le soir, nous préparons un bon souper. \n\nEn hiver, nos activités changent. Nous ne faisons pas\
    \ de randonnée. Au lieu de ça, nous allons au chalet pour faire du ski de fond ou du camping d'hiver.\
    \ Parfois, je joue au hockey avec des voisins au centre sportif. J'adore mes loisirs parce que je\
    \ peux voir mes amis et rester en forme."
  translation_en: |-
    It's the weekend and the weather is very nice. My family and I like to be active. On Saturday mornings, we often go to the park. My brother plays soccer with his friends, but I prefer to go hiking in the forest. It's very relaxing!

    In the afternoon, we return home. My sister does painting in the garden, and my father does weightlifting at the gym. In the evening, we prepare a good supper.

    In winter, our activities change. We don't go hiking. Instead, we go to the cottage to go cross-country skiing or winter camping. Sometimes, I play hockey with neighbors at the sports center. I love my hobbies because I can see my friends and stay in shape.
