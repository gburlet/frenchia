sections:
- type: explanation
  id: explanation
  heading: 'Talking about your passions: Jouer à vs. Faire de'
  body: "When talking about your hobbies and sports in French, the most important thing to master is which\
    \ verb to use: *jouer* or *faire*. While English often uses 'play' for almost everything, French is\
    \ more specific. \n\nWe use **jouer à** for team sports, games, and activities involving a ball or\
    \ a specific set of rules. \n- **Je joue au hockey.** (I play hockey.)\n- **Elle joue aux échecs.**\
    \ (She plays chess.)\n\nWe use **faire de** for individual sports, artistic activities, or general\
    \ exercises. This is where you will describe many common Québec pastimes. \n- **Je fais du ski de\
    \ fond.** (I go cross-country skiing.)\n- **Nous faisons de la randonnée.** (We go hiking.)\n- **Il\
    \ fait du camping.** (He goes camping.)\n\n**The Partitive Article:** \nNotice that *faire de* requires\
    \ a partitive article (*du, de la, de l', des*). This is a common pitfall for English speakers who\
    \ want to say \"I do hiking\" as \"Je fais randonnée.\" You must include the article! \n\n**Common\
    \ Pitfalls:** \n1. **Don't use 'jouer' for individual sports.** You wouldn't say \"Je joue du ski.\"\
    \ It must be \"Je fais du ski.\" \n2. **Watch the contraction.** *Jouer à* becomes *au* (masculine),\
    \ *à la* (feminine), and *aux* (plural). \n\nIn Québec, you will often hear people talk about going\
    \ to **le chalet** (the cottage) or spending **la fin de semaine** (the weekend) outdoors. \n- **On\
    \ va au chalet pour faire du camping.** (We are going to the cottage to go camping.)"
