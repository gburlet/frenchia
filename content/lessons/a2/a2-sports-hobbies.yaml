- type: explanation
  id: explanation
  heading: 'Talking about your passions: Jouer à vs. Faire de'
  body: 'When talking about your hobbies and sports in French, the most important thing to master is which
    verb to use: *jouer* or *faire*. While English often uses “play” for almost everything, French is
    more specific. ⟶  We use **jouer à** for team sports, games, and activities that involve a ball or
    a specific set of rules. ⟶  We use **faire de** for individual sports, artistic activities, or general
    exercises. ⟶  Both constructions are very common in everyday Québec speech. ⟶  Below are the patterns
    you need to remember. ⟶  --- ⟶  **Jouer à** + article + noun (team sport, game) ⟶  - **Je joue au
    hockey.** (I play hockey.) ⟶  - **Elle joue aux échecs.** (She plays chess.) ⟶  **Faire de** + partitive
    article (du, de la, de l’, des) + noun (individual sport, activity) ⟶  - **Je fais du ski de fond.**
    (I go cross‑country skiing.) ⟶  - **Nous faisons de la randonnée.** (We go hiking.) ⟶  - **Il fait
    du camping.** (He goes camping.) ⟶  --- ⟶  **The article after *faire de*** ⟶  *Faire de* is followed
    by the partitive article (*du, de la, de l’, des*). In this construction the article functions exactly
    as the partitive does: it indicates an indefinite amount of the activity. ⟶  - Correct: **Je fais
    du ski.** (not *Je fais ski.*) ⟶  - Correct: **Nous faisons de la natation.** ⟶  --- ⟶  **Common pitfalls** ⟶  1.
    **Don’t use *jouer* for individual sports.** You would not say *« Je joue du ski »*; you must say
    *« Je fais du ski »*. ⟶  2. **Watch the contraction with *jouer à*.** *Jouer à* becomes *au* (masculine
    singular), *à la* (feminine singular), and *aux* (plural). ⟶  --- ⟶  **Québec flavour** ⟶  In Québec
    you’ll often hear people talk about going to **le chalet** (the cottage) or spending **la fin de semaine**
    (the weekend) outdoors. ⟶  - **On va au chalet pour faire du camping.** (We are going to the cottage
    to go camping.)'
