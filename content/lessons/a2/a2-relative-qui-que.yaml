sections:
- type: explanation
  id: explanation
  heading: Connecting Ideas with *qui* and *que*
  body: "In French, relative pronouns are used to join two sentences into one, avoiding repetition. They\
    \ act as 'bridges' that refer back to a noun (the antecedent). The two most common are *qui* and *que*.\
    \ \n\n### How to use *qui*\nUse **qui** when the pronoun is the **subject** of the following verb.\
    \ You can think of *qui* as replacing 'who', 'which', or 'that' when it performs the action.\n\n*\
    \   **L'homme qui habite ici est gentil.** (The man who lives here is kind.)\n*   **C'est la voiture\
    \ qui appartient à mon frère.** (It's the car that belongs to my brother.)\n\n### How to use *que*\n\
    Use **que** when the pronoun is the **direct object** of the following verb. This means there is already\
    \ a subject in the second part of the sentence. Note that *que* becomes **qu'** before a vowel.\n\n\
    *   **Le livre que je lis est intéressant.** (The book that I am reading is interesting.)\n*   **Le\
    \ café qu'elle boit est très chaud.** (The coffee that she is drinking is very hot.)\n\n### Common\
    \ Pitfalls for English Speakers\n1. **The Subject vs. Object Confusion:** English speakers often use\
    \ 'that' for both cases, but French is strict. If there is a verb immediately following the pronoun,\
    \ you almost always need **qui**. If there is a new subject (je, tu, il, etc.) immediately following,\
    \ you usually need **que**.\n2. **The 'Que' vs. 'Qui' Swap:** Don't let the English word 'that' trick\
    \ you! \n    *   *Incorrect:* Le chien que aboie. (The dog that barks.) \n    *   *Correct:* Le chien\
    \ **qui** aboie. (Because 'aboie' is the verb and there is no new subject.)"
