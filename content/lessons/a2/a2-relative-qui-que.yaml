- type: regional_note
  id: regional-note
  heading: 'Le Québec et la France : Les pronoms relatifs'
  body: 'In terms of grammar, the rules for *qui* and *que* are identical in both Québec and France. They
    are fundamental building blocks of the French language used to create complex sentences. While the
    grammar remains the same, the vocabulary you choose to place before these pronouns will change depending
    on where you are. For example, the meal word changes: le souper que je prépare in Québec, le dîner
    que je prépare in France. Because these pronouns are so common, you will hear them in every conversation,
    whether you are in Montreal or Paris!'
