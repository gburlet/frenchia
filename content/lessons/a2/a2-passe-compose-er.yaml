- type: reading
  id: reading
  title: Ma fin de semaine à Québec
  passage_fr: |-
    La fin de semaine dernière, j'ai passé une journée magnifique dans la ville de Québec. Samedi matin, j'ai visité le Vieux-Québec avec mon ami Marc. Nous avons marché dans les rues historiques et nous avons pris beaucoup de photos. À midi, nous avons mangé dans un petit bistro traditionnel. J'ai goûté une tourtière délicieuse !

    L'après-midi, nous avons regardé les monuments et nous avons écouté un musicien de rue. Ensuite, nous avons acheté des souvenirs pour ma famille. Le soir, je suis rentré à la maison et j'ai préparé un bon souper. J'ai travaillé un peu sur mon projet, mais j'ai fini tôt. J'ai beaucoup aimé cette journée parce que j'ai profité du calme et j'ai profité du beau temps.
  translation_en: "Last weekend, I spent a wonderful day in the city of Québec. Saturday morning, I visited\
    \ Old Québec with my friend Marc. We walked in the historic streets and took many photos. At noon,\
    \ we ate in a small traditional bistro. I tasted a delicious tourtière. \n\nIn the afternoon, we looked\
    \ at the monuments and listened to a street musician. Then, we bought souvenirs for my family. In\
    \ the evening, I went back home and prepared a good supper. I worked a little on my project, but I\
    \ finished early. I really liked this day because I enjoyed the peace and enjoyed the beautiful weather."
