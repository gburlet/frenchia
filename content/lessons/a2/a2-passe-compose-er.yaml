- type: reading
  id: reading
  title: Ma fin de semaine à Québec
  passage_fr: |-
    La fin de semaine dernière, j’ai passé une journée très agréable dans la ville de Québec. Samedi matin, je suis allé au marché du quartier avec mon ami Marc. Nous avons flâné entre les étals, acheté des fruits frais et parlé avec les commerçants. Vers midi, nous avons dîné dans un petit café qui sert des quiches maison. J’ai goûté une quiche aux épinards très savoureuse !

    L’après-midi, nous avons visité le Musée de la civilisation et nous avons découvert une exposition sur l’histoire locale. Ensuite, nous avons magasiné pour choisir des cadeaux pour nos proches. Le soir, je suis rentré à la maison et j’ai préparé un bon souper. J’ai révisé un peu mon cours de français, puis j’ai fini tôt. J’ai beaucoup aimé cette journée parce que j’ai profité du calme et du beau temps.
  translation_en: |-
    Last weekend, I spent a very pleasant day in the city of Québec. Saturday morning, I went to the neighbourhood market with my friend Marc. We strolled among the stalls, bought fresh fruit and chatted with the shopkeepers. Around noon, we had lunch in a small café that serves homemade quiches. I tasted a very tasty spinach quiche!

    In the afternoon, we visited the Musée de la civilisation and discovered an exhibition about local history. Afterwards, we shopped to pick out gifts for our relatives. In the evening, I went back home and prepared a good supper. I reviewed a bit of my French class, then finished early. I really liked this day because I enjoyed the peace and the beautiful weather.
