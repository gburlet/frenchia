sections:
- type: explanation
  id: explanation
  heading: Le passé composé avec les verbes en -er
  body: "In French, the *passé composé* is the most common way to talk about completed actions in the\
    \ past. To form it, you need two parts: an auxiliary verb (usually *avoir*) and the past participle\
    \ of the main verb. \n\nFor all regular **-er** verbs (like *parler, manger, travailler*), you drop\
    \ the **-er** ending and add **-é** to create the past participle. \n\nHere is the conjugation for\
    \ the verb **parler** (to speak):\n- J'ai parlé\n- Tu as parlé\n- Il/Elle a parlé\n- Nous avons parlé\n\
    - Vous avez parlé\n- Ils/Elles ont parlé\n\n**Examples:**\n- **J'ai mangé une poutine.** (I ate a\
    \ poutine.)\n- **Nous avons travaillé toute la journée.** (We worked all day.)\n- **Ils ont regardé\
    \ un film.** (They watched a movie.)\n\n**Common Pitfalls for English Speakers:**\n1. **Forgetting\
    \ the accent:** Because the past participle ends in **-é**, it is easy to forget the accent mark and\
    \ write \"J'ai parle.\" Remember that the accent is necessary to distinguish the past participle from\
    \ the present tense or the infinitive.\n2. **Over-complicating agreement:** Unlike some other past\
    \ tenses, the past participle of verbs using *avoir* does not usually change to match the subject.\
    \ For example, even if the subject is feminine, it remains **Elle a mangé** (not *mangée*). \n\nIn\
    \ Québec, you will hear the *passé composé* used constantly in daily life, whether you are talking\
    \ about your *fin de semaine* (weekend) or what you did at the *dépanneur* (convenience store)!"
