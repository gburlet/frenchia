- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: The Passé Composé'
  body: In terms of grammar, the formation of the *passé composé* for regular -er verbs is identical in
    both Québec and France. You will use the same auxiliary verbs (*avoir*) and the same past participle
    endings (*-é*). However, the vocabulary you choose to place into these sentences will often differ.
    For example, while a person in France might say they 'prepared dinner' using the verb *préparer le
    dîner*, a Québécois person would almost always say *préparer le souper*. Both are grammatically correct,
    but using *souper* is the standard way to refer to the evening meal in Québec.
