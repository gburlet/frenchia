  - J'ai mangé une pomme.
  - Je suis mangé une pomme.
  - Je mange une pomme.
  answer_index: 1
  explanation: The correct answer is 'J'ai mangé'. To form the passé composé, you need the auxiliary verb
    'ai' (avoir) followed by the past participle. For -er verbs, the past participle ends in **-é**. 'J'ai
    manger' is incorrect because 'manger' is the infinitive form. 'Je suis mangé' is incorrect because
    'manger' uses the auxiliary 'avoir', not 'être'. 'Je mange' is in the present tense.
