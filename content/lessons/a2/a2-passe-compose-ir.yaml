- type: reading
  id: reading
  title: Une fin de semaine occupée
  passage_fr: Samedi dernier, j’ai eu une journée très occupée à Montréal. D’abord, j’ai fini de nettoyer
    mon appartement avant de sortir. Ensuite, nous avons préparé un pique-nique pour le repas du midi
    dans le parc ; le temps était magnifique ! Après le repas, nous sommes allés **magasiner** au centre
    commercial avec mon ami. Nous avons terminé nos achats vers 15 h. Puis, nous avons choisi un petit
    café pour prendre un café et nous détendre. Le soir, j’ai fini de cuisiner un bon **souper** pour
    ma famille. J’ai choisi une recette facile parce que je suis fatigué. J’ai vraiment aimé ma **fin
    de semaine**. Demain, je vais finir de planifier mes projets pour la semaine prochaine.
  translation_en: Last Saturday, I had a very busy day in Montreal. First, I finished cleaning my apartment
    before going out. Then, we prepared a picnic for the midday meal in the park; the weather was magnificent!
    After the meal, we went **shopping** at the mall with my friend. We finished our purchases around
    3 PM. Afterwards, we chose a small café to have a coffee and relax. In the evening, I finished cooking
    a good **supper** for my family. I chose an easy recipe because I am tired. I really enjoyed my **weekend**.
    Tomorrow, I will finish planning my projects for next week.
