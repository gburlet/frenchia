- type: reading
  id: reading
  title: Une fin de semaine occupée
  passage_fr: "Samedi dernier, j'ai eu une journée très occupée à Montréal. D'abord, j'ai fini de nettoyer\
    \ mon appartement avant de sortir. Ensuite, j'ai choisi de magasiner au centre d'achat avec mon ami.\
    \ Nous avons fini nos achats vers 15h00. Après cela, nous avons choisi un petit café pour prendre\
    \ un café et relaxer. \n\nPour le dîner, nous avons fini de préparer un pique-nique dans le parc.\
    \ Le temps était magnifique ! Ce soir, j'ai fini de cuisiner un bon souper pour ma famille. J'ai choisi\
    \ une recette facile parce que je suis fatigué. J'ai vraiment aimé ma fin de semaine. Demain, je vais\
    \ finir de planifier mes projets pour la semaine prochaine."
  translation_en: "Last Saturday, I had a very busy day in Montreal. First, I finished cleaning my apartment\
    \ before going out. Then, I chose to go shopping at the mall with my friend. We finished our shopping\
    \ around 3:00 PM. After that, we chose a small café to have a coffee and relax. \n\nFor lunch, we\
    \ finished preparing a picnic in the park. The weather was magnificent! This evening, I finished cooking\
    \ a good supper for my family. I chose an easy recipe because I am tired. I really enjoyed my weekend.\
    \ Tomorrow, I will finish planning my projects for next week."
