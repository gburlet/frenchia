sections:
- type: explanation
  id: explanation
  heading: Le passé composé des verbes en -ir
  body: 'In your previous lessons, you learned how to form the *passé composé* using regular *-er* verbs
    (like *parler* → *parlé*). Today, we are looking at regular verbs ending in *-ir*, specifically those
    in the “second group.”  To form the *passé composé*, you still use the auxiliary verb **avoir** in
    the present tense, followed by the past participle. For these regular *-ir* verbs, the past participle
    is formed by removing the *-ir* ending and replacing it with **-i**.  Here are some common examples: -
    Finir (to finish) → **j''ai fini** (I finished) - Choisir (to choose) → **tu as choisi** (you chose) -
    Réussir (to succeed) → **il a réussi** (he succeeded) - Grandir (to grow) → **nous avons grandi**
    (we grew)  **Common Pitfalls for English Speakers:** 1. **Confusing -ir verbs:** *Partir* is not a
    regular *-ir* verb. Its past participle is *parti*, and it takes *être* (je suis parti / je suis partie),
    not *avoir*. Memorize it separately. 2. **Pronunciation:** The French *i* in the past participle **fini**
    is a clear, tense “ee” sound, like the *ee* in English “bee,” not the short *i* of “sit.”  In Québec,
    you will frequently use these verbs when describing your day. For example: **J''ai fini mon travail
    à 17 h** (I finished my work at 5 PM). Note that in France, people might say *J''ai terminé*, but
    *fini* is perfectly standard and common in both regions.'
