sections:
- type: explanation
  id: explanation
  heading: Le passé composé des verbes en -ir
  body: "In your previous lessons, you learned how to form the *passé composé* using regular *-er* verbs\
    \ (like *parler* $\rightarrow$ *parlé*). Today, we are looking at regular verbs ending in *-ir*, specifically\
    \ those in the 'second group.' \n\nTo form the *passé composé*, you still use the auxiliary verb **avoir**\
    \ in the present tense, followed by the past participle. For these regular *-ir* verbs, the past participle\
    \ is formed by removing the *-ir* ending and replacing it with **-i**. \n\nHere are some common examples:\n\
    - Finir (to finish) $\rightarrow$ **j'ai fini** (I finished)\n- Choisir (to choose) $\rightarrow$\
    \ **tu as choisi** (you chose)\n- Réussir (to succeed) $\rightarrow$ **il a réussi** (he succeeded)\n\
    - Grandir (to grow) $\rightarrow$ **nous avons grandi** (we grew)\n\n**Common Pitfalls for English\
    \ Speakers:**\n1. **Confusing -ir verbs:** *Partir* is not a regular *-ir* verb. Its past participle\
    \ is *parti*, and it takes *être* (je suis parti / je suis partie), not *avoir*. Memorize it separately.\n\
    2. **Pronunciation:** Remember that in the past participle **fini**, the 'i' is a short, crisp sound.\
    \ Don't let the 'i' sound like a long 'ee' (as in 'bee').\n\nIn Québec, you will frequently use these\
    \ verbs when describing your day. For example: **J'ai fini mon travail à 17h** (I finished my work\
    \ at 5 PM). Note that in France, people might say *J'ai terminé*, but *fini* is perfectly standard\
    \ and common in both regions."
