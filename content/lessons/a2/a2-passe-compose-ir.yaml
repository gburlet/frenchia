- type: regional_note
  id: regional-note
  heading: 'Note culturelle : Le passé composé des verbes en -ir'
  body: 'La formation du *passé composé* des verbes réguliers en -ir est la même en français québécois
    et en français de France : on utilise l’auxiliaire **avoir** (les verbes pronominaux, ainsi que les
    verbes de mouvement comme *partir* ou *sortir*, utilisent **être**), et le participe passé se termine
    en **-i** (par ex. *finir → fini*, *réussir → réussi*). Il n’y a donc aucune différence régionale
    dans la conjugaison de ces verbes.'
  variants: []
- type: reading
  id: reading
  title: Une journée bien remplie
  passage_fr: Samedi dernier, j’ai eu une journée très occupée à la ville. D’abord, j’ai **réussi** à
    nettoyer mon appartement avant de sortir. Ensuite, j’ai **rempli** mon sac à dos avec des sandwichs
    pour le **dîner** dans le parc ; le temps était magnifique ! Après le repas, nous avons **réfléchi**
    à quel film regarder et nous sommes allés faire des **achats** au centre commercial. Nous avons terminé
    nos achats vers 15 h. Puis, nous avons choisi un petit café pour prendre un café et nous détendre.
    Le soir, j’ai fini de préparer le **souper** pour ma famille. J’ai choisi une recette facile parce
    que je suis fatigué. **Mon petit frère a beaucoup grandi cette année**. J’ai vraiment aimé ce samedi.
    Demain, je vais **réfléchir** à mes projets pour la semaine prochaine.
  translation_en: Last Saturday I had a very busy day in town. First, I managed to clean my apartment
    before going out. Then I filled my backpack with sandwiches for lunch in the park; the weather was
    wonderful! After the meal we thought about which film to watch and went shopping at the mall. We finished
    our purchases around 3 p.m. Afterwards we chose a small café to have a coffee and relax. In the evening
    I finished preparing supper for my family. I chose an easy recipe because I’m tired. My little brother
    has grown a lot this year. I really enjoyed that Saturday. Tomorrow I will think about my projects
    for next week.
