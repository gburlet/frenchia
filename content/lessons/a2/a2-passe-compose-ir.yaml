- type: regional_note
  id: regional-note
  heading: 'Note culturelle : Le passé composé des verbes en -ir'
  body: 'The formation of the *passé composé* for regular *-ir* verbs is identical in Québec and in France:
    the auxiliary **avoir** is used (except for a few reflexive verbs that take **être**), and the past
    participle ends in **-i** (e.g., *finir → fini*, *réussir → réussi*). The only regional difference
    concerns occasional vocabulary choices, not the grammar itself. For example, Québec speakers may say
    *terminé* where some French speakers might prefer *fini*, but the verb forms remain the same.'
