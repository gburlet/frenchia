- type: regional_note
  id: regional-note
  heading: 'Note culturelle : Le passé composé au Québec'
  body: In terms of grammar, the formation of the *passé composé* for regular *-ir* verbs is identical
    in both Québec and France. You will use the same auxiliary verbs and the same past participle endings
    (*-i*). However, while the grammar remains the same, the vocabulary used within these sentences often
    differs. For example, when describing your day, a Québécois person might talk about finishing their
    'souper' or 'magasiner,' whereas someone in France would more commonly say 'dîner' or 'faire du shopping.'
