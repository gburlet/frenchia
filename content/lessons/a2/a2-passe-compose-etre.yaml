sections:
- type: explanation
  id: explanation
  heading: 'Mastering the Passé Composé: Être vs. Avoir'
  body: "In the previous lesson, we looked at irregular past participles. Today, we move to the 'auxiliary'\
    \ verbs: *avoir* (to have) and *être* (to be). While most French verbs use *avoir* to form the passé\
    \ composé, a specific group uses *être*. \n\n**1. When to use Être:** \nYou must use *être* for two\
    \ main categories:\n- **Movement Verbs:** These often describe a change of location or state (e.g.,\
    \ *aller, venir, partir, arriver, monter, descendre, entrer, sortir, naître, mourir*). \n- **Pronominal\
    \ Verbs:** Pronominal (reflexive) verbs: any verb used with a reflexive pronoun (me, te, se, nous,\
    \ vous, se), such as **s'est levé** (got up) or **s'est lavé** (washed oneself).\n\n**2. The Rule\
    \ of Agreement:** \nThis is the most important rule for *être*: the past participle **must agree**\
    \ in gender and number with the subject. \n- Masculine singular: **Il est parti.** (He left.)\n- Feminine\
    \ singular: **Elle est partie.** (She left.)\n- Masculine plural: **Ils sont partis.** (They left.)\n\
    - Feminine plural: **Elles sont parties.** (They left.)\n\n*Important Note on Pronominal Verbs:* With\
    \ reflexive verbs, the participle agrees with the preceding direct object. However, **there is no\
    \ agreement** if the direct object follows the verb. \n- Example: **Les enfants se sont lavé les mains.**\
    \ (The children washed their hands.) \n*Note: Because \"les mains\" (the hands) is the direct object\
    \ and comes after the verb, we do not add an 's' to \"lavé\".*\n\n*Note: With the auxiliary **avoir**,\
    \ the participle generally does not change based on the subject.*\n\n**Common Pitfalls for English\
    \ Speakers:**\n1. **Forgetting the agreement:** Because English doesn't have gendered adjectives,\
    \ it is easy to forget the extra 'e' or 's' when using *être*. Always check your subject!\n2. **Mixing\
    \ up the auxiliaries:** Don't use *être* for every verb just because it feels like a 'state.' For\
    \ example, you say **J'ai mangé** (I ate), not *Je suis mangé*. Only use *être* for that specific\
    \ list of movement and reflexive verbs."
