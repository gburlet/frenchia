- type: regional_note
  id: regional-note
  heading: 'Le passé composé : être ou avoir ?'
  body: |-
    In terms of grammar, the rules for using *être* vs. *avoir* are identical in both Québec and France. The verbs that take *être* (like *aller* or *venir*) and the rules for pronominal verbs do not change between the two regions. However, you will notice that the vocabulary used within these sentences—such as the names of meals or weekend activities—reflects the local culture. For example, while a person in France might say they 'went shopping during the weekend,' a Québécois person would more naturally say they 'went shopping on the weekend' (en fin de semaine).

    **Variants:**

    1. **La fin de semaine** (QC) / **Le week-end** (FR) — The weekend.
    2. **Le souper** (QC) / **Le dîner** (FR) — Supper/Dinner (Note: In QC, *dîner* is lunch).
    3. **Le dîner** (QC) / **Le déjeuner** (FR) — Lunch (Note: In QC, *déjeuner* is breakfast).
    4. **Magasiner** (QC) / **Faire du shopping** (FR) — To go shopping.
    5. **Le dépanneur** (QC) / **L'épicerie de quartier / la supérette** (FR) — Convenience store.
    6. **Le centre d'achats** (QC) / **Le centre commercial** (QC/FR) — Shopping mall.
  variants:
