sections:
- type: explanation
  id: explanation
  heading: Maîtriser les participes passés irréguliers
  body: 'In your previous lessons, you learned how to form the *passé composé* using regular patterns
    (like *-é* or *-i*). However, many of the most common verbs in French are irregular. These verbs do
    not follow a standard rule, so they must be memorized individually. To form the *passé composé*, you
    still use the auxiliary verb (*avoir* or *être*) in the present tense, followed by the irregular past
    participle. Here are some of the most essential ones you will need to master for daily conversation:
     *   **Faire** (to do/make) → **fait**  *   **Prendre** (to take) → **pris**  *   **Voir** (to see)
    → **vu**  *   **Avoir** (to have) → **eu**  *   **Être** (to be) → **été**  *   **Dire** (to say)
    → **dit**  *   **Mettre** (to put/place) → **mis**  **Examples:**  *   J''ai **fait** mes devoirs
    hier soir. (I did my homework last night.)  *   Nous avons **pris** le bus pour aller au centre d''achats.
    (We took the bus to go to the shopping mall.)  *   Est-ce que tu as **vu** le nouveau film ? (Did
    you see the new movie?)  *   Elle a **mis** son manteau parce qu''il fait froid. (She put on her coat
    because it''s cold.)  **Common Pitfalls for English Speakers:**  1.  **Over-regularizing:** Because
    many verbs end in *-u* (like *vu*, *lu*, *pu*, *voulu*, or *bu*), learners sometimes try to apply
    a regular *-é* pattern to irregular verbs, producing forms such as *prendé*, *prendu* or *faisé* instead
    of the correct *pris*, *fait*, etc. Always double-check the correct past participle before conjugating!
     2.  **Confusing ''J''ai fait'' and ''il fait'':** Be careful not to confuse the *passé composé* with
    the present tense. “J''ai fait” means “I did” (a completed action), whereas “il fait” is used for
    the present state of the weather, such as “il fait beau” (the weather is nice). Always check whether
    your sentence describes a completed action or a present state.'
