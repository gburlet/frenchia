- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Usage Notes'
  body: The grammar for irregular past participles is identical in both Québec and France. Whether you
    are in Montreal or Paris, the construction of the *passé composé* remains the same. However, the vocabulary
    you choose to pair with these verbs will reflect your location. For example, while a person in France
    might say they 'have seen' a movie on the 'week-end,' a Québécois would typically say they 'have seen'
    a movie during 'la fin de semaine.' Additionally, when describing your daily routine in the past tense,
    you will notice distinct differences in meal names and shopping locations.
