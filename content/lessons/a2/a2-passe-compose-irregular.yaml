    en: the weekend
    formality: standard
  - qc: dîner
    fr: déjeuner
    en: lunch
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine bien remplie
  passage_fr: |-
    La fin de semaine dernière, j'avais beaucoup de travail, mais j'ai aussi profité du beau temps. Samedi matin, je suis allé faire une longue randonnée en forêt avec des amis. Nous avons admiré des paysages magnifiques et nous avons pris plein de photos. Pour le dîner, nous avons mangé des sandwichs dans le parc.

    L'après-midi, je suis passé au centre commercial. J'ai essayé de nouveaux souliers et j'ai acheté un cadeau pour ma mère. J'ai dit à mon ami que j'aimerais aller au cinéma, mais il était trop occupé pour m'accompagner. Le soir, j'ai préparé un bon souper et j'ai écouté de la musique. J'étais très fatigué, mais j'ai passé une excellente journée.
  translation_en: |-
    Last weekend, I had a lot of work, but I also enjoyed the beautiful weather. Saturday morning, I went on a long hike in the forest with some friends. We admired magnificent landscapes and took lots of photos. For lunch, we ate sandwiches in the park.

    In the afternoon, I stopped at the mall. I tried on new shoes and bought a gift for my mother. I told my friend that I would like to go to the cinema, but he was too busy to come with me. In the evening, I prepared a good supper and listened to music. I was very tired, but I had an excellent day.
  glossary:
  - fr: fin de semaine
    en: 'the weekend (Standard French: le week-end)'
    pos: noun
    gender: f
    region: qc
    formality: standard
  - fr: souper
    en: 'supper/dinner (Standard French: le dîner)'
    pos: noun
    gender: m
    region: qc
    formality: standard
  - fr: profiter de
    en: to enjoy / to take advantage of
    pos: verb
    region: common
    formality: standard
