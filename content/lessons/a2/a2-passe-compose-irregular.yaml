sections:
- type: explanation
  id: explanation
  heading: Maîtriser les participes passés irréguliers
  body: "In your previous lessons, you learned how to form the *passé composé* using regular patterns\
    \ (like *-é* or *-i*). However, many of the most common verbs in French are irregular. These verbs\
    \ do not follow a standard rule, so they must be memorized individually. \n\nTo form the *passé composé*,\
    \ you still use the auxiliary verb (*avoir* or *être*) in the present tense, followed by the irregular\
    \ past participle. Here are some of the most essential ones you will need to master for daily conversation:\n\
    \n*   **Faire** (to do/make) → **fait**\n*   **Prendre** (to take) → **pris**\n*   **Voir** (to see)\
    \ → **vu**\n*   **Avoir** (to have) → **eu**\n*   **Être** (to be) → **été**\n*   **Dire** (to say)\
    \ → **dit**\n*   **Mettre** (to put/place) → **mis**\n\n**Examples:**\n*   J'ai **fait** mes devoirs\
    \ hier soir. (I did my homework last night.)\n*   Nous avons **pris** le bus pour aller au centre\
    \ d'achat. (We took the bus to go to the shopping mall.)\n*   Est-ce que tu as **vu** le nouveau film\
    \ ? (Did you see the new movie?)\n*   Elle a **mis** son manteau parce qu'il fait froid. (She put\
    \ on her coat because it's cold.)\n\n**Common Pitfalls for English Speakers:**\n1.  **Over-regularizing:**\
    \ Because many verbs end in *-u* (like *vu*, *lu*, *pu*, *voulu*, or *bu*), students sometimes try\
    \ to apply a regular pattern to verbs that don't follow one, such as *prendre*. Always double-check\
    \ if the verb is irregular before conjugating!\n2.  **Confusing 'J'ai fait' and 'il fait':** Be careful\
    \ not to confuse the *passé composé* with the present tense. \"J'ai fait\" means \"I did\" (a completed\
    \ action), whereas \"il fait\" is used for the present state of the weather, such as \"il fait beau\"\
    \ (the weather is nice). Always check whether your sentence describes a completed action or a present\
    \ state."
