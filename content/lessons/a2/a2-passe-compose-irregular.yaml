- type: reading
  id: reading
  title: Une fin de semaine bien occupée
  passage_fr: |-
    La fin de semaine dernière, j'ai eu beaucoup de travail, mais j'ai aussi profité du beau temps. Samedi matin, j'ai fait une longue randonnée en forêt avec des amis. Nous avons vu des paysages magnifiques et nous avons pris beaucoup de photos. Pour le dîner, nous avons mangé des sandwichs au parc.

    L'après-midi, je suis allé au centre-ville. J'ai mis mes nouveaux souliers et j'ai acheté un cadeau pour ma mère. J'ai dit à mon ami que je voulais aller au cinéma, mais il a été trop occupé pour venir avec moi. Le soir, j'ai préparé un bon souper et j'ai écouté de la musique. J'ai été très fatigué, mais j'ai eu une excellente journée.
  translation_en: |-
    Last weekend, I had a lot of work, but I also enjoyed the beautiful weather. Saturday morning, I went on a long hike in the forest with some friends. We saw magnificent landscapes and took a lot of photos. For lunch, we ate sandwiches in the park.

    In the afternoon, I went downtown.
    I put on my new shoes and bought a gift for my mother. I told my friend that I wanted to go to the cinema, but he was too busy to come with me. In the evening, I prepared a good supper and listened to music. I was very tired, but I had an excellent day.
