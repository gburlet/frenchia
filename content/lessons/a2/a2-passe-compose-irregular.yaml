- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Usage Notes'
  body: The grammar for irregular past participles is identical in both Québec and France. Whether you
    are in Montréal or Paris, the construction of the *passé composé* remains the same. What does change
    is the everyday vocabulary that surrounds the verbs. In the reading you will see the Québec terms
    **la fin de semaine** (instead of *le week-end*) and **dîner** for the midday meal (the French *déjeuner*).
    These are the only regional differences needed for this lesson; the verb forms themselves do not vary.
  variants:
