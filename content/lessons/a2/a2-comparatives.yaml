sections:
- type: explanation
  id: explanation
  heading: Comparing Things in French
  body: "In French, comparing two people, places, or objects is straightforward once you master the basic\
    \ structures. To compare qualities, we use the formula: **plus / moins / aussi + [adjective] + que**.\
    \ \n\nHere is how they break down:\n1. **Plus... que** (More... than): **Le souper est plus copieux\
    \ que le dîner.** (Supper is more filling than lunch.)\n2. **Moins... que** (Less... than): **Le dépanneur\
    \ est moins grand que l'épicerie.** (The convenience store is less big than the grocery store.)\n\
    3. **Aussi... que** (As... as): **Le parc est aussi beau que la plage.** (The park is as beautiful\
    \ as the beach.)\n\n**The Mieux vs. Meilleur Pitfall**\nOne of the most common mistakes for English\
    \ speakers is confusing *meilleur* and *mieux*. \n- **Meilleur** is the comparative form of the adjective\
    \ *bon* (good). Use it to describe nouns. \n*Ex: Ce café est **meilleur** que celui d'hier.* (This\
    \ coffee is better than yesterday's.)\n- **Mieux** is the comparative form of the adverb *bien* (well).\
    \ Use it to describe actions (verbs).\n*Ex: Tu chantes **mieux** que moi.* (You sing better than I\
    \ do.)\n\n**A Note on Québec Usage**\nWhile the grammar remains the same across the Francophonie,\
    \ remember that in Québec, we often use **la fin de semaine** instead of *le week-end*. When comparing\
    \ activities, you might say: **La fin de semaine est plus relaxante que la semaine de travail.** (The\
    \ weekend is more relaxing than the work week.)"
