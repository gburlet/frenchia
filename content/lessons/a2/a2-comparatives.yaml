- type: reading
  id: reading
  title: Choisir son quartier
  passage_fr: "J'habite dans un petit appartement à Montréal. Mon appartement est plus petit que celui\
    \ de mon ami, mais il est aussi confortable que le sien. Le loyer est moins cher que dans le centre-ville,\
    \ ce qui est une bonne chose pour mon budget. \n\nLe samedi, j'aime aller au parc avec mon chien.\
    \ Le parc est plus grand que la place publique, et il y a moins de voitures. C'est plus relaxe que\
    \ de rester à la maison. Par contre, le trajet en autobus est parfois plus long que le trajet à pied.\
    \ \n\nMa voisine dit que le quartier est meilleur que le quartier d'à côté parce qu'il y a une excellente\
    \ boulangerie. Pour moi, le quartier est aussi agréable que le centre-ville, mais c'est beaucoup plus\
    \ calme le soir."
  translation_en: "I live in a small apartment in Montreal. My apartment is smaller than my friend's,\
    \ but it is as comfortable as his. The rent is cheaper than in the downtown area, which is a good\
    \ thing for my budget.\n\nOn Saturdays, I like to go to the park with my dog. The park is bigger than\
    \ the public square, and there are fewer cars. It's more relaxing than staying at home. On the other\
    \ hand, the bus trip is sometimes longer than the walk. \n\nMy neighbor says that the neighborhood\
    \ is better than the next neighborhood because there is an excellent bakery. For me, the neighborhood\
    \ is as pleasant as downtown, but it is much calmer in the evening."
