- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Comparatives'
  body: The grammatical structure for comparatives (**plus, moins, aussi... que**) is identical in both
    Québec and France. However, the vocabulary you choose to compare will often reflect local life. In
    Québec, you will frequently compare local landmarks, types of meals (like *le souper*), and local
    stores (like *le dépanneur*). While a person in France might compare a *boulangerie* to a *pâtisserie*,
    a Québécois person might compare a *dépanneur* to a *marché*. You will also notice that certain adjectives,
    like *relaxe*, are used in Québec to describe a state of being, though it is considered informal;
    a person in France would more likely use *détendu*.
