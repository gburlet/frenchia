sections:
- type: explanation
  id: explanation
  heading: 'Expressing Duration: Depuis, Pendant, and Pour'
  body: |-
    In French, expressing how long something lasts depends entirely on whether the action is still happening, is finished, or is a planned goal. Understanding the difference between *depuis*, *pendant*, and *pour* is essential for natural conversation.

    **1. Depuis (Since / For)**
    Use *depuis* with the **present tense** to describe an action that started in the past and is still continuing now.
    *   **J'habite à Montréal depuis trois ans.** (I have lived in Montreal for three years.)
    *   **Elle travaille ici depuis ce matin.** (She has been working here since this morning.)

    **2. Pendant (During / For)**
    Use *pendant* to give the length of a period during which something happens. This can be a completed action in the past or a planned duration in the future.
    *   **J'ai dormi pendant huit heures.** (I slept for eight hours.)
    *   **On a regardé un film pendant la fin de semaine.** (We watched a movie during the weekend.)
    *   **Nous avons beaucoup parlé pendant le dîner.** (We talked a lot during lunch.)

    **3. Pour (For)**
    Use *pour* to express a planned or intended duration. It indicates how long an action is intended to last.
    *   **Je pars en voyage pour deux semaines.** (I am leaving on a trip for two weeks.)
    *   **Nous allons rester à la maison de campagne pour deux semaines.** (We are going to stay at the country house for two weeks.)
    *   **Je suis ici pour un mois.** (I am here for a month.)

    **Additional note – “en avoir pour”**
    When you hear *« j'en ai pour X minutes »* it means “it will take me X minutes.” This is a common idiom and is **not** a *pendant* construction.

    **Common Pitfalls for English Speakers:**

    *   **The “Present Perfect” Trap:** In English, we say “I *have been* living here for a year.” In French, you must use the **present tense** with *depuis* (**J'habite…**), not the passé composé.
    *   **Duration vs. Completion:** English speakers often use “for” for both ongoing and finished actions. In French, if the action is over, you must switch from *depuis* to *pendant*. If you say “J'ai habité ici pendant deux ans,” it means you no longer live there.
