- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Duration and Vocabulary'
  body: 'The grammar rules for *depuis*, *pendant*, and *pour* are identical in both Québec and France.
    However, the vocabulary you use to describe the duration or the activities occurring during that time
    often differs. In Québec, you will frequently use terms like *la fin de semaine* instead of *le week-end*,
    and *le souper* instead of *le dîner* (for the evening meal). For example, a Québécois might say :
    « Je vais au dépanneur pendant la fin de semaine pour prendre une collation », whereas someone from
    France would more likely say : « Je vais à la boulangerie le week-end pour acheter du pain ». These
    nuances are important for sounding natural in a local context.'
