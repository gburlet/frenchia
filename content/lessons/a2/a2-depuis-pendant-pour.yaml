sections:
- type: explanation
  id: explanation
  heading: 'Expressing Duration: Depuis, Pendant, and Pour'
  body: "In French, expressing how long something lasts depends entirely on whether the action is still\
    \ happening, is finished, or is a planned goal. Understanding the difference between *depuis*, *pendant*,\
    \ and *pour* is essential for natural conversation.\n\n**1. Depuis (Since / For)**\nUse *depuis* with\
    \ the **present tense** to describe an action that started in the past and is still continuing now.\
    \ \n*   **J'habite à Montréal depuis trois ans.** (I have lived in Montreal for three years.)\n* \
    \  **Elle travaille ici depuis ce matin.** (She has been working here since this morning.)\n\n**2.\
    \ Pendant (During / For)**\nUse *pendant* to give the length of a period during which something happens.\
    \ This can be a completed action in the past or a planned duration in the future.\n*   **J'ai dormi\
    \ pendant huit heures.** (I slept for eight hours.)\n*   **Je vais aller au dépanneur pendant dix\
    \ minutes.** (I am going to the convenience store for ten minutes.)\n*   **On a regardé un film pendant\
    \ la fin de semaine.** (We watched a movie during the weekend.)\n*Note: In Québec, we say « la fin\
    \ de semaine » instead of the European « le week-end ».*\n\n**3. Pour (For)**\nUse *pour* to express\
    \ a planned or intended duration. It indicates how long an action is intended to last.\n*   **Je pars\
    \ en voyage pour deux semaines.** (I am leaving on a trip for two weeks.)\n\n**Common Pitfalls for\
    \ English Speakers:**\n\n*   **The \"Present Perfect\" Trap:** In English, we say \"I *have been*\
    \ living here for a year.\" In French, you must use the **present tense** with *depuis* (**J'habite...**),\
    \ not the passé composé. \n*   **Duration vs. Completion:** English speakers often use \"for\" for\
    \ both ongoing and finished actions. In French, if the action is over, you must switch from *depuis*\
    \ to *pendant*. If you say \"J'ai habité ici pendant deux ans,\" it means you no longer live there."
