- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Duration and Vocabulary'
  body: |-
    The grammar rules for *depuis*, *pendant* and *pour* are the same in Québec and in France. What changes most often is the everyday vocabulary you use to talk about a period of time or the activities you do during that period. In Québec you will hear *la fin de semaine* for “the weekend” and *le souper* for the evening meal, while in France the usual terms are *le week-end* and *le dîner*.

    Below are a few neutral examples that illustrate the same grammatical point without relying on a specific Québec setting:

    • « Je travaille depuis trois mois dans cette entreprise ».

    • « Nous étudions le français pendant deux heures chaque jour ».

    • « Je prévois de partir en voyage pour la fin de semaine prochaine ».

    In a French-European context the same ideas would be expressed with *le week-end* and *le dîner*:

    • « Je vais à la boulangerie le week-end pour acheter du pain ».

    • « Nous dînons ensemble ce soir ».

    Both versions are correct; choosing the local word simply makes your speech sound more natural to the people you are speaking with.
