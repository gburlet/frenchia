- type: reading
  id: reading
  title: Depuis, pendant et pour
  passage_fr: "Je m'appelle Marc et j'habite à Québec depuis deux ans. J'adore ma vie ici, surtout en\
    \ automne. Chaque samedi matin, je vais au marché avec mon ami Thomas. Nous y restons pendant une\
    \ heure pour acheter des produits locaux. \n\nThomas travaille beaucoup, alors il est souvent fatigué.\
    \ Il a travaillé dans un bureau à Montréal pendant cinq ans avant de déménager ici. Maintenant, il\
    \ veut prendre plus de temps pour sa famille. \n\nCe soir, nous allons souper ensemble. Nous avons\
    \ prévu de rester à la maison pour la soirée. Nous allons cuisiner un bon repas et regarder un film.\
    \ Je vais dormir pendant huit heures après le souper parce que je dois travailler tôt demain matin."
  translation_en: |-
    My name is Marc and I have lived in Quebec City for two years. I love my life here, especially in the fall. Every Saturday morning, I go to the market with my friend Thomas. We stay there for one hour to buy local products.

    Thomas works a lot, so he is often tired. He worked in an office in Montreal for five years before moving here. Now, he wants to take more time for his family.

    Tonight, we are going to have supper together. We planned to stay at home for the evening. We are going to cook a good meal and watch a movie. I am going to sleep for eight hours after supper because I have to work early tomorrow morning.
