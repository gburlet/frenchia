- type: explanation
  id: explanation
  heading: Les animaux – Vocabulary for Everyday Life (A2)
  body: "In this lesson you’ll learn the most common **domestic** and **wild** animals you’ll encounter\
    \ in Québec.  The list is intentionally short, so you can focus on pronunciation, gender, and the\
    \ little quirks that differ from European French.\n\n### Gender and articles\nAll animal nouns have\
    \ a gender, just like other nouns.  In Québec French the article **le / la** is used exactly as in\
    \ France, but you’ll often hear the **familiar** form *c’* when the noun follows a verb: *j’ai vu\
    \ **c’** orignal* (I saw **the** moose).  Remember to keep the article in the written form; the spoken\
    \ contraction is only informal.\n\n### Core vocabulary\n- **le chien** – dog (domestic) \n- **le chat**\
    \ – cat \n- **la vache** – cow \n- **le cochon** – pig \n- **l’orignal** – moose (wild) – *Note: the\
    \ *l’* is used because the word begins with a vowel sound.*\n- **le castor** – beaver \n- **le huard**\
    \ – loon (diving bird) \n- **le maringouin** – mosquito (Québec word; France: *un moustique*)\n\n\
    ### Using the nouns in sentences\n- **J’ai un chien qui s’appelle Max.** – I have a dog named Max.\n\
    - **Le castor construit un barrage.** – The beaver builds a dam.\n- **Ce soir, on va chasser le maringouin\
    \ avec un spray.** – Tonight we’ll swat the mosquito with spray.\n\n### Common pitfalls\n1. **Confusing\
    \ gender** – English speakers often assume *le* for all animals because English has no gender.  Memorise\
    \ the article with the noun (e.g., *la vache*, not *le vache*).  A handy trick is to picture the animal\
    \ with a colour: *la vache* = *la* **blanche** (white).\n2. **Using “un/une” instead of the definite\
    \ article** – When you’re talking about a specific animal you’ve just seen, use **le / la** (or **l’**).\
    \  *J’ai vu **le** orignal* is correct; *J’ai vu **un** orignal* sounds like you’re talking about\
    \ any moose in general.\n\nPractice pairing each animal with its article and a simple verb.  Once\
    \ you’re comfortable, try swapping the article for a **familiar** *c’* in spoken practice to sound\
    \ more natural in Québec."
