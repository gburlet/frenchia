- id: ex-06
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the correct gender article for the animal?
  options:
  - J’ai vu le orignal près du lac.
  - J’ai vu l’orignal près du lac.
  - J’ai vu l’orignaux près du lac.
  - J’ai vu la orignal près du lac.
  answer_index: 1
  explanation: ‘Orignal’ is masculine and singular. The definite article *le* becomes *l’* before a vowel,
    so the correct form is **J’ai vu l’orignal près du lac.** Option 1 lacks the required elision (it
    keeps the full *le* before a vowel). Option 3 wrongly makes *orignal* plural (*l’orignaux*). Option 4
    uses the feminine article *la*, which is incorrect because *orignal* is masculine. The only correct
    sentence is the one with *l’orignal*.
- id: ex-07
  grammar_topics: []
  type: multiple_choice
  question: Which sentence correctly uses the past participle agreement with the auxiliary *avoir*?
  options:
  - J’ai vu les renards gris traversé la route.
  - J’ai vu un renard gris traverser la route.
  - J’ai vu des renards gris traversés la route.
  - J’ai vu le renard gris traversée la route.
  answer_index: 1
  explanation: When *voir* is followed directly by an infinitive (*traverser*), the past participle *vu*
    does **not** agree with the direct object; it remains invariable. Agreement would occur only in a
    construction such as *les renards que j’ai vus traverser*, where the object (*les renards*) precedes
    the verb *avoir*. In the sentences above the object follows *voir*, so the correct form is the invariable
    *vu*. Option **B** (index 1) – *J’ai vu un renard gris traverser la route* – follows this rule and
    also matches the singular animal from the vocabulary list.
