sections:
- type: explanation
  id: explanation
  heading: Les animaux – Vocabulary for Everyday Life (A2)
  body: 'In this lesson you’ll learn the most common **domestic** and **wild** animals you’ll encounter
    in Québec. The list is intentionally short, so you can focus on pronunciation, gender, and the little
    quirks that differ from European French.  ### Gender and articles  All animal nouns have a gender,
    just like other nouns. In Québec French the articles **le / la** are used exactly as in France. When
    a noun begins with a vowel or a mute *h*, the article is elided to **l’** (e.g., *l’orignal*).  ###
    Core vocabulary  - **le chien** – dog (domestic)  - **le chat** – cat  - **la vache** – cow  - **le
    cochon** – pig  - **l’orignal** – moose (wild) – *Note: the *l’* is used because the word begins with
    a vowel sound.*  - **le castor** – beaver  - **le huard** – loon (diving bird)  - **le maringouin**
    – mosquito (Québec word; France: *un moustique*)  ### Using the nouns in sentences  - **J’ai un chien
    qui s’appelle Max.** – I have a dog named Max.  - **Le castor construit un barrage.** – The beaver
    builds a dam.  - **Ce soir, on va chasser le maringouin avec un spray.** – Tonight we’ll chase away
    the mosquito with a spray.  ### Common pitfalls  1. **Confusing gender** – English speakers often
    assume *le* for all animals because English has no gender. Memorise the article with the noun (e.g.,
    *la vache*, not *le vache*).  2. **Using “un/une” versus the definite article** – Use **un/une** when
    you mention an animal for the first time or when you refer to an unspecified animal (e.g., *J’ai vu
    un orignal*). Use **le / la / l’** when you are talking about a specific, known animal (e.g., *J’ai
    vu l’orignal*).'
