- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Animals in everyday talk'
  body: 'In Québec the animal vocabulary you’ll meet in daily life often reflects the local wildlife and
    the colloquial terms that have become part of the regional lexicon. The most noticeable difference
    is the word for mosquito: Québécois say **maringouin**, whereas in France the standard term is **moustique**.
    There are a few other regionalisms as well: the bird known in Québec as **huard** is called **plongeon**
    in France, and the large forest animal **orignal** (moose) is referred to as **élan** in France. The
    rest of the list (chien, chat, vache, cheval, cochon, castor, renard, lapin, oiseau, poisson, ours)
    is shared between the two varieties, so you won’t notice a change in wording.  **Québec / France /
    English variants** 1. maringouin / moustique / mosquito 2. (no difference) chien / chien / dog 3.
    (no difference) chat / chat / cat 4. (no difference) vache / vache / cow 5. (no difference) cheval / cheval / horse
    6. (no difference) cochon / cochon / pig 7. (no difference) castor / castor / beaver 8. huard / plongeon / loon
    9. (no difference) renard / renard / fox 10. (no difference) lapin / lapin / rabbit 11. (no difference) oiseau / oiseau / bird
    12. (no difference) poisson / poisson / fish 13. (no difference) ours / ours / bear 14. orignal / élan / moose'
