- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Animals in everyday talk'
  body: "In Québec the animal vocabulary you’ll meet in daily life often reflects the local wildlife and\
    \ the colloquial terms that have become part of the regional lexicon. The biggest difference is the\
    \ word for mosquito: Québécois say **maringouin**, whereas in France the standard term is **moustique**.\
    \ Another regionalism is **l’orignal** for the large North‑American elk; in France the same animal\
    \ is usually called **élan**. The rest of the list (chien, chat, vache, cheval, cochon, castor, huard,\
    \ renard, lapin, oiseau, poisson, sanglier) is shared between the two varieties, so you won’t notice\
    \ a change in wording.  \n\n**Québec / France / English variants**\n1. maringouin / moustique / mosquito\n\
    2. orignal / élan / elk\n3. (no difference) chien / chien / dog\n4. (no difference) chat / chat / cat\n\
    5. (no difference) castor / castor / beaver\n6. (no difference) huard / huard / loon\n\nThese six\
    \ points give you a quick reference for the terms that change when you move from France to Québec."
