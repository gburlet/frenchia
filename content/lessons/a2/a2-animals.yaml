- type: reading
  id: reading
  title: Une promenade au parc de la rivière
  passage_fr: Samedi matin, je suis allé au parc de la rivière avec ma sœur et notre **chien**, Milo.
    Nous avons fait un petit pique-nique près du sentier où le **castor** construisait son nouveau barrage.
    Au loin, on a entendu le cri du **huard** qui plongeait dans l’eau. Un **orignal** majestueux est
    apparu derrière les arbres et a brouté de l’herbe pendant quelques minutes. Pendant que nous mangions
    nos sandwichs, des **maringouins** bourdonnaient autour de la nappe. Plus tard, un **renard** roux
    a traversé le chemin, suivi d’un **lapin** blanc qui s’est caché dans les **buissons**. Le parc était
    plein de vie, et j’ai aimé observer ces animaux sauvages tout en profitant du soleil de la fin de
    semaine.
  translation_en: Saturday morning, I went to the river park with my sister and our dog, Milo. We had
    a little picnic near the trail where the beaver was building its new dam. In the distance we heard
    the cry of a loon diving into the water. A majestic moose appeared behind the trees and grazed on
    the grass for a few minutes. While we were eating our sandwiches, mosquitoes buzzed around the blanket.
    Later, a red fox crossed the path, followed by a white rabbit that hid in the bushes. The park was
    full of life, and I loved watching these wild animals while enjoying the weekend sunshine.
