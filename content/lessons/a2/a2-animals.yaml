- id: ex-06
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the correct gender article for the animal?
  options:
  - J’ai vu le orignal près du lac.
  - J’ai vu l’orignal près du lac.
  - J’ai vu c’ l’orignal près du lac.
  - J’ai vu les orignaux près du lac.
  answer_index: 1
  explanation: ‘Orignal’ is masculine and singular. The correct article is *le*, which contracts to *l’*
    before a vowel. The sentence **J’ai vu l’orignal près du lac.** uses the proper article and agreement.
    The other options either misuse the article, add the inappropriate familiar form *c’*, or use the
    plural form *les orignaux* which does not match the singular context of the sentence.
- id: ex-07
  grammar_topics: []
  type: multiple_choice
  question: Which sentence correctly uses the past participle agreement with the auxiliary *avoir*?
  options:
  - J’ai vu les renards gris traversé la route.
  - J’ai vu un renard gris traverser la route.
  - J’ai vu des renards gris traversés la route.
  - J’ai vu le renard gris traversée la route.
  answer_index: 1
  explanation: When *voir* is followed by an infinitive (*traverser*), the past participle *vu* never
    agrees with the direct object; it stays invariable. Only option **B** (index 1) respects this rule
    and also matches the singular animal from the vocabulary list (*un renard gris*). The other options
    add an incorrect –e or –s ending to *vu* or to the infinitive, which is not allowed with the auxiliary
    *avoir* in this construction. The key point is that *vu* does not take an –e or –s ending here.
