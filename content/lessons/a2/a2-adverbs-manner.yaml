- type: reading
  id: reading
  title: Une fin de semaine occupée
  passage_fr: "C'est la fin de semaine et ma famille et moi sommes très occupés. Samedi matin, mon père\
    \ prépare le déjeuner lentement parce qu'il aime prendre son temps. Ma mère travaille sérieusement\
    \ dans le jardin pour planter des fleurs. Moi, je magasine des vêtements pour une fête. Je marche\
    \ rapidement dans le centre-ville parce qu'il fait froid. \n\nL'après-midi, nous allons au dépanneur\
    \ pour acheter des boissons. Mon frère conduit prudemment, même si la route est glissante. Le soir,\
    \ nous mangeons ensemble. Ma mère a bien cuisiné un délicieux repas. Heureusement, nous avons beaucoup\
    \ de temps pour discuter. Nous parlons doucement pour ne pas réveiller le chien. C'est une journée\
    \ fatigante, mais nous sommes très heureux."
  translation_en: |-
    It's the weekend and my family and I are very busy. Saturday morning, my father prepares breakfast slowly because he likes to take his time. My mother is working seriously in the garden to plant flowers. Me, I am shopping for clothes for a party. I am walking quickly in the downtown area because it is cold.

    In the afternoon, we go to the convenience store to buy drinks. My brother drives carefully, even though the road is slippery. In the evening, we eat together. My mother cooked a delicious meal well. Fortunately, we have plenty of time to chat. We speak softly so as not to wake the dog. It is a tiring day, but we are very happy.
  glossary:
