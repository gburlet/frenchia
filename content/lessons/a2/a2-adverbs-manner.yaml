sections:
- type: explanation
  id: explanation
  heading: 'How to Describe Actions: Les adverbes de manière'
  body: 'In French, adverbs of manner tell us *how* an action is performed. They are the equivalent of
    the English “‑ly” adverbs (e.g., slowly, quickly).  ⟶  **The -ment Rule**  ⟶  Most French adverbs
    are formed by taking the feminine form of the adjective and adding the suffix **-ment**.  ⟶  *Lente*
    (slow) → *lente* + *ment* = **lentement** (slowly)  ⟶  *Heureux* (happy) → *heureuse* + *ment* = **heureusement**
    (fortunately)  ⟶  *Attentif* (attentive) → *attentive* + *ment* = **attentivement**  ⟶  **Irregular
    Adverbs**  ⟶  Some common adverbs do not follow this rule and must be memorized. The most important
    ones are:  ⟶  - **Bien** (well)  ⟶  - **Mal** (badly)  ⟶  - **Vite** (fast/quickly)  ⟶  **Placement
    and Pitfalls**  ⟶  In a standard sentence, the adverb usually follows the conjugated verb.  ⟶  - *Il
    parle **lentement**.* (He speaks slowly.)  ⟶  - *Elle chante **bien**.* (She sings well.)  ⟶  **Common
    Pitfalls for English Speakers:**  ⟶  1. **The “‑ly” trap:** English speakers often try to translate
    words literally. For example, do not say *rapidement* if you mean “fast” in a casual context; while
    correct, **vite** is much more common in daily conversation.  ⟶  2. **Adjective vs. adverb:** Remember
    that in French you cannot use an adjective to describe a verb. You cannot say *Il parle lent*; you
    must use the adverb **lentement**.  ⟶  *Note: In Québec, adverbs of manner are used the same way as
    in France. For example, you might hear “Elle magasine **vite**” (She shops quickly).*'
