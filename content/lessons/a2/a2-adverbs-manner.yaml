- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Adverbs of Manner'
  body: In terms of grammar, the formation of adverbs of manner (using the -ment suffix) is identical
    in both Québec and France. You will use the same rules to describe how someone speaks, works, or moves.
    However, the vocabulary you choose to describe those actions can vary. For example, when describing
    how you do your shopping, a Québécois might use a specific verb that doesn't exist in France. Additionally,
    while 'bien' and 'mal' are universal, the context of the meals you are preparing (like 'le souper')
    will naturally shift the setting of your sentences. Overall, the grammar remains consistent, but the
    local flavor comes from the surrounding nouns and verbs.
