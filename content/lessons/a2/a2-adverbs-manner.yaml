    example_en: I am going shopping at the mall.
  - fr: dépanneur
    en: convenience store (Québec usage; in France, one would say 'une épicerie de quartier' or 'une supérette')
    pos: noun
    gender: m
    region: qc
    formality: standard
    example_fr: Il y a un dépanneur au coin de la rue.
    example_en: There is a convenience store on the corner of the street.
  - fr: glissante
    en: slippery
    pos: adjective
    gender: f
    region: fr
    formality: standard
    example_fr: La route est glissante à cause de la glace.
    example_en: The road is slippery because of the ice.
  - fr: fatigante
    en: tiring
    pos: adjective
    gender: f
    region: fr
    formality: standard
    example_fr: C'est une journée très fatigante.
    example_en: It is a very tiring day.
