  - Elle parle doucement parce que le bébé dormir.
  answer_index: 0
  explanation: 'The correct sentence is **« Elle parle doucement parce que le bébé dort »** (She speaks
    softly because the baby is sleeping). -> *dort* is the present‑tense, third‑person singular form of
    **dormir** and agrees with the singular subject **le bébé**. -> The sentence uses the conjunction
    **parce que** to introduce a cause, which is the appropriate structure here. -> **Option 2** is incorrect
    because **la bébé** mixes a feminine article with a masculine noun; the correct article is **le**.
    -> **Option 3** is incorrect because **dorment** is the third‑person plural form, but **le bébé**
    is singular. -> **Option 4** is incorrect because **dormir** is the infinitive; the sentence needs
    a conjugated verb. (The rule: the verb after *parce que* must be conjugated to match the subject’s
    person and number.)'
