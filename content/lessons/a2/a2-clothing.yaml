- type: explanation
  id: explanation
  heading: '# Les vêtements – Clothing (A2 Vocabulary)'
  body: |-
    ***

    In this short A2 lesson you’ll learn the most common Québec words for everyday garments and the verbs you need to talk about what you’re wearing or what you want to buy.

    No new grammar is introduced – you simply use the present-tense forms of **porter** (to wear), **mettre** (to put on), **acheter** (to buy) and **essayer** (to try on) with the clothing nouns.

    You can also use **avoir besoin de** when you need something.

    ### Core vocabulary (Québec vs. France)

    | Québec term | English | French (France) |
    | ------------- | --------- | ----------------- |
    | **le chandail** | sweater, jersey | le pull / le maillot |
    | **la tuque** | knit winter hat | le bonnet |
    | **les mitaines** | mittens | les moufles |
    | **les bas** | socks | les chaussettes |
    | **magasiner** (v.) | to shop | faire du shopping / faire les magasins |

    ### Using the words

    - **Je porte un chandail bleu.** – *I am wearing a blue sweater.*

    - **Elle a acheté une tuque rouge.** – *She bought a red knit hat.*

    - **Nous aimons magasiner les fins de semaine.** – *We like to shop on weekends.*

    - **Tu as besoin de nouvelles mitaines?** – *Do you need new mittens?*

    - **Ils portent des bas noirs avec leurs chaussures.** – *They wear black socks with their shoes.*

    ### Pitfalls to avoid

    1. **Bas vs. chaussettes** – In Québec **bas** is the ordinary word for socks of any kind (France: **chaussettes**).

    There is no need to distinguish thin, dressy, or athletic socks.

    2. **Magasiner vs. faire du shopping** – *Magasiner* is perfectly natural in Québec but can sound odd in France if over-used.

    When speaking to a European French speaker, you may switch to *faire du shopping* or *faire les magasins*.

    ### Practice activity

    Complete the sentences with an appropriate verb (porter, mettre, acheter, essayer, avoir besoin de) and a clothing noun from the list above.

    1. *Je ___ un ___ gris.*

    2. *Nous ___ souvent des ___ quand il fait froid.*

    3. *Elle ___ une ___ pour la fête.*

    4. *Tu ___ ___ pour la randonnée?*

    5. *Ils ___ des ___ neufs après le lavage.*

    ***
