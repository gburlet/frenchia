- type: reading
  id: reading
  title: Une après-midi de magasinage
  passage_fr: C’est samedi après-midi et je suis allé(e) magasiner au centre commercial du quartier. D’abord,
    je suis passé(e) dans le magasin de vêtements pour essayer un nouveau **chandail** gris. Il était
    très doux, alors je l’ai acheté avec un **jean** noir. Ensuite, j’ai cherché une **tuque** en laine
    parce qu’il commence à faire froid. Le vendeur m’a montré plusieurs modèles ; j’ai choisi une **tuque**
    à rayures rouges. En sortant, j’ai vu une paire de **bas** en coton qui allait bien avec mes chaussures.
    J’ai aussi regardé les **mitaines** pour l’hiver, mais j’ai préféré garder mes **gants** en cuir.
    Avant de partir, je me suis rappelé de prendre ma **ceinture** pour le pantalon que je porterai demain
    au travail. C’était une belle fin de semaine de magasinage !
  translation_en: It’s Saturday afternoon and I went shopping at the neighbourhood mall. First, I stopped
    in the clothing store to try on a new grey sweater. It was very soft, so I bought it together with
    a black pair of jeans. Then I looked for a wool knit hat because it’s starting to get cold. The salesperson
    showed me several models; I chose a red-striped hat. On the way out I saw a pair of cotton socks that
    would go well with my shoes. I also looked at the mittens for winter, but I decided to keep my leather
    gloves. Before leaving I remembered to take my belt for the pants I’ll wear tomorrow at work. It was
    a nice weekend of shopping!
