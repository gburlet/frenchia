- type: reading
  id: reading
  title: Une après-midi au centre commercial
  passage_fr: C’était samedi après-midi et je suis allé(e) **magasiner** au centre commercial du quartier.
    D’abord, je suis passé(e) dans le magasin de vêtements pour essayer un nouveau **chandail** gris.
    Il était très doux, alors je l’ai acheté avec un **jean** noir. Ensuite, j’ai cherché une **écharpe**
    en laine parce qu’il commençait à faire frais. Le vendeur m’a montré plusieurs modèles ; j’ai choisi
    une **écharpe** à rayures rouges. En sortant, j’ai vu une paire de **bas** en coton qui allait bien
    avec mes chaussures. J’ai aussi regardé les **gants** d’hiver, mais j’ai préféré garder mes **gants**
    en cuir. Avant de partir, j’ai acheté une **ceinture** pour le pantalon que je porterai demain au
    travail. C’est une belle **fin de semaine** pour **magasiner** !
  translation_en: It was Saturday afternoon and I went shopping at the neighbourhood mall. First, I stopped
    in the clothing store to try on a new grey sweater. It was very soft, so I bought it together with
    a black pair of jeans. Then I looked for a wool scarf because it was starting to get chilly. The salesperson
    showed me several models; I chose a red-striped scarf. On the way out I saw a pair of cotton socks
    that would go well with my shoes. I also looked at winter gloves, but I decided to keep my leather
    gloves. Before leaving I bought a belt for the pants I’ll wear tomorrow at work. It’s a nice weekend
    for shopping!
