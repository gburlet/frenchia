- type: reading
  id: reading
  title: Une fin de semaine au parc
  passage_fr: Samedi, ma sœur et moi avons décidé de profiter de la belle météo. Après le déjeuner, on
    est passés au dépanneur pour acheter des muffins et du jus de canneberge. « C’est le fun », a dit
    ma sœur en voyant le soleil. On a ensuite marché jusqu’au parc du Plateau où on a trouvé un coin tranquille.
    On s’est tiré une bûche sous un grand arbre, on a sorti nos sandwichs et on a commencé à parler des
    souvenirs de la fin de semaine passée. Pendant qu’on mangeait, mon frère est arrivé en vélo, tout
    essoufflé. « J’ai la chienne ! », a-t-il crié, parce qu’un gros chien le poursuivait dans le parc.
    Après le souper, on a **jasé** en regardant les étoiles. « C’est correct comme ça », a conclu ma mère
    quand on a rangé nos affaires. La fin de semaine était vraiment **le fun**!
  translation_en: Saturday, my sister and I decided to take advantage of the beautiful weather. After
    breakfast, we stopped at the corner store to buy muffins and cranberry juice. “That’s great,” my sister
    said when she saw the sun. Then we walked to the Plateau park where we found a quiet spot. We pulled
    up a chair under a big tree, took out our sandwiches and started talking about the memories of the
    past weekend. While we were eating, my brother arrived on his bike, all out of breath. “I’m scared!”
    he shouted, because a big dog was chasing him in the park. After supper we **chatted** while watching
    the stars. “That’s fine as it is,” my mother concluded when we packed up our things. The weekend was
    really **a lot of fun**!
  glossary:
  - fr: essoufflé
    en: out of breath, winded
    pos: adjective
    gender: m
    region: common
    formality: standard
    example_fr: Il était essoufflé après la course.
    example_en: He was out of breath after the run.
  - fr: muffin
    en: muffin (a common snack sold at dépanneurs)
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: J’ai acheté un muffin au dépanneur.
    example_en: I bought a muffin at the corner store.
  - fr: jaser
    en: to chat, to talk informally
    pos: verb
    region: qc
    formality: familiar
    example_fr: On a jasé pendant des heures.
    example_en: We chatted for hours.
exercises:
- id: ex-01
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the expression c’est le fun correctly?
  options:
  - C’est le fun de regarder la neige tomber.
  - C’est le fun que tu vas au dépanneur.
  - C’est le fun que tu viens demain.
  - C’est le fun à regarder la neige tombe.
  answer_index: 0
  explanation: 'In Québec French the idiom **c’est le fun** can be followed by **de + infinitif** (e.g.,
    *c’est le fun de …*) or by **que + subjunctive** (e.g., *c’est le fun que tu aies trouvé…*). Option 0
    follows the first pattern and is therefore correct: *C’est le fun de regarder la neige tomber.* Options 1
    and 2 use **que** but are followed by the indicative (*tu vas*, *tu viens*), which is not grammatical
    with this expression. Option 3 uses an incorrect construction (**à + infinitif**). Hence, only option 0
    is correct.'
