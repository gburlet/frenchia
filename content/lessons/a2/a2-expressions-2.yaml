- type: reading
  id: reading
  title: Une journée au bureau
  passage_fr: 'Jeudi matin, je suis arrivé au bureau en retard. J’ai dû **mettre la gomme** pour rattraper
    le temps perdu, mais dès que j’ai ouvert ma **boîte courriel**, j’ai vu que le patron avait ajouté
    un nouveau projet très compliqué. Immédiatement, **j’avais les nerfs en boule** après avoir passé
    deux heures dans les embouteillages. J’ai essayé de rester calme, mais mon collègue Marc a commencé
    à **jaser** à propos du nouveau client et à raconter des blagues. « C’est correct comme ça », a-t-il
    dit, en essayant de détendre l’atmosphère. Au moment où le téléphone a sonné, j’ai dû **mettre la
    gomme** pour répondre rapidement, sinon le client aurait pensé que nous n’étions pas disponibles.
    Après la réunion, je me suis senti un peu **en beau joual vert** parce que le rapport devait être
    fini pour vendredi. Le soir même, **je suis sorti** avec des amis et **nous avons pris une brosse**.
    Le lendemain, vendredi, pour changer d’air, je suis allé travailler à la bibliothèque du centre-ville.
    En rentrant, j’ai croisé Sophie qui m’a demandé comment ça se passait. « C’est plate », ai-je répondu,
    parce que le travail était épuisant, mais elle m’a encouragé en disant que **la fin de semaine** arriverait
    bientôt. Finalement, j’ai terminé le rapport, j’ai **pris une pause café**, et j’ai pu dire : « C’est
    correct ! » avant de quitter le bureau.'
  translation_en: Thursday morning I arrived at the office late. I had to **step on it** to make up for
    lost time, but as soon as I opened my **email inbox** I saw that the boss had added a new, very complicated
    project. Immediately, **I was irritated** after having spent two hours in traffic. I tried to stay
    calm, but my coworker Marc started **chatting** about the new client and telling jokes. “It’s fine
    as it is,” he said, trying to lighten the mood. When the phone rang I had to **step on it** to answer
    quickly, otherwise the client would have thought we weren’t available. After the meeting I felt a
    bit **furious** because the report had to be finished by Friday. That same evening I **went out**
    with friends and **we got drunk**. The next day, Friday, to change the scenery, I went to work at
    the downtown library. On the way back I ran into Sophie, who asked me how things were going. “That’s
    boring,” I replied, because the work was exhausting, but she encouraged me by saying that **the weekend**
    was coming soon. Finally I finished the report, **took a coffee break**, and was able to say, “It’s
    fine!” before leaving the office.
