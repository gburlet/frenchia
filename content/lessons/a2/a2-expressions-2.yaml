sections:
- type: explanation
  id: explanation
  heading: Expressions québécoises (2) – Everyday sayings you’ll hear on the streets of Québec
  body: |-
    ### Introduction  In this second set of everyday Québec expressions you’ll meet ten idioms that are used in casual conversation, especially in the **fam** (familiar) register. Like the first lesson, the focus is on *understanding* the meaning and *recognising* the context; there is no new grammar to master.  ---

    ### Idioms table

    | # | Québec expression | Literal translation | English equivalent (meaning) |
    | --- | ------------------- | -------------------- | ------------------------------ |
    | 1 | **c’est le fun** | it’s the fun | that’s great / that’s cool |
    | 2 | **avoir la chienne** | to have the dog | to be scared |
    | 3 | **se tirer une bûche** | to pull a log | to pull up a chair / sit down |
    | 4 | **c’est correct** | it’s correct | that’s fine / that’s okay |
    | 5 | **être en beau joual vert** | to be in beautiful green slang | to be furious |
    | 6 | **niaiser quelqu’un** | to tease someone | to tease / pull someone’s leg |
    | 7 | **mettre la gomme** | to put the gum | to speed up, go fast |
    | 8 | **avoir les nerfs en boule** | to have the nerves in a ball | to be very angry |
    | 9 | **faire du pouce** | to do thumb | to hitchhike |
    | 10 | **prendre une brosse** | to take a brush | to get drunk |

    ### How to use them

    - Most of these expressions are *fam* and appear in informal speech among friends or family. When you write a polite email or speak to a stranger, replace them with the standard equivalents (e.g., *c’est super* instead of *c’est le fun*).

    - The verb **avoir** is often used with a noun that isn’t literally possessed (e.g., *avoir la chienne*). The noun keeps its gender and number, but the meaning is idiomatic.

    - Some expressions involve a *verb-noun* construction that looks like a literal action (*se tirer une bûche*, *mettre la gomme*). The whole phrase functions as a single verb phrase; you do **not** add a separate object.

    ### Common pitfalls

    1. **Over-using familiar forms** – English speakers tend to sprinkle *fam* expressions everywhere. In Québec, using *c’est le fun* with a professor or a client can sound overly casual.

    2. **Literal translation** – Trying to translate word-for-word often leads to confusion. For instance, *avoir les nerfs en boule* does **not** mean “to have a ball of nerves” in a physical sense; it means *to be very angry*.

    3. **Mixing registers** – Keep the idiom in the same register as the rest of your sentence. If the surrounding language is neutral, you may want to replace the idiom with a standard synonym.

    ### Practice tip

    Listen for these idioms in Québec radio or TV clips, and try inserting one or two into your own short dialogues. You’ll sound more natural and understand locals much better!
