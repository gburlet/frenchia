exercises:
- id: ex-01
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the expression c’est le fun correctly?
  options:
  - C’est le fun de regarder la neige tomber.
  - C’est le fun que tu vas au magasin.
  - C’est le fun que tu viens demain.
  - C’est le fun à regarder la neige tombe.
  answer_index: 0
  explanation: 'In Québec French the idiom **c’est le fun** can be followed by **de + infinitif** (e.g.,
    *c’est le fun de …*) or by **que + subjunctive** (e.g., *c’est le fun que tu aies trouvé…*). Option 0
    follows the first pattern and is therefore correct: *C’est le fun de regarder la neige tomber.* Options 1
    and 2 use **que** but are followed by the indicative (*tu vas*, *tu viens*), which is not grammatical
    with this expression. Option 3 uses an incorrect construction (**à + infinitif**). Hence, only option 0
    is correct.'
