- id: ex-03
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses *se tirer une bûche* correctly in the familiar register?
  options:
  - Après le déjeuner, on se tire une bûche au parc.
  - Après le déjeuner, on se tire une bûche pas au parc.
  - Après le déjeuner, on se tire une bûches dans le métro.
  - Après le déjeuner, on se tire un bûche en faisant du ski.
  answer_index: 0
  explanation: '*Se tirer une bûche* (fam.) means “to pull up a chair and sit down to relax.” It must
    be used with the singular noun *bûche* and the correct reflexive construction *se tire*. Only option 0
    respects both the noun-agreement and the idiomatic context. Option 1 is ungrammatical because the
    negative particle *pas* is misplaced (the structure should be *on se tire une bûche au parc*, not
    *pas au parc*). Option 2 contains a noun-agreement mistake (*bûches* instead of *bûche*). Option 3
    uses the wrong article (*un* instead of *une*). Therefore, the correct answer is option 0 (index 0).'
