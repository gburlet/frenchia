- type: reading
  id: reading
  title: Une fin de semaine au parc
  passage_fr: Samedi, ma sœur et moi avons décidé de profiter de la belle météo. Après le déjeuner, on
    est passés au dépanneur pour acheter des pâtés et du jus de canneberge. « C’est le fun », a dit ma
    sœur en voyant le soleil. On a ensuite marché jusqu’au parc du Plateau où on a trouvé un coin tranquille.
    On s’est tiré une bûche sous un grand arbre, on a sorti nos sandwichs et on a commencé à **magasiner**
    les souvenirs du week‑end passé. Pendant qu’on mangeait, mon frère est arrivé en vélo, tout essoufflé.
    « J’ai la chienne ! », a-t-il crié, parce qu’il avait raté le bus. Après le souper, on a **tiré la
    pipe** en regardant les étoiles. « C’est correct comme ça », a conclu ma mère quand on a rangé nos
    affaires. La fin de semaine était vraiment **le fun**!
  translation_en: Saturday, my sister and I decided to take advantage of the beautiful weather. After
    breakfast, we stopped at the corner store to buy meat pies and cranberry juice. “That’s great,” my
    sister said when she saw the sun. Then we walked to the Plateau park where we found a quiet spot.
    We spread a blanket under a big tree, took out our sandwiches and started **shopping** through the
    memories of the past weekend. While we were eating, my brother arrived on his bike, out of breath.
    “I’m scared!” he shouted, because he had missed the bus. After supper we **took a puff** while watching
    the stars. “That’s fine as it is,” my mother concluded when we packed up our things. The weekend was
    really **a lot of fun**!
  glossary:
  - fr: essoufflé
    en: out of breath, winded
    pos: adjective
    gender: m
    region: common
    formality: standard
    example_fr: Il était essoufflé après la course.
    example_en: He was out of breath after the run.
  - fr: pâté
    en: meat pie (a common snack sold at dépanneurs)
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: J’ai acheté un pâté au dépanneur.
    example_en: I bought a meat pie at the corner store.
  - fr: tapis de pique‑nique
    en: picnic blanket
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Nous avons étalé le tapis de pique‑nique sous l’arbre.
    example_en: We spread the picnic blanket under the tree.
exercises:
- id: ex-01
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the expression c’est le fun correctly?
  options:
  - C’est le fun que tu vas au dépanneur.
  - C’est le fun de regarder la neige tomber en été.
  - C’est le fun que tu viens demain.
  - C’est le fun que le train soit en retard.
  answer_index: 1
  explanation: The expression *c’est le fun* means “that’s great / that’s cool” and is followed by a statement
    of something enjoyable. Option 1 (C’est le fun de regarder la neige tomber en été.) follows the correct
    pattern *c’est le fun de + infinitive*.
- id: ex-02
  grammar_topics: []
  type: multiple_choice
  question: What does *avoir la chienne* mean in everyday Québec speech?
  options:
  - To have a pet dog.
  - To be scared or worried.
  - To be angry with someone.
  - To feel hungry.
  answer_index: 1
  explanation: '*Avoir la chienne* is an idiom meaning “to be scared, worried or uneasy.” It does not
    refer to an actual dog (option A) nor to anger or hunger (options C and D).'
- id: ex-03
  grammar_topics: []
  type: multiple_choice
  question: Choose the sentence that correctly uses *se tirer une bûche* in the familiar register.
  options:
  - Après le dîner, on se tire une bûche au parc.
  - Après le souper, on se tire une bûche au parc.
  - Après le déjeuner, on se tire une bûche au parc.
  - Après le déjeuner, on se tire une bûche dans le dépanneur.
  answer_index: 1
  explanation: '*Se tirer une bûche* means “to sit down and relax, usually outdoors.” It is most naturally
    paired with *déjeuner* when talking about a casual outdoor break. The other sentences are odd: using
    *dîner* or *souper* for this expression is uncommon, and a dépanneur is a convenience store, not a
    place to sit and relax.'
