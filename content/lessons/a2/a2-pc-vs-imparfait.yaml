- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Narrating the Past'
  body: In terms of grammar, the rules for choosing between the *passé composé* and the *imparfait* are
    identical in both Québec and France. Both regions use the *imparfait* for descriptions and habits
    and the *passé composé* for completed actions. What does change is the everyday vocabulary that speakers
    use. In Québec, the three daily meals are called **déjeuner** (breakfast), **dîner** (lunch) and **souper**
    (supper), whereas in France they are **petit-déjeuner**, **déjeuner** and **dîner**. Likewise, the
    weekend is usually referred to as **la fin de semaine** in Québec, while in France people say **le
    week-end**. Apart from these lexical differences, the way you form past tenses is the same everywhere.
