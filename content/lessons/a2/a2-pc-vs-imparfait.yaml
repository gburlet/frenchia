- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Narrating the Past'
  body: In terms of grammar, the rules for choosing between the *passé composé* and the *imparfait* are
    identical in both Québec and France. Both regions use the *imparfait* for descriptions and habits
    and the *passé composé* for completed actions. However, the vocabulary you choose to describe those
    actions will change based on where you are. For example, if you were describing a past habit, a person
    in France might say they went to the 'boulangerie' every morning, while a Québécois person would naturally
    use 'la boulangerie' or 'l'épicerie' depending on the context. Similarly, the specific nouns for meals
    or daily errands will reflect local culture. The underlying 'cinematography' of the past remains the
    same; only the props and setting change.
