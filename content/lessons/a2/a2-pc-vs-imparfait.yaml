- type: reading
  id: reading
  title: Une sortie au musée d'art
  passage_fr: |-
    Le mois dernier, je suis allé au musée d'art avec ma famille. Il faisait frais et la lumière du soleil traversait les grandes fenêtres. C'était impressionnant ! Quand nous sommes arrivés, il y avait beaucoup de visiteurs. Les gens discutaient doucement et les enfants couraient entre les salles.

    Ma mère achetait des billets pendant que mon père cherchait le plan du musée. Je me souvenais de mes sorties scolaires : on visitait toujours les expositions temporaires. Soudain, un guide a commencé à parler de la peinture impressionniste. Tout le monde a écouté attentivement. J'ai pris une photo de ma sœur qui souriait devant un tableau. C'était une journée mémorable. Nous avons bien mangé au café du musée et nous avons passé une excellente fin de semaine.
  translation_en: |-
    Last month, I went to the art museum with my family. It was cool and the sunlight streamed through the big windows. It was impressive! When we arrived, there were many visitors. People were talking quietly and the children were running between the rooms.

    My mother was buying tickets while my father was looking for the museum map. I remembered my school trips: we always visited the temporary exhibitions. Suddenly, a guide started talking about Impressionist painting. Everyone listened carefully. I took a photo of my sister who was smiling in front of a painting. It was a memorable day. We ate well at the museum café and had an excellent weekend.
