sections:
- type: explanation
  id: explanation
  heading: 'Navigating the Past: When to use Passé Composé vs. Imparfait'
  body: "In French, choosing between the *passé composé* and the *imparfait* is one of the biggest hurdles\
    \ for learners. Think of it like cinematography: the *imparfait* is the scenery and the atmosphere,\
    \ while the *passé composé* is the action.\n\n**The Imparfait (The Background)**\nUse the *imparfait*\
    \ to describe ongoing actions, habits, descriptions, or states of being in the past. It answers the\
    \ question 'What was happening?' or 'What was it like?'. \n- *Habit:* **Je mangeais souvent des bleuets\
    \ en été.** (I used to eat blueberries often in summer.)\n- *Description:* **Il faisait beau et le\
    \ soleil brillait.** (The weather was nice and the sun was shining.)\n- *Ongoing action:* **Je regardais\
    \ la télé quand le téléphone a sonné.** (I was watching TV when the phone rang.)\n\n**The Passé Composé\
    \ (The Action)**\nUse the *passé composé* for completed actions that happened at a specific moment.\
    \ It moves the story forward. It answers the question 'What happened?'\n- *Completed action:* **J'ai\
    \ acheté mon nouveau char hier.** (I bought my new car yesterday.)\n- *Series of events:* **Je suis\
    \ allé au dépanneur, puis j'ai acheté du lait.** (I went to the convenience store, then I bought milk.)\n\
    \n**Common Pitfalls for English Speakers**\n1. **Overusing the Passé Composé for Descriptions:** Because\
    \ the English simple past covers both completed actions and background descriptions, learners often\
    \ use the *passé composé* for everything. However, for descriptions, you must use the *imparfait*:\
    \ **Il faisait froid** (It was cold) vs. **Il a fait froid** (It got cold / It was cold for a specific\
    \ duration).\n2. **The 'State of Being' Trap:** Words like *être*, *avoir*, and *paraître* are almost\
    \ always in the *imparfait* when describing a state (e.g., **J'étais fatigué**), but in the *passé\
    \ composé* when they represent a sudden change (e.g., **Je suis devenu fatigué** - I became tired)."
