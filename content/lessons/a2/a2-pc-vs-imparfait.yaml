sections:
- type: explanation
  id: explanation
  heading: 'Navigating the Past: When to use Passé Composé vs. Imparfait'
  body: 'In French, choosing between the *passé composé* and the *imparfait* is one of the biggest hurdles
    for learners. Think of it like cinematography: the *imparfait* is the scenery and the atmosphere,
    while the *passé composé* is the action.  <br><br>**The Imparfait (The Background)**<br>Use the *imparfait*
    to describe ongoing actions, habits, descriptions, or states of being in the past. It answers the
    question “What was happening?” or “What was it like?”.<br>- *Habit:* **Je mangeais souvent des bleuets
    en été.** (I used to eat blueberries often in summer.)<br>- *Description:* **Il faisait beau et le
    soleil brillait.** (The weather was nice and the sun was shining.)<br>- *Ongoing action:* **Je regardais
    la télé quand le téléphone a sonné.** (I was watching TV when the phone rang.)<br><br>**The Passé
    Composé (The Action)**<br>Use the *passé composé* for completed actions that happened at a specific
    moment. It moves the story forward. It answers the question “What happened?”.<br>- *Completed action:*
    **J''ai acheté mon nouveau vélo hier.** (I bought my new bike yesterday.)<br>- *Series of events:*
    **Je suis allé au magasin, puis j''ai acheté du lait.** (I went to the store, then I bought milk.)<br><br>**Common
    Pitfalls for English Speakers**<br>1. **Overusing the Passé Composé for Descriptions:** Because the
    English simple past covers both completed actions and background descriptions, learners often use
    the *passé composé* for everything. However, for descriptions, you must use the *imparfait*: **Il
    faisait froid** (It was cold) vs. **Il a fait froid** (It got cold / It was cold for a specific duration).<br>2.
    **The ‘State of Being’ Trap:** Verbs such as *être* and *avoir* are usually in the *imparfait* when
    they describe a continuing state (e.g., **J''étais fatigué**), but they appear in the *passé composé*
    when they signal a sudden change (e.g., **J''ai eu peur quand j''ai vu le chien** – I got scared when
    I saw the dog).'
