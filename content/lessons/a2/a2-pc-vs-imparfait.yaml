  options:
  - suis allé
  - allais
  - ai allé
  - allais souvent
  answer_index: 1
  explanation: The correct answer is **allais**. This sentence describes a repeated habit in the past
    ('souvent'). In French, habits and ongoing background actions use the *imparfait*. 'Suis allé' is
    the *passé composé* and would imply a specific, completed trip rather than a general habit.
- id: ex-09
  grammar_topics:
  - pc-vs-imparfait
  type: multiple_choice
  question: 'Choose the correct verb form to complete the sentence: « Je lisais tranquillement dans mon
    salon quand soudain, le chat _________ sur la table. »'
  options:
  - sautait
  - sautait soudain
  - a sauté
  - est sauté
  answer_index: 2
  explanation: The correct answer is **a sauté**. Here, « Je lisais » sets the scene (the background action
    in the *imparfait*), and the cat’s jump is a sudden, completed action that interrupts the scene. Sudden
    actions or specific events in a story use the *passé composé* (**a sauté**). The other forms either
    describe a habitual action (*sautait*) or are grammatically incorrect in this context (*est sauté*).
    The phrase *sautait soudain* is not idiomatic French for a single, completed event.  **Key point:**
    use the *passé composé* for an abrupt, one‑time action that interrupts an ongoing *imparfait* scene.
