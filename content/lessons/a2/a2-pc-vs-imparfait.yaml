  id: reading
  title: Une visite à la cabane à sucre
  passage_fr: "L'hiver dernier, je suis allé à la cabane à sucre avec ma famille. Il faisait très froid\
    \ et la neige tombait doucement sur les arbres. C'était magnifique ! Quand nous sommes arrivés, il\
    \ y avait beaucoup de monde. Les gens parlaient fort et les enfants couraient partout. \n\nMa mère\
    \ préparait le déjeuner pendant que mon père installait les tables. Je me souvenais de mes vacances\
    \ d'enfance : on mangeait toujours des crêpes avec beaucoup de sirop d'érable. Soudain, le musicien\
    \ a commencé à jouer de l'accordéon. Tout le monde a commencé à danser. J'ai pris une photo de ma\
    \ sœur qui riait beaucoup. C'était une journée mémorable. On a bien mangé et on a passé une excellente\
    \ fin de semaine."
  translation_en: "Last winter, I went to the sugar shack with my family. It was very cold and the snow\
    \ was falling gently on the trees. It was magnificent! When we arrived, there were many people. People\
    \ were talking loudly and the children were running everywhere. \n\nMy mother was preparing breakfast\
    \ while my father was setting up the tables. I remembered my childhood vacations: we always ate pancakes\
    \ with lots of maple syrup. Suddenly, the musician started to play the accordion. Everyone started\
    \ to dance. I took a photo of my sister who was laughing a lot. It was a memorable day. We ate well\
    \ and had an excellent weekend."
