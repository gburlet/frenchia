sections:
- type: explanation
  id: explanation
  heading: How often do you do it?
  body: "In French, just like in English, we use adverbs of frequency to describe how often an action\
    \ occurs. These words usually sit between the conjugated verb and the infinitive, or immediately after\
    \ the verb in simple tenses.\n\nHere are the most common ones you will need:\n\n- **Toujours** (Always):\
    \ **Je vais toujours au dépanneur le soir.**\n- **Souvent** (Often): **Nous mangeons souvent au resto.**\n\
    - **Parfois** (Sometimes): **Parfois, je vais au cinéma.** (Note: You can also use *quelquefois*).\n\
    - **Rarement** (Rarely): **Il pleut rarement en août.**\n- **Jamais** (Never): **Je ne mange jamais\
    \ de viande.**\n\n**A Common Pitfall: The Double Negative**\nOne of the biggest hurdles for English\
    \ speakers is the word **jamais**. In English, we say \"I never eat meat.\" In French, you cannot\
    \ just say \"Je jamais mange de viande.\" You must use the two-part negation: **ne + [verb] + jamais**.\
    \ \n\n*Example:* **Je ne regarde jamais la télé.** (I never watch TV.)\n\n**Placement Tip:**\nFor\
    \ most of these adverbs, the rule is simple: place them after the verb. However, if you have a compound\
    \ tense (like the *passé composé*), place the adverb between the auxiliary verb and the past participle.\n\
    \n*Example:* **J'ai souvent voyagé au Québec.** (I have often traveled in Quebec.)"
