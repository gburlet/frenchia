  heading: 'Québec vs. France: Adverbs of Frequency'
  body: 'In terms of grammar, the use of adverbs of frequency is virtually identical in both Québec and
    France. They follow the same rules regarding placement in a sentence (usually between the conjugated
    verb and the infinitive). However, the vocabulary used in the examples will differ based on local
    customs. For instance, while a person in France might say they **font les courses** often, a Québécois
    person is more likely to talk about **magasiner** or going to the **dépanneur** for a quick stop. In
    Québec, the following terms are common, with their French (France) equivalents shown:'
