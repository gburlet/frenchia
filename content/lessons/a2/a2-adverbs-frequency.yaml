- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Adverbs of Frequency'
  body: 'The grammar for adverbs of frequency is the same in Québec and in France: the adverb is placed
    directly after the conjugated verb (e.g., *Je vais souvent à la boulangerie*). The only differences
    are lexical. Québec speakers tend to use some region-specific words, such as **le souper** for “dinner”
    and **la fin de semaine** for “the weekend**, while the rest of the sentence follows the same rules.'
