- type: reading
  id: reading
  title: La routine de Marc
  passage_fr: |-
    Marc habite à Montréal et il a une routine très organisée. Il travaille dans un bureau au centre-ville, donc il prend souvent le métro pour aller au travail. Le matin, il boit toujours son café avant de commencer sa journée. Il ne mange jamais son déjeuner au bureau ; il préfère le prendre à la maison.

    La fin de semaine, sa routine change. Il va parfois au parc avec ses amis pour se promener, mais il reste souvent à la maison pour se détendre. Le soir, il regarde rarement la télévision parce qu’il aime lire des romans. Cependant, il se rend toujours à l’épicerie le vendredi soir pour acheter des collations. Marc aime sa vie à Montréal, même s’il travaille beaucoup.
  translation_en: |-
    Marc lives in Montreal and he has a very organized routine. He works in an office downtown, so he often takes the metro to go to work. In the morning, he always drinks his coffee before starting his day. He never eats breakfast at the office; he prefers to have it at home.

    On the weekend, his routine changes. He sometimes goes to the park with his friends to walk, but he often stays at home to relax. In the evening, he rarely watches television because he likes to read novels. However, he always goes to the grocery store on Friday night to buy some snacks. Marc loves his life in Montreal, even though he works a lot.
