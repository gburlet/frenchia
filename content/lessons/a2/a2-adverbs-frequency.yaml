sections:
- type: explanation
  id: explanation
  heading: How often do you do it?
  body: 'In French, just like in English, we use adverbs of frequency to describe how often an action
    occurs. These words usually sit between the conjugated verb and the infinitive, or immediately after
    the verb in simple tenses.  Here are the most common ones you will need: - **Toujours** (Always):
    **Je vais toujours à la boulangerie le matin.** - **Souvent** (Often): **Nous mangeons souvent au
    resto.** - **Parfois** (Sometimes): **Parfois, je vais au cinéma.** (Note: you can also use *quelquefois*.) -
    **Rarement** (Rarely): **Il pleut rarement en août.** - **Jamais** (Never): **Je ne mange jamais de
    viande.** **A Common Pitfall: The Double Negative** One of the biggest hurdles for English speakers
    is the word **jamais**. In English, we say “I never eat meat.” In French, you cannot say *« Je jamais
    mange de viande »*; you must use the two-part negation: **ne + [verb] + jamais**. *Example:* **Je
    ne regarde jamais la télé.** (I never watch TV.) **Placement Tip:** For most of these adverbs, the
    rule is simple: place them after the verb. However, if you have a compound tense (like the *passé
    composé*), place the adverb between the auxiliary verb and the past participle. *Example:* **J''ai
    souvent voyagé au Québec.** (I have often traveled in Quebec.)'
