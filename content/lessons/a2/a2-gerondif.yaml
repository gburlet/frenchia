- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the gerund (le gérondif)'
  body: In everyday Québec speech the construction *en + present‑participle* is used exactly as in France
    to express two actions happening at the same time. The only real difference is the vocabulary that
    surrounds it. Because Québécois speakers often talk about a *déjeuner* (breakfast), *dîner* (lunch)
    and *souper* (supper), you’ll see those words appear in gerund examples, whereas European French would
    more often use *petit‑déjeuner, déjeuner, dîner*. The grammatical form itself is identical, so you
    can transfer the rule without change.
