- id: ex-09
  grammar_topics:
  - gerondif
  type: multiple_choice
  question: Which sentence correctly uses the gerund (en + present participle) to express two simultaneous
    actions?
  options:
  - En mangeant mon déjeuner, j’ai lu le journal en ligne.
  - En mange, j’ai lu le journal en ligne.
  - En mangeant mon déjeuner, j’ai lis le journal en ligne.
  - En mangeant mon déjeuner, j’ai lu le journaux en ligne.
  answer_index: 0
  explanation: Option A is the only correct sentence. It uses the gerund *en mangeant* followed by the
    passé composé *j’ai lu*. Option B is wrong because the gerund must be formed with *en* + present participle
    (*en mange* is not a gerund). Options C and D contain spelling/agreement errors (*lis* instead of
    *lu*, *journaux* instead of *journal*).
- id: ex-10
  grammar_topics:
  - gerondif
  type: multiple_choice
  question: Which sentence is ungrammatical?
  options:
  - En conduisant jusqu’au dépanneur, j’ai entendu la radio parler du nouveau concert.
  - En conduisant jusqu’au dépanneur, j’ai entendu la radio parle du nouveau concert.
  - En conduisant jusqu’au dépanneur, j’ai entendu la radio parler du nouveau concert hier.
  - En conduisant jusqu’au dépanneur, j’ai entendu la radio parler du nouveau concert pendant que je mangeais
    mon sandwich.
  answer_index: 1
  explanation: Option B is ungrammatical because after the construction *entendre* + noun, the second
    verb must be an infinitive (e.g., *la radio parler*). The form *parle* is a present‑indicative verb,
    so *la radio parle* is incorrect in this context. The other sentences use the correct infinitive *parler*
    and are grammatical. The rule about the gerund *en conduisant* does not require the following verb
    to be infinitive; the error comes from the misuse of the infinitive after *entendre la radio*.
