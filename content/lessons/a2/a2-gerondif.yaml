sections:
- type: explanation
  id: explanation
  heading: Le gérondif (en + present participle)
  body: '*****In French the gerund is a **very handy way to say that two actions happen at the same time**.
    It is formed with the preposition **en** followed by the **present participle** of a verb (the *‑ant*
    form). The structure is always **en + verb‑ant**; there is no separate gerund noun like *‑ing* in
    English.*****  <br><br>### How to build it<br>1. Take the **nous** form of the present tense.  <br>2.
    Drop the **‑ons** ending.  <br>3. Add **‑ant**.  <br>4. Put **en** in front.<br><br>| Verb (infinitive)
    | nous present | Present participle | Gerund |<br>|-------------------|--------------|--------------------|--------|<br>|
    **manger**        | nous **mangeons** | **mangeant** | **en mangeant** |<br>| **finir**         |
    nous **finissons**| **finissant**| **en finissant** |<br>| **aller**         | nous **allons**   |
    **allant**   | **en allant** |<br><br>### Main use: simultaneous actions<br>The gerund expresses that
    the second action occurs **while** the first is in progress.<br>- **Je lis le journal en mangeant
    mon déjeuner.** – I read the newspaper while eating breakfast. *(Québec: *déjeuner* = breakfast)*<br>-
    **Il conduit en écoutant la radio.** – He drives while listening to the radio.<br><br>### A few Québec‑flavored
    examples<br>- **On regarde la télé en mangeant du maïs soufflé.**<br>- **Je prépare le souper en parlant
    au téléphone.** – I’m preparing supper while talking on the phone.<br><br>### Common pitfalls for
    English speakers<br>1. **Using English –ing after a preposition.** In English we say *while eating*,
    but in French the preposition must be **en** followed by the **‑ant** form; *en mange* or *en manger*
    is incorrect.<br>2. **Forgetting that the two actions share the same subject.** The gerund always
    refers to the subject of the main clause. *Je lis le journal en mangeant le sandwich* is fine because
    *je* does both actions; *Je lis le journal en mangeant le sandwich, **ils** parlent* is wrong.<br>3.
    **Irregular participles.** Verbs like **être**, **avoir**, **savoir** have irregular present participles:
    *en étant*, *en ayant*, *en sachant*. These follow the same *en + ‑ant* rule.<br><br>Remember: the
    gerund is a compact way to say *while/when* – just add **en** before the *‑ant* form and you’re good
    to go!***'
