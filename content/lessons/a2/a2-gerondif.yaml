sections:
- type: explanation
  id: explanation
  heading: Le gérondif (en + participe présent)
  body: "**In French the gerund is a **very handy way to say that two actions happen at the same time**.\
    \ It is formed with the preposition **en** followed by the **present participle** of a verb (the *-ant*\
    \ form). The structure is always **en + verb-ant**; there is no separate gerund noun like *-ing* in\
    \ English.**  \n\n### How to build it\n1. Take the **nous** form of the present tense.\n2. Drop the\
    \ **-ons** ending.\n3. Add **-ant**.\n4. Put **en** in front.\n\n| Verbe (infinitif) | nous présent\
    \ | Participe présent | Gérondif |\n| ------------------- | -------------- | ------------------- |\
    \ ---------- |\n| **manger**        | nous **mangeons** | **mangeant** | **en mangeant** |\n| **finir**\
    \         | nous **finissons**| **finissant**| **en finissant** |\n| **aller**         | nous **allons**\
    \   | **allant**   | **en allant** |\n\n### Main use: simultaneous actions\nThe gerund expresses that\
    \ the second action occurs **while** the first is in progress.\n- **Je lis le journal en mangeant\
    \ mon déjeuner.** – I read the newspaper while eating my **breakfast** (Québec: *déjeuner*).\n- **Il\
    \ conduit en écoutant la radio.** – He drives while listening to the radio.\n\n### Additional everyday\
    \ examples\n- **Je prépare le dîner en répondant à mes courriels.** – I’m preparing lunch while answering\
    \ my e-mails (Québec: *dîner* = lunch, *courriels*).\n- **Nous faisons du sport en regardant la météo\
    \ sur notre téléphone.** – We exercise while watching the weather on our phone.\n- **Elle étudie le\
    \ vocabulaire en marchant dans le parc.** – She studies vocabulary while walking in the park.\n- **Vous\
    \ rangez la maison en écoutant votre playlist préférée.** – You tidy the house while listening to\
    \ your favourite playlist.\n\n### Common pitfalls for English speakers\n1. **Using English –ing after\
    \ a preposition.** In English we say *while eating*, but in French the preposition must be **en**\
    \ followed by the **-ant** form; *en mange* or *en manger* is incorrect.\n2. **Forgetting that the\
    \ two actions share the same subject.** The gerund always refers to the subject of the main clause.\
    \ *Je lis le journal en mangeant le sandwich* is fine because *je* does both actions; *Je lis le journal\
    \ en mangeant le sandwich, **ils** parlent* is wrong.\n3. **Irregular participles.** Verbs like **être**,\
    \ **avoir**, **savoir** have irregular present participles: *en étant*, *en ayant*, *en sachant*.\
    \ These follow the same *en + -ant* rule.\n\n**Note:** The gerund is formed exactly the same in Québec\
    \ French and in France; only the vocabulary (e.g., *déjeuner*, *dîner*, *courriels*) may differ. \
    \ \n\nRemember: the gerund is a compact way to say *while/when* – just add **en** before the *-ant*\
    \ form and you’re good to go!***"
