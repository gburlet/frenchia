  type: multiple_choice
  question: Which sentence correctly uses the gerund (en + present participle) to express two simultaneous
    actions?
  options:
  - En lisant le rapport, j’ai bu mon café.
  - En lis, j’ai bu mon café.
  - En lisant le rapport, j’ai bu mon cafés.
  - En lisant le rapport, j’ai bu le cafée.
  answer_index: 0
  explanation: Option A is the only correct sentence. It uses the gerund *en lisant* followed by the passé
    composé *j’ai bu*. Option B is wrong because the gerund must be formed with *en* + present participle
    (*en lis* is not a gerund). Options C and D contain spelling/agreement errors (*cafés* instead of
    *café*, *cafée* instead of *café*).
- id: ex-10
  grammar_topics:
  - gerondif
  type: multiple_choice
  question: Which sentence is ungrammatical?
  options:
  - En conduisant jusqu’au bureau, j’ai entendu la radio parler du nouveau concert.
  - En conduisant jusqu’au bureau, j’ai entendu la radio parle du nouveau concert.
  - En conduisant jusqu’au bureau, j’ai entendu la radio parler du nouveau concert hier.
  - En conduisant jusqu’au bureau, j’ai entendu la radio parler du nouveau concert pendant que je mangeais
    mon sandwich.
  answer_index: 1
  explanation: 'Option B is ungrammatical because after *entendre* followed by a direct object (*la radio*),
    the verb that expresses what the object does must be in the infinitive: *entendre la radio parler*.
    In option B the conjugated form *parle* is used, which is not allowed. The gerund *en conduisant*
    is correctly formed in all four sentences, and the other options use the infinitive *parler* correctly
    after *entendre*; therefore they are grammatical. No regional variation is needed for the gerund construction
    (the *en + present participle* works the same in Québec and in France).'
