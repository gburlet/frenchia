- type: reading
  id: reading
  title: Le gérondif en action – Une fin de semaine à Québec
  passage_fr: 'Samedi matin, je suis allé au dépanneur **à vélo**. **En pédalant** le long du Vieux‑Québec,
    j’ai vu le marché public qui venait de s’ouvrir. **En achetant** des croissants au beurre, j’ai rencontré
    Marie, une amie d’enfance. **En discutant** avec elle, nous avons décidé d’aller **dîner** au restaurant
    du coin. **En marchant** jusqu’au restaurant, nous avons passé devant le parc où les enfants jouaient
    au ballon. **En commandant** une poutine et un verre de cidre, nous avons parlé de nos projets pour
    la fin de semaine. Après le repas, nous sommes rentrés **en autobus**, **en chantant** la chanson
    « Gens du pays ». C’était une belle façon de profiter du temps libre, **en faisant** ce que l’on aime
    le plus : être ensemble.'
  translation_en: 'Saturday morning, I went to the corner store **by bike**. **While** pedaling along
    Old Quebec, I saw the public market just opening. **While** buying butter croissants, I ran into Marie,
    a childhood friend. **While** chatting with her, we decided to go **to lunch** at the nearby restaurant.
    **While** walking to the restaurant, we passed the park where children were playing ball. **While**
    ordering a poutine and a glass of cider, we talked about our plans for the weekend. After the meal,
    we went home **by bus**, **while** singing the song “Gens du pays”. It was a great way to enjoy the
    free time, **while** doing what we love most: being together.'
