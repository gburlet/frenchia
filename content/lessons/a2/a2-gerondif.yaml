- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: le gérondif'
  body: 'In everyday Québec speech the construction *en + present-participle* is used exactly as in France
    to express two actions happening at the same time. The grammatical form is identical, so you can transfer
    the rule without change. The only noticeable difference is the vocabulary that often surrounds it:
    Québécois speakers usually talk about a *déjeuner* (breakfast), a *dîner* (lunch) and a *souper* (supper),
    whereas European French more often uses *petit-déjeuner, déjeuner* and *dîner*.'
  variants: []
- type: reading
  id: reading
  title: Le gérondif en action – Une fin de semaine à Québec
  passage_fr: 'Samedi matin, je suis allé à la bibliothèque **en vélo**. **En pédalant** le long de la
    rue Saint-Jean, j’ai remarqué le stand de fruits où le vendeur proposait des pommes fraîches. **En
    achetant** quelques pommes, j’ai croisé mon collègue Marc, que je n’avais pas vu depuis des mois.
    **En discutant** avec lui, nous avons décidé d’aller **déjeuner** au petit café du coin. **En marchant**
    jusqu’au café, nous sommes passés devant le parc où des adolescents jouaient au frisbee. **En commandant**
    un croissant aux amandes et un café, nous avons parlé de nos projets pour la fin de semaine. Après
    le repas, nous sommes rentrés **en autobus**, **en chantant** la chanson « Gens du pays ». C’était
    une belle façon de profiter du temps libre, **en faisant** ce que l’on aime le plus : être ensemble.'
  translation_en: 'Saturday morning, I went to the library **by bike**. **While** pedaling along Saint-Jean
    Street, I noticed the fruit stall where the vendor was offering fresh apples. **While** buying a few
    apples, I ran into my coworker Marc, whom I hadn’t seen for months. **While** chatting with him, we
    decided to go **to breakfast** at the little café nearby. **While** walking to the café, we passed
    the park where teenagers were playing frisbee. **While** ordering an almond croissant and a coffee,
    we talked about our plans for the weekend. After the meal, we went home **by bus**, **while** singing
    the song “Gens du pays”. It was a great way to enjoy the free time, **while** doing what we love most:
    being together.'
