  title: Mon nouvel appartement à Montréal
  passage_fr: |-
    Je viens de déménager dans un bel appartement au centre‑ville de Montréal. C'est un grand immeuble avec beaucoup d'étages. J'habite au quatrième étage, juste au‑dessus du bureau de mon ami. C'est la première fois que je vis dans un quartier aussi animé.

    Le matin, je prends mon déjeuner et je lis les nouvelles sur mon téléphone. Hier, j'ai participé à une petite course de quartier. J'ai fini en cinquième position, mais je suis content ! Ce soir, je vais souper avec des amis. Nous allons aller au centre d'achats pour magasiner un peu. C'est une belle fin de semaine et je suis ravi de ma nouvelle vie ici.
  translation_en: |-
    I just moved into a beautiful apartment in downtown Montreal. It is a large building with many floors. I live on the fourth floor, just above my friend's office. It is the first time I have lived in such a lively neighbourhood.

    In the morning, I have my breakfast and I read the news on my phone. Yesterday, I participated in a small neighbourhood race. I finished in fifth place, but I am happy! This evening, I am going to have supper with friends. We are going to go to the shopping centre to do a little shopping. It is a beautiful weekend and I am delighted with my new life here.
