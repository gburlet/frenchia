sections:
- type: explanation
  id: explanation
  heading: How to Rank and Order in French
  body: 'In French, ordinal numbers are used to indicate the position of something in a sequence, such
    as floors in a building, rankings in a competition, or centuries in history.  ⟶  To form most ordinal
    numbers, you take the cardinal number (one, two, three…) and add the suffix **-ième**. The spelling
    of the base word often changes before the suffix is added. For example:  ⟶  *quatre* → **quatrième**
    (the final **e** is dropped),  ⟶  *cinq* → **cinquième** (a **u** is added),  ⟶  *neuf* → **neuvième**
    (the **f** becomes **v**),  ⟶  *deux* → **deuxième**,  ⟶  *trois* → **troisième**,  ⟶  *dix* → **dixième**,
    etc.  ⟶  When the ordinal is part of a compound (twenty‑first, thirty‑first, …) the form **‑unième**
    is used: *vingt‑et‑unième*, *trente‑et‑unième*; the simple word **unième** does not stand alone.  ⟶  The
    only irregular ordinals that must be memorised are **premier** (masc.) and **première** (fem.).  ⟶  **Usage
    Examples:**  ⟶  - J''habite au **troisième** étage. (I live on the third floor.)  ⟶  - C''est sa **première**
    fois au Québec. (It is her first time in Quebec.)  ⟶  - Nous vivons au **vingt‑et‑unième** siècle.
    (We live in the 21st century.)  ⟶  **Common Pitfalls for English Speakers:**  ⟶  - **Gender Agreement:**
    Unlike English, ordinal numbers (except for *premier/première*) are invariable for gender. *Premier*
    must agree with the noun it modifies (e.g., *le premier étage*, *la première journée*).  ⟶  - **Plural
    Forms:** Ordinals keep the same spelling in the plural; you only add an *‑s* when the noun they modify
    is plural (e.g., *les deuxièmes places*).'
