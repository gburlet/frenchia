- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Ordinal Numbers'
  body: In terms of grammar and the formation of ordinal numbers, there is no significant difference between
    Québec and France. Both regions use *premier/première* for “first” and add the suffix *‑ième* to the
    cardinal number for the rest of the sequence (e.g., *deuxième, troisième, quatrième, cinquième, sixième,
    septième, huitième, neuvième, dixième*). The spelling of some ordinals changes slightly (‑e is dropped
    in *quatrième*, a *u* is added in *cinquième*, *f* becomes *v* in *neuvième*, etc.). The same rules
    apply in both varieties of French; there is no special Québécois usage that differs from European
    French.
  variants: []
