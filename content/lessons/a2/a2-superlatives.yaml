- type: regional_note
  id: regional-note
  heading: Les superlatifs
  body: 'Now that you can compare two things (e.g., *ce café est plus grand que celui de la rue*), you
    can describe the extreme of a group. Superlatives allow you to point out the “most,” “least,” “best,”
    or “worst.” In French, the superlative is formed by placing the definite article (**le, la, l'', les**)
    before the comparative word (*plus, moins, mieux*).  ### 1. Using *plus* and *moins* (more and less)  To
    say “the most” or “the least,” simply add the article before *plus* or *moins*. The adjective must
    still agree in gender and number with the noun it describes.  - **C''est le plus grand appartement
    du quartier.** (It is the biggest apartment in the neighbourhood.)  - **C''est la plus grande épicerie
    de la ville.** (It is the biggest grocery store in the city.)  - **C''est le moins cher des billets
    de métro.** (It is the cheapest of the metro tickets.)  ### 2. Irregular superlatives  Some adjectives
    have special superlative forms.  - **Bon (good) → le meilleur** (the best) – *C''est le meilleur film
    que j’aie vu cette année.*  - **Bien (well) → le mieux** (the best – adverbial) – *C’est le mieux
    pour tout le monde.*  - **Mauvais (bad) → le pire** (the worst) – *C’est le pire trafic de la fin
    de semaine.*  ### 3. Practice examples  Observe how the article changes based on the noun:  - **C''est
    le plus beau parc de la ville.** (It is the most beautiful park in the city.)  - **C''est le moins
    difficile des examens.** (It is the least difficult of the exams.)  - **C''est la plus belle vue depuis
    la montagne.** (It is the most beautiful view from the mountain.)  **Note on Québec usage:** In everyday
    Québec speech, *la fin de semaine* replaces *le week-end*.'
