  title: Le meilleur quartier de Montréal
  passage_fr: |-
    J'adore habiter à Montréal, mais mon quartier est, selon moi, le plus agréable de la ville. C'est ici que je trouve le meilleur café pour mon déjeuner. Le matin, je vais au petit café au coin de la rue. C'est le plus petit établissement du quartier, mais le service est excellent.

    Le samedi, je me rends au marché public. C’est l’endroit le plus animé de la fin de semaine. On y trouve les fruits les plus frais et les produits les moins chers de la région. Le soir, je préfère cuisiner avec des légumes locaux. C’est, à mon avis, la meilleure façon de manger sainement. Parfois, je passe à l’épicerie du coin pour acheter du pain, mais ce n’est pas très pratique quand il y a beaucoup de neige.
  translation_en: |-
    I love living in Montreal, but my neighborhood is, in my opinion, the most pleasant in the city. This is where I find the best coffee for my breakfast. In the morning, I go to the little café on the corner of the street. It is the smallest establishment in the neighborhood, but the service is excellent.

    On Saturdays, I go to the public market. It is the liveliest spot of the weekend. You can find the freshest fruits and the least-expensive products in the region. In the evening, I prefer to cook with local vegetables. It is, in my view, the best way to eat healthily. Sometimes, I stop at the nearby grocery store to buy bread, but it isn’t very convenient when there is a lot of snow.
