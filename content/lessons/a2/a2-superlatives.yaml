- type: regional_note
  id: regional-note
  heading: Les superlatifs
  body: "Now that you can compare two things (e.g., *ce café est plus grand que celui de la rue*), you\
    \ can now describe the extreme of a group. Superlatives allow you to point out the 'most,' 'least,'\
    \ 'best,' or 'worst.'\n\nIn French, the superlative is formed by placing the definite article (**le,\
    \ la, l', les**) before the comparative word (*plus, moins, mieux*).\n\n### 1. Using *plus* and *moins*\
    \ (More and Less)\nTo say 'the most' or 'the least,' simply add the article before *plus* or *moins*.\
    \ The adjective must still agree in gender and number with the noun it describes.\n\n- **C'est le\
    \ plus petit appartement du quartier.** (It is the smallest apartment in the neighborhood.)\n- **C'est\
    \ la plus grande épicerie de la ville.** (It is the biggest grocery store in the city.)\n- **C'est\
    \ le moins cher des billets de métro.** (It is the least expensive of the metro tickets.)\n\n### 2.\
    \ Irregular Superlatives\nJust like in English, some words have special forms for superlatives. You\
    \ don't say \"le plus bon\" or \"le plus mauvais.\"\n\n- **Bon (Good) $\rightarrow$ Le meilleur**\
    \ (The best)\n  - *C'est le meilleur souper de ma vie !* (It's the best supper of my life!)\n  - *Note:\
    \ In Québec, \"dîner\" means lunch, so \"le meilleur dîner\" refers to the best lunch.*\n- **Bien\
    \ (Well) $\rightarrow$ Le mieux** (The best - adverbial)\n  - *C'est le mieux pour tout le monde.*\
    \ (It's best for everyone.)\n- **Mauvais (Bad) $\rightarrow$ Le pire** (The worst)\n  - *C'est le\
    \ pire trafic de la fin de semaine.* (It's the worst traffic of the weekend.)\n\n### 3. Practice Examples\n\
    Observe how the article changes based on the noun:\n\n- **C'est le plus beau parc de la ville.** (It\
    \ is the most beautiful park in the city.)\n- **C'est le moins difficile des examens.** (It is the\
    \ least difficult of the exams.)\n- **C'est le plus petit dépanneur du coin.** (It is the smallest\
    \ convenience store on the corner.)\n- **C'est la plus belle vue depuis la montagne.** (It is the\
    \ most beautiful view from the mountain.)\n\n**Note on Québec usage:** In Québec, we often use the\
    \ word *dépanneur* for a convenience store (equivalent to *supérette* or *épicerie de quartier* in\
    \ some parts of France). Also, remember to use *la fin de semaine* instead of *le week-end* when describing\
    \ the busiest times of the week!"
