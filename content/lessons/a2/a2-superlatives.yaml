sections:
- type: explanation
  id: explanation
  heading: Les superlatifs
  body: 'In the previous lesson, you learned how to compare two things using *plus que* or *moins que*.
    Superlatives take this a step further by identifying the extreme: the most, the least, the best, or
    the worst within a group. To form a superlative, place the definite article (**le, la, l'', les**)
    before the comparative structure. **1. Using *plus* and *moins* (more and less)** Add the article
    before *plus* or *moins* to say “the most” or “the least.” - **C’est le plus petit appartement du
    quartier.** (It is the smallest apartment in the neighbourhood.) - **C’est la moins chère des voitures.**
    (It is the least expensive of the cars.) **2. Irregular superlatives** Some common adjectives have
    special forms that must be memorised: - *bon* → **le meilleur** (the best) - *bien* → **le mieux**
    (the best – used with verbs) - *mauvais* → **le pire** (the worst) **Common pitfalls for English speakers** -
    **Forgetting the article:** French always requires the article: **la plus belle**, not *est plus belle*. -
    **Gender agreement:** The article and adjective agree with the noun (e.g., **la plus intelligente**
    for a woman, **le plus intelligent** for a man). *Note:* In Québec the construction is the same as
    in France; you simply use the standard forms (e.g., **le meilleur film** for “the best movie”).'
