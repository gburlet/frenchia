  body: En ce qui concerne la grammaire, l’emploi des pronoms COI (me, te, lui, nous, vous, leur) est
    identique au Québec et en France. Les règles de conjugaison et le placement des pronoms restent les
    mêmes. Dans cette leçon, nous nous concentrons sur des verbes standards qui sont courants dans les
    deux régions, afin que votre français soit compris partout tout en restant naturel pour la vie au
    Québec.
