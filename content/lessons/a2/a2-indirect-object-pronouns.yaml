sections:
- type: explanation
  id: explanation
  heading: Les pronoms COI (Indirect Object Pronouns)
  body: "In your previous lesson, you learned about COD (Direct Object Pronouns), which replace nouns\
    \ that receive the action directly. Today, we are looking at **COI (Complément d'Objet Indirect)**.\
    \ These pronouns replace nouns that are introduced by the preposition **à**. \n\nIn French, many verbs\
    \ are 'indirect' because they require the preposition *à* when connecting to a person. For example,\
    \ you don't 'speak someone'; you 'speak *to* someone' (*parler à quelqu'un*). When we want to avoid\
    \ repeating that person's name, we use a COI pronoun.\n\nHere is the breakdown of the COI pronouns:\n\
    - Me (to me)\n- Te (to you - informal)\n- **Lui** (to him / to her)\n- Nous (to us)\n- Vous (to you\
    \ - formal/plural)\n- **Leur** (to them)\n\n**Examples:**\n- Je parle **à Marie**. $\rightarrow$ Je\
    \ **lui** parle. (I speak to her.)\n- Tu donnes le cadeau **à ton frère**. $\rightarrow$ Tu **lui**\
    \ donnes le cadeau. (You give the gift to him.)\n- Nous téléphonons **aux voisins**. $\rightarrow$\
    \ Nous **leur** téléphonons. (We call the neighbors.)\n\n**Common Pitfalls for English Speakers:**\n\
    1. **Lui vs. Le/La:** English speakers often want to use *le* or *la* because they think of 'him'\
    \ or 'her'. However, if the verb uses *à*, you must use *lui*. \n   - *Incorrect:* Je le parle. \n\
    \   - *Correct:* Je **lui** parle. (Because it is *parler à*).\n2. **Word Order:** Just like COD pronouns,\
    \ COI pronouns usually go **before** the conjugated verb. If there is an infinitive, they go right\
    \ before the infinitive: *Je vais lui téléphoner.*"
