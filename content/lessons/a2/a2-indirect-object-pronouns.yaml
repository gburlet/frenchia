  title: Une fin de semaine occupée
  passage_fr: C'est la fin de semaine et je suis très occupé. D'abord, je dois téléphoner à ma sœur parce
    qu'elle veut de l'aide pour son déménagement. Je lui téléphone demain matin. Ensuite, je vais magasiner
    pour ma famille. Je veux acheter des cadeaux pour mes neveux. Je leur achète des jouets et des livres.
    Je dois aussi parler au gérant du dépanneur parce que je veux commander des boissons pour la fête
    de samedi. Je lui écris un courriel ce soir. Enfin, je donne un coup de main à mes voisins pour leur
    jardin. Je leur donne des outils et ils me disent merci. C'est beaucoup de travail, mais j'aime aider
    mes amis et ma famille.
  translation_en: It's the weekend and I am very busy. First, I have to call my sister because she wants
    help with her move. I will call her tomorrow morning. Next, I am going shopping for my family. I want
    to buy gifts for my nephews. I am buying them toys and books. I also have to speak to the manager
    of the convenience store because I want to order drinks for Saturday's party. I am writing him an
    email tonight. Finally, I am giving a hand to my neighbors for their garden. I am giving them tools
    and they say thank you to me. It's a lot of work, but I love helping my friends and my family.
