- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: reflexive verbs in everyday talk'
  body: In Québec the same set of reflexive verbs is used as in France, but the surrounding vocabulary
    often reflects the local calendar of meals and weekend. When you talk about your routine, you’ll hear : *Je
    me lève à 6 h, je déjeune, je me prépare pour le travail, je dîne à midi, je me couche à 22 h*. In
    France the equivalent would be : *Je prends le petit-déjeuner, je déjeune à midi, je dîne le soir*.
    The reflexive forms themselves (me, te, se, nous, vous, se) and their conjugations are identical.
     **Typical Québec-France-English variants**  1. **le souper** (QC) ↔ **le dîner** (FR) ↔ *supper*
    (EN) – the evening meal. 2. **le dîner** (QC) ↔ **le déjeuner** (FR) ↔ *lunch* (EN) – the midday meal.
    3. **le déjeuner** (QC) ↔ **le petit-déjeuner** (FR) ↔ *breakfast* (EN). 4. **la fin de semaine**
    (QC) ↔ **le week-end** (FR) ↔ *weekend* (EN). 5. **s’habiller** (same in QC & FR) ↔ *to get dressed*
    (EN). 6. **se coucher** (same in QC & FR) ↔ *to go to bed* (EN).  Aside from these lexical differences,
    the grammar of reflexive verbs is practiced exactly the same in both regions.
  variants:
