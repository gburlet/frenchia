sections:
- type: explanation
  id: explanation
  heading: '# Les verbes pronominaux (A2 – Reflexive verbs)'
  body: 'In French, many actions are expressed with **reflexive (pronominal) verbs**. The verb is preceded
    by a reflexive pronoun that agrees with the subject (me, te, se, nous, vous, se).  <br/><br/><!--
    ---------------------------------------------------- -->**1. Present tense**<br/>The structure is
    **[subject] + [reflexive pronoun] + [verb stem + ending]**.<br/>- **Je me lève** à 7 h. – I get up
    at 7 a.m.<br/>- **Nous nous brossons les dents** après le **souper**. – We brush our teeth after supper.<br/>Notice
    that the pronoun *se* becomes *s’* before a vowel or mute *h* (e.g., *s’habiller* → **Je m’habille**).<br/><br/><!--
    ---------------------------------------------------- -->**2. Passé composé**<br/>Reflexive verbs always
    use **être** as the auxiliary. The past participle agrees with the **direct object** *only when that
    direct object precedes the verb*. In most daily-routine verbs the reflexive pronoun functions as a
    **direct object**, so agreement with the subject is required. No agreement is needed only when the
    pronoun is an **indirect object** (e.g., *se laver les mains*, *se préparer un café*).<br/>- **Je
    me suis réveillé(e)** à six heures.<br/>- **Ils se sont lavé les mains**.  (no *-s* because the direct
    object *les mains* follows the verb; the reflexive pronoun *se* is an indirect object).<br/>- **Elle
    s’est coupé les cheveux**.  (the hair is a direct object placed after the verb, so the participle
    remains invariable; the pronoun *se* is indirect).<br/><br/><!-- ----------------------------------------------------
    -->**3. Plus-que-parfait (pluperfect)**<br/>When you need to talk about an action that had already
    happened before another past event, use the auxiliary **être** in the imperfect plus the past participle.<br/>-
    **Je m’étais déjà couché** quand tu es arrivé à la maison. – I had already gone to bed when you arrived.<br/><br/><!--
    ---------------------------------------------------- -->**4. Common pitfalls for English speakers**<br/>1.
    **Forgetting the auxiliary** – Some learners mistakenly use *avoir* with reflexive verbs (e.g., *j’ai
    lavé*). Remember it is always *être*.<br/>2. **Missing agreement** – When the reflexive pronoun is
    also the direct object, the past participle must agree with the subject (e.g., *Nous nous sommes blessés*).
    If the object follows the verb, the participle stays unchanged (e.g., *Elles se sont préparé un café*).<br/><br/><!--
    ---------------------------------------------------- -->**5. Quick routine example (Québec flavour)**<br/>**Chaque
    matin, je me lève, je me prépare un café, je me brosse les dents, et je déjeune avant de prendre le
    bus pour le travail. Le soir, je me détends en regardant la télé avant le souper.**<br/><br/>*Practice*:
    write your own daily routine, using both the present and the passé composé (or plus-que-parfait when
    appropriate). Pay attention to the reflexive pronoun, the auxiliary verb, and the agreement rules.'
