- type: reading
  id: reading
  title: Une journée typique de Marie
  passage_fr: 'Marie se lève à 6 h 15 chaque matin parce qu’elle doit prendre le **déjeuner** avant d’aller
    au travail. Elle se prépare rapidement : elle s’habille, se brosse les dents et se coiffe en même
    temps. Vers 7 h 30, elle part en voiture et, en arrivant au bureau, elle se rend compte qu’elle a
    oublié son badge. Elle se dépêche de retourner à la maison, mais elle arrive juste à temps pour le
    **dîner**. L’après-midi, elle se réunit avec ses collègues pour préparer le projet de la **fin de
    semaine**. Le soir, après le souper, Marie se détend en lisant un roman. Hier, elle s’est couchée
    tard parce qu’elle s’est amusée à une soirée du quartier.'
  translation_en: 'Marie gets up at 6:15 a.m. each morning because she has to have **breakfast** (déjeuner)
    before going to work. She gets ready quickly: she dresses, brushes her teeth and does her hair at
    the same time. Around 7:30 a.m., she leaves by car and, when she arrives at the office, she realizes
    that she has forgotten her badge. She hurries back home, but she arrives just in time for **lunch**
    (dîner). In the afternoon, she meets with her coworkers to prepare the weekend project. In the evening,
    after supper, Marie relaxes by reading a novel. Yesterday, she went to bed late because she had fun
    at a neighbourhood party.'
  glossary:
  - fr: se dépêcher
    en: to hurry, to rush
    pos: verb
    region: common
