sections:
- type: explanation
  id: explanation
  heading: Le futur simple
  body: "While you have already learned *le futur proche* (aller + infinitive) to talk about things happening\
    \ soon, *le futur simple* is used to express actions that will happen in the more distant future,\
    \ as well as for predictions, promises, or formal instructions. \n\nTo form the *futur simple*, you\
    \ take the **infinitive** of the verb (for -er and -ir verbs) or the **future stem** (for -re verbs)\
    \ and add the following endings: \n- Je: **-ai**\n- Tu: **-as**\n- Il/Elle/On: **-a**\n- Nous: **-ons**\n\
    - Vous: **-ez**\n- Ils/Elles: **-ont**\n\nFor example:\n- **Je mangerai un bon souper ce soir.** (I\
    \ will eat a good supper tonight.)\n- **Nous irons au dépanneur plus tard.** (We will go to the convenience\
    \ store later.)\n\n**Irregular Stems:** Some common verbs have irregular stems but keep the same endings.\
    \ You should memorize these: \n- *Avoir* $\rightarrow$ **aur-** (**J'aurai**) \n- *Être* $\rightarrow$\
    \ **ser-** (**Tu seras**) \n- *Faire* $\rightarrow$ **fer-** (**Il fera**) \n- *Aller* $\rightarrow$\
    \ **ir-** (**Nous irons**) \n\n**Common Pitfalls:** \n1. **Confusion with the Present Tense:** Because\
    \ the endings for *je, tu, il,* and *ils* sound very similar to the present tense (e.g., *je mange*\
    \ vs. *je mangerai*), make sure to include the full ending in writing to avoid confusion.\n2. **The\
    \ -re Verb Rule:** Remember that for verbs ending in *-re* (like *prendre*), you must drop the final\
    \ 'e' before adding the ending. For example, *prendre* becomes **prendr-**, so it is **je prendrai**."
