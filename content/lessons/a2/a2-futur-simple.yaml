- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: The Future Tense'
  body: 'In terms of grammar, the *futur simple* is used identically in both Québec and France. It is
    the standard way to express distant plans, predictions, and formal promises. In everyday spoken conversation,
    both regions frequently favor the *futur proche* (aller + infinitive) for immediate plans. The only
    regional difference is vocabulary: Québec speakers refer to the weekend as **la fin de semaine**,
    while France uses **le week-end**. The grammatical structure of the future tense remains the same
    in both varieties.'
