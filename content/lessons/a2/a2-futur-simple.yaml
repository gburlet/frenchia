- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: The Future Tense'
  body: In terms of grammar, the *futur simple* is used identically in both Québec and France. It is the
    standard way to express distant plans, predictions, and formal promises. However, in everyday spoken
    conversation, both regions frequently favor the *futur proche* (aller + infinitive) for immediate
    plans. In Québec, you will notice that the pronunciation of the future endings can sometimes be very
    soft, but the grammatical structure remains the same. One minor cultural nuance is that in Québec,
    we often use the future tense to talk about things we are 'planning' to do during the *fin de semaine*,
    whereas in France, you might hear *le week-end* more often.
