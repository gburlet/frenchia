sections:
- type: explanation
  id: explanation
  heading: Le futur simple
  body: 'While you have already learned *le futur proche* (aller + infinitif) to talk about things happening
    soon, *le futur simple* is used to express actions that will happen in the more distant future, as
    well as for predictions, promises, or formal instructions. To form the *futur simple*, you take the
    **infinitif** of the verb (for -er and -ir verbs) or the **future stem** (for -re verbs) and add the
    following endings: - Je : **-ai** - Tu : **-as** - Il/Elle/On : **-a** - Nous : **-ons** - Vous :
    **-ez** - Ils/Elles : **-ont** For example: - **Je mangerai une salade ce soir.** (I will eat a salad
    tonight.) - **Nous irons au cinéma plus tard.** (We will go to the cinema later.) **Irregular stems:**
    Some common verbs have irregular stems but keep the same endings. Memorise the most frequent ones: -
    *Avoir* → **aur-** (e.g., **J''aurai**) - *Être* → **ser-** (e.g., **Tu seras**) - *Faire* → **fer-**
    (e.g., **Il fera**) - *Aller* → **ir-** (e.g., **Nous irons**) **Common pitfalls:** 1. **Keeping the
    e of -re verbs:** For verbs ending in *-re* you must drop the *e* before adding the ending (e.g.,
    *vendre* → **vendr-**, **je vendrai**). 2. **Spelling changes:** Some verbs undergo specific spelling
    adjustments before the ending:    - *e* → *è* (e.g., *acheter* → **achèterai**)    - a doubled consonant
    (e.g., *appeler* → **appellerai**)    - *y* → *i* (e.g., *payer* → **paierai**). 3. **Irregular stems:**
    Remember the special stems listed above; the endings are the same for regular and irregular verbs. 4.
    **Choosing the tense:** The futur simple is preferred for predictions, promises, and formal contexts,
    but the present or futur proche are also perfectly acceptable in everyday speech for non-immediate
    future actions (e.g., *Je vais partir demain* or *Je pars demain*).'
