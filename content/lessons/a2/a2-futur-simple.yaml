  title: Mes projets pour l'hiver
  passage_fr: "L'hiver arrive bientôt au Québec. L'année prochaine, ma famille et moi aurons beaucoup\
    \ de projets. D'abord, nous achèterons une petite maison près des montagnes. Je travaillerai beaucoup\
    \ pour économiser de l'argent, mais je prendrai aussi des vacances en janvier. \n\nMes amis et moi,\
    \ nous ferons beaucoup de sports d'hiver. Nous skierons chaque samedi et nous patinerons sur le lac.\
    \ Ma sœur dira qu'elle sera très occupée, mais elle viendra souvent avec nous. Le soir, nous mangerons\
    \ un bon souper chaud à la maison. Je pense que cet hiver sera magnifique. Je promets que nous resterons\
    \ actifs malgré le froid. Est-ce que tu viendras nous voir pour passer la fin de semaine ?"
  translation_en: |-
    Winter is coming soon to Quebec. Next year, my family and I will have many projects. First, we will buy a small house near the mountains. I will work a lot to save money, but I will also take a vacation in January.

    My friends and I will do a lot of winter sports. We will ski every Saturday and we will ice skate on the lake. My sister will say that she will be very busy, but she will come with us often. In the evening, we will eat a good warm supper at home. I think this winter will be magnificent. I promise that we will stay active despite the cold. Will you come see us to spend the weekend?
