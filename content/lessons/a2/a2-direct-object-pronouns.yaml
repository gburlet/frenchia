- type: regional_note
  id: regional-note
  heading: Le COD au Québec et en France
  body: 'The rules for Direct Object Pronouns (COD) are identical in Québec and in France: the pronoun
    is placed before the conjugated verb. Only the vocabulary you replace with a pronoun may differ according
    to local usage.'
