- type: reading
  id: reading
  title: Une journée occupée à Montréal
  passage_fr: |-
    C’est samedi et je suis à Montréal avec mon ami Marc. Nous avons beaucoup de choses à faire aujourd’hui. D’abord, nous allons au marché pour acheter des légumes. Marc veut prendre **les tomates**, alors je **les** achète pour nous deux. Ensuite, nous passons à la **boulangerie du coin** pour prendre du café. Marc veut son café du matin, je **le** prends aussi.

    Après la boulangerie, nous découvrons une petite librairie qui vend des romans graphiques. Marc aime les **bandes dessinées**, il veut y entrer. Je **l'**accompagne volontiers. Plus tard, nous nous rendons au parc pour faire du vélo. Marc veut emprunter mon casque, je **le** lui prête.

    Le soir, nous préparons un bon **repas**. **Marc prépare le repas, je l'**aide avec joie. On adore passer du temps ensemble le samedi. Est-ce que tu veux nous rejoindre pour le repas ?
  translation_en: |-
    It's Saturday and I am in Montreal with my friend Marc. We have a lot of things to do today. First, we go to the market to buy vegetables. Marc wants to take **the tomatoes**, so I buy **them** for both of us. Next, we stop at the **corner bakery** to get coffee. Marc wants his morning coffee, I get **it** too.

    After the bakery, we discover a small bookstore that sells graphic novels. Marc likes **comic books**, he wants to go in. I **go with him** gladly. Later, we go to the park to ride bikes. Marc wants to borrow my helmet, I **lend it to him**.

    In the evening we prepare a good **meal**. **Marc prepares the meal, I help him** with joy. We love spending time together on Saturdays. Do you want to join us for the meal?
  glossary:
  - fr: accompagner
    en: to accompany / to go with
    pos: verb
    region: common
    formality: standard
    example_fr: Je t'accompagne à la station.
    example_en: I'll go with you to the station.
  - fr: joindre
    en: to reach, to contact (e.g., by phone)
    pos: verb
    region: common
    formality: standard
    example_fr: Tu peux nous joindre par téléphone.
    example_en: You can reach us by phone.
  - fr: rejoindre
    en: to join someone
    pos: verb
    region: common
    formality: standard
    example_fr: Est-ce que tu veux nous rejoindre ?
    example_en: Do you want to join us?
