    example_fr: Je vais au dépanneur pour acheter du lait.
    example_en: I'm going to the convenience store to buy milk.
  - fr: souper
    en: supper (Québec usage; in France, it is 'le dîner')
    pos: noun
    gender: m
    region: qc
    formality: standard
    example_fr: Le souper est prêt !
    example_en: Supper is ready!
  - fr: accompagner
    en: to accompany / to go with
    pos: verb
    region: common
    formality: standard
    example_fr: Je t'accompagne à la station.
    example_en: I'll go with you to the station.
  - fr: joindre
    en: to reach, to contact (e.g., by phone)
    pos: verb
    region: common
    formality: standard
    example_fr: Tu peux nous joindre par téléphone.
    example_en: You can reach us by phone.
  - fr: rejoindre
