sections:
- type: explanation
  id: explanation
  heading: Les pronoms compléments d'objet direct (COD)
  body: "In French, we often want to avoid repeating a noun that has already been mentioned. For example,\
    \ instead of saying \"I am eating the apple\" and then \"I am eating the apple again,\" we use a **Direct\
    \ Object Pronoun (COD)** to replace the object. \n\nThese pronouns replace a noun that receives the\
    \ action of the verb directly (no preposition like *à* or *de* is involved). \n\nHere is the breakdown\
    \ of the COD pronouns:\n- **me** (me)\n- **te** (you - informal)\n- **le / la** (him, her, it)\n-\
    \ **nous** (us)\n- **vous** (you - formal or plural)\n- **les** (them)\n\n**Placement Rule:** In most\
    \ cases, the pronoun is placed **before** the conjugated verb. \n- *Tu manges la pomme.* $\rightarrow$\
    \ **Tu la manges.** (You eat it.)\n- *Je regarde les films.* $\rightarrow$ **Je les regarde.** (I\
    \ watch them.)\n- *Il aide ses amis.* $\rightarrow$ **Il les aide.** (He helps them.)\n\n**Common\
    \ Pitfalls for English Speakers:**\n1. **Word Order:** In English, we put the pronoun *after* the\
    \ verb (\"I see **him**\"). In French, you must move it *before* the verb (**Je le vois**). \n2. **The\
    \ 'Le' vs. 'La' distinction:** Unlike English, where \"it\" is gender-neutral, French requires you\
    \ to choose the correct pronoun based on the gender of the object. If you are talking about *la voiture*\
    \ (the car), you must use **la**. If you are talking about *le souper* (supper), you must use **le**.\n\
    \n*Note: If there is an infinitive verb, the pronoun goes directly before the infinitive (Je veux\
    \ la manger). For now, focus on the standard placement before the conjugated verb.*"
