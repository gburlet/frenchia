sections:
- type: explanation
  id: explanation
  heading: Les pronoms compléments d'objet direct (COD)
  body: 'In French, we often want to avoid repeating a noun that has already been mentioned. For example,
    instead of saying *“I am eating the apple”* and then *“I am eating the apple again,”* we use a **direct-object
    pronoun (COD)** to replace the object. These pronouns replace a noun that receives the action of the
    verb directly (no preposition like *à* or *de* is involved). Here is the breakdown of the COD pronouns:
     - **me** (me)  - **te** (you – informal)  - **le / la** (him, her, it)  - **nous** (us)  - **vous**
    (you – formal or plural)  - **les** (them)  **Placement rule:** In most cases, the pronoun is placed
    **before** the conjugated verb.  - *Tu manges la pomme.* → **Tu la manges.** (You eat it.)  - *Je
    regarde les films.* → **Je les regarde.** (I watch them.)  - *Il aide ses amis.* → **Il les aide.**
    (He helps them.)  **Elision note:** When *le* or *la* is followed by a vowel or a mute *h*, they contract
    to **l''** (e.g., *l''aide*, *l''accompagne*).  **Common pitfalls for English speakers:**  1. **Word
    order:** In English the pronoun follows the verb (“I see **him**”). In French it must come **before**
    the verb (**Je le vois**).  2. **The ‘le’ vs. ‘la’ distinction:** French requires you to choose the
    correct pronoun based on the gender of the noun you are replacing. If you are talking about *la voiture*
    (the car), you must use **la**. If you are talking about *le livre* (the book), you must use **le**.
     *Note: If there is an infinitive verb, the pronoun goes directly before the infinitive (Je veux **la**
    lire). For now, focus on the standard placement before the conjugated verb.*'
