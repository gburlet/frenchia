- type: regional_note
  id: regional-note
  heading: Le COD au Québec vs. en France
  body: "In terms of grammar, the rules for Direct Object Pronouns (COD) are identical in both Québec\
    \ and France. The placement of the pronoun before the conjugated verb remains the same. However, while\
    \ the grammar is the same, the vocabulary you choose to replace with these pronouns will reflect local\
    \ customs. For instance, in Québec, you will frequently use 'le' or 'la' to replace words like *le\
    \ souper* or *la fin de semaine*, whereas a person in France would be replacing *le dîner* or *le\
    \ week-end*. \n\nHere are some specific vocabulary variants you might encounter while using COD pronouns:"
