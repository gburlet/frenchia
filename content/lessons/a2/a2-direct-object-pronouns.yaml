- type: reading
  id: reading
  title: Une journée occupée à Montréal
  passage_fr: |-
    C'est samedi et je suis à Montréal avec mon ami Marc. On a beaucoup de choses à faire aujourd'hui. D'abord, nous allons au marché pour acheter des légumes. Marc veut acheter **les pommes**, alors je **les** achète pour nous deux. Ensuite, nous allons au dépanneur pour prendre du café. Marc veut prendre le café du matin, je **le** prends aussi.

    Après le marché, nous voyons une belle boutique de vêtements. Marc aime cette boutique, il veut y aller. Je **l'**accompagne avec plaisir. Le soir, nous préparons un bon souper. Marc veut m'aider avec la cuisine, je **l'**aide avec joie. On adore passer du temps ensemble le samedi. Est‑ce que tu veux nous rejoindre pour le souper ?
  translation_en: |-
    It's Saturday and I am in Montreal with my friend Marc. We have a lot of things to do today. First, we are going to the market to buy vegetables. Marc wants to buy **the apples**, so I buy **them** for both of us. Next, we are going to the convenience store to get coffee. Marc wants to get the morning coffee, I get **it** too.

    After the market, we see a beautiful clothing store. Marc likes this store, he wants to go there. I accompany **him** with pleasure. In the evening, we are preparing a good supper. Marc wants to help me with the cooking, I help **him** with joy. We love spending time together on Saturdays. Do you want to join us for supper?
  glossary:
