sections:
- type: explanation
  id: explanation
  heading: Les pronoms possessifs
  body: 'In your previous lessons you learned about *possessive adjectives* (mon, ton, son, etc.). Those
    adjectives must be followed by a noun. **Possessive pronouns** replace the noun entirely, so you do
    not repeat it. They answer the question *« À qui ? »* (Whose is it?) and are formed with a definite
    article plus a stressed form that agrees with the gender and number of the omitted noun.  The pattern
    is simple: definite article **le / la / les** + stressed form **mien / tien / sien / nôtre / vôtre
    / leur** (with the appropriate accent when needed).  The whole phrase therefore matches the noun that
    has been left out.  For example, use **le** when the missing noun is masculine singular, **la** for
    feminine singular, and **les** for any plural, regardless of who owns the thing.  The stressed forms
    are : *mien, tien, sien, nôtre, vôtre, leur* (and their feminine/plural variants).  That is why we
    say **le mien**, **la mienne**, **les miens**, **les miennes**, etc., rather than *mon‑mien* or similar
    constructions.  Below is the complete list of possessive pronouns used in Québec French (the same
    as in standard French):  *Le mien / La mienne / Les miens / Les miennes* (mine)  *Le tien / La tienne
    / Les tiens / Les tiennes* (yours – informal)  *Le sien / La sienne / Les siens / Les siennes* (his
    / hers / its)  *Le nôtre / La nôtre / Les nôtres* (ours)  *Le vôtre / La vôtre / Les vôtres* (yours
    – formal or plural)  *Le leur / La leur / Les leurs* (theirs)  ---  **Examples:**  1. C’est mon sac.
    C’est **le mien**. (It’s my bag. It’s mine.)  2. Ta voiture est bleue, **la mienne** est rouge. (Your
    car is blue; mine is red.)  3. Ce n’est pas ton souper, c’est **le nôtre**. (This isn’t your supper;
    it’s ours.)  ---  **Common pitfalls for English speakers:**  1. **Gender and number agreement:** The
    pronoun must match the gender and number of the noun it replaces. If the omitted noun is *la voiture*
    (feminine singular), you must use **la mienne**, even if the speaker is male.  2. **The circumflex
    accent:** Remember the accent on **le nôtre** and **le vôtre**. Without the circumflex they would
    be confused with the possessive adjectives *notre* and *votre*.  *Note: In Québec, *le nôtre* and
    *le vôtre* are used the same way as in standard French.*'
