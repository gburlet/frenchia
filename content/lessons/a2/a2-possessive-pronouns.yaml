- type: reading
  id: reading
  title: Les pronoms possessifs
  passage_fr: |-
    C’est la fin de semaine et je suis chez des amis à Montréal. Nous sommes dans le salon et nous regardons des photos de voyage.

    **A** : — Regarde cette photo ! C’est mon voyage en Gaspésie. Est‑ce que tu aimes la vue ?
    **B** : — Oui, elle est magnifique ! Mais j’adore la tienne, celle de la montagne.
    **A** : — Oui, la mienne est récente, la tienne est ancienne. Oh, attends ! Ce n’est pas mon appareil photo sur la table, c’est le tien. Je pensais que c’était le mien.
    **B** : — Non, le mien est dans mon sac à dos. Celui‑là, c’est celui de Julie.

    Ensuite, nous parlons de nos projets pour l’été. Les projets de Julie et Marc sont très excitants, mais les nôtres sont plus simples. Nous voulons juste relaxer au chalet.

    — Est‑ce que tu as fini ton dîner ?
    — Presque. Veux‑tu le mien ? Il reste beaucoup de nourriture.
  translation_en: |-
    It's the weekend and I am at some friends' place in Montreal. We are in the living room and looking at travel photos.

    A: — Look at this picture! It's my trip to Gaspésie. Do you like the view?
    B: — Yes, it's magnificent! But I love yours, the one of the mountain.
    A: — Yes, mine is recent, yours is old. Oh, wait! That's not my camera on the table, it's yours. I thought it was mine.
    B: — No, mine is in my backpack. That one is Julie's.

    Then we talk about our plans for the summer. Julie and Marc's plans are very exciting, but ours are simpler. We just want to relax at the cottage.

    — Have you finished your lunch?
    — Almost. Do you want mine? There's a lot of food left.
