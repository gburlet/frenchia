- type: reading
  id: reading
  title: Les pronoms possessifs
  passage_fr: "C'est la fin de semaine et je suis chez des amis à Montréal. Nous sommes dans le salon\
    \ et nous regardons des photos de voyage. \n\n— Regarde cette photo ! C'est mon voyage en Gaspésie.\
    \ Est-ce que tu aimes la vue ?\n— Oui, elle est magnifique ! Mais j'adore la tienne, celle de la montagne.\
    \ \n\n— Ma photo est ancienne, mais la tienne est très récente. Oh, attends ! Ce n'est pas mon appareil\
    \ photo sur la table, c'est le tien. Je pensais que c'était le mien.\n\n— Non, le mien est dans mon\
    \ sac à dos. \n\nEnsuite, nous parlons de nos projets pour l'été. Leurs projets sont très excitants,\
    \ mais les nôtres sont plus simples. Nous voulons juste relaxer au chalet. \n\n— Est-ce que tu as\
    \ fini ton dîner ?\n— Presque. Veux-tu le mien ? Il reste beaucoup de nourriture."
  translation_en: |-
    It's the weekend and I am at friends' houses in Montreal. We are in the living room and looking at travel photos.

    — Look at this photo! It's my trip to Gaspésie. Do you like the view?
    — Yes, it's magnificent! But I love yours, the one of the mountain.

    — My photo is old, but yours is very recent. Oh, wait! That's not my camera on the table, it's yours. I thought it was mine.

    — No, mine is in my backpack.

    Then, we talk about our plans for the summer. Their plans are very exciting, but ours are simpler. We just want to relax at the cottage.

    — Have you finished your lunch?
    — Almost. Do you want mine? There is a lot of food left.
