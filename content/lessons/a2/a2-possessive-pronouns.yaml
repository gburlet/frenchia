sections:
- type: explanation
  id: explanation
  heading: Les pronoms possessifs
  body: 'In your previous lessons, you learned about *possessive adjectives* (mon, ton, son, etc.). These
    must always be followed by a noun. **Possessive pronouns**, however, replace the noun entirely to
    avoid repetition. They answer the question *« À qui ? »* (Whose is it?) and are built with a definite
    article plus a stressed form that agrees with the replaced noun’s gender and number.  The stressed
    forms are not created by simply adding an ending to the adjective; they are separate words that derive
    from the adjective stem.  Here is the correct pattern : definite article **le / la / les** + stressed
    form **mien / tien / sien / nôtre / vôtre / leur** (with the appropriate accent when needed).  The
    whole phrase agrees with the noun that has been omitted.  For example, *le* is used when the missing
    noun is masculine singular, *la* for feminine singular, and *les* for plural, regardless of the owner’s
    gender.  The stressed forms are : *mien, tien, sien, nôtre, vôtre, leur* (and their feminine/plural
    variants).  This is why we say **le mien**, **la mienne**, **les miens**, **les miennes**, etc., rather
    than *mon‑mien* or similar constructions.  Below is the full list of possessive pronouns used in Québec
    French (the same as in standard French):  *Le mien / La mienne / Les miens / Les miennes* (mine)  *Le
    tien / La tienne / Les tiens / Les tiennes* (yours – informal)  *Le sien / La sienne / Les siens /
    Les siennes* (his / hers / its)  *Le nôtre / La nôtre / Les nôtres* (ours)  *Le vôtre / La vôtre /
    Les vôtres* (yours – formal or plural)  *Le leur / La leur / Les leurs* (theirs)  ---  **Examples:**
     1. C’est mon sac. C’est **le mien**. (It’s my bag. It’s mine.)  2. Ta voiture est bleue, **la mienne**
    est rouge. (Your car is blue; mine is red.)  3. Ce n’est pas ton souper, c’est **le nôtre**. (This
    isn’t your supper; it’s ours.)  ---  **Common Pitfalls for English Speakers:**  1. **Gender and Number
    Agreement:** French pronouns must match the gender and number of the noun they replace. If the omitted
    noun is *la voiture* (feminine singular), you must use **la mienne**, even if the speaker is male.
     2. **The Circumflex Accent:** Remember the accent on **le nôtre** and **le vôtre**. Without the circumflex
    they would be confused with the possessive adjectives *notre* and *votre*.  *Note: In Québec, *le
    nôtre* and *le vôtre* are used the same way as in standard French.*'
