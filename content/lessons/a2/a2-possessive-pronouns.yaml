- type: regional_note
  id: regional-note
  heading: Le coin du Québec (Québec Corner)
  body: In terms of grammar, possessive pronouns are used identically in both Québec and France. The rules
    for gender agreement and the forms (le mien, la tienne, etc.) do not change. However, because possessive
    pronouns are often used to talk about personal belongings and daily routines, you will notice different
    vocabulary in the surrounding sentences. For example, when discussing whose 'dinner' or 'weekend'
    it is, a Québécois person will naturally use the local terms provided in your vocabulary list. There
    are no specific regional variations for the pronouns themselves.
