- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: L''impératif'
  body: The grammar of the imperative is identical in both Québec and France. However, the context in
    which you use these commands can vary slightly. In Québec, speakers tend to use *tu* more readily,
    reserving *vous* for strangers, elders, or formal contexts. In France, the distinction between the
    *tu* and *vous* forms in commands can feel a bit more rigid, with *vous* often used in both formal
    and semi‑formal situations. When giving instructions, both regions use the same standard grammar,
    but the vocabulary surrounding the actions will differ (e.g., telling someone to go to the *dépanneur*
    vs. the *épicerie* or *supérette*).
