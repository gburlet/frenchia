sections:
- type: explanation
  id: explanation
  heading: 'L''impératif : Donner des ordres et des conseils'
  body: 'The imperative mood (*l''impératif*) is used to give orders, instructions, advice, or to make
    requests. In French, the imperative is unique because the subject pronouns (*tu, nous, vous*) are
    omitted. You simply conjugate the verb and place it at the beginning of the sentence.  ​For regular
    verbs, the conjugation is the same as the present tense for the *tu*, *nous*, and *vous* forms. However,
    there is a very important spelling rule for **-er** verbs in the *tu* form: you must drop the final
    **s**.  ​**Examples** (regular verbs):<br>• **Regarde !** – Look! (tu)<br>• **Prenez votre temps.**
    – Take your time. (vous)<br>• **Allons au dépanneur.** – Let’s go to the convenience store. (nous)
     ​**Negative Commands** : To make a negative command, place **ne … pas** around the conjugated verb.
    Object pronouns go between *ne* and the verb (e.g., *Ne le regarde pas*).<br>• **Ne mange pas de fromage.**
    – Don’t eat cheese.<br>• **N''oubliez pas vos clés.** – Don’t forget your keys.  ​**Pronoun Placement** :
    When using pronouns with the imperative, the rules change depending on whether the sentence is affirmative
    or negative:<br>**Affirmative** – the pronoun is attached to the end of the verb with a hyphen.<br> -
    **Appelle‑moi !** (Call me!)<br> - **Donnez‑lui le livre.** (Give him/her the book.)<br>**Negative**
    – the pronoun stays before the verb, as in a normal sentence.<br> - **Ne m''appelle pas.** (Don’t
    call me.)<br> - **Ne lui donnez pas le livre.** (Don’t give him/her the book.)  ​**Common Pitfalls** :<br>1.
    **The ‘S’ Drop** – English speakers often want to keep the *s* on *‑er* verbs (like *parler*). Remember:
    **Parle !** (not *Parles !*)<br>2. **Verb‑Pronoun Order** – In the affirmative imperative, the object
    pronoun follows the verb (e.g., *donne‑le‑moi*). Learners sometimes place the pronoun before the verb,
    which is only correct in the negative form.  ​**Regional Note** : In Québec, speakers tend to use
    *tu* more readily in informal contexts (friends, family). *Vous* is reserved for strangers, elders,
    or formal situations. In France, *vous* is also used for formal contexts, but the use of *tu* can
    be more conservative, especially with people you do not know well.  ​**Imperative Conjugation Table**
     ​| Personne | Verbe (ex. *parler*) | Forme affirmative | Forme négative |<br>|----------|-------------------|-------------------|----------------|<br>|
    **tu**   | parle             | **Parle !**       | **Ne parle pas.** |<br>| **nous** | parlons           |
    **Parlons !**     | **Ne parlons pas.** |<br>| **vous** | parlez            | **Parlez !**      |
    **Ne parlez pas.** |'
