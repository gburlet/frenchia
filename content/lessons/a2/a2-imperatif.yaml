- type: reading
  id: reading
  title: 'L''impératif : Donner des instructions et des conseils'
  passage_fr: C'est la fin de semaine ! Tu veux organiser une petite fête pour tes amis ? Écoute bien
    mes conseils. D'abord, appelle tes voisins pour les prévenir. Ne fais pas trop de bruit après 22 heures,
    c'est important. Ensuite, va au dépanneur pour acheter des boissons et des collations. N'oublie pas
    d'acheter du fromage et du pain aussi. Pour le souper, prépare un grand plat de pâtes. Donne‑moi les
    ingrédients, s'il te plaît, et je t'aiderai. Quand les invités arrivent, accueille‑les avec un sourire.
    Ne leur parle pas de ton travail, reste relax ! Enfin, range tout avant de dormir. Si tu suis ces
    instructions, tout se passera bien. Amuse‑toi bien !
  translation_en: It's the weekend! You want to organize a small party for your friends? Listen to my
    advice carefully. First, call your neighbors to let them know. Don't make too much noise after 10 p.m.,
    it's important. Next, go to the convenience store to buy drinks and snacks. Don't forget to buy some
    cheese and bread too. For supper, prepare a large dish of pasta. Give me the ingredients, please,
    and I will help you. When the guests arrive, welcome them with a smile. Don't talk to them about your
    work, stay relaxed! Finally, tidy everything up before going to sleep. If you follow these instructions,
    everything will go well. Have fun!
