- type: reading
  id: reading
  title: Préparer le souper
  passage_fr: |-
    C'est le vendredi soir et je prépare le souper pour ma famille. Je vais à l'épicerie parce qu'il n'y a plus de nourriture dans le frigo. J'ai besoin d'acheter du poulet et de la crème pour une sauce délicieuse. Je veux aussi prendre du fromage et de la salade pour accompagner le plat principal.

    Ma femme aime beaucoup la cuisine québécoise. Elle veut de la soupe à l'oignon pour commencer le repas. Je n'achète pas de viande rouge ce soir, car nous voulons manger léger. Pour le dessert, je vais prendre de la tarte aux bleuets. Est‑ce qu'il y a du café pour après le souper ? Oui, il reste un peu de café dans la cafetière. C'est une belle soirée pour relaxer ensemble.
  translation_en: |-
    It's Friday evening and I am preparing supper for my family. I am going to the grocery store because there is no more food in the fridge. I need to buy some chicken and some cream for a delicious sauce. I also want to get some cheese and some salad to accompany the main dish.

    My wife really likes Québec cuisine. She wants some onion soup to start the meal. I am not buying any red meat tonight, because we want to eat light. For dessert, I am going to get some blueberry pie. Is there any coffee for after supper? Yes, there is a little coffee left in the coffee pot. It's a beautiful evening to relax together.
  glossary:
