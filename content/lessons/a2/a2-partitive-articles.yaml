- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Partitive Articles'
  body: In terms of grammar, the use of partitive articles (*du, de la, de l', des*) is virtually identical
    in both Québec and France. They are standard across the entire French-speaking world. However, because
    the vocabulary for everyday items (like food and household objects) often differs, you will notice
    that the nouns following these articles change depending on where you are. For example, while a person
    in France might talk about having *du petit-déjeuner* (breakfast), a Québécois person will almost
    always refer to *le déjeuner*.
