sections:
- type: explanation
  id: explanation
  heading: Les articles partitifs
  body: "In English, we often use 'some' or 'any' to talk about an unspecified quantity of something.\
    \ In French, we use **les articles partitifs** to express this. These are used when you are talking\
    \ about an amount of something that cannot be counted individually (like liquids, mass nouns, or abstract\
    \ concepts). \n\nHere is how they are formed:\n- **Du** (masculine singular): **Je mange du pain.**\
    \ (I am eating [some] bread.)\n- **De la** (feminine singular): **Je bois de la soupe.** (I am drinking\
    \ [some] soup.)\n- **De l'** (before a vowel or silent 'h'): **Je veux de l'eau.** (I want [some]\
    \ water.)\n- **Des** (plural): **J'achète des pommes.** (I am buying [some] apples.)\n\n**The Rule\
    \ of Negation**\nOne of the most important rules for A2 learners is that partitive articles change\
    \ when the sentence becomes negative. In a negative sentence, *du, de la, de l',* and *des* all change\
    \ to **de** (or **d'** before a vowel). \n\nExample:\n- Affirmative: **Je mange du fromage.** \n-\
    \ Negative: **Je ne mange pas de fromage.** (I don't eat [any] cheese.)\n\n**Common Pitfalls for English\
    \ Speakers**\n1. **Over-translating 'Some':** English speakers often try to use *un* or *une* when\
    \ they mean 'some.' Use *un/une* for a specific unit (one apple) and *des* for an unspecified quantity\
    \ (some apples). \n2. **Forgetting the Negation Change:** It is very common to say *Je ne veux pas\
    \ de l'eau*. Remember, once you say *ne... pas*, the article must become *de*. \n\n*Québec Note:*\
    \ While these rules are standard across the French-speaking world, you will frequently use these articles\
    \ when talking about your *souper* or when *faire l'épicerie* (to do the grocery shopping)!"
