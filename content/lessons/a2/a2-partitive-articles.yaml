- type: reading
  id: reading
  title: Préparer le repas du soir
  passage_fr: |-
    C’est vendredi soir et je prépare le repas du soir pour ma petite famille. Je passe d’abord au supermarché parce que le frigo est vide. J’ai besoin d’acheter du poulet, du yaourt à la grecque et des herbes fraîches pour une sauce légère. J’ajoute aussi du fromage râpé et une salade de tomates et de concombre pour accompagner le plat principal.

    Ma femme adore les recettes simples. Elle propose une petite soupe de légumes pour commencer le repas. Je ne mange pas de viande rouge ce soir, car nous voulons manger plus sainement. Pour le dessert, je choisis une tarte aux pommes maison. Y a-t-il du café pour après le repas ? Oui, il reste un peu de café dans la cafetière. C’est une belle soirée pour se détendre ensemble.
  translation_en: |-
    It's Friday evening and I am preparing the evening meal for my small family. I first stop at the supermarket because the fridge is empty. I need to buy some chicken, Greek yogurt and fresh herbs for a light sauce. I also add grated cheese and a tomato-cucumber salad to accompany the main dish.

    My wife loves simple recipes. She suggests a small vegetable soup to start the meal. I am not eating any red meat tonight, because we want to eat healthier. For dessert, I choose a homemade apple pie. Is there any coffee for after the meal? Yes, there is a little coffee left in the coffee pot. It's a beautiful evening to relax together.
  glossary:
  - fr: supermarché
    en: supermarket
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Je vais au supermarché.
    example_en: I am going to the supermarket.
  - fr: tarte aux pommes
    en: apple pie
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: J’ai fait une tarte aux pommes hier.
    example_en: I made an apple pie yesterday.
  - fr: se détendre
    en: to relax, to unwind
    pos: verb
    region: common
    formality: standard
    example_fr: J’aime me détendre le soir.
    example_en: I like to relax in the evening.
