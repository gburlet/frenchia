sections:
- type: explanation
  id: explanation
  heading: Les articles partitifs
  body: |-
    In English, we often use **some** or **any** to talk about an unspecified quantity of something. In French, we use **les articles partitifs** to express this. They are used when you are talking about an amount that cannot be counted individually (liquids, mass nouns, or abstract concepts).  **du, de la, de l'** are the three partitive forms for uncountable amounts; **un, une, des** are the **indefinite articles** used for countable items (singular or plural), and **les** is used for specific or general plural nouns.  When the quantity is indefinite and the noun is uncountable, the partitive is required.  Below are the three partitive forms with A2-level examples that illustrate everyday situations such as work, school, family life, health, travel, and hobbies.  ---

    ### Formation

    - **Du** (masculine singular) – *Je bois du café avant la réunion.* (I drink [some] coffee before the meeting.)

    - **De la** (feminine singular) – *Elle met de la crème dans sa soupe.* (She adds [some] cream to her soup.)

    - **De l'** (before a vowel or silent *h*) – *Nous prenons de l'eau pendant la pause.* (We take [some] water during the break.)

    - **Des** (plural **indefinite article**) – *Ils achètent des pommes au marché.* (They buy [some] apples at the market.)  ---

    ### The Rule of Negation

    In a negative sentence, the partitive forms **du, de la, de l'** become **de** (or **d'** before a vowel). The plural indefinite article **des** also changes to **de** in the negative.

    **Example:**

    - **Affirmative:** *Je mange du fromage pendant le cours.*

    - **Negative:** *Je ne mange pas de fromage pendant le cours.* (I don't eat [any] cheese during the class.)  ---

    ### Common Pitfalls for English Speakers

    1. **Over-translating “some.”** English speakers often try to use *un* or *une* when they mean “some.” Use *un/une* for a specific unit (e.g., *un livre* = one book) and *du/de la/de l'* for an unspecified quantity of an uncountable noun.

    2. **Forgetting the negation change.** A frequent error is *Je ne veux pas de l'eau.* The correct form is *Je ne veux pas **d'**eau.*  ---

    ### Québec Note

    These rules are the same in all French-speaking regions. You will encounter partitive articles in many everyday contexts—whether you are at work, in class, preparing a meal, or doing the grocery shopping (*faire les courses*).
