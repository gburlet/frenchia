sections:
- type: explanation
  id: explanation
  heading: Le présent des verbes en -er
  body: "***\n### How to form the present tense of regular -er verbs\n\n1. **Identify the infinitive**\
    \ (the verb ending in **-er**).  Example: *parler*, *aimer*, *travailler*.\n2. **Remove the -er**\
    \ to get the stem.  \n   *parler → parl-*, *aimer → aim-*, *travailler → travaill-*.\n3. **Add the\
    \ personal endings** that are the same for every regular -er verb:\n   \n   | Subject | Ending |\n\
    | --------- | -------- |\n   | je      | **-e** |\n   | tu      | **-es** |\n   | il/elle/on | **-e**\
    \ |\n   | nous    | **-ons** |\n   | vous    | **-ez** |\n   | ils/elles | **-ent** |\n   \n   The\
    \ ending **-ent** is silent, so the spoken form of *ils parlent* is the same as *il parle*.\n4. **Put\
    \ the subject pronoun in front** (unless the context makes it obvious).  \n   **Je parle** – I speak\n\
    \   **Tu aimes** – You like\n   **Nous travaillons** – We work\n\n### Using the present\nThe present\
    \ describes actions that happen **right now** or **habitually**.  \n- *Je **mange** à midi.* – I eat\
    \ at noon (habit).  \n- *Il **regarde** la télé.* – He is watching TV (right now).\n\nYou can also\
    \ combine **aller + infinitive** to talk about the near future: \n- *Nous **allons partir** demain.*\
    \ – We are going to leave tomorrow.\n\n### Common pitfalls for English speakers\n- **Forgetting the\
    \ silent -ent**: *Ils parlent* is pronounced *il parle*.  Do not add an extra “s” sound.\n- **Mixing\
    \ up -er and -ir endings**: *Finir* (-ir) uses *-is, -is, -it…*; remember that only verbs ending in\
    \ **-er** follow the table above.\n- **Dropping the subject pronoun**: In French the pronoun is usually\
    \ required, even when the verb form is clear (e.g., *Mange!* is an imperative, not a present statement).\n\
    \nPractice by taking everyday activities—*se lever, cuisiner, étudier, écouter*—and conjugating them\
    \ for each pronoun.  Once you master the pattern, you’ll be able to describe your day in French with\
    \ confidence.\n***"
