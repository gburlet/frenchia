- type: reading
  id: reading
  title: Une matinée au parc
  passage_fr: Chaque dimanche, je **marche** tôt jusqu’au balcon et je **prépare** mon déjeuner. Après,
    je **marche** jusqu’au parc avec mon chien. Nous **jouons** à la balle près du lac pendant une demi-heure.
    Pendant que je **regarde** un livre, mon chien **renifle** les fleurs. Vers midi, nous **rentrons**
    à la maison et je **prépare** un sandwich. L’après-midi, j'**appelle** ma sœur pour lui raconter notre
    promenade.
  translation_en: Every Sunday I walk early to the balcony and I prepare my breakfast. Afterwards I walk
    to the park with my dog. We play ball near the lake for half an hour. While I look at a book, my dog
    sniffs the flowers. Around noon we go back home and I prepare a sandwich. In the afternoon I call
    my sister to tell her about our walk.
