- type: regional_note
  id: regional-note
  heading: Brun et brin au Québec
  body: Québec speech keeps the nasal vowels distinct. The vowel in **brun** (/œ̃/) and the vowel in **brin**
    (/ɛ̃/) sound different, and so do **un** and **in**. Many speakers in France merge the two, so for
    them **brun** and **brin** sound the same. You will hear the difference in Québec, so listen for it
    in words like **brun**, **lundi**, **brin** and **vin**.
  variants: []
