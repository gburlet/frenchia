title: Les combinaisons de lettres
title_en: Letter Combinations
objectives:
- Pronounce ai/ei as in mais, seize (è), au/eau as in chaud, beau (o), ou as in vous, oi as in moi (wa)
- Pronounce the nasal vowels an/en (blanc, vent), in/ain (vin, pain), on (bon) and un (brun)
