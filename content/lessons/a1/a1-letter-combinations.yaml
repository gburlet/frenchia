sections:
- type: explanation
  id: explanation
  heading: Two letters, one sound
  body: |-
    In French, some pairs of letters work as a team and make a single sound. Learn the team, and you can read hundreds of words.

    - **ai** and **ei** sound like the "e" in "bed": **mais**, **seize**, **lait**.
    - **au** and **eau** sound like "o" in "go", without the glide at the end: **chaud**, **beau**.
    - **ou** sounds like "oo" in "food": **vous**, **rouge**.
    - **oi** sounds like "wa": **moi**, **trois**.

    Then come the **nasal vowels**. In **an/en** (**blanc**, **enfant**, **vent**), **in/ain/ein** (**vin**, **pain**, **plein**), **on** (**bon**, **maison**) and **un** (**brun**, **lundi**), the vowel sounds through your nose and the **n** (or **m**) is not pronounced as a separate consonant. Do not say "bon" like English "bonn"; stop at the vowel.

    **Pitfalls for English speakers**

    1. Pronouncing the **n** or **m** after a nasal vowel. When **n** or **m** is followed by a vowel, or is doubled (**nn**, **mm**), the vowel is not nasal and the consonant is heard: **une**, **fine**, **ami**, **image**, **bonne**, **comme**. Compare **bon** (nasal) and **bonne** (not nasal).
    2. Reading **ou** like the "ou" in "out", or **oi** like "oy" in "boy". French **ou** is always "oo", and **oi** is "wa".
