  type: multiple_choice
  question: Which word has a nasal vowel, with no separate n sound?
  options:
  - bonne
  - bon
  - une
  - ami
  answer_index: 1
  explanation: In **bon**, the n only nasalizes the vowel. In **bonne** the n is doubled, in **une** the
    n is followed by a vowel, and in **ami** the m is followed by a vowel, so the consonant is heard.
