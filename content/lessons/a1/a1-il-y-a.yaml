sections:
- type: explanation
  id: explanation
  heading: Il y a / Il n’y a pas de – Saying What Exists
  body: |-
    In French the impersonal expression **il y a** means “there is / there are”. It is used exactly like the English *there is/there are* and never changes with the gender or number of the noun that follows. The structure is:

    ```il y a + [article] + noun```

    - **il y a** *un livre* – there is a book

    - **il y a** *des enfants* – there are children

    - **il y a** *une idée* – there is an idea

    To make it negative, place **pas** after the verb and replace the article with **de** (or **d'** before a vowel):

    ```il n’y a pas de + noun (singular or plural)```

    - **Il n’y a pas de** *voiture* – there isn’t a car

    - **Il n’y a pas d’** *amis* – there are no friends

    ### Common pitfalls

    1. **Forgetting the *de* in the negative** – English speakers often say *Il n’y a pas **un** livre*; the correct form is *Il n’y a pas **de** livre*.

    2. **Confusing *il y a* with *c’est*** – *Il y a* expresses existence, while *c’est* describes or identifies. For example, *Il y a un problème* (There is a problem) is not the same as *C’est un problème* (It is a problem).

    ### Spoken form note

    In fast informal speech, native speakers (both in France and in Québec) often pronounce **il y a** as **y’a**. You may hear it in conversation, but in writing and in any formal or classroom context you should keep the full **il y a**.

    ### Quick practice

    - **Il y a** *un parc près de chez moi.* – There is a park near my house.

    - **Il n’y a pas de** *cinéma dans le quartier.* – There isn’t a cinema in the neighbourhood.

    Use these patterns whenever you need to describe what exists (or does not exist) in your surroundings.
