- type: reading
  id: reading
  title: Une petite salle de sport
  passage_fr: Dans mon quartier, il y a une petite salle de sport. Il y a des tapis de yoga, des haltères
    et un grand miroir. Il y a aussi une salle de cours où le prof donne des leçons de danse. La fin de
    semaine, il n’y a pas de cours de boxe, mais il y a un atelier de cuisine saine. Le soir, il n’y a
    pas de bruit, seulement le son de la musique douce. Il y a un tableau d’affichage avec les horaires
    et les prix.
  translation_en: In my neighbourhood there is a small gym. There are yoga mats, dumbbells and a big mirror.
    There is also a class room where the teacher gives dance lessons. On the weekend there are no boxing
    classes, but there is a healthy-cooking workshop. In the evening there is no noise, only the sound
    of soft music. There is a notice board with the schedule and the prices.
