sections:
- type: explanation
  id: explanation
  heading: La famille
  body: |-
    You will learn the basic words you need to talk about the people who make up your family. The focus is on **simple present statements** and the construction **aller + infinitive** when you want to say what a family member is going to do.

    In this lesson you will meet the most common family nouns, learn their gender, and see how to use the possessive adjectives **mon / ma / mes** with them.

    For example: **Ma mère va cuisiner ce soir** (My mother is going to cook tonight).
