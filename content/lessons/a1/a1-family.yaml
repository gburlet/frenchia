  prompt: My brother is going to watch a movie tonight.
  accepted_answers:
  - Mon frère va regarder un film ce soir.
  - Mon frère va voir un film ce soir.
  hint: Combine aller + infinitive to express a future plan. Both regarder and voir work for “to watch”.
