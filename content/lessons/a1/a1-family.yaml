- id: ex-06
  grammar_topics: []
  type: multiple_choice
  question: Which sentence correctly says that the mother is going to cook dinner tonight?
  options:
  - Ma mère va préparer le souper ce soir.
  - Ma mère aller préparer le souper ce soir.
  - Ma mère va préparer le souper ce nuit.
  - Ma mère vas préparer le souper ce soir.
  answer_index: 0
  explanation: The construction *aller + infinitive* uses the present tense of *aller* (va) followed directly
    by the infinitive *préparer*. The time expression is *ce soir* (this evening). Options B, C and D
    contain a verb form error, a wrong time expression, or an incorrect agreement.
- id: ex-07
  grammar_topics: []
  type: multiple_choice
  question: 'Choose the sentence that correctly describes what the younger sister is doing right now:'
  options:
  - Ma sœur cadette lit un roman.
  - Ma sœur cadette lire un roman.
  - Ma sœur cadette lit un romans.
  - Ma sœur cadette est lire un roman.
  answer_index: 0
  explanation: For a present-tense statement we need the verb *lire* conjugated as *lit* for *elle*. The
    direct object *un roman* stays singular. Option B uses the infinitive *lire* instead of the conjugated
    form *lit*; option C has the wrong plural *romans*; option D incorrectly combines *être* with an infinitive.
    Only option A is correct.
- id: ex-08
  grammar_topics: []
  type: multiple_choice
  question: Which of the following sentences correctly uses the family vocabulary to say that the uncle
    works as an engineer?
  options:
  - Mon oncle travaille comme ingénieur.
  - Mon oncle travaille comme ingénieure.
  - Mon oncle travaille comme ingénieurs.
  - Mon oncle travailler comme ingénieur.
  answer_index: 0
  explanation: '*Oncle* is masculine, so the profession stays masculine (*ingénieur*) and the verb must
    be conjugated as *travaille* (present 3rd person singular). Option B uses the feminine form, C uses
    a plural noun, and D uses the infinitive *travailler* instead of the conjugated form.'
