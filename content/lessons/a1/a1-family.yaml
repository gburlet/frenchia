- type: reading
  id: reading
  title: Une après-midi en famille
  passage_fr: En fin de semaine, ma tante Claire vient nous rendre visite. Elle apporte un gâteau au chocolat
    et elle va aider ma cousine à faire du dessin. Mon oncle Pierre arrive aussi avec sa femme, ma tante
    Nicole. Ils vont préparer un grand repas pour toute la famille. Mon frère aîné joue aux cartes avec
    mon neveu, tandis que ma sœur cadette lit un roman. Le soir, mon grand-père raconte une histoire drôle
    et tout le monde va écouter attentivement.
  translation_en: This weekend, my aunt Claire is coming to visit us. She brings a chocolate cake and
    she is going to help my cousin do some drawing. My uncle Pierre also arrives with his wife, my aunt
    Nicole. They are going to prepare a big meal for the whole family. My older brother is playing cards
    with my nephew, while my younger sister is reading a novel. In the evening, my grandfather tells a
    funny story and everyone is going to listen carefully.
  glossary:
  - fr: aîné(e)
    en: elder, older (used for siblings)
    pos: adjective
    gender: m
    region: common
    formality: standard
    example_fr: mon frère aîné
    example_en: my older brother
  - fr: cadet(te)
    en: younger (used for siblings)
    pos: adjective
    gender: f
    region: common
    formality: standard
    example_fr: ma sœur cadette
    example_en: my younger sister
  - fr: attentivement
    en: attentively
    pos: adverb
    region: common
