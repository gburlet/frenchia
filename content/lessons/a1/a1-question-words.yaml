sections:
- type: explanation
  id: explanation
  heading: Les mots interrogatifs
  body: |-
    ***

    ### Les mots interrogatifs

    Interrogative words let you ask for **who, what, where, when, how, why** and **how many / how much**. In this lesson we form questions with **subject-verb inversion** (using a hyphen), or with **est-ce que**, or with the plain order (tu pars…) as alternatives. The question mark is the only punctuation change.

    | French word | English meaning | Example (present) |
    | ------------- | ---------------- | ------------------- |
    | **qui** | who | **Qui** vient **aujourd’hui** ? – Who is coming today? |
    | **que / qu’** | what | **Qu’est-ce que** tu **fais** ? – What are you doing? |
    | **où** | where | **Où** est le **café** ? – Where is the café? |
    | **quand** | when | **Quand** pars-tu **en vacances** ? – When are you going on vacation? |
    | **comment** | how | **Comment** vas-tu **au travail** ? – How do you get to work? |
    | **pourquoi** | why | **Pourquoi** étudies-tu **le français** ? – Why are you studying French? |
    | **combien** (de) | how many / how much | **Combien** de **temps** faut-il **pour** finir ? – How much time does it take to finish? |

    **Pitfall #1 – Forgetting the *est-ce que* bridge after *qu’***: Learners sometimes write *Qu’est-ce tu fais ?* without the **est-ce que** part. The correct form is **Qu’est-ce que tu fais ?**.

    **Pitfall #2 – Mixing up *que* and *qui* for people**: Using *que* instead of *qui* when the answer is a person is wrong. For example, *Que cherches-tu ?* should be **Qui cherches-tu ?** (or simply **Qui cherche ?** when the subject is omitted).

    Use these words whenever you need information. Pair them with the verb *aller* + infinitive for future plans: **Quand est-ce que tu vas **aller** au cinéma ?** – When are you going to the cinema? ***
