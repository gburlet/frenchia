  question: Choose the correct question for asking the price of a train ticket.
  options:
  - Combien coûte le billet de train?
  - Combien de temps le billet de train?
  - Combien coûte-t-il le billet de train?
  - Combien il le billet coûte?
  answer_index: 0
  explanation: 'At the A1 level the lesson teaches the pattern **question word + verb + subject** (without
    repeating the subject). The correct sentence is *Combien coûte le billet de train ?*. Option 2 adds
    an irrelevant complement (*de temps*). Option 3 repeats the subject (*il* and *le billet*) while also
    using inversion (*coûte-t-il*); the duplication of the subject makes the sentence unsuitable for this
    level. Option 4 places the pronoun *il* before the verb, which is also incorrect at this level. Therefore
    the only correct answer is option 1: *Combien coûte le billet de train ?*'
