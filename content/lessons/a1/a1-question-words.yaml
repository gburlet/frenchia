- type: reading
  id: reading
  title: Les questions au marché
  passage_fr: Ce matin, je vais au marché du quartier. **Qui** vend les fruits? C’est Madame Léa, elle
    a des pommes rouges et des poires sucrées. **Que** cherches-tu? Je cherche des tomates pour la salade.
    **Où** se trouve le stand des fromages? Il est près de la fontaine. **Quand** ouvre le stand du pain?
    Il ouvre à huit heures. **Comment** payes-tu? Je paye en espèces. **Pourquoi** achètes-tu des légumes
    bio? Parce qu’ils sont plus sains. **Combien** de pommes veux-tu? Je veux trois pommes.
  translation_en: This morning, I’m going to the neighbourhood market. **Who** sells the fruit? It’s Mrs.
    Léa, she has red apples and sweet pears. **What** are you looking for? I’m looking for tomatoes for
    the salad. **Where** is the cheese stall? It’s near the fountain. **When** does the bread stall open?
    It opens at eight o’clock. **How** do you pay? I pay in cash. **Why** do you buy organic vegetables?
    Because they are healthier. **How many** apples do you want? I want three apples.
