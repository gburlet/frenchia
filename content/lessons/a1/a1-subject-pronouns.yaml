sections:
- type: explanation
  id: explanation
  heading: Les pronoms sujets
  body: |-
    ### What are subject pronouns?

    A subject pronoun replaces the noun that performs the action of the verb. In French the pronoun must agree in gender and number with the person it represents. The nine basic pronouns are :

    | Person | Pronoun |
    | --- | --- |
    | I | **je** |
    | you (informal) | **tu** |
    | he / it (masc.) | **il** |
    | she / it (fem.) | **elle** |
    | we (colloquial) | **on** |
    | we (formal or written) | **nous** |
    | you (formal / plural) | **vous** |
    | they (masc. or mixed) | **ils** |
    | they (fem.) | **elles** |

    ### How to use them in the present tense

    The verb is conjugated **after** the pronoun. The most common pattern for regular -er verbs is :

    - **je** parle

    - **tu** parles

    - **il/elle/on** parle

    - **nous** parlons

    - **vous** parlez

    - **ils/elles** parlent

    For **aller + infinitive** (future-like construction) the same pronouns are used :

    - **je** vais manger

    - **tu** vas étudier

    - **on** va partir

    - **nous** allons visiter

    - **vous** allez travailler

    - **ils/elles** vont arriver

    ### on for “we” in conversation

    In spoken French (both in France and in Québec), **on** is the normal way to say “we” in everyday conversation. **Nous** is more formal or written.

    **Example** :

    - **On** va au cinéma ce soir. *(We are going to the movies tonight.)*

    **Regional variants** :

    - **fr** : *On se voit ce week-end.*

    - **qc** : *On se voit en fin de semaine.*

    ### Common pitfalls for English speakers

    1. **Omitting the pronoun** – English can drop the subject (“(I) speak French”), but French never does. Always keep the pronoun: **Je parle français**, never *Parle français* (unless it’s an imperative).

    2. **Confusing *on* with *nous*** – In conversation, *on* is the usual way to say “we” (in France and in Québec). *Nous* is reserved for formal or written contexts.

    ### Quick check

    - **Tu** ___ (être) étudiant ? → **Tu es** étudiant.

    - **On** ___ (aller) au parc ? → **On va** au parc.

    - **Ils** ___ (avoir) faim. → **Ils ont** faim.

    Practice replacing nouns with the appropriate pronoun and conjugating the verb. Soon the pronouns will feel as automatic as saying *I* in English!
