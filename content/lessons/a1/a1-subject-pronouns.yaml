  title: Une matinée au parc
  passage_fr: Ce matin, **je** me lève tôt et **je** prends mon vélo. **Tu** arrives avec ton chien, et
    **il** court après la balle. **Elle** apporte des croissants pour le déjeuner. **On** décide de faire
    le tour du lac. **Nous** admirons les canards qui nagent tranquillement. **Vous** venez avec vos enfants
    et **vous** jouez au frisbee. **Ils** lisent un livre sous un arbre, et **elles** dessinent des fleurs.
    **On** se retrouve tous à la fontaine pour boire de l’eau.
  translation_en: This morning, I get up early and take my bike. You arrive with your dog, and he runs
    after the ball. She brings croissants for breakfast. We decide to walk around the lake. We admire
    the ducks swimming calmly. You come with your children and you play frisbee. They read a book under
    a tree, and they (feminine) draw flowers. We all meet at the fountain to drink water.
