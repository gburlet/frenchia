sections:
- type: explanation
  id: explanation
  heading: Dire l'heure
  body: |-
    ### The basic pattern
    To say **what time it is**, use the impersonal verb **il est** followed by the hour, then the minutes if needed.

    - **Il est trois heures.** – It is three o’clock.
    - **Il est trois heures quinze.** – It is three fifteen (3:15).
    - **Il est trois heures et quart.** – It is a quarter past three.
    - **Il est trois heures et demie.** – It is half past three.
    - **Il est trois heures moins le quart.** – It is quarter to three (2:45).

    When you want to be more precise, add the minutes after the hour, separated by a space. No “and” is used; you simply list the numbers.

    ### 12-hour vs. 24-hour clock
    In everyday conversation French speakers usually use the 12-hour clock and add a period of the day:

    - **Il est trois heures du matin.** (3 am)
    - **Il est trois heures de l’après-midi.** (3 pm)
    - **Il est sept heures du soir.** (7 pm – *du soir* is used from roughly 6 pm onward).

    For schedules, transport timetables, or formal contexts, the 24-hour clock is preferred. Write the hour, then an *h* (pronounced *heure*), and the minutes, with a space around the *h* and no leading zero for single-digit hours:

    - **Il est 15 h.** – It is 15:00 (3 pm).
    - **Il est 8 h 30.** – It is 8:30 (8 am).

    ### Asking the time
    The polite formula is **« Quelle heure est-il ? »** (literally “What hour is it?”). You can also hear the informal **« Il est quelle heure ? »**.

    ### Common pitfalls for English speakers
    1. **Skipping the *il est* construction.** In English you can say “It’s three,” but French always needs *il est* before the hour.
    2. **Omitting *heures* or using *et* incorrectly.** Learners often say *trois quinze* or *trois heures et quinze*; the correct form is **trois heures quinze** (or **trois heures et quart** for 3:15).

    Practice by looking at a clock, saying the time out loud, and then asking a partner **« Quelle heure est-il ? »**. Happy timing!
