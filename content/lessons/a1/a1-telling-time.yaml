  id: reading
  title: Une matinée au marché
  passage_fr: Il est huit heures vingt du matin. Je marche jusqu’au marché du quartier. À neuf heures,
    le marchand de fruits ouvre son étal. Il est neuf heures quinze quand je choisis des pommes rouges.
    À dix heures, le boulanger commence à sortir du pain chaud. Il est dix heures trente quand je paie
    les croissants. Vers onze heures, le marché devient très animé. Il est onze heures cinquante quand
    je rentre chez moi avec mes achats.
  translation_en: It is 8:20 a.m. I walk to the neighbourhood market. At 9 o’clock the fruit seller opens
    his stall. It is 9:15 when I pick red apples. At 10 o’clock the baker starts taking out hot bread.
    It is 10:30 when I pay for the croissants. Around 11 a.m. the market becomes very busy. It is 11:50
    when I go home with my purchases.
