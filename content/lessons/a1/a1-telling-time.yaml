  type: multiple_choice
  question: You arrive at the bus stop and want to know the time. Which sentence correctly asks for the
    time in French?
  options:
  - Quoi heure est-il?
  - Est quelle heure?
  - Quelle heure est-il?
  - Qu’est-ce que l’heure?
  answer_index: 2
  explanation: The standard and most common way to ask the time is **« Quelle heure est-il ? »**. The
    first option (*Quoi heure est-il ?*) uses the wrong question word – *quoi* is not used to ask for
    the time. The second option (*Est quelle heure ?*) has an incorrect word order. The fourth option
    (*Qu’est-ce que l’heure ?*) is not idiomatic; it would be understood as “What is the hour?” rather
    than “What time is it?”. Therefore, the third sentence is the correct choice. (In informal spoken
    French you may also hear *Il est quelle heure ?*, but it is not the standard form taught at this level.)
