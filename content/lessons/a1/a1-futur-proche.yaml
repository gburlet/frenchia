- type: reading
  id: reading
  title: Le futur proche – Lecture
  passage_fr: En fin de semaine, ma famille et moi allons faire une randonnée dans le parc national. Nous
    allons partir tôt, vers six heures du matin, parce que le sentier est très beau au lever du soleil.
    Mon frère va prendre son appareil photo pour capturer les paysages, et ma sœur va préparer un pique-nique
    avec des sandwichs et des fruits. Après la marche, nous allons revenir à la cabane et nous allons
    regarder un film ensemble. C’est un programme simple, mais nous allons passer un très bon moment.
  translation_en: This weekend, my family and I are going to go hiking in the national park. We are going
    to leave early, around six in the morning, because the trail is very beautiful at sunrise. My brother
    is going to take his camera to capture the scenery, and my sister is going to prepare a picnic with
    sandwiches and fruit. After the walk, we are going to return to the cabin and we are going to watch
    a movie together. It is a simple plan, but we are going to have a very good time.
