sections:
- type: explanation
  id: explanation
  heading: Le futur proche – expressing plans and imminent actions
  body: |-
    The **futur proche** is the simplest way to talk about something you are going to do soon. It is formed with the present tense of **aller** + the infinitive of the main verb.

    ⟶ `Subject + present of aller + infinitive` → `Je vais manger`, `Nous allons partir`…

    Aller is **irregular** and must be memorised:

    - je **vais**

    - tu **vas**

    - il/elle/on **va**

    - nous **allons**

    - vous **allez**

    - ils/elles **vont**

    **Examples**

    - **Je vais acheter** du pain. – I am going to buy bread.

    - **Nous allons visiter** le musée demain. – We are going to visit the museum tomorrow.

    - **Ils vont regarder** un film ce soir. – They are going to watch a movie tonight.

    **When to use it**

    - A plan that is already decided: *Je vais appeler Marie ce soir.*

    - An action that will happen in the very near future: *Le train va arriver dans cinq minutes.*

    - A prediction based on present evidence: *Il va pleuvoir, regarde les nuages.*

    **Common pitfalls**

    - **Negation placement** – In the futur proche only the conjugated *aller* is negated. The pattern is *ne* + aller + *pas* + infinitive: **Je ne vais pas manger** (not *Je ne vais manger pas*).

    - **Missing aller** – Learners sometimes say *Je mange demain* when they mean “I am going to eat tomorrow.” The present sentence is grammatically correct, but at A1 the everyday way to express a near-future plan is the futur proche: **Je vais manger** demain.

    - **Confusing the simple future with the futur proche** – Some beginners say *Je mangerai demain* for a near-future plan. The simple future is correct French, but at A1 the preferred, more natural form for a decided plan is the futur proche: **Je vais manger** demain.

    Remember: the futur proche is a present-tense construction that points forward. Once you have the correct form of *aller*, you can pair it with any infinitive and instantly talk about tomorrow’s plans, tonight’s movie, or the next bus arriving.
