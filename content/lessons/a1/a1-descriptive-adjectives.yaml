sections:
- type: explanation
  id: explanation
  heading: Les adjectifs qualificatifs – accord et position
  body: |-
    In French an adjective (l’adjectif qualificatif) describes a noun just like in English, but it must **agree** with that noun in gender (masculine/feminine) and number (singular/plural). The agreement is made by adding a final **-e** for feminine, **-s** for plural, and **-es** for feminine-plural. Below are the four forms for several typical adjectives used at the A1 level. All sentences are in the present tense and use everyday vocabulary. When an adjective can appear both before and after the noun, the meaning may shift (e.g., *un homme pauvre* = a man who is poor vs. *un pauvre homme* = a pitiable man). The BAGS adjectives (beauty, age, goodness, size) normally precede the noun, and they have special forms before a vowel or mute *h* (bel, nouvel, vieil). Remember to place the adjective in the correct position and to make it agree with the noun it modifies. Practice by matching nouns with the correct form of the adjective, paying attention to gender, number, and typical position. ---

    **Table : Adjectifs courants avec leurs quatre formes**

    | Masculin singulier | Féminin singulier | Masculin pluriel | Féminin pluriel |
    | ------------------- | ------------------- | ------------------ | ----------------- |
    | **grand** | **grande** | **grands** | **grandes** |
    | **rouge** (déjà en -e) | **rouge** | **rouges** | **rouges** |
    | **beau** → **bel** (devant voyelle ou h muet) | **belle** | **beaux** | **belles** |
    | **nouveau** → **nouvel** (devant voyelle ou h muet) | **nouvelle** | **nouveaux** | **nouvelles** |
    | **vieux** → **vieil** (devant voyelle ou h muet) | **vieille** | **vieux** | **vieilles** |

    ---

    **Placement** : most adjectives come **after** the noun (e.g., *une maison blanche*, *des enfants heureux*). A small group of common adjectives (beauty, age, goodness, size) normally precede the noun: *un **beau** jour, une **vieille** voiture, un **bon** ami, un **grand** problème*. When an adjective can appear in both positions, the meaning can shift (e.g., *un homme pauvre* = a man who is poor vs. *un pauvre homme* = a pitiable man).

    ### Common pitfalls for English speakers

    - **Forgetting the extra -e for feminine** – many learners write *un grand garçon* correctly but then say *une grand fille*; it must be **une grande fille**.

    - **Adding an extra -e to adjectives that already end in -e** – *rouge* stays *rouge* in the feminine singular; the plural is simply *rouges* (just add -s to the whole word).

    - **Missing the BAGS special forms before a vowel** – remember *bel*, *nouvel*, *vieil* instead of *beau*, *nouveau*, *vieux* when the next word begins with a vowel or mute *h*.

    ### Quick check

    - *Le chat **noir*** → **masc. sing.**

    - *Les maisons **blanches*** → **fem. pl.**

    - *Une **vieille** amie* → adjective before noun, **fem. sing.**
