  type: multiple_choice
  question: Which word means “where” and contains an accent?
  options:
  - où
  - ou
  - oua
  answer_index: 0
  explanation: « où » (with a grave accent) means “where” and is pronounced /u/. The form « ou » without
    an accent means “or”. The third option « oua » is not a French word. The accent changes the meaning.
