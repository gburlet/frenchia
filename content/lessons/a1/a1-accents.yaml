exercises:
- id: ex-01
  grammar_topics:
  - accents
  type: multiple_choice
  question: Which word contains the acute accent é that gives the closed *ay* sound?
  options:
  - père
  - été
  - très
  - à
  answer_index: 1
  explanation: The acute accent **é** is pronounced /e/ (closed *ay*). **été** has **é** on both e’s,
    so it is the correct choice. **père** and **très** use the grave accent **è**, and **à** has a grave
    accent on a different vowel.
- id: ex-02
  grammar_topics:
  - accents
  type: multiple_choice
  question: Select the word that uses the grave accent è (open *eh* sound).
  options:
  - café
  - façade
  - été
  - mère
  answer_index: 3
  explanation: '**mère** contains **è**, which is pronounced /ɛ/ (open *eh*). **café** has an acute **é**,
    **façade** has a cedilla under **c**, and **été** has acute **é**. No other option uses the grave
    accent **è**.'
- id: ex-03
  grammar_topics:
  - accents
  type: multiple_choice
  question: Which of the following sentences uses the correct accent on the preposition meaning “to” or
    “at”?
  options:
  - Je vais à la bibliothèque.
  - Je vais a la bibliothèque.
  - Je vais à le bibliothèque.
  - Je vais à la bibliothéque.
  answer_index: 0
  explanation: The preposition **à** (with a grave accent) is the correct form before any noun. Without
    the accent, **a** is the verb *avoir*. Option 1 (“Je vais à la bibliothèque.”) uses the correct accent
    and spelling. Option 2 omits the accent. Option 3 uses the masculine article **le** with the feminine
    noun *bibliothèque*; it should be **à la**. Option 4 misspells *bibliothèque* with an acute accent
    (**é**) instead of the correct grave accent (**è**).
- id: ex-04
