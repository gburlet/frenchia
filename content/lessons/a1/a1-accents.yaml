sections:
- type: explanation
  id: explanation
  heading: Les accents et la cédille
  body: |-
    In French the acute accent **é** and the grave accent **è** are the two most common marks. Their proper names are **accent aigu** (é) and **accent grave** (è). The cedilla (ç) is a separate sign that makes a soft *s* sound before *a, o, u*.

    **Accent aigu (é)** – a closed, bright *ay* sound, e.g., *café*, *été*, *mangé*.
    **Accent grave (è)** – an open *eh* sound, e.g., *père*, *très*, *frère*.
    **Accent circonflexe (ê, ô, â, î, û)** – often indicates a historical *s* (e.g., *forêt* < *forest*) and can affect pronunciation. Notable examples:
    - *côté* – the **ô** gives a closed /o/ sound.
    - *dû* – the **û** distinguishes the past participle of *devoir* from *du* (de + le).
    **Tréma (ë, ï, ü)** – signals that the vowel is pronounced separately from the preceding vowel. Example: *Noël*, *naïf*.
    **À vs a** – the grave accent on *à* marks the preposition *à* (to/at) and distinguishes it from the verb *a* (has). Example: *Je vais à la gare* vs *Il a un livre*.
    **Ù** appears only in *où* (where) to differentiate it from *ou* (or). Example: *Où es-tu ?* vs *ou bien*.
    **Ç (cédille)** – makes *c* sound like *s* before *a, o, u*. Example: *garçon*, *façade*, *reçu*.

    **Common pitfalls**
    1. **Confusing é and è** – *é* is tighter (*ay*), *è* is more open (*eh*).
    2. **Omitting the accent on où** – *ou* means “or”, *où* means “where”.

    Practice saying each pair aloud and notice the mouth position: tighter for **é**, more relaxed for **è/ê**. With a little listening, the accents become a natural cue for correct pronunciation.
- type: examples
  id: examples
  heading: Exemples d’accents
  examples:
  - fr: J’ai acheté du fromage **à** la ferme.
    en: I bought cheese **at** the farm.
    note: ‘à’ marks location; without the accent it would be the verb ‘a’ (has).
    region: common
  - fr: Le **café** du coin sert des croissants **chauds**.
    en: The corner café serves warm croissants.
    note: ‘é’ gives the closed /e/ sound; ‘café’ is a noun, not a verb.
    region: common
  - fr: Mon **père** travaille **dans** un bureau **à** Paris.
    en: My father works in an office in Paris.
    note: ‘è’ is the open /ɛ/ sound.
    region: common
  - fr: Nous **déjeunons** **tôt** le dimanche **à** la maison.
    en: We have breakfast early on Sunday at home.
    note: ‘é’ in ‘déjeunons’; ‘à’ shows place.
    region: common
  - fr: Le **côté** **gauche** du tableau est **blanc**.
    en: The left side of the painting is white.
    note: ‘ô’ (circumflex) gives the closed /o/ sound in *côté*.
    region: common
  - fr: J’ai **vu** le **film** hier **au cinéma**.
    en: I saw the movie yesterday at the cinema.
    note: No accent on ‘vu’; the preposition ‘au’ is the contracted form of ‘à le’.
    region: common
  - fr: Il ne sait pas **où** il va.
    en: He doesn’t know where he is going.
    note: ‘où’ (question word) vs. ‘ou’ (or).
    region: common
  - fr: Où **est** le **boulanger** qui vend du **pain** frais?
    en: Where is the baker who sells fresh bread?
    note: ‘où’ (question word) vs. ‘ou’ (or).
    region: common
  - fr: Le **garçon** est **français**.
    en: The boy is French.
    note: ‘ç’ (cédille) makes the ‘c’ sound like /s/ before ‘a’.
    region: common
  - fr: La **soupe** était très **salée**.
    en: The soup was very salty.
    note: ‘é’ in *était* and *salée* (closed /e/); ‘è’ in *très* (open /ɛ/).
    region: common
- type: reading
  id: reading
  title: 'Lecture : Au marché du dimanche'
  passage_fr: Le dimanche matin, je vais au marché. J’achète des **pêches**. Elles sont **délicieuses**
    et **sucrées**. À côté, il y a du **fromage**. Le vendeur montre du **brie**. Je prends de la **crème**
    **épaisse**. Le **café** vend des **croissants** **chauds**. Il y a aussi du **thé** **vert**. Avant
    de partir, je dis merci au **boulanger**. Il me donne une **baguette** **croustillante**. C’est un
    moment **agréable**.
  translation_en: On Sunday morning, I go to the market. I buy peaches. They are delicious and sweet.
    Next to it, there is cheese. The seller shows brie. I take thick cream. The café sells hot croissants.
    There is also green tea. Before leaving, I thank the baker. He gives me a crunchy baguette. It is
    a pleasant moment.
