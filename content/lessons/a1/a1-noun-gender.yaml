sections:
- type: explanation
  id: explanation
  heading: Le genre des noms
  body: '<p>In French every noun has a gender: masculine (le) or feminine (la). At the A1 level you can
    often guess the gender from the word ending. Below are the most common patterns.</p><ul><li><strong>-eau,
    -age, -isme, -ment, -oir, -sme</strong> → usually masculine: <em>le bateau, le fromage, le tourisme,
    le gouvernement, le miroir, le charisme</em></li><li><strong>-tion, -sion, -té, -ette, -ance, -ence</strong>
    → usually feminine: <em>la nation, la décision, la liberté, la baguette, la patience, la différence</em></li><li><strong>-age
    (some exceptions)</strong> → most are masculine, but <em>la page, la plage</em> are feminine.</li><li><strong>-eur</strong>
    → masculine when it denotes a profession (<em>le docteur</em>), feminine when it denotes a quality
    (<em>la douceur</em>).</li></ul><p>When you learn a new noun, always learn it together with its article
    (<em>le</em> or <em>la</em>). This helps you remember the gender later.</p>'
