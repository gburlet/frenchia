- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: noun gender nuances'
  body: In everyday French the gender of most nouns follows the same patterns in Québec and in France,
    so learners can rely on the usual endings (-age, -tion, etc.). The only notable exception relevant
    to this lesson is the English loanword *job*. In France the word is masculine (un job, un boulot),
    whereas in Québec the familiar form is feminine (une job). This small shift can affect agreement with
    adjectives and past-participle forms, so it’s worth remembering when you speak or write in Québec.
  variants:
  - qc: une job
    fr: un job
    en: a job
    formality: standard
