- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: How greetings are used'
  body: In everyday conversation Québec shares most French greetings with France, but a few habits stand
    out. *Allô* is used not only on the telephone but also as an informal “hello” in face-to-face situations,
    whereas in France people usually say *Salut* or *Bonjour*. When someone says *merci*, the typical
    Québec reply is **bienvenue** (“you’re welcome”), while in France speakers more often answer *de rien*
    or *je vous en prie*. Finally, **tu** is used more widely in Québec than in France (among colleagues,
    younger people, and in casual settings), while **vous** remains the safe choice with strangers and
    elders.
  variants:
  - qc: Bienvenue (reply to merci)
    fr: De rien / Je vous en prie
    en: You’re welcome
    formality: standard
- type: reading
  id: reading
  title: Premiers contacts – Lecture courte
  passage_fr: |-
    Ce matin, Sophie arrive à la bibliothèque. **Allô!** Sophie crie en voyant son ami Marc. **Bonjour, Sophie!** Marc répond : **Comment vas-tu?**

    Sophie répond : **Je vais bien, merci.** Elle regarde la salle de lecture et dit à la bibliothécaire : **Bonjour, madame! Je vais emprunter un livre sur les oiseaux.**

    Marc, qui vient de finir son cours, ajoute : **Je vais aller au café après la bibliothèque.** Sophie sourit et dit : **Merci pour l’invitation. – De rien!**

    À la sortie, ils se disent : **À plus tard! Bonne journée!**
  translation_en: |-
    This morning, Sophie arrives at the library. **Hello!** Sophie shouts when she sees her friend Marc. **Good morning, Sophie!** Marc replies: **How are you?**

    Sophie answers: **I’m fine, thank you.** She looks at the reading room and says to the librarian: **Good morning, ma'am! I’m going to borrow a book about birds.**

    Marc, who has just finished his class, adds: **I’m going to go to the café after the library.** Sophie smiles and says: **Thanks for the invitation. – You’re welcome!**

    When they leave, they say to each other: **See you later! Have a good day!**
