  type: multiple_choice
  question: You meet a customer you have never met at 9 a.m. and want to greet them politely. Which of
    the following sentences is the best choice?
  options:
  - Allô, comment vas-tu?
  - Bonjour, comment allez-vous?
  - Bon après-midi, comment vas-tu?
  - Bonsoir, comment allez-vous?
  answer_index: 1
  explanation: At 9 a.m. the appropriate time-of-day greeting is **Bonjour**. Because the person is a
    stranger (a customer), the formal pronoun **vous** should be used. “Allô” is informal, “Bon après-midi”
    and “Bonsoir” refer to later parts of the day, and the informal “vas-tu” is not suitable in this context.
    The correct polite greeting is therefore **Bonjour, comment allez-vous ?**
