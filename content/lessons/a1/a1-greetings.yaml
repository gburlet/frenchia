sections:
- type: explanation
  id: explanation
  heading: Saluer – Greetings and Goodbyes
  body: |-
    In the very first moments of a conversation you need only a few set phrases.  All of them are **present-tense** statements or the *aller + infinitive* construction, so you can use them right away without worrying about other tenses.

    ### 1. Time-of-day greetings
    | French (formal) | French (informal) | English |
    | --- | --- | --- |
    | **Bonjour** | **Allô** | Good morning / Hello |
    | **Bon après-midi** | **Salut** | Good afternoon |
    | **Bonsoir** | **Salut** | Good evening |

    *Allô* is especially common in Québec, even when you meet someone face-to-face.  Use it with people you already know or with children; with strangers keep **bonjour** or **bonsoir**.

    ### 2. Choosing *tu* or *vous*
    - **Tu** is used with friends, family, peers, and often with younger adults in Québec.
    - **Vous** is the polite form for strangers, elders, teachers, or anyone you want to show respect to.

    **Example** – meeting a new neighbour: *Bonjour, **vous** êtes nouveau ici?* (Are you new here?)
    **Example** – greeting a colleague you see daily: *Salut, **tu** vas bien?* (Hey, how are you?)

    ### 3. Saying goodbye
    | French (formal) | French (informal) | English |
    | --- | --- | --- |
    | **Au revoir** | **À plus** / **À bientôt** | Goodbye / See you soon |
    | **Bonne journée** | **Bonne fin de semaine** | Have a good day / Have a good weekend |

    ### 4. Polite replies
    - When someone thanks you, you can answer **de rien**, **je vous en prie**, **pas de problème**, **bienvenue** (Québec) or **avec plaisir**.
    - *Merci beaucoup!* → **Bienvenue!** (in Québec) – this is a common pitfall for learners who expect the French-France answer *de rien*.

    ### Common pitfalls
    1. **Allô vs. Allô?** – In France *allô* is reserved for the telephone. In Québec it works as a casual hello, but avoid it in formal written contexts.
    2. **Mixing *tu* and *vous*** – Switching mid-conversation sounds rude. Decide early whether the relationship is informal (*tu*) or formal (*vous*) and stay consistent.

    Practice each pair aloud, notice the tone (formal = slightly slower, polite; informal = relaxed), and you’ll be ready for any first contact!
