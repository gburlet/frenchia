  grammar_topics: []
  type: multiple_choice
  question: Which sentence correctly states the day on which you will visit your aunt?
  options:
  - Je vais rendre visite à ma tante samedi.
  - Je vais rendre visite à ma tante le samedi.
  - Je vais rendre visite à ma tante au samedi.
  - Je vais rendre visite à ma tante en samedi.
  answer_index: 0
  explanation: When you name a specific day in a simple future plan with *aller + infinitif*, the day
    name is used adverbially without any article or preposition. *Samedi* alone is correct. The other
    options are wrong because they add an article (*le samedi* means ‘every Saturday’), a preposition
    (*au samedi* is not used for dates), or a preposition (*en samedi*) that does not exist in French
    for naming a day.
