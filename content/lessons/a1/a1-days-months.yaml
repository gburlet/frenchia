sections:
- type: explanation
  id: explanation
  heading: Les jours et les mois
  body: |-
    **In this short unit you will learn the names of the seven days of the week, the twelve months, and the four seasons.** All the words are used with the present tense or with **aller + infinitif** to talk about future plans (e.g., *Je vais au cinéma samedi.*).

    **Je vais au cinéma samedi.**

    ### Days of the week

    The days are **lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche**.

    In French they are **not capitalised** (unless they start a sentence).

    **lundi** (no article) refers to the coming Monday: *Je travaille lundi.*

    **le lundi** (with the article) means “every Monday”: *Je travaille le lundi.*

    The article therefore changes the meaning: **lundi = this Monday, le lundi = every Monday**.

    When the day functions as an adverbial of time you omit the article: *Nous partons samedi.*

    ### Months

    Months are **janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre**.

    Like the days, they are written in lower-case.

    To say “in March” you use **en**: *Je pars en mars.*

    For “on March 5th” you say **le 5 mars** (note the order day-month, no comma).

    ### Seasons

    The four seasons are **le printemps, l’été, l’automne, l’hiver**.

    They are normally introduced with the following prepositions: **au printemps**, **en été**, **en automne**, **en hiver**.

    Example: *J’aime l’été parce qu’il fait chaud.*

    ### Common pitfalls

    1. **Capitalisation** – English capitalises days and months; French does not. Write *lundi*, not *Lundi*.

    2. **Prepositions** – Use **le** with a day when it functions as a noun (*le lundi* = every Monday), but drop it when the day works as an adverb (*lundi* = this/next Monday). For months, use **en** for “in” and **le** only with a full date (*le 12 avril*).

    ### Quick practice

    - **Je vais à la gym le mardi.** (I go to the gym on Tuesdays.)

    - **Nous partons en juillet.** (We leave in July.)

    - **L’automne est ma saison préférée.** (Autumn is my favourite season.)
