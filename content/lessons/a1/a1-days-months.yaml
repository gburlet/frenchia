  title: Une semaine au marché
  passage_fr: 'Chaque lundi, je vais au marché du centre-ville. J’achète des pommes et du pain frais.
    Le mardi, je retrouve mon ami Paul et nous mangeons des crêpes au café du coin. Le mercredi, c’est
    le jour du fromage : je goûte un nouveau camembert. Le jeudi, ma sœur vient me rendre visite et nous
    préparons une salade de tomates. Le vendredi, nous faisons une petite promenade au parc avant le souper.
    Le samedi, il fait souvent beau, alors nous allons à la plage. Le dimanche, je me repose et je lis
    un livre.'
  translation_en: 'Every Monday I go to the downtown market. I buy apples and fresh bread. On Tuesdays
    I meet my friend Paul and we eat crepes at the corner café. On Wednesdays it’s cheese day: I taste
    a new camembert. On Thursdays my sister comes to visit me and we make a tomato salad. On Fridays we
    take a short walk in the park before supper. On Saturdays it is often sunny, so we go to the beach.
    On Sundays I rest and read a book.'
