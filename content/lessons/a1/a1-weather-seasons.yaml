- id: ex-06
  grammar_topics: []
  type: multiple_choice
  question: Which sentence correctly describes the weather in winter?
  options:
  - Il fait chaud en hiver.
  - Il est froid en hiver.
  - Il fait froid en hiver.
  - Il y a froids en hiver.
  answer_index: 2
  explanation: 'To talk about temperature we use the construction **Il fait + adjective**. The adjective
    stays in the masculine singular because the subject *il* is neutral: **Il fait froid en hiver**. Option
    A uses the opposite adjective (chaud). Option B is incorrect because we do not use *être* to describe
    the general weather; we say *Il fait froid*, not *Il est froid*. Option D is wrong because *il y a*
    cannot be followed by a bare adjective; the structure *il y a froid* is impossible in French. The
    plural form *froids* is also incorrect, but the primary error is the misuse of *il y a* with an adjective
    alone.'
