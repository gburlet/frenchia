sections:
- type: explanation
  id: explanation
  heading: La météo et les saisons – Vocabulary
  body: |-
    **Lesson overview** – At the A1 level you only need a handful of simple words and the present tense (or *aller* + infinitive) to talk about the weather in each season. The structure is always the same: **subject + verb + weather adjective/noun**. Because the verb *faire* is used for most weather expressions, you will see it repeatedly.  

    **Key pattern**
    - **Il fait + adjective** (temperature, general condition) → *Il fait chaud.* (It is hot.)
    - **Il y a + du/de la/des + noun** (phenomena you cannot count) → *Il y a du vent.* (There is wind.)
    - **Il pleut / Il neige** – fixed verbs for rain and snow.
    - **Il fait + adjective + en/au + season** → *Il fait frais **en** automne.* (It is cool in autumn.) *Note:* use **au printemps**, **en été**, **en automne**, **en hiver**.  

    **Seasonal vocabulary** (use the same pattern for each):
    - **Printemps** – *Il fait doux*, *Il y a du soleil*, *Il pleut parfois.*
    - **Été** – *Il fait chaud*, *Il y a du soleil*, *Il y a de l’orage.*
    - **Automne** – *Il fait frais*, *Il y a du vent*, *Il pleut souvent.*
    - **Hiver** – *Il fait froid*, *Il y a de la neige*, *Il neige souvent.*

    **Pitfall 1 – Using *être* instead of *faire*.** English speakers often say *Il est chaud* to describe weather; in French the correct verb is *faire*: *Il fait chaud.*

    **Pitfall 2 – Forgetting the partitive article with *vent* and *neige*.** You must say *Il y a du vent* (not *Il y a vent*) and *Il y a de la neige* (not *Il y a neige*).

    **Practice tip** – Pair each season with three weather sentences, using the patterns above. This will cement the structure and give you a ready-to-use toolbox for everyday conversation about the weather.
