- type: reading
  id: reading
  title: Une promenade au parc
  passage_fr: Ce matin, je vais au parc avec mon ami. Il fait frais et il y a du brouillard autour des
    arbres. Le soleil apparaît bientôt, alors le ciel devient clair. Il y a quelques gouttes de pluie
    légère, mais la pluie est très courte. Vers midi, il fait plus chaud et il y a un léger vent qui fait
    danser les feuilles. En fin d’après-midi, le ciel devient nuageux et il y a une petite brise. Nous
    rentrons chez nous quand il commence à faire sombre.
  translation_en: This morning I go to the park with my friend. It is cool and there is fog around the
    trees. The sun appears soon, so the sky becomes clear. There are a few drops of light rain, but the
    rain is very short. Around noon it gets warmer and there is a gentle wind that makes the leaves dance.
    In the late afternoon the sky gets cloudy and there is a slight breeze. We go back home when it starts
    to get dark.
  glossary:
