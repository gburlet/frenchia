sections:
- type: explanation
  id: explanation
  heading: 'Les lettres muettes : Letters You Write but Do Not Say'
  body: |-
    In English, you pronounce almost every letter you see. In French, many letters at the end of a word are **silent**. The good news: there is a pattern.

    ### Final consonants

    Most final consonants are not pronounced: **grand**, **long**, **trop**, **gros**, **petit**, **deux**, **nez**. The letters **d, g, p, s, t, x, z** are the usual silent ones.

    But four letters are usually heard: **c, r, f, l**. Think of the word CaReFuL: **sac**, **bonjour**, **neuf**, **avril**. A few words break the pattern, such as **blanc** and **tabac** (silent c), or **gentil** and **outil** (silent l). Final **-er** is usually pronounced like « é » with a silent r: **parler**, **premier**.

    ### The final e

    A final **e** is silent too, but it changes the word before it. It lets the last consonant be heard: **petit** (silent t) becomes **petite** (t is heard), and **grand** becomes **grande** (d is heard). The letter **h** is always silent: **homme**, **hôtel**.

    For verbs, the **-ent** of ils/elles forms is silent: **ils parlent** sounds like **ils parle**.

    ### Liaison

    A silent final consonant can come back before a word that starts with a vowel or a silent h. This is called **liaison**, and it happens after determiners and pronouns: **les amis**, **vous avez**, **un enfant**, **deux heures**, **ils ont**. The s of **les** sounds like a z.

    ### Pitfalls

    - Do not pronounce every letter. **Petit** and **grand** end in a silent consonant, so say them without the t and the d.
    - Do not link everything. There is no liaison after a singular noun, after a plural noun subject, or after **et**: in **Les enfants arrivent**, the s of **enfants** stays silent.
