  examples:
  - fr: Le sac est petit.
    en: The bag is small.
    note: The c of sac is heard; the t of petit is silent.
    region: common
  - fr: Il est grand, elle est grande.
    en: He is tall, she is tall.
    note: Grand has a silent d; in grande the d is heard.
    region: common
  - fr: Les amis arrivent à midi.
    en: The friends arrive at noon.
    note: Liaison in les amis (the s sounds like z); the -ent of arrivent is silent.
    region: common
  - fr: Vous avez un chat?
    en: Do you have a cat?
    note: Liaison in vous avez (the s sounds like z); the n of un is not linked before chat.
    region: common
  - fr: Il a deux enfants.
    en: He has two children.
    note: Liaison in deux enfants (the x sounds like z).
    region: common
  - fr: Ils ont faim.
    en: They are hungry.
    note: Liaison in ils ont (the s sounds like z).
    region: common
  - fr: Bonjour, ça va?
    en: Hello, how are you?
    note: The r of bonjour is heard.
    region: common
  - fr: Ils parlent trop.
    en: They talk too much.
    note: The -ent of parlent is silent, and so is the p of trop.
    region: common
