title_en: Silent Letters
objectives:
- Predict silent final letters - most final consonants are silent (grand, trop, gros, petit, deux, nez),
  but final c, r, f, l are usually heard (sac, bonjour, neuf, avril), and a final e is silent (table)
- Recognize basic liaison after determiners and pronouns (les amis, vous avez, un enfant)
