sections:
- type: explanation
  id: explanation
  heading: Les lettres et leurs noms
  body: |-
    Welcome to the French alphabet! It has the same **26 letters** as English, but most of them have different *names*. You need these names every time you spell your name or your courriel aloud.

    ### Say the names, not the sounds

    When French speakers spell a word, they just say the letter names one after another, with no word in between. For **Roy**, you say **erre, o, i grec**. A double letter is said **deux m** or **m, m**. Accents are named too: **é** is **e accent aigu**.

    ### Letters worth practising

    - **E** sounds like the **e** of **le**. It is not « ay » and not « ee ».
    - **U** sounds like the **u** of **tu**, with rounded lips and your tongue forward. It is not « oo ».
    - **G** is **gé** and **J** is **ji**. They are easy to mix up, so practise them side by side.
    - **R** is **erre**, a throaty sound made at the back of the mouth. Do not roll it.
    - **W** is **double vé** (« double v ») and **Y** is **i grec** (« Greek i »).

    ### Pitfalls for English speakers

    1. **Using English names.** Saying « ay, bee, see » for **A, B, C** feels natural, but a French listener will not follow. Learn **a, bé, cé** from the start.
    2. **Mixing up E and I.** English speakers often say **E** like « ee », which is the French **i**. Keep **e** (as in **le**) and **i** (as in « see ») apart.

    Use the table below as your reference, then listen for these names whenever someone spells something for you.
