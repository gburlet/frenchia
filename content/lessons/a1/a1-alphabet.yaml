  title: Au bureau
  passage_fr: 'Je m''appelle Léa Roy. Mon nom de famille s''écrit R, O, Y. Le Y se dit « i grec ». Aujourd''hui,
    je suis au bureau et je parle avec Marc. Il demande : « Comment ça s''écrit, ton prénom? » Je réponds :
    « L, É, A. » Marc écrit mon prénom sur une feuille. Il dit : « Merci, Léa! » Ensuite, je demande son
    nom de famille. Il répond : « Dubé, D, U, B, É. » Le U est difficile pour moi, mais j''aime pratiquer.'
  translation_en: 'My name is Léa Roy. My last name is spelled R, O, Y. The Y is said "i grec". Today,
    I am at the office and I am talking with Marc. He asks: "How is your first name spelled?" I answer:
    "L, É, A." Marc writes my first name on a sheet of paper. He says: "Thank you, Léa!" Then I ask for
    his last name. He answers: "Dubé, D, U, B, É." The U is hard for me, but I like to practise.'
