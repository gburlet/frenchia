  examples:
  - fr: Je prépare le **déjeuner** **et** je mets la table.
    en: I’m preparing breakfast **and** I’m setting the table.
    region: common
  - fr: Il veut aller au cinéma **mais** il doit finir son rapport.
    en: He wants to go to the movies **but** he has to finish his report.
    region: common
  - fr: Nous pouvons prendre le bus **ou** marcher jusqu’à la gare.
    en: We can take the bus **or** walk to the station.
    region: common
  - fr: Je reste à la maison **parce qu'il** pleut dehors.
    en: I’m staying at home **because** it’s raining outside.
    region: common
  - fr: Tu finis tes devoirs? **Alors**, tu peux jouer.
    en: You finish your homework? **So**, you can play.
    region: common
  - fr: Je fais du yoga le matin, **puis** je lis le journal.
    en: I do yoga in the morning, **then** I read the newspaper.
    region: common
  - fr: Elle aime le chocolat **et** les biscuits maison.
    en: She likes chocolate **and** homemade cookies.
    region: common
  - fr: Il veut partir tôt, **mais** le train est en retard.
    en: He wants to leave early, **but** the train is delayed.
    region: common
  - fr: Tu veux du thé **ou** du café?
    en: Do you want tea **or** coffee?
    region: common
  - fr: Il ne vient pas **parce qu'il** est malade, **alors** il se repose.
    en: He isn’t coming **because** he’s sick, **so** he’s resting.
