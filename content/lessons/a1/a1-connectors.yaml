- type: reading
  id: reading
  title: Une matinée au marché
  passage_fr: Ce matin, je me lève tôt **et** je prends mon vélo. Je vais au marché **et** j’achète des
    fruits. J’aime les pommes **ou** les poires, **alors** je choisis les deux. Mon ami arrive, **mais**
    il oublie son porte-monnaie. Nous partageons les fruits **parce que** nous voulons rester amis. Après
    le marché, nous prenons un café **puis** nous rentrons chez nous.
  translation_en: This morning I get up early and take my bike. I go to the market and buy fruit. I like
    apples or pears, so I choose both. My friend arrives, but he forgets his wallet. We share the fruit
    because we want to stay friends. After the market we have a coffee then we go back home.
