sections:
- type: explanation
  id: explanation
  heading: Les connecteurs de base
  body: "### What are basic connectors?  \n\nThese tiny words join two ideas in the same sentence. At\
    \ the A1 level you only need six of them :\n\n- **et** – and\n\n- **mais** – but\n\n- **ou** – or\n\
    \n- **parce que** – because\n\n- **alors** – so / then\n\n- **puis** – then / next\n\nThese words\
    \ never change; you simply place them **between** two clauses or two nouns.\n\n### How to use them\n\
    \n1. **et** – joins elements that are true together.\n\n- *Je travaille **et** j’étudie.* (I work\
    \ **and** I study.)\n\n2. **mais** – introduces a contrast.\n\n- *Il fait froid, **mais** je sors.*\
    \ (It’s cold, **but** I go out.)\n\n3. **ou** – offers a choice.\n\n- *Tu veux du thé **ou** du café ?*\
    \ (Do you want tea **or** coffee?)\n\n4. **parce que** – gives a reason.\n\n- *Je reste à la maison\
    \ **parce qu’il** pleut.* (I stay home **because** it’s raining.)\n\n- **Note:** *parce que* elides\
    \ before *il, elle, on* (and before *ils, elles*).\n\n5. **alors** – shows a consequence or a chronological\
    \ link.\n\n- *Il a fini son travail, **alors** il part.* (He finished his work, **so** he leaves.)\n\
    \n6. **puis** – indicates the next step in a sequence.\n\n- *Nous mangeons, **puis** nous regardons\
    \ un film.* (We eat, **then** we watch a movie.)\n\n### Common pitfalls for English speakers\n\n-\
    \ **Confusing *ou* (or) with *où* (where).** The two words sound the same but have different meanings.\
    \ *ou* introduces a choice (*Tu veux du thé **ou** du café ?*), while *où* introduces a place (*Où\
    \ vas-tu ?*). Make sure you use the correct spelling.\n\n- **Missing the elision with *parce que*.**\
    \ Remember to write *parce qu’il*, *parce qu’elle*, *parce qu’on* etc. Practice by linking two simple\
    \ sentences you already know, using each connector once."
