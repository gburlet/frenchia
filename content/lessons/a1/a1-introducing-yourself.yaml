  type: multiple_choice
  question: You are a woman called Emily. Which sentence correctly introduces yourself according to the
    pattern you have learned?
  options:
  - Bonjour, je m’appelle Emily, j’ai vingt-cinq ans et je suis infirmière.
  - Bonjour, je m’appelle Emily, j’ai vingt-cinq ans et je être infirmière.
  - Bonjour, je m’appelle Emily, j’ai vingt-cinq ans et je suis infirmièree.
  - Bonjour, je m’appelle Emily, j’ai vingt-cinq ans et je suis infirmier.
  answer_index: 0
  explanation: The correct sentence uses the pattern *Je m’appelle …*, *j’ai … ans* and *je suis* + profession
    (infirmière). The second option uses the infinitive être instead of the conjugated form, the third
    adds an extra e that breaks agreement, and the fourth uses the masculine form *infirmier*, which does
    not match Emily’s gender (she is a woman).
