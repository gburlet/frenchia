sections:
- type: explanation
  id: explanation
  heading: Se présenter – Premiers contacts
  body: |-
    ***

    In this first-contact unit you will learn how to give the basic personal information that French speakers usually exchange when they meet someone for the first time: name, where you come from, age, and occupation. The structure is simple and relies only on the present tense and the construction **aller + infinitif** for future plans.

    **1. Stating your name** – The most common pattern is **« Je m’appelle … »** (literally *I call myself*). You can also use **« Je suis … »** followed by a name, but **« Je m’appelle »** is the safest choice for beginners.

    > **Je m’appelle Marie.**
    > **Je m’appelle John.**

    **2. Saying where you are from** – Use **« Je viens de … »** (I come from).

    * For masculine countries use **du** (de + le): **Je viens du Canada.**
    * For feminine countries use **de** (or **d’** before a vowel or mute *h*): **Je viens de France.**
    * For cities the article is omitted: **Je viens de Lyon.**

    **3. Giving your age** – The verb **avoir** is used: **« J’ai … ans »**. Remember that *ans* never takes an *e*; it is always masculine.

    > **J’ai vingt-cinq ans.**

    **4. Mentioning your job** – The pattern is **« Je suis … »** followed by the profession. In French the article is omitted unless the noun is modified.

    > **Je suis infirmière.** (female nurse)
    > **Je suis ingénieur.** (male engineer)

    **5. Asking the same questions** – Turn the statements into questions by inverting the subject and verb or by using the *est-ce que* formula. In spoken A1 French, the intonation-rise method is common and perfectly acceptable.

    > **Comment tu t’appelles ?** / **Comment vous appelez-vous ?**
    > **Tu viens d’où ?** / **Vous venez d’où ?**
    > **Tu as quel âge ?** / **Vous avez quel âge ?**
    > **Tu fais quoi dans la vie ?** / **Vous faites quoi dans la vie ?**

    **Pitfalls to avoid**

    - Do **not** say *« Je suis nommé … »*; it means “I am appointed” and is not used to give a name.
    - Remember to omit the article before a profession unless the noun is qualified (e.g., *Je suis médecin* not *Je suis le médecin*).
    - When asking about age, the shorter *« Tu as quel âge ? »* sounds more natural in casual conversation than the formal *« Quel âge avez-vous ? »*.

    Practice these six sentences in both directions; they are the building blocks for every future introduction you will make in French. ***
