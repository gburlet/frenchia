  title: Se présenter – Premiers contacts (lecture)
  passage_fr: 'Pendant une réunion de quartier, Sophie s’approche d’un nouveau voisin. « Bonjour, je m’appelle
    Sophie, j’ai trente-trois ans et je viens de Lyon. » Elle continue : « Je suis professeure de français
    à l’école secondaire et j’aime beaucoup la randonnée. » Le voisin répond : « Enchanté, je suis Karim,
    j’ai vingt-huit ans, je viens du Maroc et je travaille comme pâtissier. » « La fête du village est
    la semaine prochaine, » ajoute Karim.'
  translation_en: 'During a neighbourhood meeting, Sophie approaches a new neighbour. "Hello, my name
    is Sophie, I am thirty-three years old and I come from Lyon." She continues: "I am a French teacher
    at the secondary school and I really like hiking." The neighbour replies: "Nice to meet you, I am
    Karim, I am twenty-eight years old, I come from Morocco and I work as a pastry chef." "The village
    festival is next week," adds Karim.'
