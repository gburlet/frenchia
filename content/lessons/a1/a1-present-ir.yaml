sections:
- type: explanation
  id: explanation
  heading: Le présent des verbes en -ir (2ᵉ groupe)
  body: |-
    ### How to form the present of regular **-ir** verbs (2ᵉ groupe)  🖊️  The stem is obtained by removing the **-ir** ending of the infinitive (e.g., *fin-* from *finir*). Add the following endings to the stem:  - **-is** (je)  - **-is** (tu)  - **-it** (il/elle/on)  - **-issons** (nous)  - **-issez** (vous)  - **-issent** (ils/elles)  **Table of endings**  | Person | Ending | Example with *finir* | Result |
    | -------- | -------- | ---------------------- | -------- |
    | je | -is | fin- + -is | **je finis** |
    | tu | -is | fin- + -is | **tu finis** |
    | il/elle/on | -it | fin- + -it | **il finit** |
    | nous | -issons | fin- + -issons | **nous finissons** |
    | vous | -issez | fin- + -issez | **vous finissez** |
    | ils/elles | -issent | fin- + -issent | **elles finissent** |  ---  ### 2. When to use the present  📅  The present describes:  * actions happening **now** (e.g., *je finis mon café*),  * habitual actions (e.g., *nous finissons toujours à huit heures*),  * general truths (e.g., *les plantes finissent par pousser*),  * the near future with *aller* + infinitive (e.g., *je vais finir* – “I’m going to finish”).  ---  ### 3. Common pitfalls for English speakers  ⚠️  1. **Mixing -ir endings with -er endings.** The -er group uses *-e, -es, -e, -ons, -ez, -ent*; the -ir group uses *-is, -is, -it, -issons, -issez, -issent*.  2. **Missing the double-s in *nous* and *vous* forms.** The correct forms are *nous finissons* and *vous finissez*; *finons* or *finez* would be wrong because the **-ss-** belongs to the -ir endings, not to the infinitive stem.  3. **Forgetting the *-s* in the singular forms.** *je finis*, *tu finis*, *il finit* all keep the *-s* (or *-t* for *il/elle/on*).  ---  ### 4. Quick practice  📝  Take any regular -ir verb, drop **-ir**, and attach the six endings above.  Example with *choisir* (to choose):  *je choisis, tu choisis, il choisit, nous choisissons, vous choisissez, elles choisissent.*  Keep practising until the pattern feels as natural as the -er verbs you already know!
