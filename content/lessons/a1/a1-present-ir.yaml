- type: reading
  id: reading
  title: Une matinée au marché
  passage_fr: Chaque samedi, je me lève tôt et je vais au marché du quartier. J'achète des fruits frais,
    je choisis les meilleures pommes et je remplis mon sac avec des poires. Mon ami Marc arrive aussi;
    il finit toujours son café avant de parler avec les marchands. Nous réfléchissons à nos trouvailles
    et nous réussissons à préparer un goûter délicieux pour nos enfants. Après le marché, nous remplissons
    le panier de légumes et nous rentrons chez nous.
  translation_en: Every Saturday I get up early and go to the neighbourhood market. I buy fresh fruit,
    I choose the best apples and I fill my bag with pears. My friend Marc arrives too; he always finishes
    his coffee before talking with the sellers. We think about our finds and we manage to prepare a delicious
    snack for our children. After the market we fill the basket with vegetables and we go back home.
