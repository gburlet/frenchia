sections:
- type: explanation
  id: explanation
  heading: Les prépositions de lieu
  body: |-
    **What they do**  

    Prepositions of place tell *where* something is in relation to something else. In French they are used exactly as in English: the noun that follows the preposition is the reference point, and the noun before the preposition is the object whose position you describe.

    **The basic set**  

    Quick reference for the seven most common prepositions of place.

    | Preposition | Typical English equivalent | Example (French) |
    | --- | --- | --- |
    | **sur** | on / onto | **Le livre est **sur** la table.** |
    | **sous** | under / beneath | **Le chat est **sous** la chaise.** |
    | **dans** | in / inside | **Les clés sont **dans** le tiroir.** |
    | **devant** | in front of | **Le bus s’arrête **devant** l’école.** |
    | **derrière** | behind | **Le jardin est **derrière** la maison.** |
    | **à côté de** | next to / beside | **La lampe est **à côté du** canapé.** |
    | **entre** | between | **Le tableau est **entre** la porte et la fenêtre.** |

    **How to use them**  

    1. Choose the noun that will act as the *reference point* (the place you are talking about).

    2. Put the preposition **after** the object you are locating.

    3. Add the article and any necessary agreement: **le / la / les** (or a possessive, e.g., *ma*, *mes*).

    4. **Contractions with *à côté de*** – when the reference noun is preceded by a definite article, the article contracts just as with other prepositions:
       - *à côté de **le** → **à côté du*** (e.g., *à côté du four*)
       - *à côté de **les** → **à côté des*** (e.g., *à côté des fenêtres*)
       - *à côté de **la** → **à côté de la*** (no contraction)
       - *à côté de **l'** → **à côté de l'*** (no contraction)

    5. *entre* is a single word, not a fixed phrase. It is used directly before the two reference nouns (or before a noun phrase introduced by *et*).

    **Common pitfalls**  

    - **Sur vs. dans** – *sur* is used for surfaces, *dans* for enclosed spaces. English speakers sometimes say *“dans la table”* when they mean *“on the table”*; the correct French is **sur la table**.

    - **Behind vs. in front of** – *derrière* and *devant* are not interchangeable. Remember the order: *devant* = in front of (the thing you face), *derrière* = behind (the thing you cannot see directly).

    **Practice tip**  

    After you learn a new noun, immediately pair it with at least two different prepositions. For example, with *la porte* you can say *“Le chat est **devant la porte**”* and *“Le chat est **derrière la porte**”* to cement the contrast.
