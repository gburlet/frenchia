  rows:
  - - sur
    - on / onto
    - on a surface
    - Le stylo est **sur** la table.
    - The pen is on the table.
  - - sous
    - under / beneath
    - below a surface
    - Le chat est **sous** le canapé.
    - The cat is under the sofa.
  - - dans
    - in / inside
    - inside a bounded space
    - Il y a du pain **dans** le placard.
    - There is bread in the cupboard.
  - - devant
    - in front of
    - facing the front side
    - La voiture est **devant** la maison.
    - The car is in front of the house.
  - - derrière
    - behind
    - at the back side
    - Le jardin est **derrière** la maison.
    - The garden is behind the house.
  - - à côté de
    - next to / beside
    - adjacent, side-by-side
    - Le frigo est **à côté du** four.
    - The fridge is next to the oven.
  - - entre
    - between
    - in the middle of two things
    - Le tableau est **entre** la fenêtre et la porte.
    - The picture is between the window and the door.
