- type: reading
  id: reading
  title: Les prépositions de lieu – Lecture
  passage_fr: Ce matin, Marie se rend à la bibliothèque. Elle laisse son sac **sur** le banc près de l’entrée.
    Le chat du voisin dort **sous** le lampadaire du parc. Dans la salle de lecture, les tables sont **entre**
    les étagères de livres et les fenêtres. Un étudiant attend **devant** le comptoir pour emprunter un
    roman. La fontaine se trouve **à côté de** la porte principale, et les pigeons picorent **sur** le
    rebord. Enfin, Marie range son livre **dans** son sac avant de partir.
  translation_en: This morning, Marie goes to the library. She leaves her bag **on** the bench near the
    entrance. The neighbour’s cat sleeps **under** the park’s street-lamp. Inside the reading room, the
    tables are **between** the bookshelves and the windows. A student waits **in front of** the counter
    to borrow a novel. The fountain is **next to** the main door, and the pigeons peck **on** the ledge.
    Finally, Marie puts her book **in** her bag before leaving.
