sections:
- type: explanation
  id: explanation
  heading: Dire la date
  body: |-
    In French, stating a calendar date follows a fixed order that is the opposite of English: **day + month + year**. The day is written as a cardinal number (1-31) without an article, the month is always in **lower-case**, and the year follows the month directly (no preposition *de*).

    - **Le 24 juin** – *June 24* (no article before the month)

    - **Le 3 mars 2024** – *March 3, 2024* (year after the month, no *de*)

    - **Le 1er janvier 2022** – *January 1st, 2022* (the first day uses the ordinal *premier* written *1er*)

    When you talk about a birthday, you use the same structure, preceded by **« Je suis né(e) le… »** (for a male/female speaker) or **« C’est mon anniversaire le… »**.

    Example:

    - **Je suis né le 15 juillet.** – *I was born on July 15.*

    - **C’est mon anniversaire le 2 février.** – *My birthday is on February 2.*

    ### Common pitfalls

    1. **Adding an article before the month** – English speakers sometimes say *« le 24 du juin »*; in French the month never takes an article. Say **« le 24 juin »**, not *« du juin »*.

    2. **Using ordinal numbers for days other than the first** – Only the first day of the month uses the ordinal *premier* (written *1er*). All other days use cardinals: *le 2 mai, le 3 mai, le 24 juin*, etc.

    3. **Capitalising the month** – Month names are never capitalised in French. Write *mai*, *juin*, *décembre*, not *Mai*, *Juin*, *Décembre*.

    4. **Using « le » with a month alone** – To say “in May” you use **« en mai »**, not *le mai*.

    ### Quick checklist

    - Day (cardinal, except *1er*) → month (lower-case) → year (optional, placed after the month).

    - No article before the month.

    - Use **« le »** before the whole date (except when you say only the month, e.g., *en mai*).

    - For birthdays, add *né(e) le* or *c’est mon anniversaire le*.

    Practice by writing today’s date and your birthday in French, then read them aloud to get comfortable with the rhythm of the language.
