- type: regional_note
  id: regional-note
  heading: 'Québec vs. France : poser des questions oui-non'
  body: In everyday conversation both speakers can use the three classic patterns – intonation, *est-ce
    que* and inversion – to ask a yes-no question. In Québec French a familiar particle **-tu** is often
    added after the verb (e.g., *Tu viens-tu ?*). This particle is informal and is not used in standard
    French. It does not change the meaning of the question; it only gives a colloquial tone. In France
    the same informal level is expressed by raising intonation or by using *est-ce que*; inversion is
    mainly reserved for written or very polite contexts.
