  type: multiple_choice
  question: Which of the following sentences correctly asks a yes-no question with the *est-ce que* formula?
  options:
  - Tu vas-tu au parc?
  - Est-ce que tu vas au parc?
  - Vas-tu tu au parc?
  - Tu vas au parc-tu?
  answer_index: 1
  explanation: 'The *est-ce que* construction places the fixed phrase **est-ce que** before a normal declarative
    sentence. Option B follows this pattern exactly: **Est-ce que tu vas au parc ?**. Option A is a valid
    informal Québec question using the -tu particle, but it does not use *est-ce que*; option D puts -tu
    in an impossible position; option C adds an extra pronoun to an inversion, which is ungrammatical.
    The correct answer is therefore B, which uses the *est-ce que* formula without the -tu particle.'
