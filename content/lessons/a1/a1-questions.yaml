sections:
- type: explanation
  id: explanation
  heading: Poser des questions
  body: "**How to ask a simple yes-or-no question in French**  \n\nAt the A1 level you only need three\
    \ patterns, all in the present tense (or *aller* + infinitive). They differ in formality and in spoken\
    \ Québec French.\n\n1. **Intonation only** – the most informal way. Keep the statement order and raise\
    \ your voice at the end.\n   *Example:* **Tu viens** ? → *Are you coming?*\n\n2. **Est-ce que** –\
    \ neutral, works in any register.\n   *Example:* **Est-ce que tu viens** ? → *Are you coming?*\n \
    \  *Tip:* Remember the hyphens and the space after *est-ce que*; it is a fixed phrase, not a verb.\n\
    \n3. **Inversion** – the most formal (used in writing, news, or polite speech). Recognise it by the\
    \ hyphen that joins the verb and the subject pronoun.\n   *Example:* **Viens-tu** ? → *Are you coming?*\n\
    \   *Note:* Inversion is rarely required for A1 production; learners should be able to recognise it.\n\
    \n### Québec informal particle **-tu**\nIn everyday Québec speech a short particle *-tu* is added\
    \ after the verb, but only in a statement-order question.\n   *Correct form:* **Tu viens-tu** ? →\
    \ *Are you coming?*\n   *Incorrect (invented) forms:* *Est-ce que tu viens-tu*, *Manges-tu-tu*, etc.\
    \ – these do not exist.\n   The particle is completely informal; avoid it in formal contexts or with\
    \ people you do not know well.\n\n### Quick checklist\n- Use **intonation** for casual conversation.\n\
    - Use **est-ce que** when you are unsure about formality.\n- Recognise **inversion** in written or\
    \ very polite speech.\n- In Québec, you may hear **-tu** after the verb; treat it as a colloquial\
    \ tag.\n\nPractice each pattern with the same verb (e.g., *manger*, *aller*, *avoir*) to get comfortable\
    \ with the rhythm and the hyphen placement."
