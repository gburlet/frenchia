- type: reading
  id: reading
  title: Une matinée au marché
  passage_fr: 'Ce matin, Marie et Paul se retrouvent au marché du quartier. Marie regarde les pommes :
    « Tu veux-tu une pomme? » Paul répond : « Oui, j’en prends deux. » Ensuite, ils voient le stand de
    pain. « Est-ce que tu prends du pain? » demande Marie. Paul hoche la tête. « Tu as déjà mangé? » demande
    le vendeur. « Non, pas encore, » répond Paul. Enfin, ils décident d’aller au café. « Tu vas-tu prendre
    un café? » propose Marie.'
  translation_en: 'This morning, Marie and Paul meet at the neighbourhood market. Marie looks at the apples:
    “Do you want an apple?” Paul answers: “Yes, I’ll take two.” Then they see the bakery stall. “Are you
    getting some bread?” asks Marie. Paul nods. “Have you already eaten?” asks the seller. “No, not yet,”
    replies Paul. Finally, they decide to go to the café. “Are you going to have a coffee?” suggests Marie.'
  glossary:
