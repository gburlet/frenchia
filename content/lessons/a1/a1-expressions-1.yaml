sections:
- type: explanation
  id: explanation
  heading: Les expressions de tous les jours
  body: |-
    In Québec, people use many short expressions in everyday conversation. You will hear them with friends, family and neighbours, at work and on the street. Most of them are **familiar**: perfect for a relaxed chat, but not for a formal letter or a job interview. In this lesson you learn ten of them, and each one has a different equivalent in France.

    - **C'est plate** means "it's boring" or "too bad" (France: *c'est ennuyeux*, *dommage*).
    - **Pas pantoute** means "not at all" (France: *pas du tout*).
    - **Être tanné(e) de** means "to be fed up with" (France: *en avoir marre*).
    - **Avoir de la misère à** + verb means "to have trouble doing" (France: *avoir du mal à*).
    - **Pas pire** means "pretty good" (France: *pas mal*).
    - **C'est correct** means "it's okay" or "no problem" (France: *c'est bon*, *d'accord*). This one is standard in Québec.
    - **Ça me tente** means "I feel like it" (France: *j'ai envie*).
    - **À tantôt** means "see you later today" (France: *à tout à l'heure*).
    - **Jaser** means "to chat" (France: *bavarder*, *discuter*).
    - **Quétaine** means "tacky" or "corny" (France: *ringard*, *kitsch*).

    ### Pitfalls

    1. **Pantoute comes after the negated word.** Say « Je n'aime pas ça pantoute » or, in speech, « J'aime pas ça pantoute ». On its own, « Pas pantoute! » is a full answer.
    2. **Tanné changes with the speaker.** A man says « Je suis tanné », a woman says « Je suis tannée ». The two sound the same, but the spelling changes.
    3. **Misère here is not "misery."** *Avoir de la misère à* only means "to have trouble," and it is followed by a verb in the infinitive.
