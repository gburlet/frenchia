- type: reading
  id: reading
  title: Un café entre amis
  passage_fr: |-
    Marie : Salut, Luc! Comment ça va?
    Luc : Pas pire. Et toi?
    Marie : Je suis tannée de l'hiver. J'ai de la misère à dormir.
    Luc : C'est plate. Ça te tente d'aller prendre un café?
    Marie : Oui! Je veux jaser un peu.
    Luc : C'est correct. À quelle heure?
    Marie : À trois heures. Tu as faim?
    Luc : Pas pantoute. Mais j'aime le café.
    Marie : Parfait. À tantôt!
  translation_en: |-
    Marie: Hi, Luc! How are you?
    Luc: Pretty good. And you?
    Marie: I'm fed up with winter. I have trouble sleeping.
    Luc: That's too bad. Do you feel like going for a coffee?
    Marie: Yes! I want to chat a little.
    Luc: Okay. At what time?
    Marie: At three o'clock. Are you hungry?
    Luc: Not at all. But I like coffee.
    Marie: Perfect. See you later today!
