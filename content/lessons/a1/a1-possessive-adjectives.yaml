  type: multiple_choice
  question: Which possessive adjective correctly completes the sentence? *Marie cherche ___ stylo que
    son frère lui a donné hier.*
  options:
  - son
  - sa
  - ses
  - mes
  answer_index: 0
  explanation: The noun *stylo* is masculine singular, so the possessive adjective must be the masculine
    singular form that agrees with the noun. Because the owner is Marie (a feminine subject), we use *son*
    (the masculine singular form used before a masculine noun, regardless of the owner’s gender). *Sa*
    would be used with a feminine noun, *ses* with a plural noun, and *mes* is the plural form for “my”,
    which does not fit the singular *stylo* here.
