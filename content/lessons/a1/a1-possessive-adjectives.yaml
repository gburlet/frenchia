sections:
- type: explanation
  id: explanation
  heading: Les adjectifs possessifs
  body: |-
    ### Les adjectifs possessifs

    —

    who owns what?

    In French the possessive adjective agrees **in gender and number with the noun it modifies**, not with the owner. The pattern is:

    | Owner | Masculine singular | Feminine singular | Plural (both genders) |
    | ------- | -------------------- | ------------------- | ----------------------- |
    | **je / moi** | **mon** | **ma** | **mes** |
    | **tu / toi** | **ton** | **ta** | **tes** |
    | **il / elle / on** | **son** | **sa** | **ses** |
    | **nous** | **notre** | **notre** | **nos** |
    | **vous** | **votre** | **votre** | **vos** |
    | **ils / elles** | **leur** | **leur** | **leurs** |

    **Key points**

    1. **Gender follows the noun** – *ma voiture* (feminine) but *mon ami* (masculine). When a feminine noun begins with a vowel or a silent *h*, French uses *mon* to avoid the awkward *ma amie* → **mon amie**.

    2. **The plural form is the same for masculine and feminine nouns** – *mes* livres, *tes* idées, *ses* enfants, *nos* valises, *vos* projets, *leurs* réponses.

    **Short examples**

    - **Mon** livre est sur la table. – *My book is on the table.*

    - **Ta** sœur travaille à l’hôpital. – *Your sister works at the hospital.*

    - **Ses** chats sont très joueurs. – *His/her cats are very playful.*

    - **Notre** maison est grande. – *Our house is big.*

    - **Vos** vacances commencent demain. – *Your (plural) holidays start tomorrow.*

    - **Leurs** parents habitent à Paris. – *Their parents live in Paris.*

    **Common pitfalls**

    - **Confusing the owner’s gender with the thing’s gender**: *son*/*sa* agree with the owned noun, not with the owner. *Sa voiture* can mean “his car” or “her car”.

    - **Using *ma*, *ta*, *sa* before a vowel**: they become *mon*, *ton*, *son* (e.g., *mon amie*, *ton école*, *son amie*).

    - **Using *mes* for a single item**: *mes* is only for plural nouns. For one object, even if it belongs to “my”, you need *mon/ma* (e.g., *ma clé*, not *mes clé*).
