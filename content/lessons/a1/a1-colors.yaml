- type: reading
  id: reading
  title: Les couleurs dans le parc
  passage_fr: Ce soir, je me promène dans le parc. Le soleil éclaire un grand **lac bleu** où les canards
    nagent. Autour du lac, les arbres ont des feuilles **vertes** et des troncs **marron**. Sur le chemin,
    il y a des bancs **gris** et une petite fontaine **blanche**. Les enfants jouent avec un ballon **rouge**
    et une balle **jaune**. Un couple assis sur un banc porte des chapeaux **orange** et **violets**.
    Le ciel devient **rose** au coucher du soleil, et les lampadaires s’allument, diffusant une lumière
    **douce**.
  translation_en: This evening, I am walking in the park. The sun lights up a large **blue lake** where
    the ducks swim. Around the lake, the trees have **green** leaves and **brown** trunks. On the path
    there are **gray** benches and a small **white** fountain. The children play with a **red** ball and
    a **yellow** ball. A couple sitting on a bench wear **orange** and **violet** hats. The sky turns
    **pink** at sunset, and the street-lights turn on, emitting a **soft** light.
