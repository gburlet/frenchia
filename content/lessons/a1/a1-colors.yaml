sections:
- type: explanation
  id: explanation
  heading: Les couleurs
  body: '### How French adjectives of colour work    All colour words are adjectives and must agree with
    the noun they modify in gender and number.    The basic pattern is :    *Masculine singular* – no
    ending (rouge, bleu, blanc, violet)    *Feminine singular* – add **-e** (rouge → rouge, bleu → bleue,
    blanc → blanche, violet → violette).    *Masculine plural* – add **-s** (rouges, bleus, blancs, violets).
       *Feminine plural* – add **-es** (rouges, bleues, blanches, violettes).    **Invariable colours** :
    orange, marron (e.g., *des souliers orange*, *des chandails marron*).    **Compound colours** (e.g.,
    *gris clair*, *bleu foncé*) stay invariable, even in the plural (e.g., *des rideaux gris clair*).
       The adjective normally follows the noun; at this level we keep it after the noun.    #### Simple
    present-tense sentences    - **Le ciel est bleu.** – The sky is blue. *(masc. sing.)*    - **La mer
    est bleue.** – The sea is blue. *(fem. sing.)*    - **Les pommes sont rouges.** – The apples are red.
    *(fem. pl.)*    - **Les chapeaux sont verts.** – The hats are green. *(masc. pl.)*    You can also
    use **aller + infinitif** to talk about a future colour choice:    - **Je vais acheter une robe rouge.**
    – I’m going to buy a red dress.    #### Common pitfalls for English speakers    1. **Forgetting the
    extra *e* on feminine forms.** English colour adjectives never change, so learners often write *la
    chemise bleu*. Remember *la chemise bleue*.    2. **Forgetting the *-s* on a plural adjective.** Learners
    sometimes write *les chapeaux bleu* instead of *les chapeaux bleus*.    Practice by pairing a colour
    with a noun you see around you, and always check the noun’s gender first!'
