sections:
- type: explanation
  id: explanation
  heading: Le présent des verbes irréguliers
  body: |-
    **How to form the present of the most common irregular verbs**

    ***

    In French the present tense is built by adding endings to a **stem**. For the verbs listed below the stem does **not** follow the regular -er, -ir or -re patterns, so you must memorize the whole conjugation.

    | Verb | Je | Tu | Il/Elle | Nous | Vous | Ils/Elles |
    | ------ | ---- | ---- | ---------- | ------ | ------ | ----------- |
    | **être** | **suis** | **es** | **est** | **sommes** | **êtes** | **sont** |
    | **avoir** | **ai** | **as** | **a** | **avons** | **avez** | **ont** |
    | **aller** | **vais** | **vas** | **va** | **allons** | **allez** | **vont** |
    | **faire** | **fais** | **fais** | **fait** | **faisons** | **faites** | **font** |
    | **prendre** | **prends** | **prends** | **prend** | **prenons** | **prenez** | **prennent** |
    | **pouvoir** | **peux** | **peux** | **peut** | **pouvons** | **pouvez** | **peuvent** |
    | **vouloir** | **veux** | **veux** | **veut** | **voulons** | **voulez** | **veulent** |
    | **venir** | **viens** | **viens** | **vient** | **venons** | **venez** | **viennent** |

    #### Using the verbs

    - **être** and **avoir** are the backbone of many expressions: **Je suis étudiant**, **Tu as un livre**.

    - **aller + infinitive** expresses a near-future action: **Nous allons manger** (We are going to eat).

    - **faire** can mean *to do* or *to make*: **Il fait du sport**.

    - **prendre** is often used for transport or meals: **Je prends le bus**, **Elle prend le dîner à midi**.

    - **pouvoir** and **vouloir** are modal verbs: **Je peux parler**, **Vous voulez partir**.

    - **venir** + *de* + infinitive means “to have just done”: **Je viens de manger**.

    #### Common pitfalls for English speakers

    1. **Subject-verb agreement** – unlike English, the verb changes for *tu* and *vous* as well as for *il/elle*. Remember that **tu vas**, not *tu allez*.

    2. **Pronunciation of the final -s and -t** – in most present-tense forms these letters are silent: **je suis** /sɥi/, **il vient** /vjɛ̃/.

    Practice each verb in at least three different sentences; the patterns will soon stick.***
