- type: reading
  id: reading
  title: Une matinée au marché
  passage_fr: Ce matin, je **vais** au marché avec ma sœur. Nous **prenons** un panier et **achetons**
    des pommes, du pain et du fromage. Ma sœur **veut** **goûter** le fromage de chèvre, mais le vendeur
    **dit** qu’il est très fort. Nous **avons** assez d’argent, alors nous **payons** rapidement. Après,
    je **suis** content parce qu'**il fait chaud** et nous **allons** prendre un café sur la terrasse.
    Enfin, nous **revenons** à la maison avec **nos achats**.
  translation_en: This morning, I am going to the market with my sister. We take a basket and buy apples,
    bread and cheese. My sister wants to taste the goat cheese, but the seller says it is very strong.
    We have enough money, so we pay quickly. Afterwards, I am happy because it is warm and we go have
    a coffee on the terrace. Finally, we come back home with our purchases.
  glossary:
  - fr: panier
    en: basket
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: un panier en osier
    example_en: a wicker basket
  - fr: goûter
    en: to taste, to try
    pos: verb
    region: common
    formality: standard
    example_fr: Je goûte le fromage.
    example_en: I taste the cheese.
  - fr: fort
    en: strong (flavour)
    pos: adjective
    gender: m
    region: common
    formality: standard
    example_fr: un fromage très fort
    example_en: a very strong cheese
  - fr: terrasse
    en: terrace
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: une terrasse ensoleillée
    example_en: a sunny terrace
  - fr: revenir
    en: to come back, to return
    pos: verb
    region: common
    formality: standard
    example_fr: Nous revenons demain.
    example_en: We are coming back tomorrow.
