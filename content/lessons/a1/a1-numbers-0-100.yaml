sections:
- type: explanation
  id: explanation
  heading: Les nombres de 0 à 100 – Vocabulaire
  body: |-
    In French the basic cardinal numbers from **0** to **100** are learned as a single block. You will use them in three everyday situations: counting objects, saying a telephone number, and stating a price. The pattern is very regular, but a few details often trip English speakers.

    ## 1. The basic list

    - **0 – zéro**

    - **1-16 – un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, onze, douze, treize, quatorze, quinze, seize**

    - **17-19 – dix-sept, dix-huit, dix-neuf**

    - **20 – vingt**

    - **21-29 – vingt-et-un, vingt-deux, …, vingt-neuf** (note the *et* only before *un*)

    - **30, 40, 50, 60 – trente, quarante, cinquante, soixante**

    - **70-79 – soixante-dix, soixante-et-onze, …, soixante-dix-neuf** (the “sixty-ten” construction)

    - **80-89 – quatre-vingts, quatre-vingt-un, …, quatre-vingt-neuf** (no *et* before *un*)

    - **90-99 – quatre-vingt-dix, quatre-vingt-onze, …, quatre-vingt-dix-neuf**

    - **100 – cent**

    ## 2. Phone numbers and prices

    - Phone numbers in Québec are written in a 3-3-4 pattern, e.g. **514 555-0123**. They are usually read digit by digit: *cinq, un, quatre, cinq, cinq, cinq, zéro, un, deux, trois*.

    - Prices use dollars and cents, with the symbol after the number: **23 $** → *vingt-trois dollars*; **23,50 $** → *vingt-trois dollars et cinquante cents*.

    ## 3. Common pitfalls

    - **Missing the *et* before *un*** (21, 31, 41, 51, 61, 71). Say *vingt-et-un*, not *vingt-un*.

    - **Confusing 80 and 81**. *Quatre-vingts* (with an *s*) is exactly 80; when you add another unit the *s* disappears: *quatre-vingt-un*.

    Practice by counting objects in the room, reading a phone number aloud, and stating the price of a coffee. You’ll soon feel comfortable with every number up to one hundred!
