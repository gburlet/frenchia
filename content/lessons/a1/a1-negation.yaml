- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using ne…pas'
  body: 'In everyday spoken Québec French the particle *ne* is often omitted, especially in informal conversation:
    « J’sais pas » instead of « Je ne sais pas ». In written Québec French – school work, **courriels**,
    official documents – the full form *ne … pas* is expected, just as in France. The rest of the construction
    (placement of *pas*, the change from *un/une/des* to *de* after negation) is identical on both sides
    of the border. Learners should therefore always keep *ne* when they write, even if they will hear
    it dropped on the street.'
  variants: []
- type: reading
  id: reading
  title: La négation dans la vie quotidienne
  passage_fr: Mariam travaille dans une petite librairie du centre-ville. Chaque matin, elle ne vend pas
    de journaux, mais elle vend des romans et des bandes dessinées. Elle ne boit pas de thé au travail,
    elle préfère boire du café. Le lundi, elle n’organise pas de réunion, car le patron est absent. Le
    mardi, elle ne répond pas aux appels téléphoniques pendant la pause. Le mercredi, elle ne lit pas
    de magazines, elle prépare les commandes pour les clients. Le jeudi, elle n’écrit pas de courriels,
    elle classe les factures. Le vendredi, elle ne travaille pas tard, elle rentre à la maison à cinq
    heures.
  translation_en: Mariam works in a small bookstore downtown. Every morning, she does not sell newspapers,
    but she sells novels and comic books. She does not drink tea at work, she prefers to drink coffee.
    On Monday she does not organise a meeting, because the boss is absent. On Tuesday she does not answer
    phone calls during the break. On Wednesday she does not read magazines, she prepares the orders for
    the customers. On Thursday she does not write e-mails, she files the invoices. On Friday she does
    not work late, she goes home at five o’clock.
