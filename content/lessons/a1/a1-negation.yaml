sections:
- type: explanation
  id: explanation
  heading: 'La négation : ne…pas'
  body: |-
    In French the basic way to turn a positive sentence into a negative one is to surround the verb with **ne … pas**.  The particle **ne** is placed **before** the conjugated verb, **pas** after it.

    ```text
    Je **mange** du pain. → Je **ne mange pas** de pain.
    Il **vient** à la réunion. → Il **ne vient pas** à la réunion.
    Nous **allons** au cinéma. → Nous **n’allons pas** au cinéma.
    ```

    ### 1. The *de* after a negative
    When the positive sentence uses **un/une/des** (or **du, de la, de l’**) to express an indefinite quantity, the negative replaces it with **de** (or **d’** before a vowel).  This is a frequent source of errors for English speakers, who often keep the article.

    ```text
    J’ai **du** sucre. → Je **n’ai pas de** sucre.
    Elle a **des** amis. → Elle **n’a pas d’**amis.
    ```

    ### 2. Dropping *ne* in spoken Québec French
    In everyday Québec speech the **ne** is frequently omitted (e.g., *J’sais pas*).  For written French, especially at A1, you must keep **ne**: **Je ne sais pas**.

    ### 3. Common pitfalls
    - **Leaving the article**: *Je ne mange pas **du** pain* → wrong.  It must be **de**.
    - **Placing *pas* before the verb**: *Je pas mange* → wrong.  Remember the order **ne + verb + pas**.

    ### Quick checklist
    1. **ne** before the verb.
    2. **pas** after the verb.
    3. Replace **un/une/des/du/de la/de l’** with **de** (or **d’**).
    4. Keep **ne** in writing, even if you hear it dropped in Québec.

    Practice by turning the following affirmative sentences into negatives:
    - *Tu as un livre.* → **Tu n’as pas de livre.**
    - *Nous mangeons des fruits.* → **Nous ne mangeons pas de fruits.**
