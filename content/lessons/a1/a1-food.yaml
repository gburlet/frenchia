- type: explanation
  id: explanation
  heading: Les fruits et les légumes – Vocabulaire
  body: |-
    ### What you will learn

    In this short unit you will be able to name common fruits and vegetables and use the correct article when you talk about them or when you buy them in a shop. You will learn the three kinds of articles that appear at the A1 level: definite, indefinite and partitive. All sentences are in the present tense (or *aller* + infinitive).

    ### Definite vs. indefinite articles

    | Article | Masculine singular | Feminine singular | Plural (both genders) |
    | -------- | ------------------- | ------------------- | ----------------------- |
    | Definite | le | la | les |
    | Indefinite | un | une | des |

    Definite articles refer to a specific item that both speakers know.

    - *Je veux la pomme.* – “I want the apple.” (the apple you see on the counter)

    - *J’ai acheté les carottes.* – “I bought the carrots.” (the carrots we talked about earlier)

    Indefinite articles introduce something new or non-specific.

    - *Je veux une pomme.* – “I want an apple.” (any apple)

    - *Je prends des tomates.* – “I’m taking some tomatoes.” (a few, not a particular batch)

    ### The partitive article (du / de la / de l' / des)

    When you talk about an unspecified quantity of a food that is not counted, French uses the partitive. It is the same word as the indefinite *des* for plural, but it changes in the singular masculine and feminine forms.

    | Partitive | Masculine singular | Feminine singular | Plural (both genders) |
    | ---------- | ------------------- | ------------------- | ----------------------- |
    | Partitive | du (de + le) | de la | des (de + les) |
    | Before a vowel or mute h | de l' | – | – |

    How to use it

    - *Je mange du brocoli.* – “I eat some broccoli.”

    - *Je prends de la salade.* – “I take some salad.”

    - *Il veut de l'ail.* – “He wants some garlic.”

    - *Nous achetons des carottes.* – “We buy some carrots.”

    Contrast with the definite article

    - *Je mange le brocoli.* – “I eat the broccoli (the one we talked about).”

    - *Je prends la salade.* – “I take the salad (the specific one).”

    ### Using the articles in a shop

    - *Je vais au marché pour acheter des fruits.* – “I’m going to the market to buy some fruit.”

    - *Je prends le pain et une banane.* – “I take the bread and a banana.”

    - *Tu veux des légumes aujourd’hui?* – “Do you want some vegetables today?”

    ### Common pitfalls for English speakers

    1. Gender confusion – English does not assign gender to nouns, so it’s easy to forget whether a fruit is masculine (le citron) or feminine (la fraise). Memorise the article together with the noun (e.g., *la fraise* = “la-fraise”).

    2. Forgetting the article with a countable item – Learners often say *Je mange pomme* or *Je veux orange* instead of *Je mange **une** pomme* / *Je veux **une** orange*. Remember that singular, countable foods need the indefinite article *un* or *une*.

    3. Mixing up partitive and indefinite – *du pain* (some bread) is not the same as *une baguette* (a baguette). The partitive talks about an indeterminate amount; the indefinite talks about a countable item.

    ### Practice exercise (fill-in the blanks)

    Complete the sentences with the correct article (le, la, les, un, une, des, du, de la, de l', des).

    1. ___ (du / de la / des) brocoli, s’il vous plaît.

    2. Je veux ___ (un / une / du) orange.

    3. Elle achète ___ (le / la / les) carottes pour la soupe.

    4. Nous prenons ___ (de la / du / des) salade avec le sandwich.

    5. Vous avez ___ (le / la / les) tomates? – Oui, j’ai ___ (des / du / de la) tomates.

    *Answers:* 1. **du** 2. **une** 3. **les** 4. **de la** 5. **les … des**

    Practice by naming the items you see in your fridge and adding the correct article. Soon the choice will feel natural!
