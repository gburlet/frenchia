- type: reading
  id: reading
  title: Au marché du dimanche
  passage_fr: Le dimanche matin, Marie et son frère vont au marché. Ils achètent des fraises, une banane
    et un citron pour le dîner. Marie veut une tomate rouge et une courgette verte pour préparer une salade.
    Son frère prend une pomme verte et des carottes pour la soupe du midi. Ils voient le brocoli et le
    poivron rouge, mais ils n’achètent pas ces légumes aujourd’hui. Après le marché, ils rentrent à la
    maison et rangent les fruits dans le frigo.
  translation_en: On Sunday morning, Marie and her brother go to the market. They buy some strawberries,
    a banana and a lemon for lunch. Marie wants a red tomato and a green zucchini to make a salad. Her
    brother takes a green apple and some carrots for the lunchtime soup. They see the broccoli and the
    red pepper, but they don’t buy those vegetables today. After the market, they go back home and put
    the fruit in the fridge.
