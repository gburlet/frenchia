- type: examples
  id: examples
  heading: Les articles définis et indéfinis – exemples
  examples:
  - fr: Je lis **le** journal chaque matin.
    en: I read the newspaper every morning.
    region: common
  - fr: Elle boit **un** café avant d’aller travailler.
    en: She drinks a coffee before going to work.
    region: common
  - fr: Nous achetons **des** pommes au marché.
    en: We buy some apples at the market.
    region: common
  - fr: Tu as vu **l’**ami de Marie hier?
    en: Did you see Marie’s friend yesterday?
    region: common
  - fr: Ils regardent **la** télévision le soir.
    en: They watch television in the evening.
    region: common
  - fr: J’aime **les** films d’aventure.
    en: I like adventure movies.
    region: common
  - fr: Elle veut **une** nouvelle robe pour la fête.
    en: She wants a new dress for the party.
    region: common
  - fr: Nous allons **au** parc cet après-midi.
    en: We are going to the park this afternoon.
    note: The preposition *au* = à + le; the article *le* is hidden inside the contraction.
    region: common
  - fr: Il y a **des** enfants qui jouent dans la cour.
    en: There are some children playing in the yard.
    region: common
  - fr: Vous avez **le** même livre que moi?
    en: Do you have the same book as me?
    region: common
