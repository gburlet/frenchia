sections:
- type: explanation
  id: explanation
  heading: Les articles définis et indéfinis
  body: |-
    ***
    ### Core Explanation

    In French every singular noun needs an article. The **definite articles** (le, la, l’, les) refer to a specific thing or to a whole class, while the **indefinite articles** (un, une, des) introduce something that is not identified yet.

    **1. Definite articles**
    - **le** = masculine singular (e.g., **le livre** – the book)
    - **la** = feminine singular (e.g., **la table** – the table)
    - **l’** = used before a vowel or mute *h* (e.g., **l’ami**, **l’hôtel**)
    - **les** = plural for both genders (e.g., **les enfants** – the children)

    Use **le/la/l’/les** when you talk about a known object, a habit, or a whole category:
    - **J’aime le chocolat.** (I like chocolate – chocolate in general)
    - **Elle va à la bibliothèque chaque jour.** (She goes to the library every day.)

    **2. Indefinite articles**
    - **un** = masculine singular (e.g., **un stylo** – a pen)
    - **une** = feminine singular (e.g., **une chaise** – a chair)
    - **des** = plural for both genders (e.g., **des fleurs** – some flowers)

    Use **un/une/des** when the noun is mentioned for the first time or when you do not refer to a particular item:
    - **Je veux un café.** (I want a coffee.)
    - **Nous avons acheté des pommes.** (We bought some apples.)

    **3. Common pitfalls**
    - **Gender confusion** – English speakers often guess the gender from the English word. Remember that *le* is always masculine and *la* always feminine; you must learn the gender with the noun (e.g., *le problème* is masculine even though “problem” feels neutral in English).
    - **Omitting the article** – In English we can say “I like music.” In French, the generic statement needs the definite article: **J’aime la musique**, not *J’aime musique*.

    Keep these patterns in mind, and practice by pairing each noun you learn with its article right away. This habit will prevent most A-level errors.
    ***
