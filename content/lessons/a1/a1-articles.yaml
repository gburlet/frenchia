  passage_fr: Le dimanche, je vais au marché du quartier. J’achète **un** pain frais, **une** baguette
    et **des** fruits. **L’**épicerie vend **des** tomates rouges et **des** carottes. **Le** marchand
    de fromage propose **un** fromage de chèvre. **La** fleuriste a **des** roses et **une** orchidée.
    Après **le** marché, je retrouve mes amis près de **la** fontaine et nous prenons **un** café ensemble.
  translation_en: On Sundays I go to the neighbourhood market. I buy a fresh loaf of bread, a baguette
    and some fruit. The grocery shop sells some red tomatoes and some carrots. The cheese seller offers
    a goat cheese. The florist has some roses and an orchid. After the market I meet my friends near the
    fountain and we have a coffee together.
