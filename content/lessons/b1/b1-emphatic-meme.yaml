- type: regional_note
  id: regional-note
  heading: Québec vs. France: Pronoms toniques + même
  body: |-
    In everyday Québec speech the construction *pronoun + même* is used exactly as in France to stress that the person does something on his or her own. The only noticeable difference is that Québécois speakers tend to keep the stressed pronoun even when the subject is already expressed, especially in spoken language: *Moi‑même, j’ai réparé le vélo* (FR: *Moi‑même, j’ai réparé le vélo* – same, but the French often drop the redundant pronoun in formal writing). Otherwise the grammar, placement and meaning are identical.

    **Variants**
    1. Québec : *moi‑même* – same in France.
    2. Québec : *toi‑même* – same in France.
    3. Québec : *lui‑même / elle‑même* – same in France.
    4. Québec : *nous‑mêmes* – same in France.
    5. Québec : *vous‑mêmes* – same in France.
    6. Québec : *eux‑mêmes / elles‑mêmes* – same in France.

    No other lexical or syntactic differences are observed for this structure.
  variants: []
- type: reading
  id: reading
  title: Une soirée d’automne à la cabane à sucre
  passage_fr: C’est le premier week‑end de la fin de septembre et la petite communauté de Saint‑Émile
    organise une fête à la cabane à sucre du coin. **Moi‑même**, j’ai proposé d’aider à préparer le repas,
    même si je travaille à temps plein au dépanneur. **Toi‑même**, Sophie, tu t’es chargée d’installer
    les tables et les chaises dans la salle communautaire, alors que tes enfants jouaient dehors. Les
    bénévoles **nous‑mêmes** avons cueilli les pommes de terre et les betteraves pour la soupe du soir.
    Le chef du restaurant local a cuisiné le **dîner** (le déjeuner du midi) pendant que les jeunes du
    groupe de musique ont accordé leurs instruments. **Elles‑mêmes**, les animatrices du club de lecture,
    ont préparé un petit jeu de mots pour les grands‑parents. Quand la nuit est tombée, **vous‑mêmes**
    avez allumé les lanternes et vous avez dansé jusqu’à minuit. **Eux‑mêmes**, les vieux du village,
    ont raconté des histoires de la Grande‑Ourse et tout le monde a ri. Grâce à l’effort de chacun, la
    soirée a été un vrai succès et on a déjà hâte de recommencer l’an prochain.
  translation_en: It's the first weekend of late September and the small community of Saint‑Émile is organizing
    a party at the local sugar shack. **I myself**, I offered to help prepare the meal, even though I
    work full‑time at the convenience store. **You yourself**, Sophie, you took charge of setting up the
    tables and chairs in the community hall, while your kids played outside. The volunteers **we ourselves**
    harvested the potatoes and beets for the evening soup. The chef from the local restaurant cooked the
    **dinner** (the midday lunch) while the young members of the band tuned their instruments. **They
    themselves**, the reading‑club leaders, prepared a little word game for the grandparents. When night
    fell, **you all yourselves** lit the lanterns and danced until midnight. **They themselves**, the
    village elders, told stories about the Big Dipper and everyone laughed. Thanks to each person's effort,
    the evening was a real success and we’re already looking forward to doing it again next year.
