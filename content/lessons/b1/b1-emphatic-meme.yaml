sections:
- type: explanation
  id: explanation
  heading: Les pronoms toniques avec *même* – B1
  body: '### What the construction looks like  In Québec French the stressed pronouns **moi, toi, lui,
    elle, nous, vous, eux, elles** can be followed by the word *même* to stress that the subject acts
    **on its own** or to contrast it with someone/something else. The hyphen is **mandatory** in written
    French (e.g., *moi-même, vous-mêmes*). The whole unit behaves like an adverbial phrase; it usually
    follows the verb but can also be placed at the beginning of a clause for emphasis.  **Structure**:  ```[tonic
    pronoun] + même```  The pronoun is always the stressed form, never the subject pronoun (je, tu, il…).  ###
    Typical uses  | English | French (Québec) | |---|---| | I did it **myself**. | **J’ai fait ça moi-même**.
    | | You (singular) have to decide **yourself**. | **Tu dois décider toi-même**. | | They built the
    shed **themselves**. | **Ils ont construit l’abri eux-mêmes**. | | I myself didn’t understand it.
    | **Moi-même, je ne l’ai pas compris**. |  ### Real pitfalls to watch out for  1. **Hyphen omission**
    – The hyphen is required in all written forms (*moi-même, vous-mêmes, eux-mêmes*).  2. **Agreement
    in the plural** – When the stressed pronoun is plural, *même* also takes the plural form: *nous-mêmes,
    vous-mêmes, eux-mêmes, elles-mêmes*.  3. **Placement** – The tonic-+-même can appear after the verb
    (*Il a réparé la voiture lui-même*) or at the start of the clause for emphasis (*Moi-même, je le ferai*).  4.
    **Confusing with the ordinary adjective *même*** – *même* without a hyphen is the adjective meaning
    “same” (e.g., *le même livre*).  5. **Using the subject pronoun instead of the stressed one** – Do
    not say *je-même* or *tu-même*; the correct form is the stressed pronoun plus *-même* (e.g., *Moi-même,
    je le fais*).  ### Quick tip  To stress that *you* (or *they*) are the only ones involved, place the
    tonic-+-même right after the verb: **Il a réparé la voiture lui-même** (He repaired the car himself).  Remember:
    the hyphen is never optional in writing, and the plural forms add an *-s* to *même* (nous-mêmes, vous-mêmes,
    etc.).'
