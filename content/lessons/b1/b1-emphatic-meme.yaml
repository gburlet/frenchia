- type: regional_note
  id: regional-note
  heading: Québec vs. France : Pronoms toniques + même
  body: In both Québec French and European French the construction *pronoun + même* is used to stress
    that the person does something on his or her own. The grammar, placement and meaning are identical
    in the two varieties; there is no special regional difference to note. For example, *Moi-même, j’ai
    réparé le vélo* is perfectly natural in Québec and in France alike. The same pattern is used with
    all stressed pronouns (toi-même, lui-même, elle-même, nous-mêmes, vous-mêmes, eux-mêmes, elles-mêmes).
  variants: []
- type: reading
  id: reading
  title: Une fête des récoltes à la ferme du coin
  passage_fr: C’est la première fin de semaine de septembre et la petite communauté de Saint-Émile organise
    une fête des récoltes à la ferme du coin. **Moi-même**, j’ai proposé d’aider à préparer le repas,
    même si je travaille à temps plein comme réparateur. **Toi-même**, Sophie, tu t’es chargée d’installer
    les tables et les chaises dans la salle communautaire, alors que tes enfants jouaient dehors. **Nous-mêmes**,
    les bénévoles, avons cueilli les pommes de terre et les betteraves pour la soupe du soir. Le chef
    du restaurant local a cuisiné le **dîner** (le repas du midi) pendant que les jeunes du groupe de
    musique accordaient leurs instruments. **Elles-mêmes**, les animatrices du club de lecture, ont préparé
    un petit jeu de société pour les grands-parents. Quand la nuit est tombée, **vous-mêmes**, vous avez
    allumé les lanternes et dansé jusqu’à minuit. **Eux-mêmes**, les aînés du village, ont raconté des
    histoires de la Grande-Ourse et tout le monde a ri. Grâce à l’effort de chacun, la soirée a été un
    vrai succès et on a déjà hâte de recommencer l’an prochain.
  translation_en: It's the first weekend of September and the small community of Saint-Émile is organizing
    a harvest party at the local farm. **I myself**, I offered to help prepare the meal, even though I
    work full-time as a repairman. **You yourself**, Sophie, you took charge of setting up the tables
    and chairs in the community hall, while your kids played outside. **We ourselves**, the volunteers,
    harvested the potatoes and beets for the evening soup. The chef from the local restaurant cooked the
    **lunch** (the midday meal) while the young members of the band tuned their instruments. **They themselves**,
    the reading-club leaders, prepared a little board-game for the grandparents. When night fell, **you
    all yourselves**, you lit the lanterns and danced until midnight. **They themselves**, the village
    elders, told stories about the Big Dipper and everyone laughed. Thanks to each person's effort, the
    evening was a real success and we’re already looking forward to doing it again next year.
