sections:
- type: explanation
  id: explanation
  heading: Les pronoms toniques avec *même* – B1
  body: "***\n### What the construction looks like\nIn Québec French the stressed pronouns **moi, toi,\
    \ lui, elle, nous, vous, eux, elles** can be followed by the word *même* to stress that the subject\
    \ is acting on **its own** or to contrast it with someone/something else.\n\n**Structure**: \n```\n\
    [tonic pronoun] + même\n```\nThe pronoun is **always** the stressed form, never the subject pronoun\
    \ (je, tu, il…). The whole unit behaves like an adverbial phrase and usually follows the verb, but\
    \ it can also appear at the beginning of a clause for emphasis.\n\n### Typical uses\n| English | French\
    \ (Québec) |\n|---|---|\n| I did it **myself**. | **J’ai fait ça moi‑même**. |\n| You (singular) have\
    \ to decide **yourself**. | **C’est à toi‑même de décider**. |\n| They built the shed **themselves**.\
    \ | **Ils ont construit l’abri eux‑mêmes**. |\n| *Even* I could understand it. | **Moi‑même, je l’ai\
    \ compris**. |\n\n### A couple of common pitfalls\n1. **Forgetting the hyphen** – In Québec French\
    \ the stressed pronoun and *même* are written with a hyphen (moi‑même, eux‑même). Leaving out the\
    \ hyphen looks like a mistake and can be confused with the ordinary adjective *même*.\n2. **Using\
    \ the subject pronoun instead of the tonic one** – English speakers often say *je même* or *tu même*.\
    \ The correct form is **je‑même** only when the stressed pronoun replaces the subject (e.g., *Moi‑même,\
    \ je le fais*). Otherwise keep the subject pronoun and add the tonic phrase after the verb.\n\n###\
    \ Quick tip\nIf you want to stress that *you* (or *they*) are the only ones involved, place the tonic‑+‑même\
    \ right after the verb: **Il a réparé la voiture lui‑même** (He repaired the car himself). In informal\
    \ speech you’ll also hear the familiar contraction **moi‑même** → **moi‑même** (no change) but never\
    \ *moi même* without the hyphen.\n***"
