sections:
- type: explanation
  id: explanation
  heading: '# Le subjonctif présent (B1)'
  body: 'The present subjunctive (le subjonctif présent) is a mood, not a tense. It is used when the speaker
    expresses **doubt, necessity, desire, emotion, or a future-or-unknown situation**. In everyday Québec
    speech you will hear it most often after expressions such as **il faut que**, **vouloir que**, and
    **avant que**. (For the European French equivalents, see the regional notes later.)  ---  ### How
    to form it 1. **Take the 3rd-person plural (ils/elles) form of the present indicative.** 2. **Remove
    the –ent ending** to get the stem. 3. **Add the subjunctive endings** –e, –es, –e, –ions, –iez, –ent.
     ---  | Verb | ils/elles (présent) | Stem | Subjunctive forms | |------|--------------------|------|-------------------|
    | **parler** | parlent | parl- | **que je parle**, **que nous parlions** | | **finir** | finissent
    | finiss- | **que tu finisses**, **que vous finissiez** | | **prendre** | prennent | prenn- | **qu’il
    prenne**, **qu’ils prennent** |  ---  **Irregular verbs** have their own subjunctive stems that do
    not follow the regular “-ent → stem” rule.  The most common irregular stems are:  * être → **soi-**
    (que je **sois**, que nous **soyons**)  * avoir → **ai-** (que j’**aie**, que nous **ayons**)  * aller
    → **aill-** for *je/tu/il/ils* (que j’**aille**, que tu **ailles**, qu’il **aille**, qu’ils **aillent**)
    but **all-** for *nous/vous* (que nous **allions**, que vous **alliez**)  * faire → **fass-** (que
    je **fasse**, que vous **fassiez**)  * pouvoir → **puiss-** (que je **puisse**, que nous **puissions**)  *
    savoir → **sach-** (que je **sache**, que vous **sachiez**)  * venir → **vienn-** (que je **vienne**,
    que nous **venions**)  * voir → **voi- / voy-** (que je **voie**, que nous **voyions**)  * prendre
    → **prenn-** (already shown above)  The endings –e, –es, –e, –ions, –iez, –ent are used for **regular
    verbs and for irregular verbs other than *être* and *avoir***. *Être* and *avoir* are fully irregular
    and have their own unique endings (sois, sois, soit, soyons, soyez, soient; aie, aies, ait, ayons,
    ayez, aient).  ---  ### Typical triggers  - **Il faut que** + subjunctive → *Il faut que tu **finisses**
    tes devoirs.*  - **Vouloir que** + subjunctive → *Je veux que vous **veniez** ce soir.*  - **Avant
    que** + subjunctive (future-or-unknown) → *Finis ton travail **avant que** le patron **arrive**.*
     ---  ### Common pitfalls for English speakers  1. **Confusing the subjunctive with the indicative**
    – English often uses “that” clauses with the indicative (*I think that he is…*), but French switches
    to the subjunctive when the clause expresses necessity, desire, or uncertainty. Remember the trigger
    words above.  2. **Forgetting the “-ions / -iez” endings** – they look like the imperfect endings,
    but they belong to the subjunctive. *Nous **parlions** (subj.)* is not the same as *Nous **parlions**
    (imparfait)*; the meaning is determined by the context, not by the spelling.  ---  ### Practice  Turn
    a simple indicative sentence into a subjunctive one using each of the three trigger expressions. For
    example, change *« Tu vas au travail. »* into: *« Il faut que tu **ailles** au travail. », « Je veux
    que tu **ailles** au travail. », « Finis ton travail **avant que** tu **ailles** au travail. »*  Happy
    learning!'
