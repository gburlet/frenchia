sections:
- type: explanation
  id: explanation
  heading: '# Le subjonctif présent (B1)'
  body: 'The present subjunctive (le subjonctif présent) is a mood, not a tense. It is used when the speaker
    expresses **doubt, necessity, desire, emotion, or a future-or-unknown situation**. In everyday Québec
    speech you will hear it most often after expressions such as **il faut que**, **vouloir que**, and
    **avant que**. (For the European French equivalents, see the regional notes later.)  ---  ### How
    to form it  1. **Take the 3rd-person plural (ils/elles) form of the present indicative.**  2. **Remove
    the –ent ending** to get the stem.  3. **Add the subjunctive endings** –e, –es, –e, –ions, –iez, –ent.
     ---  | Verb | ils/elles (présent) | Stem used for the subjunctive | Subjunctive forms (example) |
    |------|--------------------|------------------------------|------------------------------| | **parler**
    | parlent | parl- | que je **parle**, que nous **parlions** | | **finir** | finissent | finiss- |
    que tu **finisses**, que vous **finissiez** | | **prendre** | prennent | prenn- (je/tu/il/ils) – pren-
    (nous/vous) | que je **prenne**, que nous **prenions** |  ---  **Irregular verbs** have their own
    subjunctive stems that do not follow the regular “-ent → stem” rule. The most common irregular stems
    are:  * **être** → **soi-** (que je **sois**, que nous **soyons**)  * **avoir** → **ai-** (que j’**aie**,
    que nous **ayons**)  * **aller** → **aill-** for *je/tu/il/ils* (que j’**aille**, que tu **ailles**,
    qu’il **aille**, qu’ils **aillent**) but **all-** for *nous/vous* (que nous **allions**, que vous
    **alliez**)  * **faire** → **fass-** (que je **fasse**, que vous **fassiez**)  * **pouvoir** → **puiss-**
    (que je **puisse**, que nous **puissions**)  * **savoir** → **sach-** (que je **sache**, que vous
    **sachiez**)  * **venir** → **vienn-** for *je/tu/il/ils* (que je **vienne**, que tu **viennes**,
    qu’il **vienne**, qu’ils **viennent**) but **ven-** for *nous/vous* (que nous **venions**, que vous
    **veniez**)  * **voir** → **voi- / voy-** (que je **voie**, que nous **voyions**)  * **prendre** →
    **prenn-** (je/tu/il/ils) – **pren-** (nous/vous) (already shown above)  The endings –e, –es, –e,
    –ions, –iez, –ent are used for **regular verbs and for irregular verbs other than *être* and *avoir***.
    *Être* and *avoir* are fully irregular and have their own unique endings (sois, sois, soit, soyons,
    soyez, soient; aie, aies, ait, ayons, ayez, aient).  ---  ### Typical triggers  - **Il faut que**
    + subjunctive → *Il faut que tu **finisses** tes devoirs.*  - **Vouloir que** + subjunctive → *Je
    veux que vous **veniez** ce soir.*  - **Avant que** + subjunctive (future-or-unknown) → *Finis ton
    travail **avant que** le patron **arrive**.*  ---  ### Common pitfalls for English speakers  1. **Confusing
    the subjunctive with the indicative** – English often uses “that” clauses with the indicative (*I
    think that he is…*), but French switches to the subjunctive when the clause expresses necessity, desire,
    or uncertainty. Remember the trigger words above.  2. **The -ions / -iez endings look like the imperfect**
    – the forms *nous parlions* or *vous finissiez* are identical in spelling to the imperfect endings,
    but they are subjunctive when they appear after a trigger such as *il faut que…* or *avant que…*.
    The context (the presence of the trigger) tells you which mood is intended.  ---  ### Practice  Turn
    a simple indicative sentence into a subjunctive one using each of the three trigger expressions. For
    example, change *« Tu vas au travail. »* into: *« Il faut que tu **ailles** au travail. », « Je veux
    que tu **ailles** au travail. », « Finis ton travail **avant que** le patron **arrive**. »*  Happy
    learning!'
