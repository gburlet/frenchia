- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the present subjunctive'
  body: In everyday Québec speech the subjunctive appears in the same contexts as in France—after *il
    faut que*, *vouloir que*, *avant que*, etc. The grammar is identical; only a few everyday words differ.
    For instance, Québécois say *la fin de semaine* for the weekend, while in France you would hear *le
    week-end*. These lexical differences simply change the vocabulary you insert into a subjunctive construction,
    not the structure itself.
  variants:
  - qc: la fin de semaine
    fr: le week-end
    en: weekend
    formality: standard
- type: reading
  id: reading
  title: Un après-midi au parc
  passage_fr: Ce samedi, la famille Tremblay a décidé d’aller au parc du centre-ville pour profiter du
    beau temps. Avant que le soleil ne se couche, ils veulent que leurs enfants **jouent** sur le terrain
    de jeux et que le petit chien **coure** derrière les balles. Leur voisin, M. Lévesque, les invite
    à un pique-nique ; il faut que tout le monde **apporte** quelque chose à manger. « Je veux que tu
    **apportes** les sandwichs au jambon, » dit Mme Tremblay à sa sœur. « Et que tu **apportes** aussi
    une salade de pommes de terre, » ajoute-t-elle en souriant. Pendant que les adultes **préparent**
    le repas, les enfants **courent** et **crient** de joie. Avant que la pluie ne revienne, ils **souhaitent
    que le vent soit calme et que les nuages disparaissent**. Quand le soleil commence à décliner, ils
    rangent leurs affaires, heureux d’avoir passé une belle **fin de semaine** ensemble.
  translation_en: This Saturday, the Tremblay family decided to go to the downtown park to enjoy the nice
    weather. Before the sun goes down, they want their kids to play on the playground and the little dog
    to run after the balls. Their neighbour, Mr. Lévesque, invites them to a picnic; everyone has to bring
    something to eat. “I want you to bring the ham sandwiches,” says Mrs. Tremblay to her sister. “And
    that you also bring a potato salad,” she adds with a smile. While the adults prepare the meal, the
    children run and shout with joy. Before the rain comes back, they wish that the wind be calm and that
    the clouds disappear. When the sun starts to set, they pack up their things, happy to have spent a
    nice weekend together.
