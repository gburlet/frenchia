  type: multiple_choice
  question: Choose the sentence that correctly uses the subjunctive after *avant que*.
  options:
  - Avant que tu arrives à la gare, appelle-moi.
  - Avant que tu arriveras à la gare, appelle-moi.
  - Avant que tu arrivais à la gare, appelle-moi.
  - Avant que tu arriverait à la gare, je t’appellerai.
  answer_index: 0
  explanation: '*Avant que* always introduces a subordinate clause that requires the **present subjunctive**
    because the action is anticipated and not yet realized. The correct present-subjunctive form of *arriver*
    for *tu* is *arrives*. Only option a uses this form and pairs it with a grammatically appropriate
    main clause. The other options use either the future indicative (*arriveras*), the imperfect indicative
    (*arrivais*), or a non-subjunctive form (*arriverait*), which are all incorrect after *avant que*.'
