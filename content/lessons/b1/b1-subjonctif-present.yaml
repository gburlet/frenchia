- id: ex-09
  grammar_topics:
  - subjonctif-present
  type: multiple_choice
  question: Il faut que nous ___ à l'heure.
  options:
  - sois
  - soit
  - soyons
  - êtes
  answer_index: 2
  explanation: After *il faut que* the verb must be in the **subjunctive** and agree with the subject
    of the subordinate clause. The subject is *nous*, so the correct form is *soyons* (subjunctive 1st-person
    plural). The other choices are the 2nd-person singular (*sois*), 3rd-person singular (*soit*), or
    the indicative 2nd-person plural (*êtes*). The sentence now provides the necessary context for the
    required form, making *soyons* the only correct answer.
- id: ex-10
  grammar_topics:
