  type: multiple_choice
  question: Choose the sentence that correctly uses the subjunctive after *avant que*.
  options:
  - Avant que tu arrives à la gare, appelle-moi.
  - Avant que tu arrives à la gare, appel-moi.
  - Avant que tu arrives à la gare, appelez-moi.
  - Avant que tu arriveras à la gare, je t’appellerai.
  answer_index: 0
  explanation: '*Avant que* introduces a subordinate clause that refers to an event that has not yet happened,
    so the verb in that clause must be in the **subjunctive**. The correct subjunctive form of *arriver*
    for *tu* is *arrives*. Option a is the only sentence that (1) uses the correct subjunctive form *arrives*
    and (2) has a grammatically correct main clause (the imperative *appelle-moi*). Option b is missing
    the final *e* in the imperative (*appel-moi*), option c uses the plural imperative *appelez-moi* which
    does not match the singular *tu*, and option d contains the indicative future form *arriveras* in
    the *avant que* clause, which is not allowed after *avant que*; therefore it is incorrect despite
    the main clause being fine. The correct answer is option a.'
