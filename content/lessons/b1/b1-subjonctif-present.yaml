- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the present subjunctive'
  body: In everyday Québec speech the subjunctive appears in the same contexts as in France—after *il
    faut que*, *vouloir que*, *avant que*, etc. The main difference is the surrounding vocabulary, which
    follows Québec conventions. For example, Québécois say *le souper* (supper) where a French speaker
    would say *le dîner*; they use *la fin de semaine* instead of *le week-end*; and *déjeuner* means
    breakfast, while in France it means lunch. These lexical shifts affect the sentences you build with
    the subjunctive, but the grammar itself is identical.
  variants:
  - qc: le souper
    fr: le dîner
    en: supper
    formality: standard
  - qc: la fin de semaine
    fr: le week-end
    en: weekend
    formality: standard
  - qc: déjeuner (breakfast)
    fr: déjeuner (lunch)
    en: breakfast / lunch
    formality: standard
  - qc: dîner (lunch)
    fr: dîner (dinner)
    en: lunch / dinner
    formality: standard
- type: reading
  id: reading
  title: Un après-midi au parc
  passage_fr: Ce samedi, la famille Tremblay a décidé d’aller au parc du Vieux-Québec pour profiter du
    beau temps. Avant que le soleil ne se couche, ils veulent que leurs enfants **jouent** sur le terrain
    de jeux et que le petit chien **coure** derrière les balles. Leur voisin, M. Lévesque, les invite
    à un pique-nique ; il faut que tout le monde **apporte** quelque chose à manger. « Je veux que tu
    **apportes** les sandwichs au jambon, » dit-elle à sa sœur. « Et que vous **apportiez** une salade
    de pommes de terre, » ajoute-t-elle en souriant. Pendant que les adultes **préparent** le repas, les
    enfants **courent** et **crient** de joie. Avant que la pluie ne revienne, ils **souhaitent que le
    vent soit calme et que les nuages disparaissent**. Quand le soleil commence à décliner, ils rangent
    leurs affaires, heureux d’avoir passé une belle fin de semaine ensemble.
  translation_en: This Saturday, the Tremblay family decided to go to the Old-Quebec park to enjoy the
    nice weather. Before the sun goes down, they want their kids to play on the playground and the little
    dog to run after the balls. Their neighbour, Mr. Lévesque, invites them to a picnic; everyone has
    to bring something to eat. “I want you to bring the ham sandwiches,” she says to her sister. “And
    you bring a potato salad,” she adds with a smile. While the adults prepare the meal, the children
    run and shout with joy. Before the rain comes back, they wish that the wind be calm and that the clouds
    disappear. When the sun starts to set, they pack up their things, happy to have spent a nice weekend
    together.
