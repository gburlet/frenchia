- type: reading
  id: reading
  title: Une fin de semaine au chalet
  passage_fr: Le vendredi soir, ma sœur et moi avons décidé d’aller passer la fin de semaine au chalet
    de nos grands‑parents à la campagne. Avant de partir, nous avions déjà préparé nos valises et acheté
    du sirop d’érable au dépanneur du village. Quand nous sommes arrivés, il avait neigé toute la journée,
    alors le chemin était glissant. Nous avons déposé nos sacs, puis nous avons allumé le feu de bois
    dans la cheminée. Pendant que le feu crépitait, mon frère a sorti la guitare et nous avons chanté
    des vieilles chansons québécoises. Le lendemain, nous avions prévu de faire du ski de fond, mais la
    neige a fondu plus tôt que prévu, alors nous avons décidé de magasiner au petit magasin du coin. Nous
    avons trouvé de belles écharpes en laine et des bonbons à la tire. Le soir, nous avons dîné du ragoût
    de bœuf que ma tante avait préparé la veille. Avant de rentrer à la maison, nous avions déjà pris
    plein de photos pour se souvenir de ce week‑end chaleureux.
  translation_en: On Friday evening, my sister and I decided to spend the weekend at our grandparents'
    cottage in the countryside. Before leaving, we had already packed our suitcases and bought maple syrup
    at the village’s dépanneur. When we arrived, it had snowed all day, so the road was slippery. We put
    down our bags, then we lit the wood fire in the fireplace. While the fire crackled, my brother took
    out his guitar and we sang old Quebec songs. The next day, we had planned to go cross‑country skiing,
    but the snow melted earlier than expected, so we decided to shop at the little local store. We found
    nice wool scarves and *bonbons à la tire*. In the evening we ate beef stew that my aunt had prepared
    the day before. Before heading home, we had already taken lots of photos to remember this warm weekend.
