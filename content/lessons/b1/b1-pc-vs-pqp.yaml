sections:
- type: explanation
  id: explanation
  heading: Passé composé ou plus‑que‑parfait ?  (Past Simple or Past Perfect?)
  body: "***\n### How the two tenses are built\n- **Passé composé** = auxiliary *avoir* or *être* in the\
    \ **present** + past participle.  \n  Example: **J’ai fini mon souper** (I finished my dinner).\n\
    - **Plus‑que‑parfait** = the **same auxiliary** but **conjugated in the imperfect** + past participle.\
    \  \n  Example: **J’avais fini mon souper** (I had finished my dinner).\n\nBoth use the same past\
    \ participle; the difference is the tense of the auxiliary.\n\n### When to use each one\n| Situation\
    \ | Use | Typical cue word |\n|-----------|-----|-----------------|\n| One action that simply happened\
    \ in the past, often linked to a specific moment (e.g., a time of day, a finished event). | **Passé\
    \ composé** | *hier, ce matin, à 18 h* |\n| An action that occurred **before** another past action,\
    \ i.e., the “earlier” event in a story. | **Plus‑que‑parfait** | *déjà, avant que, quand* |\n\n**Story\
    \ example** (Québec flavour):\n- **Hier, j’ai rencontré mon ami au dépanneur.**  \n- **Quand je suis\
    \ arrivé, il avait déjà acheté du sirop d’érable.**\n\nHere the meeting is the main past event (passé\
    \ composé). The purchase happened earlier, so it is expressed with the plus‑que‑parfait.\n\n### Common\
    \ pitfalls for English speakers\n1. **Confusing “had + past participle” with English past perfect**\
    \ – In French the plus‑que‑parfait is **only** used when you need to show a *chronological* relationship\
    \ between two past actions. English sometimes uses the past perfect for speculation or politeness,\
    \ which French would keep in the passé composé.\n2. **Choosing the wrong auxiliary** – Remember that\
    \ *être* is used with all reflexive verbs and the classic movement verbs (aller, venir, arriver, etc.).\
    \ The same rule applies in the plus‑que‑parfait: **Je suis allé** → **J’étais allé**.\n\n### Quick\
    \ tip\nIf you can replace the verb with *avoir* and the sentence still sounds natural, you’re probably\
    \ dealing with a **passé composé**. If you need to place the event *before* another past event, switch\
    \ the auxiliary to the imperfect and you have the **plus‑que‑parfait**.\n***"
