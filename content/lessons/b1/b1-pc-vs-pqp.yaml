  type: multiple_choice
  question: Choose the sentence that correctly uses the passé composé to describe a completed action that
    follows another past event.
  options:
  - Après que le train est arrivé, je suis allé chercher mes bagages.
  - Après que le train arrivait, je suis allé chercher mes bagages.
  - Après que le train était arrivé, j’allais chercher mes bagages.
  - Après que le train a arrivé, je suis allé chercher mes bagages.
  answer_index: 0
  explanation: The passé composé is required for the train’s arrival because it is a completed event that
    precedes another completed action. Option 0 uses *est arrivé* (passé composé) followed by *suis allé*
    (also passé composé), which is the correct sequence. Option 1 is wrong because *arrivait* is the imperfect,
    which cannot express a completed event. Option 2 uses the plus-que-parfait (*était arrivé*) but then
    switches to the imperfect (*j’allais*), which does not show a completed action following the arrival.
    Option 3 uses the auxiliary *a* instead of *être* with *arriver*; the correct auxiliary for *arriver*
    in the passé composé is *être*. Therefore, only option 0 is correct.
