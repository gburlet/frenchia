sections:
- type: explanation
  id: explanation
  heading: Passé composé ou plus-que-parfait ? (Past Simple or Past Perfect?)
  body: |-
    **How the two tenses are built**  

    - **Passé composé** = auxiliary *avoir* or *être* in the **present** + past participle. Example: **J’ai fini mon dîner** (I finished my lunch).

    - **Plus-que-parfait** = the **same auxiliary** but **conjugated in the imperfect** + past participle. Example: **J’avais fini mon dîner** (I had finished my lunch).

    Both tenses use the same past participle; the difference lies in the tense of the auxiliary.

    **When to use each one**

    | Situation | Use | Typical cue word |
    | ----------- | ----- | ----------------- |
    | A single past event, often linked to a specific moment (e.g., a time of day, a finished action). | **Passé composé** | *hier, ce matin, à 18 h* |
    | An action that happened **before** another past action – the “earlier” event in a story. | **Plus-que-parfait** | *déjà, la veille, auparavant, ne… pas encore* |

    **Story example** (everyday context)

    - **Hier, j’ai rencontré mon collègue à la bibliothèque.**

    - **Quand je suis arrivé, il avait déjà réservé la salle de réunion.**

    **The arrival is the main past event (passé composé).** The reservation happened earlier, so it is expressed with the plus-que-parfait.

    **Common pitfalls for English speakers**

    1. **Using the passé composé where French needs the plus-que-parfait** – English often uses the simple past for a sequence of events, but French requires the plus-que-parfait for the action that happened first.

    2. **Choosing the wrong auxiliary** – Remember that *être* is used with all reflexive verbs and the classic movement verbs (aller, venir, arriver, etc.). The same rule applies in the plus-que-parfait: **Je suis allé** → **J’étais allé**.

    **Quick tip**

    Ask yourself which of the two past events happened first. The earlier event takes the **plus-que-parfait**; the later event stays in the **passé composé**.
