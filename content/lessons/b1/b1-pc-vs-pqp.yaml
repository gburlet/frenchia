  title: Une fin de semaine au chalet
  passage_fr: Le vendredi soir, ma sœur et moi avons décidé d’aller passer la fin de semaine au chalet
    de nos grands-parents à la campagne. Avant de partir, nous avions déjà préparé nos valises et acheté
    du pain et des fruits à l’épicerie du village. Quand nous sommes arrivés, il avait neigé toute la
    journée, alors le chemin était glissant. Nous avons déposé nos sacs, puis nous avons allumé le feu
    de bois dans la cheminée. Pendant que le feu crépitait, mon frère a sorti la guitare et nous avons
    chanté quelques vieilles chansons. Le lendemain, nous avions prévu de faire du ski de fond, mais la
    neige a fondu plus tôt que prévu, alors nous avons décidé de visiter la petite boutique d’artisanat
    du coin. Nous y avons trouvé de belles écharpes en laine et des cartes postales colorées. Le soir,
    nous avons soupé du ragoût de bœuf que ma tante avait préparé la veille. Avant de rentrer à la maison,
    nous avions déjà pris plein de photos pour nous souvenir de cette fin de semaine chaleureuse.
  translation_en: On Friday evening, my sister and I decided to spend the weekend at our grandparents'
    cottage in the countryside. Before leaving, we had already packed our suitcases and bought bread and
    fruit at the village grocery store. When we arrived, it had snowed all day, so the road was slippery.
    We put down our bags, then we lit the wood fire in the fireplace. While the fire crackled, my brother
    took out his guitar and we sang a few old songs. The next day, we had planned to go cross-country
    skiing, but the snow melted earlier than expected, so we decided to visit the little craft shop nearby.
    There we found nice wool scarves and colourful postcards. In the evening we ate beef stew that my
    aunt had prepared the day before. Before heading home, we had already taken lots of photos to remember
    this warm weekend.
