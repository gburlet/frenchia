- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Passé composé / Plus-que-parfait'
  body: 'In everyday Québec speech the same rules for the passé composé and the plus-que-parfait apply
    as in France; the only noticeable difference is the vocabulary that surrounds the tenses. Québécois
    speakers often talk about a *déjeuner* (breakfast) or a *dîner* (lunch) and a *souper* (dinner), whereas
    in France those meals are called *petit-déjeuner*, *déjeuner* and *dîner*. The expression for the
    weekend is also different: *la fin de semaine* in Québec versus *le week-end* in France. Otherwise
    the grammatical choice between passé composé and plus-que-parfait is identical.'
