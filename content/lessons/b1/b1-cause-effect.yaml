- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: expressing cause and consequence'
  body: 'In everyday speech the causal connectors (parce que, car, puisque, à cause de, donc, alors, etc.)
    are used the same way in Québec and in France. The main regional difference you will see in this lesson
    is lexical: Québec uses *la fin de semaine* for “the weekend” (instead of the European *le week-end*).
    The connectors themselves do not change.'
  variants:
  - qc: la fin de semaine
    fr: le week-end
    en: the weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine au village
  passage_fr: Ce samedi, ma famille et moi avons décidé d’aller faire du ski de fond au parc du Mont-Royal.
    **Parce qu’il faisait très froid**, nous avons mis nos vestes épaisses et nos bonnets en laine. **Grâce
    à la bonne météo**, la neige était parfaite et le sentier était bien damé. Nous sommes partis tôt,
    **donc** il y avait peu de monde sur le sentier et nous avons pu profiter tranquillement de la glisse.
    **À cause de la circulation** sur **l’autoroute 15**, nous avons mis trente minutes de plus pour arriver,
    mais cela ne nous a pas dérangés. **Puis** nous avons commencé à skier dès que nous avons atteint
    le sommet. Le vent était fort, **c’est pourquoi** nous avons fait une pause au chalet pour nous réchauffer.
    **Lorsque** nous sommes revenus, le soleil était revenu et la vue était magnifique. **Ainsi**, nous
    avons passé une belle **fin de semaine** en plein air et nous sommes rentrés chez nous très contents.
  translation_en: This Saturday, my family and I decided to go cross-country skiing in Mont-Royal Park.
    Because it was very cold, we put on our thick jackets and woolen hats. Thanks to the good weather,
    the snow was perfect and the trail was well-groomed. We left early, so there were few people on the
    trail and we could enjoy the glide in peace. Because of the traffic on Highway 15, we spent an extra
    thirty minutes getting there, but it didn’t bother us. Then we started skiing as soon as we reached
    the top. The wind was strong, which is why we took a break at the chalet to warm up. When we came
    back, the sun had returned and the view was gorgeous. Thus we spent a lovely weekend outdoors and
    came home very happy.
