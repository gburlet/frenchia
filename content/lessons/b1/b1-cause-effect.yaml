sections:
- type: explanation
  id: explanation
  heading: '## Expressing Cause and Consequence (Exprimer la cause et la conséquence)'
  body: |-
    ***
    In B1 you’ll link two ideas – a cause and its result – with a handful of very common connectors. The structure is simple: **cause + connector + consequence** or **consequence + connector + cause**. The choice of connector depends on how strong or neutral the relationship is.

    | Connector | English equivalent | Typical use | Québec note |
    | ----------- | ------------------- | ------------ | ------------- |
    | **parce que** | because | neutral, factual | same everywhere |
    | **puisque** | since, because (because it’s obvious) | slightly more formal, often used when the cause is already known | same everywhere |
    | **à cause de** + noun | because of, due to | negative cause | same everywhere |
    | **grâce à** + noun | thanks to, because of (positive) | positive cause | same everywhere |
    | **donc** | so, therefore | introduces the result after a clause | same everywhere |
    | **c’est pourquoi** | that’s why | used after a full statement, often at the start of a new sentence | same everywhere |

    ### Forming the sentences
    1. **Connector introduces the cause** – a very natural order in spoken French.
       * **Parce qu'**il pleuvait, on est allés au cinéma au lieu de faire du vélo.
       * **À cause de** la neige, le vol a été **annulé**.
    2. **Connector introduces the result** – use **donc**, **c’est pourquoi**, **par conséquent**, **du coup**, **ainsi**, etc.
       * Le magasin était fermé, **donc** on a dû **aller** au supermarché du coin.
       * J’ai oublié mon portefeuille, **c’est pourquoi** je n’ai pas pu **payer**.

    ### Common pitfalls
    - **Mixing up *parce que* and *puisque*.** English speakers often use them interchangeably, but *puisque* implies the cause is already known or obvious. Use it only when you’re stating something that both speakers accept as a fact.
    - **Forgetting the preposition after *à cause* and *grâce*.** It’s always **à cause de** + noun, **grâce à** + noun. *À cause* alone or *grâce* without *à* sounds ungrammatical.
    - **Placing the connector after the verb in a way that leaves a dangling clause.** For example, *Il a plu parce que* is an incomplete fragment; the clause introduced by *parce que* must contain a full cause (e.g., *Il a plu parce qu'il faisait froid*).

    Practice by swapping the order of the clauses and choosing the connector that best fits the tone you want. Happy linking!***
