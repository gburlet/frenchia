- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: expressing cause and consequence'
  body: In everyday Québec speech the same causal connectors are used as in France, but a few lexical
    choices sound more natural in the province. For example, people often say *à cause de* followed by
    a noun phrase (e.g., *à cause de la neige*), whereas in France *à cause de* is also common but *en
    raison de* may be preferred in formal writing. The connector *puisque* is heard in both regions, but
    Québec speakers may favour it in spoken explanations (*puisque la panne d’électricité a duré…*). The
    word *souper* (dinner) appears in Québec examples, while in France the meal would be called *dîner*.
    Finally, *la fin de semaine* replaces the European *le week‑end* in Québec sentences, but the causal
    connectors themselves do not change.
  variants:
  - qc: souper
    fr: dîner
    en: supper/dinner
    formality: standard
  - qc: la fin de semaine
    fr: le week‑end
    en: the weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine au village
  passage_fr: Ce samedi, ma famille et moi avons décidé d’aller faire du ski de fond au parc du Mont‑Royal.
    **Parce qu’il faisait très froid**, nous avons mis nos vestes épaisses et nos bonnets en laine. **Grâce
    à la bonne météo**, la neige était parfaite et le sentier était bien damé. Nous sommes partis tôt,
    **puisque** le dépanneur du coin était déjà ouvert et nous avons pu acheter du sirop d’érable pour
    le goûter. **À cause de la circulation** sur la route du 15‑E, nous avons mis trente minutes de plus
    pour arriver, mais cela ne nous a pas dérangés. **Donc** nous avons commencé à skier dès que nous
    avons atteint le sommet. Le vent était fort, **c’est pourquoi** nous avons fait une pause au chalet
    pour nous réchauffer. **Lorsque** nous sommes revenus, le soleil était revenu et la vue était magnifique.
    **Ainsi**, nous avons passé une belle fin de semaine en plein air et nous sommes rentrés chez nous
    très contents.
  translation_en: This Saturday, my family and I decided to go cross‑country skiing in Mont‑Royal Park.
    Because it was very cold, we put on our thick jackets and woolen hats. Thanks to the good weather,
    the snow was perfect and the trail was well‑groomed. We left early, since the corner convenience store
    was already open and we could buy maple syrup for a snack. Because of the traffic on Highway 15‑E,
    we spent an extra thirty minutes getting there, but it didn’t bother us. So we started skiing as soon
    as we reached the top. The wind was strong, which is why we took a break at the chalet to warm up.
    When we came back, the sun had returned and the view was gorgeous. Thus we spent a lovely weekend
    outdoors and came home very happy.
