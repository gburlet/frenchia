- id: ex-09
  grammar_topics:
  - relative-dont-ou-lequel
  type: multiple_choice
  question: Which sentence uses the correct relative pronoun?
  options:
  - Le magasin de j’ai acheté les bleuets était fermé.
  - Le magasin où j’ai acheté les bleuets était fermé.
  - Le magasin qui j’ai acheté les bleuets était fermé.
  - Le magasin lequel j’ai acheté les bleuets était fermé.
  answer_index: 1
  explanation: In the clause *j’ai acheté les bleuets **au** magasin*, the noun *magasin* denotes the
    place where the purchase took place. When the antecedent refers to a location, the relative pronoun
    **où** is used. Therefore the correct sentence is **Le magasin où j’ai acheté les bleuets était fermé.**
    The other choices misuse **dont** (which replaces *de + nom* and would require a noun introduced by
    *de*), **qui** (a subject pronoun, not appropriate for a location), or **lequel** (which needs a preceding
    preposition, e.g., *dans lequel*). In both European and Québec French, **où** is the natural choice
    for a place-relative clause.
