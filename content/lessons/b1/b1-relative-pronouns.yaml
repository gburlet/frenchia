  heading: Les pronoms relatifs **dont**, **où**, et **lequel / laquelle** – B1
  examples:
  - fr: Voici le magasin **dont** je t’ai parlé hier; ils ont des croissants aux bleuets.
    en: Here’s the shop I told you about yesterday; they have blueberry croissants.
    region: common
  - fr: J’ai un voisin **dont** la fille joue du violon dans l’Orchestre symphonique de Québec.
    en: I have a neighbour whose daughter plays violin in the Québec Symphony Orchestra.
    region: common
  - fr: Le parc où nous aimons faire du vélo est fermé pour travaux jusqu’à la fin de la fin de semaine.
    en: The park where we like to bike is closed for construction until the end of the weekend.
    region: qc
  - fr: C’est le restaurant où j’ai goûté le meilleur poutine de la ville.
    en: That’s the restaurant where I tried the best poutine in town.
    region: qc
  - fr: Voici la série télévisée **laquelle** je regarde chaque soir après le souper.
    en: Here’s the TV series that I watch every evening after dinner.
    note: ‘laquelle’ is used because the antecedent is a feminine singular noun.
    region: common
  - fr: Les documents **lesquels** tu as imprimés sont sur le bureau du dépanneur.
    en: The documents that you printed are on the clerk’s desk.
    region: qc
  - fr: J’ai rencontré une amie **dont** le mari travaille à la Caisse.
    en: I met a friend whose husband works at the Caisse.
    region: common
  - fr: Le chalet où nous passerons la fin de semaine prochaine a une vue magnifique sur le fleuve Saint-Laurent.
    en: The cabin where we’ll spend next weekend has a wonderful view of the St. Lawrence River.
    region: qc
  - fr: Le film **lequel** nous avons vu hier était vraiment émouvant.
    en: The movie that we saw yesterday was really moving.
    note: ‘lequel’ replaces ‘film’ after a preposition‑free relative clause.
    region: common
  - fr: Voici la boulangerie **dont** les croissants sont toujours chauds le matin.
    en: Here’s the bakery whose croissants are always warm in the morning.
    region: common
- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: relative pronouns dont, où, lequel'
  body: 'In everyday Québec French the three pronouns work exactly as they do in France; the grammar rules
    are identical. The only noticeable difference is stylistic: Québécois speakers tend to avoid *lequel
    / laquelle* in spoken language, preferring *qui* or *que* when the antecedent is a person, and they
    often replace *lequel* with *celui‑ci / celle‑là* or simply repeat the noun. The preposition *de*
    with *dont* and the locative/time use of *où* are unchanged. Below are the most reliable variant pairs:'
  variants: []
- type: reading
  id: reading
  title: Un week‑end au Vieux‑Québec
  passage_fr: Ce samedi matin, je suis allé au marché du Vieux‑Québec pour acheter des produits frais.
    C’est le marché **dont** la réputation dépasse les frontières de la ville; on y trouve des fromages
    artisanaux, du sirop d’érable et des fruits de saison. En flânant entre les étals, j’ai rencontré
    une boulangère — **qui** préparait des croissants aux bleuets — et nous avons parlé du nouveau café
    **où** ils servent du café au lait de brebis. Elle m’a recommandé le café **lequel** est situé juste
    à côté du magasin de souvenirs. Après avoir goûté un croissant, je suis monté sur la terrasse du café,
    **où** la vue sur le fleuve Saint‑Laurent est spectaculaire. Le serveur m’a expliqué que le café utilise
    des grains **dont** la torréfaction est faite localement. En fin de journée, je suis rentré à mon
    hôtel, content d’avoir découvert un coin **dont** les habitants sont fiers. Le week‑end s’est terminé
    avec un petit concert dans le parc **où** les musiciens jouaient de la guitare et du violon.
  translation_en: That Saturday morning I went to the Old‑Quebec market to buy fresh produce. It’s the
    market **whose** reputation goes beyond the city’s borders; you can find artisanal cheeses, maple
    syrup and seasonal fruit there. While strolling between the stalls I met a baker — **who** was preparing
    blueberry croissants — and we talked about the new café **where** they serve sheep‑milk coffee. She
    recommended the café **which** is located right next to the souvenir shop. After tasting a croissant
    I went up onto the café’s terrace, **where** the view of the Saint‑Lawrence River is spectacular.
    The waiter explained that the café uses beans **whose** roasting is done locally. At the end of the
    day I returned to my hotel, happy to have discovered a place **whose** residents are proud of. The
    weekend ended with a small concert in the park **where** musicians were playing guitar and violin.
