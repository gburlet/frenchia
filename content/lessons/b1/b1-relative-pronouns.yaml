- type: regional_note
  id: regional-note
  heading: 'Québec vs. France : pronoms relatifs dont, où, lequel'
  body: In everyday Québec French the three relative pronouns work exactly as they do in France; the grammar
    rules are identical. The only difference is lexical – the same forms (*dont*, *où*, *lequel*, *laquelle*,
    etc.) are used. In very informal speech some speakers may omit the precise relative pronoun (e.g.,
    *le gars que je te parle* instead of *le gars dont je te parle*), but this is considered non-standard
    and is not a regular feature of Québec French.
  variants: []
- type: reading
  id: reading
  title: Une fin de semaine au Vieux-Québec
  passage_fr: Ce samedi matin, je suis allé au marché du Vieux-Québec pour acheter des produits frais.
    C’est le marché **dont** la réputation dépasse les frontières de la ville ; on y trouve des fromages
    artisanaux, du sirop d’érable et des fruits de saison. En flânant entre les étals, j’ai rencontré
    une boulangère — **qui** préparait des croissants aux bleuets — et nous avons parlé du nouveau café
    **où** ils servent du café au lait de brebis. Elle m’a recommandé le café **qui** est situé juste
    à côté du magasin de souvenirs. Après avoir goûté un croissant, je suis monté sur la terrasse du café,
    **où** la vue sur le fleuve Saint-Laurent est spectaculaire. Le serveur m’a expliqué que le café utilise
    des grains **dont** la torréfaction est faite localement. En fin de journée, je suis rentré à mon
    hôtel, content d’avoir découvert un coin **dont** les habitants sont fiers. La fin de semaine s’est
    terminée avec un petit concert dans le parc **où** les musiciens jouaient de la guitare et du violon.
  translation_en: That Saturday morning I went to the Old-Quebec market to buy fresh produce. It’s the
    market **whose** reputation goes beyond the city’s borders; you can find artisanal cheeses, maple
    syrup and seasonal fruit there. While strolling between the stalls I met a baker — **who** was preparing
    blueberry croissants — and we talked about the new café **where** they serve sheep-milk coffee. She
    recommended the café **that** is located right next to the souvenir shop. After tasting a croissant
    I went up onto the café’s terrace, **where** the view of the Saint-Lawrence River is spectacular.
    The waiter explained that the café uses beans **whose** roasting is done locally. At the end of the
    day I returned to my hotel, happy to have discovered a place **whose** residents are proud of. The
    weekend ended with a small concert in the park **where** the musicians were playing guitar and violin.
