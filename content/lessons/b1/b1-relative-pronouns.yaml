sections:
- type: explanation
  id: explanation
  heading: '## Les pronoms relatifs **dont**, **où**, et **lequel / laquelle**'
  body: 'In B1 you already know **qui** (subject) and **que** (direct object). Three other relative pronouns
    let you link ideas more precisely. 💡 All the French used below is appropriate for Québec French; where
    a European French form differs, the note mentions it. (For the purpose of this lesson, the Québec
    forms are the default.)  ---  ### 1️⃣ **dont** – ‘of which / whose / about which’  **dont** replaces
    a noun that is the object of the preposition **de** (or a verb that requires **de**). The preposition
    stays with **dont**, so you never repeat **de** after it.  - **Le livre dont je parle** – *the book
    I’m talking about* (not *le livre que je parle de*).  - **Une amie dont le frère vit à Montréal**
    – *a friend whose brother lives in Montreal*.  **Pitfall:** English speakers often try to keep the
    preposition after the relative clause (*… que je parle **de***). In French the **de** must be absorbed
    into **dont**.  ---  ### 2️⃣ **où** – ‘where / when’  Use **où** when the antecedent is a **place**
    or a **time**. It combines the preposition *à*/*en*/*dans* with the relative pronoun.  - **Le café
    où on se retrouve chaque fin de semaine** – *the café where we meet every weekend* (EU: *le café où
    on se retrouve chaque week-end*).  - **L’été où j’ai appris à magasiner** – *the summer when I learned
    to shop*.  **Pitfall:** Do not use **qui** or **que** with a location; the sentence would be ungrammatical
    (*… le café que on se retrouve*).  ---  ### 3️⃣ **lequel / laquelle** (and their contracted forms
    **auquel, à laquelle, auxquels, auxquelles, duquel, de laquelle, desquels, desquelles**) – ‘which
    / that’ after a preposition other than **de**  When the antecedent is preceded by a specific preposition
    (à, chez, avec, pour, sur, etc.) you must use **lequel** (masc.) or **laquelle** (fem.) and contract
    it when possible.  - **La chanson à laquelle je pense** – *the song I’m thinking of*.  - **Le projet
    auquel je travaille** – *the project I’m working on*.  - **Voici la table sur laquelle j’ai posé mes
    clés** – *here’s the table on which I placed my keys*.  **Note:** **duquel** (and **desquelles**)
    is used when the required preposition is **de** after a compound preposition, e.g., *près duquel*
    ‘near which’.  **Pitfall:** Learners often forget the contraction and say *à lequel*; the correct
    form is **auquel** (or **duquel** when the preposition is **de**).  ---  ### Quick recap  - **dont**
    = “de + …”.  - **où** = “place or time”.  - **lequel / laquelle** = any other preposition (à, chez,
    avec, pour, sur, etc.).  These pronouns let you build richer, more natural sentences such as:  > **« La
    boulangerie où j’achète mon pain, c’est celle dont le propriétaire est toujours souriant. »**  (Notice
    the use of **où** for the place and **dont** for the “owner’s” relationship.)'
