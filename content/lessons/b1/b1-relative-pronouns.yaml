sections:
- type: explanation
  id: explanation
  heading: '## Les pronoms relatifs **dont**, **où**, et **lequel / laquelle**'
  body: "In B1 you already know **qui** (subject) and **que** (direct object). Three other relative pronouns\
    \ let you link ideas more precisely.\n\n### 1️⃣ **dont** – ‘of which / whose / about which’\n**dont**\
    \ replaces a noun that is the object of the preposition **de** (or a verb that requires **de**). The\
    \ preposition stays with **dont**, so you never repeat **de** after it.\n- **Le livre dont je parle**\
    \ – *the book I’m talking about* (not *le livre que je parle de*). \n- **Une amie dont le frère vit\
    \ à Montréal** – *a friend whose brother lives in Montreal*.\n**Pitfall:** English speakers often\
    \ try to keep the preposition after the relative clause (*… que je parle **de***). In French the **de**\
    \ must be absorbed into **dont**.\n\n### 2️⃣ **où** – ‘where / when’\nUse **où** when the antecedent\
    \ is a **place** or a **time**. It combines the preposition *à*/*en*/*dans* with the relative pronoun.\n\
    - **Le café où on se retrouve chaque fin de semaine** – *the café where we meet every weekend*.\n\
    - **L’été où j’ai appris à magasiner** – *the summer when I learned to shop*.\n**Pitfall:** Do not\
    \ use **qui** or **que** with a location; the sentence would be ungrammatical (*… le café que on se\
    \ retrouve*).\n\n### 3️⃣ **lequel / laquelle** (and their contracted forms **auquel**, **duquel**,\
    \ **duquel**, **desquelles**, etc.) – ‘which / that’ after a preposition other than **de**.\nWhen\
    \ the antecedent is preceded by a specific preposition (à, chez, avec, pour, sur, etc.) you must use\
    \ **lequel** (masc.) or **laquelle** (fem.) and contract it when possible.\n- **Le magasin auquel\
    \ je vais chaque matin** – *the store I go to every morning* (EU: *le magasin où je vais*). \n- **La\
    \ chanson à laquelle je pense** – *the song I’m thinking of*.\n**Pitfall:** Learners often forget\
    \ the contraction and say *à lequel*; the correct form is **auquel**.\n\nRemember: **dont** = “de\
    \ + …”, **où** = “place or time”, **lequel/laquelle** = any other preposition. Mastering these will\
    \ let you build richer, more natural Québec‑style sentences like **« Le dépanneur où j’achète mon\
    \ café, c’est celui dont le propriétaire est toujours souriant. »**"
