- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: independent, main and subordinate clauses'
  body: 'The clause structure is the same in Québec French and in France. A **proposition principale**
    (main clause) is the clause that can stand on its own; a subordinate clause depends on it and is introduced
    by a conjunction such as *parce que*, *quand*, *si*, *après que*, *bien que*, *lorsque*, etc.  The
    punctuation rules are identical in both varieties:  • When the subordinate clause comes **before**
    the main clause, it is followed by a comma (e.g., *Quand il pleut, je reste à la maison*).  • When
    the subordinate clause comes **after** the main clause, no comma is used (e.g., *Je reste à la maison
    quand il pleut*).  The only regional difference you will see in the examples is the use of Québec-specific
    vocabulary such as **la fin de semaine** for “the weekend”.'
  variants:
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine au musée d’histoire locale
  passage_fr: Ce samedi, ma sœur et moi avons décidé de passer la fin de semaine au musée d’histoire locale
    de notre ville, qui se trouve à vingt minutes à pied du centre. **Nous sommes partis** tôt le matin,
    **et** nous avons pris le tramway jusqu’au quartier historique, parce que le trajet était agréable.
    **Quand nous sommes arrivés**, on nous a accueillis avec le parfum du café fraîchement moulu du petit
    café du musée. **Après avoir admiré** les expositions sur les premiers colons et les objets du quotidien,
    nous avons fait une petite promenade dans le jardin botanique attenant; **mais** il a commencé à pleuvoir,
    alors nous sommes rentrés rapidement à l’intérieur. **Nous avons joué** à un jeu de rôle éducatif
    pendant que le guide racontait des anecdotes, **et** nous avons profité de la pause café pour parler
    de nos projets. **Quand le temps s’est amélioré**, nous sommes allés faire du vélo sur la piste cyclable
    qui longe le fleuve. **Enfin**, avant de repartir, nous avons acheté un livret d’activités à **rapporter**
    à la maison, parce que c’est un souvenir intéressant que toute la famille aime.
  translation_en: This Saturday, my sister and I decided to spend the weekend at the local history museum
    in our town, which is a twenty-minute walk from downtown. We left early in the morning, and we took
    the tram to the historic quarter because the ride was pleasant. When we arrived, we were welcomed
    by the smell of freshly ground coffee from the museum’s little café. After admiring the exhibits on
    the first settlers and everyday objects, we took a short walk in the adjoining botanical garden; but
    it started to rain, so we quickly went back inside. We played an educational role-playing game while
    the guide told anecdotes, and we used the coffee break to talk about our plans. When the weather improved,
    we went cycling on the bike path that runs along the river. Finally, before leaving, we bought an
    activity booklet to bring home, because it’s an interesting souvenir that the whole family likes.
