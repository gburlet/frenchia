- type: reading
  id: reading
  title: Une fin de semaine à la cabane à sucre
  passage_fr: Ce samedi, ma sœur et moi avons décidé de passer la fin de semaine à la cabane à sucre de
    notre oncle, qui se trouve à deux heures de route de Montréal. **Nous partons** tôt le matin, **et**
    nous prenons le chemin le long du fleuve Saint‑Lawrence, parce que la vue est toujours magnifique.
    **Quand nous arrivons**, on nous accueille avec le parfum du sirop d’érable qui coule dans les casseroles.
    **Après avoir dégusté** des crêpes au beurre d’érable et du jambon, nous faisons une petite promenade
    dans les champs de sucre; **mais** il commence à pleuvoir, alors nous rentrons rapidement à l’intérieur.
    **Nous jouons** à des jeux de société pendant que le feu crépite dans la cheminée, **et** nous profitons
    de la chaleur pour parler de nos projets. **Si le temps s’améliore**, nous irons faire du patin à
    glace sur le petit lac gelé derrière la cabane. **Enfin**, avant de repartir, nous achetons un pot
    de sirop d’érable à ramener à la maison, parce que c’est un souvenir délicieux que toute la famille
    aime.
  translation_en: This Saturday, my sister and I decided to spend the weekend at our uncle’s sugar shack,
    which is two hours’ drive from Montreal. We leave early in the morning, and we take the road along
    the Saint‑Lawrence River because the view is always beautiful. When we arrive, we are welcomed by
    the scent of maple syrup boiling in the pans. After tasting maple‑butter pancakes and ham, we take
    a short walk in the sugar fields; but it starts to rain, so we quickly go back inside. We play board
    games while the fire crackles in the fireplace, and we use the warmth to talk about our plans. If
    the weather improves, we will go ice‑skating on the small frozen lake behind the shack. Finally, before
    leaving, we buy a jar of maple syrup to take home, because it’s a delicious souvenir that the whole
    family loves.
