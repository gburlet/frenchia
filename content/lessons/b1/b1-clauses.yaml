- type: reading
  id: reading
  title: Une fin de semaine à la cabane à sucre
  passage_fr: Ce samedi, ma sœur et moi avons décidé de passer la fin de semaine à la cabane à sucre de
    notre oncle, qui se trouve à deux heures de route de Montréal. **Nous sommes partis** tôt le matin,
    **et** nous avons pris le chemin le long du fleuve Saint-Laurent, parce que la vue était toujours
    magnifique. **Quand nous sommes arrivés**, on nous a accueillis avec le parfum du sirop d’érable qui
    coulait dans les casseroles. **Après avoir dégusté** des crêpes au beurre d’érable et du jambon, nous
    avons fait une petite promenade dans l’érablière; **mais** il a commencé à pleuvoir, alors nous sommes
    rentrés rapidement à l’intérieur. **Nous avons joué** à des jeux de société pendant que le feu crépitait
    dans la cheminée, **et** nous avons profité de la chaleur pour parler de nos projets. **Quand le temps
    s’est amélioré**, nous sommes allés faire du patin à glace sur le petit lac gelé derrière la cabane.
    **Enfin**, avant de repartir, nous avons acheté un pot de sirop d’érable à **rapporter** à la maison,
    parce que c’est un souvenir délicieux que toute la famille aime.
  translation_en: This Saturday, my sister and I decided to spend the weekend at our uncle’s sugar shack,
    which is two hours’ drive from Montreal. We left early in the morning, and we took the road along
    the Saint-Laurent River because the view was always beautiful. When we arrived, we were welcomed by
    the scent of maple syrup boiling in the pans. After tasting maple-butter pancakes and ham, we took
    a short walk in the sugar-making area; but it started to rain, so we quickly went back inside. We
    played board games while the fire crackled in the fireplace, and we used the warmth to talk about
    our plans. When the weather improved, we went ice-skating on the small frozen lake behind the shack.
    Finally, before leaving, we bought a jar of maple syrup to bring home, because it’s a delicious souvenir
    that the whole family loves.
