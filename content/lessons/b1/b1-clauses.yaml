- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: independent, main and subordinate clauses'
  body: |-
    In everyday Québec speech the same grammatical categories are used as in France; the difference lies mainly in the vocabulary that fills the clauses. Québécois speakers often prefer words like *déjeuner* for breakfast, *dîner* for lunch, *souper* for the evening meal, *fin de semaine* for weekend, *magasiner* for shopping, and *dépanneur* for a corner store. The way clauses are linked (et, mais, parce que, quand, si, après que, bien que, lorsque, etc.) is identical in both varieties. Consequently, the lesson’s focus on clause types does not change, but the examples you will see in Québec-French texts will contain the regional lexicon listed below.

    **Québec / France / English variants**
    1. *déjeuner* (Q) – *petit-déjeuner* (F) – breakfast
    2. *dîner* (Q) – *déjeuner* (F) – lunch
    3. *souper* (Q) – *dîner* (F) – dinner/supper
    4. *fin de semaine* (Q) – *week-end* (F) – weekend
    5. *magasiner* (Q) – *faire du shopping* (F) – to shop
    6. *dépanneur* (Q) – *épicerie de quartier* (F) – corner store

    When you write or speak in Québec French, simply insert these local words into your independent, main or subordinate clauses; the grammar stays the same.
