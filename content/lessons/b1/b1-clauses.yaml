sections:
- type: explanation
  id: explanation
  heading: Propositions indépendantes, principales et subordonnées
  body: "***\n### How to combine ideas with independent, main, and subordinate clauses (B1)\n\nIn Québec\
    \ French, as in any variety of French, a **proposition indépendante** (independent clause) can stand\
    \ alone: it has its own subject and verb and expresses a complete thought.  \n**Example:** **« Je\
    \ vais au dépanneur. »** – *I’m going to the corner store.*\n\nWhen you join two independent clauses,\
    \ you create a **proposition principale** (main clause) plus a second clause linked by a coordinating\
    \ conjunction (et, mais, ou, donc, or, ni, car). The first clause is usually considered the *principal*\
    \ because it carries the main information; the second is often called the *coordinated* clause, but\
    \ it is still independent.  \n**Example:** **« Je prépare le souper, **et** ma sœur met la table. »**\
    \ – *I’m preparing dinner, and my sister is setting the table.*\n\nA **proposition subordonnée** (subordinate\
    \ clause) cannot stand alone; it depends on a main clause and is introduced by a **conjonction de\
    \ subordination** (parce que, quand, si, bien que, etc.). The verb in the subordinate clause is placed\
    \ after the conjunction, and the whole clause can appear before or after the main clause.  \n**Example:**\
    \ **« Parce qu’il pleut, on restera à la maison. »** – *Because it’s raining, we’ll stay home.*\n\n\
    #### Common pitfalls for English speakers\n1. **Word order after the conjunction** – In English the\
    \ verb often follows the conjunction immediately (\"because it **is** raining\"). In French, the verb\
    \ stays **after** the subject: **« parce qu’il **pleut** »**, not *« parce que pleut il »*.\n2. **Comma\
    \ placement** – When the subordinate clause comes **first**, a comma separates it from the main clause;\
    \ when it follows, the comma is optional but often omitted in spoken Québec French.  \n   - **« Quand\
    \ il arrivera, on mangera. »** (comma) vs. **« On mangera quand il arrivera. »** (no comma needed).\n\
    \nRemember: independent clauses can stand alone; main clauses are the backbone of a sentence, and\
    \ subordinate clauses add nuance. Mastering their order and punctuation will let you build richer,\
    \ more natural Québec‑style sentences.\n***"
