sections:
- type: explanation
  id: explanation
  heading: Propositions indépendantes, principales et subordonnées
  body: 'How to combine ideas with independent, main, and subordinate clauses (B1) In Québec French, as
    in any variety of French, a **proposition indépendante** (independent clause) can stand alone: it
    has its own subject and verb and expresses a complete thought. **Example:** « Je vais au dépanneur. »
    – *I’m going to the corner store.* When two independent clauses are linked with a coordinating conjunction
    (et, mais, ou, donc, or, ni, car), each clause remains independent; they are called **propositions
    coordonnées**. **Example:** « Je prépare le souper, **et** ma sœur met la table. » – *I’m preparing
    supper, and my sister is setting the table.* A **proposition subordonnée** (subordinate clause) cannot
    stand alone; it depends on a main clause and is introduced by a **conjonction de subordination** (parce
    que, quand, si, bien que, avant que, etc.). **Example:** « Parce qu’il pleut, on restera à la maison. »
    – *Because it’s raining, we’ll stay home.* #### Common pitfalls for English speakers 1. **Missing
    subject after the conjunction** – Learners often omit the subject when the clause begins with a conjunction,
    saying « parce que pleut » instead of the correct « parce qu’il pleut ». 2. **Subjunctive after certain
    conjunctions** – After *bien que* or *avant que*, the verb must be in the subjunctive: « Bien qu’il
    **soit** tard, je travaille. » – *Although it is late, I’m working.* 3. **Comma placement** – When
    the subordinate clause precedes the main clause, a comma separates them; when it follows, the comma
    is optional and often omitted in spoken Québec French. - « Quand il arrivera, on mangera. » (comma)
    vs. « On mangera quand il arrivera. » (no comma). 4. **Conditional sentences with *si*** – In a conditional
    sentence, *si* can be followed by the present (or the imperfect) and the result clause uses either
    the future (or imperative) or the conditional, depending on the tense of the *si*-clause: - *si* +
    present → future (or imperative): **« Si j’ai le temps, j’irai au cinéma. »** – *If I have time, I’ll
    go to the movies.* - *si* + imperfect → conditional: **« Si j’avais le temps, j’irais au cinéma. »**
    – *If I had time, I would go to the movies.* Remember: independent clauses can stand alone; coordinated
    clauses are both independent, and subordinate clauses add nuance. Mastering their order and punctuation
    will let you build richer, more natural Québec-style sentences.'
