- type: explanation
  id: explanation
  heading: Le plus-que-parfait
  body: '***<br/>### Forming the plus-que-parfait<br/>The plus-que-parfait expresses an action that **had
    already happened** before another past event. It is built with the **imparfait** of the auxiliary
    verb *avoir* or *être* + the **past participle** of the main verb.<br/><br/>| Subject | Imparfait
    of *avoir* | Imparfait of *être* |<br/>|---------|----------------------|----------------------|<br/>|
    je      | **avais**            | **étais**            |<br/>| tu      | **avais**            | **étais**            |<br/>|
    il/elle | **avait**            | **était**            |<br/>| nous    | **avions**           | **étions**           |<br/>|
    vous    | **aviez**            | **étiez**            |<br/>| ils/elles| **avaient**         | **étaient**          |<br/><br/>**Example**:
    *Quand il est arrivé, j''**avais déjà fini** mon souper.* – “When he arrived, I had already finished
    my supper.”<br/><br/>### When to use it<br/>- To set the chronological order of two past events: the
    plus-que-parfait marks the earlier one, the passé composé (or imparfait) marks the later one.<br/>-
    In reported speech that refers to a past statement: *Elle a dit qu''elle **avait acheté** du sirop
    d''érable.*<br/><br/>### Quebec-specific flavor<br/>In Quebec, you’ll often hear *souper* for the
    evening meal and *fin de semaine* for “weekend.” The tense works the same: *Avant la fin de semaine,
    ils **avaient déjà magasiné** au centre d''achats.* (In France you would say *faire les magasins*
    or *aller au centre commercial*.)<br/><br/>### Common pitfalls for English speakers<br/>1. **Choosing
    the wrong auxiliary** – Like the passé composé, the plus-que-parfait uses *être* with verbs of motion
    or reflexive verbs (*aller, venir, arriver, se lever*). Forgetting this leads to *j''avais allé* instead
    of *j''étais allé*.<br/>2. **Confusing with the imparfait** – The imparfait describes a background
    state or habit, not a completed action that preceded another. *Je mangeais* (I was eating) vs. *J''avais
    mangé* (I had eaten).<br/><br/>Practice by pairing two past sentences and converting the earlier one
    to the plus-que-parfait. Happy conjugating!<br/>***'
