- type: reading
  id: reading
  title: Une soirée au chalet
  passage_fr: "Le vendredi soir, avant que la tempête de neige n’arrive, **nous avions déjà préparé**\
    \ le souper. Ma sœur avait acheté du sirop d’érable au dépanneur, et mon frère **était parti** chercher\
    \ du bois de chauffage. Pendant que le vent **soufflait** fort, ma mère **avait mis** la table avec\
    \ des assiettes en porcelaine que ma grand‑père **avait gardées** depuis son enfance. \n\nQuand la\
    \ première rafale a frappé le toit du chalet, **j’avais déjà allumé** le feu dans la cheminée. Nous\
    \ **avions sorti** les couvertures en laine et **étions installés** près du poêle. Le soir, pendant\
    \ que la neige **couvrissait** le paysage, nous **avions raconté** des histoires de nos grands‑parents.\
    \ Mon oncle, qui **était revenu** d’un voyage à Montréal, **avait apporté** des crêpes au sucre d’érable.\
    \ \n\nÀ minuit, la tempête **avait cessé** et nous **avions fini** le dessert en riant de nos souvenirs.\
    \ C’était une soirée simple, mais **nous avions senti** la chaleur de la famille, même quand le vent\
    \ hurlait dehors."
  translation_en: |-
    Friday evening, before the snowstorm arrived, we had already prepared dinner. My sister had bought maple syrup at the corner store, and my brother had gone to fetch firewood. While the wind was blowing hard, my mother had set the table with porcelain plates that my grandfather had kept since his childhood.

    When the first gust hit the chalet’s roof, I had already lit the fire in the fireplace. We had taken out the wool blankets and were settled near the stove. That night, while the snow was covering the landscape, we told stories about our grandparents. My uncle, who had just returned from a trip to Montreal, had brought maple‑sugar pancakes.

    At midnight, the storm had stopped and we had finished dessert laughing about our memories. It was a simple evening, but we had felt the warmth of family, even while the wind howled outside.
