- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the plus‑que‑parfait'
  body: |-
    In both Québec and France the plus‑que‑parfait functions the same grammatical role – it marks an action that was already completed when another past event occurred. The main difference is stylistic: Québécois speakers tend to reserve the plus‑que‑parfait for written or formal contexts (news reports, literature, formal emails). In everyday spoken Québec French, speakers often replace it with the passé composé or the imparfait plus a time‑marker (e.g., *j’avais déjà fini* → *j’ai déjà fini*). Otherwise the formation and agreement rules are identical.

    **Typical Québec/France/English variants**
    1. *déjeuner* (Québec = breakfast, France = lunch) – “J’avais déjà **déjeuné** avant de partir.”
    2. *souper* (Québec = dinner, France = supper) – “Nous avions **souper** quand il a appelé.”
    3. *fin de semaine* (Québec) vs. *week‑end* (France) – “Elle était partie la **fin de semaine** précédente.”
    4. *magasiner* (Québec) vs. *faire du shopping* (France) – “J’avais **magasiné** avant la fermeture.”
    5. *dépanneur* (Québec) vs. *épicerie de quartier* (France) – “Il avait acheté du lait au **dépanneur**.”
    6. *arriver* with *être* – same in both regions, but Québec speakers may say “J’étais déjà **arrivé** au parc” in a narrative rather than a conversation.

    Overall, the plus‑que‑parfait itself does not change; only the surrounding vocabulary and the frequency of use differ between Québec and France.
