  type: multiple_choice
  question: Choose the sentence that correctly forms the plus-que-parfait with the verb *partir* (which
    uses *être* as its auxiliary).
  options:
  - Il avait parti avant que le train ne parte.
  - Il était parti avant que le train ne partait.
  - Il était parti avant que le train ne parte.
  - Il était parti avant que le train ne part.
  answer_index: 2
  explanation: '*Partir* takes *être* in compound tenses, so the plus-que-parfait is *était parti*. The
    subordinate clause after *avant que* must be in the subjunctive; the correct subjunctive of *partir*
    is *parte*. Option C therefore is correct: *Il était parti avant que le train ne parte.* Options A
    uses the wrong auxiliary (*avoir*), B has the wrong subjunctive form (*partait* is imperfect indicative),
    and D uses the indicative (*part*) instead of the subjunctive.'
