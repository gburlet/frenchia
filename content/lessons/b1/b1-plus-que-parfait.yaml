- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the plus-que-parfait'
  body: 'In both Québec and France the plus-que-parfait functions the same grammatical role – it marks
    an action that was already completed when another past event occurred. The formation and agreement
    rules are identical, and speakers in both regions use the tense in the same way. The main difference
    is lexical: Québec French uses its own vocabulary (e.g., *déjeuner* for breakfast, *souper* for supper)
    while European French uses different words for the same concepts. Otherwise, the plus-que-parfait
    is used in both spoken and written language without a systematic shift to the passé composé.'
