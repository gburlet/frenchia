- type: explanation
  id: explanation
  heading: Le plus-que-parfait
  body: |-
    ***
    ### Forming the plus-que-parfait
    The plus-que-parfait expresses an action that **had already happened** before another past event. It is built with the **imparfait** of the auxiliary verb *avoir* or *être* + the **past participle** of the main verb.

    | Subject | Imparfait of *avoir* | Imparfait of *être* |
    | --------- | ---------------------- | ---------------------- |
    | je      | **avais**            | **étais**            |
    | tu      | **avais**            | **étais**            |
    | il/elle | **avait**            | **était**            |
    | nous    | **avions**           | **étions**           |
    | vous    | **aviez**            | **étiez**            |
    | ils/elles| **avaient**         | **étaient**          |

    **Example**: *Quand il est arrivé, j'**avais déjà fini** mon souper.* – “When he arrived, I had already finished my supper.”

    ### When to use it
    - To set the chronological order of two past events: the plus-que-parfait marks the earlier one, the passé composé (or imparfait) marks the later one.
    - In reported speech that refers to a past statement: *Elle a dit qu'elle **avait acheté** des billets.*

    ### Common pitfalls for English speakers
    1. **Choosing the wrong auxiliary** – Like the passé composé, the plus-que-parfait uses *être* with verbs of motion or reflexive verbs (*aller, venir, arriver, se lever*). Forgetting this leads to *j'avais allé* instead of *j'étais allé*.
    2. **Confusing with the imparfait** – The imparfait describes a background state or habit, not a completed action that preceded another. *Je mangeais* (I was eating) vs. *J'avais mangé* (I had eaten).

    Practice by pairing two past sentences and converting the earlier one to the plus-que-parfait. Happy conjugating!
    ***
