- type: reading
  id: reading
  title: Une soirée au chalet
  passage_fr: |-
    Le vendredi soir, avant que la tempête de neige n’arrive, nous avions déjà préparé le souper. Ma sœur a acheté du sirop d’érable au dépanneur, et mon frère est parti chercher du bois de chauffage. Pendant que le vent soufflait fort, ma mère a mis la table avec des assiettes en porcelaine que mon grand-père gardait depuis son enfance.

    Quand la première rafale a frappé le toit du chalet, j’avais déjà allumé le feu dans la cheminée. Nous avons sorti les couvertures en laine et nous nous sommes installés près du poêle. Le soir, pendant que la neige couvrait le paysage, nous avons raconté des histoires de nos grands-parents. Mon oncle, qui était revenu d’un voyage à Montréal, a apporté des crêpes au sucre d’érable.

    À minuit, la tempête était arrêtée et nous avons fini le dessert en riant de nos souvenirs. C’était une soirée simple, mais nous avons senti la chaleur de la famille, même quand le vent hurlait dehors.
  translation_en: |-
    Friday evening, before the snowstorm arrived, we had already prepared supper. My sister bought maple syrup at the corner store, and my brother went to fetch firewood. While the wind was blowing hard, my mother set the table with porcelain plates that my grandfather kept from his childhood.

    When the first gust hit the chalet’s roof, I had already lit the fire in the fireplace. We took out the wool blankets and settled near the stove. That night, while the snow was covering the landscape, we told stories about our grandparents. My uncle, who had just returned from a trip to Montreal, brought maple-sugar pancakes.

    At midnight, the storm had stopped and we finished dessert laughing about our memories. It was a simple evening, but we felt the warmth of family, even while the wind howled outside.
