- type: reading
  id: reading
  title: Une soirée à la maison
  passage_fr: |-
    Le vendredi soir, avant que la forte pluie n’arrive, nous avions déjà préparé le souper. Ma sœur a acheté du pain frais à l’épicerie du quartier, et mon frère est parti chercher du bois de chauffage. Pendant que le vent soufflait fort, ma mère a mis la table avec des assiettes en porcelaine que mon grand-père gardait depuis son enfance.

    Quand la première averse a frappé les fenêtres, j’avais déjà allumé le feu dans la cheminée. Nous avons sorti les couvertures en laine et nous nous sommes installés près du poêle. Le soir, pendant que la pluie recouvrait le jardin, nous avons raconté des histoires de nos grands-parents. Mon oncle, qui était revenu d’un voyage à Québec, a apporté une tarte aux pommes.

    À minuit, la pluie s'était arrêtée et nous avons fini le dessert en riant de nos souvenirs. C’était une soirée simple, mais nous avons senti la chaleur de la famille, même quand le vent hurlait dehors.
  translation_en: |-
    Friday evening, before the heavy rain arrived, we had already prepared supper. My sister bought fresh bread at the neighborhood grocery, and my brother went to fetch firewood. While the wind was blowing hard, my mother set the table with porcelain plates that my grandfather had kept since his childhood.

    When the first downpour hit the windows, I had already lit the fire in the fireplace. We took out the wool blankets and settled near the stove. That night, while the rain covered the garden, we told stories about our grandparents. My uncle, who had just returned from a trip to Quebec City, brought an apple pie.

    At midnight, the rain had stopped and we finished dessert laughing about our memories. It was a simple evening, but we felt the warmth of the family, even while the wind howled outside.
