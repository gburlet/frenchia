sections:
- type: explanation
  id: explanation
  heading: Futur simple ou conditionnel ? (Future Simple vs. Conditional)
  body: "### Forming the two tenses\n| Verb | Futur simple (‑rai) | Conditionnel présent (‑rais) |\n|------|-------------------|------------------------------|\n\
    | parler | **je parler****ai** | **je parler****ais** |\n| finir | **je finir****ai** | **je finir****ais**\
    \ |\n| vendre | **je vendr****ai** | **je vendr****ais** |\n\nBoth tenses are built from the **infinitive**\
    \ (or the irregular stem for verbs like *être → ser‑*). Add the endings **‑ai, ‑as, ‑a, ‑ons, ‑ez,\
    \ ‑ont** for the futur simple and **‑ais, ‑ais, ‑ait, ‑ions, ‑iez, ‑aient** for the conditional. In\
    \ Québec French the forms are exactly the same as in France; the only lexical differences appear in\
    \ the examples.\n\n### When to use each tense\n- **Futur simple** expresses a real or very likely\
    \ future event: \n  - **Demain, je passerai au dépanneur** (Tomorrow I’ll stop by the corner store).\n\
    - **Conditionnel présent** shows a hypothetical situation, a polite request, or a future‑in‑the‑past:\n\
    \  - **Si j’avais plus de temps, je voyagerais** (If I had more time, I would travel).\n  - **Pourriez‑vous\
    \ me prêter un stylo, s’il vous plaît?** (Could you lend me a pen?)\n  - **Il a dit qu’il arriverait\
    \ à 19 h** (He said he would arrive at 7 p.m.).\n\n### Common pitfalls for English speakers\n1. **Mix‑up\
    \ of endings** – Because English *‑will* and *‑would* sound similar, learners often write *je parlerais*\
    \ when they mean *I will speak*. Remember the **‑rai** ending is the future, **‑rais** is the conditional.\n\
    2. **Future‑in‑the‑past confusion** – In English, *would* can also mean a repeated past habit. In\
    \ French, that meaning uses the **imparfait** (*je mangeais*). Use the conditional only for a future\
    \ event that is dependent on another past statement.\n\n### Quick tip\nIf you can replace the verb\
    \ with **« aller + infinitif »** (e.g., *je vais parler*), you need the **futur simple**. If the sentence\
    \ begins with *si* (unless the *si*‑clause itself is in the future), you need the **conditionnel**.\n\
    \nKeep practicing with everyday Québec contexts—*déjeuner*, *dîner*, *souper*, *fin de semaine*—and\
    \ the distinction will become second nature."
