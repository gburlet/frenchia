sections:
- type: explanation
  id: explanation
  heading: Futur simple ou conditionnel ? (Future Simple vs. Conditional)
  body: |-
    ### Forming the two tenses
    | Verb | Futur simple (-rai) | Conditionnel présent (-rais) |
    | ------ | ------------------- | ------------------------------ |
    | parler | **je parler****ai** | **je parler****ais** |
    | finir | **je finir****ai** | **je finir****ais** |
    | vendre | **je vendr****ai** | **je vendr****ais** |

    Both tenses are built from the **infinitive** (or the irregular stem for verbs like *être → ser-*). Add the endings **-ai, -as, -a, -ons, -ez, -ont** for the futur simple and **-ais, -ais, -ait, -ions, -iez, -aient** for the conditional. In Québec French the forms are exactly the same as in France; the only lexical differences appear in the examples.

    ### When to use each tense
    - **Futur simple** expresses a real or very likely future event:
      - **Demain, je passerai à la bibliothèque** (Tomorrow I’ll stop by the library).
    - **Conditionnel présent** shows a hypothetical situation, a polite request, or a future-in-the-past:
      - **Si j’avais plus de temps, je ferais du bénévolat** (If I had more time, I would volunteer).
      - **Pourriez-vous me prêter votre chargeur, s’il vous plaît ?** (Could you lend me your charger?)
      - **Il a dit qu’il arriverait à 19 h** (He said he would arrive at 7 p.m.).

    ### Common pitfalls for English speakers
    1. **Mix-up of endings** – Because English *-will* and *-would* sound similar, learners often write *je parlerais* when they mean *I will speak*. Remember the **-rai** ending is the future, **-rais** is the conditional.
    2. **Future-in-the-past confusion** – In English, *would* can also mean a repeated past habit. In French, that meaning uses the **imparfait** (*je mangeais*). Use the conditional only for a future event that is dependent on another past statement.

    ### Quick tip
    If you can replace the verb with **« aller + infinitif »** (e.g., *je vais parler*), you need the **futur simple**. If the sentence begins with *si* and the *si-clause* is in the **present**, the main clause takes **futur simple** (si tu viens, je partirai). If the *si-clause* is in the **imparfait**, the main clause takes **conditionnel présent** (si tu venais, je partirais).

    Keep practicing with everyday situations—talking about work meetings, family plans, travel itineraries, or hobbies—and the distinction will become second nature.
- type: table
  id: table
  heading: Futur simple ou conditionnel ? – B1 (Québec French)
  columns:
  - When to use le futur simple
  - When to use le conditionnel présent
  - Typical cue words / expressions
  rows:
  - - A future fact that the speaker sees as certain. The event is presented as real and will happen.
    - si + présent → futur simple (e.g., *si tu viens, je partirai*)
    - demain, bientôt, plus tard, dans deux jours, l’an prochain, quand + futur
  - - A hypothetical or non-real situation, a polite request, a wish, or a future that depends on an unfulfilled
      condition.
    - si + imparfait → conditionnel présent (e.g., *si tu venais, je partirais*)
    - si + imparfait, au cas où, j’aimerais…, serait-il possible…, pourriez-vous…
  caption: Use le futur simple for sure futures (e.g., *Je partirai demain*). Use le conditionnel présent
    for possibilities, wishes, or polite requests (e.g., *Je partirais demain si j’avais le temps*).
- type: examples
  id: examples
  heading: Futur simple ou conditionnel ? – B1 (Québec French)
  examples:
  - fr: Demain, j’**irai** à la bibliothèque pour emprunter un roman.
    en: Tomorrow, I will go to the library to borrow a novel.
    region: common
  - fr: Si tu viens à la réunion ce soir, tu **pourras** rester jusqu’à la fin de la soirée.
    en: If you come to the meeting tonight, you will be able to stay until the end of the evening.
    note: si + présent → futur simple (the main clause uses the futur simple to express a future result
      that depends on the condition).
    region: common
  - fr: Nous **souperons** chez nos voisins samedi soir.
    en: We will have supper at our neighbours’ house Saturday night.
    note: « souper » is the Québec term for the evening meal; in European French the same idea is expressed
      with « dîner ».
    region: common
  - fr: Je **magasinerais** au centre commercial si j’avais plus de temps.
    en: I would go shopping at the mall if I had more time.
    note: Conditional used after an unreal condition (si + imparfait).
    region: common
  - fr: Le train **partira** à huit heures, alors ne sois pas en retard.
    en: The train will leave at eight o’clock, so don’t be late.
    region: common
  - fr: Si le temps était plus doux, nous **irions** faire du ski de fond.
    en: If the weather were milder, we would go cross-country skiing.
    note: Conditional in the main clause after a hypothetical condition.
    region: common
  - fr: Quand tu **recevras** ton nouveau permis, tu pourras conduire sans accompagnateur.
    en: When you receive your new licence, you will be able to drive without a supervisor.
    note: The verb in the main clause (recevras) is in the futur simple because the clause expresses a
      real future event; the conditional is not used after « quand » for real futures.
    region: common
  - fr: J’**aimerais** bien visiter le Vieux-Québec cet été, mais j’ai trop de travail.
    en: I would like to visit Old Quebec this summer, but I have too much work.
    note: Polite wish expressed with the conditional.
    region: common
  - fr: Ce soir, je **regarderai** un film et tu **pourras** mettre la table.
    en: Tonight I will watch a film and you can set the table.
    region: common
  - fr: Si vous **étiez** prêts, nous commencerions la réunion immédiatement.
    en: If you were ready, we would start the meeting right away.
    note: Conditional in the main clause after si + imparfait.
    region: common
- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Futur simple & conditionnel'
  body: In everyday speech the two tenses work exactly the same in Québec as they do in France – the same
    endings and the same rule that the futur simple expresses a real future and the conditionnel a hypothetical
    or polite situation. The grammatical distinction between futur simple and conditionnel is therefore
    identical in both varieties; only the surrounding vocabulary can differ (e.g., Québec uses *déjeuner*
    for “breakfast”, *dîner* for “lunch”, *souper* for “supper”, and *fin de semaine* for “week-end*).
    The conditional remains the polite form for requests (e.g., *pourriez-vous…*), just as in France.
  variants: []
- type: reading
  id: reading
  title: Un samedi en ville
  passage_fr: |-
    Ce samedi, j'irai à la petite ville de Saint-Jean pour magasiner. Le matin, je prendrai mon **déjeuner** au café du coin, où ils servent du pain grillé avec du beurre d’arachide. Après, je visiterai le marché public ; on y trouvera des pommes, du fromage et des fruits à bon prix.

    Si le temps est doux, je ferai une promenade le long de la rivière avant de rentrer chez moi. Sinon, je prendrai le bus et je reviendrai à la maison pour préparer le **souper**.

    Ma sœur m’a dit qu’elle viendrait nous rejoindre si elle finissait son quart de travail plus tôt. Elle aimerait bien goûter les spécialités du boucher du quartier.

    Le soir, nous **souperons** tous ensemble et nous regarderons la télé. J’espère que le programme sera intéressant, parce que j’ai hâte de passer un bon moment en famille.
  translation_en: |-
    This Saturday, I will go to the small town of Saint-Jean to do some shopping. In the morning I will have my breakfast at the local café, where they serve toasted bread with peanut butter. Afterwards I will visit the public market; there will be apples, cheese and fruit at a good price.

    If the weather is mild, I will take a walk along the river before heading home. If not, I will take the bus and I will come back home to prepare supper.

    My sister told me that she would join us if she finished her shift earlier. She would like to taste the butcher’s specialties.

    In the evening we will all have supper together and we will watch TV. I hope the programme will be interesting, because I’m looking forward to spending a nice time with the family.
