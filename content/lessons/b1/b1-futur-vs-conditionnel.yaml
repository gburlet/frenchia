- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Futur simple & conditionnel'
  body: |-
    In everyday Québec speech the two tenses work exactly as they do in France – the same endings and the same rule that the futur simple expresses a real future and the conditionnel a hypothetical or polite situation. The main difference is lexical, not grammatical. Québec speakers will often use *déjeuner* for “breakfast”, *dîner* for “lunch”, and *souper* for “dinner”, whereas in France those words refer to the first, second and third meals of the day. Likewise, Québec prefers *fin de semaine* for “week‑end”, and the verb *magasiner* (or the Anglicism *shopping*) for “to shop”. The conditional is also the polite form for requests (e.g., *pourriez‑vous…*), just as in France.

    **Variants**
    1. Québec : *déjeuner* = breakfast France : *petit‑déjeuner* / *déjeuner* = lunch
    2. Québec : *dîner* = lunch France : *déjeuner* = lunch
    3. Québec : *souper* = dinner France : *dîner* = dinner
    4. Québec : *fin de semaine* France : *week‑end*
    5. Québec : *magasiner* / *shopping* France : *faire du shopping* / *faire les magasins*
    6. Québec : *pourriez‑vous* (polite request) France : same form, same use

    The grammatical distinction between futur simple and conditionnel is therefore identical in both varieties; only the surrounding vocabulary changes.
