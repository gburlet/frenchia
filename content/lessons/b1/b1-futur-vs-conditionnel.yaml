  type: multiple_choice
  question: Which verb form correctly completes the sentence? « Quand tu ______ ton permis de conduire,
    tu pourras louer une voiture. »
  options:
  - recevras
  - recevrais
  - recevra
  - recevrait
  answer_index: 0
  explanation: The clause introduced by *quand* refers to a real future event. After *quand* we therefore
    use the **futur simple**. The correct form is **recevras** (future of *recevoir*). **Recevrais** is
    the conditional; it is used in the main clause of a hypothetical sentence introduced by *si* + imparfait
    (e.g., *Si tu recevais ton permis, tu pourrais louer une voiture*), not after *quand* for a factual
    future reference.
