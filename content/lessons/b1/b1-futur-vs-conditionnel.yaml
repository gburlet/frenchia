- type: reading
  id: reading
  title: Un samedi à la petite ville
  passage_fr: |-
    Ce samedi, je **irai** à la petite ville de Saint‑Jean pour faire du shopping. Le matin, je **prendrai** mon petit‑déjeuner au café du coin, où ils servent du pain grillé avec du beurre d’arachide. Après, je **visiterai** le marché public ; il y aura des pommes de terre, du fromage en crottes et du sirop d’érable à bon prix.

    Si le temps **est** doux, je **ferai** une promenade le long de la rivière avant de rentrer chez moi. Sinon, je **prendrai** le bus et je **reviendrai** à la maison pour préparer le souper.

    Ma sœur m’a dit qu’elle **viendrait** nous rejoindre si elle **finissait** son quart de travail plus tôt. Elle **aimerait** bien goûter le pâté à la viande du boucher du dépanneur.

    Le soir, nous **dînerons** tous ensemble et nous **regarderons** le match de hockey à la télé. J’espère que le jeu **sera** serré, parce que j’ai hâte de crier « Allez les Canadiens ! ».
  translation_en: |-
    This Saturday, I will go to the small town of Saint‑Jean to do some shopping. In the morning I will have my breakfast at the local café, where they serve toasted bread with peanut butter. Afterwards I will visit the public market; there will be potatoes, curd cheese and maple syrup at a good price.

    If the weather is mild, I will take a walk along the river before heading home. If not, I will take the bus and I will come back home to prepare dinner.

    My sister told me that she would join us if she finished her shift earlier. She would like to taste the meat pie from the butcher at the corner store.

    In the evening we will all have supper together and we will watch the hockey game on TV. I hope the game will be close, because I can’t wait to shout “Go the Canadiens!”.
