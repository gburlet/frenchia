sections:
- type: explanation
  id: explanation
  heading: Les conjonctions de temps
  body: '***  ### Les conjonctions de temps (B1)  **  Temporal conjunctions link two actions that happen
    at different moments. In Québec French the forms are the same as in European French, but keep in mind
    the usual word order and the mood of the verb that follows.  **  | Conjunction | Meaning | Verb mood
    after the conjunction | |-------------|---------|---------------------------------| | **dès que**
    | as soon as | **indicative** (the action is certain) | | **aussitôt que** | as soon as, immediately
    after | **indicative** | | **avant que** | before (different subjects) | **subjunctive** | | **avant
    de** | before (same subject) | **infinitive** | | **après que** | after | **indicative** | | **pendant
    que** | while | **indicative** |  **#### How to use them**  1. **dès que / aussitôt que** – place
    the conjunction at the start of the clause that expresses the later event. The verb is in the indicative
    because the event is expected to happen.   - **Dès que j’ai fini mon travail, je prépare le souper.**   -
    **Aussitôt que le train arrive, on descend.**  2. **avant que** – introduces a clause that describes
    an action that must happen *before* another one **when the subjects are different**. Use the subjunctive
    because the action is not yet realized.   - **Avant qu’il ne commence à pleuvoir, je rentre à la maison.**  3.
    **avant de** – used when the two clauses share the **same subject**. It is followed by an infinitive,
    not a subjunctive.   - **Avant de manger, je prépare le dîner.**  4. **après que** – the following
    verb is in the indicative; the action is already completed when the second one occurs.   - **Après
    que nous avons mangé, nous sommes allés au cinéma.**  5. **pendant que** – both actions occur simultaneously;
    the verb stays in the indicative.   - **Je lisais un livre pendant que la pluie tombait.**  **####
    Common pitfalls for English speakers**  - **Mixing moods**: many learners mistakenly put the subjunctive
    after *après que* because English uses “after” with a past-perfect sense. Remember: *après que* →
    **indicative**.  - **Avant que vs. avant de**: use *avant que* + subjunctive **only when the subjects
    differ**; otherwise use *avant de* + infinitive. The subject does **not** have to follow the conjunction,
    and the verb is not put in the subjunctive when the subject is the same.   - Correct: *Avant de manger,
    je prépare le dîner.*   - Correct (different subjects): *Avant qu’il ne pleuve, je rentre.*  **Practice**
    linking two sentences with each conjunction to internalise the mood requirements and the natural flow
    of Québec French.  ***'
