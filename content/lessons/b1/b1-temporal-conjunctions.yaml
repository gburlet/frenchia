- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Temporal Conjunctions'
  body: 'In everyday speech the same set of temporal conjunctions—*dès que, aussitôt que, avant que, après
    que, pendant que*—is used throughout the Francophonie. Québécois speakers do not replace them with
    regional alternatives, so the grammar you’re learning works equally well in Montréal and Paris. The
    only place you’ll notice a Québec-specific word is in the example sentences that involve meals: Québécois
    say *souper* for the evening meal, whereas in France the same idea would be expressed with *dîner*.
    Apart from that lexical difference, the mood (indicative) and word order are identical.'
  variants:
  - qc: souper
    fr: dîner
    en: supper / dinner
    formality: standard
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
- type: reading
  id: reading
  title: Une après-midi à la cabane à sucre
  passage_fr: Ce samedi, ma sœur et moi avons décidé d’aller à la cabane à sucre de notre oncle à Saint-Henri-de-Lévis.
    **Dès que** nous sommes arrivés, le parfum du sirop d’érable nous a rappelé les souvenirs d’enfance.
    Nous avons d’abord fait une petite promenade dans les sentiers boisés **pendant que** le soleil se
    couchait derrière les arbres. **Aussitôt que** le guide a commencé à expliquer comment le sirop était
    récolté, nous nous sommes regroupés autour du grand **chaudron** où l’on faisait bouillir la sève.
    **Avant que** le repas ne commence, il nous a demandé d’enlever nos bottes à cause du plancher glissant.
    Le groupe a ensuite dégusté des **crêpes**, du **pain doré** (pain perdu) et du jambon, **après que**
    le chef a versé le sirop chaud sur chaque assiette. **Dès que** nous avons fini, nous avons repris
    la route, heureux d’avoir passé un moment chaleureux avant que la fin de semaine ne s’éteigne.
  translation_en: This Saturday, my sister and I decided to go to our uncle’s sugar shack in Saint-Henri-de-Lévis.
    As soon as we arrived, the smell of maple syrup reminded us of childhood memories. We first took a
    short walk on the forest trails while the sun was setting behind the trees. As soon as the guide began
    to explain how the syrup is harvested, we gathered around the big **cauldron** where the sap was being
    boiled. Before the meal began, he asked us to take off our boots because the floor was slippery. The
    group then tasted **crêpes**, **French toast** (pain perdu) and ham, after the chef poured hot syrup
    over each plate. As soon as we finished, we headed back home, happy to have spent a warm moment before
    the weekend ended.
