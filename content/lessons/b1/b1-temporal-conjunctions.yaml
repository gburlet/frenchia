  type: multiple_choice
  question: Choose the sentence that correctly uses the temporal conjunction dès que with the proper verb
    mood.
  options:
  - Je partirai dès que j’aurai fini mon travail.
  - Je partirai dès que je finissais mon travail.
  - Je partirai dès que je finirais mon travail.
  answer_index: 0
  explanation: '**dès que** is followed by the **future or present indicative** when the action is certain
    and future. The only grammatically correct way to express “as soon as I will have finished…” is the
    future perfect: **j’aurai fini**. The other choices misuse the verb mood: the imparfait (*je finissais*)
    and the conditional (*je finirais*) are not allowed after **dès que** in this future-time reference.
    Therefore, option A is the only correct sentence.'
