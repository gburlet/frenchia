    fr: dîner (evening meal)
    en: supper
    formality: standard
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
- type: reading
  id: reading
  title: Une matinée à Québec
  passage_fr: |-
    Ce matin, il pleut des cordes dès que je sors de mon appartement du Vieux-Québec. J’ai mis mon imperméable et j’ai attrapé mon parapluie avant d’aller à l’épicerie du coin pour acheter du lait et du pain. En chemin, il fait encore très froid, alors je porte ma tuque. Au même moment, le bulletin météo indique qu’il va neiger d’ici l’après-midi. Il faut donc que je prévoie de rester à la maison.

    C’est une journée typique d’hiver ici : le ciel est gris, les rues sont glissantes et les gens se pressent avec leurs cafés à emporter. Avant de rentrer, je passe devant la bibliothèque municipale où l’on affiche une affiche : « Il faut respecter les consignes de distanciation ». Le bibliothécaire m’explique que le nouveau programme d’alphabétisation vise les nouveaux arrivants. Il faut vraiment soutenir ces initiatives, surtout quand il neige encore ce soir. Finalement, je rentre chez moi, je prépare un bon ragoût et j’attends que la tempête se calme avant de regarder la télé.
  translation_en: |-
    This morning, it is raining cats and dogs as soon as I leave my apartment in Old Quebec. I put on my raincoat and grabbed my umbrella before going to the corner grocery store to buy milk and bread. On the way, it is still very cold, so I wear my tuque. At the same time, the weather forecast says it will snow by the afternoon. Therefore, I have to plan to stay home.

    It is a typical winter day here: the sky is gray, the streets are slippery and people hurry with their take-away coffees. Before going back, I pass the municipal library where a poster reads, “You must respect the distancing rules.” The librarian explains that the new literacy program is aimed at newcomers. We really have to support these initiatives, especially when it is still snowing tonight. Finally, I go home, make a good stew and wait for the storm to calm down before watching TV.
  glossary:
  - fr: consignes
    en: instructions, guidelines.
    pos: noun
    gender: f
    region: fr
    formality: standard
    example_fr: Les consignes de sécurité sont affichées partout.
    example_en: The safety guidelines are posted everywhere.
  - fr: alphabétisation
    en: literacy (the ability to read and write).
    pos: noun
    gender: f
    region: fr
    formality: standard
    example_fr: Le programme d’alphabétisation aide les nouveaux arrivants.
    example_en: The literacy program helps newcomers.
  - fr: glissant
    en: slippery.
    pos: adjective
    gender: m
    region: fr
    formality: standard
    example_fr: Les trottoirs sont glissants après la neige.
    example_en: The sidewalks are slippery after the snow.
