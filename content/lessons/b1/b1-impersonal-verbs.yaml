sections:
- type: explanation
  id: explanation
  heading: Les verbes impersonnels (B1) – How to use *il faut*, *il pleut*, *il neige*, *il s’agit de*
  body: "In French many statements about weather, necessity, or a general situation are made with **impersonal\
    \ constructions**. The subject is the dummy pronoun **il**, which never refers to a real person. The\
    \ verb is always in the **third-person singular**, regardless of what follows.  \n\n**1. Weather verbs**\
    \  \n- **Il pleut** – It is raining.  \n- **Il neige** – It is snowing.  \n- **Il fait froid / chaud**\
    \ – It is cold / hot.  \nThese verbs are fixed; you cannot say *elle pleut* or *ils font froid*. \
    \ \n\n**2. Necessity – *il faut***  \n- **Il faut** + infinitive → “One must / It is necessary to\
    \ …”  \n  - *Il faut **préparer** le rapport avant la fin de la semaine.* (You have to prepare the\
    \ report before the end of the week.)  \n- When the subject is explicit, use **il faut que** + subjunctive:\
    \  \n  - *Il faut que tu **reviennes**.* (You must come back.)  \n\n**3. *Il s’agit de*** – “It is\
    \ a matter of / It concerns …”  \n- **Il s’agit de** + noun or infinitive.  \n  - *Il s’agit **d’une\
    \ réunion** demain.* (It’s a meeting tomorrow.)  \n  - *Il s’agit **de finir** le projet.* (The task\
    \ is to finish the project.)  \n  - Note the mandatory **de** after *s’agit*; the preposition never\
    \ changes.  \n\n**Common pitfalls for English speakers**  \n1. **Omitting the dummy *il*** – Learners\
    \ sometimes drop the impersonal subject and say *« Pleut beaucoup »* or *« Faut préparer le rapport\
    \ »*. The correct form is *« Il pleut beaucoup »* and *« Il faut préparer le rapport »*.  \n2. **Using\
    \ the infinitive after *il faut que*** – The construction *il faut que* always requires the subjunctive,\
    \ not the infinitive. Incorrect: *« Il faut que tu préparer le rapport »*. Correct: *« Il faut que\
    \ tu **prépares** le rapport »*.  \n3. **Missing the preposition *de* after *s’agit*** – Some learners\
    \ say *« Il s’agit un problème »*. The correct form is *« Il s’agit **d’un** problème »*.  \n\n**Quick\
    \ checklist**  \n- Use **il** + third-person singular.  \n- Weather verbs are fixed expressions. \
    \ \n- *Il faut* + infinitive for general necessity; *Il faut que* + subjunctive for a specific subject.\
    \  \n- *Il s’agit de* always followed by **de** and a noun or infinitive.  \n\nPractice these patterns\
    \ in everyday situations – e.g., *Il pleut souvent pendant les vacances*, *Il faut **déneiger** le\
    \ trottoir avant l’école*, *Il s’agit **de préparer** la présentation*."
