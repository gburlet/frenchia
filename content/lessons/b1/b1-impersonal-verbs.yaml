- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Impersonal verbs'
  body: 'In everyday Québec speech the same impersonal constructions are used, but a few lexical choices
    differ. The dummy subject *il* and the verbs *pleuvoir*, *neiger*, *faire* and *falloir* work exactly
    as in France. What changes is the surrounding vocabulary: Québécois speakers will say *souper* for
    the evening meal, *déjeuner* for breakfast, and *dîner* for lunch, so you’ll often hear *Il faut préparer
    le souper* where a French speaker would say *Il faut préparer le dîner*. The weather-verb sentences
    are identical; only the adverbial expressions may vary (e.g., *il pleut des cordes* is common in both
    regions).'
  variants:
