- type: examples
  id: examples
  heading: Examples – Les verbes impersonnels (B1)
  examples:
  - fr: Il pleut des cordes ce matin, alors je prends mon parapluie avant d’aller au dépanneur.
    en: It’s raining cats and dogs this morning, so I’m taking my umbrella before going to the convenience
      store.
    region: qc
  - fr: Il neige depuis hier soir; la ville a fermé les routes principales.
    en: It has been snowing since last night; the city has closed the main roads.
    region: common
  - fr: Il faut que je finisse mon rapport avant le dîner.
    en: I have to finish my report before lunch.
    note: In Québec, “dîner” means lunch; in France it means the evening meal.
    region: common
  - fr: Il faut réserver une table au restaurant si on veut manger au souper ce soir.
    en: We need to book a table at the restaurant if we want to have supper tonight.
    region: qc
  - fr: Il s’agit d’une nouvelle loi qui va changer la façon dont on magasine en ligne.
    en: It is about a new law that will change the way we shop online.
    note: “Magasiner” is common in Québec; in France people more often say “faire du shopping”.
    region: common
  - fr: Il faut que tu appelles ton frère avant la fin de semaine.
    en: You have to call your brother before the weekend.
    region: qc
  - fr: Il pleut légèrement aujourd’hui, donc je peux laisser la fenêtre ouverte.
    en: It’s drizzling today, so I can leave the window open.
    region: common
  - fr: Il s’agit d’un problème de plomberie; le plombier viendra demain matin.
    en: It’s a plumbing problem; the plumber will come tomorrow morning.
    region: common
  - fr: Il faut porter un casque quand on fait du vélo sur la piste cyclable du parc.
    en: You must wear a helmet when you ride a bike on the park’s bike path.
    region: common
  - fr: Il neige encore, alors les écoles ont annulé les cours pour la matinée.
    en: It’s still snowing, so schools have cancelled classes for the morning.
    region: common
- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Impersonal verbs'
  body: 'In everyday Québec speech the same impersonal constructions are used, but a few lexical choices
    differ. The dummy subject *il* and the verbs *pleuvoir*, *neiger*, *faire* and *falloir* work exactly
    as in France. What changes is the surrounding vocabulary: Québécois speakers will say *souper* for
    the evening meal, *déjeuner* for breakfast, and *dîner* for lunch, so you’ll often hear *Il faut préparer
    le souper* where a French speaker would say *Il faut préparer le dîner*. The weather‑verb sentences
    are identical; only the adverbial expressions may vary (e.g., *il pleut des cordes* is common in both
    regions).'
