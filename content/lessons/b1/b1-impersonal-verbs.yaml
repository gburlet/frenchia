sections:
- type: explanation
  id: explanation
  heading: '## Les verbes impersonnels (B1) – How to use *il faut*, *il pleut*, *il neige*, *il s’agit
    de*'
  body: |-
    In French many statements about weather, necessity, or a general situation are made with **impersonal constructions**. The subject is the dummy pronoun **il**, which never refers to a real person. The verb is always in the **third‑person singular**, regardless of what follows.

    ### 1. Weather verbs
    - **Il pleut** – It is raining.
    - **Il neige** – It is snowing.
    - **Il fait froid/chaud** – It is cold/hot.
    These verbs are fixed; you cannot say *elle pleut* or *ils font froid*.

    ### 2. Necessity – *il faut*
    - **Il faut** + infinitive → “One must / It is necessary to …”
      - *Il faut **magasiner** avant la fin de semaine.* (You have to shop before the weekend.)
    - When the subject is explicit, use **il faut que** + subjunctive:
      - *Il faut que tu **viennes**.* (You must come.)

    ### 3. *Il s’agit de* – “It is a matter of / It concerns …”
    - **Il s’agit de** + noun or infinitive.
      - *Il s’agit **d’une réunion** demain.* (It’s a meeting tomorrow.)
      - *Il s’agit **de finir** le projet.* (The task is to finish the project.)
      - Note the mandatory **de** after *s’agit*; the preposition never changes.

    ### Common pitfalls for English speakers
    1. **Forgetting the dummy *il*** – In English we can start with *“Rain is falling”* or *“You must…,”* but French always needs the impersonal *il* (except when using *nous* or *vous* with *devoir*).
    2. **Mixing up *il faut* with *faut‑il*** – The inversion *faut‑il* is only used in formal questions (*Faut‑il partir?*). In ordinary statements keep the order *Il faut*.

    ### Quick checklist
    - Use **il** + third‑person singular.
    - Weather verbs are fixed expressions.
    - *Il faut* + infinitive for general necessity; *Il faut que* + subjunctive for a specific subject.
    - *Il s’agit de* always followed by **de** and a noun or infinitive.

    Practice these patterns in everyday Québec contexts – e.g., *Il pleut souvent en fin de semaine*, *Il faut **déneiger** le trottoir*, *Il s’agit **de préparer** le souper*.
