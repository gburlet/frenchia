- type: reading
  id: reading
  title: Une matinée à Québec
  passage_fr: "Ce matin, il pleut des cordes dès que je sors de mon appartement du Vieux‑Québec. J’ai\
    \ mis mon imperméable et j’ai attrapé mon parapluie avant d’aller au dépanneur du coin pour acheter\
    \ du lait et du pain. En chemin, il fait encore très froid, alors je porte mon bonnet en laine. Au\
    \ même moment, le bulletin météo indique qu’il va neiger d’ici l’après‑midi. Il faut donc que je prévoie\
    \ de rester à la maison pour le souper. \n\nIl s’agit d’une journée typique d’hiver ici : le ciel\
    \ est gris, les rues sont glissantes et les gens se pressent avec leurs cafés à emporter. Avant de\
    \ rentrer, je passe devant la bibliothèque municipale où l’on affiche une affiche : « Il faut respecter\
    \ les consignes de distanciation ». Le bibliothécaire m’explique que le nouveau programme d’alphabétisation\
    \ vise les nouveaux arrivants. Il faut vraiment soutenir ces initiatives, surtout quand il neige encore\
    \ ce soir. Finalement, je rentre chez moi, je prépare un bon ragoût et j’attends que la tempête se\
    \ calme avant de regarder la télé."
  translation_en: "This morning, it is raining cats and dogs as soon as I leave my apartment in Old Quebec.\
    \ I put on my raincoat and grabbed my umbrella before going to the corner convenience store to buy\
    \ milk and bread. On the way, it is still very cold, so I wear my woolen hat. At the same time, the\
    \ weather forecast says it will snow by the afternoon. Therefore, I have to plan to stay home for\
    \ dinner. \n\nIt is a typical winter day here: the sky is gray, the streets are slippery and people\
    \ hurry with their take‑away coffees. Before going back, I pass the municipal library where a poster\
    \ reads, “You must respect the distancing rules.” The librarian explains that the new literacy program\
    \ is aimed at newcomers. We really have to support these initiatives, especially when it is still\
    \ snowing tonight. Finally, I go home, make a good stew and wait for the storm to calm down before\
    \ watching TV."
