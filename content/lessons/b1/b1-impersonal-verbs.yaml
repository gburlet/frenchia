- id: ex-09
  grammar_topics:
  - impersonal-verbs
  type: multiple_choice
  question: Which sentence correctly uses the impersonal verb *il faut* to express a personal obligation?
  options:
  - Il faut que je vais à la pharmacie avant le repas du soir.
  - Il faut que nous avons fini le projet avant la fin du mois.
  - Il faut que tu prennes ton manteau parce qu’il fait froid.
  - Il faut ils partir tôt demain matin.
  answer_index: 2
  explanation: 'With *il faut que* the clause that follows must be in the **subjunctive** and the subject
    pronoun is placed after *que*. Option C uses the correct subjunctive form *prennes* with the pronoun
    *tu*. The other options are incorrect: A uses the indicative form *vais* instead of the subjunctive
    (*aille*), B uses the indicative *avons fini* instead of the subjunctive, and D has an impossible
    subject pronoun after *il faut* (*ils*). The correct sentence is therefore option C.'
