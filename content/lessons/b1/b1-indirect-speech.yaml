- type: reading
  id: reading
  title: Le projet de la cabane à sucre
  passage_fr: Hier, notre groupe de bénévoles s’est réuni au centre communautaire pour préparer la cabane
    à sucre de la fin de semaine prochaine. **Marc** a expliqué que les volontaires devaient arriver **avant
    le déjeuner** pour aider à installer les tables et les décorations. **Sophie** a ajouté que le responsable
    du site avait demandé si tout le matériel était déjà commandé. **Léa** a affirmé que les bouteilles
    de sirop d’érable seraient livrées **le mardi soir**, donc il n’y aurait pas de problème pour le souper
    du samedi. **Pierre** a rappelé que le comité avait décidé que les enfants de la garderie pourraient
    participer aux jeux, à condition qu’ils portent des vestes chaudes. **Caroline** a indiqué que, selon
    le plan, le service de nettoyage viendrait **à 22 h** pour ranger la salle après le souper. Enfin,
    **Jean** a précisé que, si la météo était mauvaise, ils reporteraient l’événement à la fin de semaine
    suivante. Tout le monde était d’accord et a promis de travailler dur pour que tout se passe bien.
  translation_en: Yesterday, our volunteer group met at the community centre to prepare the sugar-shack
    for next weekend. Marc explained that the volunteers had to arrive **before breakfast** to help set
    up the tables and decorations. Sophie added that the site manager had asked whether all the equipment
    was already ordered. Léa affirmed that the maple-syrup bottles would be delivered **on Tuesday evening**,
    so there would be no problem for Saturday’s supper. Pierre reminded that the committee had decided
    that the daycare children could take part in the games, provided they wear warm jackets. Caroline
    indicated that, according to the plan, the cleaning crew would come **at 10 p.m.** to tidy the room
    after supper. Finally, Jean specified that, if the weather was bad, they would postpone the event
    to the following weekend. Everyone agreed and promised to work hard so that everything would go well.
