- id: ex-09
  grammar_topics:
  - indirect-speech
  type: multiple_choice
  question: Which of the following sentences correctly reports the statement « Le train part à huit heures
    du matin. » using the proper tense shift for indirect speech?
  options:
  - Marie a dit que le train partira à huit heures du matin.
  - Marie a dit que le train partait à huit heures du matin.
  - Marie a dit que le train partait-t-il à huit heures du matin ?
  - Marie a dit que le train avait parti à huit heures du matin.
  answer_index: 1
  explanation: In indirect speech, a present-tense statement is back-shifted to the imperfect. The direct
    speech « Le train part à huit heures du matin. » therefore becomes « Marie a dit que le train partait
    à huit heures du matin. ». Option B uses the correct imperfect *partait*. Option A keeps the future
    (*partira*), which is acceptable only when the future event is still considered valid at the time
    of reporting, but here the original was present, so a back-shift is required. Option C incorrectly
    forms a question, and option D uses the wrong auxiliary and past participle (*avait parti* should
    be *avait parti* → *avait parti* is also incorrect; the correct form would be *avait parti* → *avait
    parti*). Thus, B is the only correct answer.
- id: ex-10
  grammar_topics:
  - indirect-speech
  type: multiple_choice
  question: Choose the sentence that correctly reports a yes-no question, using the appropriate interrogative
    word and tense.
  options:
  - Le client a demandé si la salle de bain était disponible.
  - Le client a demandé si la salle de bain est disponible.
  - Le client a demandé où la salle de bain était disponible.
  - Le client a demandé si la salle de bain a été disponible.
  answer_index: 0
  explanation: When a direct yes-no question (e.g., « La salle de bain est-elle disponible ? ») is reported,
    we introduce it with *si* and shift the present tense to the imperfect. Option A does exactly that
    (*si* + *était*). Option B fails to shift the tense, C uses the wrong interrogative word (*où* instead
    of *si*), and D uses the passé composé, which is not the standard shift for a simple present question.
