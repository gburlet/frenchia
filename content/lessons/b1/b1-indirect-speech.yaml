sections:
- type: explanation
  id: explanation
  heading: Le discours indirect – reporting statements and questions
  body: 'In French, **the indirect (reported) speech** is used to convey what someone else said, thought
    or asked, without quoting them word-for-word. The structure is: 1️⃣  **Reporting verb** (dire, affirmer,
    expliquer, demander, etc.) + **que** (for statements) or **si** / the appropriate **interrogative
    word** (for questions). 2️⃣  The **verb in the subordinate clause** is shifted back one tense relative
    to the original (the *concordance des temps*). The shift follows the same pattern as the plus-que-parfait: *Present
    → imparfait* *Passé composé → plus-que-parfait* *Future → conditionnel présent* *Imperfect, plus-que-parfait,
    conditionnel → stay the same.* 3️⃣  Pronouns, possessives and time expressions often change: *je*
    → *il/elle*, *aujourd’hui* → *ce jour-là*, *demain* → *le lendemain*, *ici* → *là*.<br><br>### Examples<br>-
    Direct: **« Je mange le souper à huit heures. »**<br>  Indirect: *Il a dit qu’il **mangeait le souper
    à huit heures**.*<br>- Direct question: **« Où vas-tu ce week-end ? »**<br>  Indirect: *Elle a demandé
    où **j’allais la fin de semaine**.* (EU: *le week-end*)<br>- Direct: **« Nous irons à la cabane demain.
    »**<br>  Indirect: *Ils ont affirmé qu’ils **iraient à la cabane le lendemain**.*<br>- Direct yes/no
    question: **« Venez-vous demain ? »**<br>  Indirect: *Il a demandé **s’ils venaient demain**.* (Note:
    the subject changes from *vous* in the direct question to *ils* (or the appropriate third-person pronoun)
    in reported speech.)<br><br>### Common pitfalls for English speakers<br>1️⃣  **Skipping the tense
    back-shift** – English often keeps the original tense in reported speech, but French usually moves
    it back. Saying *Il a dit qu’il mange le souper* sounds like a direct quote.<br>2️⃣  **Using *si*
    for all yes/no questions** – All yes/no questions—whether they are introduced by *oui/non*, *est-ce
    que* or by inversion—are reported with **si** followed by the subject and the verb, **without** *est-ce
    que* or inversion. For example: *« Tu viens ? » → Il a demandé **si** je venais.* *« Est-ce que vous
    avez fini ? » → Elle a demandé **si** vous aviez fini.* *« Venez-vous demain ? » → Il a demandé **s’ils**
    venaient demain.* Wh-questions keep their interrogative word: *« Où vas-tu ? » → Elle a demandé **où**
    tu allais.*<br><br>Remember to adjust time markers and pronouns, and your indirect speech will sound
    natural in Québec French as well as in France!'
