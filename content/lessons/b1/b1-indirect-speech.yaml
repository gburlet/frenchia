  type: multiple_choice
  question: 'Direct question: « La salle de bain est-elle disponible ? » Le client a demandé … Choose
    the sentence that correctly reports this yes-no question, using the appropriate interrogative word
    and tense.'
  options:
  - Le client a demandé si la salle de bain était disponible.
  - Le client a demandé si la salle de bain serait disponible.
  - Le client a demandé où la salle de bain était disponible.
  - Le client a demandé si la salle de bain a été disponible.
  answer_index: 0
  explanation: When a direct yes-no question such as « La salle de bain est-elle disponible ? » is reported,
    we introduce it with *si* and back-shift the present tense to the imperfect (*était*). Option A does
    exactly that (*si* + *était*). Option B is wrong because it uses the conditional (*serait*) instead
    of the required imperfect back-shift. Option C uses the wrong interrogative word (*où*). Option D
    uses the passé composé, which is not the usual tense for reporting a simple present question. Therefore
    the only correct answer is option A.
