- type: reading
  id: reading
  title: Le projet du jardin communautaire
  passage_fr: Hier, notre groupe de bénévoles s’est réuni au centre communautaire pour préparer le jardin
    de la fin de semaine prochaine. **Marc** a expliqué que les volontaires devaient arriver **avant 9 h**
    pour aider à installer les bacs à plantes et les panneaux d’information. **Sophie** a ajouté que le
    responsable du site avait demandé si tout le matériel était déjà commandé. **Léa** a affirmé que les
    sacs de terreau seraient livrés **le mardi soir**, donc il n’y aurait pas de problème pour le samedi,
    **quand nous servirions** un repas partagé. **Pierre** a rappelé que le comité avait décidé que les
    enfants de la garderie pourraient participer aux ateliers de jardinage, à condition qu’ils portent
    des vestes chaudes. **Caroline** a indiqué que, selon le plan, le service de nettoyage viendrait **à
    22 h** pour ranger le site après la réunion. Enfin, **Jean** a précisé que, si la météo était mauvaise,
    ils reporteraient l’événement à la fin de semaine suivante. Tout le monde était d’accord et a promis
    de travailler dur pour que tout se passe bien.
  translation_en: Yesterday, our volunteer group met at the community centre to prepare the garden for
    next weekend. Marc explained that the volunteers had to arrive **before 9 a.m.** to help set up the
    planting boxes and information signs. Sophie added that the site manager had asked whether all the
    equipment was already ordered. Léa affirmed that the bags of potting soil would be delivered **on
    Tuesday evening**, so there would be no problem for Saturday, **when we would serve a shared meal**.
    Pierre reminded that the committee had decided that the daycare children could take part in the gardening
    workshops, provided they wear warm jackets. Caroline indicated that, according to the plan, the cleaning
    crew would come **at 10 p.m.** to tidy the site after the meeting. Finally, Jean specified that, if
    the weather was bad, they would postpone the event to the following weekend. Everyone agreed and promised
    to work hard so that everything would go well.
