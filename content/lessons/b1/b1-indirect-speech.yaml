sections:
- type: explanation
  id: explanation
  heading: Le discours indirect – reporting statements and questions
  body: |-
    In French, **the indirect (reported) speech** is used to convey what someone else said, thought or asked, without quoting them word-for-word. The structure is: 1️⃣  **Reporting verb** (dire, affirmer, expliquer, demander, etc.) + **que** (for statements) or **si** / the appropriate **interrogative word** (for questions). 2️⃣  The **verb in the subordinate clause** is shifted back one tense relative to the original (the *concordance des temps*). The shift follows the same pattern as the plus-que-parfait: *Present → imparfait* *Passé composé → plus-que-parfait* *Future → conditionnel présent* *Imperfect, plus-que-parfait, conditionnel → stay the same.* 3️⃣  Pronouns, possessives and time expressions often change: *je* → *il/elle*, *aujourd’hui* → *ce jour-là*, *demain* → *le lendemain*, *ici* → *là*.

    ### Examples
    - Direct: **« Je prépare le dîner à huit heures. »**
      Indirect: *Il a dit qu’il **préparait le dîner à huit heures**.*
    - Direct question: **« Où vas-tu ce soir ? »**
      Indirect: *Elle a demandé où **je me rendais ce soir-là**.*
    - Direct: **« Nous visiterons le musée demain. »**
      Indirect: *Ils ont affirmé qu’ils **visiteraient le musée le lendemain**.*
    - Direct yes/no question: **« Irez-vous à la réunion ? »**
      Indirect: *Il a demandé **s’ils iraient à la réunion**.* (The subject changes from *vous* in the direct question to *ils* (or the appropriate third-person pronoun) in reported speech.)

    ### Common pitfalls for English speakers
    1️⃣  **Skipping the tense back-shift** – English often keeps the original tense in reported speech, but French usually moves it back. Saying *Il a dit qu’il prépare le dîner* can sound like a direct quote; the back-shift is the default rule, although the present may be kept when the statement is still true at the time of reporting.
    2️⃣  **Using *si* for all yes/no questions** – All yes/no questions—whether introduced by *est-ce que*, by inversion, or by any other form—are reported with **si** followed by the subject and the verb, without *est-ce que* or inversion. For example: *« Tu viens ? » → Il a demandé **si** je venais.* *« Est-ce que vous avez fini ? » → Elle a demandé **si** vous aviez fini.* *« Partirez-vous demain ? » → Il a demandé **s’ils** partiraient demain.* Wh-questions keep their interrogative word: *« Où vas-tu ? » → Elle a demandé **où** tu allais.*

    Remember to adjust time markers and pronouns, and your indirect speech will sound natural in Québec French as well as in France!
