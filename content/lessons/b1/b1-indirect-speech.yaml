- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: indirect speech in everyday language'
  body: In Québec the mechanics of reported speech are identical to those taught in France – the same
    reporting verbs, the same use of *que*, *si* and interrogative words, and the same tense-shifting
    rules. The only noticeable differences are the lexical items that appear in the examples, because
    Québécois French uses its own everyday vocabulary. When you hear a Québec speaker reporting a conversation,
    you’ll hear the same grammatical pattern, but the nouns and meal names may differ.
