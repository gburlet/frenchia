- id: ex-09
  grammar_topics:
  - indirect-speech
  type: multiple_choice
  question: Which of the following sentences correctly reports the statement « Le train part à huit heures
    du matin. » using the proper tense shift for indirect speech?
  options:
  - Marie a dit que le train partira à huit heures du matin.
  - Marie a dit que le train partait à huit heures du matin.
  - Marie a dit que le train partait-t-il à huit heures du matin ?
  - Marie a dit que le train avait parti à huit heures du matin.
  answer_index: 1
  explanation: In indirect speech, a present-tense statement is back-shifted to the imperfect. The direct
    speech « Le train part à huit heures du matin. » therefore becomes « Marie a dit que le train partait
    à huit heures du matin. ». Option B uses the correct imperfect *partait* and is the only correct answer. Option A
    uses the future *partira*; this changes the present into a future tense, which is not a proper back-shift. Option C
    incorrectly forms a question inside reported speech, which is not required. Option D is wrong because
    the verb *partir* forms its compound tenses with *être* (the correct form would be *était parti*),
    and even if the auxiliary were correct it would be a plus-que-parfait, not the appropriate tense for
    back-shifting a present statement.
- id: ex-10
  grammar_topics:
