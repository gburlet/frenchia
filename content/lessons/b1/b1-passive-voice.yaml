sections:
- type: explanation
  id: explanation
  heading: La voix passive
  body: '*****### The passive voice (La voix passive)**  In French the passive is built with **être**
    + the past participle of the main verb. The past participle must agree in gender and number with the
    **subject** (the former object). The basic pattern is:  ```  Subject + être (conjugated) + past‑participle
    (+ par + agent)  ```  **Example (present):**  - **Le livre est lu par les élèves.** – *The book is
    read by the students.*  **Example (passé composé):**  - **La lettre a été écrite hier.** – *The letter
    was written yesterday.*  #### How to form it  1. Identify the active sentence: *Les Québécois mangent
    le pâté*.  2. Turn the direct object (*le pâté*) into the subject of the passive.  3. Conjugate **être**
    in the same tense as the active verb.  4. Add the past participle of the main verb, agreeing with
    the new subject.  5. Optionally add the agent with **par** (or **de** with some verbs that express
    a feeling or state, e.g. *être aimé de tous*).  Result: **Le pâté est mangé par les Québécois.**  ####
    When to use it  - When the *doer* is unknown, unimportant, or already understood: **Le pont a été
    détruit** (the bridge was destroyed).  - In formal or written style, especially in news or reports:
    **Une nouvelle loi a été adoptée**.  - To emphasize the *patient* (the thing acted upon) rather than
    the agent.  #### Common pitfalls for English speakers  1. **Missing agreement** – The past participle
    must match the new subject. *Les lettres sont écrits* is wrong; it should be **écrites**.  2. **Using
    *avoir* instead of *être*** – The passive never uses *avoir*. In the passé composé, the auxiliary
    of **être** itself is *avoir* (as in *a été*), but the participle of the main verb is still introduced
    by a form of **être**: **Le voyage a été fait** (not *a eu fait*).  #### Québec tip  In Quebec French
    the word *déjeuner* means *breakfast* and *dîner* means *lunch*, so you may hear sentences like **Le
    repas a été servi à midi** (The meal was served at noon). The structure remains the same.***'
