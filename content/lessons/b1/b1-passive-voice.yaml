  title: Le nouveau parc communautaire
  passage_fr: |-
    Dans le quartier Saint-Louis, un nouveau parc communautaire a été inauguré le mois dernier. Le terrain a été aménagé par la ville en collaboration avec des bénévoles locaux. Des arbres fruitiers ont été plantés le long des sentiers, et un petit étang a été creusé pour attirer les canards. Le mobilier urbain – bancs, tables de pique-nique et panneaux d’information – a été choisi par le comité du centre communautaire.

    Le plan du parc a été affiché sur le site de la ville, afin que tous les résidents puissent le consulter avant la grande fête d’inauguration. Lors de la cérémonie, le maire a déclaré que le parc serait entretenu par les employés du service d’entretien municipal et que les activités seraient organisées par l’association du quartier.

    Cette fin de semaine, les enfants pourront profiter du terrain de jeux qui a été installé récemment, et les aînés seront invités à participer à un atelier de jardinage qui sera animé par un horticulteur local. Le nouveau parc est déjà très apprécié et sera utilisé par toute la communauté tout au long de l’été.
  translation_en: |-
    In the Saint-Louis neighbourhood, a new community park was inaugurated last month. The land was developed by the city in collaboration with local volunteers. Fruit trees were planted along the paths, and a small pond was dug to attract ducks. The street furniture – benches, picnic tables and information panels – was chosen by the community-center committee.

    The park’s layout was posted on the city’s website, so that all residents could consult it before the big inauguration party. During the ceremony, the mayor said that the park would be maintained by municipal maintenance staff and that activities would be organised by the neighbourhood association.

    This weekend, children will be able to enjoy the playground that was installed recently, and seniors are invited to take part in a gardening workshop that will be led by a local horticulturist. The new park is already very appreciated and will be used by the whole community throughout the summer.
