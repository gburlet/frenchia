  type: multiple_choice
  question: Which sentence is a correct passive construction in the passé composé?
  options:
  - Le rapport a été révisé par le directeur hier.
  - Le rapport était révisé par le directeur hier.
  - Le rapport a révisé le directeur hier.
  - Le rapport a été révisant par le directeur hier.
  answer_index: 0
  explanation: 'The passive voice is formed with *être* + past participle, and the whole construction
    is conjugated in the passé composé: *a été* + *révisé*. The past participle agrees with the subject
    (*le rapport*, masc. sing.). The auxiliary of the passive construction is *être* (conjugated as *a
    été*); in the passé composé the auxiliary of *être* itself is *avoir* (as in *a été*). Option B uses
    the imperfect (*était révisé*), which is not the requested passé composé. Option C is active voice,
    and option D uses the wrong participle form (*révisant*).'
