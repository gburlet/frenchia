- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the passive voice'
  body: |-
    In everyday Québec French the passive construction être + participe is used exactly as in France – there is no special regional form. The grammar is identical, but speakers often choose vocabulary that reflects their environment. Below are B1-level examples that keep the passive structure while using a broader range of everyday situations. Québec forms are retained only when they occur naturally (e.g., le souper, la fin de semaine).

    **Typical Québec–France variants**
    1. *Le rapport a été révisé par le directeur avant **la fin de semaine**.* – France: «le week-end»
    2. *Le repas a été préparé par ma sœur pour le **souper** de ce soir.* – France: «dîner»
    3. *Les factures seront envoyées par **courriel** la semaine prochaine.* – France: «e-mail»
    4. *Le projet a été présenté par l’équipe lors de la réunion du lundi.* – France: same wording
    These examples show that while the passive structure is the same, the lexical choices can vary according to the context (work, school, family, leisure).
  variants:
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
  - qc: courriel
    fr: e-mail
    en: email
    formality: standard
- type: reading
