- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the passive voice'
  body: 'In everyday Québec French the passive construction être + participe is used exactly as in France
    – there is no special regional form. What does change are the nouns that appear in passive sentences,
    because Québécois speakers naturally insert local vocabulary (souper, fin de semaine, dépanneur, magasiner,
    etc.). The grammar itself is identical, so learners can apply the same rules in both varieties.<br><br>**Typical
    Québec‑France‑English variants**<br>1. *Le gâteau a été préparé par ma mère pour le **souper** de
    ce soir.* – France: «dîner»<br>2. *Les **billets** de la soirée ont été vendus par le **dépanneur**
    du coin.* – France: «supérette»<br>3. *Le rapport sera révisé par le directeur avant **la fin de semaine**.*
    – France: «le week‑end»<br>4. *Les factures seront envoyées par **courriel**.* – France: «e‑mail»<br><br>These
    examples show that while the passive structure is the same, the lexical choices reflect Québec’s everyday
    speech.'
  variants:
