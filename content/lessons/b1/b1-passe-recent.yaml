- type: reading
  id: reading
  title: Une surprise à la cabane à sucre
  passage_fr: |-
    Ce matin, je viens de me réveiller tard parce que j’ai raté mon alarme. J’ai sauté du lit, j’ai mis mon manteau et je suis sorti en vitesse. En passant devant le dépanneur du coin, je viens de voir une affiche qui annonçait une cabane à sucre ouverte ce week‑end. « Venez goûter le sirop d’érable », disait‑elle, « et profiter d’une promenade en traîneau ». 

    Je viens de téléphoner à ma sœur pour lui dire que je viens d’arriver au centre‑ville. Elle vient de me répondre qu’elle a déjà acheté les billets pour le spectacle de la fin de semaine et qu’elle veut qu’on se retrouve à la cabane à 14 h. 

    Nous venons de prendre le bus et, en arrivant, nous avons découvert que le groupe de musiciens venait de commencer à jouer des chansons traditionnelles. Tout le monde vient de danser, de rire et de déguster du crêpes à l’érable. C’est vraiment une belle façon de commencer le printemps!
  translation_en: |-
    This morning I just woke up late because I missed my alarm. I jumped out of bed, put on my coat and rushed outside. While passing the corner convenience store, I just saw a poster announcing a sugar‑shack open this weekend. “Come taste the maple syrup,” it said, “and enjoy a sleigh ride.”

    I just called my sister to tell her I just arrived downtown. She just replied that she has already bought tickets for the weekend show and wants us to meet at the sugar‑shack at 2 p.m.

    We just took the bus and, upon arriving, we discovered that the group of musicians had just started playing traditional songs. Everyone is just dancing, laughing and tasting maple‑flavored pancakes. It’s really a great way to start spring!
