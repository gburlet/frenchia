- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the passé récent'
  body: |-
    In Québec the passé récent (venir de + infinitif) is the everyday way to say something just happened, even for actions that occurred a few minutes ago. In France the same structure exists, but speakers often prefer the passé composé for very recent actions and reserve the passé récent for emphasising immediacy or for informal speech. The grammar is identical; the main differences are lexical.

    **Québec / France / English variants**
    1. « Je viens de finir mon souper. » / « Je viens de finir mon dîner. » / “I just finished dinner.”
    2. « Tu viens de manquer le dernier autobus pour le centre‑ville. » / « Tu viens de rater le dernier bus pour le centre‑ville. » / “You just missed the last bus downtown.”
    3. « Il vient de recevoir un appel du dépanneur. » / « Il vient de recevoir un appel du dépanneur. » / “He just got a call from the corner store.”
    4. « Nous venons de réserver nos places pour le spectacle de la fin de semaine. » / « Nous venons de réserver nos places pour le spectacle du week‑end. » / “We just booked tickets for the weekend show.”
    5. « Vous venez de voir la nouvelle série sur la télé. » / « Vous venez de voir la nouvelle série à la télé. » / “You just watched the new series on TV.”
    6. « Je viens de magasiner au centre commercial. » / « Je viens de faire du shopping au centre commercial. » / “I just shopped at the mall.”
