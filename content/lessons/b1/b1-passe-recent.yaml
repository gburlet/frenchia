- type: reading
  id: reading
  title: Une surprise au centre communautaire
  passage_fr: |-
    Ce matin, je me suis réveillé tard parce que j’ai raté mon alarme. J’ai sauté du lit, enfilé mon manteau et je suis sorti en vitesse. En passant devant le magasin du coin, j’ai remarqué une affiche qui annonçait un festival de musique au centre communautaire ce samedi. « Venez goûter des crêpes », disait-elle, « et découvrir l’exposition d’art local ». 

    J’ai téléphoné à ma sœur pour lui dire que j’étais arrivé au centre-ville. Elle m’a répondu qu’elle avait déjà acheté les billets pour le concert du samedi et qu’elle voulait qu’on se retrouve au centre à 14 h. 

    Nous avons pris le bus et, en arrivant, nous avons découvert que le groupe de musiciens venait de commencer à jouer des chansons traditionnelles. Le décor du lieu nous a dépaysés. Tout le monde danse, rit et déguste des crêpes. C’est vraiment une belle façon de célébrer le printemps !
  translation_en: |-
    This morning I woke up late because I missed my alarm. I jumped out of bed, put on my coat and rushed outside. While passing the corner shop, I noticed a poster announcing a music festival at the community centre this Saturday. “Come try some pancakes,” it said, “and discover the local art exhibition.”

    I called my sister to tell her I had arrived downtown. She replied that she had already bought tickets for Saturday’s concert and wanted us to meet at the centre at 2 p.m.

    We took the bus and, upon arriving, we discovered that the group of musicians had just started playing traditional songs. The venue’s décor took us out of our usual surroundings. Everyone is dancing, laughing and tasting pancakes. It’s really a wonderful way to celebrate spring!
