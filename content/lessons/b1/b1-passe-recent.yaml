- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the passé récent'
  body: 'The construction **venir de + infinitif** (the *passé récent*) works the same way in Québec and
    in France: it expresses an action that has just taken place, a few seconds or minutes ago. The grammar
    is identical; the only differences are lexical (the words that are used). In both varieties you use
    the present tense of **venir** followed by **de** and the infinitive of the main verb. The passé récent
    is not used for actions that belong to a narrated past; for those you would use the passé composé
    (or another past tense). When you need to stress that something happened a moment ago, the passé récent
    is perfectly natural in both regions.'
