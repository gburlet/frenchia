sections:
- type: explanation
  id: explanation
  heading: '# Le passé récent – venir de + infinitif'
  body: 'In French, the *passé récent* is the natural way to talk about something that has just happened.
    It is built with the **present** tense of **venir** followed by **de** and an infinitive verb. ```subject
    + venir (present) + de + infinitif````**Conjugation of venir** *venir* is irregular; learn its present
    forms by heart: - je **viens** de … - tu **viens** de … - il/elle/on **vient** de … - nous **venons**
    de … - vous **venez** de … - ils/elles **viennent** de … **Neutral examples** - **Je viens de finir**
    mon rapport. – *I just finished my report.* - **On vient de rentrer** à la maison. – *We just got
    home.* - **Ils viennent de préparer le déjeuner**. – *They just prepared breakfast.* - **Il venait
    de commencer** le cours quand le téléphone a sonné. – *He had just started the class when the phone
    rang.* (The imparfait *venait de* + infinitif is also used, especially in narratives, to describe
    an action that had just happened before another past event.) **When to use it** - To describe an action
    that occurred a few seconds or minutes ago. - When the exact time isn’t important, only the immediacy. -
    It can replace the English “just” (e.g., *I just saw him* → *Je viens de le voir*). **Pitfalls for
    English speakers** 1. **Confusing with the passé composé** – The passé composé (*j’ai fini*) can also
    mean “I finished,” but it does **not** convey the sense of *just now*. Use the passé récent when you
    want to stress that the action happened moments ago. 2. **Dropping the *de*** – Some learners omit
    *de* and say *je viens finir*, which is ungrammatical. The preposition is mandatory. 3. **Pronoun
    placement** – In the passé récent the object pronoun stays **before** the infinitive: *Je viens de
    le voir*, not *Je le viens de voir*. **Quick tip**: If you can replace the English “just” with *à
    l’instant* (“just now”), the passé récent is the right choice.'
