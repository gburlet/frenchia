sections:
- type: explanation
  id: explanation
  heading: '# Le passé récent – venir de + infinitif'
  body: '***  In Quebec French, the *passé récent* is the go‑to way to talk about something that has just
    happened. It is built with the **present** tense of **venir** followed by **de** and an infinitive
    verb.  ***    **Structure**  ```  subject + venir (present) + de + infinitive  ```  **Conjugation
    of venir**  *venir* is **irregular**; learn its present forms by heart:  - je **viens** de …  - tu
    **viens** de …  - il/elle/on **vient** de …  - nous **venons** de …  - vous **venez** de …  - ils/elles
    **viennent** de …    **Typical Quebec examples**  - **Je viens de finir** mon souper. – *I just finished
    my supper* (or *my evening meal*).  - **On vient de passer** au dépanneur. – *We just stopped by the
    corner store.*  - **Ils viennent de rentrer** à la maison. – *They just got home.*    **When to use
    it**  - To describe an action that occurred a few seconds or minutes ago.  - When the exact time isn’t
    important, only the immediacy.  - It can replace the English “just” (e.g., *I just saw him* → *Je
    viens de le voir*).    **Pitfalls for English speakers**  1. **Confusing with the passé composé**
    – The passé composé (*j’ai fini*) can also mean “I finished,” but it does **not** convey the sense
    of *just now*. Use the passé récent when you want to stress that the action happened moments ago.
     2. **Dropping the *de*** – Some learners omit *de* and say *je viens finir*, which is ungrammatical.
    The preposition is mandatory.  3. **Using the wrong tense of venir** – The passé récent always uses
    the **present** of *venir*. *Je suis venu de finir* is incorrect; that construction belongs to a different
    meaning (“I came from finishing”).    **Quick tip**: If you can replace the English “just” with *à
    l’instant* (“just now”), the passé récent is the right choice.  ***'
