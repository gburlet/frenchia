- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Indefinite Pronouns'
  body: In everyday speech the same set of indefinite pronouns (quelqu’un, quelque chose, personne, rien,
    chacun) is used in Québec and in France, and their meanings do not change. The only difference is
    the surrounding vocabulary that speakers choose. For example, a Québécois might say « quelqu’un a
    laissé son manteau au bureau » while a speaker from France would say the same thing. Likewise, you
    can hear « rien ne se passe dans le train » or « personne n’a compris l’instruction ». The pronouns
    themselves stay identical; only the collocations around them vary.
  variants: []
- type: reading
  id: reading
  title: Une petite escapade
  passage_fr: 'C’était **la fin de semaine dernière** et **quelqu’un** avait proposé d’aller à la maison
    de campagne de mon oncle pour une petite escapade. **Chacun** a accepté tout de suite, même si le
    temps était un peu frais. Nous avons chargé la voiture avec nos sacs, nos bottes et **quelque chose**
    à grignoter : des biscuits aux pépites de chocolat et des pommes. En arrivant, **personne** n’était
    encore là, mais **on n’a rien entendu** d’autre que le vent qui sifflait entre les arbres. **Quelqu’un**
    a allumé le feu de camp, et **tout le monde** s’est installé autour pour **souper**. Pendant que le
    souper cuisait, **personne** n’a parlé de travail ; on a juste chanté des chansons, raconté des histoires
    drôles et partagé des souvenirs d’enfance. Quand le feu s’est éteint, **chacun** a rangé ses affaires
    et on est rentré à la maison, **fatigués** mais heureux d’avoir passé une belle soirée ensemble.'
  translation_en: 'It was last weekend and **someone** had suggested going to my uncle’s country house
    for a short getaway. **Everyone** accepted right away, even though the weather was a bit cool. We
    loaded the car with our bags, our boots and **something** to snack on: chocolate-chip cookies and
    apples. When we arrived, **no one** was there yet, but **we heard nothing** but the wind whistling
    through the trees. **Someone** lit the campfire, and **everyone** settled around for **supper**. While
    the supper was cooking, **no one** talked about work; we just sang songs, told funny stories and shared
    childhood memories. When the fire went out, **each one** packed up his or her things and we went back
    home, **tired** but happy to have spent a lovely evening together.'
