sections:
- type: explanation
  id: explanation
  heading: Les pronoms indéfinis
  body: |-
    ### Core explanation (B1) – Indefinite pronouns refer to people or things without naming them specifically. The set of pronouns is the same in Québec French and in France, but they appear in everyday situations such as **« Quelqu’un a laissé son manteau au bureau »** or **« Rien ne se passe pendant le trajet en train ».**

    | Pronoun | Typical meaning | Example in a sentence |
    | --------- | ---------------- | ------------------------ |
    | **quelqu’un** | someone (person) | **Quelqu’un a appelé pour confirmer la réunion.** |
    | **quelque chose** | something (thing) | **J’ai trouvé quelque chose d’intéressant dans le tiroir.** |
    | **personne** | nobody / no-one (negative) | **Personne n’est venu à la séance, même pas le directeur.** |
    | **rien** | nothing (negative) | **On n’a rien entendu d’autre que le bruit du vent.** |
    | **chacun** | each one, everyone (singular) | **Chacun doit ranger son espace de travail après la pause.** |

    #### How to use them 1. **Positive statements** – use *quelqu’un* or *quelque chose* with a regular verb: **Quelqu’un a oublié son portefeuille.** 2. **Negative statements** – *personne* and *rien* are used with the negative *ne* (no *pas*). In spoken Québec the *ne* is often dropped, but in writing keep it: **Personne ne veut sortir ce soir.**

    **Rien ne m’a dérangé pendant le trajet.** 3. **With *chacun*** – the verb stays in the singular because *chacun* is grammatically singular, even though it refers to many people: **Chacun a son propre style.**

    #### Common pitfalls for English speakers

    - **Confusing *personne* with *person*.** *Personne* is always negative; the affirmative “someone” is *quelqu’un*, not *personne*. Saying *« Personne a appelé »* means “no one called,” not “someone called.”

    - **Using *rien* with a positive verb.** *Rien* must appear in a negative construction. The mistake *« Rien arrive »* (without *ne*) sounds incomplete; the correct form is *« Rien n’arrive. »*

    **Remember** that in informal Québec speech the *ne* can disappear, but for learning and written work keep the full negative form. Practice swapping *quelqu’un* ↔ *personne* and *quelque chose* ↔ *rien* to get a feel for the positive/negative contrast.
