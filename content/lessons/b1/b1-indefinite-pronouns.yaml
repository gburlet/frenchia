- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Indefinite Pronouns'
  body: 'In everyday Québec speech the same set of indefinite pronouns (quelqu’un, quelque chose, personne,
    rien, chacun) is used as in France, and their meanings do not change. What does differ is the surrounding
    vocabulary, which makes the sentences sound distinctly Québécois. For example, a Québécois will often
    hear « quelqu’un a laissé son manteau au dépanneur » (France would more likely say « au magasin »
    or « au commerce ») and « rien ne se passe pendant la fin de semaine » (France: « le week-end »).
    The pronouns themselves stay the same; only the collocations around them shift.'
