  - Quelque
  - Quelque-un
  - Quelqu’un chose
  answer_index: 0
  explanation: 'The indefinite pronoun meaning “someone” is **quelqu’un**. It is written with an apostrophe
    and is the standard form, used for both masculine and feminine referents. The other options are incorrect:
    **Quelque** is only an adverb or adjective meaning “some”; **Quelque-un** is a misspelling (the hyphen
    is not used); **Quelqu’un chose** is not a pronoun at all and makes the sentence ungrammatical. Therefore,
    the only correct choice is **Quelqu’un** (option 0).'
