- type: reading
  id: reading
  title: Une soirée au chalet
  passage_fr: 'C’était la fin de semaine dernière et **quelqu’un** avait proposé d’aller au chalet de
    mon oncle à Charlevoix. **Chacun** a accepté tout de suite, même si le temps était un peu froid. Nous
    avons chargé la voiture avec nos sacs, nos bottes et **quelque chose** à grignoter : des biscuits
    à l’érable et du **fromage en grains**. En arrivant, **personne** n’était encore là, mais **on n’a
    rien entendu** d’autre que le vent qui sifflait entre les sapins. **Quelqu’un** a allumé le feu de
    camp, et **tout le monde** s’est installé autour pour **souper**. Pendant que le souper cuisait, **personne**
    n’a parlé de travail ; on a juste raconté des histoires drôles et partagé des souvenirs d’enfance.
    Quand le feu s’est éteint, **chacun** a rangé ses affaires et on est rentré à la maison, fatigués
    mais heureux d’avoir passé une belle soirée ensemble.'
  translation_en: 'It was last weekend and **someone** had suggested going to my uncle’s cabin in Charlevoix.
    **Everyone** accepted right away, even though the weather was a bit cold. We loaded the car with our
    bags, our boots and **something** to snack on: maple cookies and cheese curds. When we arrived, **no
    one** was there yet, but **we heard nothing** but the wind whistling through the fir trees. **Someone**
    lit the campfire, and **everyone** settled around to **have supper**. While the supper was cooking,
    **no one** talked about work; we just told funny stories and shared childhood memories. When the fire
    went out, **each one** packed up his or her things and we went back home, tired but happy to have
    spent a lovely evening together.'
