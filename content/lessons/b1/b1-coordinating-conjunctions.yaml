  title: Une fin de semaine au parc ! – A Weekend at the Park
  passage_fr: Samedi matin, je me suis levé tôt parce que j’avais prévu d’aller au parc La Fontaine avec
    mes amis. On a pris le métro jusqu’à la station Mont-Royal, **et** on a acheté des **beignets** à
    la boulangerie du quartier. Après ça, on a installé nos **couvertures** près du lac, **mais** il faisait
    encore un peu frais, **alors** on a sorti un petit **pique-nique** (c’est permis dans la zone désignée).
    Julie a apporté des **sandwichs** au poulet, **ou** bien des **galettes** aux légumes, selon les goûts
    de chacun. Nous avons joué au **frisbee**, **et** on a couru partout et on a bien ri. Vers midi, le
    soleil était haut, **or** quelques nuages ont commencé à se former ; on a donc décidé de rentrer avant
    que la pluie ne tombe. En chemin, on s’est arrêté au café du coin pour un bon café au lait et un croissant,
    **car** on était déjà un peu fatigués. Finalement, on a promis de revenir la semaine prochaine, **et**
    on a déjà planifié une partie de **pétanque** pour la prochaine fois.
  translation_en: Saturday morning I got up early because I had planned to go to La Fontaine park with
    my friends. We took the metro to the Mont-Royal station, and we bought doughnuts at the neighbourhood
    bakery. After that we spread our blankets near the lake, but it was still a little chilly, so we set
    up a small picnic (it’s allowed in the designated area). Julie brought chicken sandwiches, or vegetable
    galettes, depending on everyone’s taste. We played frisbee, and we ran all over and laughed a lot.
    Around noon the sun was high, yet some clouds began to form; we therefore decided to head home before
    the rain fell. On the way we stopped at the local café for a good café au lait and a croissant, because
    we were already a bit tired. Finally we promised to come back next week, and we have already planned
    a pétanque game for the next time.
