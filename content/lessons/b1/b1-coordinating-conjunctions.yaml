sections:
- type: explanation
  id: explanation
  heading: Les conjonctions de coordination
  body: |-
    ### Les conjonctions de coordination (B1)  | Coordinating conjunctions link **elements of equal grammatical value** – two nouns, two verbs, two clauses, etc. In Québec French the set is the same as in France, and you’ll hear them frequently in everyday speech, especially **et**, **ou**, **mais**, **donc**, **or**, **ni**, **car**.  ---

    **Table des conjonctions**

    | Conjunction | Typical meaning | Example (French) | English translation |

    | --- | --- | --- | --- | --- |

    | **et** | and | *J’aime le café **et** le pain grillé.* | I like coffee **and** toast. |

    | **ou** | or (choice) | *Tu veux du café **ou** du thé ?* | Do you want coffee **or** tea? |

    | **mais** | but | *Il fait froid, **mais** il fait beau.* | It’s cold, **but** it’s sunny. |

    | **donc** | therefore | *Il a plu, **donc** le match est annulé.* | It rained, **so** the game is cancelled. |

    | **or** | now, but in fact (introduces a new fact) | *Il avait promis de venir, **or** il n’est pas venu.* | He promised to come, **but** he didn’t. |

    | **ni** | neither…nor | *Je n’ai **ni** faim **ni** soif.* | I’m **neither** hungry **nor** thirsty. |

    | **car** | because, for/because | *Je reste à la maison, **car** il neige.* | I’m staying home, **because** it’s snowing. |

    ---

    **How to place them**

    - **Between the two elements** you are joining. Put a **comma before** *mais, donc, or, car* when they introduce a new clause (e.g., *Il pleuvait, **mais** nous sommes sortis*). No comma before *et, ou, ni*.

    - **Subject omission**: when the subject is the same, it may be omitted after the conjunction (e.g., *Je mange **et** bois*). If the subject changes, it must be repeated (e.g., *Je mange **et** il boit*).

    **Common pitfalls for English speakers**

    1. **Confusing French *or* with English “or”** – French *or* does **not** mean “or” in English; it introduces a contrast, similar to “however” or “yet”.

    2. **Using a comma before *et* or *ou*** – In French a comma before *et* or *ou* is rare and looks like an unnecessary pause. Write *J’ai acheté du lait **et** du pain* (no comma).

    **Note**

    The coordinating conjunctions are identical in Québec and France; there are no special regional forms to learn.
