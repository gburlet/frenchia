- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: coordinating conjunctions'
  body: "In everyday Québec speech the seven classic coordinating conjunctions (et, ou, mais, donc, or,\
    \ ni, car) are used exactly as in European French. The main difference is not the words themselves\
    \ but the surrounding vocabulary and rhythm of conversation. Québécois speakers often attach a familiar\
    \ tone to “et” and “mais” in spoken sentences, and they may place a pause before “donc” to signal\
    \ a logical conclusion. Otherwise the grammatical function and meaning are identical.\n\n**Variants\
    \ you might hear**\n1. **et** – same in both regions (no regional variant). \n2. **ou** – Québec speakers\
    \ sometimes pronounce it a little longer: /u/ vs. the more clipped /u/ in France. \n3. **mais** –\
    \ in informal Québec speech you may hear the familiar form *mais* without the formal pause that French\
    \ speakers sometimes insert. \n4. **donc** – Québecers often stress it (*donc*) to mark cause‑effect,\
    \ whereas in France it can be more neutral. \n5. **or** – rarely used in casual Québec conversation;\
    \ speakers may prefer *mais* or *par contre* instead, but the word itself is the same. \n6. **ni**\
    \ – identical; Québec uses it in the same negative constructions as France.\n\nOverall, the set of\
    \ coordinating conjunctions is shared, and the only noticeable differences are prosodic (intonation)\
    \ and the frequency of use in informal speech, not the forms themselves."
  variants: []
- type: reading
  id: reading
  title: Une fin de semaine au parc ! – A Weekend at the Park
  passage_fr: Samedi matin, je me suis levé tôt parce que j’avais prévu d’aller au parc du Plateau avec
    mes amis. On a pris le métro jusqu’à la station Mont‑Royal, **et** on a acheté des beignes à la boutique
    du dépanneur du coin. Après ça, on a installé nos couvertures près du lac, **mais** il faisait encore
    un peu frais, alors on a allumé un petit feu de camp (c’est permis dans la zone désignée). Julie a
    apporté des sandwichs au poulet, **ou** bien des wraps aux légumes, selon les goûts de chacun. Nous
    avons joué au frisbee, **donc** on a couru partout et on a bien ri. Vers midi, le soleil était haut,
    **or** quelques nuages ont commencé à se former; on a donc décidé de rentrer avant que la pluie ne
    tombe. En chemin, on s’est arrêté au café du coin pour un bon café au lait et un croissant, **car**
    on était déjà un peu fatigués. Finalement, on a promis de revenir la semaine prochaine, **et** on
    a déjà planifié une partie de pétanque pour la prochaine fois.
  translation_en: Saturday morning I got up early because I had planned to go to the Plateau park with
    my friends. We took the metro to the Mont‑Royal station, and we bought doughnuts at the nearby corner
    dépanneur. After that we spread our blankets near the lake, but it was still a little chilly, so we
    lit a small campfire (it’s allowed in the designated area). Julie brought chicken sandwiches, or vegetable
    wraps, depending on everyone’s taste. We played frisbee, so we ran all over and laughed a lot. Around
    noon the sun was high, yet some clouds began to form; we therefore decided to head home before the
    rain fell. On the way we stopped at the local café for a good café au lait and a croissant, because
    we were already a bit tired. Finally we promised to come back next week, and we have already planned
    a pétanque game for the next time.
