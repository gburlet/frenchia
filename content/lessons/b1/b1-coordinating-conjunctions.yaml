- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: coordinating conjunctions'
  body: |-
    The seven coordinating conjunctions – **et, ou, mais, donc, or, ni, car** – have the same forms and grammatical functions in Québec French and in European French.  There are no regional differences in meaning or usage; the conjunctions are used in exactly the same way in both varieties.

    **Quick reference**
    1. **et** – identical in both regions.
    2. **ou** – identical; can be inclusive or exclusive.  To stress a clear choice, use *ou bien* or *soit… soit*.
    3. **mais** – identical.
    4. **donc** – identical.
    5. **or** – identical; it introduces a new fact (e.g., *Il avait promis de venir, **or** il n’est pas venu*).
    6. **ni** – identical.
    7. **car** – identical.

    In short, the coordinating conjunctions themselves are the same in Québec and France; no regional variation affects their meaning or grammatical behavior.
