- type: explanation
  id: explanation
  heading: Les conjonctions de coordination
  body: |-
    ***
    ### Les conjonctions de coordination (B1)

    Coordinating conjunctions link **elements of equal grammatical value** – two nouns, two verbs, two clauses, etc. In Québec French the set is the same as in France, but you’ll often hear them in everyday speech, especially **et**, **ou**, **mais**, **donc**, **or**, **ni**, **car**.

    | Conjunction | Typical meaning | Example (French) | English translation |
    |-------------|----------------|-------------------|---------------------|
    | **et**      | and            | **J’aime le sirop d’érable et le pain grillé.** | I like maple syrup **and** toast. |
    | **ou**      | or (choice)    | **Tu veux du café ou du thé?** | Do you want coffee **or** tea? |
    | **mais**    | but            | **Il fait froid, **mais** il fait beau.** | It’s cold, **but** it’s sunny. |
    | **donc**    | therefore      | **Il a plu, **donc** le match est annulé.** | It rained, **so** the game is cancelled. |
    | **or**      | yet, however   | **Elle est fatiguée, **or** elle continue de travailler.** | She’s tired, **yet** she keeps working. |
    | **ni**      | neither…nor    | **Je n’ai **ni** faim **ni** soif.** | I’m **neither** hungry **nor** thirsty. |
    | **car**     | because, for that reason | **Je reste à la maison, **car** il neige.** | I’m staying home, **because** it’s snowing. |

    #### How to place them
    - **Between the two elements** you are joining, with a **comma before** *mais, donc, or, car* when they introduce a new clause (e.g., *Il pleuvait, **mais** nous sommes sortis*). No comma is needed before *et, ou, ni*.
    - Do **not repeat the subject** after the conjunction unless you need to emphasize it: *Je mange **et** je bois* (correct) vs. *Je mange **et** il boit* (different subjects).

    #### Common pitfalls for English speakers
    1. **Confusing “or” with “ou”** – English “or” can be exclusive or inclusive; French *ou* is usually inclusive. To stress exclusivity, add *ou bien* or *soit…soit*.
    2. **Using a comma before *et* or *ou*** – In French a comma before *et* or *ou* is rare and can look like a pause that isn’t needed. Write *J’ai acheté du lait **et** du pain* (no comma).

    Remember: the meaning of the sentence often hinges on the conjunction, so choose the one that matches the logical relationship you want to express.
    ***
