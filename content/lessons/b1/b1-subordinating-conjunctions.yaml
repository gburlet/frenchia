sections:
- type: explanation
  id: explanation
  heading: Les conjonctions de subordination
  body: '*****What they are and how they work**  A subordinating conjunction links a **dependent clause**
    to a main clause, showing cause, condition, time, comparison, or concession. In Québec French the
    same words are used as in France, and they behave the same way grammatically. The dependent clause
    cannot stand alone; it needs the main clause to complete the idea.  | Conjunction | Typical meaning
    | Example (B1 level) | |-------------|----------------|----------------------| | **parce que** | cause
    (because) | **Je reste à la maison parce qu’il pleut.** | | **quand** | time (when) | **Quand il fait
    froid, on boit du café.** | | **si** | condition (if) | **Si tu veux, on peut aller au dépanneur.**
    | | **comme** | comparison / cause (as, since) | **Comme il est tard, on va rentrer.** | | **puisque**
    | obvious cause (since, because) | **Puisque tu as fini, tu peux partir.** | | **bien que** | concession
    (although) – followed by the subjunctive | **Bien qu’il fasse froid, elle sort sans manteau.** |**###
    Common pitfalls for English speakers**  1. **Mood after *bien que*** – English speakers often keep
    the indicative (*bien qu’il fait froid*). In French the verb must be in the **subjunctive** (*bien
    qu’il fasse froid*).  2. **Using *si* + future** – The conjunction *si* introduces a condition and
    is followed by the present (or sometimes the imperfect) tense, or by the passé composé, never the
    future. Correct: *Si tu viens, on partira*; *Si tu as fini, tu peux partir*; incorrect: *Si tu viendras…*
    **### Quick tip**  After a conjunction, check which mood the verb requires. If the conjunction is
    *bien que*, *quoique*, *pour que*, etc., use the subjunctive; for *parce que*, *puisque*, *comme*,
    *si*, use the indicative.'
