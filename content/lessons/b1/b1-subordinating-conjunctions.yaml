- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Subordinating Conjunctions'
  body: In everyday Québec French the same set of subordinating conjunctions is taught and used as in
    France—*parce que, quand, si, comme, puisque, bien que*. The meanings and grammatical behaviour are
    identical in the two varieties. In particular, **bien que** always introduces a clause in the subjunctive,
    both in Québec and in France; it is not followed by the indicative in casual speech. (In informal
    spoken Québec, you may hear the pronunciation *pasque* for *parce que*, but the form and meaning remain
    the same.)
  variants: []
- type: reading
  id: reading
  title: Une après-midi en famille
  passage_fr: 'C’est le premier dimanche d’avril et la neige a enfin fondu. **Quand** nous sommes arrivés
    chez ma tante, l’odeur du café fraîchement préparé remplissait la maison. **Comme** il faisait encore
    un peu frais, elle nous a offert des **tasses** de chocolat chaud avant le repas. **Parce que** la
    famille était nombreuse, elle a préparé un grand **repas** : des crêpes, du jambon, du pain d’épice
    et une salade verte. **Puisque** tout le monde était déjà assis, elle a commencé à raconter des histoires
    de son enfance à la campagne. **Bien que** la météo ait prévu du soleil, elle a quand même apporté
    des **couvertures** au cas où il ferait encore froid le soir. **Si** tu viens la prochaine fois, tu
    pourras goûter le gâteau maison que prépare ma tante. **Après** le repas, nous sommes sortis faire
    une petite **promenade** dans le parc avant de rentrer à la maison.'
  translation_en: 'It’s the first Sunday of April and the snow has finally melted. When we arrived at
    my aunt’s house, the smell of freshly brewed coffee filled the home. Since it was still a little chilly,
    she offered us mugs of hot chocolate before the meal. Because the family was large, she prepared a
    big meal: pancakes, ham, gingerbread and a green salad. Since everyone was already seated, she began
    to tell stories of her childhood in the countryside. Although the weather forecast had called for
    sun, she still brought blankets in case it got cold again in the evening. If you come next time, you’ll
    be able to taste the homemade cake that my aunt makes. After the meal, we went for a short walk in
    the park before heading home.'
