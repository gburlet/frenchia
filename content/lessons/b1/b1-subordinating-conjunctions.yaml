- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Subordinating Conjunctions'
  body: 'In everyday Québec French the same set of subordinating conjunctions is taught and used as in
    France—*parce que, quand, si, comme, puisque, bien que*. The main difference is stylistic: Québécois
    speakers tend to favour the shorter forms *quand* and *si* in spoken language, whereas in formal French
    (especially in France) you’ll see *lorsque* and *si* + verb more often in writing. The concessive
    *bien que* is used identically, but in casual Québec speech it can be followed by a simple present
    instead of the subjunctive without sounding wrong. Otherwise, the meanings and grammatical behaviour
    are the same.'
  variants: []
- type: reading
  id: reading
  title: Une après‑midi à la cabane à sucre
  passage_fr: 'C’est le premier dimanche d’avril et la neige a enfin fondu. **Quand** nous sommes arrivés
    à la cabane à sucre de mon oncle, le parfum du sirop d’érable remplissait l’air. **Comme** il faisait
    encore un peu frais, mon oncle nous a offert des tasses de chocolat chaud avant le repas. **Parce
    que** la famille était nombreuse, il a préparé un grand souper : des crêpes, du jambon, des fèves
    au lard et, bien sûr, du pain d’épice. **Puisque** tout le monde était déjà assis, il a commencé à
    raconter des histoires de son enfance à la campagne. **Bien que** la météo prévoyait du soleil, il
    a quand même apporté des couvertures au cas où il ferait encore froid le soir. **Si** tu viens la
    prochaine fois, tu pourras goûter le sirop directement du robinet du sapin. **Quand** le soleil se
    couchera, on ira tous au dépanneur du coin pour acheter des bonbons à la tire avant de rentrer à la
    maison pour la fin de semaine.'
  translation_en: 'It’s the first Sunday of April and the snow has finally melted. When we arrived at
    my uncle’s sugar shack, the scent of maple syrup filled the air. Since it was still a little chilly,
    my uncle offered us mugs of hot chocolate before the meal. Because the family was large, he prepared
    a big supper: pancakes, ham, beans with pork, and, of course, gingerbread. Since everyone was already
    seated, he began to tell stories of his childhood on the farm. Although the weather forecast called
    for sun, he still brought blankets in case it got cold again in the evening. If you come next time,
    you will be able to taste the syrup straight from the tree’s tap. When the sun sets, we will all go
    to the corner dépanneur to buy taffy candy before heading home for the weekend.'
