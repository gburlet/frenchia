- id: ex-09
  grammar_topics:
  - subordinating-conjunctions
  type: multiple_choice
  question: 'Choose the correct sentence that uses bien que to express a concession:'
  options:
  - Bien que il fait très froid, je vais sortir faire du patin à glace.
  - Bien que le vent était fort, nous avons décidé de rester à la maison.
  - Bien que le vent soit fort, nous avons décidé de rester à la maison.
  - Bien que le vent est fort, nous avons décidé de rester à la maison.
  answer_index: 2
  explanation: With *bien que* the verb in the subordinate clause must be in the **subjunctive**. Option
    C uses the correct subjunctive form *soit*; the other options either keep the indicative (*il fait*,
    *était*, *est*) or use the wrong tense. The sentence is natural Québécois (you could also say *on*
    instead of *nous*).
- id: ex-10
  grammar_topics:
  - subordinating-conjunctions
  type: multiple_choice
  question: Ce soir-là, il faisait très froid et on avait très faim. Quelle phrase utilise correctement
    *parce que* pour donner la cause et respecte l’ordre des repas au Québec ?
  options:
  - J’ai mangé du pâté chinois parce que c’était le dîner.
  - J’ai mangé du pâté chinois parce que c’était le souper.
  - J’ai mangé du pâté chinois parce que c’était le déjeuner.
  - J’ai mangé du pâté chinois parce que c’était le goûter.
  answer_index: 1
  explanation: In Québec *souper* is the main evening meal (what is called *dîner* in France). Because
    the context specifies an evening situation, the cause clause must refer to *le souper*. Option B is
    therefore the only sentence that both gives a cause with *parce que* + indicative and uses the correct
    Québec term for the evening meal. The other options either use the French term *dîner* (which in Québec
    means lunch) or refer to meals that are not eaten in the evening (déjeuner = breakfast, goûter = snack).
