  type: multiple_choice
  question: 'Choisissez la phrase qui exprime correctement une concession :'
  options:
  - J’ai mangé une salade parce que j’avais très faim.
  - J’ai mangé une salade bien que j’aie déjà dîné.
  - J’ai mangé une salade pour pouvoir finir mon travail rapidement.
  - J’ai mangé une salade quand il a commencé à pleuvoir.
  answer_index: 1
  explanation: La phrase qui exprime une concession doit contenir la conjonction *bien que* et le verbe
    qui suit doit être au subjonctif. Ici, *bien que j’aie déjà dîné* respecte ces règles. Les autres
    phrases utilisent respectivement *parce que* (cause), *pour* + infinitif (but) et *quand* (temps),
    donc elles ne répondent pas à la consigne de concession. Cette activité permet de vérifier que l’apprenant
    reconnaît la conjonction de concession et le mode verbal qui l’accompagne, conformément à la leçon
    sur les conjonctions de subordination.
