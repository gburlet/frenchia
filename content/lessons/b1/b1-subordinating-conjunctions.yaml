- id: ex-09
  grammar_topics:
  - subordinating-conjunctions
  type: multiple_choice
  question: 'Choose the correct sentence that uses bien que to express a concession:'
  options:
  - Bien que il fait très froid, je vais sortir faire du patin à glace.
  - Bien que le vent était fort, nous avons décidé de rester à la maison.
  - Bien que le vent soit fort, nous avons décidé de sortir.
  - Bien que le vent est fort, nous avons décidé de rester à la maison.
  answer_index: 2
  explanation: With *bien que* the verb in the subordinate clause must be in the **subjunctive**. Option C
    uses the correct subjunctive form *soit* and presents a logical concession (the wind is strong, yet
    we decided to go out). The other options either keep the indicative (*il fait*, *était*, *est*) or
    use the wrong tense, so they are not grammatically correct for a concession with *bien que*.
- id: ex-10
  grammar_topics:
