    formality: standard
- type: reading
  id: reading
  title: Une après-midi à la cabane à sucre
  passage_fr: 'C’est le premier dimanche d’avril et la neige a enfin fondu. **Quand** nous sommes arrivés
    à la cabane à sucre de mon oncle, le parfum du sirop d’érable remplissait l’air. **Comme** il faisait
    encore un peu frais, mon oncle nous a offert des tasses de chocolat chaud avant le repas. **Parce
    que** la famille était nombreuse, il a préparé un grand souper : des crêpes, du jambon, des fèves
    au lard et, bien sûr, du pain d’épice. **Puisque** tout le monde était déjà assis, il a commencé à
    raconter des histoires de son enfance à la campagne. **Bien que** la météo ait prévu du soleil, il
    a quand même apporté des couvertures au cas où il ferait encore froid le soir. **Si** tu venais la
    prochaine fois, tu pourrais goûter le sirop directement du robinet de l’érable. **Quand** le soleil
    s’est couché, nous sommes tous allés au dépanneur du coin pour acheter de la **tire d’érable** avant
    de rentrer à la maison.'
  translation_en: 'It’s the first Sunday of April and the snow has finally melted. When we arrived at
    my uncle’s sugar shack, the scent of maple syrup filled the air. Since it was still a little chilly,
    my uncle offered us mugs of hot chocolate before the meal. Because the family was large, he prepared
    a big supper: pancakes, ham, beans with pork, and, of course, gingerbread. Since everyone was already
    seated, he began to tell stories of his childhood on the farm. Although the weather forecast had called
    for sun, he still brought blankets in case it got cold again in the evening. If you came next time,
    you could taste the syrup straight from the maple tap. When the sun set, we all went to the corner
    dépanneur to buy maple taffy before heading home.'
