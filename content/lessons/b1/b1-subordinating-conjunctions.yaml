sections:
- type: explanation
  id: explanation
  heading: Les conjonctions de subordination
  body: "***\n### What they are and how they work\nA subordinating conjunction links a **dependent clause**\
    \ to a main clause, showing cause, condition, time, comparison, or concession. In Québec French the\
    \ same words are used as in France, but you’ll often hear them in everyday speech (e.g., *parce que*\
    \ → *parce que*, *si* → *si*, *comme* → *comme*). The dependent clause cannot stand alone; it needs\
    \ the main clause to complete the idea.\n\n| Conjunction | Typical meaning | Example (B1 level) |\n\
    |-------------|----------------|----------------------|\n| **parce que** | cause (because) | **Je\
    \ reste à la maison parce que il pleut.** |\n| **quand** | time (when) | **Quand il fait froid, on\
    \ boit du café.** |\n| **si** | condition (if) | **Si tu veux, on peut aller au dépanneur.** |\n|\
    \ **comme** | comparison / cause (as, since) | **Comme il est tard, on va rentrer.** |\n| **puisque**\
    \ | obvious cause (since, because) | **Puisque tu as fini, tu peux partir.** |\n| **bien que** | concession\
    \ (although) – followed by the subjunctive | **Bien qu’il fasse froid, elle sort sans manteau.** |\n\
    \n### Common pitfalls for English speakers\n1. **Word order after *bien que*** – English speakers\
    \ often keep the indicative (*bien que il fait froid*). In French the verb must be in the **subjunctive**\
    \ (*bien qu’il fasse froid*).  \n2. **Using *parce que* for a simple *because* when the cause is obvious**\
    \ – In spoken Québec French, *puisque* feels more natural when the reason is already known to the\
    \ listener. Over‑using *parce que* can sound a bit heavy.\n\n### Quick tip\nWhen you can replace the\
    \ clause with a noun phrase, you’re probably dealing with a **subordinate clause**. For instance,\
    \ *Je suis parti **parce que j’étais fatigué**.* The part in bold cannot stand alone; it needs the\
    \ main clause *Je suis parti*.\n***"
