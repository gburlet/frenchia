    fr: petit-déjeuner
    en: breakfast
    formality: standard
  - qc: dîner
    fr: déjeuner
    en: lunch
    formality: standard
  - qc: souper
    fr: dîner
    en: supper
    formality: standard
  - qc: la fin de semaine
    fr: le week-end
    en: the weekend
    formality: standard
