- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the pronoun en'
  body: The mechanics of **en** are identical in Québec French and in France; it still replaces *de + noun*
    and quantities, and it follows the same placement rules. The only noticeable differences arise from
    the everyday vocabulary that naturally shows up in the examples. When you talk about meals or the
    weekend, the Québec terms will appear, but the pronoun itself behaves exactly the same.
  variants:
