  type: multiple_choice
  question: Choose the sentence that correctly uses en to replace a quantity.
  options:
  - Il a commandé trois cafés au lait, mais il n’en a fini qu’un.
  - Il a commandé trois cafés au lait, mais il n’en a fini un.
  - Il a commandé trois cafés au lait, mais il n’en a fini une.
  - Il a commandé trois cafés au lait, mais il n’en a fini une part.
  answer_index: 0
  explanation: When **en** replaces a quantity, the noun is omitted and the remaining numeral must be
    introduced by the restrictive structure **ne … que** (meaning “only”). The correct form is **qu’un**
    (contraction of *que un*). Options B-D are incorrect because they either omit the required **que**
    (B) or use the wrong gender or add an unnecessary noun (C, D). The sentence **Il a commandé trois
    cafés au lait, mais il n’en a fini qu’un.** therefore correctly expresses “but he only finished one
    of them.”
