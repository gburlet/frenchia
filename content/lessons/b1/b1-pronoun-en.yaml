sections:
- type: explanation
  id: explanation
  heading: Le pronom **en**
  body: '*****### The pronoun **en****  **en** is the little word that stands in for a phrase introduced
    by **de** (or a partitive construction) and for a quantity. It works the same way in Québec French;
    the only difference you might notice is the use of Québec-specific nouns (e.g., *déjeuner* for breakfast,
    *souper* for the evening meal) when they appear in the examples.  **#### 1. Replacing *de* + noun**  -
    **J’ai besoin de sucre. → J’en ai besoin.**  - **Il parle de son projet. → Il en parle.**  In both
    sentences, **en** replaces the whole *de + noun* group. The verb does **not** change; you simply insert
    **en** before the verb (or before the auxiliary in compound tenses).  **#### 2. Replacing quantities**  -
    **Je veux deux pommes. → J’en veux deux.**  - **Nous avons acheté trois billets pour le concert. →
    Nous en avons acheté trois.**  Notice that the numeral stays after **en**; the pronoun never takes
    the place of the number.  **#### 3. Position rules**  - In a simple present or imperfect, **en** comes
    **directly before the verb**: *Elle **en** mange souvent.*  - With a compound tense, it goes **before
    the auxiliary**: *Ils **en** ont acheté.*  - In affirmative commands, **en** follows the verb and
    is attached with a hyphen: *Manges-en !* (Eat some!).  **#### Common pitfalls for English speakers**  1.
    **Forgetting the preposition** – English often drops *of* in “I need sugar,” but French requires *de*.
    When you replace it with **en**, you must still think of the original *de*.  2. **Putting the number
    before the pronoun** – The correct order is *en + number* (e.g., *J’en ai trois*), not *trois en*.  **####
    Quick check**  - *Nous avons besoin de pain.* → **Nous **en** avons besoin.**  - *Tu as acheté du
    lait ?* → **Oui, j’**en** ai acheté.**  Keep practising by spotting any *de*-phrase or quantity and
    swapping it with **en**. It will soon feel as natural as saying *some* in English!***'
- type: table
  id: table
  heading: Le pronom **en** – B1
  columns:
  - Rule
  - Structure
  - Example (Québec)
  - English
  rows:
  - - Replace *de* + noun (or *de* + infinitive)
    - Subject + verb + en + rest of the clause
    - J’ai besoin **de** sucre → **J’en** ai besoin.
    - I need some sugar.
  - - Replace *de* + noun after a verb of desire/need
    - Verb + en + object-complément
    - Je veux **de** l’eau → **J’en** veux.
    - I want some water.
  - - Replace a quantity expression
    - Verb + en + rest
    - Il a acheté trois pommes → **Il en** a acheté trois.
    - He bought three apples.
  - - Negative form
    - ne + en + verb + pas + rest
    - Je n’ai **pas** de pain → **Je n’en** ai **pas**.
    - I don’t have any bread.
  - - Interrogative (yes/no)
    - Est-ce que + sujet + en + verbe + … ?
    - Est-ce que tu **en** as ? (de lait)
    - Do you have any milk?
  - - Interrogative (wh-question)
    - Combien + en + verb-subject + … ?
    - Combien **en** as-tu ? (de pommes)
    - How many (of them) do you have?
