  title: Une après-midi au marché
  passage_fr: 'Samedi, ma sœur et moi sommes allées au marché de la ville pour faire les courses. Avant
    de partir, elle a acheté des œufs et du pain à la boulangerie du coin. Au marché, nous avons vu un
    stand qui vendait des fromages artisanaux. Le vendeur nous a proposé d’en goûter deux sortes : un
    cheddar bien affiné et un brie crémeux. Nous en avons pris un petit morceau de chaque pour les comparer.
    Après avoir acheté du lait, du beurre et quelques pommes, nous avons décidé d’acheter aussi du miel.
    Le vendeur nous a dit qu’il en restait très peu, alors nous en avons pris un pot entier. En rentrant
    à la maison, nous avons préparé un sandwich au fromage et au miel pour le souper. Ma sœur en était
    ravie, et elle a même proposé d’en préparer d’autres demain pour le déjeuner de nos amis.'
  translation_en: 'Saturday, my sister and I went to the town market to do the shopping. Before leaving,
    she bought eggs and bread at the corner bakery. At the market we saw a stall that sold artisanal cheeses.
    The vendor offered us to taste two kinds of them: a well-aged cheddar and a creamy brie. We took a
    small piece of each to compare them. After buying milk, butter and a few apples, we decided to also
    buy honey. The vendor told us that there was very little left of it, so we took a whole jar. Coming
    home, we made a cheese-and-honey sandwich for supper. My sister was delighted with it, and she even
    suggested preparing more of it tomorrow for our friends’ breakfast.'
