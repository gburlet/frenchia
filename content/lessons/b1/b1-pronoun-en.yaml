sections:
- type: explanation
  id: explanation
  heading: Le pronom **en**
  body: "***### The pronoun **en**  —  a quick reminder  ***  \n\n**en** is the little word that stands\
    \ in for a phrase introduced by **de** (or a partitive construction) and for a quantity. It works\
    \ the same way in Québec French; the only difference you might notice is the occasional use of Québec-specific\
    \ nouns when they appear in the examples.  \n\nIn this lesson we will use everyday vocabulary that\
    \ is common to both Québec and European French.***  \n\n**#### 1. Replacing *de* + noun**  \n\n- **J’ai\
    \ besoin de sucre. → J’en ai besoin.**  \n- **Il parle de son projet. → Il en parle.**  \n\nIn both\
    \ sentences, **en** replaces the whole *de + noun* group. The verb does **not** change; you simply\
    \ insert **en** before the verb (or before the auxiliary in compound tenses).  \n\n**#### 2. Replacing\
    \ quantities**  \n\n- **Je veux deux pommes. → J’en veux deux.**  \n- **Nous avons acheté trois billets\
    \ pour le concert. → Nous en avons acheté trois.**  \n\nNotice that the numeral stays after **en**;\
    \ the pronoun never takes the place of the number.  \n\n**#### 3. Position rules**  \n\n- In a simple\
    \ present or imperfect, **en** comes **directly before the verb**: *Elle **en** mange souvent.*  \n\
    - With a compound tense, it goes **before the auxiliary**: *Ils **en** ont acheté.*  \n- In affirmative\
    \ commands, **en** follows the verb and is attached with a hyphen: *Manges-en !* (Eat some!).  \n\n\
    **#### Common pitfalls for English speakers**  \n\n1. **Forgetting the preposition** – English often\
    \ drops *of* in “I need sugar,” but French requires *de*. When you replace it with **en**, you must\
    \ still think of the original *de*.  \n2. **Putting the number before the pronoun** – The correct\
    \ order is *en + number* (e.g., *J’en ai trois*), not *trois en*.  \n\n**#### Quick check**  \n\n\
    - *Nous avons besoin de pain.* → **Nous **en** avons besoin.**  \n- *Tu as acheté du lait ?* → **Oui,\
    \ j’**en** ai acheté.**  \n\nKeep practising by spotting any *de*-phrase or quantity and swapping\
    \ it with **en**. It will soon feel as natural as saying *some* in English!***"
- type: table
  id: table
  heading: Le pronom **en** – B1
  columns:
  - Rule
  - Structure
  - Example (Québec)
  - English
  rows:
  - - Replace *de* + noun (or *de* + infinitive)
    - Sujet + en + verbe + reste
    - J’ai besoin **de** sucre → **J’en** ai besoin.
    - I need some sugar.
  - - Replace *de* + noun after a verb of desire/need
    - Sujet + en + verbe + objet-complément
    - Je veux **de** l’eau → **J’en** veux.
    - I want some water.
  - - Replace a quantity expression
    - Sujet + en + verbe + reste
    - Il a acheté trois pommes → **Il en** a acheté trois.
    - He bought three apples.
  - - Negative form
    - ne + en + verbe + pas + reste
    - Je n’ai **pas** de pain → **Je n’en** ai **pas**.
    - I don’t have any bread.
  - - Interrogative (yes/no)
    - Est-ce que + sujet + en + verbe + … ?
    - Est-ce que tu **en** as ? (de lait)
    - Do you have any milk?
  - - Interrogative (wh-question)
    - Combien + en + verbe + sujet + … ?
    - Combien **en** as-tu ? (de pommes)
    - How many (of them) do you have?
