  - j’ai acheté en
  answer_index: 0
  explanation: 'The partitive phrase *du pain* is introduced by **de**. When it is replaced by the pronoun
    **en**, the pronoun stands alone before the verb and the verb is conjugated normally: *j’en ai acheté*.
    Any construction that keeps a partitive article after **en** (e.g., *j’en ai acheté du*) is impossible
    in French. The other options either use the wrong pronoun (*le* for a partitive) or place **en** incorrectly
    after the verb. This makes *j’en ai acheté* the only correct answer.'
- id: ex-10
  grammar_topics:
