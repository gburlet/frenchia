- type: examples
  id: examples
  heading: Exemples de constructions infinitives : à ou de + infinitif (B1)
  examples:
  - fr: J’ai commencé à **faire des courses** au supermarché dès que j’ai fini le travail.
    en: I started shopping at the supermarket as soon as I finished work.
    region: common
  - fr: Elle a appris à **cuisiner** une lasagne pour le **repas** du dimanche.
    en: She learned how to cook a lasagna for Sunday dinner.
    region: common
  - fr: Nous avons décidé de **partir** en randonnée à la montagne pour la **fin de semaine**.
    en: We decided to go on a mountain hike for the weekend.
    region: common
  - fr: Il faut **essayer** de **parler** français chaque fois qu’on est au travail.
    en: One must try to speak French every time we’re at work.
    region: common
  - fr: Je suis content de **voir** que le projet avance bien.
    en: I’m glad to see that the project is progressing well.
    region: common
  - fr: Tu devrais **arrêter** de **fumer** pour ta santé.
    en: You should stop smoking for your health.
    region: common
  - fr: Ils ont oublié **d’acheter** du lait au supermarché.
    en: They forgot to buy milk at the supermarket.
    region: common
  - fr: Nous aimons **continuer** à **explorer** les sentiers du parc national.
    en: We like to keep exploring the trails in the national park.
    region: common
  - fr: Elle a promis de **rappeler** avant la **réunion**.
    en: She promised to call back before the meeting.
    region: common
  - fr: Je suis désolé de **vous déranger** pendant votre pause-café.
    en: I’m sorry to bother you during your coffee break.
    region: common
- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: infinitive constructions'
  body: The à / de + infinitive pattern works the same way in Québec and in France; the grammar does not
    change. The only difference you may notice is the choice of everyday vocabulary. For instance, Québec
    speakers usually say **la fin de semaine** for “the weekend”, while in France the expression is **le
    week-end**. This lexical variation does not affect the use of à or de before an infinitive.
  variants:
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
  - qc: déjeuner (breakfast)
    fr: petit-déjeuner
    en: breakfast
    formality: standard
  - qc: dîner (lunch)
    fr: déjeuner
    en: lunch
    formality: standard
  - qc: souper
    fr: dîner
    en: supper
    formality: standard
  - qc: magasiner
    fr: faire du shopping
    en: to shop
    formality: standard
- type: reading
  id: reading
  title: Un après-midi au parc du Mont-Royal
  passage_fr: 'C’est samedi et moi, Marc, j’ai décidé de **passer** du temps au parc du Mont-Royal. Avant
    de **partir**, j’ai préparé un petit pique-nique : du pain, du fromage à la tranche et des pommes.
    En arrivant, j’ai remarqué que le sentier était très fréquenté, alors j’ai choisi **d’attendre** près
    du kiosque pour **observer** les gens qui **font** du vélo et **jouent** au frisbee. Une famille a
    commencé **à courir** autour du lac, et un groupe d’amis a décidé **de chanter** des chansons sous
    les arbres. J’ai voulu **continuer** à **photographier** les couleurs d’automne, mais il a commencé
    à **pleuvoir** doucement. J’ai donc **cherché** un abri sous un grand érable et j’ai **ouvert** mon
    sac pour **manger** mon sandwich. Avant de **rentrer** chez moi, je me suis rappelé **avoir** oublié
    mon livre de poésie au kiosque, mais le personnel m’a **aidé** à le récupérer. C’était une belle façon
    de **terminer** la journée.'
  translation_en: 'It’s Saturday and I, Marc, decided to spend some time at Mount Royal Park. Before leaving,
    I prepared a small picnic: bread, sliced cheese and apples. Upon arriving, I noticed the trail was
    very busy, so I chose to wait near the kiosk to watch the people who are cycling and playing frisbee.
    A family started running around the lake, and a group of friends decided to sing songs under the trees.
    I wanted to keep photographing the autumn colours, but it began to rain lightly. I therefore looked
    for shelter under a big maple tree and opened my bag to eat my sandwich. Before heading home, I remembered
    that I had forgotten my poetry book at the kiosk, but the staff helped me retrieve it. It was a nice
    way to finish the day.'
  glossary:
  - fr: fréquenté
    en: busy, crowded (of a place) – le sentier était très fréquenté = the trail was very busy.
    pos: adjective
    gender: m
    region: common
    formality: standard
    example_fr: Le café est souvent fréquenté le matin.
    example_en: The café is often busy in the morning.
  - fr: érable
    en: maple tree – a common tree in Québec, especially in autumn.
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Les feuilles d’érable deviennent rouges en automne.
    example_en: Maple leaves turn red in the fall.
  - fr: poésie
    en: poetry
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: J’aime lire de la poésie le soir.
    example_en: I like to read poetry in the evening.
  - fr: kiosque
    en: kiosk, small stand
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le kiosque vend des journaux et des bonbons.
    example_en: The kiosk sells newspapers and candy.
