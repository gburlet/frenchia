  type: multiple_choice
  question: Which sentence uses the correct infinitive construction after the verb oublier?
  options:
  - Ils ont oublié d’acheter du lait au supermarché.
  - Ils ont oublié à acheter du lait au supermarché.
  - Ils ont oublié d’acheté du lait au supermarché.
  - Ils ont oublié d’acheter du lait à la supermarchée.
  answer_index: 0
  explanation: The verb *oublier* is followed by **de + infinitive**. The infinitive *acheter* does not
    change; there is no plural or feminine agreement on the infinitive. Option A is the only correct form.
- id: ex-10
  grammar_topics:
