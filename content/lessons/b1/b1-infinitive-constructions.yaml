  type: multiple_choice
  question: Choose the sentence that correctly follows the verb commencer with the appropriate preposition
    and infinitive.
  options:
  - Elle a commencé à préparer le dîner dès que les invités sont arrivés.
  - Elle a commencé pour préparer le dîner dès que les invités sont arrivés.
  - Elle a commencé à préparer le dîner dès que les invités arriveront.
  - Elle a commencé à préparer le dîner dès que les invités sont arrivé.
  answer_index: 0
  explanation: The verb *commencer* requires **à + infinitive**. The infinitive *préparer* stays unchanged,
    and the subordinate clause uses the correct past tense *sont arrivés*. Options B, C, and D contain
    a wrong preposition, a future-tense error, or an agreement error (missing plural *arrivé*), respectively.
