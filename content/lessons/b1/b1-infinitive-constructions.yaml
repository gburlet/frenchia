sections:
- type: explanation
  id: explanation
  heading: Les constructions infinitives : à ou de + infinitif (B1)
  body: In French, many verbs are followed by an infinitive that is introduced by **à** or **de**. The
    preposition is not optional; it is part of the verb’s pattern and can change the meaning of the whole
    phrase. Below is a quick guide to the most common groups, using neutral everyday vocabulary (e.g.,
    *déjeuner* = breakfast, *dîner* = lunch, *la fin de semaine* = weekend).  ​​​​​### 1. Verbs that take
    **à** + infinitive – the infinitive expresses the action that is started, learned, managed, etc. -
    **Commencer à** + infinitif → to start doing something - *Il a commencé **à chercher** un cadeau dès
    que le magasin a ouvert.* - **Apprendre à** + infinitif → to learn how to - *J’ai appris **à préparer**
    une soupe.* - **Réussir à** + infinitif → to manage to - *Elle a réussi **à finir** son projet avant
    la fin de semaine.* ​### 2. Verbs that take **de** + infinitive – the infinitive expresses an intention,
    omission, decision, etc. - **Essayer de** + infinitif → to try to - *Nous essayons **de trouver**
    un bon restaurant près d’ici.* - **Oublier de** + infinitif → to forget to - *J’ai oublié **de prendre**
    le lait au supermarché.* - **Décider de** + infinitif → to decide to - *Ils ont décidé **de partir**
    en voyage à la campagne.* ​### 3. Verbs that change meaning with **à** vs. **de** – the preposition
    can alter the nuance. - **Finir de** + infinitif → to finish doing something (the action is completed) -
    *Elle a fini **de lire** le rapport avant la réunion.* - **Finir par** + infinitif → to end up doing
    something (often unexpectedly) - *Il a fini **par accepter** l’invitation.* - **Venir de** + infinitif
    → to have just done something - *Je viens **de sortir** du bureau.* - **Venir à** + infinitif → to
    eventually do something, often after a process - *Après des mois de travail, il est venu **à comprendre**
    le problème.* ​### Common pitfalls for English speakers 1. **Confusing the preposition** – the verb
    determines the preposition; you cannot swap them. - *Commencer à* is correct, never *commencer de*
    in modern usage. 2. **Using the wrong preposition after certain verbs** – some verbs require **de**
    (e.g., *oublier de*, *essayer de*), while others require **à** (e.g., *commencer à*, *apprendre à*).
    Adding the wrong preposition makes the sentence ungrammatical. ​### Quick tip If you’re unsure which
    preposition a verb requires, check a reliable dictionary; the entry will list the required preposition
    right after the infinitive definition. ​### Practice Transform the simple sentence into one that uses
    an infinitive construction: - *Je veux manger* → *Je veux **commencer à** cuisiner* (adds the preposition
    **à**).
