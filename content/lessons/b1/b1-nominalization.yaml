  title: Une matinée au marché
  passage_fr: |-
    Ce samedi matin, je suis allé au marché du centre-ville pour profiter **de la fin de semaine**. L’**ouverture** des étals était prévue à 7 h 00, mais j’ai remarqué que le **chantier** à côté du kiosque à fleurs ralentissait le **début** des ventes. Malgré le **bruit** constant, l’**ambiance** était chaleureuse : on pouvait sentir le **parfum** du pain frais, **l’odeur** du café fraîchement moulu et la **senteur** des fruits mûrs.

    Après avoir acheté des pommes et du saumon fumé, je me suis dirigé vers le comptoir du petit café voisin pour prendre un **déjeuner** léger. Le menu proposait un croissant au beurre, une tasse de café et un jus d’orange. Le prix était raisonnable, alors j’ai pris ce déjeuner et je suis rentré à mon appartement pour profiter d’un moment de **repos** avant de me détendre en soirée. Ce fut le point culminant de ma **journée**.
  translation_en: |-
    This Saturday morning I went to the downtown market to enjoy the weekend. The opening of the stalls was scheduled for 7:00 a.m., but I noticed that the construction site next to the flower kiosk was slowing the start of sales. Despite the constant noise, the atmosphere was warm: you could smell the scent of fresh bread, the smell of freshly ground coffee and the aroma of ripe fruit.

    After buying apples and smoked salmon, I headed to the counter of the nearby small café for a light breakfast. The menu offered a butter croissant, a cup of coffee and an orange juice. The price was reasonable, so I took this breakfast and went back to my apartment to enjoy a moment of rest before relaxing in the evening. It was the highlight of my day.
