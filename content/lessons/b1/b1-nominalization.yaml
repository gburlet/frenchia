sections:
- type: explanation
  id: explanation
  heading: '## La nominalisation (B1)'
  body: |-
    *** In French you can often turn a verb or an adjective into a noun. This process is called **nominalisation**. The resulting noun can act as the subject, object, or complement of a sentence, just like any other noun. ***  ### 1. From verbs to nouns

    | Verb | Nominalised noun | Typical article |

    | ------ | ------------------ | ----------------- |

    | **partir** | **le départ** | le (masc.) |

    | **arriver** | **l’arrivée** | la (fém.) |

    | **voir** | **la vue** | la (fém.) |

    | **livrer** | **la livraison** | la (fém.) |

    The pattern is usually **verb + -age, -e, -ée, -ion, -ure, -ement** etc. Many nouns are fixed in the dictionary, so you’ll have to memorize them, but the most common ones follow these suffixes.  ### 2. From adjectives to nouns

    Adjectives are nominalised in two main ways:

    1. **By adding a suffix** (-eur, -té, -esse, -itude, -ité, -ance, etc.). The gender of the new noun is determined by the suffix, not by the original adjective.

    - **grand → la grandeur** (greatness) → *La **grandeur** de la ville se voit dans son parc.*

    - **gentil → la gentillesse** (kindness) → *Sa **gentillesse** a touché tout le monde.*

    - **pauvre → la pauvreté** (poverty) → *La **pauvreté** touche beaucoup de gens.*

    2. **By using the adjective with an article** when it refers to a class of people. In this case the noun keeps the gender of the article.

    - **le jeune / la jeune** = “the young person”

    - **le vieux / la vieille** = “the old person”

    ### 3. Using the nominalised form

    - **Subject**: *Le **départ** était prévu à huit heures.*

    - **Object**: *J’ai apprécié **l’arrivée** du train.*

    - **Complement**: *Il est connu pour son **courage**.*

    - **Neutral example**: *Le plaisir de voyager est incomparable.*  ### 4. Pitfalls for English speakers

    1. **Article choice** – English does not use articles before abstract nouns, but French does. Remember to add *le/la* (or *un/une* when indefinite).

    2. **Gender confusion** – The gender of the nominalised noun cannot be predicted from the verb; it must be learned with the noun. Helpful tip: many suffixes give away the gender (-ée, -ion, -ure are usually feminine; -age, -ment are usually masculine).
