- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: nominalisation in everyday speech'
  body: 'In Québec, turning verbs or adjectives into nouns follows the same grammatical rules as in France
    – the same suffixes (-age, -ment, -ure, etc.) and the same articles are used. There are no systematic
    differences in the way nominalised forms are built. The only noticeable variation is lexical: some
    nouns that are common in France are replaced in Québec by locally-familiar words (for example, *débarbouillette*
    vs. *gant de toilette*). These lexical choices do not change the structure of the nominalisation itself;
    they simply affect which word is chosen.'
  variants: []
- type: reading
