sections:
- type: explanation
  id: explanation
  heading: '## La nominalisation (B1)'
  body: "***\nIn French you can often turn a verb or an adjective into a noun. This process is called\
    \ **nominalisation**. The resulting noun can act as the subject, object, or complement of a sentence,\
    \ just like any other noun.\n\n### 1. From verbs to nouns\n| Verb | Nominalised noun | Typical article\
    \ |\n|------|------------------|-----------------|\n| **partir** | **le départ** | le/la (masc.) |\n\
    | **arriver** | **l’arrivée** | le/la (fém.) |\n| **voir** | **la vue** | le/la |\n| **manger** |\
    \ **le repas** (or **le dîner** for lunch) | le/la |\n\nThe pattern is usually **verb + -age, -e,\
    \ -ée, -ion, -ure, -ement** etc. Many nouns are fixed in the dictionary, so you’ll have to memorize\
    \ them, but the most common ones follow these suffixes.\n\n### 2. From adjectives to nouns\nAdjectives\
    \ become nouns by adding the article that matches the gender of the idea they represent.\n- **grand**\
    \ → **le grand** (the greatness, the big one) → *Le **grand** de la ville est le parc*.\n- **heureux**\
    \ → **le bonheur** (happiness) → *Le **bonheur** vient de petites choses.*\n- **pauvre** → **la pauvreté**\
    \ → *La **pauvreté** touche beaucoup de gens.*\n\nWhen the adjective refers to a group of people,\
    \ the noun is often **le/la + adjective** (e.g., **le jeune**, **la jeune** = “the young person”).\n\
    \n### 3. Using the nominalised form\n- **Subject**: *Le **départ** était prévu à huit heures.*\n-\
    \ **Object**: *J’ai apprécié **l’arrivée** du train.*\n- **Complement**: *Il est connu pour son **courage**.*\n\
    \n### 4. Pitfalls for English speakers\n1. **Article choice** – English does not use articles before\
    \ abstract nouns, but French does. Remember to add *le/la* (or *un/une* when indefinite).  \n2. **Gender\
    \ confusion** – The gender of the nominalised noun is not always predictable from the verb’s gender.\
    \ *Le départ* is masculine, but *l’arrivée* is feminine. Check a dictionary when in doubt.\n\n###\
    \ 5. Québec flavour\nIn Québec you’ll hear **le souper** for “dinner” (the evening meal) and **la\
    \ fin de semaine** for “week‑end”. When nominalising a verb related to food, you might say **le souper**\
    \ → **le souper** (the supper itself) or **le dîner** → **le dîner** (the lunch). The same rules apply.\n\
    ***"
