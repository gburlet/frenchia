    formality: standard
- type: reading
  id: reading
  title: Une journée au marché de la Ville‑Marie
  passage_fr: |-
    Ce samedi matin, je suis allé au marché du Vieux‑Québec pour profiter du **début de la fin de semaine**. Le **départ** des marchands était prévu à 7 h 00, mais j’ai vu que le **chantier** à côté du kiosque à fleurs retardait le **début** de leurs ventes. Malgré le **bruit** constant, l’**ambiance** était chaleureuse : on pouvait sentir le **parfum** du pain frais, le **goût** du sirop d’érable et le **senteur** du fromage en croûte.

    Après avoir acheté des **pommes** et du **saumon** fumé, je me suis dirigé vers le **déjeuner** du petit‑déjeuner du dépanneur voisin. Le **menu** proposait un **sandwich** au smoked meat, une **soupe** aux pois et un **café** bien fort. Le **prix** était raisonnable, alors j’ai pris un **repas** complet et je suis rentré à mon appartement pour profiter du **repos** avant le **dîner** du soir. Le **souper** en famille, avec de la **musique** québécoise, a été le point culminant de ma **journée**.
  translation_en: |-
    This Saturday morning I went to the Old‑Quebec market to enjoy the start of the weekend. The vendors' departure was scheduled for 7:00 a.m., but I saw that the construction site next to the flower kiosk delayed the beginning of their sales. Despite the constant noise, the atmosphere was warm: you could smell the scent of fresh bread, the taste of maple syrup and the aroma of rind cheese.

    After buying apples and smoked salmon, I headed to the breakfast counter of the nearby convenience store. The menu offered a smoked‑meat sandwich, pea soup and a strong coffee. The price was reasonable, so I took a full meal and went back to my apartment to enjoy a rest before the evening dinner. The family supper, with Quebec music, was the highlight of my day.
