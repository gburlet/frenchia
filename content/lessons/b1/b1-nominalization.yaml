- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: nominalisation in everyday speech'
  body: 'In Québec the process of turning verbs or adjectives into nouns works exactly as it does in France
    – the same suffixes (-age, -ment, -ure, etc.) and the same articles are used. The main differences
    are lexical: Québécois speakers more often use words that reflect local life, and the same noun can
    be paired with a different meal name. For example, *dîner* in Québec means the midday meal (lunch),
    whereas in France *dîner* is the evening meal. Likewise, *souper* is the common Québécois word for
    the evening meal (supper), while in France *souper* is an old-fashioned term for the same meal. These
    lexical choices affect the nouns that appear in nominalised expressions.'
