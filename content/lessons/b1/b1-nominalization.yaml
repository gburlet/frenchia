- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: nominalisation in everyday speech'
  body: 'In Québec the process of turning verbs or adjectives into nouns works exactly as it does in France
    – the same suffixes (‑age, ‑ment, ‑ure, etc.) and the same articles are used. The main differences
    are lexical: Québécois speakers more often use words that reflect local life, and the same noun can
    be paired with a different meal name. For example, *le dîner* in France means the main meal of the
    day, whereas in Québec *dîner* is the evening meal (souper in France). Likewise, *le souper* is a
    common Québécois noun for the evening meal, while in France it sounds old‑fashioned. These lexical
    choices affect the nouns that appear in nominalised expressions.'
  variants:
