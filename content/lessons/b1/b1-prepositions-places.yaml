  title: Une fin de semaine à la campagne
  passage_fr: Ce samedi matin, ma sœur et moi avons décidé de passer la fin de semaine à la campagne.
    Nous prenons la route dès 7 h du matin pour aller **à** Ayer’s Cliff, un petit village **en** Estrie.
    Après avoir déposé nos valises **au** chalet, nous partons **au** parc national du Mont-Mégantic pour
    faire une petite **randonnée**. Le sentier nous mène **aux** lacs de la région, où l’on peut voir
    des canards et des castors. Le soir, nous rentrons **au** chalet et préparons un **ragoût** de bœuf
    avec des légumes du jardin. Le lendemain, nous allons **à** Sherbrooke pour visiter le musée d’art
    contemporain, puis nous continuons **en** Ontario pour voir les chutes du Niagara. Avant de repartir,
    nous faisons un arrêt **à** la boutique du coin pour acheter des fruits. Cette fin de semaine nous
    a permis de découvrir **deux provinces** – le Québec et l’Ontario – et de profiter du plein air.
  translation_en: This Saturday morning, my sister and I decided to spend the weekend in the countryside.
    We hit the road at 7 a.m. to go **to** Ayer’s Cliff, a small village **in** Estrie. After dropping
    off our suitcases **at** the chalet, we head **to** Mont-Mégantic National Park for a short **hike**.
    The trail leads us **to** the lakes of the area, where we can see ducks and beavers. In the evening
    we return **to** the chalet and prepare a **beef stew** with garden vegetables. The next day we go
    **to** Sherbrooke to visit the contemporary art museum, then we continue **in** Ontario to see Niagara
    Falls. Before leaving, we make a stop **at** the local shop to buy fruit. This weekend allowed us
    to discover **two provinces** – Québec and Ontario – and enjoy the outdoors.
