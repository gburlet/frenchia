- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: prepositions with places'
  body: The prepositions à, en, au and aux used with cities, provinces and countries are the same in Québec
    French and in European French. The only place-name nuance is that the province is *au Québec* while
    the city is *à Québec*; the same rule applies everywhere else (e.g., *à Paris*, *en France*, *au Manitoba*, *aux
    Territoires du Nord-Ouest*). The lexical differences for meals and the weekend do not affect the prepositions.
  variants: []
- type: reading
