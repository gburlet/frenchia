- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: prepositions with places'
  body: "The choice of à, en, au and aux for cities, provinces and countries is the same in Québec French\
    \ and in European French. The only real difference is how the territory itself is spoken: in Québec\
    \ we say *au Québec* for the province and *à Québec* for the city, while in France the name refers\
    \ only to the province/region, so you would never hear *au Québec*. Apart from that, the rule applies\
    \ equally to French regions (e.g., *au Rhône‑Alpes*, *en Bretagne*, *aux Pays‑de‑la‑Loire*). \n\n\
    **Québec ↔ France ↔ English variants**\n1. *déjeuner* – Québec: breakfast; France: lunch (English:\
    \ breakfast/lunch)\n2. *dîner* – Québec: lunch; France: dinner (English: lunch/dinner)\n3. *souper*\
    \ – Québec: dinner (no everyday French equivalent) (English: dinner)\n4. *fin de semaine* – Québec:\
    \ weekend; France: week‑end (English: weekend)\n5. *magasiner* – Québec: to shop; France: faire du\
    \ shopping (English: to shop)\n6. *dépanneur* – Québec: corner‑store/convenience shop; France: épicerie,\
    \ supérette (English: convenience store)"
