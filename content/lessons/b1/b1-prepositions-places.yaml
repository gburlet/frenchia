sections:
- type: explanation
  id: explanation
  heading: Les prépositions avec les lieux (à, en, au, aux)
  body: "***\n### How to choose the right preposition\n\nIn French the preposition that introduces a place\
    \ depends on **the type of place** and **its gender**.  The rule is simple enough to remember once\
    \ you see the pattern.\n\n| Kind of place | Masculine singular | Feminine singular | Plural |\n|---------------|-------------------|-------------------|--------|\n\
    | **City / town** | **à** + name (no article) | — | — |\n| **Province, state, region** | **au** (masc.)\
    \ | **en** (fem.) | **aux** (plural) |\n| **Country** | **au** (masc.) | **en** (fem.) | **aux** (plural)\
    \ |\n\n#### 1. Cities and towns – **à**\nUse **à** directly before the city name, without an article.\n\
    - **Je vais à Montréal** (I’m going to Montreal).\n- **Elle habite à Québec** (She lives in Québec\
    \ – the city).  \n*Pitfall*: English speakers often add *le* or *la* (e.g., *à le Montréal*). In French\
    \ the article is omitted.\n\n#### 2. Provinces, states, regions – **au / en / aux**\n- Masculine singular\
    \ provinces use **au**: **au Québec**, **au Manitoba**.\n- Feminine singular provinces use **en**:\
    \ **en Ontario**, **en Alberta** (both are actually masculine in French, but the rule for countries\
    \ applies; see below).\n- Plural provinces use **aux**: **aux Maritimes**, **aux Territoires du Nord‑Ouest**.\n\
    \n#### 3. Countries – **au / en / aux**\nThe same pattern as provinces, but remember the gender of\
    \ the country name:\n- **au Canada**, **au Brésil** (masc.)\n- **en France**, **en Allemagne** (fem.)\n\
    - **aux États‑Unis**, **aux Pays‑Bas** (plural)\n*Pitfall*: Confusing **en** with **au** for countries\
    \ that sound masculine. The gender is lexical, not logical; you must memorize it (e.g., *le Canada*\
    \ → **au Canada**, not *en Canada*).\n\n#### 4. Quick check\n- **Je travaille ___ (province) Québec**\
    \ → **au Québec**\n- **Nous partons ___ (country) Espagne** → **en Espagne**\n- **Ils habitent ___\
    \ (city) Toronto** → **à Toronto**\n\nKeep this table handy, and the prepositions will soon feel automatic.\
    \  \n***"
