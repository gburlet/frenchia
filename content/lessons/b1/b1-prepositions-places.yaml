sections:
- type: explanation
  id: explanation
  heading: Les prépositions avec les lieux (à, en, au, aux)
  body: |-
    How to choose the right preposition 🗺️

    In French the preposition that introduces a place depends on **the type of place** and **its gender or initial sound**.

    Below are the rules you need to remember; a short table is provided later for quick reference.

    ### 1. Cities and towns – **à**

    Use **à** directly before the city name, without an article.

    - **Je vais à Montréal.** (I’m going to Montreal.)

    - **Elle habite à Québec.** (She lives in Québec – the city.)

    *Tip*: never add *le* or *la* (e.g., *à le Montréal*).

    ### 2. Provinces, states, regions – **au / en / aux**

    - **Masculine, consonant-initial** names take **au**: **au Québec**, **au Manitoba**.

    - **Masculine names that begin with a vowel** (or a silent *h*) take **en**: **en Ontario**.

    - **Feminine names** (whether they start with a vowel or a consonant) also take **en**: **en Alberta**, **en Nouvelle-Écosse**, **en Saskatchewan**, **en Colombie-Britannique**.

    - **Plural names** take **aux**: **aux Maritimes**, **aux Territoires du Nord-Ouest**.

    *Note*: for some large regions you may also hear **dans les …** (e.g., *dans les Territoires du Nord-Ouest*), but **aux** is the standard preposition.

    ### 3. Countries – **au / en / aux**

    The same pattern applies, but the gender is lexical (you have to memorise it).

    - **Masculine, consonant-initial**: **au Brésil**, **au Mexique**.

    - **Masculine, vowel-initial**: **en Israël**, **en Iran**.

    - **Feminine**: **en France**, **en Allemagne**, **en Italie**.

    - **Plural**: **aux États-Unis**, **aux Pays-Bas**.

    *Tip*: the gender of a country name does not follow logical rules; just learn the article that goes with each name.

    ### 4. Quick check

    - **Je travaille ___ (province) Québec** → **au Québec**

    - **Nous partons ___ (country) Espagne** → **en Espagne**

    - **Ils habitent ___ (city) Toronto** → **à Toronto**

    ### 5. Handy reference table

    | Type of place | Masculine singular (consonant-initial) | Masculine singular (vowel-initial) | Feminine singular | Plural |
    | --- | --- | --- | --- | --- |
    | Province / state / region | au + name | en + Ontario | en + name (e.g., Alberta, Nouvelle-Écosse) | aux + names |
    | Country | au + name | en + name (e.g., Israël, Iran) | en + name | aux + names |

    Keep this table handy, and the prepositions will soon feel automatic.
