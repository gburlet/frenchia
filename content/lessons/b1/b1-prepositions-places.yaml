- type: reading
  id: reading
  title: Un week‑end à la campagne
  passage_fr: Ce samedi‑matin, ma sœur et moi avons décidé de passer le week‑end à la campagne. Nous prenons
    la route dès 7 h du matin pour aller **à** Saint‑Éphrem‑de‑Tring, un petit village situé **en** Estrie.
    Après avoir déposé nos valises à la maison de nos parents, nous partons **au** parc national du Mont‑Mégantic
    pour faire une petite randonnée. Le sentier nous mène **aux** lacs de la région, où l’on peut voir
    des canards et des castors. Le soir, nous rentrons **au** chalet pour préparer le souper. Ma sœur
    adore cuisiner ; elle fait toujours un ragoût de bœuf avec des légumes du jardin. Le lendemain, nous
    allons **à** Sherbrooke pour visiter le musée d’art contemporain, puis nous continuons **en** Ontario
    pour voir la fameuse chute du Niagara. Avant de repartir, nous faisons un arrêt **au** dépanneur du
    coin pour acheter du sirop d’érable et des beignes. Ce week‑end nous a permis de découvrir plusieurs
    provinces et de profiter du plein air québécois.
  translation_en: This Saturday morning, my sister and I decided to spend the weekend in the countryside.
    We hit the road at 7 a.m. to go **to** Saint‑Éphrem‑de‑Tring, a small village **in** the Estrie region.
    After dropping off our suitcases at our parents’ house, we head **to** Mont‑Mégantic National Park
    for a short hike. The trail leads us **to** the lakes of the area, where we can see ducks and beavers.
    In the evening we return **to** the chalet to prepare supper. My sister loves to cook; she always
    makes a beef stew with vegetables from the garden. The next day we go **to** Sherbrooke to visit the
    contemporary art museum, then we continue **in** Ontario to see the famous Niagara Falls. Before leaving,
    we stop **at** the local convenience store to buy maple syrup and donuts. This weekend allowed us
    to discover several provinces and enjoy the Quebec outdoors.
