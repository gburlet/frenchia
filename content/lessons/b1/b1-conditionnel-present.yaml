- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the présent conditionnel'
  body: "In everyday Québec speech the présent conditionnel is used just as it is in France – mainly for\
    \ polite requests, wishes and unreal/hypothetical situations. The grammar (future stem + imperfect\
    \ endings) is identical, and the same set of polite formulas (e.g., *Est‑ce que vous pourriez… ?*,\
    \ *J’aimerais bien…*) are heard on both sides of the border. What does change are the lexical items\
    \ that naturally surround the conditional. When you embed the verb in a Québec‑flavoured context you’ll\
    \ often see local vocabulary, whereas a French speaker would choose the European equivalent.\n\n**Typical\
    \ Québec/France/English variants**\n1. *magasiner* (Québec) / *faire du shopping* (France) / to shop\n\
    2. *fin de semaine* (Québec) / *week‑end* (France) / weekend\n3. *souper* (Québec) / *dîner* (France) / supper\n\
    4. *déjeuner* (Québec = breakfast) / *petit‑déjeuner* (France) / breakfast\n5. *dépanneur* (Québec = convenience\
    \ store) / *épicerie de quartier* (France) / corner store\n6. *station de métro* (Québec) / *station\
    \ de métro* (France – same term, but Québec often says *station de métro* while some French speakers\
    \ may say *station de métro* or simply *station*). \n\nAside from these lexical tweaks, the conditional\
    \ itself functions the same way in both varieties."
  variants: []
- type: reading
  id: reading
  title: Un après‑midi au parc du Plateau
  passage_fr: "C’est un samedi d’automne et le soleil commence à se coucher derrière les toits du Plateau.\
    \ Marie et son ami Lucas décident de se retrouver au parc : ils aimeraient bien profiter du beau temps\
    \ avant que la fraîcheur de la fin de semaine n’arrive. \n\n« Si tu pouvais amener ton chien, on aurait\
    \ encore plus de raisons de rester dehors, » propose Lucas. Marie répond : « J’aimerais bien que mon\
    \ petit — il s’appelle Biscotte — puisse courir librement, mais il a un rendez‑vous chez le vétérinaire\
    \ cet après‑midi. » \n\nLucas sourit et dit : « Pas de problème, on pourrait simplement prendre un\
    \ pique‑nique. Vous pourriez m’apporter votre tarte aux pommes ? » \n\nMarie acquiesce et ajoute :\
    \ « Si le temps reste doux, on resterait jusqu’au crépuscule et on écouterait les musiciens de rue\
    \ qui jouent souvent ici. » \n\nIls s’installent sur une couverture, ouvrent le panier et, pendant\
    \ que le vent frais souffle doucement, ils imaginent déjà la prochaine sortie au dépanneur pour acheter\
    \ du sirop d’érable à verser sur leurs crêpes du dimanche matin."
  translation_en: |-
    It’s an autumn Saturday and the sun is beginning to set behind the roofs of the Plateau. Marie and her friend Lucas decide to meet at the park: they would like to enjoy the nice weather before the chill of the weekend arrives.

    "If you could bring your dog, we would have even more reason to stay outside," Lucas suggests. Marie replies: "I would love my little one—his name is Biscotte—to be able to run freely, but he has a vet appointment this afternoon."

    Lucas smiles and says: "No problem, we could simply have a picnic. Could you bring your apple pie?"

    Marie nods and adds: "If the weather stays mild, we would stay until dusk and we would listen to the street musicians who often play here."

    They spread out a blanket, open the basket and, while the cool wind blows gently, they already imagine the next trip to the corner dépanneur to buy maple syrup to pour over their Sunday‑morning pancakes.
