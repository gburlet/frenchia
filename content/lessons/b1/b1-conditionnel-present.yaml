sections:
- type: explanation
  id: explanation
  heading: Le conditionnel présent – Polite Requests, Wishes & Hypotheses
  body: '*****Forming the present conditional**  The present conditional is built on the **future stem**
    (the infinitive for regular verbs, or the irregular future stem) + the **imperfect endings**: **‑ais,
    ‑ais, ‑ait, ‑ions, ‑iez, ‑aient**.  | Verb | Future stem | Conditional form | |------|-------------|-----------------|
    | parler | parler‑ | **je parlerais** | | finir | finir‑ | **tu finirais** | | vendre | vendr‑ | **il
    vendrait** | | être | ser‑ | **nous serions** | | avoir | aur‑ | **vous auriez** | | aller | ir‑ |
    **ils iraient** |  *Note:* In Québec French the same forms are used; the only difference is usually
    lexical (e.g., **souper** instead of *dîner* for the evening meal).***  ### **Main uses**  1. **Polite
    requests** – The conditional softens a request, much like “could you…?”   - **Pourriez‑vous me passer
    le sel, s’il vous plaît ?** (Could you pass me the salt?)   - *European French*: *Pourriez‑vous…*
    – identical.  2. **Wishes / unreal desires** – Often introduced by *j’aimerais…* or by *si* + imperfect.   -
    **J’aimerais visiter le Vieux‑Québec cet été.** (I would like to visit Old Quebec this summer.)  3.
    **Hypotheses about the present or future** – When the condition is uncertain.   - **Si j’avais plus
    de temps, je lirais plus souvent.** (If I had more time, I would read more often.)  ### **Common pitfalls
    for English speakers**  - **Using the conditional after *si***: The conditional never follows *si*;
    the *si*‑clause takes the **imparfait**, and the result clause takes the **conditional**. Correct:
    *Si j’avais le temps, je viendrais*; **not** *Si j’aurais le temps, je viendrais*.  - **Confusing
    the future with the conditional**: English “would” can also translate to the future in some contexts,
    but French distinguishes them. Use the **future stem** + imperfect endings for the conditional (e.g.,
    *ser‑* → *serais*), and the simple future endings for the future (e.g., *ser‑* → *serai*).  - **Dropping
    the future stem for irregular verbs**: Remember to keep the irregular future stem, not the infinitive.
     *être → ser‑* → *serais*, *avoir → aur‑* → *aurais*, *aller → ir‑* → *irais*, etc.  ### **Quick tip**  When
    you’re unsure whether to use the conditional or the future, ask yourself: *Is the statement a polite
    request, a wish, or a hypothesis?* If yes, go with the conditional; otherwise, use the future.***'
