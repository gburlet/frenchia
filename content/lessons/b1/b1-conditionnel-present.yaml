- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using the conditionnel présent'
  body: In everyday Québec speech the **conditionnel présent** is used just as it is in France – mainly
    for polite requests, wishes and unreal/hypothetical situations. The grammar (future stem + imperfect
    endings) is identical, and the same set of polite formulas (e.g., *Est‑ce que vous pourriez… ?*, *J’aimerais
    bien…*) are heard on both sides of the border. What does change are the lexical items that naturally
    surround the conditional. When you embed the verb in a Québec‑flavoured context you’ll often see local
    vocabulary, whereas a French speaker would choose the European equivalent.  ​**Typical Québec / France
    / English variants**  ​1. *magasiner* (Québec) / *faire du shopping* (France) / to shop  ​2. *fin
    de semaine* (Québec) / *week‑end* (France) / weekend  ​3. *souper* (Québec) / *dîner* (France) / supper
     ​4. *déjeuner* (Québec = breakfast) / *petit‑déjeuner* (France) / breakfast  ​5. *dépanneur* (Québec = convenience
    store) / *épicerie de quartier* (France) / corner store
