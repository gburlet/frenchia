- type: reading
  id: reading
  title: Un après‑midi au parc du Plateau
  passage_fr: |-
    C’est un samedi d’automne et le soleil commence à se coucher derrière les toits du Plateau. Marie et son ami Lucas décident de se retrouver au parc : ils aimeraient bien profiter du beau temps avant que la fraîcheur de la fin de semaine n’arrive.

    « Si tu pouvais amener ton chien, on aurait encore plus de raisons de rester dehors, » propose Lucas. Marie répond : « J’aimerais bien que mon petit — il s’appelle Biscotte — puisse courir librement, mais il a un rendez‑vous chez le vétérinaire cet après‑midi. »

    Lucas sourit et dit : « Pas de problème, on pourrait simplement faire un pique‑nique. Tu pourrais m’apporter ta tarte aux pommes ? »

    Marie acquiesce et ajoute : « Si le temps restait doux, on resterait jusqu’au crépuscule et on écouterait les musiciens de rue qui jouent souvent ici. »

    Ils s’installent sur une couverture, ouvrent le panier et, pendant que le vent frais souffle doucement, ils imaginent déjà la prochaine sortie au dépanneur pour acheter du sirop d’érable à verser sur leurs crêpes du dimanche matin.
  translation_en: |-
    It’s an autumn Saturday and the sun is beginning to set behind the roofs of the Plateau. Marie and her friend Lucas decide to meet at the park: they would like to enjoy the nice weather before the chill of the weekend arrives.

    "If you could bring your dog, we would have even more reason to stay outside," Lucas suggests. Marie replies: "I would love my little one—his name is Biscotte—to be able to run freely, but he has a vet appointment this afternoon."

    Lucas smiles and says: "No problem, we could simply have a picnic. Could you bring your apple pie?"

    Marie nods and adds: "If the weather stayed mild, we would stay until dusk and we would listen to the street musicians who often play here."

    They spread out a blanket, open the basket and, while the cool wind blows gently, they already imagine the next trip to the corner dépanneur to buy maple syrup to pour over their Sunday‑morning pancakes.
