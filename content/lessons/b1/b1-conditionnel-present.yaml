sections:
- type: explanation
  id: explanation
  heading: Le conditionnel présent – Polite Requests, Wishes & Hypotheses
  body: |-
    ***
    ### Forming the present conditional
    The present conditional is built on the **future stem** (the infinitive for regular verbs, or the irregular future stem) + the **imperfect endings**: **-ais, -ais, -ait, -ions, -iez, -aient**.

    | Verb | Future stem | Conditional form |
    |------|-------------|-----------------|
    | parler | parler‑ | **je parlerais** |
    | finir | finir‑ | **tu finirais** |
    | vendre | vendr‑ | **il vendrait** |
    | être | ser‑ | **nous serions** |
    | avoir | aur‑ | **vous auriez** |
    | aller | ir‑ | **ils iraient** |

    *Note:* In Québec French the same forms are used; the only lexical difference is often the choice of vocabulary (e.g., **souper** instead of *dîner* when talking about the evening meal).

    ### Main uses
    1. **Polite requests** – The conditional softens a request, much like “could you…?”
       - **Pourriez‑vous me passer le sel, s’il vous plaît?** (Could you pass me the salt?)
       - *European French*: *Pourriez‑vous…* – identical.
    2. **Wishes / unreal desires** – Often introduced by *si* + imperfect, or by *j’aimerais…*
       - **J’aimerais visiter le Vieux‑Québec cet été.** (I would like to visit Old Quebec this summer.)
    3. **Hypotheses about the present or future** – When the condition is uncertain.
       - **Si j’avais plus de temps, je lirais plus souvent.** (If I had more time, I would read more often.)

    ### Common pitfalls for English speakers
    - **Confusing the conditional with the future**: English “would” can also translate to the future in some contexts, but in French the conditional always uses the future stem + imperfect endings. Remember the *future* stem, not the infinitive, for irregular verbs like *être → ser‑*.
    - **Missing the elision before *‑ais / ‑ait***: When the stem ends with a vowel, you still keep the full ending (e.g., **j’irais**, not *j’ir‑ais*). The written form is *irais*, but the pronunciation contracts to *iʁɛ*.

    ### Quick tip
    When you’re unsure whether to use the conditional or the future, ask yourself: *Is the statement a polite request, a wish, or a hypothesis?* If yes, go with the conditional; otherwise, use the future.
    ***
