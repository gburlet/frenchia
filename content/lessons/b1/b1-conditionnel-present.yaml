- type: regional_note
  id: regional-note
  heading: Politeness and the conditionnel présent in Québec French
  body: 'In everyday Québec speech the **conditionnel présent** is used just as it is in France – mainly
    for polite requests, wishes and unreal or hypothetical situations. The grammar (future stem + imperfect
    endings) is identical, and the same set of polite formulas are heard on both sides of the border.
     For example, you can choose among several levels of politeness when you make a request:  *Pourriez-vous…
    ?* (most formal), *Est-ce que vous pourriez… ?* (slightly less formal), or *Tu pourrais… ?* (informal).
    All of these use the conditional and are perfectly natural in Québec French.'
