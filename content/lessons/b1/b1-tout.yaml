- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the use of *tout*'
  body: In everyday speech the three functions of *tout* (adjective, pronoun, adverb) are identical in
    Québec and in France. Québécois speakers keep the same agreement rules and the same set of fixed expressions
    (e.g., *tout le monde*, *tout à coup*, *tout de suite*). The only noticeable regional flavour is the
    surrounding vocabulary – you’ll hear *souper*, *fin de semaine* or *dépanneur* in the examples, but
    the grammar of *tout* itself does not change.
  variants: []
- type: reading
  id: reading
  title: Un après-midi au parc du Plateau
  passage_fr: C’était une belle fin de semaine d’automne et le parc du Plateau était plein de monde. **Tout**
    le quartier s’était rassemblé pour le festival de musique. Des groupes locaux jouaient sur la scène
    pendant que les familles **toutes** s’installaient sur les couvertures. **Tous** les enfants couraient
    autour du grand chêne, et **toutes** les mamans surveillaient leurs petits avec le sourire. Au stand
    de crêpes, **tout le monde** pouvait choisir entre le sirop d’érable, la confiture de bleuets ou le
    Nutella. **Tout** était décoré de guirlandes orange et rouge, rappelant les couleurs de l’automne
    québécois. Vers la fin du concert, le groupe principal a annoncé qu’il jouerait **tout** son répertoire
    en français, même les chansons les plus connues en anglais. Après le spectacle, les participants sont
    repartis, **tous** contents, en se promettant de revenir l’an prochain pour **tout** recommencer.
  translation_en: It was a beautiful autumn weekend and the Plateau park was full of people. **All** the
    neighbourhood had gathered for the music festival. Local bands played on the stage while families
    **all** settled on blankets. **All** the children ran around the big oak, and **all** the mothers
    watched their little ones with a smile. At the crepe stand, **everyone** could choose between maple
    syrup, blueberry jam or Nutella. **Everything** was decorated with orange and red garlands, recalling
    the colours of Quebec autumn. Near the end of the concert, the headline group announced that they
    would play **their entire** repertoire in French, even the songs best known in English. After the
    show, the participants left, **all** happy, promising to come back next year to **do it all over again**.
