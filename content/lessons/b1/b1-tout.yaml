sections:
- type: explanation
  id: explanation
  heading: '# Les emplois de *tout* – B1'
  body: |-
    ***
    In Québec French, *tout* (and its gender‑/number‑forms *toute, tous, toutes*) can act as an **adjective**, a **pronoun**, or an **adverb**.  The choice of form depends on what it modifies and on the grammatical gender/number of the noun it refers to.

    ### 1. *Tout* as an adjective (meaning “all, every, whole”)
    - It agrees with the noun it directly modifies.
    - When the noun begins with a vowel or a mute *h*, the *t* is kept (no elision).

    **Examples**
    - **Tout le monde** est arrivé. – *Everyone has arrived.*
    - **Toute la famille** vient ce soir. – *The whole family is coming tonight.*
    - **Tous les matins** je bois du café. – *Every morning I drink coffee.*
    - **Toutes les semaines** on fait du patin à glace. – *Every week we go ice‑skating.*

    ### 2. *Tout* as a pronoun (standing for a noun already mentioned)
    - It replaces a noun and therefore must agree with the noun it replaces.
    - In spoken Québec, the pronoun is often preceded by *le*/*la* for emphasis: *le tout*, *la toute* (still informal).

    **Examples**
    - J’ai lu **tous** les articles. → **Tous** étaient intéressants. – *I read all the articles. They were interesting.*
    - Elle a mangé **toute** la tarte. → **Toute** était délicieuse. – *She ate the whole pie. It was delicious.*

    ### 3. *Tout* as an adverb (meaning “very, completely”)
    - It is **invariable** when it modifies an adjective or another adverb, **except** when the following word begins with a consonant and is feminine; then *tout* becomes *toute* for euphony.
    - Common pitfall: English speakers often add an *e* to *tout* before any feminine adjective (e.g., *tout* *bonne*). The rule is stricter.

    **Examples**
    - C’est **tout** simple. – *It’s very simple.*
    - Elle est **toute** petite. – *She is very small.* (feminine adjective starting with a consonant)
    - Il travaille **tout** rapidement. – *He works very quickly.*

    ### Common pitfalls for English speakers
    1. **Agreement confusion** – Remember that *tout* as an adjective must agree with the noun, but as an adverb it stays unchanged (except the *toute* exception above).
    2. **Elision with vowels** – Do **not** drop the *t* before a vowel: *tout autre* (not *tou autre*).

    Keep these patterns in mind, and you’ll sound natural both in Montréal and in any other French‑speaking region of Québec!***
