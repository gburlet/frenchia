sections:
- type: explanation
  id: explanation
  heading: '# Les emplois de *tout* – B1'
  body: '***  In Québec French, *tout* (and its gender-/number-forms *toute, tous, toutes*) can function
    as an **adjective**, a **pronoun**, or an **adverb**. The form you use depends on what it modifies
    and on the gender/number of the noun it refers to.  ***  ### 1. *Tout* as an adjective (meaning “all,
    every, whole”)  - It **agrees** with the noun it directly modifies.  - When the noun begins with a
    vowel or a mute *h*, the *t* is kept (no elision).  **Examples**  - **Tout le monde** est arrivé.
    – *Everyone has arrived.*  - **Toute la famille** vient ce soir. – *The whole family is coming tonight.*  -
    **Tous les matins**, je bois du café. – *Every morning I drink coffee.*  - **Toutes les semaines**,
    on fait du patin à glace. – *Every week we go ice-skating.*  ### 2. *Tout* as a pronoun (standing
    for a noun already mentioned)  - It replaces a noun; the pronoun itself does **not** change form.  -
    Agreement is shown by the verb or by a later adjective, so *tout* can become *tous* or *toutes* when
    it refers to a plural or feminine antecedent.  **Examples**  - **Tout** est prêt. – *Everything is
    ready.*  - J’ai **tout** compris. – *I understood everything.*  - **Ils** sont **tous** venus. – *They
    (masc.) all came.*  - **Elles** ont **toutes** fini. – *They (fem.) all finished.*  ### 3. *Tout*
    as an adverb (meaning “very, completely”)  - It is **invariable** when it modifies an adjective or
    another adverb, **except** when the following word is a feminine adjective that begins with a consonant
    or an aspirated *h*; in that case *tout* becomes *toute* (or *toutes* for the plural) for euphony.  -
    With a feminine adjective that begins with a vowel or mute *h*, the form stays *tout*.  **Examples**  -
    C’est **tout** simple. – *It’s very simple.*  - Elle est **toute** petite. – *She is very small.*
    (feminine adjective, consonant start)  - Elle est **tout** étonnée. – *She is very surprised.* (feminine
    adjective, vowel start)  - Il travaille **tout** rapidement. – *He works very quickly.*  ### Common
    pitfalls for English speakers  1. **Agreement confusion** – Remember: as an **adjective**, *tout*
    agrees with the noun (*tout le livre*, *tous les livres*, *toute la maison*, *toutes les maisons*).
    As an **adverb**, it stays unchanged except for the *toute*/*toutes* euphonic rule above.  2. **Elision
    with vowels** – Do **not** drop the *t* before a vowel. The fixed expression **tout le monde** always
    keeps the *t* and takes a singular verb: *Tout le monde est arrivé.*  3. **Pronoun vs. adjective**
    – In sentences like *Nous avons tous fini*, *tous* is a floating pronoun meaning “all of us”. It does
    not modify a noun, so its form follows the gender of the group (*tous* for a mixed or all-masculine
    group, *toutes* for an all-feminine group).  Keep these patterns in mind, and you’ll sound natural
    both in Montréal and throughout Québec!***'
