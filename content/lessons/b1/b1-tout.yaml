    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: Des guirlandes décorent la scène.
    example_en: Garlands decorate the stage.
  - fr: répertoire
    en: repertoire, setlist
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le groupe a joué tout son répertoire.
    example_en: The band played their whole repertoire.
  - fr: promettant
    en: promising
    pos: verb
    region: common
    formality: standard
