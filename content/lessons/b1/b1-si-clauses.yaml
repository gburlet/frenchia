sections:
- type: explanation
  id: explanation
  heading: '### Les phrases avec **si** (real vs. hypothetical conditions) – B1'
  body: |-
    In French, **si** introduces a condition and the verb tense tells you whether the condition is considered possible (real) or purely imagined (hypothetical).  Two main patterns are used at the B1 level:

    1. **Si + présent**, **future simple** (or imperative) – a real or likely condition.
       *Example:* **Si tu viens ce soir, on mange au dépanneur.** → *If you come tonight, we’ll eat at the corner store.*
       Here the result clause uses the **future simple** because the speaker sees the outcome as a future possibility.

    2. **Si + imparfait**, **conditionnel présent** – an unreal or contrary‑to‑fact condition.
       *Example:* **Si j’avais plus de temps, je voyagerais au Québec.** → *If I had more time, I would travel to Quebec.*
       The **imparfait** shows the condition is not true now, and the **conditionnel présent** expresses the imagined result.

    ### Common pitfalls
    - **Mixing tenses**: English speakers often say *« Si je suis fatigué, je me reposerai »* (present + future). In French the correct real‑condition form is **Si je suis fatigué, je me reposerai** *only* when the result is a future certainty; otherwise use the present in both clauses: **Si je suis fatigué, je me repose**.
    - **Using the conditional in the si‑clause**: Never say *« Si je serais riche… »*. The **si‑clause** never takes the conditional; it must be **si + présent** (real) or **si + imparfait** (unreal).

    Remember: the **si‑clause** tells us *whether the condition is real or imagined*; the **main clause** follows with the appropriate future or conditional tense. Practice swapping the two patterns with everyday Québec contexts—*déjeuner*, *souper*, *magasiner*—to make them stick.
