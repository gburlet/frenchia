- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using si-clauses'
  body: The grammatical pattern of si-clauses (real + present/future, hypothetical + imparfait/conditionnel)
    is the same in Québec and in France. The contraction *s’il* (si + il) and *s’ils* (si + ils) is used
    only before the pronouns *il* and *ils* (e.g., *S’il pleut, on reste à la maison*). When *si* is followed
    by *elle*, *on*, *un*… the form remains unchanged (*si elle veut*, *si on part*, *si un jour*). There
    is no regional difference in the use of si-clauses; the choice between *si* and its contracted forms
    depends solely on these elision rules, not on the region.
  variants: []
