sections:
- type: explanation
  id: explanation
  heading: '### Les phrases avec **si** (real vs. hypothetical conditions) – B1'
  body: "In French, **si** introduces a condition, and the tense of the two clauses tells you whether\
    \ the condition is considered possible (real) or purely imagined (hypothetical). Three main patterns\
    \ are used at the B1 level:  \n\n1. **Si + présent**, **present, future simple or imperative** – a\
    \ real or likely condition. \n*Example:* **Si tu viens demain, on ira au parc.** → *If you come tomorrow,\
    \ we’ll go to the park.*  The result clause can be in the present (when the outcome is seen as certain)\
    \ or in the future simple (when it is a future possibility). \n\n2. **Si + imparfait**, **conditionnel\
    \ présent** – an unreal or contrary-to-fact condition. \n*Example:* **Si j’avais plus d’argent, j’achèterais\
    \ un vélo.** → *If I had more money, I would buy a bike.*  The **imparfait** shows the condition is\
    \ not true now, and the **conditionnel présent** expresses the imagined result. \n\n3. **Si + plus-que-parfait**,\
    \ **conditionnel passé** – a past unreal condition (the speaker is talking about something that did\
    \ not happen). \n*Example:* **Si tu avais étudié, tu aurais réussi l’examen.** → *If you had studied,\
    \ you would have passed the exam.*  The **plus-que-parfait** marks a condition that was false in the\
    \ past, and the **conditionnel passé** shows the imagined past consequence. \n\n### Common pitfalls\n\
    - **Future after *si***: English speakers sometimes say *« Si je serai fatigué, je me reposerai »*\
    \ or *« Si tu viendras, on ira au parc »* (future in the *si*-clause). In French the *si*-clause never\
    \ takes the future; it must be **si + présent** for real conditions (e.g., *Si je suis fatigué, je\
    \ me repose* or *Si je suis fatigué, je me reposerai*) or **si + imparfait** for unreal conditions.\
    \ \n- **Using the conditional in the *si*-clause**: Never say *« Si je serais riche… »*. The **si*-clause**\
    \ never takes the conditional; it must be **si + présent** (real) or **si + imparfait** (unreal).\
    \ \n\nRemember: the **si*-clause** tells us *whether the condition is real or imagined*; the **main\
    \ clause** follows with the appropriate present, future, or conditional tense. Practice swapping the\
    \ three patterns with everyday situations such as going to the library, preparing a meal, or planning\
    \ a weekend trip, to make them stick."
