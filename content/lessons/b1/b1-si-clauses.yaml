- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Using si‑clauses'
  body: The grammatical pattern of si‑clauses (real + present/future, hypothetical + imparfait/conditionnel)
    is identical in Québec and in France; speakers in both regions follow the same tense rules. What does
    change are the everyday words that appear in the example sentences. When you write or speak in Québec,
    you’ll often hear the local vocabulary, while in France the European equivalents are used.
