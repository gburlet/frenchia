- type: reading
  id: reading
  title: Une après‑midi au parc du Mont‑Royal
  passage_fr: 'C’est un samedi d’automne et le temps est frais, mais le soleil brille. **Si** il fait
    beau, on décide d’aller au parc du Mont‑Royal pour profiter de la vue. **Si** tu arrives avant midi,
    on pourra prendre le déjeuner dans le petit café du coin, où ils servent des bagels au saumon. **Si**
    le vent se lève, on se réfugiera sous le grand érable près du sentier. **Si** on a de la place, on
    s’assiéra sur la pelouse et on jouera à la pétanque jusqu’à la fin de semaine. **Si** tu veux, on
    peut aussi passer au dépanneur pour acheter des boissons fraîches et des chips. **Si** la météo change,
    on rentrera à la maison et on préparera un souper réconfortant : une soupe aux pois et du pain grillé.
    Dans tous les cas, on passera un bon moment, parce que le parc du Mont‑Royal est toujours agréable,
    même quand il fait un peu froid.'
  translation_en: 'It’s an autumn Saturday and the weather is cool, but the sun is shining. **If** the
    weather is nice, we decide to go to Mount‑Royal Park to enjoy the view. **If** you arrive before noon,
    we’ll be able to have breakfast at the little café around the corner, where they serve salmon bagels.
    **If** the wind picks up, we’ll take shelter under the big maple tree near the trail. **If** there’s
    room, we’ll sit on the grass and play pétanque until the weekend. **If** you want, we can also stop
    at the corner store to buy cold drinks and chips. **If** the weather changes, we’ll go back home and
    make a comforting dinner: pea soup and toasted bread. In any case, we’ll have a good time, because
    Mount‑Royal Park is always pleasant, even when it’s a little cold.'
