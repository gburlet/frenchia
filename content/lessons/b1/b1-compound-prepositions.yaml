- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: compound prepositions of place'
  body: In everyday speech the compound prepositions themselves (à côté de, en face de, près de, loin
    de, au lieu de) are identical in Québec and in France; learners can use them interchangeably. The
    only noticeable lexical differences that often appear in the same sentences are the Québec terms for
    meals and the weekend. When you talk about the evening meal you’ll hear **souper** in Québec, whereas
    in France the same idea is expressed with **dîner**. Likewise, Québec speakers say **la fin de semaine**
    for “the weekend,” while the European French equivalent is **le week-end**. These two substitutions
    are the only systematic variations you’ll need to keep in mind for this lesson.
  variants:
  - qc: la fin de semaine
    fr: le week-end
    en: the weekend
    formality: standard
