sections:
- type: explanation
  id: explanation
  heading: Les prépositions composées de lieu
  body: |-
    ***In French, many spatial ideas are expressed with *compound prepositions* – a preposition followed by a noun (often with an article). The most common ones you’ll need at the B1 level are:**  - **à côté de** – next to / beside  - **en face de** – opposite, across from  - **près de** – near, close to  - **loin de** – far from  - **au lieu de** – instead of, in place of  ---

    ### Form  The noun that follows the preposition can be introduced by an article, a possessive, a demonstrative, or sometimes no article at all (proper names, or when the noun is used in a generic sense). When an article is required, it agrees with the noun’s gender and number, just as in a normal noun phrase:  - *à côté **du** parc* (masc. singular)  - *en face **de la** bibliothèque* (fem. singular)  - *près **des** magasins* (plural)  - *loin **de l’**hôpital* (elided before a vowel)  - *au lieu **du** café* (masc. singular)  ---

    The contractions you will meet are **de + le = du** and **de + les = des**. *Au lieu de* can be followed by an infinitive (*au lieu de prendre*) **or** by a noun with its normal determiner (*au lieu du sucre*, *au lieu de la voiture*). In the latter case, the article contracts in the usual way (de + le → du, de + les → des).  ---

    ### Use  These expressions function like simple prepositions: they introduce a complement of place (or, for *au lieu de*, a complement of substitution). The whole phrase is usually placed after the verb that describes location or movement, although *au lieu de* can also appear at the beginning of a sentence for emphasis.  ---

    **Examples**  - *Le musée est **à côté du** théâtre.* – The museum is next to the theatre.  - *Nous nous rencontrerons **en face de la** gare.* – We’ll meet opposite the station.  - *Il habite **près de la** rivière.* – He lives near the river.  - *Le bureau est **loin de l’**hôtel.* – The office is far from the hotel.  - *Au lieu du sucre, mets du miel.* – Instead of sugar, put honey.  - *Au lieu de prendre le bus, je marche.* – Instead of taking the bus, I walk.  ---

    ### Common pitfalls  1. **Confusing *près de* with *proche de*** – *près de* is a compound preposition; *proche de* is an adjective that must agree with the noun it modifies (*un restaurant proche du parc*). Both are followed by *de*, but only *proche* can be used attributively (*un parc proche*).  2. **Omitting the required article or other determiner** – Learners often say *à côté parc* or *en face gare*. The article (or another determiner such as a possessive, demonstrative, or proper name) is mandatory unless the noun is a proper name or already has a determiner (*à côté de Paris*, *près de ma maison*). The only fixed contraction you will see is **de + le = du** (and **de + les = des**).  ---

    Remember to keep the appropriate determiner and to match its gender/number; once you do, these prepositions become a smooth way to describe where things are.***
