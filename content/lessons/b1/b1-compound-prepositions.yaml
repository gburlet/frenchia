  title: Une promenade à la ville
  passage_fr: Samedi matin, je me suis rendu(e) au marché du centre-ville pour acheter des produits frais.
    Le stand de fromages était **à côté de** la boulangerie où l’on vendait des croissants tout chauds.
    J’ai choisi un camembert et, en rentrant, je suis passé(e) **en face de** la pharmacie qui affichait
    une promotion sur les vitamines. Après le marché, je suis allé(e) **près du** parc du coin pour prendre
    un café. Le banc où je me suis assis(e) était **loin de** la route très bruyante, ce qui était parfait
    pour lire le journal. En fin de matinée, j’ai décidé de préparer **le repas** **au lieu de** commander
    une pizza. J’ai invité mon ami(e) à venir **à côté de** moi, sur la terrasse, pour profiter du soleil.
    Nous avons cuisiné des pâtes aux champignons et avons parlé de nos projets pour la **fin de semaine**.
    C’était une journée simple, mais très agréable, et je me suis senti(e) vraiment détendu(e).
  translation_en: Saturday morning, I went to the downtown market to buy fresh produce. The cheese stall
    was next to the bakery where they were selling hot croissants. I chose a camembert and, on the way
    back, I passed opposite the pharmacy that was advertising a promotion on vitamins. After the market,
    I walked near the neighborhood park to have a coffee. The bench where I sat was far from the very
    noisy street, which was perfect for reading the newspaper. Late in the morning, I decided to make
    a meal instead of ordering a pizza. I invited my friend to come beside me, on the terrace, to enjoy
    the sun. We cooked mushroom pasta and talked about our plans for the weekend. It was a simple day,
    but very pleasant, and I felt really relaxed.
