  - Le cinéma est en face à le théâtre.
  - Le cinéma est en face de la théâtre.
  answer_index: 0
  explanation: The correct form is **en face de + article + noun**. Because *théâtre* is masculine singular,
    the article is *le*, which contracts with *de* to *du*. Option A (en face du théâtre) follows this
    rule. Option B leaves the article separate (incorrect), C uses the wrong preposition (*à*), and D
    uses the feminine article *la* with a masculine noun.
