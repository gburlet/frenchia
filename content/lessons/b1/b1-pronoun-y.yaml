- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: the pronoun **y**'
  body: In everyday Québec French the pronoun *y* works exactly as it does in France – it replaces a place
    or the construction *à + thing*. The only noticeable difference is the vocabulary that often follows
    *y*. Québécois speakers will say *au dépanneur* (convenience store), *à la cabane* (cabin), *au souper*
    (to dinner) etc., whereas a French speaker would more likely hear *au magasin*, *à la cabane* (still
    the same), *au dîner*. Because the pronoun itself is identical, the grammar rules you’ve learned apply
    in both regions without change.
  variants:
  - qc: J’y vais au dépanneur.
    fr: J’y vais au magasin.
    en: I’m going there to the convenience store.
    formality: standard
  - qc: Nous y sommes allés pour le souper.
    fr: Nous y sommes allés pour le dîner.
    en: We went there for dinner.
    formality: standard
- type: reading
  id: reading
  title: Une après‑midi au parc du Plateau
  passage_fr: C’était une belle fin de semaine d’automne et la famille Tremblay avait prévu de passer
    du temps au parc du Plateau. **Ils y** sont allés en vélo dès le matin, parce que le trajet est court
    et que le vent n’est pas trop fort. Au parc, **ils y** ont trouvé une grande table de pique‑nique
    sous un grand érable. **Ils y** ont déballé leurs sandwichs, leurs pommes et une petite tarte aux
    bleuets que la maman a faite la veille. Pendant que les enfants jouaient à la marelle, le papa a sorti
    son téléphone pour vérifier la météo; il a vu que **il y** aurait encore du soleil l’après‑midi. Après
    le repas, **ils y** ont fait une petite promenade autour du lac. **Ils y** ont vu des canards qui
    glissaient sur l’eau et un écureuil qui courait entre les arbres. Avant de rentrer, la famille a décidé
    d’aller au dépanneur du coin pour acheter du sirop d’érable et du pain grillé. **Ils y** sont retournés
    à pied, contents d’avoir passé une belle journée ensemble.
  translation_en: It was a beautiful autumn weekend and the Tremblay family had planned to spend time
    at the Plateau park. **They went there** by bike early in the morning, because the ride is short and
    the wind isn’t too strong. At the park, **they found there** a large picnic table under a big maple
    tree. **They unpacked there** their sandwiches, apples and a small blueberry pie that Mom had made
    the day before. While the kids played hop‑scotch, Dad took out his phone to check the weather; he
    saw that **there would still be** sunshine in the afternoon. After the meal, **they took a walk there**
    around the lake. **They saw there** ducks gliding on the water and a squirrel running among the trees.
    Before heading home, the family decided to go to the corner dépanneur to buy maple syrup and toast.
    **They walked back there**, happy to have spent a lovely day together.
