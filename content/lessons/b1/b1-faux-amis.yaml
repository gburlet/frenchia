sections:
- type: explanation
  id: explanation
  heading: '### Les faux amis – Avoiding Tricky English-French Look-alikes (B1)'
  body: '***<br/>In this lesson you’ll learn the most common *false friends* – words that look alike in
    English and French but have different meanings – and a few anglicisms that the OQLF (Office québécois
    de la langue française) recommends replacing.  Recognising them prevents misunderstand-ings and helps
    you sound more natural in Québec French.<br/><br/>**How it works** – When you meet a word that looks
    familiar, pause and check its French definition before using it.  Keep a personal list; the act of
    writing the meaning reinforces memory.  In class we’ll group the words by semantic field (e.g., *work*,
    *food*, *technology*) so you can see patterns.<br/><br/>**Typical pitfalls**<br/>1. **« Actuellement »**
    – many English speakers think it means *actually*.  In French it means *currently*.  Example: **« Actuellement,
    je travaille à Montréal. »** (Not *actually*).<br/>2. **« Réaliser »** – often taken for *to realize*
    (to become aware).  In French it primarily means *to carry out, to produce*.  The “realize” sense
    is accepted in informal speech, but *se rendre compte* is safer in careful usage.  Example: **« Nous
    avons réalisé le projet en deux semaines. »**.<br/>3. **Anglicism flagged by OQLF:** **« canceller »**
    (to cancel) is not accepted; use **« annuler »**.  Example: **« J’ai dû annuler ma réservation. »**.<br/>4.
    **« Défaut »** – not *default* (as in computer settings).  It means *fault* or *shortcoming*.  For
    the computer-setting sense you must say **« par défaut »**.  Example: **« Le défaut de ce plan, c’est
    son coût. »**.<br/><br/>**Quick practice** – Replace the English-sounding word with the correct French
    one:<br/>- *I’m currently busy* → **« Je suis **actuellement** occupé. »**<br/>- *We need to cancel
    the meeting* → **« Nous devons **annuler** la réunion. »**<br/><br/>By constantly checking meaning
    and using the correct Québec-preferred term, you’ll avoid embarrassing mix-ups and sound more like
    a native speaker.<br/>***'
