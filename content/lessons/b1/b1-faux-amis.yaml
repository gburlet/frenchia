- id: ex-06
  grammar_topics: []
  type: multiple_choice
  question: Which French word below correctly translates the English noun “rental” (as in “the rental
    of an apartment”)?
  options:
  - la location
  - le locatif
  - le locataire
  - le loyer
  answer_index: 0
  explanation: In Québec French **la location** means *rental* – the act of renting or the thing that
    is rented. In European French the same word is also used for that meaning, so it is not a trap. **Le
    locatif** is an adjective (e.g., *un bien locatif*), **le locataire** is the tenant (the person who
    rents), and **le loyer** is the rent (the amount paid). Therefore the correct answer is option 0,
    **la location** (feminine).
- id: ex-07
  grammar_topics: []
  type: multiple_choice
  question: You want to say “The meeting was cancelled” in Québec French. Which sentence is correct?
  options:
  - La réunion a cancellé.
  - La réunion a annulé.
  - La réunion a été annulée.
  - La réunion a été cancellée.
  answer_index: 2
  explanation: 'The OQLF recommends the verb **annuler** instead of the anglicism **canceller**. Because
    *réunion* is the patient, the sentence must be in the passive voice: **a été annulée**. Option A and D
    keep the forbidden anglicism, and B is incorrect because *annuler* is a transitive verb and cannot
    be used with *avoir* to express a passive meaning; it would mean “the meeting cancelled something
    else.”'
- id: ex-08
  grammar_topics: []
  type: multiple_choice
  question: In Québec French, which single verb means “to shop” (as in “to go shopping for clothes”)?
  options:
  - magasiner
  - faire la fête
  - faire les courses
  - acheter
  answer_index: 0
  explanation: The natural Québec verb for “to shop (for non-food items)” is **magasiner**. **Faire les
    courses** usually refers to grocery shopping, **acheter** means “to buy”, and **faire la fête** means
    “to party”, so they do not match the meaning “to shop”. The correct answer is therefore the first
    option, *magasiner*.
