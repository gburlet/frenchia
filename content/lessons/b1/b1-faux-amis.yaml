- type: explanation
  id: explanation
  heading: '### Les faux amis – Avoiding Tricky English‑French Look‑alikes (B1)'
  body: |-
    ***
    In this lesson you’ll learn the most common *false friends* – words that look alike in English and French but have different meanings – and a few anglicisms that the OQLF (Office québécois de la langue française) recommends replacing.  Recognising them prevents misunderstandings and helps you sound more natural in Québec French.

    **How it works** – When you meet a word that looks familiar, pause and check its French definition before using it.  Keep a personal list; the act of writing the meaning reinforces memory.  In class we’ll group the words by semantic field (e.g., *work*, *food*, *technology*) so you can see patterns.

    **Typical pitfalls**
    1. **"Actuellement"** – many English speakers think it means *actually*.  In French it means *currently*.  Example: **« Actuellement, je travaille à Montréal. »** (Not *actually*).
    2. **"Réaliser"** – often taken for *to realize* (to become aware).  In French it means *to accomplish, to produce*.  Example: **« Nous avons réalisé le projet en deux semaines. »**.
    3. **Anglicism flagged by OQLF:** **"canceller"** (to cancel) is not accepted; use **« annuler »**.  Example: **« J’ai dû annuler ma réservation. »**.
    4. **"Défaut"** – not *default* (as in computer settings).  It means *fault* or *shortcoming*.  Example: **« Le défaut de ce plan, c’est son coût. »**.

    **Quick practice** – Replace the English‑sounding word with the correct French one:
    - *I’m actually busy* → **« Je suis **actuellement** occupé. »**
    - *We need to cancel the meeting* → **« Nous devons **annuler** la réunion. »**

    By constantly checking meaning and using the correct Québec‑preferred term, you’ll avoid embarrassing mix‑ups and sound more like a native speaker.
    ***
