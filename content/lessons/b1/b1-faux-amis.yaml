    pos: noun
    gender: m
    region: qc
    formality: standard
    example_fr: On se retrouve au souper.
    example_en: We’ll meet for dinner.
  - fr: magasiner
    en: to shop (verb)
    pos: verb
    region: qc
    formality: standard
