- id: ex-06
  grammar_topics: []
  type: multiple_choice
  question: Which French word below correctly translates the English noun “rental” (as in “the rental
    of an apartment”)?
  options:
  - la location
  - le locatif
  - le locataire
  - la location (en France, meaning “placement”)
  answer_index: 0
  explanation: In Québec French **la location** means *rental* (the act of renting or the thing that is
    rented). In European French, *location* can also mean “placement” or “position”, which is why option D
    is a trap. **locatif** is an adjective, and **locataire** is the tenant (the person who rents). The
    correct answer is therefore option 0, **la location** (feminine).
- id: ex-07
  grammar_topics: []
  type: multiple_choice
  question: You want to say “The meeting was cancelled” in Québec French. Which sentence is correct?
  options:
  - La réunion a cancellé.
  - La réunion a annulé.
  - La réunion a été annulée.
  - La réunion a été cancellée.
  answer_index: 2
  explanation: The OQLF recommends using the verb **annuler** instead of the anglicism **canceller**.
    Because *réunion* is the patient, you need the passive construction **a été annulée**. Options A and D
    keep the forbidden anglicism, and B uses the wrong auxiliary (the verb is transitive, not used with
    *avoir* for a passive meaning).
- id: ex-08
  grammar_topics: []
  type: multiple_choice
  question: In Québec French, which word means “to shop” (as in “to go shopping for clothes”)?
  options:
  - magasiner
  - faire du shopping
  - faire les courses
  - acheter
  answer_index: 0
  explanation: The natural Québec verb for “to shop (for non‑food items)” is **magasiner**. **Faire du
    shopping** is an English‑derived expression that is understood but less idiomatic. **Faire les courses**
    usually refers to grocery shopping, and **acheter** means “to buy”, not the activity of browsing and
    selecting.
