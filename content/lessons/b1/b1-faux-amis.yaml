- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: How false-friend awareness is taught'
  body: In Québec French classrooms the term *faux ami* is paired with a short list of anglicisms that
    the OQLF actively discourages (e.g., *canceller* → *annuler*). In France the same lesson usually focuses
    on classic lexical traps (e.g., *défaut* vs. *fault*, *location* vs. *rental*) and does not stress
    official language-policy recommendations. Both varieties stress the need to check meaning before using
    a look-alike, but Québec teachers add the extra step of replacing the anglicism with the recommended
    French term.
  variants:
  - qc: déjeuner (breakfast)
    fr: petit-déjeuner
    en: breakfast
    formality: standard
  - qc: souper (supper)
    fr: dîner
    en: supper (evening meal)
    formality: standard
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine au dépanneur
  passage_fr: |-
    C’est la fin de semaine et ma sœur m’a demandé de l’aider à préparer le **souper**. Elle a prévu une **entrée** légère, mais elle veut aussi un **dessert** sucré pour finir le repas. Nous avons donc passé la matinée à **faire l’épicerie** au dépanneur du coin. Elle a acheté du **blanc** de poulet, des légumes et du **film plastique** pour couvrir les plats.

    En arrivant à la maison, nous avons découvert que le four était **en panne** : il ne chauffait plus. Au lieu d’**annuler** le menu, nous avons improvisé un **souper** chez mon oncle ; il possède un petit studio à côté où on a pu cuire le poulet. Le **bilan** de la soirée était simple : on a mangé, on a ri et on a parlé de nos projets.

    Le lendemain, j’ai **oublié** de rendre le film plastique à ma sœur, mais elle a trouvé mon idée très **sensée**. Elle a aussi noté que le **pavé** de la chaussée devant le dépanneur était encore couvert de neige, ce qui rendait la marche un peu difficile. Malgré tout, c’était une belle fin de semaine québécoise.
  translation_en: |-
    It's the weekend and my sister asked me to help her prepare supper. She planned a light starter, but she also wants a sweet dessert to finish the meal. So we spent the morning doing the grocery shopping at the corner convenience store. She bought chicken breast, vegetables and some plastic film to cover the dishes.

    When we got home we discovered that the oven was out of order: it no longer heated. Instead of canceling the menu, we improvised a supper at my uncle’s; he has a small studio next door where we could cook the chicken. The summary of the evening was simple: we ate, we laughed and we talked about our plans.

    The next day I forgot to give the plastic film back to my sister, but she thought my idea was very sensible. She also noted that the cobblestone on the roadway in front of the convenience store was still covered with snow, which made the walk a little difficult. In spite of everything, it was a nice Quebec weekend.
  glossary:
  - fr: défaut
    en: fault, flaw; « par défaut » = by default (computer setting)
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Ce plan a un défaut.
    example_en: This plan has a flaw.
  - fr: location
    en: rental (the verb is **louer**; used in both France and Québec)
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: Une location d’appartement.
    example_en: An apartment rental.
  - fr: pavé
    en: paving stone, cobblestone (not ‘sidewalk slab’)
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le pavé était glissant.
    example_en: The cobblestone was slippery.
  - fr: souper
    en: supper, the evening meal (Québec) – dinner in France is « dîner »
    pos: noun
    gender: m
    region: qc
    formality: standard
    example_fr: On se retrouve au souper.
    example_en: We’ll meet for supper.
  - fr: magasiner
    en: to shop (standard in Québec; in France one says « faire les magasins » or « faire du shopping »)
    pos: verb
    region: qc
    formality: standard
    example_fr: Je vais magasiner ce soir.
    example_en: I’m going shopping tonight.
  - fr: réaliser
    en: to carry out, to accomplish; the sense ‘to realize’ (se rendre compte) is accepted but less formal
    pos: verb
    region: common
    formality: standard
    example_fr: Nous avons réalisé le projet.
    example_en: We carried out the project.
  - fr: sensible
    en: sensitive (not ‘reasonable’; that would be **sensé**)
    pos: adjective
    region: common
    formality: standard
    example_fr: Il est sensible au froid.
    example_en: He is sensitive to the cold.
