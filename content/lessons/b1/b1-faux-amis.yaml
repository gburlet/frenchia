- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: How false‑friend awareness is taught'
  body: "In Québec French classrooms the term *faux ami* is paired with a short list of anglicisms that\
    \ the OQLF actively discourages (e.g., *canceller* → *annuler*, *magasiner* → *faire du shopping*).\
    \  In France the same lesson usually focuses only on classic lexical traps (e.g., *défaut* vs. *fault*,\
    \ *location* vs. *rental*) and does not stress official language‑policy recommendations.  Both varieties\
    \ stress the need to check meaning before using a look‑alike, but Québec teachers add the extra step\
    \ of replacing the anglicism with the recommended French term.\n\n**Typical variants**\n1. *canceller*\
    \ (Eng.) → **canceller** (Quebec anglicism, flagged) → **annuler** (standard French) \n2. *magasiner*\
    \ (Quebec) → **faire du shopping** (France) \n3. *déjeuner* (Quebec = breakfast) → **petit‑déjeuner**\
    \ (France) \n4. *souper* (Quebec = dinner) → **dîner** (France) \n5. *fin de semaine* (Quebec) → **week‑end**\
    \ (France uses the English loan) \n6. *location* (Quebec = rental) → **location** (France = lease,\
    \ but the word also means *rental*; the context is clearer in Quebec)."
  variants:
  - qc: magasiner
    fr: faire du shopping
    en: to shop
    formality: standard
  - qc: déjeuner (breakfast)
    fr: petit‑déjeuner
    en: breakfast
    formality: standard
  - qc: souper (dinner)
    fr: dîner
    en: dinner
    formality: standard
  - qc: fin de semaine
    fr: week‑end
    en: weekend
    formality: standard
- type: reading
  id: reading
  title: Une fin de semaine au dépanneur
  passage_fr: "C’est la fin de semaine et ma sœur m’a demandé de l’aider à préparer le **souper**. Elle\
    \ a prévu un **déjeuner** léger, mais elle veut aussi un petit‑déjeuner sucré avant le repas du soir.\
    \ Nous avons donc passé la matinée à **magasiner** au dépanneur du coin. Elle a acheté du **blanc**\
    \ de poulet, des légumes et un **préservatif** de cuisine : un film plastique pour couvrir les plats.\
    \ \n\nEn arrivant à la maison, nous avons découvert que le four était en **défaut** : il ne chauffait\
    \ plus. Au lieu de **annuler** le menu, nous avons improvisé une **location** de cuisine ; mon oncle\
    \ possède un petit studio à côté où on a pu cuire le poulet. Le **résumé** de la soirée était simple :\
    \ on a mangé, on a ri et on a parlé de nos projets. \n\nLe lendemain, j’ai **oublié** de rendre le\
    \ film plastique à ma sœur, mais elle a trouvé ça **sensible** de ne pas le perdre. Elle a aussi noté\
    \ que le **pavé** de la rue devant le dépanneur était encore plein de neige, ce qui rendait la marche\
    \ un peu difficile. Malgré tout, c’était une belle fin de semaine québécoise."
  translation_en: |-
    It's the weekend and my sister asked me to help her prepare dinner. She planned a light lunch, but she also wants a sweet breakfast before the evening meal. So we spent the morning shopping at the corner convenience store. She bought chicken breast, vegetables and a kitchen “preservative”: a plastic wrap to cover the dishes.

    When we got home we discovered that the oven was defective: it no longer heated. Instead of canceling the menu, we improvised a kitchen rental; my uncle has a small studio next door where we could cook the chicken. The summary of the evening was simple: we ate, we laughed and we talked about our plans.

    The next day I forgot to give the plastic wrap back to my sister, but she thought it was understandable not to lose it. She also noted that the sidewalk slab in front of the convenience store was still full of snow, which made the walk a little hard. In spite of everything, it was a nice Quebec weekend.
  glossary:
