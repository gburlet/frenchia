    example_en: The oven is defective.
  - fr: location
    en: rental (Quebec usage)
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: Une location d’appartement.
    example_en: An apartment rental.
  - fr: pavé
    en: sidewalk slab
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Le pavé était glissant.
    example_en: The slab was slippery.
  - fr: souper
