- type: regional_note
  id: regional-note
  heading: Indicatif / Subjonctif in Québec vs. France
  body: 'In everyday speech—whether in Québec or in France—the choice between the indicative and the subjunctive
    follows the same grammatical rules: the mood is triggered by certainty, doubt, desire, emotion, etc.
    The only differences are stylistic, not grammatical. For example, speakers often contract *il faut
    que* to *faut que* in informal conversation; this contraction is common in spoken French across both
    varieties. The verb after *après que* takes the indicative in both Québec and European French (e.g.,
    *Après qu’il est parti, je resterai ici*). Thus, the subjunctive itself is used identically in both
    regions.'
  variants: []
- type: reading
