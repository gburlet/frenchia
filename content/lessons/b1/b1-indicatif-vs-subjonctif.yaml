- type: regional_note
  id: regional-note
  heading: Indicatif / Subjonctif in Québec vs. France
  body: In everyday Québec speech the choice between indicative and subjunctive follows the same grammatical
    rules as in France – the mood is triggered by certainty, doubt, desire, emotion, etc. What does change
    are the lexical items that appear in the example sentences, because Québécois French uses a few region‑specific
    words. When you hear a Québécois speaker, you’ll more often hear *déjeuner* for breakfast, *dîner*
    for lunch, *souper* for the evening meal, *fin de semaine* for weekend, *magasiner* for shopping,
    and *dépanneur* for a corner‑store. In France the equivalents are *petit‑déjeuner*, *déjeuner*, *dîner*,
    *week‑end*, *faire du shopping* (or *magasiner* less commonly), and *épicerie* or *supérette*. The
    subjunctive itself is used identically in both varieties.
