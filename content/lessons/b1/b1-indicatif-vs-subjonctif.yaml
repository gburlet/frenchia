  title: Indicatif ou subjonctif ? – Lecture de compréhension (B1)
  passage_fr: |-
    Ce lundi, mon frère — qui travaille à Montréal depuis deux ans — a décidé d’organiser une petite réunion chez lui. Il est sûr que tout le monde pourra arriver **avant la soirée**, parce que le trafic sur la rue Saint-Laurent est habituellement fluide le soir du lundi.

    Nous avons parlé avec lui hier au café du coin. Il nous a dit qu’il aimerait que nous apportions un dessert, mais qu’il ne veut pas que ce soit trop lourd, vu qu’il fera sûrement froid dehors.

    « J’espère que la neige ne tombera pas trop tard », a-t-il ajouté. « Il faut que le chauffage fonctionne bien, sinon on sera gelés. »

    Je doute que le vent soit très violent, mais je crains que le temps change rapidement.

    Quoi qu’il arrive, nous sommes contents que notre famille se retrouve **ce lundi**. Nous irons au magasin demain pour acheter du pain et un petit cadeau, et nous reviendrons avec le sourire.
  translation_en: |-
    This Monday, my brother—who has been working in Montreal for two years—has decided to organize a small gathering at his place. He is sure that everyone will be able to arrive before the evening, because traffic on Saint-Laurent Street is usually smooth on Monday evenings.

    We talked with him yesterday at the corner café. He told us that he would like us to bring a dessert, but he doesn’t want it to be too heavy, since it will probably be cold outside.

    "I hope the snow doesn’t fall too late," he added. "It’s necessary that the heating works well, otherwise we’ll be freezing."

    I doubt that the wind will be very strong, but I fear that the weather might change quickly.

    Whatever happens, we are happy that our family gets together **this Monday**. We will go to the store tomorrow to buy some bread and a small gift, and we’ll come back with a smile.
