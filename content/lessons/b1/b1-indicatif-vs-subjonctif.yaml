  type: multiple_choice
  question: Choose the correct subjunctive form after the expression of doubt.
  options:
  - Je doute que le professeur nous explique avant la pause.
  - Je doute que le professeur nous expliquera avant la pause.
  - Je doute que le professeur nous expliquait avant la pause.
  - Je doute que le professeur nous expliquions avant la pause.
  answer_index: 0
  explanation: The verb *douter que* triggers the **subjunctive** because it expresses doubt. The subject
    of the subordinate clause is *le professeur* (third-person singular), so the present-subjunctive form
    of *expliquer* is *explique*. Therefore option 0 (*…nous **explique**…*) is correct. Option 1 uses
    the future indicative (*expliquera*), option 2 the imperfect indicative (*expliquait*), and option 3
    mistakenly uses the first-person plural subjunctive (*expliquions*), which does not agree with the
    subject.
