sections:
- type: explanation
  id: explanation
  heading: '# Indicatif ou subjonctif ? – When to Choose the Right Mood (B1)'
  body: "In French, the **mood** (mode) tells you how the speaker feels about the action. The **indicatif**\
    \ states facts, certainty, or something the speaker sees as real. The **subjonctif** appears after\
    \ expressions that convey doubt, possibility, desire, emotion, or a subjective judgment. \n\n### How\
    \ to form the present subjonctif\n1. Start with the **ils/elles** form of the present indicative.\
    \  \n2. Drop the **‑ent** ending.  \n3. Add the subjunctive endings: **‑e, ‑es, ‑e, ‑ions, ‑iez, ‑ent**.\
    \  \n   *Example*: **parler → parl‑** → **que je parle**, **que nous parlions**.  \n4. Irregular verbs\
    \ keep their special stems (e.g., **être → soy‑**, **avoir → aï‑**, **faire → fass‑**). \n\n### When\
    \ to use the indicative\n- **Certainty / factual statements**: *Je sais que le dépanneur ferme à 22 h.*\
    \ (I know the convenience store closes at 10 p.m.)\n- **Perception**: *Il voit que tu arrives.* (He\
    \ sees that you’re arriving.)\n- **Opinion presented as fact**: *Je pense que c’est une bonne idée.*\
    \ (I think it’s a good idea.)\n\n### When to use the subjunctive\n- **Doubt or uncertainty**: *Je\
    \ doute qu’il vienne ce soir.* (I doubt he’ll come tonight.)\n- **Desire or request**: *Je veux que\
    \ tu **magasines** au centre‑commercial.* (I want you to shop at the mall.)\n- **Emotion**: *Ça me\
    \ rend triste que la fin de semaine soit déjà passée.* (It makes me sad that the weekend is already\
    \ over.)\n- **Impersonal expressions**: *Il faut que nous **déjeunions** tôt.* (We need to have breakfast\
    \ early.)\n\n### Common pitfalls for English speakers\n1. **“I think that…”** – In English this can\
    \ introduce either fact or opinion, but French treats it as a fact, so the **indicative** is required\
    \ (*Je pense que c’est vrai*). Using the subjunctive here (*Je pense que ce soit vrai*) sounds doubtful\
    \ and is usually wrong.\n2. **Forgetting the “que”** – The subjunctive almost always follows **que**.\
    \ Dropping it (*Je veux que tu **magasines**.* → *Je veux tu **magasines**.*) is ungrammatical.\n\n\
    Remember: if the clause expresses the speaker’s **subjective attitude**, reach for the **subjunctive**;\
    \ if it reports something **objective or certain**, stay in the **indicative**. Practice with everyday\
    \ Québec contexts—*déjeuner*, *souper*, *fin de semaine*, *dépanneur*—to make the mood feel natural."
