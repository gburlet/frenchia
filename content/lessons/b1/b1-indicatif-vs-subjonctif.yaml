sections:
- type: explanation
  id: explanation
  heading: '# Indicatif ou subjonctif ? – When to Choose the Right Mood (B1)'
  body: |-
    In French, the **mood** (mode) tells you how the speaker feels about the action. The **indicatif** states facts, certainty, or something the speaker sees as real. The **subjonctif** appears after expressions that convey doubt, possibility, desire, emotion, or a subjective judgment. ​

    ### How to form the present subjonctif
    1. Start with the **ils/elles** form of the present indicative.
    2. Drop the **-ent** ending.
    3. Add the subjunctive endings: **-e, -es, -e, -ions, -iez, -ent**.
       *Example*: **parler → parl-** → **que je parle**, **que nous parlions**.
    4. Irregular verbs keep their special stems (e.g., **être → sois / soit / soyons**, **avoir → aie / aies / ait / ayons / ayez / aient**, **faire → fasse**).

    ### When to use the indicative
    - **Certainty / factual statements**: *Je sais que le bureau ferme à 18 h.* (I know the office closes at 6 p.m.)
    - **Perception**: *Il remarque que tu arrives en retard.* (He notices that you’re arriving late.)
    - **Opinion presented as fact**: *Je pense que c’est une bonne idée.* (I think it’s a good idea.)

    ### When to use the subjunctive
    - **Doubt or uncertainty**: *Je doute qu’il vienne demain.* (I doubt he’ll come tomorrow.)
    - **Desire or request**: *Je veux que tu prépares le rapport avant la réunion.* (I want you to prepare the report before the meeting.)
    - **Emotion**: *Ça me rend triste que les vacances soient déjà terminées.* (It makes me sad that the holidays are already over.)
    - **Impersonal expressions**: *Il faut que nous partions tôt.* (We need to leave early.)

    ### Common pitfalls for English speakers
    1. **“I think that…”** – In English this can introduce either fact or opinion, but French treats it as a fact, so the **indicative** is required (*Je pense que c’est vrai*). Using the subjunctive here (*Je pense que ce soit vrai*) sounds doubtful and is usually wrong.
    2. **Forgetting the “que”** – The subjunctive almost always follows **que**. Dropping it (*Je veux que tu prépares* → *Je veux tu prépares*) is ungrammatical.

    Remember: if the clause expresses the speaker’s **subjective attitude**, reach for the **subjunctive**; if it reports something **objective or certain**, stay in the **indicative**. Practice with everyday situations—talking about work, school, family, travel, or hobbies—to make the mood feel natural.
