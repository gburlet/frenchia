- type: reading
  id: reading
  title: Indicatif ou subjonctif ? – Lecture de compréhension (B1)
  passage_fr: |-
    Ce week‑end, ma sœur — qui habite à Québec depuis trois ans— a décidé d’organiser un petit souper chez elle. Elle est sûre que tout le monde pourra arriver avant le dîner, parce que le trafic sur la 5e avenue est habituellement fluide le vendredi soir. 

    Nous avons parlé avec elle hier au dépanneur du coin. Elle nous a dit qu’elle aimerait que nous apportions un dessert, mais qu’elle ne veut pas que ce soit trop lourd, vu qu’il fera sûrement froid dehors. 

    « J’espère que la neige ne tombera pas trop tard », a-t‑elle ajouté. « Il faut que le chauffage fonctionne bien, sinon on sera gelés. »

    Je doute que le vent soit très violent, mais je crains que le temps change rapidement. 

    Quoi qu’il arrive, nous sommes contents que notre famille se retrouve pour la fin de semaine. Nous allons magasiner au centre commercial demain pour acheter du fromage en grains et du sirop d’érable, et nous reviendrons avec des sourires.

    — Fin de la lecture
  translation_en: |-
    This weekend, my sister—who has been living in Quebec City for three years—has decided to organize a small dinner at her place. She is sure that everyone will be able to arrive before dinner, because traffic on 5th Avenue is usually smooth on Friday evenings.

    We talked with her yesterday at the corner convenience store. She told us that she would like us to bring a dessert, but she doesn’t want it to be too heavy, since it will probably be cold outside.

    "I hope the snow doesn’t fall too late," she added. "It’s necessary that the heating works well, otherwise we’ll be freezing."

    I doubt that the wind will be very strong, but I fear that the weather might change quickly.

    Whatever happens, we are happy that our family gets together for the weekend. We will go shopping at the mall tomorrow to buy cheese curds and maple syrup, and we’ll come back with smiles.

    — End of reading
