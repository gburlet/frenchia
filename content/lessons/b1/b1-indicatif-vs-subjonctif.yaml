  type: multiple_choice
  question: Which verb form correctly completes the sentence?
  options:
  - Il est certain que le train arrivera à l’heure.
  - Il est certain que le train arrivez à l’heure.
  - Il est certain que le train arriverait à l’heure.
  - Il est certain que le train arrivee à l’heure.
  answer_index: 0
  explanation: The expression *être certain que* expresses **certainty**, so the clause that follows must
    be in the **indicatif**. Among the choices, only the future simple *arrivera* (option 0) is a correct
    indicative form that fits the meaning of a specific future event. Option 1 (*arrivez*) is a second-person
    plural form and does not agree with the third-person singular subject *le train*. Option 2 (*arriverait*)
    is a conditional mood, which would convey uncertainty or a hypothetical situation, not certainty.
    Option 3 (*arrivee*) is not a valid verb form. Therefore, option 0 is the only correct answer.
