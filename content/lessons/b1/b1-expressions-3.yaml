- id: ex-01
  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the idiom c’est le fun correctly?
  options:
  - C’est le fun d’aller magasiner au centre commercial avec les amis.
  - C’est le fun à aller magasiner au dépanneur.
  - C’est le fun d’aller magasiner au dépanneur avec les ami.
  - C’est le fun d’aller magasiner au dépanneur avec les amie.
  answer_index: 0
  explanation: 'The idiom *c’est le fun* means “it’s fun”. It must stay together and be placed before
    the clause it qualifies. Option A is the only fully correct choice: the idiom is used properly, the
    prepositional phrase *avec les amis* matches the plural noun, and the location *au centre commercial*
    is appropriate. Option B is ungrammatical because the preposition *à* cannot follow *c’est le fun*;
    the idiom must be directly followed by *de* + infinitive. Option C misspells the plural noun (*ami*
    → *amis*). Option D contains a gender error (*amie* is singular feminine, and the article *les* makes
    it plural, which is ungrammatical). Therefore, A is the sole correct answer.'
