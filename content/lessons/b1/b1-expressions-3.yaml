- type: reading
  id: reading
  title: Une soirée au parc
  passage_fr: 'C’est le fun d’avoir une petite soirée improvisée avec les copains. Hier, on s’est donné
    rendez-vous au dépanneur du coin pour acheter des chips, de la liqueur et, bien sûr, une bonne poutine.
    J’avais la chienne à l’idée de devoir parler devant tout le monde, mais mes amis m’ont rassuré : « T’inquiète,
    on est là pour te soutenir ». Après le souper, on s’est installés sur les bancs du parc et on s’est
    tiré une bûche, chacun racontant des histoires drôles. Au bout d’une demi-heure, la pluie a commencé
    à tomber des cordes, mais Luc a vite repris le fil de la conversation. On a eu de la jasette jusqu’à
    minuit, et même si le vent était fort, personne ne s’est plaint. Au final, c’était correct : on a
    bien rigolé, on a partagé un gros sac de chips et on a même trouvé un petit trésor – un vieux ticket
    de cinéma qui valait encore deux dollars. C’est pas pire comme façon de finir la fin de semaine !'
  translation_en: 'It’s a lot of fun to have a little impromptu evening with friends. Yesterday we met
    at the corner convenience store to buy chips, some pop (soft drinks) and, of course, a good poutine.
    I was nervous about having to speak in front of everyone, but my friends reassured me: “Don’t worry,
    we’re here to support you.” After supper we settled on the park benches and kicked back, each telling
    funny stories. After half an hour the rain started to pour in sheets, but Luc quickly got back into
    the conversation. We chatted until midnight, and even though the wind was strong, nobody complained.
    In the end it was all right: we had a great laugh, shared a big bag of chips and even found a little
    treasure – an old movie ticket that was still worth two dollars. It’s not bad as a way to end the
    weekend!'
