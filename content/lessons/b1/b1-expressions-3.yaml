- type: reading
  id: reading
  title: Une soirée au dépanneur
  passage_fr: 'C’est le fun d’avoir une petite soirée improvisée avec les copains. Hier, on s’est donné
    rendez‑vous au dépanneur du coin pour acheter des chips, du soda et, bien sûr, une bonne poutine.
    J’avais la chienne à l’idée de devoir parler devant tout le monde, mais mes amis m’ont rassuré : « T’inquiète,
    on est là pour te soutenir ». Après le dîner, on s’est installé sur les bancs du parc et on a commencé
    à se tirer une bûche, chacun racontant des histoires drôles. Au bout d’une demi‑heure, Luc a tiré
    la langue en voyant la pluie arriver, mais il a vite repris le fil de la conversation. On a eu de
    la jasette jusqu’à minuit, et même si le vent était fort, personne ne s’est plaint. Au final, c’était
    correct : on a bien rigolé, on a partagé un gros sac de chips et on a même trouvé un petit trésor
    – un vieux ticket de cinéma qui valait encore deux dollars. C’est pas pire comme façon de finir la
    fin de semaine !'
  translation_en: 'It’s a lot of fun to have a little impromptu evening with friends. Yesterday we met
    at the corner convenience store to buy chips, soda and, of course, a good poutine. I was nervous about
    having to speak in front of everyone, but my friends reassured me: “Don’t worry, we’re here to support
    you.” After dinner we settled on the park benches and started to kick back, each telling funny stories.
    After half an hour Luc stuck out his tongue when he saw the rain coming, but he quickly got back into
    the conversation. We chatted away until midnight, and even though the wind was strong, nobody complained.
    In the end it was all right: we had a great laugh, shared a big bag of chips and even found a little
    treasure – an old movie ticket that was still worth two dollars. It’s not bad as a way to end the
    weekend!'
