- type: explanation
  id: explanation
  heading: '## Idiomatic Expressions (3) – Nuancing Your Speech (Québec French)'
  body: |-
    ***
    In this B1 lesson you will meet **ten idiomatic expressions that are heard every day in Québec**. Unlike grammar points, idioms are fixed word‑combinations; you don’t change their internal structure, you only insert the appropriate subject or object. Most of them convey a subtle attitude—surprise, doubt, encouragement, or a light‑hearted comment—so mastering them lets you sound more natural and expressive.

    **How to use them**
    - **Place the idiom in the same clause where you would say the literal meaning.** For example, *« **Ça fait du bruit dans le dépanneur** »* means *‘It’s causing a stir (people are talking)’*; you can use it as the main clause: *« Ça fait du bruit dans le dépanneur, ce nouveau resto! »*.
    - **Keep the idiom intact**; you cannot split it with a pronoun or another verb. *Incorrect:* *« Ça fait du bruit le dépanneur dans »*.
    - **Watch the register.** Most of these idioms are familiar (marked *fam.*) but perfectly acceptable in casual conversation with friends or coworkers.

    **Typical pitfalls for English speakers**
    1. **Literal translation** – Trying to translate word‑for‑word often yields nonsense. *« Il pleut des chats et des chiens »* is not about animals falling from the sky; it simply means *‘It’s raining heavily.’*
    2. **Gender and agreement errors** – Some idioms contain nouns that must agree with adjectives or past participles. In *« **Être dans le même bateau**»* (to be in the same situation), *bateau* is masculine, so you say *« Nous sommes dans le même **bateau** »*, not *« même **bateau**e*.*

    Below is the list of the ten expressions you will hear, each with a short example and the European French equivalent when it differs (e.g., *souper* vs. *dîner*). Practice listening for them in authentic Québec audio, repeat the bolded sentences, and try to insert the idioms into your own dialogues.
    ***
