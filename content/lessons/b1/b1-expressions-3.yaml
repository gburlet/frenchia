sections:
- type: explanation
  id: explanation
  heading: '## Idiomatic Expressions (3) – Nuancing Your Speech (Québec French)'
  body: '*** In this B1 lesson you will meet **idiomatic expressions that are heard every day in Québec**.
    Unlike grammar points, idioms are fixed word-combinations; you keep the core words together, but the
    verb can be conjugated and pronouns can be added as needed. Most of them convey a subtle attitude—surprise,
    doubt, encouragement, or a light-hearted comment—so mastering them lets you sound more natural and
    expressive. ***  **How to use them**  - **Place the idiom in the same clause where you would say the
    literal meaning.** For example, *« **C’est le fun, ce nouveau resto !** »* means *‘That new restaurant
    is great!’*; you can use it as the main clause: *« C’est le fun, ce nouveau resto ! »* (fam.).  -
    **Keep the core of the idiom together.** You may change the verb form or add a pronoun, but you do
    not break the fixed phrase itself. *Correct:* *« C’est le fun d’aller au cinéma. »* – *Incorrect:*
    *« C’est le fun à aller au cinéma. »* (the idiom is followed by **de** + infinitive, not **à**).  -
    **Watch the register.** Most of these idioms are familiar (marked *fam.*) but perfectly acceptable
    in casual conversation with friends or coworkers.  **Typical pitfalls for English speakers**  1. **Literal
    translation** – Translating word-for-word often yields nonsense. *« Il pleut des cordes »* is an idiom
    meaning *‘It’s raining cats and dogs.’*  2. **Using an idiom that isn’t in the list** – Stick to the
    expressions provided in the vocabulary list; inventing new idioms can cause confusion.  3. **Gender
    and agreement errors** – Some idioms contain nouns that must agree with adjectives or past participles.
    In *« **Être dans le champ**»* (to be way off, mistaken), *champ* is masculine, so you say *« Tu es
    dans le **champ**, ce n’est pas ça. »*, not *« dans la champ »*.  4. **Mis-applying the idiom’s meaning**
    – Be sure you use the idiom with its correct sense. For instance, *« avoir la chienne d’aller…*’*
    (to be scared of going) should not be rendered literally as *« to have the dog to go…*’; the idiom
    actually means *‘to be frightened about going’.**  Practice listening for the idioms in authentic
    Québec audio, repeat the bolded sentences, and try to insert the idioms into your own dialogues.***'
