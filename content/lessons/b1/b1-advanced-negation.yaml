sections:
- type: explanation
  id: explanation
  heading: '## La négation avancée (B1) – Advanced Negation'
  body: |-
    In standard French the negative particle *ne* surrounds the verb and is completed by a second word such as **jamais**, **plus**, **rien**, **personne** or **que**. In informal spoken French – both in France and in Québec – the *ne* is often dropped; the second word stays, so you will hear *j’ai jamais fini le rapport* or *y a plus de places*. When you need a more formal or written style (e-mail, news article, school work) keep the *ne*.

     | English idea | Informal spoken | Formal/standard | Note |
    | --- | --- | --- | --- |
     | never | **j’ai jamais** trouvé la clé | **je n’ai jamais** trouvé la clé | *jamais* is used alone; it is never combined with *pas*. |
     | no longer | **y a plus** de places au théâtre | **il n’y a plus** de places au théâtre | In speech the *ne* is dropped: *y a plus de places*. |
     | nothing | **rien m’a** dérangé pendant le cours | **rien ne m’a dérangé** pendant le cours | In speech you may say *rien m’a dérangé* (drop *ne*). |
     | nobody | **personne est** venu à la réunion | **personne n’est venu** à la réunion | *personne* can lead the clause; *ne* may be omitted. |
     | only | **c’est juste** les documents | **ce n’est que** les documents | *ne…que* stays together; dropping *ne* sounds very informal. |

    ### Common pitfalls
    1. **Adding *pas* with the other negative words** – English speakers often say *je ne mange pas jamais*; the correct form is **je ne mange jamais** (or simply *je mange jamais* in informal speech). The *pas* is redundant and ungrammatical with *jamais, plus, rien, personne, que*.
    2. **Placing the second negative word after the subject instead of after the verb** – The negative particle must surround the verb: **Il n’a rien vu**, not *Il rien a vu*.

    Use these patterns to sound natural in everyday conversation while keeping the formal version ready for writing.
