- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Advanced Negation'
  body: In everyday spoken French—both in Québec and in France—the first *ne* is often dropped, while
    the second negative word remains. You’ll hear expressions such as « j’ai jamais vu ça », « y a plus
    de pain », « y a rien à dire », « y a personne ». In careful or written French, in either region,
    the full *ne* … *pas* (or *jamais*, *plus*, *rien*, *personne*) construction is retained. This pattern
    is a feature of informal speech, not a regional peculiarity.
  variants: []
- type: reading
  id: reading
  title: Une après-midi à la boutique
  passage_fr: C’était une petite fin de semaine ordinaire. Claire avait prévu d’aller à la boutique du
    centre pour acheter du miel et des biscuits avant le dîner. Quand elle est arrivée, il n’y avait plus
    de miel — le dernier lot avait été vendu la veille. Elle a demandé au caissier s’il restait encore
    du pain, mais il n’y avait **pas de baguettes du tout**. « Je n’ai jamais vu une boutique vide comme
    ça », a-t-elle dit, en riant. Elle a tout de même acheté du fromage et un petit pot de confiture.
    Sur le chemin du retour, elle a croisé Marc, qui n’avait **rien** à faire ce soir. « Je ne veux pas
    rester seul à la maison », a-t-il expliqué, « mais je ne regarde plus la télé ; je préfère sortir
    un peu. » Claire a accepté de l’accompagner au parc. Ils n’ont vu **personne** d’autre, alors ils
    ont décidé de jouer aux cartes **jusque tard**. « On ne mange que du fromage et des biscuits », a-t-elle
    ajouté, « c’est tout ce qu’on a. »
  translation_en: It was an ordinary little weekend. Claire had planned to go to the downtown shop to
    buy honey and some cookies before lunch. When she arrived, there was no more honey — the last batch
    had been sold the day before. She asked the clerk if there was any bread left, but there weren’t any
    baguettes at all. “I’ve never seen a shop that empty,” she said, laughing. She still bought some cheese
    and a small jar of jam. On the way back, she ran into Marc, who had **nothing** to do tonight. “I
    don’t want to stay alone at home,” he explained, “but I don’t watch TV any more; I’d rather go out
    a bit.” Claire agreed to accompany him to the park. They saw **no one** else, so they decided to play
    cards **until late**. “We only eat cheese and cookies,” she added, “that’s all we have.”
