  type: multiple_choice
  question: Which sentence correctly uses the advanced negation ne…plus in a neutral (written) style?
  options:
  - Il n’a plus de temps pour préparer son rapport ce soir.
  - Il a plus de temps pour préparer son rapport ce soir.
  - Il n’a plus du temps pour préparer son rapport ce soir.
  - Il n’a plus du temps à préparer son rapport ce soir.
  answer_index: 0
  explanation: The correct form is **ne + verb + plus** followed by the noun without an article (*de temps*).
    Option A respects the required particle *ne* and uses the correct preposition *de* after *plus*. Options
    B, C and D either omit *ne* or keep the article *du*, which is not used after the negative *plus*.
- id: ex-10
  grammar_topics:
