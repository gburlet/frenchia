sections:
- type: explanation
  id: explanation
  heading: '## La négation avancée (B1) – Advanced Negation'
  body: |-
    In standard French the negative particle *ne* surrounds the verb and is completed by a second word such as **jamais**, **plus**, **rien**, **personne** or **que**. In Québec French the *ne* is often dropped in casual speech, but the second word stays, so you will hear *j’ai jamais vu ça* or *y a plus de pain*. When you need a more formal or written style (e‑mail, news article, school work) keep the *ne*.

    | English idea | Québec‑style (spoken) | Formal/standard | Note |
    |---|---|---|---|
    | never | **j’ai jamais** fini le travail | **je n’ai jamais** fini le travail | *jamais* replaces *pas* + *jamais*.
    | no longer | **y a plus** de temps | **il n’y a plus** de temps | *plus* follows the verb, not *ne … plus* in spoken.
    | nothing | **rien** ne m’a dérangé | **rien ne m’a dérangé** | In speech you may say *rien m’a dérangé* (drop *ne*).
    | nobody | **personne** n’est venu | **personne n’est venu** (same) | *personne* can lead the clause; *ne* may be omitted.
    | only | **c’est que** les pommes | **ce n’est que** les pommes | *ne…que* stays together; dropping *ne* sounds very informal.

    ### Common pitfalls
    1. **Adding *pas* with the other negative words** – English speakers often say *je ne mange pas jamais*; the correct form is **je ne mange jamais** (or simply *j’aime jamais* in Québec speech). The *pas* is redundant and ungrammatical with *jamais, plus, rien, personne, que*.
    2. **Placing the second negative word after the subject instead of after the verb** – The negative particle must surround the verb: **Il n’a rien vu**, not *Il rien a vu*.

    ### Québec‑specific filler
    When you want to stress “not at all,” you can add the familiar adverb **pantoute** after the negative phrase: *Je suis pas pantoute d’accord* (France: *pas du tout*). In very informal speech the *ne* is usually omitted: *J’suis pas pantoute d’accord*.

    Use these patterns to sound natural in everyday Québec conversation while keeping the formal version ready for writing.
