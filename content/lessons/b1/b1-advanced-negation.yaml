  type: multiple_choice
  question: Which sentence is a natural informal French sentence in which the *ne* has been dropped?
  options:
  - Je n’ai jamais vu ce film.
  - J’ai jamais vu ce film.
  - Je jamais vu ce film.
  - Je n’ai pas jamais vu ce film.
  answer_index: 1
  explanation: In everyday spoken French the *ne* is frequently omitted, leaving *j’ai jamais vu…*. Option B
    shows this informal pattern. Option A is grammatically correct but retains the *ne* and is more formal.
    Option C lacks the auxiliary *ai* and is ungrammatical. Option D keeps the *ne* while also using the
    non-standard *pas jamais* construction, which is not typical of informal speech. Therefore the correct
    answer is option B (index 1).
