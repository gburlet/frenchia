- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Advanced Negation'
  body: "In everyday Québec speech the first *ne* is often dropped, while the second negative word stays.\
    \ You’ll hear « j’ai jamais vu ça », « y a plus de pain », « y a rien à dire », « y a personne »,\
    \ or « j’ai jamais eu le temps de magasiner ». In France the *ne* is usually kept in spoken language: « je\
    \ n’ai jamais vu ça », « il n’y a plus de pain », etc. A familiar Québec adverb, **pantoute**, replaces\
    \ the French « pas du tout » and is often used with a dropped *ne*: « y a pas pantoute de raisons ».\
    \ In formal writing—emails, news, school work—both regions retain the full *ne* construction.\n\n\
    **Variants**\n1. *Jamais* – Québec: « j’ai jamais », France: « je n’ai jamais ». \n2. *Plus* – Québec:\
    \ « y a plus », France: « il n’y a plus ». \n3. *Rien* – Québec: « y a rien », France: « il n’y a\
    \ rien ». \n4. *Personne* – Québec: « y a personne », France: « il n’y a personne ». \n5. *Que* –\
    \ Québec: « je mange que du poulet », France: « je ne mange que du poulet ». \n6. *Pantoute* – Québec:\
    \ « pas pantoute », France: « pas du tout »."
  variants:
  - qc: pas pantoute de raisons
    fr: pas du tout de raisons
    en: not at all reasons
    formality: standard
- type: reading
  id: reading
  title: Une soirée au dépanneur
  passage_fr: C’était une petite fin de semaine ordinaire à Saint‑Laurent. Julie avait prévu d’aller au
    dépanneur du coin pour acheter du sirop d’érable et des biscuits avant le souper. Quand elle est arrivée,
    il n’y avait plus de sirop — le dernier lot avait été vendu la veille. Elle a demandé au caissier
    s’il restait encore du pain, mais il n’y avait **pas pantoute** de baguettes. « Je n’ai jamais vu
    un dépanneur vide comme ça », a‑t‑elle dit, en riant. Elle a tout de même acheté du fromage en grains
    et un petit pot de confiture. Sur le chemin du retour, elle a croisé Marc, qui n’avait **rien** à
    faire ce soir. « Je ne veux pas rester seul à la maison, » a‑t‑il expliqué, « mais je ne regarde plus
    la télé ; je préfère sortir un peu. » Julie a accepté de l’accompagner au parc. Ils n’ont vu **personne**
    d’autre, alors ils ont décidé de jouer aux cartes jusqu’à tard. « On ne mange que du fromage en grains
    et des biscuits, » a‑t‑elle ajouté, « c’est tout ce qu’on a. »
  translation_en: It was an ordinary little weekend in Saint‑Laurent. Julie had planned to go to the corner
    convenience store to buy maple syrup and some cookies before dinner. When she arrived, there was no
    more syrup — the last batch had been sold the day before. She asked the clerk if there were any bread
    left, but there wasn’t **any at all** (pantoute) any baguettes. “I’ve never seen a convenience store
    so empty,” she said, laughing. She still bought some cheese curds and a small jar of jam. On the way
    back, she ran into Marc, who had **nothing** to do tonight. “I don’t want to stay alone at home,”
    he explained, “but I don’t watch TV any more; I’d rather go out a bit.” Julie agreed to accompany
    him to the park. They saw **no one** else, so they decided to play cards until late. “We only eat
    cheese curds and cookies,” she added, “that’s all we have.”
