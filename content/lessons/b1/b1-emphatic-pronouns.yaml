  title: Une pause au café du coin après le travail
  passage_fr: C’est **moi**, je suis celui qui a proposé d’aller au café après le travail. **Nous**, on
    était tous fatigués, mais **toi, tu** avais envie d’une collation avant la fin de semaine. **Elle**
    a suggéré d’acheter des beignets au chocolat, alors **je** suis allé chercher les beignets ; **lui,
    il** a choisi un soda sans sucre pour le conducteur. **Vous**, vous avez entendu le bruit du klaxon
    du camion qui passait devant le bâtiment, et **elles** ont ri en voyant le conducteur du camion faire
    un signe de la main. Au moment de payer, **eux, ils** ont remarqué que la caissière avait oublié de
    scanner les chips. **Nous**, nous avons donc demandé à la caissière de les scanner à nouveau. **Moi**,
    j’ai payé en argent comptant parce que j’avais trouvé un billet de 20 $ dans ma poche. Après ça, **toi,
    tu** as proposé de passer chez ton ami pour regarder le match de hockey. **Ils** ont accepté, et **nous**
    sommes partis en marchant sous la neige légère, contents d’avoir passé une bonne soirée.
  translation_en: It was **me**, I’m the one who suggested going to the café after work. **We**, we were
    all tired, but **you, you** wanted a snack before the weekend. **She** suggested buying chocolate
    donuts, so **I** went to get the donuts; **he, he** chose a sugar-free soda for the driver. **You
    (plural)**, you heard the honk of the truck that was passing in front of the building, and **they
    (feminine)** laughed when they saw the truck driver wave his hand. At the moment of paying, **they
    (masculine)** noticed that the cashier had forgotten to scan the chips. **We**, we therefore asked
    the cashier to scan them again. **Me**, I paid in cash because I had found a $20 bill in my pocket.
    After that, **you, you** suggested stopping at your friend’s place to watch the hockey game. **They**
    agreed, and **we** left walking in the light snow, happy to have had a good evening.
