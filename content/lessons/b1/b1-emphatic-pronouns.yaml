  title: Une soirée au dépanneur de la rue Saint‑Pierre
  passage_fr: C’est **moi** qui ai proposé d’aller au dépanneur après le travail. **Nous** étions tous
    fatigués, mais **toi**, tu avais envie de prendre un snack avant la fin de semaine. **Elle** a suggéré
    d’acheter des beignes au chocolat, alors **je** suis allé chercher les beignes ; **lui**, il a choisi
    une bière sans alcool pour le conducteur. **Vous** avez entendu le bruit du klaxon du camion qui passait
    devant le magasin, et **elles** ont ri en voyant le conducteur du camion faire un signe de la main.
    Au moment de payer, **eux** ont remarqué que la caissière avait oublié de scanner les chips. **Nous**
    avons donc demandé à la caissière de les scanner à nouveau. **Moi**, j’ai payé en argent comptant
    parce que j’avais trouvé un billet de 20 $ dans ma poche. Après ça, **toi** as proposé de passer chez
    ton ami pour regarder le match de hockey. **Ils** ont accepté, et **nous** sommes partis en marchant
    sous la neige légère, contents d’avoir passé une bonne soirée.
  translation_en: It was **me** who suggested going to the convenience store after work. **We** were all
    tired, but **you**, you wanted a snack before the weekend. **She** suggested buying chocolate donuts,
    so **I** went to get the donuts; **he**, he chose a non‑alcoholic beer for the driver. **You (plural)**
    heard the honk of the truck that was passing in front of the shop, and **they (feminine)** laughed
    when they saw the truck driver wave his hand. At the moment of paying, **they (masculine)** noticed
    that the cashier had forgotten to scan the chips. **We** therefore asked the cashier to scan them
    again. **Me**, I paid in cash because I had found a $20 bill in my pocket. After that, **you** suggested
    stopping at your friend’s place to watch the hockey game. **They** agreed, and **we** left walking
    in the light snow, happy to have had a good evening.
