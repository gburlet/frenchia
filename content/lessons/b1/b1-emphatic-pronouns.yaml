- type: explanation
  id: explanation
  heading: Les pronoms toniques
  body: |-
    ***
    ### Les pronoms toniques – How to stress a person or a group

    In French, when you want to **emphasize** who is doing something, you replace the ordinary subject pronoun (je, tu, il…) with a **tonic pronoun**: **moi, toi, lui, elle, nous, vous, eux, elles**.  The form is the same in Québec and in France; the only lexical difference is that you’ll often hear **« fin de semaine »** instead of *week‑end* in the examples.

    #### Basic formation
    | Subject pronoun | Tonic pronoun |
    |----------------|--------------|
    | je            | **moi**      |
    | tu            | **toi**      |
    | il / elle     | **lui / elle** |
    | nous          | **nous**     |
    | vous          | **vous**     |
    | ils / elles   | **eux / elles** |

    #### Main uses
    1. **After a preposition** – the tonic pronoun is obligatory.
       - *Je viens **avec toi**.* → *I’m coming with you.*
       - *On se voit **chez eux** ce soir.* → *We’ll meet at their place tonight.*
    2. **For contrast or clarification** – often introduced by *c’est* or *c’est… que*.
       - *C’est **moi** qui décide.* → *It’s **me** who decides.*
       - *Toi, tu préfères le souper à la maison?* → *You, do you prefer dinner at home?*
    3. **In short answers** – replaces the whole clause.
       - *Qui veut du sirop d’érable? – **Moi**!* → *Who wants maple syrup? – **Me**!*

    #### Pitfalls for English speakers
    - **Never use a tonic pronoun as the simple subject of a sentence.** *« Moi vais au dépanneur »* is wrong; you must say *« Je vais au dépanneur »*.
    - **Don’t confuse *lui/elle* (object) with *il/elle* (subject).** After a preposition you must use the tonic form: *« Je parle à **lui** »* (not *à il*).

    #### Quick practice
    - *Nous allons au magasin, **toi** et **moi**?* → *Are you and I going to the store?*
    - *C’est **elles** qui ont gagné le concours.* → *It’s **they (feminine)** who won the contest.*

    Remember: the tonic pronoun adds emphasis, contrast, or follows a preposition. Use it whenever you’d naturally stress a person in English, and you’ll sound natural both in Montréal and Québec at large.
    ***
