- type: examples
  id: examples
  heading: Les pronoms toniques – How to stress a person or a group (B1)
  examples:
  - fr: C’est **moi** qui prépare le repas ce soir.
    en: It’s **me** who is preparing the meal tonight.
    region: common
  - fr: Tu penses que **toi**, tu vas finir le projet à temps ?
    en: Do you think **you** will finish the project on time?
    note: The repetition of *toi* adds emphasis; the construction *tu penses que…* is informal.
    region: common
  - fr: C’est **lui** qui a trouvé le meilleur café du quartier.
    en: It’s **him** who found the best coffee in the neighbourhood.
    region: common
  - fr: Je préfère aller au parc avec **elle**, pas avec les autres.
    en: I prefer going to the park with **her**, not with the others.
    region: common
  - fr: Ce n’est pas **nous** qui décidons, c’est le directeur.
    en: It’s not **us** who decide, it’s the manager.
    note: Used after a negative to contrast the speaker’s group with another party.
    region: common
  - fr: Vous, vous avez entendu ce que vous avez dit hier ? C’était surprenant.
    en: Did you hear what **you** said yesterday? It was surprising.
    note: The first *vous* is the tonic pronoun, stressing the listener.
    region: common
  - fr: Ce sont **eux** qui vont visiter le musée d’art demain.
    en: It’s **they** who are going to visit the art museum tomorrow.
    region: common
  - fr: Elles ont gagné le match, mais **elles** seules ont reçu les médailles.
    en: They won the game, but **they** alone received the medals.
    note: Emphasis on the specific group of girls.
    region: common
  - fr: C’est **moi** qui paie le café, alors tu me dois un croissant.
    en: It’s **me** who’s paying for the coffee, so you owe me a croissant.
    region: common
  - fr: Nous seuls pouvons garantir la qualité.
    en: Only we can guarantee the quality.
    note: The tonic pronoun comes before *seuls* for extra stress.
    region: common
- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Use of the emphatic (tonic) pronouns'
  body: 'The set of tonic pronouns — *moi, toi, lui, elle, nous, vous, eux, elles* — works exactly the
    same in Québec French as it does in European French. They are used to stress a person or a group,
    often after *c’est*, *c’est… qui*, or in contrastive structures (*pas moi, mais toi*). The only noticeable
    difference in a classroom context is the surrounding vocabulary: Québec speakers will more often hear
    *souper* (the evening meal) and *fin de semaine* (the weekend) in the example sentences, whereas European
    French would use *dîner* and *week-end*. Apart from these lexical choices, the grammar and the pronouns
    themselves are identical.  For instance: *« C’est moi qui prépare le souper ce soir. »* vs. *« C’est
    moi qui prépare le dîner ce soir. »*  or *« Ce n’est pas elle, c’est eux qui arrivent pendant la fin
    de semaine. »* vs. *« Ce n’est pas elle, c’est eux qui arrivent pendant le week-end. »*  The pronoms
    toniques function the same way regardless of the region.'
  variants:
  - qc: fin de semaine
    fr: week-end
    en: weekend
    formality: standard
- type: reading
