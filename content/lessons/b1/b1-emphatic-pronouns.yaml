- type: explanation
  id: explanation
  heading: Les pronoms toniques
  body: |-
    **Les pronoms toniques – How to stress a person or a group**

    In French, when you want to **emphasize** who is doing something, you **add** a tonic pronoun to the ordinary subject pronoun, or you place the tonic pronoun **after *c’est*** or **after a preposition** (avec, chez, pour, …). Tonic pronouns are **moi, toi, lui, elle, nous, vous, eux, elles**. The forms are the same in Québec and in France; the only lexical difference that may appear in everyday speech is **« fin de semaine »** instead of *week-end* (used only when the word *week-end* itself is needed).**

    ***

    #### Basic correspondence

    | Ordinary subject pronoun | Tonic pronoun |

    | -------------------------- | -------------- |

    | je

    | **moi**

    |

    | tu

    | **toi**

    |

    | il / elle

    | **lui / elle** |

    | nous

    | **nous**

    |

    | vous

    | **vous**

    |

    | ils / elles

    | **eux / elles** |

    #### Main uses

    1. **After a preposition** – the tonic pronoun is obligatory.

    - *Je viens **avec toi**.* → *I’m coming with you.*

    - *On se voit **chez eux** ce soir.* → *We’ll meet at their place tonight.*

    2. **For contrast or clarification** – often introduced by *c’est* or *c’est… que*.

    - *C’est **moi** qui décide.* → *It’s **me** who decides.*

    - *Toi, tu préfères le **dîner** à la maison ?* → *You, do you prefer lunch at home?* (In Québec, *dîner* = lunch.)

    3. **In short answers** – replaces the whole clause.

    - *Qui veut du jus d’orange ? – **Moi** !* → *Who wants orange juice? – **Me**!*

    #### Pitfalls for English speakers

    - **Do not replace the ordinary subject pronoun with a tonic pronoun.** *« Moi vais à la bibliothèque »* is wrong; you must keep the ordinary subject: *« Je vais à la bibliothèque »* or add the tonic for emphasis: *« Moi, je vais à la bibliothèque »*.

    - **Do not use *à lui/à elle* as a direct replacement for *il/elle* after a verb.** With verbs that take an indirect object, the correct clitic pronoun is *lui* or *leur*: *« Je lui parle »* (not *« Je parle à lui »*). Use *à lui* only for contrast: *« C’est à lui que je parle »*.

    - **Agreement with *c’est*.** Before *eux* or *elles*, formal French uses *ce sont* (e.g., *Ce sont elles qui ont gagné le concours*). Before *nous* or *vous* the construction *c’est* remains correct (e.g., *C’est nous qui avons gagné*).

    #### Quick practice

    - *Nous allons au supermarché, **toi** et **moi** ?* → *Are you and I going to the supermarket?*

    - *Ce sont **elles** qui ont gagné le concours.* → *It’s **they (feminine)** who won the contest.*

    Remember: the tonic pronoun adds emphasis, contrast, or follows a preposition. Use it whenever you would naturally stress a person in English, and you’ll sound natural both in Montréal and throughout Québec.***
