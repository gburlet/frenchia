- id: ex-09
  grammar_topics:
  - emphatic-pronouns
  type: multiple_choice
  question: Which tonic pronoun correctly completes the sentence?
  options:
  - C’est lui qui a rangé les chaises.
  - C’est il qui a rangé les chaises.
  - C’est elles qui a rangé les chaises.
  - C’est eux qui a rangé les chaises.
  answer_index: 0
  explanation: The stressed form of the third-person singular masculine pronoun is **lui**. **Il** is
    the ordinary subject pronoun and cannot be used after *c’est*. **Elles** is plural and does not agree
    with the singular verb *a rangé*. **Eux** is also plural, which does not agree with the singular verb
    *a rangé*.
- id: ex-10
  grammar_topics:
  - emphatic-pronouns
  type: multiple_choice
  question: Choose the sentence that uses a tonic pronoun to emphasize the group that will go to the museum
    tomorrow.
  options:
  - C'est nous qui allons visiter le musée demain, mais eux, ils restent à la maison.
  - Nous allons visiter le musée demain.
  - Vous allez visiter le musée demain.
  - Elles vont visiter le musée demain.
  answer_index: 0
  explanation: The sentence that truly emphasizes the group that will go to the museum is **« C'est nous
    qui allons visiter le musée demain, mais eux, ils restent à la maison. »**. Here the tonic pronoun
    **nous** follows *c’est* to stress the subject, and the contrasting **eux, ils** highlights the other
    group. The other options either lack any tonic pronoun or do not create a contrast, so they do not
    convey the same emphatic meaning. The use of *c’est* + tonic pronoun is the standard way to give emphasis
    in French (both European and Québec varieties).
