  examples:
  - fr: C’est **moi** qui prépare le souper ce soir.
    en: It’s **me** who is preparing dinner tonight.
    region: qc
  - fr: Tu penses que **toi**, tu vas finir le projet à temps ?
    en: Do you think **you** will finish the project on time?
    note: The repetition of *toi* adds emphasis; the construction *tu penses que…* is informal.
    region: common
  - fr: C’est **lui** qui a trouvé la meilleure poutine du quartier.
    en: It’s **him** who found the best poutine in the neighbourhood.
    region: qc
  - fr: Je préfère aller au parc avec **elle**, pas avec les autres.
    en: I prefer going to the park with **her**, not with the others.
    region: common
  - fr: Ce n’est pas **nous** qui décidons, c’est le directeur.
    en: It’s not **us** who decide, it’s the manager.
    note: Used after a negative to contrast the speaker’s group with another party.
    region: common
  - fr: Vous avez entendu ce que **vous** avez dit hier ? C’était surprenant.
    en: Did you hear what **you** said yesterday? It was surprising.
    note: The second *vous* is the tonic pronoun, stressing the listener.
    region: common
  - fr: Ce sont **eux** qui vont magasiner au centre commercial demain.
    en: It’s **they** who are going shopping at the mall tomorrow.
    region: qc
  - fr: Elles ont gagné le match, mais **elles** seules ont reçu les médailles.
    en: They won the game, but **they** alone received the medals.
    note: Emphasis on the specific group of girls.
    region: common
  - fr: C’est **moi** qui paie le café, alors tu me dois un croissant.
    en: It’s **me** who’s paying for the coffee, so you owe me a croissant.
    region: common
  - fr: On va le faire, mais **nous** seuls pouvons garantir la qualité.
    en: We’ll do it, but **we** alone can guarantee the quality.
    note: The tonic pronoun follows *seuls* for extra stress.
    region: common
- type: regional_note
  id: regional-note
  heading: 'Québec vs. France: Use of the emphatic (tonic) pronouns'
  body: |-
    The set of tonic pronouns — *moi, toi, lui, elle, nous, vous, eux, elles* — works exactly the same in Québec French as it does in European French. They are used to stress a person or a group, often after *c’est*, *c’est… qui*, or in contrastive structures (*pas moi, mais toi*). The only noticeable difference in a classroom context is the surrounding vocabulary: Québec speakers will more often hear *souper* (supper) and *fin de semaine* (week‑end) in the example sentences, whereas European French would use *dîner* and *week‑end*. Apart from these lexical choices, the grammar and the pronouns themselves are identical.

    **Variants (when they appear):**
    - *souper* (QC) ↔ *dîner* (FR)
    - *fin de semaine* (QC) ↔ *week‑end* (FR)
    - *magasiner* (QC) ↔ *faire du shopping* (FR)
    - *dépanneur* (QC) ↔ *épicerie* (FR)
    - *café* (QC) ↔ *café* (FR – same word, but the drink may be a larger “café” in QC)
    - *croissant* (QC) ↔ *croissant* (FR – same word, no change)

    If you keep the surrounding vocabulary neutral, you’ll notice no grammatical difference at all between Québec and France when using the pronoms toniques.
  variants: []
- type: reading
