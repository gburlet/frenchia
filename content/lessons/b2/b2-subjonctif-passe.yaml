sections:
- type: explanation
  id: explanation
  heading: Le subjonctif passé
  body: |-
    ***

    ### The Past Subjunctive (Le subjonctif passé)

    The subjonctif passé is used whenever the subordinate action is **completed before** the action expressed in the main clause, no matter what tense the main clause has. It therefore marks an action that is anterior to the main clause and is still felt subjectively (doubt, emotion, necessity, judgment, etc.).

    #### Formation

    1. **Auxiliary verb** in the **present subjunctive** (either *avoir* or *être*).

    2. **Past participle** of the main verb.

    | Subject | Present subjunctive of *avoir* | Present subjunctive of *être* |
    | --------- | ------------------------------- | ------------------------------- |
    | je | **aie** | **sois** |
    | tu | **aies** | **sois** |
    | il / elle / on | **ait** | **soit** |
    | nous | **ayons** | **soyons** |
    | vous | **ayez** | **soyez** |
    | ils / elles | **aient** | **soient** |

    **Note:** before a vowel sound (il, elle, on, ils, elles), the conjunction **que** elides to **qu'** (e.g., *qu'il*, *qu'elle*, *qu'on*, *qu'ils*, *qu'elles*).

    **Example**: *Je doute **qu'**il **ait fini** son travail.* (I doubt that he **has finished** his work.)

    #### When to use it

    - After expressions of doubt, fear, regret, or emotion, even when those expressions are in a past or conditional tense: *Je craignais que tu **n’aies pas compris**.*

    - **After expressions of doubt or uncertainty**: *Je ne suis pas sûr qu'il **ait été** publié en 1990.*

    - In relative clauses when the subordinate event precedes the main event: *C’est le meilleur film que **j'aie vu**.*

    - After conjunctions that trigger the subjunctive (e.g., **bien que**, **quoique**, **pour que**) when the subordinate action is anterior: *Bien qu’il **ait plu**, nous sommes sortis.*

    #### Common pitfalls for English speakers

    1. **Choosing the wrong auxiliary** – verbs of motion and reflexive verbs use *être* in the past subjunctive, just as they do in the passé composé: *Elle est partie* → *Je suis content qu’elle **soit partie**.*

    2. **Confusing the past subjunctive with the pluperfect indicative**. The past subjunctive expresses subjectivity, whereas the pluperfect indicative states a factual past event.

    #### Quick check

    - *Nous regrettons que vous **ayez perdu** votre passeport.*

    - *Il était surpris que les enfants **aient fini** leurs devoirs si tôt.*

    Mastering the past subjunctive lets you talk about **hypothetical or uncertain past events** with the nuance native speakers expect. ***
