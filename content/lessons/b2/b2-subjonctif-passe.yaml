- id: ex-09
  grammar_topics:
  - subjonctif-passe
  type: multiple_choice
  question: Which sentence correctly uses the past subjunctive after a past-tense expression of emotion?
  options:
  - Elle était ravie que nous avions fini le projet avant la date limite.
  - Elle était ravie que nous ayons fini le projet avant la date limite.
  - Elle était ravie que nous aurions fini le projet avant la date limite.
  - Elle était ravie que nous avions finissait le projet avant la date limite.
  answer_index: 1
  explanation: The main clause is in the imperfect (était ravie), so the subordinate clause must be in
    the **subjonctif passé**. This requires the present subjunctive of the auxiliary *avoir* (ayons) followed
    by the past participle *fini*. Option B therefore is correct. Option A uses the **plus-que-parfait
    de l’indicatif** (avions fini), option C uses the **conditionnel passé** (aurions fini), and option D
    is ungrammatical (« avions finissait »).
- id: ex-10
  grammar_topics:
  - subjonctif-passe
  type: multiple_choice
  question: Choose the sentence that correctly applies the past subjunctive with the verb *être* after
    a verb of doubt in the conditional.
  options:
  - Je douterais que tu avais été à la réunion hier.
  - Je douterais que tu sois à la réunion hier.
  - Je douterais que tu aies été à la réunion hier.
  - Je douterais que tu eusses été à la réunion demain.
  answer_index: 2
  explanation: The verb *douter* in the conditional (*je douterais*) triggers the subjunctive. Because
    the subordinate action (being at the meeting) is completed before the moment of doubt, we need the
    **past subjunctive** of *être*. The past subjunctive is formed with the **auxiliary *avoir*** in the
    present subjunctive (que *j’aie*, *tu aies*, *il/elle/on ait*, etc.) + the past participle *été*.
    Therefore the correct form is **que tu aies été**. Option C is the only sentence that uses this construction.
    Option A uses the indicative (*avais été*), which is not allowed after *douter* in the conditional.
    Option B uses the present subjunctive (*sois*) without the past participle, so it does not express
    a prior action. Option D uses the literary pluperfect subjunctive (*eusses été*), which is not the
    form taught in this lesson.
