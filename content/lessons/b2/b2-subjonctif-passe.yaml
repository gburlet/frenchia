- type: reading
  id: reading
  title: Le projet de rénovation du vieux théâtre
  passage_fr: |-
    Lorsque la municipalité décida de rénover le vieux théâtre du centre-ville, elle invita plusieurs experts à présenter leurs propositions. Le conseil municipal doutait que les architectes **aient étudié** les plans historiques avant de soumettre leurs idées. Cependant, le chef du service technique craignait que les entrepreneurs **n’aient pas respecté** les délais imposés par la loi sur la protection du patrimoine. Il était également surpris que les ingénieurs **aient déjà testé** la solidité du plafond, alors que les travaux n’avaient même pas commencé.

    Le directeur du théâtre, qui était très **attaché** à ce bâtiment, regrettait que les habitants **n’aient pas exprimé** plus tôt leurs inquiétudes concernant le bruit des machines. Il souhaitait que la communauté **ait compris** l’importance de préserver l’acoustique originale du lieu.

    Finalement, après plusieurs réunions, le comité décida que le projet **pourrait avancer** seulement si toutes les autorisations **avaient été obtenues** avant le premier jour de chantier. Le maire, qui avait suivi chaque détail, était content que les partenaires **aient accepté** de financer une partie des travaux grâce à une subvention culturelle. Ainsi, le théâtre pourra rouvrir ses portes l’an prochain, et tout le monde pourra profiter d’un espace rénové tout en respectant son histoire.
  translation_en: |-
    When the municipality decided to renovate the old downtown theater, it invited several experts to present their proposals. The city council doubted that the architects **had studied** the historical plans before submitting their ideas. However, the head of the technical department feared that the contractors **had not respected** the deadlines imposed by the heritage-protection law. He was also surprised that the engineers **had already tested** the strength of the ceiling, even though the work had not even started.

    The theater director, who was very **attached** to the building, regretted that the residents **had not expressed** their concerns about the noise of the machines earlier. He wished that the community **had understood** the importance of preserving the venue’s original acoustics.

    Finally, after several meetings, the committee decided that the project **could proceed** only if all permits **had been obtained** before the first day of construction. The mayor, who had followed every detail, was pleased that the partners **had accepted** to finance part of the work through a cultural grant. Thus, the theater will be able to reopen its doors next year, and everyone will be able to enjoy a renovated space while respecting its history.
