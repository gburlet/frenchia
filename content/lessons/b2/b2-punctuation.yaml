- type: regional_note
  id: regional-note
  heading: 'Québec vs. France : punctuation spacing'
  body: For the period and comma, both regions use **no space before** the mark and **one regular space
    after** it. No space (thin or otherwise) is ever placed before a period or a comma. In Québec (OQLF)
    there is **no space before** the semicolon (;), the exclamation point (!) and the question mark (?).
    In France a **thin non-breaking space** is placed **before** the semicolon (;), the exclamation point
    (!) and the question mark (?). Both regions use a **full non-breaking space** before a colon (:) and
    inside guillemets « ».
  variants: []
- type: reading
  id: reading
  title: Le projet de rénovation du centre communautaire
  passage_fr: |-
    Le conseil municipal a voté hier la rénovation du centre communautaire : il sera modernisé, agrandi et rendu plus accessible aux personnes à mobilité réduite.

    Le budget alloué s’élève à deux millions de dollars; la moitié provient du fonds régional, le reste sera couvert par des dons privés.

    Les travaux débuteront au printemps — probablement en avril — et dureront environ huit mois. Pendant ce temps, les activités sportives seront déplacées dans le gymnase de l’école secondaire voisine.

    « Nous voulons un espace où les familles peuvent se retrouver, où les seniors peuvent suivre des ateliers créatifs, et où les jeunes auront une salle de musique », a déclaré la directrice du centre, Madame Lefèvre.

    Les habitants ont été invités à donner leur avis : « J’aimerais que la salle d’exposition soit plus grande! », a affirmé Monsieur Tremblay, propriétaire du café du coin. D’autres ont suggéré d’ajouter une petite bibliothèque; ils pensent que cela encouragerait la lecture chez les enfants.

    Le calendrier prévoit une inauguration officielle en décembre; une cérémonie sera organisée avec des discours, une visite guidée et un concert de l’orchestre local. Vous serez tous les bienvenus!
  translation_en: |-
    The municipal council voted yesterday on the renovation of the community centre: it will be modernised, enlarged and made more accessible for people with reduced mobility.

    The allocated budget amounts to two million dollars; half comes from the regional fund, the rest will be covered by private donations.

    The works will start in spring—probably in April—and will last about eight months. During this time, the sports activities will be moved to the gymnasium of the neighbouring high school.

    "We want a space where families can meet, where seniors can attend creative workshops, and where young people will have a music room," said the centre’s director, Ms. Lefèvre.

    Residents were invited to give their opinion: "I would like the exhibition hall to be larger!", affirmed Mr. Tremblay, owner of the corner café. Others suggested adding a small library; they think this would encourage reading among children.

    The schedule plans an official inauguration in December; a ceremony will be organised with speeches, a guided tour and a concert by the local orchestra. You are all welcome!
