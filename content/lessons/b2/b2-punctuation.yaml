sections:
- type: explanation
  id: explanation
  heading: 'La ponctuation : le point (.)'
  body: |-
    **In French the point** (called *le point* or *le point final*) marks the end of a declarative sentence, just like the English period. Its shape is identical (.) and it is **never preceded by a space**; **a regular space follows it** before the next sentence begins. (When you type, use a normal space after the point; the space is not a thin-nbsp.) In Québec (OQLF) the rule is the same as in France for the point, but the spacing for other marks differs (see the regional note on ; ! ?). Below you will find the Québec-default conventions unless a note says otherwise.

    ---

    **Examples**

    - **Je travaille aujourd’hui.** – *I am working today.*

    - **Il a plu toute la nuit.** – *It rained all night.*

    ---

    ### Spacing rules (Québec default)

    - No space **before** the point.

    - A regular space **after** the point.

    - In abbreviations the point sticks directly to the preceding letters (e.g., **M.**, **c.-à-d.**, **etc.**). After the abbreviation you put a normal space before the next word.

    (Note that titles such as **Dr**, **Mme**, **Me** are written without a trailing point.)

    ---

    ### Common pitfalls for English speakers

    1. **Adding a space before the point** – Some learners type « Bonjour . ». The space is wrong. Write **Bonjour.** not **Bonjour .**

    2. **Using a double space after a period** – French typography never uses double spaces. One single space (or a line-break) separates sentences.

    ---

    ### Quick checklist

    - Point at the end of a statement → **no preceding space**.

    - Start the next sentence with a capital letter → **one regular space** after the period.

    - In abbreviations, keep the point attached to the abbreviation and then put a normal space before the following word.

    ---

    Mastering the point will make your French writing look clean and professional, and it prepares you for the other punctuation marks that have their own spacing conventions in Québec (e.g., ; ! ?).
