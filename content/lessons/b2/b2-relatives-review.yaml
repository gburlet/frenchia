sections:
- type: explanation
  id: explanation
  heading: 🔎 Révision des pronoms relatifs – La précision (B2)
  body: |-
    ***
    In this review you will decide which relative pronoun—**qui, que, dont, où, lequel / laquelle / lesquels / lesquelles, duquel, de laquelle, desquels, desquelles**—fits a given clause. The choice depends on three factors: the function of the pronoun in the subordinate clause (subject, direct object, indirect object, complement of a preposition, or locative), the gender-number of its antecedent, and whether the antecedent is a person, a thing, or an abstract idea.

    **1. Subject of the relative clause** → **qui** (person or thing). Example: *Le professeur **qui** explique la leçon est très clair.*

    **2. Direct object** → **que**. Example: *Le livre **que** j’ai acheté hier est passionnant.*

    **3. Complement with "de"** → **dont** (covers "de + noun/pronoun"). Example: *Voici la ville **dont** je t’ai parlé.*

    **4. Complement of a specific preposition (à, pour, avec, etc.)** → **lequel** and its variations, or the contracted forms **auquel, à laquelle, auxquels, auxquelles**. Example: *Le problème **auquel** nous devons répondre est complexe.*

    **5. Locative (place or time)** → **où**. Example: *L’année **où** nous avons voyagé était mémorable.*

    **Pitfall #1 – Confusing *qui* and *que***: English speakers often use *qui* for both subject and object because English uses “who/that” for both. Remember: if the relative pronoun could be replaced by *him/her/it* (object), you need **que**.

    **Pitfall #2 – Overusing *dont***: *Dont* only replaces *de + noun*; it cannot stand for *à* or other prepositions. For *à* you must use *auquel* (or its gender-number forms).

    Practice by identifying the function of the missing pronoun, then select the correct form. Mastery gives you the precision needed for B2-level writing and speaking.
    ***
- type: table
  id: table
  heading: 🔎 Révision des pronoms relatifs – La précision (B2)
  columns:
  - Function in the subordinate clause
  - Pronoun(s) used
  - When the antecedent is a **person**
  - When the antecedent is a **thing / abstract idea**
  - Notes
  rows:
  - - Subject of the relative clause
    - qui
    - ✓ – « Le professeur **qui** explique… »
    - ✓ – « Le livre **qui** raconte… »
    - Never preceded by a preposition.
  - - Direct object (COD)
    - que
    - ✓ – « L’étudiante **que** j’ai rencontrée… »
    - ✓ – « Le film **que** nous avons vu… »
    - Never preceded by a preposition; if a preposition is needed, use *préposition + qui/lequel*.
  - - Indirect object introduced by *à*
    - à qui
    - ✓ – « Le collègue **à qui** j’écris… »
    - ✗ – (not used with things)
    - Use *à qui* for persons; for things the construction is *à laquelle / auquel* (see next row).
  - - Indirect object introduced by *de*
    - de qui / dont
    - ✓ – « Le collègue **dont** je parle… » (or « La cliente **de qui** je parle… », less common)
    - ✓ – « Le problème **dont** il se plaint… » ; « Le sujet **dont** nous discutons… »
    - Both *de qui* and *dont* are possible with persons; *dont* is the normal form for both persons and
      things.
  - - Complement of a preposition other than *à / de*
    - préposition + qui / laquelle / lequel
    - ✓ – « L’homme **avec qui** tu parles… »
    - ✓ – « Le tableau **sur lequel** elle travaille… »
    - After a preposition, *qui* is kept for persons, *lequel* (and its forms) for things.
  - - Locative (place or time)
    - où
    - ✓ – « La ville **où** j’ai grandi… »
    - ✓ – « Le jour **où** nous sommes partis… »
    - Used only for places or moments, never for a simple person.
  - - Preposition *de* + thing/abstract idea
    - dont
    - ✓ – « Le collègue **dont** je parle… »
    - ✓ – « Le problème **dont** il se plaint… », « Le sujet **dont** nous parlons… »
    - Used when the relative clause already contains *de*; works for both persons and things.
  - - Preposition *à* + thing/abstract idea
    - auquel / à laquelle / auxquels / auxquelles
    - ✓ – « Le collègue **à qui** j’écris… »
    - ✓ – « Le sujet **auquel** je me réfère… », « Les projets **auxquels** nous participons… »
    - Used for things or abstract ideas after *à*.
  caption: Table 1 – Quick reference for choosing the correct relative pronoun.
