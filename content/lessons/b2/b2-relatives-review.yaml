- id: ex-05
  grammar_topics:
  - relatives-review
  type: multiple_choice
  question: Choose the correct relative pronoun to complete the sentence: « Le rapport ___ nous avons
    rédigé hier a été envoyé au directeur. »
  options:
  - dont
  - qui
  - où
  - que
  answer_index: 3
  explanation: 'The relative clause « nous avons rédigé hier » describes the antecedent « le rapport ».
    The pronoun must therefore be the direct-object relative pronoun **que** (the report that we wrote
    yesterday). « Dont » is used with a complement introduced by *de*, « qui » for a subject relative,
    and « où » for a place or time complement. The sentence reads: « Le rapport **que** nous avons rédigé
    hier a été envoyé au directeur. »'
- id: ex-06
  grammar_topics:
  - relatives-review
  type: multiple_choice
  question: Select the appropriate relative pronoun: « Voici la bibliothèque _____ j’ai trouvé le manuscrit
    rare que vous cherchiez. »
  options:
  - où
  - dont
  - laquelle
  - qui
  answer_index: 0
  explanation: The clause « j’ai trouvé le manuscrit rare que vous cherchiez » tells us **where** the
    manuscript was found, i.e., the location. For a place, the relative pronoun is **où**. « Dont » would
    replace *de* + noun, « laquelle » is used after a preposition (e.g., *dans laquelle, à laquelle, de
    laquelle*), but it cannot stand alone after a verb of location; « qui » would be a subject pronoun,
    which does not fit here. Therefore the correct choice is **où**.
- id: ex-07
  grammar_topics:
  - relatives-review
  type: multiple_choice
  question: Pick the correct form of the relative pronoun to complete the sentence: « Les solutions _____ nous
    avons adoptées hier seront mises en œuvre dès demain. »
  options:
  - que
  - lesquelles
  - lesquels
  - dont
  answer_index: 0
  explanation: '« Les solutions » is a feminine-plural antecedent that functions as the direct object
    of the verb *avons adoptées*. The appropriate relative pronoun is **que**. Because the antecedent
    is the direct object, the past participle *adoptées* agrees in gender and number with it. The other
    choices are incorrect: *lesquelles* and *lesquels* are used when the relative pronoun is the subject
    of the relative clause (or after a preposition) – they never replace a direct object. *dont* is used
    when the verb or expression is introduced by *de* (e.g., *les solutions dont nous avons parlé*), which
    is not the case here, so it cannot be used in this sentence.'
