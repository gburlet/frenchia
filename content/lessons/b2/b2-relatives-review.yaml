  examples:
  - fr: Le professeur **qui** explique la grammaire a reçu une récompense.
    en: The teacher who explains the grammar received an award.
    region: common
  - fr: J’ai lu le roman **que** tu m’as recommandé la semaine dernière.
    en: I read the novel that you recommended to me last week.
    region: common
  - fr: Voici la conférence **dont** les participants ont parlé pendant des heures.
    en: Here is the lecture that the participants talked about for hours.
    region: common
  - fr: Le café **où** nous nous sommes rencontrés ferme à 22 h.
    en: The café where we met closes at 10 p.m.
    region: common
  - fr: J’ai acheté une montre **qui** correspond exactement à mes besoins.
    en: I bought a watch which matches my needs perfectly.
    region: common
  - fr: Les projets **qui** ont été présentés hier seront réévalués demain.
    en: The projects that were presented yesterday will be reassessed tomorrow.
    region: common
  - fr: C’est le problème **dont** nous devons nous libérer avant la fin du trimestre.
    en: It’s the problem from which we must free ourselves before the end of the term.
    region: common
  - fr: La ville **d’où** je viens a organisé un festival international.
    en: The city from which I come has organized an international festival.
    region: common
  - fr: Les solutions **dont** nous avons discuté sont déjà en cours d’implémentation.
    en: The solutions that we discussed are already being implemented.
    region: common
  - fr: Voici le tableau **dont** la couleur a changé après le nettoyage.
    en: Here is the painting whose colour changed after cleaning.
    region: common
- type: reading
  id: reading
  title: Révision des pronoms relatifs – La précision (B2)
  passage_fr: |-
    Lors de la dernière réunion du comité de développement durable, **qui** réunissait des experts de différents secteurs, un ingénieur en énergie solaire a présenté un projet ambitieux. Le dispositif, **que** l’équipe a conçu pendant deux ans, utilise des panneaux flexibles que l’on peut installer sur les toits des immeubles anciens. Le principe **sur lequel** le fonctionnement repose est simple : chaque panneau capte la lumière et la transforme en électricité grâce à un matériau semi-conducteur innovant.

    Le bâtiment administratif, **où** se tient habituellement la conférence, a été choisi parce qu’il possède une façade en verre qui laisse entrer beaucoup de lumière naturelle. Les architectes, **qui** ont déjà travaillé sur plusieurs projets écologiques, ont prévu d’intégrer les panneaux sans altérer l’esthétique du lieu. Le budget du projet, **dont** la mise en œuvre dans les autres quartiers dépend, a été approuvé à la majorité.

    Parmi les partenaires, il y a une association locale, **dont** nous avons reçu un soutien financier important. Les solutions **dont** nous nous inspirons proviennent de recherches menées en Scandinavie. Enfin, le directeur du programme, **dont** la vision est de rendre la ville neutre en carbone d’ici 2035, a souligné que chaque initiative, **qu'elle** soit petite ou grande, contribue à l’objectif commun.

    Cette initiative montre que la coopération entre le secteur public, le privé et la société civile peut créer des changements concrets, **qui** seront visibles dans les années à venir.
  translation_en: |-
    At the last meeting of the sustainable-development committee, which brought together experts from different sectors, a solar-energy engineer presented an ambitious project. The device, which the team had designed over two years, uses flexible panels that can be installed on the roofs of old buildings. The principle on which the operation relies is simple: each panel captures light and turns it into electricity thanks to an innovative semiconductor material.

    The administrative building, where the conference is usually held, was chosen because it has a glass façade that lets in a lot of natural light. The architects, who have already worked on several ecological projects, have planned to integrate the panels without altering the place’s aesthetics. The budget of the project, on which its implementation in other neighbourhoods depends, was approved by a majority.

    Among the partners is a local association, from which we received significant financial support. The solutions we draw inspiration from come from research carried out in Scandinavia. Finally, the programme director, whose vision is to make the city carbon-neutral by 2035, emphasized that every initiative, whether small or large, contributes to the common goal.

    This initiative shows that cooperation between the public sector, private companies and civil society can create concrete changes, which will be visible in the years to come.
