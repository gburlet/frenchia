  examples:
  - fr: J’ai retrouvé **un cher** ami au café du coin.
    en: I ran into a dear friend at the neighborhood café.
    note: ‘cher’ before the noun means ‘dear, beloved’.
    region: common
  - fr: Nous avons acheté **un restaurant cher** pour y organiser nos réunions d’équipe.
    en: We bought an expensive restaurant to hold our team meetings there.
    note: ‘cher’ after the noun means ‘expensive’. Many adjectives behave this way, though not all.
    region: common
  - fr: Ce tableau est **ancien**, il date du XVIIIᵉ siècle.
    en: This painting is old; it dates from the 18th century.
    region: common
  - fr: Le bâtiment est **ancien**, il a été construit au XIXᵉ siècle.
    en: The building is old; it was built in the 19th century.
    region: common
  - fr: Le repas était **cher**, mais la compagnie était excellente.
    en: The meal was costly, but the company was excellent.
    region: common
  - fr: C’est **un grand** homme.
    en: He is a great man.
    note: ‘grand’ before the noun stresses importance; after the noun it describes size (e.g., *un homme
      grand* = a tall man).
    region: common
  - fr: Le bâtiment est **grand**, il compte six étages.
    en: The building is large; it has six floors.
    region: common
  - fr: Nous avons pris **un dernier** verre avant de rentrer chez nous.
    en: We had a final drink before heading home.
    region: common
  - fr: C’est **le dernier** épisode de la série que je vais regarder.
    en: This is the last episode of the series I will watch.
    region: common
  - fr: Il a présenté **un pauvre** argument, mais il a convaincu le jury.
    en: He put forward a weak argument, yet he convinced the jury.
    note: ‘pauvre’ before the noun conveys a judgment (‘poor, weak’); after the noun it would refer to
      material poverty (*une famille pauvre*).
    region: common
  - fr: Le village était **pauvre**, sans eau courante ni électricité.
    en: The village was poor, lacking running water or electricity.
