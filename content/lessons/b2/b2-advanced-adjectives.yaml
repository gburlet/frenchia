    en: We ate in a charming restaurant last night.
    region: common
- type: reading
  id: reading
  title: Les souvenirs d’un dernier voyage
  passage_fr: |-
    Après une longue année de travail, **un vieux** collègue de l’université m’a proposé de faire une petite escapade dans les montagnes. Nous avons choisi **un petit** village perché, où les habitants sont très accueillants. Le premier soir, nous avons **mangé** dans **un charmant** restaurant qui ne servait que des plats régionaux. Le décor était **charmant**, avec des poutres en bois et des lanternes qui créaient une atmosphère chaleureuse.

    Le lendemain, nous avons entrepris une randonnée difficile. Le sentier était **difficile**, mais la vue depuis le sommet était **magnifique** : un **immense panorama** qui s’étendait à perte de vue. En redescendant, nous avons croisé **un pauvre** berger qui gardait ses moutons. Il était **pauvre**, mais son sourire était sincère et réconfortant.

    Avant de repartir, nous avons acheté **un dernier** souvenir dans la boutique du village : une petite boîte en bois gravée d’un **motif ancien**. Le vendeur nous a expliqué que c’était **un symbole ancien** de prospérité. En rentrant chez moi, je me suis rendu compte que ce voyage avait été **un grand** cadeau pour mon moral et que les souvenirs resteront **gravés** dans mon cœur.
  translation_en: |-
    After a long year of work, **an old** university colleague suggested that we take a short getaway in the mountains. We chose **a small** perched village where the inhabitants are very welcoming. The first evening we **ate** in **a charming** restaurant that served only regional dishes. The décor was **charming**, with wooden beams and lanterns that created a warm atmosphere.

    The next day we embarked on a difficult hike. The trail was **difficult**, but the view from the summit was **magnificent**: an **immense panorama** that stretched as far as the eye could see. While descending we met **a poor** shepherd watching over his sheep. He was **poor**, but his smile was sincere and comforting.

    Before leaving we bought **one last** souvenir in the village shop: a small wooden box engraved with an **ancient motif**. The seller explained that it was **an ancient symbol** of prosperity. Back home I realized that this trip had been **a great** gift for my morale and that the memories will remain **etched** in my heart.
