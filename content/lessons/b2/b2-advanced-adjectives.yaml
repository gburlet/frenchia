sections:
- type: explanation
  id: explanation
  heading: Les adjectifs avancés – La précision du placement
  body: |-
    In French, many adjectives change their meaning depending on whether they stand **before** or **after** the noun they modify. This subtle shift is a hallmark of B2-level precision and can turn a neutral description into a nuanced comment. The rule applies to adjectives that have a *subjective* (value-laden) meaning when placed before the noun and an *objective* (literal) meaning when placed after it. Below are the most reliable patterns and a few typical pairs you will meet often.  

    **Before the noun** – the adjective expresses a *subjective* judgment, a *value* the speaker attaches to the noun, or a *figurative* sense. The meaning is often “great, dear, important, etc.” Example: **un **cher** ami** – ‘a dear friend’. Here *cher* conveys affection, not price. Another classic pair: **un **grand** homme** – ‘a great man’ (important, admirable).

    **After the noun** – the same adjective usually conveys an *objective* or *literal* characteristic, often related to *size, age, cost, or physical state*. Example: **un restaurant **cher** – ‘an expensive restaurant’. Another pair: **un homme **grand** – ‘a tall man’.

    A frequently-tested noun is **bâtiment**: **un bâtiment ancien** – ‘an old building’ (objective, age-related). If the adjective is placed before the noun – **un ancien bâtiment** – it means ‘a former building’, i.e., a building that no longer serves its original purpose.

    **Pitfalls for English speakers**
    1. **Assuming the English order works** – English speakers always put the adjective **before** the noun. Because of this habit they may forget that in French the *neutral* or *literal* position is **after** the noun, and that moving the adjective **before** the noun creates a more subjective or figurative nuance (e.g., *un grand homme* vs. *un homme grand*).
    2. **Confusing “ancien” with “vieux”** – *ancien* before a noun means ‘former’; after the noun it means ‘old’. *Vieux* (or *vieil* before a vowel) always means ‘old’ and never carries the ‘former’ sense, so swapping the two can create misunderstandings.
