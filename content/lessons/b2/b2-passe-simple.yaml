sections:
- type: explanation
  id: explanation
  heading: Le passé simple – recognition and basic use (B2)
  body: |-
    **When and why the passé simple appears**  

    The passé simple is the literary counterpart of the **passé composé**. It is used mainly in novels, historical accounts, biographies, and formal speeches to narrate a sequence of completed actions that move the story forward. In everyday conversation you will almost never hear it; you will hear the **passé composé** instead.  

    **Forming the passé simple**  

    The endings depend on the verb group.  

    | Infinitif | 1ᵉʳ pers. du singulier (je) | 2ᵉ pers. du singulier (tu) | 3ᵉ pers. du singulier (il/elle) | 1ᵉʳ pers. du pluriel (nous) | 2ᵉ pers. du pluriel (vous) | 3ᵉ pers. du pluriel (ils/elles) |
    | --- | --- | --- | --- | --- | --- | --- |
    | **-er** (parler) | parl**ai** | parl**as** | parl**a** | parl**âmes** | parl**âtes** | parl**èrent** |
    | **-ir / -re** (finir, prendre) | fin**is** / pr**is** | fin**is** / pr**is** | fin**it** / pr**it** | fin**îmes** / pr**îmes** | fin**îtes** / pr**îtes** | fin**irent** / pr**irent** |
    | **-oir** (voir) | v**is** | v**is** | v**it** | v**îmes** | v**îtes** | v**irent** |
    | **Irregular** (être, avoir, faire, etc.) – many use the **-us / -ins** endings (fus, eus, vins, etc.) with stems **fu-**, **eu-**, **v-**, etc. The circumflex appears only on the **nous** and **vous** forms (e.g., *nous eûmes*). |

    **Typical uses**  

    * **Narrative succession** – *« Il entra, **regarda** autour de lui, puis **s’assit**. »* (He entered, looked around, then sat down.)
    * **Historical or literary tone** – *« Napoléon **conquit** l’Italie en 1796. »*

    **Pitfalls for English speakers**  

    1. **Confusing the passé simple with the passé composé** – In written narrative the passé simple replaces *« a + participe passé »*. In speech only the passé composé is used; the two are not interchangeable.

    2. **Mixing up the endings and the circumflex on irregular stems** – Learners often write *« je fut »* instead of **je fus**, or *« nous avâmes »* instead of **nous eûmes**. Remember the correct stems (**fu-**, **eu-**, **v-**) and the **-us / -ins** endings, and add the circumflex only on *nous* and *vous* forms.

    **Quick check**  

    Identify the passé simple in the following sentence: *« Le vent **souffla** fort, les arbres **se courbèrent**, et la nuit **tomba**. »* (All three verbs are in the passé simple.)
