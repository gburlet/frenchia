- type: reading
  id: reading
  title: Le premier voyage de Camille
  passage_fr: |-
    Camille, jeune botaniste passionnée, décida un matin d’automne de quitter la ville pour explorer la vallée des Lacs. Elle embarqua dans un vieux train à vapeur qui serpentait entre les collines verdoyantes, puis elle descendit à la petite gare de Mont-Rivière. Dès qu’elle posa le pied sur le quai, un guide local l’accueillit avec un large sourire et lui présenta le sentier qui menait aux sources cristallines.

    Ils marchèrent pendant deux heures, traversèrent un bois épais où les châtaignes tombaient en pluie dorée, et gravirent une colline escarpée. Au sommet, Camille aperçut une clairière où s’étalaient des fleurs sauvages aux couleurs éclatantes. Elle s’assit sur une pierre plate, sortit son carnet et nota chaque espèce avec soin.

    Soudain, un orage éclata. Le vent fouetta les arbres, la pluie tambourna sur les feuilles, et le sol devint glissant. Malgré le danger, Camille persévéra, car elle voulait recueillir un spécimen rare que les habitants décrivaient comme « le diamant vert » de la vallée. Elle atteignit la source, recueillit quelques gouttes dans un flacon et remonta rapidement le sentier, le cœur battant.

    Lorsque le soleil revint, le guide l’attendait au pied de la colline. Ils partagèrent un repas simple de pain, de fromage et de pommes, puis le train les ramena à la ville. Camille revint avec son carnet rempli, prête à publier ses découvertes et à rêver d’un nouveau périple.
  translation_en: |-
    Camille, a young botanist with a passion, decided one autumn morning to leave the city and explore the Valley of the Lakes. She boarded an old steam train that wound its way between the green hills, then she got off at the small Mont-Rivière station. As soon as she set foot on the platform, a local guide welcomed her with a broad smile and showed her the path that led to the crystal-clear springs.

    They walked for two hours, crossed a dense wood where chestnuts fell like golden rain, and climbed a steep hill. At the top, Camille saw a clearing where wild flowers of brilliant colours spread out. She sat on a flat stone, took out her notebook and recorded each species carefully.

    Suddenly, a storm broke out. The wind whipped the trees, rain drummed on the leaves, and the ground became slippery. Despite the danger, Camille persisted, because she wanted to collect a rare specimen that the locals described as “the green diamond” of the valley. She reached the spring, collected a few drops in a vial and hurried back up the trail, her heart pounding.

    When the sun returned, the guide was waiting for her at the foot of the hill. They shared a simple meal of bread, cheese and apples, then the train took them back to the city. Camille returned with her notebook full, ready to publish her findings and to dream of another journey.
