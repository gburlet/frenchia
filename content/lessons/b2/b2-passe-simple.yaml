- id: ex-09
  grammar_topics:
  - passe-simple
  type: multiple_choice
  question: Which sentence correctly uses the passé simple to describe a completed action in a narrative?
  options:
  - Elle avait fini son rapport avant de partir.
  - Elle finit son rapport avant de partir.
  - Elle finît son rapport avant de partir.
  - Elle a fini son rapport avant de partir.
  answer_index: 1
  explanation: The passé simple of *finir* is *finit* (third-person singular). Option B uses this literary
    tense correctly. Option A is plus-que-parfait, option C is the imperfect subjunctive (finît), and
    option D is the passé composé, none of which are appropriate for a narrative written in the passé
    simple style we are studying.
- id: ex-10
  grammar_topics:
  - passe-simple
  type: multiple_choice
  question: In the following excerpt, which sentence contains a verb that is not conjugated in the passé
    simple?
  options:
  - « Le roi déclara la guerre aux voisins. »
  - « Les artisans construisirent le pont en trois mois. »
  - « Le messager arriva au château et annonça la victoire. »
  - « Il prenait le livre sur la table. »
  answer_index: 3
  explanation: Option D uses *prenait*, which is the imparfait of *prendre*. The other three sentences
    are correctly formed in the passé simple (*déclara*, *construisirent*, *arriva*, *annonça*). In literary
    narration the passé simple is used for the main actions, while the imparfait marks background or ongoing
    actions, so *prenait* is the incorrect choice here for a sentence that should be in the passé simple
    tense only.
