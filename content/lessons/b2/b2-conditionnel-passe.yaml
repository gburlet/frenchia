sections:
- type: explanation
  id: explanation
  heading: '## The Past Conditional – Expressing Regrets and Unreal Past Situations'
  body: |-
    The **conditionnel passé** is the French equivalent of English *would have + past participle*. It lets you talk about actions that **did not happen** but were possible under different circumstances, or to express **regret** and **advice after the fact** (e.g., *j’aurais dû…*).  

    ### Formation
    1. **Auxiliary verb in the conditional present** (either **avoir** or **être**).
       - *avoir*: **aurais, aurais, aurait, aurions, auriez, auraient**
       - *être*: **serais, serais, serait, serions, seriez, seraient** (same forms, but the past participle agrees with the subject).
    2. **Past participle** of the main verb.

    **Structure:** `conditional auxiliary + past participle`

    **Examples**
    - **J’aurais aimé** venir, mais j’étais malade.
    - **Nous serions partis** plus tôt si le train n’avait pas été en retard.
    - **Elle aurait compris** la leçon si elle avait étudié davantage.

    ### When to use it
    - **Regret / missed opportunity**: *J’aurais dû appeler Marie hier.* (I should have called Marie yesterday.)
    - **Unreal past condition** introduced by *si* + pluperfect: *Si j’avais su, **j’aurais** agi différemment.*
    - **Polite speculation about the past**: *Vous **auriez pu** me dire la vérité.*

    ### Common pitfalls for English speakers
    1. **Choosing the wrong auxiliary** – remember that **être** is used with all reflexive verbs and a limited set of movement verbs (aller, venir, arriver, etc.). The past participle must agree in gender and number when *être* is the auxiliary (e.g., *elle serait arrivée*).
    2. **Confusing conditional present with conditional past** – the conditional present (*j’aimerais*) talks about a present/future possibility, while the past conditional (*j’aurais aimé*) refers to a **completed** but unreal action. Adding the auxiliary in the conditional form is the key difference.

    Mastering the **conditionnel passé** lets you sound nuanced when reflecting on what might have been, a crucial skill at the B2 level.
