- type: reading
  id: reading
  title: La fin de semaine où tout aurait pu être différent
  passage_fr: |-
    Le vendredi soir, Claire recevait un appel inattendu : son oncle, qui vivait à l’étranger, allait arriver à Montréal le samedi matin pour une courte visite. Elle était déjà engagée à préparer le souper de famille et à aider son frère à **emménager dans** son nouveau studio. **Elle aurait pu refuser** l’invitation, mais elle ne voulait pas décevoir son oncle.

    Le samedi, le temps était maussade et la circulation était un vrai cauchemar. En arrivant à l’appartement du frère, Claire constata que le meuble du salon était endommagé. **Elle aurait dû vérifier** l’état du mobilier avant le déménagement, mais elle était pressée. Le frère, épuisé, décida de reporter le transport des cartons à dimanche.

    Pendant ce temps, l’oncle de Claire, qui était très fatigué après le vol, **aurait aimé** se reposer un peu avant le **déjeuner**. Claire, qui avait prévu un menu sophistiqué, **aurait pu** préparer quelque chose de plus simple, mais elle tenait à impressionner les invités.

    Lorsque le souper fut enfin servi, la sauce était trop salée et le dessert était brûlé. **Claire se dit** que le repas aurait été meilleur si elle avait suivi la recette à la lettre, mais le stress l’avait empêchée de se concentrer.

    Après le repas, l’oncle déclara qu’il **aurait préféré** rester à l’hôtel et ne pas venir chez eux. Claire se sentit coupable : **elle aurait dû** organiser la soirée différemment, **elle aurait pu** demander de l’aide à d’autres membres de la famille, et **elle aurait aimé** profiter davantage du temps avec son oncle. **La fin de semaine se termina** avec le sentiment que, si les choses avaient été planifiées autrement, tout aurait pu se passer beaucoup plus sereinement.
  translation_en: |-
    Friday evening, Claire received an unexpected call: her uncle, who lived abroad, was arriving in Montreal on Saturday morning for a short visit. She was already committed to preparing the family supper and helping her brother move into his new studio. **She could have refused** the invitation, but she didn’t want to disappoint her uncle.

    On Saturday, the weather was gloomy and traffic was a real nightmare. When she arrived at her brother’s apartment, Claire noticed that the living-room furniture was damaged. **She should have checked** the condition of the furniture before the move, but she was in a hurry. Her brother, exhausted, decided to postpone the boxes to Sunday.

    Meanwhile, Claire’s uncle, who was very tired after the flight, **would have liked** to rest a bit before **breakfast**. Claire, who had planned an elaborate menu, **could have prepared** something simpler, but she wanted to impress the guests.

    When the supper was finally served, the sauce was too salty and the dessert was burnt. **Claire thought** that the meal would have been better if she had followed the recipe to the letter, but stress prevented her from concentrating.

    After the meal, the uncle declared that he **would have preferred** to stay at the hotel and not come to their house. Claire felt guilty: **she should have** organized the evening differently, **she could have** asked other family members for help, and **she would have liked** to enjoy more time with her uncle. **The weekend ended** with the feeling that, if things had been planned another way, everything **could have gone** much more smoothly.
