  type: multiple_choice
  question: Choose the sentence that correctly forms the conditionnel passé with the verb *partir* (which
    uses *être* as its auxiliary).
  options:
  - Nous aurions parti tôt si nous avions su le trafic.
  - Nous serions partis tôt si nous avions su le trafic.
  - Nous serions partir tôt si nous avions su le trafic.
  - Nous serons partis tôt si nous avions su le trafic.
  answer_index: 1
  explanation: With *partir*, the auxiliary verb is **être**. The **conditionnel passé** is built with
    the conditional present of *être* (**serais, serais, serait, serions, seriez, seraient**) followed
    by the past participle *parti*, which must agree in gender and number with the subject (*nous* → *partis*).
    Therefore option B is the only correct sentence. - Option A uses the wrong auxiliary (*avoir*). -
    Option C contains the impossible construction *serions partir* (the infinitive should not appear after
    the conditional of *être*). - Option D uses the future *serons* instead of the conditional.
