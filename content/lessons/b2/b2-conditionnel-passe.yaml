- id: ex-09
  grammar_topics:
  - conditionnel-passe
  type: multiple_choice
  question: Which sentence correctly uses the conditionnel passé to express a regret about a missed opportunity?
  options:
  - J’aurais aimé aller au théâtre, mais les billets étaient déjà vendus.
  - J’aurais aimé allé au théâtre, mais les billets étaient déjà vendus.
  - J’aurais aimée aller au théâtre, mais les billets était déjà vendus.
  - J’aurais aimé aller au théâtre, mais les billets était déjà vendu.
  answer_index: 0
  explanation: The correct construction is **j’aurais aimé** + infinitive. The auxiliary *avoir* is conjugated
    in the conditional present (aurais) and the past participle *aimé* remains invariable because it follows
    *avoir* and is not used as an adjective. The verb that follows *aimer* must stay in the infinitive
    (aller). In the subordinate clause, the verb *être* is in the imperfect (étaient) and the past participle
    *vendus* agrees with the plural noun *billets*.  Option 1 respects all these rules. The other options
    contain errors such as using the past participle *allé* instead of the infinitive *aller*, adding
    an unnecessary agreement *aimée*, or mismatching the verb *être* and the past participle *vendu* with
    the subject *billets*.
- id: ex-10
  grammar_topics:
