- type: reading
  id: reading
  title: Le projet de rénovation de la maison de famille
  passage_fr: "Lorsque mes parents ont décidé de rénover leur vieille maison de campagne, ils ont rapidement\
    \ compris qu’ils ne pouvaient pas tout faire eux-mêmes. Ainsi, ils ont **fait installer** de nouvelles\
    \ fenêtres en PVC par une entreprise locale, afin d’améliorer l’isolation thermique. **La fin de semaine\
    \ dernière**, ils ont **fait peindre** le salon et la salle à manger par des peintres professionnels\
    \ qui travaillent à la journée.\n\nPour la cuisine, ils ont **fait remplacer** les anciens appareils\
    \ électroménagers. Ils ont **fait réparer** le réfrigérateur la semaine précédente par le technicien\
    \ du magasin d’électroménagers, mais il était encore défectueux, alors ils ont **fait installer**\
    \ un modèle plus moderne. Le comptable de la famille a **fait vérifier** le budget de la rénovation\
    \ par un expert en finances, afin de s’assurer que les dépenses restent raisonnables.\n\nLe jardin\
    \ n’a pas été oublié : ils ont **fait tailler** les haies et **fait planter** de nouvelles fleurs\
    \ par un jardinier qui connaît bien les plantes vivaces. Le soir, pendant que les travaux battaient\
    \ leur plein, ils ont **fait préparer le repas** par le traiteur du quartier, parce qu’ils n’avaient\
    \ pas le temps de cuisiner. \n\nEn fin de compte, la rénovation avance à grands pas, et ils prévoient\
    \ d’**organiser** une petite réception dès que tout sera terminé, pour remercier toutes les personnes\
    \ qui les ont aidés."
  translation_en: |-
    When my parents decided to renovate their old country house, they quickly realized that they couldn’t do everything themselves. So, they **had new PVC windows installed** by a local company, in order to improve thermal insulation. **Last weekend**, they **had the living-room and dining-room painted** by professional painters who work by the day.

    For the kitchen, they **had the old appliances replaced**. They **had the refrigerator repaired** the previous week by the technician from the appliance store, but it was still faulty, so they **had a more modern model installed**. The family accountant **had the renovation budget checked** by a finance expert, to make sure the expenses stay reasonable.

    The garden was not forgotten: they **had the hedges trimmed** and **had new flowers planted** by a gardener who knows perennial plants well. In the evening, while the work was in full swing, they **had the meal prepared** by the neighbourhood caterer, because they didn’t have time to cook.

    In the end, the renovation is moving ahead quickly, and they plan to **organize** a small reception as soon as everything is finished, to thank all the people who helped them.
