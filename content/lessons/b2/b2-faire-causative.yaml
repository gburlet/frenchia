  type: multiple_choice
  question: Choose the sentence that correctly expresses that the company will have the documents translated
    into English next week.
  options:
  - L’entreprise fera traduire les documents en anglais la semaine prochaine.
  - L’entreprise fera traduisant les documents en anglais la semaine prochaine.
  - L’entreprise faisait traduire les documents en anglais la semaine prochaine.
  - L’entreprise a fait traduire les documents en anglais la semaine prochaine.
  answer_index: 0
  explanation: 'To talk about a future causative action, we conjugate *faire* in the future simple (fera)
    and keep the following verb in the infinitive (traduire). Therefore option A is the only correct sentence:
    *L’entreprise fera traduire les documents en anglais la semaine prochaine.* Option B is incorrect
    because the verb after *fera* must remain an infinitive; *traduisant* is a present participle, not
    an infinitive. Option C is incorrect because *faisait* is the imperfect tense, which refers to a past
    or habitual situation, not a future plan. Option D uses the passé composé (*a fait*), which refers
    to a completed action in the past, not a future intention. The correct future causative structure
    is *fera + infinitif*.'
