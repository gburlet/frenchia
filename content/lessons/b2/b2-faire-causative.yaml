sections:
- type: explanation
  id: explanation
  heading: '# The Causative Construction with *faire* (Le causatif avec *faire*)'
  body: 'In French, the *causatif* lets you say that **someone causes another person or thing to perform
    an action**. The basic pattern is **faire + infinitif**. The subject of *faire* is the person who
    arranges the action; the infinitive verb tells what is done, and the participant that actually carries
    out the action is expressed as a **direct object** when the infinitive is intransitive, or as an **agent
    complement** introduced by *par* (or *à*) when the infinitive is transitive.  **Structure** ```Subject
    + faire + direct-object (agent) + infinitif``` - **Intransitive infinitive** (no direct object of
    its own): the person who does the action is the direct object of *faire*. Example: *Je fais rire les
    enfants.* – I make the children laugh. - **Transitive infinitive** (has its own direct object): the
    thing acted upon is the direct object of *faire*; the doer (the agent) is introduced by *par* (or
    *à*). Example: *Je fais réparer ma voiture par un mécanicien.* – I have my car repaired by a mechanic. **Pronoun
    placement** When the infinitive is transitive, the object of the infinitive (the thing being acted
    upon) is represented by a pronoun placed **before *faire***: *Je la fais réparer par le mécanicien.* When
    the infinitive is intransitive, a pronoun representing the agent also goes before *faire*: *Je les
    fais rire.* **Examples** - *Je fais réparer ma voiture.* – I have my car repaired. - *Nous faisons
    nettoyer les fenêtres chaque printemps.* – We have the windows cleaned each spring. - *Elle fait préparer
    le repas par son frère.* – She has her brother prepare the meal. **Key points** 1. **Agreement** –
    *Faire* is conjugated normally; the infinitive never changes. 2. **Pronoun placement** – See the rules
    above. 3. **Passive vs. causative** – *Faire* expresses causation, not a true passive voice. Compare:
    *La voiture est réparée* (it is repaired) vs. *Je fais réparer la voiture* (I cause it to be repaired). **Common
    pitfalls for English speakers** - **Using the wrong construction**: learners often try to use a past
    participle or *avoir* instead of the causative, e.g., *Je fais ma voiture réparée* or *J’ai réparé
    ma voiture* when they mean “I have my car repaired”. The correct form is *Je fais réparer ma voiture*. -
    **Placing the agent incorrectly**: with a transitive infinitive the agent must be introduced by *par*
    (or *à*), not placed directly after *faire*. The sentence *Je fais mon ami nettoyer la maison* is
    ungrammatical because the agent cannot precede the infinitive and its object. Correct: *Je fais nettoyer
    la maison par mon ami* or, with a pronoun, *Je la fais nettoyer par mon ami*.'
