  type: multiple_choice
  question: Which sentence correctly uses the causative construction with *faire* to say that you asked
    a friend to clean your apartment?
  options:
  - Je fais nettoyer mon appartement de mon ami.
  - Je fais mon ami nettoyer mon appartement.
  - Je fais nettoyer mon appartement par mon ami.
  - Je fais nettoyer mon appartement mon ami.
  answer_index: 2
  explanation: 'The causative pattern is **subject + faire + infinitive + direct object + agent**. When
    the infinitive is **transitive** (it already takes a direct object), the agent is introduced by **par**
    (or, less commonly, by *à*, which can be ambiguous). In the sentence we need, *nettoyer* is transitive,
    so the thing being cleaned (*mon appartement*) is the direct object and the person who does the cleaning
    (*mon ami*) is the agent. Therefore the correct sentence is: *Je fais nettoyer mon appartement **par**
    mon ami.* – Option A uses the wrong preposition *de*. – Option B places the agent before the infinitive,
    which is ungrammatical. – Option D omits any preposition before the agent, also making it ungrammatical.'
- id: ex-10
  grammar_topics:
