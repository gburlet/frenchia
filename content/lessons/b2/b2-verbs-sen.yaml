sections:
- type: explanation
  id: explanation
  heading: Les verbes avec *s’en* – B2
  body: |-
    In French, a handful of verbs are followed by the pronoun **s’en**. The *en* does **not** replace a direct object; it refers to a previously mentioned **thing, situation or idea** introduced by *de* (or implicitly understood). The construction is **reflexive + en** and the verb is conjugated normally. In many cases the *de* complement is omitted because *en* already stands for it. In compound tenses the pronoun cluster (*me, te, se, nous, vous, s’*) and *en* are placed **before the auxiliary**. All four verbs use **être** as auxiliary. The past participle **agrees with the subject for *s’en aller* and *s’en sortir***; it remains **invariable for *s’en vouloir* and *s’en faire*** because the reflexive pronoun *se* functions as an indirect object, not because the verb takes *avoir* (the *en* does not affect agreement).

    Note the obligatory elision: *je* + *en* → **j’en** (e.g. *j’en ai parlé*).

    Below is a quick reference table.

    ### Quick reference table

    | Verb | Meaning | Typical complement | Auxiliary | Past-participle agreement | Notes |
    | ------ | ---------- | ------------------- | ----------- | --------------------------- | ------- |
    | **s’en aller** | to leave, to go away | usually no explicit complement ( *en* already means “from here”); you can say *s’en aller d’ici* if you need to specify | *être* | agrees with the subject (ex. *ils s’en sont allés*) | – |
    | **s’en sortir** | to get out of it, to manage | *de* + difficulty, problem | *être* | agrees with the subject (ex. *elle s’en est sortie*) | – |
    | **s’en vouloir** | to blame oneself, to feel guilty | *de* + action, mistake | *être* | invariable (ex. *elle s’en est voulu*) | – |
    | **s’en faire** | to worry, to make a fuss | *pour* + thing that worries you (e.g. *s’en faire pour l’examen*) | *être* | invariable (ex. *elle s’en est fait*) | – |

    ### Forming the construction 1. Choose the verb and conjugate it in the required tense/person. 2. Add the reflexive pronoun **se** (which becomes *s’* before a vowel). 3. **In simple tenses** attach **en** directly after the reflexive pronoun: **s’en** (e.g. *je m’en vais*). 4. **In compound tenses** place the pronoun cluster (*me, te, se, nous, vous, s’*) **and *en*** before the auxiliary: *je **m’en suis** allé*, *nous **nous en sommes** sortis*, *elle **s’en est** voulu*. 5. Complete the clause with the complement introduced by *de* (or *pour* for *s’en faire*).

    ### Examples

    - **Je m’en suis allé** tôt de la fête parce que j’étais fatigué. – I left the party early because I was tired.

    - **Nous nous en sommes sortis** malgré la tempête de neige grâce aux pneus d’hiver. – We got through the snowstorm thanks to winter tires.

    - **Elle s’en est voulu** pendant des heures. – She blamed herself for hours.

    - **Ne t’en fais pas**, tout ira bien. – Don’t worry, everything will be fine.

    - **Fais-toi-en pas**, tout va bien aller. – *Don’t worry, everything will be fine* (Québec colloquial).

    ### Common pitfalls

    - **Confusing *en* with *y***: *en* replaces a *de* complement, while *y* replaces an *à* complement. Saying *« Je m’y vais »* is wrong; it must be *« Je m’en vais »*.

    - **Omitting the reflexive pronoun**: *« Je en sors »* is ungrammatical. The reflexive pronoun is mandatory; it must be *« Je m’en sors »*.

    - **Wrong order in compound tenses**: *« je me suis en allé »* is incorrect; the correct order is *« je m’en suis allé »*.

    - **Agreement of the past participle**: with *s’en aller* and *s’en sortir* the past participle agrees with the subject (*ils s’en sont allés*, *elle s’en est sortie*). With *s’en vouloir* and *s’en faire* the participle stays invariable (*elle s’en est voulu*, *il s’en fait*).

    ### Québec note

    In informal Québec speech you may hear the familiar expression **« Fais-toi-en pas »** (≈ *Ne t’en fais pas*). It uses the same *s’en* structure, but the verb is *faire* in an imperative form.

    Mastering these four verbs gives you a handy way to talk about departure, coping, self-blame and worry—common topics in everyday conversation at the B2 level.
