- type: regional_note
  id: regional-note
  heading: 'Québec vs. France : use of *s’en* with certain verbs'
  body: "In everyday speech, Québécois speakers often keep the same reflexive + *en* construction as in\
    \ France (e.g., *s’en aller*, *s’en sortir*). The main noticeable difference lies in the idiomatic\
    \ reassurance *fais-toi-en pas*, which is common in Québec. In France people usually say *ne t’en\
    \ fais pas* or *ne t’inquiète pas*. The other verbs (*s’en vouloir*, *s’en sortir*) are used identically\
    \ in both varieties.  \n\n**Québec / France / English variants**\n1. *Fais-toi-en pas* – *Ne t’en\
    \ fais pas* – “Don’t worry.”\n2. *S’en aller* – *S’en aller* – “to leave, to go away.”\n3. *S’en sortir*\
    \ – *S’en sortir* – “to get out of it, to manage.”\n4. *S’en vouloir* – *S’en vouloir* – “to blame\
    \ oneself.”\n5. *Ne t’inquiète pas* – *Ne t’inquiète pas* – “Don’t worry.”\n6. *Ne t’en fais pas*\
    \ – *Ne t’en fais pas* – “Don’t worry.”\n\nAside from the colloquial *fais-toi-en pas*, the grammar\
    \ and meaning of these *s’en* verbs are the same in Québec and France."
