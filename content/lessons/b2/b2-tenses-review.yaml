- id: ex-05
  grammar_topics:
  - tenses-review
  type: multiple_choice
  question: In the following sentence, which verb form correctly completes the blank? « Quand _____ (arriver)
    à la gare, le train était déjà parti. »
  options:
  - je suis arrivé
  - j'arrivais
  - j'étais arrivé
  - j'arrive
  answer_index: 0
  explanation: 'The arrival is a punctual, completed action that happened after the train had already
    left. Therefore we use the passé composé « je suis arrivé » to indicate a single, finished event in
    the past. The imperfect « j''arrivais » would suggest an ongoing or background action, which does
    not fit the context. « J''étais arrivé » (plus-que-parfait) would place the arrival before the train’s
    departure, which is the opposite of what we want. « J''arrive » (present) would be a tense-shift error.
    The correct sentence is: « Quand je suis arrivé à la gare, le train était déjà parti. ». Note that
    after the subject pronoun « je », the auxiliary « suis » is written in full; there is no elision such
    as « j''suis ».'
- id: ex-06
  grammar_topics:
  - tenses-review
  type: multiple_choice
  question: Choose the correct form of the auxiliary and past participle for the passive voice in the
    sentence: « Les documents _____ (être + rédiger) par le comité avant la réunion. »
  options:
  - ont été rédigés
  - ont été rédigé
  - ont été rédiger
  - ont été rédige
  answer_index: 0
  explanation: In the passive voice, the past participle agrees with the subject of the sentence. Here
    the subject *les documents* is masculine plural, so the past participle must be *rédigés* (with –s).
    The auxiliary *être* is used in the appropriate compound tense (passé composé) and does not change;
    only the past participle shows the agreement. The other options either miss the agreement or use the
    infinitive instead of the past participle.
- id: ex-07
  grammar_topics:
  - tenses-review
  type: multiple_choice
  question: Which version correctly expresses a hypothetical condition in the past? « Si elle _____ (ne
    pas oublier) son passeport, elle aurait pu voyager hier. »
  options:
  - n’avait pas oublié
  - n’a pas oublié
  - n’aurait pas oublié
  - n’oubliait
  answer_index: 0
  explanation: In a past unreal (counter-factual) condition, the *si*-clause must be in the plus-que-parfait
    (*n’avait pas oublié*) and the main clause in the conditional perfect (*aurait pu*). The passé composé
    (*n’a pas oublié*) would state a real past fact, the conditional perfect (*n’aurait pas oublié*) is
    ungrammatical in a *si*-clause because the conditional is never used after *si*, and the imperfect
    (*n’oubliait*) does not convey the required counter-factual meaning. Therefore, only *n’avait pas
    oublié* fits the required structure.
