- type: examples
  id: examples
  heading: ✅ Révision de tous les temps (B2) – Continuité et choix du temps
  examples:
  - fr: Lorsque j’ai reçu l’appel, je préparais le repas, mais je n’avais pas encore mis la table.
    en: When I got the call, I was preparing the meal, but I hadn’t put the table setting out yet.
    note: Imparfait for an ongoing past action; plus-que-parfait for a completed action that occurred
      before the ongoing one.
    region: common
  - fr: Après que le train eut quitté la gare, les passagers découvrirent que leurs bagages étaient restés
      sur le quai.
    en: After the train had left the station, the passengers discovered that their luggage had been left
      on the platform.
    note: Passé antérieur (literary) is used for an action completed before another past action expressed
      with the passé simple.
    region: common
  - fr: Si tu avais étudié davantage, tu aurais réussi l’examen de français.
    en: If you had studied more, you would have passed the French exam.
    note: Plus-que-parfait in the si-clause; conditionnel passé in the main clause.
    region: common
  - fr: Je suis allé à la bibliothèque hier, mais je n’ai pas trouvé le livre que je cherchais.
    en: I went to the library yesterday, but I didn’t find the book I was looking for.
    note: Passé composé for a completed event; négation with passé composé.
    region: common
  - fr: Chaque fois qu’il pleuvait, elle prenait son parapluie et continuait son chemin sans se plaindre.
    en: Every time it rained, she took her umbrella and kept walking without complaining.
    note: Imparfait for repeated past circumstances; le passé simple would be too literary here.
    region: common
  - fr: Nous avions prévu de partir en randonnée, mais la météo a changé brusquement.
    en: We had planned to go hiking, but the weather changed abruptly.
    note: Plus-que-parfait for a prior plan; passé composé for the sudden change.
    region: common
  - fr: Il faut que vous ayez fini le rapport avant la réunion de demain.
    en: You need to have finished the report before tomorrow’s meeting.
    note: Subjonctif passé after a necessity expression (il faut que).
    region: common
  - fr: Lorsque le conférencier commencera à parler, le public se tiendra silencieux.
    en: When the speaker starts speaking, the audience will remain silent.
    note: Futur simple in both the subordinate clause of time and the main clause.
    region: common
  - fr: Je me souviens du jour où nous avons découvert la petite galerie d’art au coin de la rue.
    en: I remember the day when we discovered the little art gallery on the corner of the street.
    note: Présent for a current memory; passé composé for the completed discovery.
    region: common
  - fr: Si jamais ils avaient su que la manifestation serait annulée, ils n’auraient pas acheté les billets.
    en: If they had known that the protest would be cancelled, they wouldn’t have bought the tickets.
    region: common
- type: reading
  id: reading
  title: Une soirée imprévue au musée
  passage_fr: |-
    Le jeudi 12 septembre, je **devais** assister à une conférence sur l’histoire de la photographie au Musée municipal. Dès le matin, j’**ai vérifié** le programme en ligne et j’**ai noté** que la salle était réservée à 19 h 30. Vers 18 h, alors que je **préparais** mon sac à dos, mon ami Marc **m’a appelé** pour me dire qu’il **avait gagné** deux places de dernière minute pour le même événement. **Nous avions convenu** de nous retrouver à la terrasse du café du parc, mais le temps **s’est rapidement assombri**.

    Lorsque nous **sommes arrivés** au musée, le personnel **nous a indiqué** que la conférence **avait été avancée** à 18 h 45 à cause d’un problème technique. J’**étais déjà** sur le point de partir quand le conservateur **a annoncé** que, après la présentation, il **y aurait** une visite guidée de la **nouvelle aile** dédiée aux images numériques. **Je n’avais jamais vu** une telle collection, alors j’**ai accepté** immédiatement.

    Pendant la conférence, le conférencier **expliquait** comment les premiers daguerréotypes **avaient révolutionné** la façon dont les gens **immortalisaient** leurs souvenirs. Il **avait montré** plusieurs clichés rares, dont un portrait d’une femme en robe de soie qui **avait été pris** en 1865. Après la séance, le guide **nous a conduits** dans la salle d’exposition où les œuvres **étaient éclairées** par des projecteurs LED. Nous **avions l’impression** que chaque image **racontait** une histoire différente, et nous **nous sommes promis** de revenir dès que le musée **organiserait** une autre soirée thématique.

    En rentrant chez moi, je **me suis rappelé** que j’**avais promis** à ma sœur de l’aider à préparer son portfolio. Malgré la fatigue, je **suis convaincu** que cette soirée **m’aura donné** une nouvelle perspective sur le pouvoir de la photographie.
  translation_en: |-
    On Thursday, September 12, I was supposed to attend a lecture on the history of photography at the Municipal Museum. Early in the morning I checked the programme online and noted that the room was booked for 7:30 p.m. Around 6 p.m., while I was packing my backpack, my friend Marc called to tell me that he had won two last-minute tickets for the same event. We had agreed to meet on the café terrace in the park, but the weather quickly darkened.

    When we arrived at the museum, the staff told us that the lecture had been moved forward to 6:45 p.m. because of a technical problem. I was already about to leave when the curator announced that, after the presentation, there would be a guided tour of the new wing dedicated to digital images. I had never seen such a collection, so I accepted immediately.

    During the lecture, the speaker explained how the first daguerreotypes had revolutionised the way people captured their memories. He had shown several rare photographs, including a portrait of a woman in a silk dress that had been taken in 1865. After the session, the guide led us into the exhibition room where the works were illuminated by LED spotlights. We felt that each image told a different story, and we promised ourselves to return as soon as the museum organised another themed evening.

    On the way home I remembered that I had promised my sister to help her prepare her portfolio. Despite the fatigue, I am convinced that this evening will have given me a new perspective on the power of photography.
