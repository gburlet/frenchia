sections:
- type: explanation
  id: explanation
  heading: ✅ Révision de tous les temps (B2)
  body: |-
    ***In this B2 review you must be able to decide, *in a continuous discourse*, which tense (and mood) best reflects the time relationship and the speaker’s attitude. The main French tenses you will encounter are:**  ***  | Time reference | Simple | Compound | Mood |

    | ---------------- | -------- | ---------- | ------ |

    | **Past**

    | **imparfait**, **passé simple** (lit.) | **passé composé**, **plus-que-parfait**, **passé antérieur** | **indicatif**, **subjonctif passé** |

    | **Present**

    | **présent** | — | **indicatif**, **subjonctif présent** |

    | **Future**

    | **futur simple** | **futur antérieur** | **indicatif** |

    | **Conditional**| **conditionnel présent** | **conditionnel passé** | — |

    ### How to form the compounds 1. **Auxiliary + past participle**. Use **avoir** for most verbs, **être** for reflexive verbs and a limited set of *intransitive* verbs (e.g., *aller, venir, naître*).

    - **J’ai fini** le rapport.

    - **Je suis parti** hier soir. 2. **Passé antérieur** = *auxiliaire au passé simple* + *participe passé* (literary).

    - **Après qu’il eut terminé**, il partit. 3. **Futur antérieur** = *auxiliaire au futur simple* + *participe passé*.

    - **Quand tu seras arrivé**, nous dînerons. 4. **Conditionnel passé** = *auxiliaire au conditionnel présent* + *participe passé*.

    - **J’aurais accepté** si tu m’avais invité.

    ### Common pitfalls for English speakers

    - **Mixing up passé composé and imparfait**. English often uses a simple past for both actions and background. In French, **imparfait** sets the scene or describes a repeated/habitual past, while **passé composé** reports a completed event.

    - *When I was a child* → **Quand j’étais enfant**, not *j’ai été*.

    - **Forgetting agreement with *être***. The past participle must agree in gender and number when the auxiliary is *être* (or when *avoir* has a direct object before the verb).

    - **Elle s’est levée** (feminine singular).

    - **Les lettres que j’ai écrites** (agreement with *lettres*).

    Mastering these patterns lets you weave together narratives, arguments, and hypotheses without hesitation. Practice by reading a short paragraph and rewriting each verb in a different tense while preserving meaning. Happy revising!***
