sections:
- type: explanation
  id: explanation
  heading: '## Les marqueurs du discours (Discourse Markers) – B2'
  body: "In a B2 essay or oral presentation you must **signal the logical flow** of your ideas. French\
    \ uses a set of *marqueurs du discours* that work like “firstly”, “next”, “moreover”, “however”, “in\
    \ short”. The most common sequence is:  \n\n1. **Tout d'abord** – introduces the first point.  \n\
    \   *Tout d'abord, il faut reconnaître que le télétravail change la dynamique des équipes.*\n2. **Ensuite**\
    \ – adds a second point or continues the same thread.  \n   *Ensuite, les entreprises investissent\
    \ dans des outils de collaboration en ligne.*\n3. **De plus** – brings in an additional argument,\
    \ often stronger.  \n   *De plus, les salariés rapportent une meilleure conciliation travail-vie.*\n\
    4. **Cependant** – signals a contrast or limitation.  \n   *Cependant, tous les postes ne se prêtent\
    \ pas au travail à distance.*\n5. **Bref** – wraps up, summarising or concluding.  \n   *Bref, le\
    \ télétravail présente plus d’avantages que d’inconvénients.*\n\n### Common pitfalls for English speakers\n\
    1. **Placing the marker after the subject** – markers usually open the sentence or clause and are\
    \ followed by a comma. *Nous, ensuite, avons…* sounds unnatural; prefer *Ensuite, nous avons…*.\n\
    2. **Forgetting the comma after the marker** – the pause is essential for readability. Incorrect:\
    \ *Cependant nous devons…* (missing comma) vs. *Cependant, nous devons…* (correct).\n3. **Using a\
    \ marker that does not match the logical relation** – e.g., using *de plus* when you want to express\
    \ contrast; the proper connector would be *cependant* or *toutefois*.\n4. **Over-using the same marker**\
    \ – repeating *de plus* or *ensuite* several times makes the text sound mechanical. Vary the connectors\
    \ according to the argument you are making.\n5. **Putting a contrastive marker at the end of a sentence**\
    \ – while it is possible, it is uncommon and can sound awkward. Prefer the more natural front-position:\
    \ *Cependant, nous devons réduire les coûts.* rather than *Nous devons réduire les coûts, cependant.*"
