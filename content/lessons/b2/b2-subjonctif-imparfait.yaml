    pos: verb
    region: common
    formality: standard
    example_fr: L’eau a endommagé les vieux papiers.
    example_en: The water damaged the old papers.
  - fr: détériorer
    en: to deteriorate, to worsen
    pos: verb
    region: common
    formality: standard
    example_fr: Le temps a détérioré la peinture.
    example_en: Time has deteriorated the painting.
