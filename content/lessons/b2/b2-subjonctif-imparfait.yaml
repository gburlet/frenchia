sections:
- type: explanation
  id: explanation
  heading: Le subjonctif imparfait (B2)
  body: |-
    ***

    ### What it is

    The **imperfect subjunctive** (subjonctif imparfait) is a literary tense that appears mainly in formal writing, historical novels, theatre, and some high-level journalism. It conveys the same nuances as the present subjunctive—doubt, wish, emotion, necessity, or a hypothetical situation—but it is anchored in the past, usually after a past-tense main clause.

    ### How to form it

    1. **Take the *tu* form of the passé simple** of the verb (e.g. *tu aimas*, *tu finis*, *tu pris*, *tu eus*).

    2. **Drop the final –s** of that form.

    3. **Add the imperfect-subjunctive endings**:

    - **-sse** (1st sg.) – *aimasse*
    - **-sses** (2nd sg.) – *aimasses*
    - **-t** (3rd sg.; circumflex on the vowel) – *aimât, finît, prît, eût*
    - **-ssions** (1st pl.) – *aimassions*
    - **-ssiez** (2nd pl.) – *aimassiez*
    - **-ssent** (3rd pl.) – *aimassent*

    ### Table of regular forms

    | Infinitif | Passé simple (tu) | Subj. imparfait (je) | Subj. imparfait (ils) |
    | ----------- | ------------------- | ---------------------- | ----------------------- |
    | **aimer** | tu aimas | **aimasse** | **aimassent** |
    | **finir** | tu finis | **finisse** | **finissent** |
    | **prendre** | tu pris | **prisse** | **prissent** |

    ### When to use it

    - After a **past-tense verb that already triggers the subjunctive** (e.g. *il doutait que*, *je regrettais que*).
    - In **relative clauses** that refer to a past event whose reality is uncertain: *Il cherchait un homme qui **vît** la vérité.*
    - In **conditional sentences** where the protasis is in the **pluperfect subjunctive** used literarily in place of the plus-que-parfait indicative: *Si j'**eusse** su, je ne serais pas venu.*

    ### The plus-que-parfait du subjonctif (pluperfect subjunctive)

    The pluperfect subjunctive is formed with the **imperfect subjunctive of *avoir* or *être*** + the **past participle** of the main verb.

    **Structure**: *eusse, eusses, eût, eussions, eussiez, eussent* (or *fusse, fusses, fût, fussions, fussiez, fussent*) + *participe passé* (e.g. *eût parlé*, *eût fini*, *eût été*).

    It is used in literary French when the subordinate clause refers to an action that **had already been completed** at the time of the main clause, and the main clause itself is in a past-tense subjunctive or conditional context. Example: *Je craignais que vous **eussiez fini** avant midi* (I feared that you had finished before noon).

    ### Typical English-speaker pitfalls

    1. **Confusing the forms** – the imperfect subjunctive uses *-sse, -sses, -t, -ssions, -ssiez, -ssent*, not the imperfect indicative endings *-ais, -ait…*. Many learners mistakenly write *aime → aimais* instead of the correct *aimasse*.
    2. **Using the tense after a present-tense main verb** – the present subjunctive is required after a present verb (e.g. *Je veux que tu **sois** ici*, not *fusses*). The imperfect subjunctive is only appropriate after a past-tense trigger.

    ### Quick check

    - *Je souhaitais que tu **vinsses** à la réunion.* (imperfect subjunctive) – I wished that you would come to the meeting.
    - *Il était étonné que le projet **eût** déjà commencé.* (pluperfect subjunctive) – He was surprised that the project had already started.
    - *Je voulais que tu **fusses** ici le lendemain.* (imperfect subjunctive) – I wanted you to be here the next day.

    ***
