- type: reading
  id: reading
  title: Le journal d’un archiviste du XIXᵉ siècle
  passage_fr: |-
    Le 12 avril 1867, je consignai dans mon cahier les événements qui s’étaient déroulés au manoir de la famille de Montmirail. Le propriétaire, le comte Armand, avait demandé à son secrétaire que les archives soient triées avant l’arrivée du nouveau gouverneur. Il était crucial que les documents anciens **eussent été** classés par ordre chronologique, afin que le visiteur ne fût pas désorienté.

    Je me souviens que, lorsqu’on m’avait confié la tâche, je craignais que les registres n’**eussent été** endommagés par l’humidité du sous-sol. Le conservateur du musée voisin m’avertit que, si les papiers n’étaient pas protégés, ils **auraient pu** se détériorer irrémédiablement.

    Malgré ces inquiétudes, le comte insista pour que je poursuivisse les travaux, même si la tempête qui s’annonçait menaçait d’interrompre le travail. Il était surprenant que, la nuit précédente, le vent ne **soufflât** pas encore avec tant de violence.

    Lorsque le gouverneur arriva, il fut impressionné que nous **eussions terminé** la classification avant son **arrivée**. Il déclara que, grâce à nos efforts, la collection **avait été** préservée pour les générations futures. Je conclus alors que, même si le temps était difficile, la rigueur **avait toujours prévalu** dans notre mission.
  translation_en: |-
    On April 12, 1867, I recorded in my notebook the events that had taken place at the Montmirail family manor. The owner, Count Armand, had asked his secretary that the archives be sorted before the new governor arrived. It was crucial that the old documents **had been** classified in chronological order, so that the visitor would not be disoriented.

    I remember that, when the task was entrusted to me, I feared that the registers **might have been** damaged by the cellar’s humidity. The curator of the neighboring museum warned me that, if the papers were not protected, they **could have** deteriorated beyond repair.

    Despite these worries, the count insisted that I continue the work, even though the storm that was forecast threatened to interrupt it. It was surprising that, the night before, the wind **was not yet blowing** with such violence.

    When the governor arrived, he was impressed that we **had finished** the classification before his **arrival**. He declared that, thanks to our efforts, the collection **had been** preserved for future generations. I concluded then that, even if the times were difficult, rigor **had always prevailed** in our mission.
