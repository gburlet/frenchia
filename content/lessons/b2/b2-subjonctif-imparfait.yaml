  question: « Il était regrettable que le médecin n’___ pu intervenir. » Which verb form correctly completes
    the imperfect subjunctive?
  options:
  - eût
  - eut
  - aurait
  - avait
  answer_index: 0
  explanation: 'The main clause is in the past (« Il était regrettable »). The subordinate clause introduced
    by *que* therefore requires the imperfect subjunctive. The correct form is **eût**, the 3ᵈ person
    singular of the imperfect subjunctive of *avoir*. *eut* is the passé simple, *aurait* the conditional,
    and *avait* the imperfect indicative – none of which convey the subjunctive mood required here. The
    full sentence reads: « Il était regrettable que le médecin n’eût pu intervenir. ».'
- id: ex-10
  grammar_topics:
  - subjonctif-imparfait
  type: multiple_choice
  question: 'Choose the correct form to finish the sentence (subjunctive pluperfect): « Je craignais que
    la tempête n’_____ causé des dégâts irréparables. »'
  options:
  - eût
  - avait
  - aurait
  - eût été
  answer_index: 0
  explanation: 'The main clause is in the imperfect indicative (*je craignais*). When the subordinate
    clause expresses an action that occurred **before** that past moment, French uses the **plus-que-parfait
    du subjonctif**. This tense is formed with the **imperfect subjunctive of the auxiliary** (*avoir*
    or *être*) followed by the past participle of the main verb. For the verb *causer* (which takes *avoir*),
    the correct construction is *eût* + *causé* → **eût causé**. The other options are: *avait* (imperfect
    indicative), *aurait* (conditional), and *eût été* (plus-que-parfait du subjonctif of *être* + *été*,
    which does not fit the required structure). Hence the only correct answer is **eût** (eût causé).'
