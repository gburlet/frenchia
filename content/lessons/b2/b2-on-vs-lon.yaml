  explanation: 'The euphonic form **l’on** comes from the old construction *l''om* (article *l’* + *om*,
    from Latin *homo*). Today it is felt only as a liaison-like **l** that avoids a hiatus **before**
    *on* when the preceding word ends with a vowel sound, e.g. *et on → et l’on*, *si on → si l’on*, *où
    on → où l’on*. It is an optional, mostly written and formal variant; *on* is always grammatical, even
    after a vowel-ending word.  In the four sentences the hiatus is therefore avoided correctly.  The
    grammaticality then depends on agreement and tense consistency.  Option A is fully correct: the verb
