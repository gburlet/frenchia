    with the plural subject *les résultats* (agreement error).  Option D contains an agreement error:
    the singular past verb *était* does not agree with the plural subject *les résultats* (it should be
    *étaient*).  Therefore only option A is completely grammatical.  (Note: the choice of **l’on** depends
    on the preceding word, not on the following verb.)'
