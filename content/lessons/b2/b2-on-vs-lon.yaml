sections:
- type: explanation
  id: explanation
  heading: On vs. l’on (formal euphony)
  body: |-
    **On** is the neutral third-person singular pronoun meaning “one, people, we, you” in everyday French.***

    ***In formal or literary writing, when **on** follows a word that ends with a vowel sound, writers often insert an elided **l’** to avoid a hiatus such as *et on*, *si on*, *où on*, etc. This euphonic form is written **l’on** and pronounced **[lɔ̃]** (the *l* is pronounced).***

    Historically, the **l** is the old article *l’* (as in *l’om* → *l’homme*). In modern French it no longer functions as an article; it is felt only as a phonetic bridge.

    **l’on** is therefore a stylistic alternative, not a different pronoun.

    ***When to use l’on***

    - **After a word that ends with a vowel sound** (the preceding word ends in a vowel sound, not a consonant):

    *et l’on*, *si l’on*, *où l’on*, *que l’on*, *qui l’on* …

    Example: **_Il apparaît que l’on a constaté une hausse des prix._**

    - **In formal, academic, or literary texts** where the writer wants a smoother flow:

    *L’on observe que…*, *L’on peut supposer…*.

    ***When *on* stays unchanged***

    - **Before a consonant** (or any word that does not create a vowel hiatus):

    *on décide*, *on travaille*, *on prend*.

    Example: **_On décide de partir demain._**

    - **In spoken language**, even before a vowel many speakers keep *on*; the *l’* is optional and mainly a written convention.

    ***Common pitfalls for English speakers***

    1. **Adding *l’* everywhere** – *l’on* is optional; it is used only after a preceding word that ends with a vowel sound.

    2. **Confusing *l’on* with the article *l’* + noun** – In *l’on* the *l* is not an article; it does not belong to a noun and should not be treated as a separate word when parsing sentences.

    3. **Using *l’on* at the beginning of a sentence** – Because there is no preceding vowel sound, the normal form *on* is preferred. Sentence-initial *l’on* is possible but rare, very formal, and often feels literary; most writers simply use *on* (e.g., *On a découvert…* rather than *L’on a découvert…*).

    ***Remember***: the spelling **l’on** is a purely euphonic device used in formal written French to avoid a vowel hiatus after a preceding vowel-ending word, and it is pronounced **[lɔ̃]**.***
