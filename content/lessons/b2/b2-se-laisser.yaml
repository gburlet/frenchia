sections:
- type: explanation
  id: explanation
  heading: Le causatif avec **se laisser**
  body: |-
    ***### What **se laisser + infinitif** means***  Se laisser + infinitif expresses that the subject permits or voluntarily allows an action to happen to himself/her. It is the “let-oneself” counterpart of the more common **se faire + infinitif** (“to have something done”).  ---

    **Formation**  1. Reflexive pronoun (me, te, se, nous, vous).  2. Verb **laisser** in the required tense.  3. Infinitive of the action that the subject allows.  ---

    **Pattern**: *[subject] + se + laisser + infinitif*.  ---

    **Examples**  - *Je me laisse convaincre* par les arguments de mon collègue.  *I let myself be convinced by my colleague’s arguments.*  - *Nous nous laissons guider* par le guide touristique.  *We let ourselves be guided by the tour guide.*  - *Ils se laissent influencer* par les réseaux sociaux.  *They let themselves be influenced by social media.*  ---

    ### When to use it  - When the subject **permits** an action to happen to him/her.  - When the emphasis is on the **voluntary** nature of the allowance, not on who performs the action.  - It can also convey an intentional passivity: *se laisser surprendre* (to let oneself be surprised).  ---

    ### Common pitfalls for English speakers  1. **Confusing with “se faire”** – *se faire + infinitif* stresses that someone else does the action for you (e.g., *Je me fais couper les cheveux*). With *se laisser*, the focus is on the subject’s willingness.  2. **Omitting the reflexive pronoun** – *Je laisse convaincre* is ungrammatical.  3. **Adding a preposition** – The infinitive follows directly after *se laisser*; *Je me laisse à convaincre* is wrong.  ---

    ### Quick tip  If you can replace the sentence with *« je permets que … »* or *« je me donne la permission de … »*, you are likely dealing with **se laisser**.
