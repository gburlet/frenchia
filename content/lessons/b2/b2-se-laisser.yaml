- type: reading
  id: reading
  title: Le séminaire de créativité
  passage_fr: |-
    Le lundi matin, les membres de l’équipe marketing se sont réunis dans la petite salle de conférence du bâtiment A. Le directeur, M. Lévesque, avait invité un coach spécialisé en créativité afin que chacun puisse *se laisser* inspirer par de nouvelles méthodes de brainstorming. Dès les premières minutes, le coach a proposé un exercice de « mind-mapping » où chaque participant devait *se laisser* emmener par ses associations d’idées, sans les censurer.

    « Lâchez prise, laissez vos pensées vagabonder, » a-t-il répété, et rapidement, les visages se sont détendus. Marie, qui habituellement se laisse guider par les consignes strictes de son supérieur, a surpris tout le monde en *se laissant* entraîner vers des concepts totalement inattendus, comme un service de location de plantes d’intérieur pour les bureaux.

    Pendant la pause café, Paul s’est laissé convaincre par la suggestion du coach de prendre un carnet de croquis. Il s’est alors laissé aller à dessiner des schémas rapides, ce qui a déclenché une discussion animée sur la visualisation des parcours clients.

    À la fin de la séance, le directeur a félicité le groupe : « Vous vous êtes **laissé** emmener par votre imagination, et cela va se refléter dans nos prochaines campagnes. » Tous les participants sont rentrés à leurs postes, convaincus que *se laisser* surprendre par l’inattendu est parfois le meilleur moyen d’innover.
  translation_en: |-
    On Monday morning, the members of the marketing team gathered in the small conference room of building A. The manager, Mr Lévesque, had invited a coach specialized in creativity so that everyone could *let themselves* be inspired by new brainstorming methods. From the first minutes, the coach suggested a “mind-mapping” exercise where each participant had to *let themselves* be carried away by their associations of ideas, without censoring them.

    “Let go, let your thoughts wander,” he repeated, and quickly the faces relaxed. Marie, who usually lets herself be guided by her supervisor’s strict instructions, surprised everyone by *letting herself* be drawn into completely unexpected concepts, such as a service for renting indoor plants for offices.

    During the coffee break, Paul let himself be persuaded by the coach’s suggestion to take a sketchbook. He then *let himself* go on drawing quick diagrams, which sparked a lively discussion about visualising customer journeys.

    At the end of the session, the manager praised the group: “You *let yourselves* be carried away by your imagination, and that will show up in our next campaigns.” All participants returned to their desks, convinced that *letting oneself* be surprised by the unexpected is sometimes the best way to innovate.
