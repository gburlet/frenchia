sections:
- type: explanation
  id: explanation
  heading: Les préfixes – building meaning with a small twist
  body: |-
    **What a prefix does**

    A **prefix** is a short element placed **before** a base word to change its meaning. In French the most common prefixes are *re-*, *dé-*, *in-/im-*, *pré-*, *sur-*, *sous-*, *anti-*, *auto-*, *co-* and *ex-*. Adding a prefix does **not** affect the gender or number of the noun, nor the conjugation of the verb; you simply keep the original word-ending.

    **Forming new words**

    1. **re-** (again, back) → **revenir** ‘to come back’, **revoir** ‘to see again’.

    2. **dé-** (removal, reversal) → **débrancher** ‘to unplug’, **défaire** ‘to undo’.

    3. **in-/im-** (not, opposite) → **inacceptable** ‘unacceptable’, **immobile** ‘motionless’.

    4. **pré-** (before) → **prévoir** ‘to foresee’, **préparer** ‘to prepare’.

    5. **sur-** (over, too much) → **surpayer** ‘to overpay’, **surnommer** ‘to nickname’.

    6. **sous-** (under) → **sous-estimer** ‘to underestimate’, **souscrire** ‘to subscribe’.

    7. **anti-** (against) → **antiviral** ‘antiviral’, **antidote** ‘antidote’.

    8. **auto-** (self) → **autonomie** ‘autonomy’, **autodidacte** ‘self-taught’.

    9. **co-** (together) → **cohabiter** ‘to live together’, **coordonner** ‘to coordinate’.

    10. **ex-** (former, out of) → **ex-mari** ‘ex-husband’, **exclure** ‘to exclude’.

    **Common pitfalls for English speakers**

    * **False friends** – *prévoir* does **not** mean “to provide”; it means “to foresee”. The verb *fournir* is the correct translation of “to provide”.

    * **Spelling with double consonants** – after a prefix, the base keeps its original spelling. If the original verb already contains a double consonant, you keep it (e.g., **recommencer**). With the prefixes *in-*, *im-*, *il-*, *ir-* the consonant may change for phonetic reasons (e.g., **immobile**, **illégal**, **irresponsable**). The prefix *re-* becomes **ré-** before a vowel (e.g., **réexaminer**, **réaffecter**).

    **Quick check**

    Try to guess the meaning of the following words before looking them up: **réexaminer**, **invisible**, **souscrire**, **coexister**. You’ll see how a tiny prefix can completely reshape a word’s sense.
- type: vocabulary
  id: vocabulary
  heading: Les préfixes – vocabulaire B2
  items:
  - fr: réaffecter
    en: to reassign, to allocate again
    pos: verb
    region: common
    formality: standard
    example_fr: Le responsable a **réaffecté** les ressources humaines au projet urgent.
    example_en: The manager reassigned the human resources to the urgent project.
  - fr: surcharger
    en: to overload, to overburden
    pos: verb
    region: common
    formality: standard
    example_fr: Le serveur **surchargé** ne supporte plus le trafic du site web.
    example_en: The overloaded server can no longer handle the website traffic.
  - fr: malentendu
    en: misunderstanding
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Un **malentendu** s’est produit à cause d’une mauvaise traduction.
    example_en: A misunderstanding occurred because of a poor translation.
  - fr: coopérer
    en: to cooperate
    pos: verb
    region: common
    formality: standard
    example_fr: Les deux entreprises ont décidé de **coopérer** sur le développement durable.
    example_en: The two companies decided to cooperate on sustainable development.
  - fr: préavis
    en: notice (as in advance notice)
    pos: noun
    gender: m
    region: common
    formality: standard
    example_fr: Il a donné son **préavis** de deux semaines avant de quitter son emploi.
    example_en: He gave his two-week notice before leaving his job.
  - fr: cofinancer
    en: to co-finance, to fund together
    pos: verb
    region: common
    formality: standard
    example_fr: Le gouvernement et le secteur privé vont **cofinancer** le nouveau réseau de transport.
    example_en: The government and the private sector will co-finance the new transport network.
  - fr: sous-traiter
    en: to subcontract, to outsource
    pos: verb
    region: common
    formality: standard
    example_fr: L’entreprise a décidé de **sous-traiter** la partie logistique à un spécialiste.
    example_en: The company decided to subcontract the logistics part to a specialist.
  - fr: inédit
    en: unpublished, never before released
    pos: adjective
    region: common
    formality: standard
    example_fr: L’artiste a présenté une **œuvre inédite** lors de l’exposition.
    example_en: The artist presented an unpublished work at the exhibition.
  - fr: réorganiser
    en: to reorganise, to restructure
    pos: verb
    region: common
    formality: standard
    example_fr: Après la crise, l’entreprise a dû **réorganiser** son service client.
    example_en: After the crisis, the company had to reorganise its customer service.
  - fr: surévaluer
    en: to over-estimate, to overvalue
    pos: verb
    region: common
    formality: standard
    example_fr: Il ne faut pas **surévaluer** les bénéfices d’un projet avant d’en connaître les risques.
    example_en: One should not over-estimate a project's benefits before knowing its risks.
- type: examples
  id: examples
  heading: Les préfixes – building meaning with a small twist (B2 – Vocabulary)
  examples:
  - fr: Après la réunion, nous avons **réaffecté** les ressources afin de réduire les coûts.
    en: After the meeting, we **re-assigned** the resources in order to cut costs.
    region: common
  - fr: Le technicien a dû **défaire** le montage incorrect avant d’installer le nouveau système.
    en: The technician had to **undo** the incorrect assembly before installing the new system.
    region: common
  - fr: Ce texte est tellement **incompréhensible** que même les experts ont besoin d’une traduction.
    en: This text is so **incomprehensible** that even experts need a translation.
