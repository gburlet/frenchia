    en: Financial **autonomy** of young adults increases when they choose to live in shared housing.
    region: common
  - fr: Deux étudiants décident de **cohabiter** pendant leurs études afin de partager les frais de logement.
    en: Two students decide to **co-habit** during their studies to share housing costs.
    region: common
  - fr: Après plusieurs années à l’étranger, il est devenu **expatrié** et occupe maintenant un poste
      à Paris.
    en: After working abroad for several years, he became an **expatriate** and now holds a position in
      Paris.
    region: common
  - fr: Le directeur a **réorganisé** le service afin d’améliorer la réactivité aux demandes des clients.
    en: The manager **re-organized** the department to improve responsiveness to client requests.
    region: common
  - fr: Le nouveau projet a été **surchargé** de tâches supplémentaires, ce qui a retardé son lancement.
    en: The new project was **overloaded** with additional tasks, which delayed its launch.
    region: common
- type: reading
  id: reading
  title: Le projet de rénovation du centre communautaire
  passage_fr: |-
    Le petit village de Saint-Malo-du-Rivage a décidé de **repenser** son centre communautaire, qui était devenu **dépassé** après plus de trente ans d’usage. Le conseil municipal a **prévu** un budget de deux millions d’euros, mais il a rapidement **sous-estimé** le coût des travaux de mise aux normes électriques.

    Pour éviter les retards, les architectes ont **recherché** des solutions écologiques : ils ont **relocalisé** la production de panneaux solaires dans une usine locale afin de réduire l’**empreinte carbone**. Le nouveau toit sera **mieux isolé**, ce qui permettra d’économiser de l’énergie pendant l’hiver.

    Le projet comporte aussi une partie **autonome** : une salle de coworking qui pourra être louée à des freelances. Cette initiative a été **cofinancée** par une association de jeunes entrepreneurs qui souhaitent **avoir moins de préjugés** envers les projets traditionnels et encourager l’innovation.

    Pendant la phase de construction, le directeur du centre a dû **corriger** plusieurs erreurs de conception initiales. Heureusement, un **antivirus** spécial a été installé dans le système de gestion du bâtiment pour protéger les données des usagers contre les **cyberattaques**.

    Lorsque les travaux seront terminés, le centre sera **inédit** dans la région : il offrira non seulement des activités culturelles, mais aussi un espace de formation pour les habitants désireux d’acquérir de nouvelles compétences. Le maire espère que ce modèle pourra être **reproduit** dans d’autres villages du pays.
  translation_en: |-
    The small village of Saint-Malo-du-Rivage has decided to **rethink** its community centre, which had become **out-dated** after more than thirty years of use. The municipal council **planned** a budget of two million euros, but it quickly **under-estimated** the cost of the electrical-code upgrade works.

    To avoid delays, the architects **searched** for eco-friendly solutions: they **relocated** the production of solar panels to a local factory in order to reduce the **carbon footprint**. The new roof will be **better insulated**, which will allow energy savings during winter.

    The project also includes an **autonomous** part: a coworking room that can be rented to freelancers. This initiative was **co-financed** by an association of young entrepreneurs who wish to **have fewer prejudices** toward traditional projects and encourage innovation.

    During the construction phase, the centre’s director had to **correct** several initial design mistakes. Fortunately, a special **antivirus** was installed in the building-management system to protect users’ data from **cyberattacks**.

    When the works are finished, the centre will be **unprecedented** in the region: it will offer not only cultural activities but also a training space for residents eager to acquire new skills. The mayor hopes that this model can be **replicated** in other villages across the country.
  glossary:
  - fr: cofinancer
    en: to co-finance – to fund together with one or more partners
    pos: verb
    region: common
    formality: standard
    example_fr: Le projet a été cofinancé par la ville et l’entreprise.
    example_en: The project was co-financed by the city and the company.
  - fr: empreinte carbone
    en: carbon footprint – total greenhouse-gas emissions caused by an activity
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: Réduire son empreinte carbone
    example_en: Reduce one's carbon footprint
  - fr: inédit
    en: unpublished, new, never before seen
    pos: adjective
    region: common
    formality: standard
    example_fr: Une œuvre inédite
    example_en: A previously unpublished work
  - fr: reproduire
    en: to reproduce, to replicate
    pos: verb
    region: common
    formality: standard
    example_fr: Reproduire le même modèle dans d’autres villes.
    example_en: Replicate the same model in other towns.
  - fr: sous-traiter
    en: to subcontract – to assign part of a contract to another company
    pos: verb
    region: common
    formality: standard
    example_fr: L’entreprise a sous-traité la partie logistique du projet.
    example_en: The company subcontracted the logistical part of the project.
exercises:
- id: ex-01
  grammar_topics:
  - prefixes
  type: translate
  direction: en_fr
  prompt: 'Translate into French: “We need to rethink our travel plans because the weather forecast is
    unpredictable.”'
  accepted_answers:
  - Nous devons repenser nos projets de voyage parce que les prévisions météorologiques sont imprévisibles.
  - Il faut repenser nos plans de déplacement, la météo étant incertaine.
  - Il nous faut repenser nos itinéraires, la prévision du temps étant imprévisible.
  hint: Use the prefix re- with *penser* (repenser) and the noun *prévision* for “forecast”.
- id: ex-02
  grammar_topics:
  - prefixes
  type: translate
  direction: en_fr
  prompt: 'Translate into French: “The company decided to relocate the factory to a smaller town.”'
  accepted_answers:
  - L’entreprise a décidé de délocaliser l’usine dans une ville plus petite.
  - La société a choisi de délocaliser son usine vers une petite municipalité.
  - L’entreprise a opté pour la délocalisation de l’usine dans une ville de moindre taille.
  hint: The verb with prefix dé- is *délocaliser* (to move a production site).
- id: ex-03
  grammar_topics:
  - prefixes
  type: translate
  direction: en_fr
  prompt: 'Translate into French: “She underestimated how long the paperwork would take, and now the deadline
    is missed.”'
  accepted_answers:
  - Elle a sous-estimé le temps que les formalités prendraient, et maintenant la date limite est dépassée.
  - Elle a sous-estimé la durée des démarches administratives, ce qui a entraîné le dépassement du délai.
  - Elle a sous-estimé le temps requis pour la paperasserie, et la date butoir a été manquée.
  hint: The prefix sous- attaches to *estimer* → *sous-estimer* (to underestimate).
- id: ex-04
  grammar_topics:
  - prefixes
  type: translate
  direction: fr_en
  prompt: Après la tempête, les équipes de secours ont réorganisé le quartier en moins de vingt-quatre
    heures.
  accepted_answers:
  - After the storm, the rescue teams reorganised the neighbourhood in less than twenty-four hours.
  - After the storm, the rescue teams re-organized the neighbourhood within twenty-four hours.
  - Following the storm, the rescue crews re-organized the area in under a day.
  hint: Look for the prefix re- meaning “again / anew”.
- id: ex-05
  grammar_topics:
  - prefixes
  type: translate
  direction: fr_en
  prompt: Le nouveau logiciel désactive automatiquement les fonctions dangereuses avant qu’elles n’endommagent
    le système.
  accepted_answers:
  - The new software automatically disables dangerous functions before they damage the system.
  - The new program automatically turns off risky features before they can harm the system.
  - The new application automatically deactivates unsafe functions before they damage the system.
  hint: 'The prefix dé- often means ''remove'' or ''undo'': désactiver = to turn off. After avant que,
    the verb is in the subjunctive; the ne is optional and has no negative meaning.'
- id: ex-06
  grammar_topics:
  - prefixes
  type: multiple_choice
  question: Which sentence uses the prefix dé- correctly to express the idea “to undo”?
  options:
  - Le menuisier a défait le cadre abîmé avant d’en installer un nouveau.
  - Le menuisier a défaire le cadre abîmé avant d’en installer un nouveau.
  - Le menuisier a défaire le montage incorrect avant d’installer le nouveau système.
  - Le menuisier a défait le cadre abîmé avant d’en défait un nouveau.
  answer_index: 0
  explanation: The verb formed with the prefix *dé-* is **défaire** (infinitive). In the passé composé
    it becomes *a défait* (auxiliary *avoir* + past participle). Option A is the only sentence that uses
    this form correctly. The other options either keep the infinitive after *a* (B, C) or repeat the past
    participle incorrectly (D). This exercise tests the correct use of the prefix *dé-* in the passé composé.
- id: ex-07
  grammar_topics:
  - prefixes
  type: multiple_choice
  question: Choose the sentence where the prefix sous- correctly conveys the meaning “to underestimate”.
  options:
  - Il a sous-estimé la durée du trajet et est arrivé en retard.
  - Il a sous-estimer la durée du trajet et est arrivé en retard.
  - Il a sous-estimé la durée du trajet et est arrivé en retardée.
  - Il a sous-estime la durée du trajet et est arrivé en retard.
  answer_index: 0
  explanation: The verb is **sous-estimer**. In the passé composé it uses *avoir* + the past participle
    **sous-estimé** (no agreement because the direct object follows the verb). Option A respects the correct
    form; B uses the infinitive, C adds an unnecessary agreement, and D misspells the past participle.
- id: ex-08
  grammar_topics:
