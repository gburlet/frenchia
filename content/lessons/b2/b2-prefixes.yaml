  - fr: Nous devons **prévoir** une marge de manœuvre dans le planning au cas où le fournisseur aurait
      du retard.
    en: We must **plan for** a margin of flexibility in the schedule in case the supplier is delayed.
    region: common
  - fr: Malgré les difficultés, elle a réussi à **surmonter** ses peurs et à parler en public.
    en: Despite the difficulties, she managed to **overcome** her fears and speak in public.
    region: common
  - fr: Il a **sous-estimé** l’impact du trafic sur le temps de trajet, ce qui a entraîné un retard de
