sections:
- type: explanation
  id: explanation
  heading: Les suffixes – building new words
  body: "**Les suffixes – building new words (B2)**   \n\nA suffix is a group of letters added **after**\
    \ a root or a base word to create a new word or to change its grammatical class. At the B2 level you\
    \ will encounter the most productive suffixes that turn nouns into adjectives, verbs into nouns, and\
    \ adjectives into adverbs. Below are the most common patterns, with accurate examples and clear rules.\
    \   \n\n | Base → +Suffix | Resulting word | English meaning |\n| ---------------- | ----------------\
    \ | ---------------- |\n| **-age** (noun) | *laver → lavage* | “washing” |\n| **-eur / -euse** (agent)\
    \ | *danser → danseur / danseuse* | “dancer” |\n| **-tion / -ition** (noun) | *organiser → organisation*\
    \ ; *définir → définition* | “organization”, “definition” |\n| **-able / -ible** (adjective) | *utiliser\
    \ → utilisable* ; *lire → lisible* | “usable”, “readable” |\n| **-ment** (noun) | *développer → développement*\
    \ | “development” |\n| **-ité** (noun) | *possible → possibilité* | “possibility” |\n| **-ment** (adverbial)\
    \ | *lent → lente → lentement* | “slowly” |\n\n#### How to use them   \n1. **Identify the lexical\
    \ category** you need. If you want a noun meaning “the act of …”, add **-tion** or **-ition** to the\
    \ verb stem (e.g., *préparer → préparation*, *définir → définition*).   \n2. **Watch the spelling\
    \ changes**: many verbs drop the infinitive ending **-er** before **-age** (*laver → lavage*), and\
    \ when you form an adverb with **-ment** you start from the feminine form of the adjective (*lent\
    \ → lente → lentement*).   \n3. **Gender agreement**: suffixes that create nouns also assign gender.\
    \ *-eur* is usually masculine (*conducteur*), while the feminine counterpart is formed with **-trice**\
    \ (*conductrice*). The **-euse** ending is used for many other agents, e.g., *danseur / danseuse*.\
    \   \n4. **Common pitfalls**:   \n   - **-ment on adjectives**: the adverbial suffix is added to the\
    \ feminine adjective, not to the verb (*lente → lentement*, not *lenter → lenterment*).   \n   - **-tion\
    \ / -sion**: French nouns ending in **-tion** often correspond to English **-ation** (*organisation*\
    \ vs. English *organization*). Nouns ending in **-sion** are usually derived from verbs whose stem\
    \ ends in **-d** or **-t**, with a d/t → s change (e.g., *décider → décision*, *permettre → permission*).\
    \   \n   - **-able / -ible → -abilité / -ibilité**: nouns ending in *-abilité* or *-ibilité* often\
    \ come from adjectives ending in *-able* or *-ible* (*utilisable → utilisabilité*, *lisible → lisibilité*).\
    \   \n\n#### Practice   \nTake a familiar verb or adjective and create at least two new words with\
    \ different suffixes (e.g., *danser → danseur, danseuse*; *développer → développement, développeur*).\
    \ This will reinforce both meaning shifts and spelling rules."
