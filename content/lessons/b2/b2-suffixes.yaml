  type: translate
  direction: fr_en
  prompt: Le déploiement de la technologie interactive a réduit le temps d’attente au guichet.
  accepted_answers:
  - The deployment of the interactive technology reduced the waiting time at the counter.
  - The rollout of the interactive technology shortened the queue at the desk.
  - Deploying the interactive technology cut down the waiting time at the service window.
  hint: Look for the noun formed with -ment (déploiement) and the adjective with -if (interactive). Both
