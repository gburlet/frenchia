  prompt: The company is looking for ways to improve its communication with customers.
  accepted_answers:
  - L’entreprise cherche des moyens d’améliorer sa communication avec les clients.
  - L’entreprise recherche des façons d’optimiser sa communication avec la clientèle.
  - La société veut améliorer la communication avec ses clients.
  - La société veut optimiser la communication avec sa clientèle.
  hint: Use the verb *améliorer* or *optimiser* followed by the noun *communication*.
- id: ex-02
  grammar_topics:
  - suffixes
  type: translate
  direction: en_fr
  prompt: A flexible schedule helps employees balance work and personal life.
  accepted_answers:
  - Un horaire flexible aide les employés à concilier travail et vie personnelle.
  - Un planning flexible permet aux employés d’équilibrer le travail et leur vie privée.
  - Un horaire souple facilite aux employés l’équilibre entre le travail et la vie personnelle.
  - Un horaire flexible aide les employés à équilibrer le travail et la vie privée.
  hint: The adjective *flexible* (or *souple*) modifies *horaire*/*planning*. The expression *concilier
    le travail et la vie personnelle* is standard.
- id: ex-03
  grammar_topics:
  - suffixes
  type: translate
  direction: en_fr
  prompt: The municipality launched a participatory consultation to involve rural communities.
  accepted_answers:
  - La municipalité a lancé une consultation participative afin d’impliquer les communautés rurales.
