    example_en: Decentralised decisions strengthen local democracy.
  - fr: durable
    en: sustainable, able to be maintained
    pos: adjective
    gender: m
    region: common
    formality: standard
    example_fr: Des pratiques durables sont essentielles pour l'avenir.
    example_en: Sustainable practices are essential for the future.
