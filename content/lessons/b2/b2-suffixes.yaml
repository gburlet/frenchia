    en: revitalisation, renewal
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: Le projet de revitalisation du centre-ville a été applaudi.
    example_en: The downtown revitalisation project was applauded.
  - fr: optimisation
    en: optimisation, improvement of efficiency
    pos: noun
    gender: f
    region: common
    formality: standard
    example_fr: L'optimisation des processus a réduit les coûts.
