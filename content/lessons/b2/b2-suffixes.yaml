- id: ex-06
  grammar_topics:
  - suffixes
  type: multiple_choice
  question: Which of the following words correctly uses the suffix -age to turn a verb into a noun meaning
    “the act of washing”?
  options:
  - lavage
  - laver
  - lavageage
  - lavement
  answer_index: 0
  explanation: The suffix **-age** attaches to the verb *laver* (lav-) to form *lavage*, which means “the
    act of washing”. *Laver* is the infinitive verb, *lavageage* is not a real word, and *lavement* is
    a different noun formed with the suffix **-ement**, not **-age**. Therefore, *lavage* is the correct
    choice.
- id: ex-07
  grammar_topics:
  - suffixes
  type: multiple_choice
  question: 'Choose the adjective formed with the suffix -able that best fits the sentence: “Le nouveau
    système est très _______ pour les utilisateurs novices.”'
  options:
  - utilisable
  - utilisant
  - utilisation
  - utilisateur
  answer_index: 0
  explanation: The suffix **-able** creates an adjective meaning “capable of being …”. *Utilisable* =
    “usable, easy to use”. *Utilisant* is a present participle, *utilisation* is a noun, and *utilisateur*
    is a noun meaning “user”.
- id: ex-08
  grammar_topics:
  - suffixes
  type: multiple_choice
  question: Which noun correctly derives from the adjective transparent by adding the appropriate suffix?
  options:
  - transparence
  - transparenter
  - transparenceur
  - transparencee
  answer_index: 0
  explanation: The suffix **-ence** turns the adjective *transparent* into the abstract noun *transparence*
    (“transparency”). The other options either add a non-existent suffix or misuse gender/agreement.
