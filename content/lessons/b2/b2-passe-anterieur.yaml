- type: reading
  id: reading
  title: Le premier vol du jeune pilote
  passage_fr: |-
    Le matin du 12 mai, le petit aéroport de la campagne était encore enveloppé d’une brume légère. Dès que le mécanicien eut vérifié les instruments, il remit les clés du Cessna à Julien, le jeune étudiant en aéronautique. Celui-ci, nerveux mais déterminé, monta à bord, ajusta le tableau de bord et alluma le moteur. Lorsque le moteur eut rugi, il sentit le décollage imminent. Il tira doucement sur le manche, et l’avion s’éleva au-dessus des champs de blé.

    À peine le décollage fut-il achevé que la radio capta un message d’urgence : « Avion en détresse, altitude 300 m, besoin d’assistance ». Julien, qui venait tout juste d’acquérir son brevet, resta calme. Il consulta d’abord le manuel d’urgence, puis il suivit les procédures prescrites. Après qu’il eut réglé la fréquence radio, il informa la tour de contrôle de sa position et demanda l’aide d’un hélicoptère.

    Lorsque le secours eut atteint le secteur, les techniciens purent intervenir rapidement. Julien atterrit en toute sécurité, et le personnel de l’aéroport le félicita pour son sang-froid. Ce jour-là, il prouva que même un novice pouvait gérer une situation critique avec rigueur et sang-froid.
  translation_en: |-
    On the morning of May 12, the small countryside airfield was still wrapped in a light mist. As soon as the mechanic had checked the instruments, he handed the keys of the Cessna to Julien, the young aeronautics student. He, nervous but determined, boarded, adjusted the dashboard and started the engine. When the engine had roared, he felt the imminent take-off. He gently pulled the stick, and the plane rose above the wheat fields.

    Hardly had the take-off been completed when the radio picked up an emergency message: “Aircraft in distress, altitude 300 m, need assistance.” Julien, who had just earned his licence, stayed calm. He first consulted the emergency manual, then followed the prescribed procedures. After he had set the radio frequency, he informed the control tower of his position and requested the help of a helicopter.

    When the rescue team had reached the area, the technicians were able to intervene quickly. Julien landed safely, and the airport staff congratulated him for his composure. That day, he proved that even a novice could handle a critical situation with rigor and composure.
