- type: explanation
  id: explanation
  heading: Le passé antérieur
  body: |-
    **What the passé antérieur *is***  

    The passé antérieur is a literary past tense that expresses an action **completed *just before* another past action**. In modern spoken French it is rare; you will mainly meet it in novels, historical texts, formal speeches, and some journalistic writing. Think of it as the French equivalent of the English *had-done* when it appears in a narrative past.  

    ***  

    **How to form it**  

    The passé antérieur is built with **the auxiliary verb in the passé simple** + **the past participle of the main verb**.  

    | Verb | Auxiliary (passé simple) | Past participle | Passé antérieur |
    | ------ | -------------------------- | ---------------- | ---------------- |
    | **manger** | *j'eus* | *mangé* | **j'eus mangé** |
    | **venir** (with *être*) | *tu fus* | *venu* | **tu fus venu** |
    | **aller** (with *être*) | *il fut* | *allé* | **il fut allé** |
    | **naître** (with *être*) | *elle fut* | *né* | **elle fut née** |

    **Key points**  

    * Use **avoir** for most verbs; use **être** for the same verbs that take *être* in the passé composé (movement, change of state, reflexives).  
    * The auxiliary follows the *passé simple* conjugation (rare forms like *je fus*, *tu fus*, *il fut*, *nous fûmes*, *vous fûtes*, *ils furent*).  
    * The past participle agrees with the subject when the auxiliary is *être* (just like the passé composé).  

    ***  

    **When to use it**  

    1. **Narrative sequence** – a quick action that precedes another past event expressed in the passé simple.  

    *« Dès qu'il eut ouvert la porte, j'entendis un bruit étrange. »* – *As soon as he had opened the door, I heard a strange noise.*  

    2. **Temporal clauses** introduced by conjunctions such as *dès que, lorsque, aussitôt que, à peine que*.  

    *« À peine fut-il sorti que le téléphone sonna. »* – *He had barely left when the phone rang.*  

    ***  

    **Common pitfalls for English speakers**  

    * **Confusing the auxiliary** – many learners default to *avoir* because it is the default in the passé composé. Remember that verbs that use *être* in the passé composé also use *être* in the passé antérieur (e.g., *elle fut arrivée*).  
    * **Overusing the tense** – because the passé antérieur sounds very formal, using it in everyday conversation or in a simple email feels unnatural. Reserve it for written narratives or formal speeches.  

    ***  

    ---  

    > **Tip:** When you read a novel and see *eut* or *fut* followed by a past participle, you are looking at the passé antérieur. Recognizing the auxiliary in the passé simple is the quickest way to spot it.  

    ***
