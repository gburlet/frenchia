  type: multiple_choice
  question: Which sentence correctly uses the futur antérieur to express an action that will be completed
    before another future action?
  options:
  - Quand nous aurons fini le cours, nous partirons à la bibliothèque.
  - Quand nous finissions le cours, nous partirons à la bibliothèque.
  - Quand nous aurons finira le cours, nous partirons à la bibliothèque.
  - Quand nous serons fini le cours, nous partirons à la bibliothèque.
  answer_index: 0
  explanation: The futur antérieur is formed with the auxiliary **avoir** in the futur simple (aurons)
    + past participle **fini**. Option A follows this pattern and correctly places the futur antérieur
    before the future simple action. Option B uses the imperfect (finissions), which does not express
    a completed future action. Option C has an incorrect past-participle ending (finira). Option D uses
    the wrong auxiliary (être) and an incorrect past participle agreement (fini). Therefore, option A
    is the only correct sentence.
