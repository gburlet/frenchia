- type: reading
  id: reading
  title: Le projet de la communauté écologique
  passage_fr: |-
    Dans le petit village de Saint-Léon, les habitants ont décidé de lancer un **programme de reboisement** pour compenser la perte de forêts autour du lac. Le conseil municipal a voté le plan en janvier, et les bénévoles ont commencé à préparer le terrain dès février.

    **Quand ils auront planté** les premiers arbres, les écoles locales organiseront des sorties pédagogiques pour expliquer aux élèves l’importance de la biodiversité. **D’ici la fin de l’été**, les équipes de volontaires **auront installé** plus de deux cents jeunes plants, et les experts en écologie **auront évalué** la survie de chaque espèce.

    Le maire a promis que, **si les conditions météorologiques sont favorables**, le projet **sera achevé** avant le premier gel d’automne. Ainsi, **une fois que les racines auront pris**, les habitants pourront profiter d’un espace vert qui **aura amélioré** la qualité de l’air et attiré de nouvelles espèces d’oiseaux.

    Le succès de cette initiative dépendra aussi du soutien financier. **Lorsque la municipalité aura reçu** les subventions du gouvernement provincial, elle **pourra financer** l’achat de matériel d’irrigation et de paillis. En attendant, les citoyens sont invités à faire un don ; **après que vous aurez contribué**, vous recevrez un certificat de remerciement et serez inscrit sur le tableau d’honneur du village.

    Ce projet montre comment un effort collectif, planifié dans le temps, peut produire des résultats concrets avant même que les défis environnementaux ne deviennent critiques.
  translation_en: |-
    In the small village of Saint-Léon, the residents have decided to launch a **reforestation program** to compensate for the loss of forests around the lake. The municipal council voted on the plan in January, and volunteers began preparing the ground as early as February.

    **When they will have planted** the first trees, the local schools will organize educational outings to explain to students the importance of biodiversity. **By the end of summer**, the volunteer teams **will have installed** more than two hundred young saplings, and the ecology experts **will have assessed** the survival of each species.

    The mayor promised that, **if the weather conditions are favorable**, the project **will be completed** before the first autumn frost. Thus, **once the roots will have taken hold**, the inhabitants will be able to enjoy a green space that **will have improved** the air quality and attracted new bird species.

    The success of this initiative will also depend on financial support. **When the municipality will have received** the subsidies from the provincial government, it **will be able to fund** the purchase of irrigation equipment and mulch. In the meantime, citizens are invited to make a donation; **after you will have contributed**, you will receive a thank-you certificate and will be listed on the village’s honor board.

    This project shows how a collective effort, planned over time, can produce concrete results even before environmental challenges become critical.
