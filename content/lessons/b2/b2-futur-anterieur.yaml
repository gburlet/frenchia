sections:
- type: explanation
  id: explanation
  heading: Le futur antérieur
  body: '**How the futur antérieur works** | The **futur antérieur** is used to talk about an action that
    **will be finished** *before* another future moment or action. Think of it as the French equivalent
    of English *will have + past participle*.*  ## Formation  ### 1. Auxiliary verb in futur simple (either
    **avoir** or **être**)  - **avoir**: *aurai, auras, aura, aurons, aurez, auront*  - **être**: *serai,
    seras, sera, serons, serez, seront*  ### 2. Past participle of the main verb (agree with the subject
    only when the auxiliary is *être*)  ## Examples  ### With *avoir*  - **J''aurai fini** le rapport
    avant la réunion.  *I will have finished the report before the meeting.*  ### With *être*  - **Nous
    serons arrivés** à l''aéroport quand le vol décollera.  *We will have arrived at the airport when
    the flight takes off.*  ## When to use it  - **Before a future reference point**: *Quand tu reviendras,
    j''aurai déjà mangé.* (When you come back, I will already have eaten.)  - **In a sequence of future
    events**: the earlier one takes the futur antérieur, the later one stays in futur simple.  - **In
    subordinate clauses introduced by** *quand, lorsque, dès que, après que, une fois que* …, the futur
    antérieur signals that the action is completed before the main clause.  ## Common pitfalls for English
    speakers  1. **Choosing the wrong auxiliary** – remember the same rule as for the passé composé: a
    small, closed set of verbs (e.g., *aller, venir, arriver, partir, entrer, sortir, monter, descendre,
    tomber, naître, mourir*, etc.) and all pronominal (reflexive) verbs use *être*; all other verbs use
    *avoir*.  2. **Forgetting agreement with *être*** – the past participle must agree in gender and number
    (e.g., *elle sera partie*, *ils seront partis*). In the futur antérieur, this agreement is just as
    mandatory as in the passé composé.  ## Quick tip  If you can say *will have + past participle* in
    English, you are probably dealing with a futur antérieur in French.'
