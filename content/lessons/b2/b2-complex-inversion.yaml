- id: ex-09
  grammar_topics:
  - complex-inversion
  type: multiple_choice
  question: Which of the following sentences correctly uses complex inversion to ask a formal question
    about a noun subject?
  options:
  - Le comité a-t-ils approuvé le nouveau projet ?
  - Le comité a-t-il approuvé le nouveau projet ?
  - Le comité a-t-elle approuvé le nouveau projet ?
  - Le comité a-t-on approuvé le nouveau projet ?
  answer_index: 1
  explanation: The subject is the masculine singular noun *le comité*. In complex inversion the pronoun
    that replaces the noun must agree in gender and number, so we use *-t-il*. Option B is therefore the
    only correct form. A uses the plural pronoun *ils* (wrong agreement), C uses the feminine pronoun
    *elle* (wrong gender), and D uses the impersonal pronoun *on* (not appropriate for a specific noun).
- id: ex-10
  grammar_topics:
  - complex-inversion
  type: multiple_choice
  question: Choose the sentence that correctly forms a formal question with a plural noun phrase using
    complex inversion.
  options:
  - Les résultats du sondage seront-elles publiés demain ?
  - Les résultats du sondage seront-ils publiés demain ?
  - Les résultats du sondage seront-on publiés demain ?
  - Les résultats du sondage sera-t-il publié demain ?
  answer_index: 1
  explanation: The subject is the masculine plural noun phrase *les résultats du sondage*. In complex
    inversion the noun stays before the verb, and the matching pronoun (il → ils) is added after the verb
    with a hyphen. Because the verb *seront* ends in a consonant, no euphonic *-t-* is inserted. Therefore
    the correct form is *seront-ils*. Option B follows this pattern. Option A uses the feminine pronoun
    *elles*, option C uses the impersonal pronoun *on*, and option D uses the singular verb and pronoun
    (*sera-t-il publié*), which do not agree with the plural subject *les résultats du sondage*.
