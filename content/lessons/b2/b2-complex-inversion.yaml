- type: reading
  id: reading
  title: L’inversion complexe dans un entretien d’embauche
  passage_fr: 'Lors d’une réunion de recrutement, **la responsable des ressources humaines, Madame Lefèvre**,
    examine chaque dossier avec soin. Elle commence par appeler le premier candidat, M. Dupont, qui a
    envoyé son CV la semaine dernière. « M. Dupont, avez-vous déjà travaillé dans une équipe internationale ? »
    demande-t-elle, en notant la réponse sur son tableau. Le candidat répond que, pendant trois ans, il
    a collaboré avec des collègues de Berlin, de Tokyo et de São Paulo. Madame Lefèvre poursuit : « Parlez-vous
    couramment l’anglais ? » – le candidat hoche la tête et précise qu’il possède également un niveau
    intermédiaire en espagnol. Elle enchaîne ensuite avec la deuxième candidate, Mme Bouchard, et lui
    pose une question plus technique : « Avez-vous déjà géré un projet de transformation digitale ? »
    La candidate explique qu’elle a dirigé le déploiement d’un nouveau système de gestion de la relation
    client dans son ancienne entreprise. « Ce projet a-t-il respecté le budget prévu ? » interroge-t-elle,
    cherchant à savoir si les coûts ont été maîtrisés. Mme Bouchard répond que le budget a été légèrement
    dépassé, mais que les bénéfices attendus ont été atteints. Enfin, le comité décide d’inviter les deux
    candidats à un second entretien, afin de clarifier leurs compétences en leadership. « Seront-ils disponibles
    la semaine prochaine ? » conclut Madame Lefèvre, avant de clôturer la séance.'
  translation_en: 'During a recruitment meeting, the human-resources manager, Ms. Lefèvre, examines each
    file carefully. She starts by calling the first candidate, Mr. Dupont, who sent his résumé last week.
    “Mr. Dupont, have you already worked in an international team?” she asks, noting the answer on her
    board. The candidate replies that for three years he collaborated with colleagues from Berlin, Tokyo
    and São Paulo. Ms. Lefèvre continues: “Do you speak English fluently?” – the candidate nods and adds
    that he also has an intermediate level in Spanish. She then moves on to the second candidate, Ms. Bouchard,
    and asks a more technical question: “Have you ever managed a digital-transformation project?” The
    candidate explains that she led the rollout of a new customer-relationship-management system at her
    former company. “Did that project respect the planned budget?” she inquires, looking to see whether
    costs were kept under control. Ms. Bouchard answers that the budget was slightly exceeded, but that
    the expected benefits were achieved. Finally, the committee decides to invite both candidates to a
    second interview, in order to clarify their leadership skills. “Will they be available next week?”
    concludes Ms. Lefèvre, before closing the session.'
