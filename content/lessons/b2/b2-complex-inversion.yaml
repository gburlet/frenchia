sections:
- type: explanation
  id: explanation
  heading: Complex Inversion – Formal Questions (B2)
  body: |-
    **What is complex inversion?**

    In French, *complex inversion* is the construction used to form a formal question when the subject of the sentence is a **noun or noun phrase**. The noun stays before the verb, and the matching **personal pronoun (il, elle, ils, elles)** is added **after the verb, separated by a hyphen**.

    The pattern is therefore:

    ```Subject-noun + Verb-pronoun?```

    (e.g., *Les étudiants ont-ils compris ?*)

    It is different from *simple inversion*, where a pronoun subject (tu, vous, il, elle, on, etc.) directly follows the verb (e.g., *Avez-vous ?*).

    The hyphen is always required; no hyphenated noun-verb sequence such as *vient-Marie* exists in French.

    **How to form complex inversion**

    1. **Start with the declarative sentence** (subject-noun + verb).

    2. **Place a hyphen after the verb**.

    3. **Add the appropriate personal pronoun** that agrees with the subject noun (il/elle for singular, ils/elles for plural).

    4. **If the verb ends in a vowel and the pronoun begins with a vowel, insert the euphonic *-t-*** between them (e.g., *a-t-il*, *sera-t-elle*).

    **Examples**

    - *Marie vient-elle ?* → *Is Marie coming?*

    - *Le directeur a-t-il signé le rapport ?* → *Has the director signed the report?*

    - *Ces étudiants comprennent-ils la leçon ?* → *Do these students understand the lesson?*

    **When to use it**

    - In **formal writing** (newspapers, academic articles, official letters).

    - In **polished speech**, especially at the beginning of a paragraph or when a question follows a statement.

    - With **auxiliary verbs** (*être, avoir, faire, pouvoir, devoir…*) and other verbs that take a noun subject.

    **Common pitfalls for English speakers**

    1. **Forgetting the hyphen** – Write *vient-elle* not *vient elle*.

    2. **Placing the pronoun before the verb** – The noun stays before the verb; the pronoun must come **after** the hyphen (e.g., *Les résultats justifient-ils…*).

    3. **Omitting the euphonic *-t-*** – Insert *-t-* only when the verb ends with a vowel and the pronoun begins with a vowel (e.g., *a-t-il*, *sera-t-elle*).

    4. **Using the wrong pronoun gender/number** – Match the pronoun to the subject noun (e.g., *les étudiantes ont-elles…* not *ont-ils*).

    **Quick check**

    Convert the following statements into formal questions using complex inversion:

    1. *Les employés ont reçu le courriel.* → **Les employés ont-ils reçu le courriel ?**

    2. *Le directeur a signé le rapport.* → **Le directeur a-t-il signé le rapport ?**

    Mastering complex inversion will give your French a more sophisticated, native-like tone, especially in professional and academic contexts.***
