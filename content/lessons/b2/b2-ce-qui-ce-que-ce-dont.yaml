sections:
- type: explanation
  id: explanation
  heading: Ce qui – Ce que – Ce dont (B2)
  body: |-
    **Ce qui** and **ce que** are the neutral relative pronouns that refer to an *unknown* or *unspecified* idea (the “it/that” of English). The choice depends on the grammatical function of the pronoun inside the relative clause:

    | Function inside the relative clause | Relative pronoun | Example |
    | ------------------------------- | ---------------- | --------- |
    | Subject of the clause | **ce qui** | **Ce qui** m’étonne, c’est son énergie. |
    | Direct object of the clause | **ce que** | J’ai lu **ce que** tu as écrit. |
    | Object of a preposition *de* | **ce dont** | **Ce dont** je parle, c’est la réunion de demain. |
    | Object of a preposition (other than *de*) | **ce à quoi / ce avec quoi / ce sur quoi…** | **Ce à quoi** je pense, c’est le projet futur. |

    **Ce dont** replaces *de + ce que*. It is used when the relative clause requires the preposition *de* (possession, cause, reference, etc.).  #### Formation  1. Identify the missing element in the relative clause.  2. Determine its grammatical role (subject, direct object, or complement of *de*).  3. Insert the appropriate pronoun (**ce qui**, **ce que**, **ce dont**, **ce à quoi**, etc.).  #### Common pitfalls for English speakers  - **Confusing subject vs. object**: English often uses *what* for both roles, but French distinguishes them. *What surprised me* → **Ce qui** m’a surpris, not **Ce que**.  - **Forgetting the preposition**: When the verb already contains *de*, keep it and use **ce dont**. *What I’m talking about* → **Ce dont** je parle (not *ce que je parle*).  #### Quick check  - **Ce qui** = “that which/what” when it is the **subject**.  - **Ce que** = “that which/what” when it is the **direct object**.  - **Ce dont** = “that of which/what … about” when the verb needs *de*.  Practice replacing *what* in English sentences with the correct French pronoun to master these nuances.
