- id: ex-09
  grammar_topics:
  - causative-se-faire
  type: multiple_choice
  question: Which sentence correctly uses the causative se faire + infinitif to say that Marie has her
    car washed every Saturday?
  options:
  - Marie se fait laver sa voiture chaque samedi.
  - Marie se fait laver à sa voiture chaque samedi.
  - Marie se fait laver les voitures chaque samedi.
  - Marie se fait laver son voiture chaque samedi.
  answer_index: 0
  explanation: With the causative **se faire + infinitif**, the noun that is the direct object of the
    infinitive follows the infinitive directly. When the object is a personal possession, the possessive
    adjective stays with the noun and no article is used before the noun. Therefore the correct form is
    **se fait laver sa voiture**. Option A follows this pattern. Option B is incorrect because the preposition
    **à** cannot be used here. Option C changes the number (plural) and does not match the meaning “her
    car”. Option D uses the wrong possessive adjective **son** (masculine) with a feminine noun, which
    is ungrammatical. The learner should recognise the proper placement of the possessive adjective and
    the absence of an article after the infinitive.
- id: ex-10
  grammar_topics:
  - causative-se-faire
  type: multiple_choice
  question: Choose the sentence that correctly expresses that we will have our house painted next month
    using se faire + infinitif.
  options:
  - Nous nous ferons peindre la maison le mois prochain.
  - Nous nous ferons peindre une maison le mois prochain.
  - Nous nous ferons à peindre la maison le mois prochain.
  - Nous nous ferons être peindre la maison le mois prochain.
  answer_index: 0
  explanation: The future tense of *se faire* is *nous nous ferons* followed directly by the infinitive
    *peindre* and then the direct object *la maison*. No preposition is inserted between *se faire* and
    the infinitive, and the object keeps its article. Option A follows this pattern. Option B changes
    the meaning (any house instead of our house). Option C inserts the impossible preposition *à*, and
    Option D adds the auxiliary *être*, which is never used in the causative construction.
