sections:
- type: explanation
  id: explanation
  heading: Le causatif avec **se faire**
  body: |-
    **What it is** – The construction **se faire + infinitif** expresses that the subject causes something to be done **to himself/her** by another person or by a service. It is the reflexive counterpart of the classic causative **faire + infinitif**. In English you usually translate it with *to have something done* or *to get something done*.

    **Form** – 1. **Subject** + **se** + **faire** (conjugated) + **infinitif**.
    2. If the infinitive takes a direct object, that object follows the infinitive.

    *Je me **fais** **couper les cheveux** chez le coiffeur.* → *I have my hair cut at the hairdresser’s.*

    **Conjugation table**

    | Person | Reflexive pronoun | Se faire (présent) | Se faire (passé composé) |
    | --- | --- | --- | --- |
    | je | me | **je me fais** | **je me suis fait** |
    | tu | te | **tu te fais** | **tu t'es fait** |
    | il / elle / on | se | **il/elle/on se fait** | **il/elle/on s'est fait** |
    | nous | nous | **nous nous faisons** | **nous nous sommes fait** |
    | vous | vous | **vous vous faites** | **vous vous êtes fait** |
    | ils / elles | se | **ils/elles se font** | **ils/elles se sont fait** |

    **Typical uses** – • **Services**: *Nous nous **faisons** **réparer** la voiture demain.*
    • **Professional help**: *Tu te **fais** **coacher** par un entraîneur.*
    • **Medical or beauty treatments**: *Ils se **font** **appliquer** un vernis protecteur pour prévenir les caries.*
    • **Physiotherapy**: *Elle se **fait** **masser** par son physiothérapeute chaque semaine.*

    **Common pitfalls for English speakers** – 1. **Confusing the object** – In *se faire couper les cheveux*, **les cheveux** is the object of **couper**, not of **se faire**. The subject does **not** cut his own hair; someone else does. A wrong version would be *Je me fais les cheveux couper*, which is ungrammatical.
    2. **Placing the object** – The direct object of the infinitive follows the infinitive directly: *Je me fais **coudre** une robe.*

    The agent (the person who performs the action) is introduced with **par** (or **à** when the agent is a person): *Je me fais coudre une robe **par** la couturière.* or *Je me fais masser **par** mon physiothérapeute.*
