- type: reading
  id: reading
  title: Une journée de soins pour Léa
  passage_fr: |-
    Léa travaille comme graphiste dans une agence de publicité et son emploi du temps est très chargé. Chaque lundi, elle se fait préparer un **déjeuner** équilibré par le service de restauration de son entreprise ; le chef lui apporte un bol de **yogourt**, des fruits frais et du granola maison. Vers neuf heures, elle se fait masser les épaules par le **physiothérapeute** qui vient chaque semaine dans les locaux pour soulager les tensions liées à la position devant l’ordinateur. Après la réunion de l’équipe, Léa se fait photographier par le photographe interne afin d’obtenir des portraits professionnels à mettre à jour sur le site web de l’agence.

    L’après-midi, elle a un rendez-vous chez le dentiste. Avant de partir, elle se fait rappeler le rendez-vous par son assistante **par texto**, ce qui lui évite d’oublier. Au cabinet, le dentiste se charge de nettoyer ses dents et elle se fait **appliquer un vernis protecteur** pour prévenir les caries. En rentrant, Léa se fait livrer un repas chaud par une entreprise locale qui propose des plats végétariens. Elle apprécie de pouvoir se faire préparer un curry de légumes sans avoir à cuisiner elle-même. Le soir, avant de se coucher, elle se fait lire un chapitre d’un **livre audio** par son compagnon, ce qui l’aide à se détendre après une journée bien remplie.

    Grâce à toutes ces petites attentions, Léa se sent moins stressée et plus productive au travail.
  translation_en: |-
    Léa works as a graphic designer at an advertising agency and her schedule is very busy. Every Monday, she has a balanced **breakfast** prepared for her by the company's catering service; the chef brings her a bowl of **yogurt**, fresh fruit and homemade granola. Around nine o’clock, she gets her shoulders massaged by the **physiotherapist** who comes to the office each week to relieve the tension caused by sitting in front of a computer. After the team meeting, Léa has herself photographed by the in-house photographer so she can get professional portraits to update the agency’s website.

    In the afternoon she has a dentist appointment. Before leaving, her assistant **texts** her a reminder of the appointment, which prevents her from forgetting. At the dentist’s office, the dentist cleans her teeth and she has a **protective varnish applied** to prevent cavities. On the way back, Léa has a hot meal delivered by a local company that offers vegetarian dishes. She likes being able to have a vegetable curry prepared for her without having to cook herself. In the evening, before going to bed, she has her partner read a chapter of an **audiobook** to her, which helps her relax after a full day.

    Thanks to all these small attentions, Léa feels less stressed and more productive at work.
