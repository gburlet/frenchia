- type: reading
  id: reading
  title: Une soirée au centre communautaire
  passage_fr: |-
    Le mardi soir, le centre communautaire de la petite ville organise un débat public sur la rénovation du parc municipal. Dès que les participants arrivent, **l’animateur** les accueille avec un grand sourire et, avant même de commencer, il **se met sur son trente-et-un** : il porte une chemise à rayures, une cravate colorée et des chaussures brillantes, histoire de donner le ton.

    Au bout de dix minutes, **la salle** se remplit de voix passionnées. **Marc**, un jeune entrepreneur, prend la parole et, dès le premier mot, on voit qu’il **a la langue bien pendue**. Il raconte comment, alors qu’il **avait le nez dans le guidon**, il a découvert que le parc était en mauvais état et que les enfants n’avaient plus d’endroit sûr où jouer.

    Soudain, **Sophie**, la directrice du service des loisirs, intervient. Elle explique que le budget est serré et que, si le projet n’est pas accepté, le centre risque **d’être dans le pétrin**. Elle ajoute qu’elle ne veut pas **tirer la sonnette d’alarme** en criant sur les élus, mais qu’elle doit être ferme.

    Le débat s’enflamme. **Pierre**, un retraité, se lève et, sans y réfléchir, **met les pieds dans le plat** en demandant pourquoi personne n’a pensé à installer des bancs pour les aînés. Un silence gêné s’installe, puis **Marie**, la présidente du comité, intervient calmement et **tire son épingle du jeu** en proposant une solution de financement participatif qui satisfait tout le monde.

    À la fin de la soirée, tout le monde est content. **Léa**, la bénévole qui a préparé les collations, reçoit des remerciements chaleureux : « C’est vraiment **le pied** d’avoir des gens aussi investis! » Elle repart heureuse d’avoir **contribué**, prête à aider de nouveau la prochaine fois.
  translation_en: |-
    On Tuesday evening, the community centre of the small town hosts a public debate about the renovation of the municipal park. As soon as the participants arrive, the moderator greets them with a big smile and, even before starting, he **dresses to the nines**: he wears a striped shirt, a colourful tie and shiny shoes, just to set the tone.

    After ten minutes, the room fills with passionate voices. **Marc**, a young entrepreneur, takes the floor and, from the first word, it’s clear that he **is very talkative**. He explains how, while he **had his nose in the handlebars**, he discovered that the park was in bad shape and that children no longer had a safe place to play.

    Suddenly, **Sophie**, the director of the leisure service, intervenes. She explains that the budget is tight and that, if the project is not approved, the centre risks **being in a tough spot**. She adds that she does not want to **sound the alarm** by shouting at the elected officials, but she must be firm.

    The debate heats up. **Pierre**, a retiree, stands up and, without thinking, **puts his foot in it** by asking why nobody has thought of installing benches for seniors. An awkward silence follows, then **Marie**, the committee president, calmly **comes out ahead** by proposing a crowdfunding solution that satisfies everyone.

    At the end of the evening, everyone is happy. **Léa**, the volunteer who prepared the snacks, receives warm thanks: “It’s really **great** to have such committed people!” She leaves happy to have **contributed**, ready to help again next time.
