sections:
- type: explanation
  id: explanation
  heading: Idiomatic Expressions (4) – How idioms fit into everyday French
  body: '### Idioms and their patterns  - **Être à l’ouest** – *verb + à + noun* – to be confused, dazed,
    or out of it. *« Après ce long vol, je suis **à l’ouest**. »*  - **Se mettre sur son trente-et-un**
    – *verb + sur + noun* – to dress up very nicely. *« Ce soir, il **se met sur son trente-et-un** pour
    le gala. »*  - **Mettre les pieds dans le plat** – *verb + les + noun* – to say something inappropriate
    or to make a blunder. *« Elle a **mis les pieds dans le plat** en parlant de son divorce. »*  - **Tirer
    la sonnette d’alarme** – *verb + noun + de + noun* – to sound the alarm, to warn people about a danger. *« Le
    député a **tiré la sonnette d’alarme** sur le projet de loi. »*  - **Avoir le cœur sur la main** –
    *verb + noun + preposition + noun* – to be generous, to give freely. *« Il a le **cœur sur la main** ;
    il aide toujours les voisins. »*  - **Faire d’une pierre deux coups** – *verb + de + noun + noun*
    – to achieve two results with a single action. *« En prenant le train, j’ai **fait d’une pierre deux
    coups** : je suis arrivé à l’heure et j’ai économisé de l’argent. »*  - **Donner sa langue au chat**
    – *verb + noun + preposition + noun* – to give up trying to guess something. *« Je ne sais pas la
    réponse, je **donne ma langue au chat**. »*  - **Mettre la main à la pâte** – *verb + noun + preposition + noun*
    – to get involved and help. *« Tout le monde doit **mettre la main à la pâte** pour préparer le dîner. »*
     - **Avoir la tête dans les nuages** – *verb + noun + preposition + noun* – to be day-dreaming or
    absent-minded. *« Il **avait la tête dans les nuages** pendant la réunion. »*  - **Casser les pieds**
    – *verb + noun* – to annoy or bother someone. *« Ce bruit me **casse les pieds**. »*  - **Faire la
    tête** – *verb + noun* – to sulk or be angry. *« Après la dispute, elle **fait la tête**. »*  - **Passer
    du coq à l’âne** – *verb + noun + preposition + noun* – to change the subject abruptly. *« Il **passe
    du coq à l’âne** dès qu’on aborde un sujet sérieux. »*  - **Sabrer le champagne** – *verb + noun*
    – to celebrate by opening a bottle of champagne with a saber. *« Nous **sabrons le champagne** pour
    fêter la promotion. »*  - **Avoir le cafard** – *verb + noun* – to feel down or depressed. *« Depuis
    son départ, elle **a le cafard**. »*  - **Faire d’une mouche un éléphant** – *verb + noun + noun*
    – to exaggerate a small problem. *« Il **fait d’une mouche un éléphant** chaque fois qu’il y a un
    léger retard. »*  ### Common pitfalls for English speakers  1. **Literal translation** – Many idioms
    contain words that, taken literally, make no sense in English. *Être à l’ouest* does **not** refer
    to the geographic west; it simply means “to be dazed”. Translating word-by-word will lead to confusion.
     2. **Fixed structure** – Idioms are lexical chunks; you cannot insert, delete or replace any element.
    For example, you cannot say *« tirer la sonnette »* alone to mean “to warn”; the complete idiom is
    *tirer la sonnette d’alarme*. Likewise, *avoir le cœur sur la main* is a set phrase – you cannot change
    *main* to *bras* or *cœur* to *esprit*.'
