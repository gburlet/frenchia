  grammar_topics: []
  type: multiple_choice
  question: Which sentence uses the idiom être à l’ouest correctly?
  options:
  - Après la réunion, il était à l’ouest et ne savait plus où il était.
  - Après la réunion, il était à l’ouest et a compris immédiatement toutes les décisions.
  - Après la réunion, il était à l’ouest parce qu’il venait de gagner à la loterie.
  - Après la réunion, il était à l’ouest et a commencé à organiser un voyage de noces.
  answer_index: 0
  explanation: ‘Être à l’ouest’ means ‘to be confused, disoriented, or dazed’. Only option A reflects
    this meaning. The other sentences pair the idiom with meanings that are incompatible (understanding
    everything, being elated by a lottery win, or planning a honeymoon).
- id: ex-02
  grammar_topics: []
  type: multiple_choice
  question: Choose the sentence that correctly uses tirer la sonnette d'alarme (to sound the alarm, to
    raise an alarm).
  options:
  - Quand il a senti une odeur de gaz, Marc a tiré la sonnette d'alarme pour évacuer le bâtiment.
  - Quand il a fini son service, Marc a tiré la sonnette d'alarme pour signaler qu’il partait.
  - Quand il a reçu un appel du client, Marc a tiré la sonnette d'alarme pour demander un rendez-vous.
  - Quand il a besoin d’une pause, Marc a tiré la sonnette d'alarme pour que le responsable le libère.
  answer_index: 0
  explanation: « Tirer la sonnette d'alarme » is used when someone alerts others to a danger or an urgent
    problem. In option A, Marc hears a gas leak and sounds the alarm so that everyone can leave the building
    – a proper use of the idiom. The other sentences describe unrelated motives (ending a shift, arranging
    a meeting, asking for a break) and therefore misuse the expression. The idiom always includes **d'alarme**;
    omitting it would change the meaning entirely.
