  type: multiple_choice
  question: Which sentence correctly uses c’est or il/elle est according to the rule?
  options:
  - C’est un ingénieur très créatif qui travaille ici.
  - Il est un ingénieur très créatif qui travaille ici.
  - C’est ingénieur très créatif.
  - Elle est une ingénieure très créatif qui travaille ici.
  answer_index: 0
  explanation: 'The complement after the verb is a **noun** (un ingénieur). When a noun follows, we must
    use **c’est**. **Option A** follows the rule: *C’est un ingénieur…*. **Option B** is wrong because
    *il est* cannot be followed directly by a noun. **Option C** is wrong because the noun needs an article
    (*un* or *le*); *C’est ingénieur* is ungrammatical. **Option D** is wrong for two reasons: the adjective
    *créatif* does not agree with the feminine noun *ingénieure* (it should be *créative*), and the article
    *une* makes the sentence a noun phrase, so it should be *C’est une ingénieure…* rather than *Elle
    est une ingénieure…*.'
