- type: reading
  id: reading
  title: Visite guidée d’un centre d’innovation
  passage_fr: |-
    Ce matin, nous sommes arrivés au **centre d’innovation** de la ville pour une visite guidée. **C’est** un bâtiment moderne, entouré de jardins suspendus et de panneaux solaires. Dès l’entrée, **c’est** *la réception* où l’on nous remet des badges d’accès. **Il est** *ouvert* depuis deux ans, mais déjà il attire des start-ups du monde entier.

    Le guide nous conduit d’abord à la salle de coworking. **C’est** *un espace* lumineux, avec des bureaux modulables et des écrans interactifs. **Il est** *très calme* malgré le nombre de personnes qui y travaillent, car chaque poste est équipé de casques anti-bruit. Ensuite, nous découvrons le laboratoire de prototypage. **C’est** *un atelier* où l’on fabrique des pièces en impression 3D. **Il est** *équipé* de plusieurs imprimantes, de découpeuses laser et même d’un robot de soudure.

    Après la pause café, nous visitons la salle de conférences. **C’est** *une grande salle* pouvant accueillir jusqu’à deux cents participants. **Elle est** *dotée* d’un système de traduction simultanée, ce qui permet à des intervenants étrangers de parler en anglais, en espagnol ou en mandarin. Enfin, le guide termine la visite en nous montrant le toit-terrasse. **C’est** *un espace* de détente avec une vue panoramique sur la rivière. **Il est** *parfait* pour organiser des réunions informelles ou simplement profiter du soleil.

    En sortant, nous nous rendons compte que **c’est** *un lieu* qui combine technologie, écologie et collaboration. **C’est** *certainement* l’un des meilleurs exemples de ce que la ville peut offrir aux innovateurs d’aujourd’hui.
  translation_en: |-
    This morning we arrived at the city's **innovation centre** for a guided tour. **It is** a modern building, surrounded by hanging gardens and solar panels. As soon as we entered, **it is** *the reception* where we were given access badges. **It has been** *open* for two years, but already it attracts start-ups from around the world.

    The guide first leads us to the coworking room. **It is** *a bright space*, with modular desks and interactive screens. **It is** *very quiet* despite the number of people working there, because each workstation is equipped with noise-cancelling headsets. Next, we discover the prototyping laboratory. **It is** *a workshop* where 3D-printed parts are made. **It is** *equipped* with several printers, laser cutters and even a welding robot.

    After the coffee break, we visit the conference hall. **It is** *a large room* that can accommodate up to two hundred participants. **It is** *fitted* with a simultaneous-translation system, which allows foreign speakers to talk in English, Spanish or Mandarin. Finally, the guide ends the tour by showing us the rooftop terrace. **It is** *a relaxation area* with a panoramic view of the river. **It is** *perfect* for informal meetings or simply enjoying the sun.

    Leaving, we realise that **it is** *a place* that combines technology, ecology and collaboration. **It is** *certainly* one of the best examples of what the city can offer to today’s innovators.
