  type: multiple_choice
  question: Choose the sentence that correctly applies il/elle est with an adjective or a profession.
  options:
  - C’est fatiguée après la randonnée de ce matin.
  - Elle est professeure de mathématiques depuis trois ans.
  - Elle est une professeure de mathématiques depuis trois ans.
  - Il est une problème difficile à résoudre.
  answer_index: 1
  explanation: When the complement is an **adjective**, a **profession**, or a **nationality**, the standard
    construction is **il/elle est** + the adjective or the profession **without an article**. → Option B
    (*Elle est professeure de mathématiques depuis trois ans*) follows this rule and is correct. Option A
    uses *c’est* with an adjective, which is not the normal pattern for a personal description. Option C
    uses *elle est* with a noun phrase that includes an article (*une professeure*); this is incorrect
    because the il/elle est construction does not take an article before the profession. Option D mixes
    *il est* with a noun (*une problème*), which is ungrammatical. Therefore, only option B correctly
    demonstrates the **il/elle est** construction for a profession with a duration phrase.
