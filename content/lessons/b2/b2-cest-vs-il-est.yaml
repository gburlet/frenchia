sections:
- type: explanation
  id: explanation
  heading: C’est vs Il/Elle est (B2)
  body: |-
    ### Core explanation

    Both **c’est** and **il/elle est** translate to “it is” in English, but they are not interchangeable. The rule hinges on what follows the verb.

    1. **c’est + noun (or proper name)**
       - Use **c’est** when the complement is a **noun**, a **pronoun** (e.g., *celui-ci*), or a **proper name**.
       - Example: **C’est** *un musée* **?** – *Is it a museum?*
       - Example: **C’est** *Pierre* **qui parle.** – *It’s Pierre who is speaking.*

    2. **c’est + adjective (general idea or situation)**
       - Use **c’est** with an adjective when you are commenting on an unspecific or general idea, a whole situation, or something not previously identified as a specific noun.
       - Example: **C’est** *intéressant* **.** – *That’s interesting.*

    3. **il/elle est + adjective, profession, nationality, or religion**
       - Use **il/elle est** when the complement is an **adjective**, a **profession**, a **nationality**, or a **religion** **and** you are referring to a specific, previously mentioned noun (person, object, etc.). No article is used before the complement.
       - Example: **Il est** *intéressant* **.** – *He/It is interesting (referring to a specific thing already named).*
       - Example: **Elle est** *médecin* **?** – *Is she a doctor?* (Note: the profession is used without an article.)

    ### Common pitfalls for English speakers

    - **Confusing the two patterns**: *« C’est intéressant »* is correct when you are talking about a general idea, but if you are describing a specific noun that has already been introduced, you must use **il/elle est** (*« Il est intéressant »*).
    - **Adding an article after il/elle est**: *« Il est un médecin »* is wrong. The correct forms are **« C’est un médecin »** (noun phrase) or **« Il est médecin »** (profession used as an attribute, no article).

    ### Quick tip

    If you can replace the complement with a **noun** (including a proper name) or you are commenting on a whole situation, choose **c’est**. If the complement is a **pure adjective** or a **profession/nationality/religion** used as an attribute of a specific, previously mentioned noun, choose **il/elle est** (without an article).

    ---

    Practice these patterns in the exercises that follow, paying special attention to the presence or absence of an article after the verb.
