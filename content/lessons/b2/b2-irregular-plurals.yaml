sections:
- type: explanation
  id: explanation
  heading: Les pluriels irréguliers
  body: |-
    **Irregular plurals (B2)**

    In French most nouns form the plural by simply adding **-s** (e.g., *le livre → les livres*). At the B2 level you must also master the handful of nouns whose plural does **not** follow this rule. The most frequent patterns are:**

    | Singular ending | Regular plural | Irregular plural | Example |
    | ----------------- | ---------------- | ------------------ | ---------- |
    | **-al** (most) | **-s** | **-aux** | **un cheval → des chevaux** |
    | **-al** (few) | **-s** | **-s** (no change) | **un bal → des bals** (exception) |
    | **-ail** (most) | **-s** | **-s** (no change) | **un détail → des détails** |
    | **-ail** (few) | **-s** | **-aux** | **un travail → des travaux** (also *bail, corail, émail, soupirail, vantail, vitrail*) |
    | **-eu** | **-s** | **-x** (except *pneu, bleu* → **-s**) | **un jeu → des jeux** |
    | **-ou** (regular) | **-s** | **-s** (no change) | **un trou → des trous** |
    | **-ou** (few) | — | **-x** | **bijou, caillou, chou, genou, hibou, joujou, pou → bijoux, cailloux, choux, genoux, hiboux, joujoux, poux** |
    | **Compound nouns** (noun + noun) | add **-s** to **both** elements | — | **un chou-fleur → des choux-fleurs** |
    | **Compound nouns** (noun + de + noun) | add **-s** to the first element only | — | **un chef-d’œuvre → des chefs-d’œuvre** |
    | **Compound nouns** (verb + noun) | usually invariable | — | **un porte-monnaie → des porte-monnaie** |

    **How to use them**

    1. **Identify the ending** of the singular noun. If it ends in *-al, -ail, -eu, -ou* or is a compound noun, consult the table.

    2. **Apply the irregular ending** shown; the rest of the word stays unchanged.

    3. Remember that the article also changes: *un/une* → *des*, *le/la* → *les*.

    **Common pitfalls for English speakers**

    - **Adding –s to most -al nouns**: *un animal → des animals* is wrong; the correct form is **animaux**.

    - **Confusing -ail plurals**: most *-ail* nouns keep *-s* (*détail → détails*). Only a handful take *-aux* (*travail, bail, corail, émail, soupirail, vantail, vitrail*).

    - **-ou exceptions**: the seven nouns **bijou, caillou, chou, genou, hibou, joujou, pou** take **-x** (not **-s**) in the plural.

    - **Compound nouns**: for noun + noun compounds both parts are pluralised (*chou-fleur → choux-fleurs*). For noun + de + noun compounds only the first element takes *-s* (*chef-d’œuvre → chefs-d’œuvre*). Verb + noun compounds are generally invariable (*porte-monnaie*).

    **Practice** these patterns in context; once you internalise the handful of irregular forms, they become as automatic as regular **-s** plurals.***
