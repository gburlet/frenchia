- type: reading
  id: reading
  title: Les pluriels irréguliers en action – Lecture
  passage_fr: |-
    Lors du séminaire annuel du **musée** de la technologie, les exposants ont présenté leurs projets les plus novateurs. Le groupe de chercheurs a montré deux **chevaux** mécaniques capables de soulever des charges lourdes dans les ateliers souterrains. Leur démonstration a attiré l’attention des experts, qui ont demandé à voir les **baux** de location des espaces de test afin de vérifier la conformité des installations.

    Dans la salle voisine, la responsable du service des **carnets** de suivi a distribué des exemplaires aux ingénieurs. Elle a rappelé que chaque **carnet de bord** doit être rempli quotidiennement, tout comme les **carnets de vaccination** des équipes de terrain, afin de garantir la traçabilité des interventions.

    Après la pause, le comité a dégusté des **œufs** brouillés préparés par le chef du restaurant de l’hôtel. Le chef a expliqué que, pour éviter le **gaspillage**, il utilise des œufs provenant de poules **élevées en plein air**, qui donnent un goût plus riche.

    Parmi les documents présentés, on a trouvé des **journaux** scientifiques, des **animaux** en peluche, ainsi que des **vitraux** restaurés du cloître. Le catalogue mentionnait aussi les **bals**, les **festivals** de l’an dernier, ainsi que des **choux-fleurs** du potager du musée.

    En clôture, le directeur a félicité les équipes pour leurs **travaux** et a annoncé que les **chefs-d’œuvre** créés seront exposés au **musée** l’été prochain. Il a conclu en rappelant que chaque **détail** compte dans la réussite d’un projet.
  translation_en: |-
    During the annual seminar of the technology museum, the exhibitors presented their most innovative projects. The research team displayed two mechanical **horses** capable of lifting heavy loads in underground workshops. Their demonstration attracted the experts' attention, who asked to see the **leases** of the test spaces in order to verify the installations' compliance.

    In the neighboring room, the manager of the **record-keeping notebooks** distributed copies to the engineers. She reminded everyone that each **log-book** must be filled out daily, just like the **vaccination notebooks** of the field teams, to ensure traceability of the interventions.

    After the break, the committee enjoyed scrambled **eggs** prepared by the hotel restaurant's chef. The chef explained that, to avoid **waste**, he uses eggs from **free-range** hens, which give a richer flavour.

    Among the documents presented were scientific **journals**, plush **animals**, and restored **stained-glass windows** of the cloister. The catalogue also listed the **balls**, last year's **festivals**, and **cauliflowers** from the museum's garden.

    In closing, the director congratulated the teams for their **works** and announced that the **masterpieces** created will be exhibited at the **museum** next summer. He concluded by reminding that every **detail** matters in the success of a project.
