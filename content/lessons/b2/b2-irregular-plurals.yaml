  caption: Quick reference for the most common irregular plural patterns (B2 level). Most nouns ending
    in –al become –aux (cheval → chevaux); a few keep –s (bal, carnaval, festival, récital, chacal, régal).
    Most nouns ending in –ail keep –s (détail, chandail, portail); only seven take –aux (travail, bail,
    corail, émail, soupirail, vantail, vitrail). Nouns ending in –ou normally take –ous, but seven take
    –oux (bijou, caillou, chou, genou, hibou, joujou, pou). In noun-noun compounds both elements pluralise;
    in verb-noun compounds the second element is invariable.
