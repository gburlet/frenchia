sections:
- type: explanation
  id: explanation
  heading: Le pronom relatif **duquel** (duquel, de laquelle, desquels, desquelles)
  body: '**What it is** | A *relative pronoun* used after a preposition that already contains **de** or
    **à**. It replaces *de + le/la/les* or *à + le/la/les* and means *of which, about which, from which,
    to which* in English. | **How to form it** | 1. Identify the gender-number of the antecedent (masc. sg.,
    fem. sg., masc. pl., fem. pl.). | 2. Keep the preposition that is part of the compound expression
    (**de** or **à**). | 3. Add the appropriate contracted form of **quel**: - *de + le* → **du** → **duquel** -
    *de + la* → **de la** → **de laquelle** - *de + les* → **des** → **desquels / desquelles** - *à + le*
    → **au** → **auquel** (used after prepositions that are **à**-type, e.g. **grâce à**, **face à**,
    **jusqu’à**). - After prepositions that already contain **de** (e.g. **à côté de**, **près de**, **en
    face de**) the correct form is **duquel / de laquelle / desquels / desquelles**. | **Typical examples** | -
    *La bibliothèque à côté de laquelle je travaille est ancienne.* - *Voici le parc près duquel nous
    habitons.* - *Les fenêtres au-dessus desquelles flotte un drapeau sont ouvertes.* - *Le sujet sur
    lequel nous débattons est délicat.* - *Le pont grâce auquel les deux rives sont reliées date du XIXe
    siècle.* | **Pitfalls for English speakers** | 1. **Confusing *duquel* with *qui* or *que*.** English
    often drops the preposition (*the park we live near*), but French must keep it: *près duquel* (not
    *près qui*). 2. **Mixing up *dont* and *duquel*.** *Dont* replaces **de + qui** when the antecedent
    is the *owner* or *subject* of a verb (*le livre dont l’auteur est célèbre*). It is **not** used after
    a compound preposition; there you need *duquel / de laquelle* etc. 3. **Forgetting agreement.** The
    ending must match the antecedent’s gender and number: *la maison de laquelle*, *les villes desquelles*,
    *le musée duquel*. | **Remember** | Whenever a relative clause follows a preposition ending in **de**
    or **à** and the antecedent is a noun, use **duquel / de laquelle / desquels / desquelles** (or **auquel**
    after a pure **à**-type preposition). This gives the precision expected at the B2 level. | **Practice** | Replace
    the underlined prepositional phrase with the correct relative pronoun: 1. *Nous avons trouvé un café
    ___ les habitants aiment se retrouver.* → **près duquel** 2. *La galerie ___ le conservateur a expliqué
    les influences était très petite.* → **dans laquelle** 3. *Le pont, ___ les deux rives sont reliées,
    a été rénové.* → **grâce auquel**'
