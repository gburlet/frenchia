- type: reading
  id: reading
  title: Une visite guidée au centre historique
  passage_fr: |-
    Lors de mon dernier séjour à la ville, j’ai participé à une visite guidée du centre historique organisée par l’office du tourisme. Le guide, une femme très passionnée, nous a conduits le long d’une petite rue pavée, **à côté de laquelle** se trouvent plusieurs boutiques d’artisanat. Nous sommes arrivés devant la vieille mairie, **près de laquelle** se dresse une horloge monumentale qui sonne chaque heure. La vieille mairie, **en face de laquelle** se situe la place du marché, est entourée d’un espace animé où les marchands vendent des produits frais et des spécialités locales.

    Le groupe a ensuite pénétré dans le musée municipal. Nous avons visité le musée, **au fond duquel** se cache une salle réservée aux expositions temporaires, souvent consacrées à des artistes contemporains. En sortant du musée, nous avons remarqué une petite galerie d’art contemporain, **dans laquelle** le conservateur a expliqué les influences du mouvement surréaliste. Plus loin, nous avons vu le vieux cloître, **au-dessus duquel** se trouvent des balcons offrant une vue imprenable sur les toits de tuiles rouges.

    Pour finir la promenade, le guide nous a indiqué le café du coin, **près duquel** les habitants aiment se retrouver après le travail. Elle a ajouté que, chaque dimanche, des musiciens se réunissent sur une place, **près de laquelle** ils jouent des morceaux de jazz improvisé. Cette journée m’a permis de découvrir non seulement l’histoire de la ville, mais aussi les nombreux lieux où le passé et le présent cohabitent harmonieusement.
  translation_en: |-
    During my last stay in the city, I took part in a guided tour of the historic centre organised by the tourism office. The guide, a very enthusiastic woman, led us along a small cobbled street, **next to which** several craft shops are located. We arrived in front of the old town hall, **near which** stands a monumental clock that chimes every hour. The old town hall, **opposite which** the market square is situated, is surrounded by a lively area where vendors sell fresh produce and local specialties.

    The group then entered the municipal museum. We visited the museum, **at the back of which** a room reserved for temporary exhibitions is hidden, often dedicated to contemporary artists. Leaving the museum, we noticed a small contemporary-art gallery, **in which** the curator explained the influences of the surrealist movement. Further on, we saw the old cloister, **above which** balconies are found, offering a breathtaking view of the red-tile roofs.

    To finish the walk, the guide pointed out the corner café, **near which** locals like to meet after work. She added that, every Sunday, musicians gather on a square, **near which** they play improvised jazz pieces. This day allowed me to discover not only the city’s history but also the many places where past and present coexist harmoniously.
