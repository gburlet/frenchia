sections:
- type: explanation
  id: explanation
  heading: '## Le pronom relatif *auquel* (et *à laquelle*, *auxquels*, *auxquelles*) – Précision dans
    la référence'
  body: 'In French, when a relative clause refers back to a **noun that is the object of the preposition
    *à***, the simple pronouns *qui* or *que* are not sufficient. We use the compound forms **auquel**,
    **à laquelle**, **auxquels**, **auxquelles**. They are built from the preposition *à* + the interrogative
    pronoun *lequel*, which agrees in gender and number with its antecedent. (When the verb governs *de*
    (e.g., *se souvenir de*, *parler de*), the relative pronoun is **dont**: *Le film dont je me souviens*;
    *duquel*/*de laquelle* appear after prepositional phrases ending in *de* such as *à côté de*, *près
    de*.) See the companion lesson on *duquel* for those cases.'
