  question: 'Complétez la phrase avec le pronom relatif approprié : « Les projets ___ les étudiants ont
    participé sont présentés demain. »'
  options:
  - auxquels
  - auxquelles
  - à laquelle
  - auquel
  answer_index: 0
  explanation: Le verbe *participer* se construit avec la préposition *à* ; le pronom relatif doit donc
    reprendre *à* + le pronom. L’antécédent *les projets* est masculin pluriel, donc la forme correcte
    est *auxquels*. Les autres formes sont soit féminines (auxquelles, à laquelle) soit au singulier (auquel).
    La bonne réponse est donc *auxquels* (option 1).
