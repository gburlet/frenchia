- id: ex-09
  grammar_topics:
  - relative-auquel-duquel
  type: multiple_choice
  question: Le projet ___ elle travaille est financé par la ville.
  options:
  - auquel
  - qui
  - dont
  - où
  answer_index: 0
  explanation: 'The antecedent *le projet* is the object of the preposition *à* ( *le projet à …* ). When
    a relative clause follows a noun that is the complement of *à*, the compound pronoun *auquel* (or
    its gender-/number-variant) must be used. *Qui* and *dont* do not express the required prepositional
    relationship, and *où* is only used for places or times. Therefore the correct sentence is : « Le
    projet **auquel** elle travaille est financé par la ville. ».'
