  type: multiple_choice
  question: 'Complétez la phrase avec le démonstratif approprié : « ___ que tu dis est vrai. »'
  options:
  - Ceci
  - Cela
  - Ça
  - Ce
  answer_index: 3
  explanation: 'Dans cette construction, le démonstratif introduit une proposition subordonnée relative :
    « … que tu dis ». Seul le pronom neutre **ce** peut jouer ce rôle (« Ce que tu dis est vrai »). Les
    formes *ceci*, *cela* et *ça* sont des pronoms démonstratifs qui se placent généralement devant un
    verbe ou une proposition indépendante (ex. : « Ceci est intéressant », « Ça, c’est bizarre »), mais
    elles ne peuvent pas introduire une subordonnée relative avec *que* de cette façon. Donc la réponse
    correcte est **Ce**.'
- id: ex-10
  grammar_topics:
  - ceci-cela-ca
  type: multiple_choice
  question: 'Fill the gap with the correct word: « Je ne comprends pas ___ que tu veux dire. »'
  options:
  - Ceci
  - Ça
  - Ce
  - Cela
  answer_index: 2
  explanation: 'The gap introduces a relative clause that explains *what* is not understood. In this construction
    the neutral demonstrative **ce** is required. Here **ce** is a demonstrative pronoun that serves as
    the antecedent of the relative pronoun *que* (cf. *ce que tu veux dire*). The forms *ceci* and *cela*
    are used to point to a specific, already-identified idea or object (near vs. distant), while *ça*
    is the familiar spoken equivalent of *cela*. None of those three can replace the neutral pronoun **ce**
    in this structure. The complete sentence is: « Je ne comprends pas **ce** que tu veux dire. » This
    pattern is typical at the B2 level.'
