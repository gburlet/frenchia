  type: multiple_choice
  question: Which of the following sentences uses the expletive *ne* correctly?
  options:
  - Nous resterons ici jusqu’à ce que la pluie s’arrête.
  - Il a fermé la porte sans que personne ne l’entende pas.
  - Elle partira à moins que le directeur ne l’autorise.
  - Je partirai de peur qu’il pleuve.
  answer_index: 2
  explanation: The expletive *ne* is an optional, literary particle that is placed **after the subject
    and before the verb** in subordinate clauses introduced by *avant que, à moins que, de peur que, de
    crainte que* (and similar). It does **not** appear after the conjunction itself, and it is **not used**
    with *jusqu’à ce que* or *sans que*. In option C, *à moins que le directeur ne l’autorise* follows
    the correct pattern (conjunction *à moins que* + subject *le directeur* + expletive *ne* + verb *autorise*).
    The other sentences either lack the expletive *ne* (A, D) or use a conjunction that does not take
    the expletive and also contain a grammatical error (B, where *sans que* should not be followed by
    *ne … pas*).
