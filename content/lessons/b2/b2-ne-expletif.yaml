  explanation: Le ne explétif est utilisé après certain·es conjonctions (par ex. **avant que**, **à moins
    que**, **de peur que**, **de crainte que**, **craindre que**, **empêcher que**, **éviter que**, etc.).
    Il se place **avant le verbe** dans la proposition subordonnée (ex. *avant que le train n’arrive*).
    Les conjonctions **jusqu’à ce que** et **sans que** ne prennent jamais le ne explétif ; la subordonnée
