sections:
- type: explanation
  id: explanation
  heading: Le ne explétif
  body: 'The **expletive *ne*** is a *syntactic* particle that can appear in some subordinate clauses
    introduced by certain conjunctions (e.g., **avant que**, **à moins que**, **de peur que**, **de crainte
    que**, **craindre que**, **empêcher que**, **éviter que**). It does **not** express negation; its
    only function is to give the clause a slightly more literary or formal tone. The particle is **optional**
    – it can be omitted in everyday speech – and it is placed **after the subject and before the verb**
    (i.e., between the subject pronoun/noun and the verb in the subjunctive). It never appears together
    with a second negative element such as *pas* or *personne*; in those cases the *ne* would be a true
    negation, not an expletive one.  Le ne explétif est utilisé après certaines conjonctions qui exigent
    le subjonctif. It is not used after **jusqu’à ce que** or **sans que**; those conjunctions never take
    the expletive *ne* and the *ne* is therefore absent in those clauses.    **How to use it**: 1. Choose
    a trigger conjunction that normally requires the subjunctive (e.g., *avant que*). 2. Put the subject,
    then the expletive *ne*, then the verb in the subjunctive. 3. Conjugate the verb as you normally would
    in the subjunctive mood.    **Examples**    - *Je resterai à la maison **à moins que le médecin ne
    me conseille autrement**.* → I will stay at home **unless the doctor advises me otherwise**.    -
    *Il a fermé la fenêtre **de peur que le vent ne la fasse voler**.* → He closed the window **for fear
    that the wind would blow it away**.    - *Nous partirons **avant que la neige ne recouvre les sentiers**.*
    → We will leave **before the snow covers the paths**.    **Quick check** Replace the blank with the
    correct conjunction (and insert the expletive *ne* where required):    - *Nous partirons **______**
    la neige ne recouvre les sentiers.* → **avant que**    - *Il a refermé la porte **______** le chat
    ne s’échappe.* → **de crainte que** **or** **de peur que**    Remember: when the trigger conjunction
    calls for the subjunctive, the expletive *ne* may be inserted after the subject; it is optional and
    purely stylistic.'
