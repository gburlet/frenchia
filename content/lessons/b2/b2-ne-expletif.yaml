    - Elle a fermé la porte **de peur que le chat ne s’échappe**.
  - - de crainte que
    - for fear that
    - similar to *de peur que*
    - Il a baissé le volume **de crainte que les voisins n’entendent**.
  - - craindre que
    - for fear that / to fear that
    - formal / literary use
    - Nous restons à l’intérieur **craignant que la tempête ne s’intensifie**.
  caption: Conjunctions that can be followed by the expletive *ne* (the *ne* is placed after the subject,
    before the verb). The particle is optional, formal or literary, and carries no negative meaning.
