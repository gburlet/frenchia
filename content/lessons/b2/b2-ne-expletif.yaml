- type: reading
  id: reading
  title: Une archiviste au musée
  passage_fr: |-
    Claire travaille comme archiviste dans un petit musée d’histoire locale. Chaque matin, elle ouvre les portes avant que le soleil ne se lève, afin que les visiteurs puissent admirer les vitrines dès les premières lueurs. Elle classe les documents jusqu’à ce qu’il ne soit plus possible de les ranger sans les abîmer, et elle vérifie chaque pièce de crainte que la moindre poussière ne se remarque.

    Ce jour-là, le conservateur lui a demandé de préparer une exposition sur les traditions rurales, à moins que le budget prévu ne change. Claire a donc commencé à sélectionner les objets, de peur que l’authenticité du thème ne se perde. Elle a contacté plusieurs agriculteurs, de crainte que les habitants ne refusent de prêter leurs outils anciens.

    Pendant qu’elle rédigeait les panneaux explicatifs, elle a entendu le bruit d’une vieille porte qui grinçait. Elle a immédiatement fermé la salle, de peur que le son ne se fasse entendre dans le hall. Finalement, l’exposition a pu être inaugurée à temps, grâce à la rigueur de Claire, même si le directeur a rappelé que, si les consignes de sécurité n’avaient pas été respectées, le projet aurait pu être suspendu.
  translation_en: |-
    Claire works as an archivist in a small local-history museum. Every morning she opens the doors before the sun rises, so that visitors can admire the displays from the first light. She files the documents until it is no longer possible to store them without damaging them, and she checks each item for fear that the slightest dust be noticed.

    That day the curator asked her to prepare an exhibition on rural traditions, unless the planned budget changes. Claire therefore began to select the objects, for fear that the authenticity of the theme might be lost. She contacted several farmers, lest the locals refuse to lend their old tools.

    While she was writing the explanatory panels she heard the creak of an old door. She immediately closed the room, for fear that the sound be heard in the lobby. In the end the exhibition could be inaugurated on time, thanks to Claire’s rigor, even though the director reminded everyone that, if the safety rules had not been respected, the project could have been suspended.
