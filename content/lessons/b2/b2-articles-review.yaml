- id: ex-05
  grammar_topics:
  - articles-review
  type: multiple_choice
  question: Which article correctly completes the sentence? « Après le séminaire, les participants ont
    reçu ___ rapport dont le directeur avait parlé la veille, le seul à être signé. »
  options:
  - un
  - une
  - le
  - des
  answer_index: 2
  explanation: The noun *rapport* is masculine singular. The relative clause *dont le directeur avait
    parlé la veille, le seul à être signé* makes the report uniquely identified, so the definite article
    **le** is required. The other choices would either introduce an unspecified report (*un*), be gender-incorrect
    (*une*), or be plural (*des*). Hence **le** is the only correct answer.
- id: ex-06
  grammar_topics:
  - articles-review
  type: multiple_choice
  question: Choose the correct article for the blank: « Il ne mange jamais ___ viande, mais il adore le
    poisson. »
  options:
  - de
  - du
  - de la
  - des
  answer_index: 0
  explanation: In a negative sentence, the partitive article becomes **de** (or **d'**) regardless of
    the gender or number of the noun. *Viande* is a feminine singular mass noun, so the correct form is
    **de** viande. The other options are the affirmative partitive forms (du, de la, des) which are not
    used after a negation such as *ne…jamais*.
- id: ex-07
  grammar_topics:
  - articles-review
  type: multiple_choice
  question: Select the version that is grammatically correct in the following sentence: « Pendant ___
    que j’ai passé à préparer cette présentation, j’ai découvert de nouvelles sources. »
  options:
  - le temps
  - un temps
  - du temps
  - aucun temps
  answer_index: 0
  explanation: 'After the preposition *pendant* (or *durant*), a duration is introduced with the definite
    article: *pendant le temps que…* = “during the time that…”. The indefinite article (*un temps*) would
    refer to “some time” without the specific sense required, the partitive (*du temps*) is not used after
    *pendant*, and *aucun temps* changes the meaning to “no time at all”. Therefore the correct choice
    is **le temps** (option 0).'
