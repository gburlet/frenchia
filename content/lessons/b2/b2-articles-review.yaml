sections:
- type: explanation
  id: explanation
  heading: ✅ Révision des articles (B2)
  body: |-
    **In this review you’ll consolidate the four French article families – definite (le, la, les), indefinite (un, une, des), partitive (du, de la, de l’, des) – and the situations where no article is used. At the B2 level the challenge is not *recognising* the article but *choosing* the right one in more nuanced contexts such as abstract nouns, collective ideas, or after certain verbs.**

    ### 1. Definite article – *le / la / les*
    Use it when you talk about a specific thing that both speakers can identify, **or** when a noun is used generically to denote an entire class.
    - **Le** **vélo** est bon pour la santé. *(The bike is good for health.)*
    - **Les** **lois** changent souvent. *(Laws change often.)*
    - **L’** **amour** est universel. *(Love is universal.)*

    ### 2. Indefinite article – *un / une / des*
    Use it for an *unspecified* singular item, or for plural items when you mean “some” rather than “all”.
    - J’ai acheté **une** **chaise** vintage. *(I bought a vintage chair.)*
    - **Des** **amis** sont venus hier. *(Some friends came yesterday.)*

    ### 3. Partitive article – *du / de la / de l’ / des*
    Use it for an *uncountable* quantity or a part of a whole. In negative sentences the partitive becomes **de** (or **d’** before a vowel).
    - Je veux **du** **café**. *(I want some coffee.)*
    - Il ne mange plus **de** **sucre**. *(He no longer eats any sugar.)*

    ### 4. No article
    Omit the article in the following typical situations:
    - **Professions, titles or statuses after *être* (without an adjective)**: *Il est professeur.* *(He is a teacher.)*
    - **Names of languages after *parler***: *Elle parle français couramment.* *(She speaks French fluently.)*
    - **Abstract nouns used in a generic sense after certain adjectives or prepositions**: *Il travaille avec passion.* *(He works with passion.)*

    ### 5. Common pitfalls for English speakers
    1. **Partitive disappears in negation** – Learners often keep the partitive after a negative verb: *Je ne veux **du** pain* (incorrect). The correct form is *Je ne veux **pas de** pain.*
    2. **Zero article with abstract concepts** – English often omits the article with abstract nouns (“happiness is important”). French, however, normally requires the definite article: *Le **bonheur** est important.* Using *bonheur* without an article is ungrammatical in this generic sense.

    **Practice**: In the reading section that follows, identify the nouns that need a definite, indefinite, partitive, or no article and note why each choice is appropriate.
