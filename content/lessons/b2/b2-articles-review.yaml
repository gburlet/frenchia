  - - Nom non comptable, quantité indéterminée
    - du / de la / de l’
    - Je bois **du** café chaque matin.
  - - Après négation
    - de / d’ (à la place de un, une, des, du, de la) ; le/la/les ne changent pas
    - Je n’ai pas **d’** argent.
  - - Après expressions de quantité
    - de + nom
    - Beaucoup **de** gens sont venus.
  - - Nom propre précédé d’un adjectif qualificatif
    - le / la / les
    - '**Le** jeune Paul.'
  - - Nom de matière, sport, langue
    - du / de la (sports) ; le (langues)
    - Il fait **du** tennis. / Elle étudie **le** français.
  - - être + profession / statut (sans adjectif)
    - pas d’article
    - Il est **professeur**.
  - - Nom collectif suivi d’un complément
    - le / la / les
    - '**Le** groupe des étudiants a voté.'
  - - Nom précédé de « chaque », « quelques », « plusieurs »
    - pas d’article
    - Chaque jour apporte son lot.
  - - Nom précédé de « un/une » au sens de « une sorte de »
    - un / une
    - C’est **une** forme d’art moderne.
