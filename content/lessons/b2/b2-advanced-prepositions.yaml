- id: ex-09
  grammar_topics:
  - prepositions-advanced
  type: multiple_choice
  question: Which preposition correctly completes the sentence to express a future starting point? *Le
    magasin ouvre ___ 9 h tous les jours.*
  options:
  - à partir de
  - en attendant
  - à l'égard de
  - au sujet de
  answer_index: 0
  explanation: 'The sentence needs a preposition that marks the moment when something will begin. **à
    partir de** is the fixed expression used for a future starting point (e.g., *à partir de 9 h* = ‘starting
    at 9 a.m.’). The other choices do not convey this meaning: *en attendant* means ‘while waiting’, *à
    l''égard de* and *au sujet de* refer to attitude or topic. Therefore the only natural choice is **à
    partir de**: *Le magasin ouvre **à partir de** 9 h tous les jours.* Note: **dès** can also indicate
    a starting point, but it is typically used when the speaker wants to stress that something begins
    **as early as** that moment (e.g., *dès 9 h* = ‘as early as 9 a.m.’). In this exercise we focus on
    the neutral expression **à partir de**. The other options are incorrect because they do not express
    a future starting point.'
- id: ex-10
  grammar_topics:
  - prepositions-advanced
  type: multiple_choice
  question: 'Choose the correct prepositional phrase to express a deadline that is still some time away:'
  options:
  - d'ici la fin du trimestre
  - en attendant la fin du trimestre
  - à partir de la fin du trimestre
  - à l'égard de la fin du trimestre
  answer_index: 0
  explanation: When you want to say that something must happen before a future moment, you use **d'ici**
    followed by the time reference (e.g., *d'ici la fin du trimestre*). *En attendant* would mean “while
    waiting for”, which does not convey a deadline. *À partir de* indicates a starting point, not an end
    point, and *à l'égard de* deals with attitude toward something, so they are not appropriate.
