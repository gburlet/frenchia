sections:
- type: explanation
  id: explanation
  heading: Les prépositions avancées – La précision
  body: |-
    In B2 French you start to use *compound prepositions* that add a nuance of time, condition or attitude. Five of the most useful are **à partir de**, **dès**, **en attendant**, **d'ici** and **à l'égard de**. They are all fixed expressions; you do not change their form, but you must place the complement correctly.

    | Preposition | Main idea | Typical complement |
    | ------------- | ----------- | -------------------- |
    | **à partir de** | starting point (time or quantity) | a date, an amount, a place |
    | **dès** | “as early as / from (that moment on)” | a moment, a date, a period |
    | **en attendant** | while waiting for something else | a noun or a *que*-clause |
    | **d'ici** | deadline or future distance from now (by) | a time span, a date |
    | **à l'égard de** | attitude or relation toward someone/something | a person, a concept |

    **Examples**  - **À partir de** lundi, je travaille à temps partiel.  - **Dès** lundi, le magasin ouvre à 9 h.  - **En attendant** le bus, je lis un article.  - **D'ici** la fin de la semaine, nous aurons reçu les confirmations.  - Il a beaucoup de respect **à l'égard de** ses aînés.  #### Common pitfalls  1. **Confusing *dès* with *à partir de*** – *dès* + noun/time means “as early as, from (that moment on)”. It stresses that something starts at that point, often implying immediacy. *À partir de* + noun/time is neutral and simply indicates the point from which something continues. For example, *dès lundi* = “as early as Monday (starting Monday)”, whereas *à partir de lundi* = “from Monday onward”.  2. **Using *en attendant* with a full clause without the required *que*** – The complement of *en attendant* must be either a noun (*en attendant le bus*) or a *que*-clause (*en attendant que le film commence*). Dropping the *que* (*en attendant le film commence*) is ungrammatical. Mastering these prepositions lets you express precise temporal and relational nuances, a hallmark of B2-level fluency.
