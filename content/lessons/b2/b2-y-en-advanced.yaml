sections:
- type: explanation
  id: explanation
  heading: Les emplois avancés de *y* et *en*
  body: |-
    **### Core explanation (B2)**

    At this level *y* and *en* are no longer limited to simple location or quantity replacement; they appear in a set of idiomatic constructions that convey a whole idea. The two pronouns keep their basic positions (before the verb, before the infinitive, **before the auxiliary** in compound tenses such as the passé composé, etc.), but the meaning is now more abstract.

    | Idiom | Meaning | Example |
    | ------- | ---------- | ---------- |
    | **s’en aller** | to leave, to go away | *Il s’**en** va demain.* |
    | **j’y pense** | I’m thinking about it / it’s on my mind | *J’**y** pense souvent.* |
    | **ça y est** | that's it, it’s done | *Le rapport est terminé, **ça y est** !* |
    | **en avoir marre** | to be fed up | *J’**en** ai **marre** du trafic.* |
    | **y avoir** (impersonal) | there is/are | *Il **y a** trois options.* |
    | **en être** (to be at a certain point) | to have reached a stage | *Nous **en** sommes à la troisième étape.* |

    #### How to form them

    1. **Identify the fixed expression** – many of them are lexicalised, so you must learn the whole phrase, not just the pronoun.

    2. **Place the pronoun** exactly where a simple *y* or *en* would go (before the conjugated verb, before the infinitive, before the auxiliary in compound tenses).

    3. **Do not add a preposition** before the verb; the pronoun already carries the prepositional meaning.

    #### Common pitfalls for English speakers

    * **Omitting the pronoun in fixed expressions** – some idioms require *y* or *en* even though English does not have an equivalent word.

    Example: *Ça **y** est* (not *Ça est*).

    * **Using *y* for people** – *y* replaces locations or things, never persons.

    Correct: *Je pense à Marie* → *Je **pense à elle** / **Je **lui** pense* (indirect object).

    Incorrect: *Je **y** pense* for a person.

    * **Misusing *en* with quantities** – when a noun is introduced by *de* and refers to a quantity, *en* must be used.

    Correct: *J’ai trois pommes → J’en ai trois.*

    Incorrect: *J’ai trois* (without *en*).

    * **Placing the pronoun after the auxiliary in compound tenses** – the pronoun always precedes the auxiliary.

    Correct: *Je **l’ai** vu*, *Je **l’en** ai acheté*; Incorrect: *Je l’ai **vu**.*

    Practice these idioms in context; once they become part of your mental lexicon, *y* and *en* will feel natural again.***
