- type: reading
  id: reading
  title: Une journée de bénévolat au centre communautaire
  passage_fr: |-
    Ce matin, je me suis rendu au centre communautaire où je fais du bénévolat depuis six mois. Dès mon arrivée, le responsable m’a rappelé que **la salle de réunion devait être prête rapidement**, car on devait **s’y** préparer avant dix heures. J’ai donc installé les chaises, disposé les brochures et vérifié que le matériel audiovisuel fonctionnait.

    Vers midi, les participants sont arrivés. Certains **en** avaient entendu parler grâce à l'**infolettre du quartier**, d’autres **l’**avaient découvert sur les réseaux sociaux. Après les présentations, nous avons commencé l’atelier de cuisine. Le chef nous a expliqué que, pour réussir la sauce, il faut **s’y** mettre dès le début et ne pas hésiter à ajuster l’assaisonnement.

    À la fin de la séance, les volontaires ont exprimé leur satisfaction : « Ça **y** est, on a vraiment créé quelque chose de convivial ! » Un des nouveaux arrivés a même proposé de revenir la semaine prochaine, en disant qu’il **en** était très enthousiaste.

    Avant de partir, j’ai rangé le matériel et j’ai vérifié que toutes les fenêtres étaient fermées. En sortant, le responsable m’a dit : « Merci, **tu as** vraiment bien travaillé aujourd’hui. » Je suis rentré chez moi, content d’avoir contribué à un projet qui **a besoin de bénévoles** chaque semaine.
  translation_en: |-
    This morning I went to the community centre where I have been volunteering for six months. As soon as I arrived, the manager reminded me that the meeting room had to be ready quickly, because we had to get ready there before ten o’clock. So I set up the chairs, laid out the brochures and checked that the audiovisual equipment worked.

    Around noon the participants arrived. Some had heard about it through the neighbourhood **infolettre**, others had discovered it on social media. After the introductions we started the cooking workshop. The chef explained that, to get the sauce right, you have to get started right from the beginning and not hesitate to adjust the seasoning.

    At the end of the session the volunteers expressed their satisfaction: "That’s it, we really created something friendly!" One of the newcomers even offered to come back next week, saying he was very enthusiastic about it.

    Before leaving I put the equipment away and made sure all the windows were closed. As I was leaving, the manager said: "Thank you, you really did a great job today." I went home happy to have contributed to a project that needs volunteers every week.
