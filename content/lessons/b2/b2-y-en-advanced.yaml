  type: multiple_choice
  question: Which sentence correctly uses the idiomatic pronoun y to replace a previously mentioned place?
  options:
  - Je vais y demain pour la réunion.
  - Je y vais demain pour la réunion.
  - J’y vais demain pour la réunion.
  - Je y aller demain pour la réunion.
  answer_index: 2
  explanation: The pronoun *y* must be placed **before** the conjugated verb *vais* and the verb must
    stay in its normal form. The correct order is *J’y vais* (option C). Option A puts *y* after the verb,
    which is not allowed. Option B misses the required elision of *je* before *y* (it should be *j’y*).
    Option D uses the infinitive *aller* after a conjugated verb, which is ungrammatical.
- id: ex-10
  grammar_topics:
  - y-en-advanced
  type: multiple_choice
  question: Choose the sentence that correctly employs the idiom s’en aller in the passé composé.
  options:
  - Elle s’est allée hier soir après le spectacle.
  - Elle s’est allé hier soir après le spectacle.
  - Elle s’en est allée hier soir après le spectacle.
  - Elle s’en est allé hier soir après le spectacle.
  answer_index: 2
  explanation: 'In the idiom *s’en aller*, the auxiliary verb is *être* and the past participle agrees
    with the subject. Because the verb already contains the pronoun *en*, the auxiliary is *être* and
    the past participle *allé* must agree with the feminine singular subject *elle*: *s’en est allée*.
    Option C is therefore correct. Option A omits the required *en*. Option B uses the masculine past
    participle *allé* with a feminine subject, breaking agreement. Option D repeats the same agreement
    error as B.'
