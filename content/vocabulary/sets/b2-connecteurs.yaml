schema_version: 1
id: b2-connecteurs
content_version: 1
level: B2
title: Les connecteurs logiques
title_en: Linking words
entries:
- id: parce-que
  fr: parce que
  en: because
  pos: adverb
  region: common
  formality: standard
  example_fr: Je vais au chalet parce que j'ai besoin de repos.
  example_en: I am going to the cottage because I need some rest.
- id: donc
  fr: donc
  en: so / therefore
  pos: adverb
  region: common
  formality: standard
  example_fr: Il y a beaucoup de neige, donc je reste à la maison.
  example_en: There is a lot of snow, so I am staying home.
- id: mais
  fr: mais
  en: but
  pos: adverb
  region: common
  formality: standard
  example_fr: J'aime magasiner, mais je préfère acheter en ligne.
  example_en: I like shopping, but I prefer buying online.
- id: cependant
  fr: cependant
  en: however
  pos: adverb
  region: common
  formality: formal
  example_fr: Le trajet était long ; cependant, le paysage était magnifique.
  example_en: The trip was long; however, the scenery was magnificent.
- id: pourtant
  fr: pourtant
  en: yet / nevertheless
  pos: adverb
  region: common
  formality: standard
  example_fr: Il a beaucoup travaillé, pourtant il semble très fatigué.
  example_en: He worked a lot, yet he seems very tired.
- id: bien-que
  fr: bien que
  en: although
  pos: adverb
  region: common
  formality: standard
  example_fr: Bien qu'il fasse froid, nous allons faire une randonnée.
  example_en: Although it is cold, we are going for a hike.
- id: en-raison-de
  fr: en raison de
  en: due to
  pos: adverb
  region: common
  formality: formal
  example_fr: Le magasin est fermé en raison de la fête.
  example_en: The store is closed due to the holiday.
- id: puisque
  fr: puisque
  en: since / seeing as
  pos: adverb
  region: common
  formality: standard
  example_fr: Puisque tu es là, peux-tu m'aider avec le souper ?
  example_en: Since you are here, can you help me with supper?
- id: d-abord
  fr: d'abord
  en: first of all
  pos: adverb
  region: common
  formality: standard
  example_fr: D'abord, il faut vérifier les ingrédients avant de cuisiner.
  example_en: First of all, you need to check the ingredients before cooking.
- id: ensuite
  fr: ensuite
  en: next / then
  pos: adverb
  region: common
  formality: standard
  example_fr: On va aller au dépanneur, ensuite on fera les courses.
  example_en: We're going to the convenience store, then we'll do the grocery shopping.
- id: finalement
  fr: finalement
  en: finally / ultimately
  pos: adverb
  region: common
  formality: standard
  example_fr: Il a beaucoup travaillé et, finalement, il a réussi son examen.
  example_en: He worked a lot and, ultimately, he passed his exam.
- id: ainsi
  fr: ainsi
  en: thus / in this way
  pos: adverb
  region: common
  formality: formal
  example_fr: Il a bien pratiqué, ainsi il a gagné le match.
  example_en: He practiced well, thus he won the match.
- id: alors
  fr: alors
  en: so / then
  pos: adverb
  plural: none
  region: common
  formality: standard
  example_fr: Il pleuvait beaucoup, alors je suis resté à la maison.
  example_en: It was raining a lot, so I stayed home.
- id: du-coup
  fr: du coup
  en: so / as a result
  pos: expression
  plural: none
  region: common
  formality: familiar
  example_fr: Le magasin était fermé, du coup on est partis.
  example_en: The store was closed, so we left.
  note: Very common in spoken French to express a direct consequence.
- id: neanmoins
  fr: néanmoins
  en: nevertheless / nonetheless
  pos: adverb
  plural: none
  region: common
  formality: formal
  example_fr: C'est une idée difficile, néanmoins elle est très intéressante.
  example_en: It's a difficult idea, nevertheless it is very interesting.
- id: par-contre
  fr: par contre
  en: on the other hand
  pos: expression
  plural: none
  region: common
  formality: standard
  example_fr: J'aime le hockey, par contre je n'aime pas le soccer.
  example_en: I like hockey; on the other hand, I don't like soccer.
- id: malgre
  fr: malgré
  en: despite
  pos: adverb
  plural: none
  region: common
  formality: standard
  example_fr: Malgré la tempête de neige, nous sommes allés au chalet.
  example_en: Despite the snowstorm, we went to the cabin.
- id: grace-a
  fr: grâce à
  en: thanks to
  pos: expression
  plural: none
  region: common
  formality: standard
  example_fr: Grâce à ton aide, j'ai fini mon projet à temps.
  example_en: Thanks to your help, I finished my project on time.
- id: a-cause-de
  fr: à cause de
  en: because of
  pos: expression
  plural: none
  region: common
  formality: standard
  example_fr: Le magasin est fermé à cause de la fête nationale.
  example_en: The store is closed because of the national holiday.
- id: par-consequent
  fr: par conséquent
  en: consequently
  pos: expression
  plural: none
  region: common
  formality: formal
  example_fr: Il a beaucoup travaillé ; par conséquent, il est fatigué.
  example_en: He worked a lot; consequently, he is tired.
- id: en-revanche
  fr: en revanche
  en: on the other hand
  pos: expression
  plural: none
  region: common
  formality: formal
  example_fr: Le souper est délicieux ; en revanche, le dessert est froid.
  example_en: The supper is delicious; on the other hand, the dessert is cold.
- id: puis
  fr: puis
  en: then / next
  pos: adverb
  plural: none
  region: common
  formality: standard
  example_fr: Je vais magasiner, puis je vais prendre un café.
  example_en: I'm going shopping, then I'm going to have a coffee.
