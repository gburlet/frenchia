level: B1
title: Expressions de tous les jours
title_en: Everyday expressions
entries:
- id: pas-pire
  fr: pas pire
  en: pretty good, not bad
  pos: expression
  plural: 'no'
  region: qc
  formality: familiar
  example_fr: Comment tu trouves ce film ? — Pas pire du tout.
  example_en: How do you find this movie? — Not bad at all.
  note: 'Québec: pas pire | France: pas mal'
- id: c-est-correct
  fr: c’est correct
  en: it’s okay, that’s fine
  pos: expression
  plural: 'no'
  region: qc
  formality: standard
  example_fr: Tu peux emprunter mon chargeur, c’est correct.
  example_en: You can borrow my charger, it’s fine.
  note: 'Québec: c’est correct | France: c’est bon / ça va'
- id: ca-me-tente
  fr: ça me tente
  en: I feel like it, I’m tempted
  pos: expression
  plural: 'no'
  region: qc
  formality: standard
  example_fr: Il fait froid, mais ça me tente d’aller skier.
  example_en: It’s cold, but I feel like going skiing.
  note: 'Québec: ça me tente | France: j’ai envie de'
- id: avoir-de-la-misere-a
  fr: avoir de la misère à
  en: to have trouble (to) …
  pos: verb
  plural: 'no'
  region: qc
  formality: familiar
  example_fr: J’ai de la misère à me lever tôt le matin.
  example_en: I have trouble getting up early in the morning.
  note: 'Québec: avoir de la misère à | France: avoir du mal à'
- id: presentement
  fr: présentement
  en: currently, right now
  pos: adverb
  plural: 'no'
  region: qc
  formality: standard
  example_fr: Présentement, je travaille sur le projet de groupe.
  example_en: Right now, I’m working on the group project.
  note: 'Québec: présentement | France: actuellement / en ce moment'
- id: pantoute
  fr: pantoute
  en: not at all
  pos: adverb
  plural: 'no'
  region: qc
  formality: familiar
  example_fr: Je n’ai pas pantoute envie de sortir ce soir.
  example_en: I don’t feel like going out tonight at all.
  note: 'Québec: pantoute | France: pas du tout (familiar)'
- id: pas-mal
  fr: pas mal
  en: not bad, pretty good
  pos: expression
  plural: 'no'
  region: common
  formality: standard
  example_fr: Ce restaurant est pas mal, on y retourne.
  example_en: That restaurant is pretty good, let’s go back.
- id: d-accord
  fr: d’accord
  en: okay, agreed
  pos: expression
  plural: 'no'
  region: common
  formality: standard
  example_fr: D’accord, on se retrouve à 18 h devant le cinéma.
  example_en: Okay, we’ll meet at 6 p.m. in front of the cinema.
- id: je-suis-partant-e
  fr: je suis partant(e)
  en: I’m up for it
  pos: expression
  plural: 'no'
  region: common
  formality: standard
  example_fr: Je suis partant(e) pour aller au concert ce soir.
  example_en: I’m up for going to the concert tonight.
- id: ca-me-va
  fr: ça me va
  en: that works for me
  pos: expression
  plural: 'no'
  region: common
  formality: standard
  example_fr: Rendez-vous à 18 h ? Ça me va.
  example_en: Meeting at 6 p.m.? That works for me.
- id: pas-de-probleme
  fr: pas de problème
  en: no problem
  pos: expression
  plural: 'no'
  region: common
  formality: standard
  example_fr: Tu peux me prêter ton livre ? – Pas de problème.
  example_en: Can you lend me your book? – No problem.
- id: je-n-y-vois-pas-d-interet
  fr: je n’y vois pas d’intérêt
  en: I don’t see the point
  pos: expression
  plural: 'no'
  region: common
  formality: standard
  example_fr: Faire du ski cet hiver ? Je n’y vois pas d’intérêt.
  example_en: Skiing this winter? I don’t see the point.
- id: c-est-bon
  fr: c’est bon
  en: that’s fine / okay
  pos: expression
  region: common
  formality: standard
  example_fr: Le film commence à 20 h, c’est bon pour toi ?
  example_en: The movie starts at 8 p.m.; is that fine for you?
- id: ca-me-dit
  fr: ça me dit
  en: I’m up for it / sounds good to me
  pos: expression
  region: common
  formality: familiar
  example_fr: Une soirée jeux de société ? Ça me dit!
  example_en: A board-game night? Sounds good to me.
- id: je-suis-dispo
  fr: je suis dispo
  en: I’m available
  pos: expression
  region: common
  formality: standard
  example_fr: Je suis dispo mercredi après-midi pour le rendez-vous.
  example_en: I’m available Wednesday afternoon for the appointment.
- id: je-me-debrouille
  fr: je me débrouille
  en: I manage / I get by
  pos: expression
  region: common
  formality: standard
  example_fr: Je ne parle pas bien français, mais je me débrouille.
  example_en: I don’t speak French well, but I manage.
- id: ca-roule
  fr: ça roule
  en: all good / it’s fine
  pos: expression
  region: common
  formality: familiar
  example_fr: On se retrouve demain ? – Ça roule, à 14 h.
  example_en: Shall we meet tomorrow? – All good, at 2 p.m.
- id: pas-de-souci
  fr: pas de souci
  en: no worries
  pos: expression
  region: common
  formality: standard
  example_fr: Tu peux compter sur moi, pas de souci.
  example_en: You can count on me, no worries.
- id: ca-me-branche
  fr: ça me branche
  en: I’m into it / that interests me
  pos: expression
  region: common
  formality: familiar
  example_fr: Le nouveau podcast sur le voyage, ça me branche!
  example_en: The new travel podcast really interests me!
- id: j-ai-la-flemme
  fr: j’ai la flemme
  en: I’m feeling lazy / don’t feel like it
  pos: expression
  region: common
  formality: familiar
  example_fr: Faire du sport aujourd’hui? J’ai la flemme.
  example_en: Working out today? I’m feeling lazy.
