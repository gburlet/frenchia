# yaml-language-server: $schema=../schemas/vocab-themes.schema.json
# Vocabulary Station themes: outlines only. Each set in sets/<id>.yaml is generated by the
# local LLM from its theme (scope + Québec focus), checked deterministically (Lexique genders,
# Québec lexicon), proof-read by an external reviewer and then published.
schema_version: 1
themes:
  # --- A1 ---------------------------------------------------------------------------------
  - id: a1-famille
    level: A1
    title: La famille
    title_en: Family
    scope: Close and extended family members, family situations (married, separated), pets at home.
    quebec_focus: "« ma blonde », « mon chum » for partners."
    size: 18
  - id: a1-calendrier
    level: A1
    title: Les jours, les mois et les saisons
    title_en: Days, months and seasons
    scope: Days of the week, months, the four seasons, and time words (aujourd'hui, demain, la fin de semaine).
    quebec_focus: "« la fin de semaine » (weekend), « à matin », « tantôt »."
    size: 24
  - id: a1-epicerie
    level: A1
    title: À l'épicerie
    title_en: At the grocery store
    scope: Everyday fruits, vegetables, dairy, bread and staples bought at the grocery store or the dépanneur.
    quebec_focus: "« faire l'épicerie », « le dépanneur », « une patate », « le blé d'Inde »."
    size: 24
  - id: a1-repas
    level: A1
    title: Les repas
    title_en: Meals and the table
    scope: The three meals, table items, drinks, and verbs for eating and drinking.
    quebec_focus: "Québec meal names: « le déjeuner » (breakfast), « le dîner » (lunch), « le souper » (supper); « un breuvage », « une liqueur »."
    size: 20
  - id: a1-maison
    level: A1
    title: La maison et l'appartement
    title_en: Home and apartment
    scope: Rooms, furniture and appliances in a house or apartment, and words for renting.
    quebec_focus: "« la garde-robe » (closet), « la laveuse » and « la sécheuse », « un 4 et demi »."
    size: 22
  - id: a1-ville
    level: A1
    title: En ville
    title_en: Around town
    scope: Places in a town or neighbourhood (stores, services, public places) and directions.
    quebec_focus: "« le dépanneur », « le centre d'achats », « le stationnement »."
    size: 20
  - id: a1-hiver
    level: A1
    title: La météo et l'hiver
    title_en: Weather and winter
    scope: Weather words, temperatures, and Canadian winter (snow, ice, storms, clearing snow).
    quebec_focus: "« frette », « la poudrerie », « la sloche », « un banc de neige », « déneiger », « pelleter des nuages »."
    size: 22
  - id: a1-corps
    level: A1
    title: Le corps
    title_en: The body
    scope: Main parts of the body and the face, and simple ways to say something hurts.
    size: 20
  # --- A2 ---------------------------------------------------------------------------------
  - id: a2-vetements
    level: A2
    title: Les vêtements
    title_en: Clothing
    scope: Everyday and winter clothing, shoes and accessories, and verbs for wearing and trying on.
    quebec_focus: "« un chandail », « des bas », « des souliers », « des espadrilles », « une tuque », « des mitaines », « des gougounes »."
    size: 24
  - id: a2-magasinage
    level: A2
    title: Le magasinage et l'argent
    title_en: Shopping and money
    scope: Shopping, prices, paying, sales and returns, and money words.
    quebec_focus: "« magasiner », « le centre d'achats », « une piasse », « une cenne », « dispendieux »."
    size: 20
  - id: a2-transport
    level: A2
    title: Les transports
    title_en: Getting around
    scope: Means of transport, public transit, driving and parking, and travel verbs.
    quebec_focus: "« un char », « chauffer » (to drive, familiar), « stationner », « l'autobus »."
    size: 20
  - id: a2-loisirs
    level: A2
    title: Les sports et les loisirs
    title_en: Sports and hobbies
    scope: Popular sports (winter sports especially), hobbies, going out, and verbs for playing.
    quebec_focus: "Hockey and winter sports vocabulary; « un party »."
    size: 22
  - id: a2-travail
    level: A2
    title: Les métiers et le travail
    title_en: Jobs and work
    scope: Common jobs (with feminine forms), workplaces, and words for working and looking for work.
    quebec_focus: "Québec feminine job titles (« une professeure », « une ingénieure »)."
    size: 22
  - id: a2-sante
    level: A2
    title: La santé
    title_en: Health
    scope: Illnesses and symptoms, at the doctor's and the pharmacy, staying healthy.
    quebec_focus: "« la clinique sans rendez-vous », « la carte d'assurance maladie »."
    size: 20
  - id: a2-technologie
    level: A2
    title: La technologie au quotidien
    title_en: Everyday technology
    scope: Phones, computers, the internet and messaging.
    quebec_focus: "OQLF terms: « un courriel », « un cellulaire », « texter », « le clavardage »."
    size: 18
  - id: a2-emotions
    level: A2
    title: Les émotions
    title_en: Feelings and emotions
    scope: Adjectives and expressions for moods and feelings.
    quebec_focus: "« être tanné », « capoter », « achalant », « c'est plate »."
    size: 20
  - id: a2-animaux
    level: A2
    title: Les animaux
    title_en: Animals
    scope: Pets, farm animals and Canadian wildlife.
    quebec_focus: "Canadian animals: l'orignal, le castor, le huard, le raton laveur, l'ours noir."
    size: 20
  - id: a2-fetes
    level: A2
    title: Les fêtes et traditions
    title_en: Holidays and traditions
    scope: Holidays, celebrations and traditions in Québec through the year.
    quebec_focus: "« la cabane à sucre », « la tire d'érable », « la Saint-Jean », « le temps des Fêtes », « bonne fête! » (happy birthday)."
    size: 20
  # --- B1 ---------------------------------------------------------------------------------
  - id: b1-expressions
    level: B1
    title: Expressions de tous les jours
    title_en: Everyday expressions
    scope: Common conversational expressions and reactions used in everyday Québec speech.
    quebec_focus: "« pas pire », « c'est correct », « ça me tente », « avoir de la misère à », « présentement », « pantoute »."
    size: 20
  - id: b1-nature
    level: B1
    title: La nature et l'environnement
    title_en: Nature and the environment
    scope: Landscapes, the outdoors (camping, lakes, forests), climate and environmental issues.
    quebec_focus: "Outdoor life in Québec: le chalet, le lac, le canot, les maringouins."
    size: 22
  - id: b1-bureau
    level: B1
    title: Au bureau
    title_en: At the office
    scope: Office life, meetings, deadlines, email and professional communication.
    quebec_focus: "OQLF terms: « un courriel », « une réunion », « une échéance »."
    size: 20
  - id: b1-medias
    level: B1
    title: Les médias et l'actualité
    title_en: News and media
    scope: News, newspapers, television, social media, and talking about current events.
    size: 20
  # --- B2 ---------------------------------------------------------------------------------
  - id: b2-connecteurs
    level: B2
    title: Les connecteurs logiques
    title_en: Linking words
    scope: Connectors for contrast, cause, consequence, concession and sequence in speech and writing.
    size: 22
  - id: b2-societe
    level: B2
    title: La société
    title_en: Society and politics
    scope: Government, elections, social issues and debate vocabulary.
    size: 22
  - id: b2-nuancer
    level: B2
    title: Nuancer sa pensée
    title_en: Expressing nuance
    scope: Verbs and expressions to agree, disagree, qualify and hedge an opinion.
    size: 20
