# B1 curriculum outline: units and lesson skeletons. Sequencing follows the public
# Learn French with Clémence curriculum (reference: clemence:day-N); all text is original.
# Lesson content is generated by the local LLM and reviewed (see docs/content-authoring.md).
schema_version: 1
level: B1
title: Intermédiaire
summary: Conditional and subjunctive, complex sentences and nuance.
units:
- id: b1-u01-tenses-moods
  title: Temps et modes
  objectives:
  - Use past perfect, conditional and subjunctive
  lessons:
  - id: b1-plus-que-parfait
    title: Le plus-que-parfait
    kind: grammar
    objectives:
    - Form the plus-que-parfait
    - Express an earlier past
    grammar_topics:
    - plus-que-parfait
    prerequisites:
    - a2-pc-vs-imparfait
    reference: clemence:day-61
  - id: b1-pc-vs-pqp
    title: Passé composé ou plus-que-parfait ?
    kind: grammar
    objectives:
    - Order past events in a story
    grammar_topics:
    - pc-vs-pqp
    prerequisites:
    - b1-plus-que-parfait
    reference: clemence:day-62
  - id: b1-conditionnel-present
    title: Le conditionnel présent
    kind: grammar
    objectives:
    - Make polite requests and express wishes and hypotheses
    grammar_topics:
    - conditionnel-present
    prerequisites:
    - a2-futur-simple
    reference: clemence:day-63
  - id: b1-futur-vs-conditionnel
    title: Futur simple ou conditionnel ?
    kind: grammar
    objectives:
    - Distinguish -rai and -rais in writing and speech
    grammar_topics:
    - futur-vs-conditionnel
    prerequisites:
    - b1-conditionnel-present
    reference: clemence:day-64
  - id: b1-subjonctif-present
    title: Le subjonctif présent
    kind: grammar
    objectives:
    - Form the subjunctive
    - Use it after il faut que, vouloir que, avant que
    grammar_topics:
    - subjonctif-present
    prerequisites:
    - a1-present-irregular
    reference: clemence:day-65
  - id: b1-indicatif-vs-subjonctif
    title: Indicatif ou subjonctif ?
    kind: grammar
    objectives:
    - Choose the mood after expressions of certainty, doubt and emotion
    grammar_topics:
    - indicatif-vs-subjonctif
    prerequisites:
    - b1-subjonctif-present
    reference: clemence:day-66
- id: b1-u02-linking
  title: Relier ses idées
  objectives:
  - Build complex sentences with conjunctions and relative pronouns
  lessons:
  - id: b1-coordinating-conjunctions
    title: Les conjonctions de coordination
    kind: grammar
    objectives:
    - Use mais, ou, et, donc, or, ni, car
    grammar_topics:
    - coordinating-conjunctions
    prerequisites:
    - a1-connectors
    reference: clemence:day-67
  - id: b1-subordinating-conjunctions
    title: Les conjonctions de subordination
    kind: grammar
    objectives:
    - Use parce que, quand, si, comme, puisque, bien que
    grammar_topics:
    - subordinating-conjunctions
    prerequisites:
    - b1-coordinating-conjunctions
    reference: clemence:day-68
  - id: b1-temporal-conjunctions
    title: Les conjonctions de temps
    kind: grammar
    objectives:
    - Use dès que, aussitôt que, avant que, après que, pendant que
    grammar_topics:
    - temporal-conjunctions
    prerequisites:
    - b1-subordinating-conjunctions
    reference: clemence:day-69
  - id: b1-relative-pronouns
    title: Les pronoms relatifs dont, où et lequel
    kind: grammar
    objectives:
    - Use dont, où and lequel/laquelle
    grammar_topics:
    - relative-dont-ou-lequel
    prerequisites:
    - a2-relative-qui-que
    reference: clemence:day-70
  - id: b1-infinitive-constructions
    title: Les constructions infinitives
    kind: grammar
    objectives:
    - Use verbs followed by à or de + infinitive
    grammar_topics:
    - infinitive-constructions
    prerequisites: []
    reference: clemence:day-71
  - id: b1-passive-voice
    title: La voix passive
    kind: grammar
    objectives:
    - Form and recognize the passive with être + participle
    grammar_topics:
    - passive-voice
    prerequisites:
    - a2-passe-compose-etre
    reference: clemence:day-72
- id: b1-u03-reporting
  title: Préciser et rapporter
  objectives:
  - Report speech and talk precisely about people and places
  lessons:
  - id: b1-indefinite-pronouns
    title: Les pronoms indéfinis
    kind: grammar
    objectives:
    - Use quelqu'un, quelque chose, personne, rien, chacun
    grammar_topics:
    - indefinite-pronouns
    prerequisites: []
    reference: clemence:day-73
  - id: b1-compound-prepositions
    title: Les prépositions composées
    kind: grammar
    objectives:
    - Use à côté de, en face de, près de, loin de, au lieu de
    grammar_topics:
    - compound-prepositions
    prerequisites:
    - a1-prepositions-location
    reference: clemence:day-74
  - id: b1-indirect-speech
    title: Le discours indirect
    kind: grammar
    objectives:
    - Report statements and questions
    - Shift tenses in reported speech
    grammar_topics:
    - indirect-speech
    prerequisites:
    - b1-plus-que-parfait
    reference: clemence:day-75
  - id: b1-prepositions-places
    title: Les prépositions avec les lieux
    kind: grammar
    objectives:
    - Use à, en, au, aux with cities, provinces and countries
    grammar_topics:
    - prepositions-places
    prerequisites:
    - b1-compound-prepositions
    quebec_focus: à Québec (the city) vs au Québec (the province); en Ontario, au Manitoba, à Montréal
    reference: clemence:day-76
  - id: b1-impersonal-verbs
    title: Les verbes impersonnels
    kind: grammar
    objectives:
    - Use il faut, il pleut, il neige, il s'agit de
    grammar_topics:
    - impersonal-verbs
    prerequisites: []
    reference: clemence:day-77
  - id: b1-passe-recent
    title: Le passé récent
    kind: grammar
    objectives:
    - Use venir de + infinitive
    grammar_topics:
    - passe-recent
    prerequisites:
    - a1-futur-proche
    reference: clemence:day-78
- id: b1-u04-nuances
  title: Pronoms et nuances
  objectives:
  - Use y and en and express hypotheses, causes and consequences
  lessons:
  - id: b1-pronoun-y
    title: Le pronom y
    kind: grammar
    objectives:
    - Replace places and à + thing with y
    grammar_topics:
    - pronoun-y
    prerequisites:
    - a2-indirect-object-pronouns
    reference: clemence:day-79
  - id: b1-pronoun-en
    title: Le pronom en
    kind: grammar
    objectives:
    - Replace de + noun and quantities with en
    grammar_topics:
    - pronoun-en
    prerequisites:
    - b1-pronoun-y
    reference: clemence:day-80
  - id: b1-si-clauses
    title: Les phrases avec si
    kind: grammar
    objectives:
    - Use si + présent/futur and si + imparfait/conditionnel
    grammar_topics:
    - si-clauses
    prerequisites:
    - b1-conditionnel-present
    reference: clemence:day-81
  - id: b1-cause-effect
    title: Exprimer la cause et la conséquence
    kind: grammar
    objectives:
    - Use parce que, puisque, à cause de, grâce à, donc, c'est pourquoi
    grammar_topics:
    - cause-consequence
    prerequisites:
    - b1-subordinating-conjunctions
    reference: clemence:day-82
  - id: b1-nominalization
    title: La nominalisation
    kind: grammar
    objectives:
    - Turn verbs and adjectives into nouns (partir → le départ)
    grammar_topics:
    - nominalization
    prerequisites: []
    reference: clemence:day-83
  - id: b1-tout
    title: Les emplois de tout
    kind: grammar
    objectives:
    - Use tout, toute, tous, toutes as adjective, pronoun and adverb
    grammar_topics:
    - tout
    prerequisites: []
    reference: clemence:day-84
- id: b1-u05-style
  title: Nuancer son expression
  objectives:
  - Add emphasis and nuance and avoid common traps
  lessons:
  - id: b1-advanced-negation
    title: La négation avancée
    kind: grammar
    objectives:
    - Use ne…jamais, ne…plus, ne…rien, ne…personne, ne…que
    grammar_topics:
    - negation-advanced
    prerequisites:
    - a1-negation
    quebec_focus: Familiar Québec « pantoute » (not at all) and dropped ne in speech
    reference: clemence:day-85
  - id: b1-clauses
    title: Propositions indépendantes, principales et subordonnées
    kind: grammar
    objectives:
    - Identify clause types to build longer sentences
    grammar_topics:
    - clause-types
    prerequisites:
    - b1-subordinating-conjunctions
    reference: clemence:day-86
  - id: b1-emphatic-pronouns
    title: Les pronoms toniques
    kind: grammar
    objectives:
    - Use moi, toi, lui, elle, nous, vous, eux, elles
    grammar_topics:
    - emphatic-pronouns
    prerequisites: []
    reference: clemence:day-87
  - id: b1-emphatic-meme
    title: Les pronoms toniques avec même
    kind: grammar
    objectives:
    - Use moi-même, toi-même, eux-mêmes
    grammar_topics:
    - emphatic-pronouns
    prerequisites:
    - b1-emphatic-pronouns
    reference: clemence:day-88
  - id: b1-faux-amis
    title: Les faux amis
    kind: vocabulary
    objectives:
    - Avoid common English–French false friends
    grammar_topics: []
    vocabulary_theme: false-friends
    prerequisites: []
    quebec_focus: Include anglicisms the OQLF flags in Québec (e.g. « canceller » → annuler) alongside
      classic faux amis
    reference: clemence:day-89
  - id: b1-expressions-3
    title: Expressions québécoises (3)
    kind: expressions
    objectives:
    - Understand 10 idiomatic Québec expressions
    grammar_topics: []
    vocabulary_theme: expressions
    prerequisites:
    - a2-expressions-2
    reference: clemence:day-90
