# A1 curriculum outline: units and lesson skeletons. Sequencing follows the public
# Learn French with Clémence curriculum (reference: clemence:day-N); all text is original.
# Lesson content is generated by the local LLM and reviewed (see docs/content-authoring.md).
schema_version: 1
level: A1
title: Débutant
summary: Sounds, greetings, the present tense and everyday vocabulary.
units:
- id: a1-u01-sounds
  title: Les sons et les lettres
  objectives:
  - Read French words aloud with correct letter-sound patterns
  lessons:
  - id: a1-alphabet
    title: L'alphabet
    kind: pronunciation
    objectives:
    - Say the 26 letter names (E sounds like the e of le, U like the u of tu, G « gé », J « ji »,
      R is a throaty French r, W « double vé », Y « i grec »)
    - Spell words and names aloud letter by letter, and recognize letter names when heard
    grammar_topics:
    - alphabet
    prerequisites: []
    reference: clemence:day-1
  - id: a1-accents
    title: Les accents
    kind: pronunciation
    objectives:
    - Recognize é, è, ê, ë, à, ù, ç and how they change sounds
    - Know which accents change meaning (a/à, ou/où)
    grammar_topics:
    - accents
    prerequisites:
    - a1-alphabet
    reference: clemence:day-2
  - id: a1-letter-combinations
    title: Les combinaisons de lettres
    kind: pronunciation
    objectives:
    - Pronounce ai/ei as in mais, seize (è), au/eau as in chaud, beau (o), ou as in vous, oi as in
      moi (wa)
    - Pronounce the nasal vowels an/en (blanc, vent), in/ain (vin, pain), on (bon) and un (brun)
    grammar_topics:
    - letter-combinations
    prerequisites:
    - a1-accents
    quebec_focus: Note that Québec speech keeps distinct nasal vowels (brun vs brin) that many speakers
      in France merge
    reference: clemence:day-3
  - id: a1-silent-letters
    title: Les lettres muettes
    kind: pronunciation
    objectives:
    - Predict silent final letters - most final consonants are silent (grand, trop, gros, petit,
      deux, nez), but final c, r, f, l are usually heard (sac, bonjour, neuf, avril), and a final e
      is silent (table)
    - Recognize basic liaison after determiners and pronouns (les amis, vous avez, un enfant)
    grammar_topics:
    - silent-letters
    prerequisites:
    - a1-letter-combinations
    reference: clemence:day-4
- id: a1-u02-first-contact
  title: Premiers contacts
  objectives:
  - Greet people and introduce yourself in everyday Québec situations
  lessons:
  - id: a1-greetings
    title: Saluer
    kind: communication
    objectives:
    - Greet and take leave at different times of day
    - Choose tu or vous appropriately
    grammar_topics:
    - greetings
    prerequisites: []
    quebec_focus: In Québec, « allô » is also an informal hello (not just on the phone), « bienvenue » is
      the usual reply to « merci », and tu is used more widely than in France
    reference: clemence:day-5
  - id: a1-introducing-yourself
    title: Se présenter
    kind: communication
    objectives:
    - Say your name, origin, age and job
    - Ask someone the same questions
    grammar_topics:
    - introductions
    prerequisites:
    - a1-greetings
    reference: clemence:day-6
- id: a1-u03-nouns
  title: Les noms et les pronoms
  objectives:
  - Use articles, noun gender and subject pronouns correctly
  lessons:
  - id: a1-articles
    title: Les articles définis et indéfinis
    kind: grammar
    objectives:
    - Choose le, la, l', les, un, une, des
    - Use the definite article for general likes
    grammar_topics:
    - articles-definite-indefinite
    prerequisites: []
    reference: clemence:day-7
  - id: a1-noun-gender
    title: Le genre des noms
    kind: grammar
    objectives:
    - Guess a noun's gender from common endings
    - Learn nouns together with their article
    grammar_topics:
    - noun-gender
    prerequisites:
    - a1-articles
    quebec_focus: Some English loanwords have a different gender in Québec usage (une job in Québec, un
      job in France)
    reference: clemence:day-8
  - id: a1-subject-pronouns
    title: Les pronoms sujets
    kind: grammar
    objectives:
    - Use je, tu, il, elle, on, nous, vous, ils, elles
    - Use on to mean 'we' in conversation
    grammar_topics:
    - subject-pronouns
    prerequisites: []
    quebec_focus: Spoken Québec French uses on far more than nous for 'we'
    reference: clemence:day-9
- id: a1-u04-present
  title: Le présent
  objectives:
  - Describe routines and ask questions in the present
  lessons:
  - id: a1-present-er
    title: Le présent des verbes en -er
    kind: grammar
    objectives:
    - Conjugate regular -er verbs
    - Talk about daily activities
    grammar_topics:
    - present-er
    prerequisites:
    - a1-subject-pronouns
    reference: clemence:day-10
  - id: a1-present-ir
    title: Le présent des verbes en -ir (2e groupe)
    kind: grammar
    objectives:
    - Conjugate finir-type verbs (finissons)
    grammar_topics:
    - present-ir
    prerequisites:
    - a1-present-er
    reference: clemence:day-11
  - id: a1-present-irregular
    title: Le présent des verbes irréguliers
    kind: grammar
    objectives:
    - Conjugate être, avoir, aller, faire, prendre, pouvoir, vouloir, venir
    grammar_topics:
    - present-irregular
    prerequisites:
    - a1-present-ir
    reference: clemence:day-12
  - id: a1-negation
    title: La négation
    kind: grammar
    objectives:
    - Make sentences negative with ne…pas
    - Use de after negation (pas de pain)
    grammar_topics:
    - negation-basic
    prerequisites:
    - a1-present-irregular
    quebec_focus: In casual Québec speech ne is usually dropped (« J'sais pas »); learners should write
      it
    reference: clemence:day-13
  - id: a1-questions
    title: Poser des questions
    kind: grammar
    objectives:
    - Ask yes/no questions with intonation, est-ce que and inversion
    grammar_topics:
    - yes-no-questions
    prerequisites:
    - a1-negation
    quebec_focus: Recognize the informal Québec question particle -tu (« Tu viens-tu ? »)
    reference: clemence:day-14
  - id: a1-question-words
    title: Les mots interrogatifs
    kind: grammar
    objectives:
    - Ask qui, que, où, quand, comment, pourquoi, combien questions
    grammar_topics:
    - question-words
    prerequisites:
    - a1-questions
    reference: clemence:day-15
- id: a1-u05-describing
  title: Décrire son monde
  objectives:
  - Describe places, people and belongings
  lessons:
  - id: a1-il-y-a
    title: Il y a
    kind: grammar
    objectives:
    - Say what there is and isn't (il y a, il n'y a pas de)
    grammar_topics:
    - il-y-a
    prerequisites:
    - a1-negation
    quebec_focus: Spoken Québec French often says « y'a » for il y a
    reference: clemence:day-16
  - id: a1-prepositions-location
    title: Les prépositions de lieu
    kind: grammar
    objectives:
    - Locate things with sur, sous, dans, devant, derrière, à côté de, entre
    grammar_topics:
    - prepositions-location
    prerequisites:
    - a1-il-y-a
    reference: clemence:day-17
  - id: a1-descriptive-adjectives
    title: Les adjectifs qualificatifs
    kind: grammar
    objectives:
    - Make adjectives agree in gender and number
    - Place adjectives before or after the noun
    grammar_topics:
    - adjective-agreement
    prerequisites:
    - a1-noun-gender
    reference: clemence:day-18
  - id: a1-possessive-adjectives
    title: Les adjectifs possessifs
    kind: grammar
    objectives:
    - Use mon, ma, mes, ton, ta, tes, son, sa, ses, notre, votre, leur(s)
    grammar_topics:
    - possessive-adjectives
    prerequisites:
    - a1-descriptive-adjectives
    reference: clemence:day-19
- id: a1-u06-numbers-time
  title: Les nombres et le temps
  objectives:
  - Use numbers, dates and times in everyday situations
  lessons:
  - id: a1-numbers-0-100
    title: Les nombres de 0 à 100
    kind: vocabulary
    objectives:
    - Count and give phone numbers and prices up to 100
    grammar_topics:
    - numbers
    vocabulary_theme: numbers
    prerequisites: []
    quebec_focus: Prices in dollars and cents (« ça fait douze piasses » is familiar for dollars)
    reference: clemence:day-20
  - id: a1-days-months
    title: Les jours et les mois
    kind: vocabulary
    objectives:
    - Name days, months and seasons
    - Talk about your week
    grammar_topics: []
    vocabulary_theme: calendar
    prerequisites: []
    quebec_focus: « La fin de semaine » for the weekend
    reference: clemence:day-21
  - id: a1-telling-time
    title: Dire l'heure
    kind: communication
    objectives:
    - Tell and ask the time with the 12- and 24-hour clock
    grammar_topics:
    - telling-time
    prerequisites:
    - a1-numbers-0-100
    reference: clemence:day-22
  - id: a1-dates
    title: Dire la date
    kind: communication
    objectives:
    - Give dates and birthdays (le 24 juin)
    grammar_topics:
    - dates
    prerequisites:
    - a1-days-months
    quebec_focus: 'Québec holidays: la Saint-Jean-Baptiste / fête nationale (24 juin), le 1er juillet'
    reference: clemence:day-23
- id: a1-u07-plans
  title: Projets et liens
  objectives:
  - Talk about near-future plans and connect simple ideas
  lessons:
  - id: a1-futur-proche
    title: Le futur proche
    kind: grammar
    objectives:
    - Use aller + infinitive for plans
    grammar_topics:
    - futur-proche
    prerequisites:
    - a1-present-irregular
    quebec_focus: Very common in Québec speech for all future plans
    reference: clemence:day-24
  - id: a1-connectors
    title: Les connecteurs de base
    kind: grammar
    objectives:
    - Link ideas with et, mais, ou, parce que, alors, puis
    grammar_topics:
    - basic-connectors
    prerequisites: []
    quebec_focus: Spoken Québec « pis » (from puis) for 'and then'
    reference: clemence:day-25
- id: a1-u08-everyday-words
  title: Le vocabulaire du quotidien
  objectives:
  - Build core vocabulary for everyday conversations
  lessons:
  - id: a1-colors
    title: Les couleurs
    kind: vocabulary
    objectives:
    - Name colors and make them agree
    grammar_topics:
    - adjective-agreement
    vocabulary_theme: colors
    prerequisites: []
    reference: clemence:day-26
  - id: a1-family
    title: La famille
    kind: vocabulary
    objectives:
    - Talk about family members and relationships
    grammar_topics: []
    vocabulary_theme: family
    prerequisites: []
    quebec_focus: 'Familiar Québec terms: ma blonde, mon chum, matante, mononcle'
    reference: clemence:day-27
  - id: a1-weather-seasons
    title: La météo et les saisons
    kind: vocabulary
    objectives:
    - Describe the weather in every season
    grammar_topics: []
    vocabulary_theme: weather
    prerequisites: []
    quebec_focus: 'Winter vocabulary: il fait frette (familiar), la poudrerie, la tempête de neige, la
      sloche'
    reference: clemence:day-28
  - id: a1-food
    title: Les fruits et les légumes
    kind: vocabulary
    objectives:
    - Name common fruits and vegetables and shop for them
    grammar_topics:
    - articles-definite-indefinite
    vocabulary_theme: food
    prerequisites: []
    quebec_focus: 'Everyday food and shopping words; use the Québec form where one exists (le blé d''Inde for corn, la patate)'
    reference: clemence:day-29
  - id: a1-expressions-1
    title: Expressions québécoises (1)
    kind: expressions
    objectives:
    - Understand 10 common everyday expressions heard in Québec
    grammar_topics: []
    vocabulary_theme: expressions
    prerequisites: []
    quebec_focus: High-frequency, non-vulgar expressions (c'est plate, pantoute, être tanné, avoir de
      la misère à). Québec-specific expressions only from the verified lexicon, never invented ones; the rest are common idioms used in Québec and France (region common). No vulgar expressions.
    reference: clemence:day-30
