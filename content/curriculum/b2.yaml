# B2 curriculum outline: units and lesson skeletons. Sequencing follows the public
# Learn French with Clémence curriculum (reference: clemence:day-N); all text is original.
# Lesson content is generated by the local LLM and reviewed (see docs/content-authoring.md).
schema_version: 1
level: B2
title: Intermédiaire avancé
summary: All tenses, advanced structures, precision and style.
units:
- id: b2-u01-all-tenses
  title: Tous les temps
  objectives:
  - Master compound and literary tenses
  lessons:
  - id: b2-conditionnel-passe
    title: Le conditionnel passé
    kind: grammar
    objectives:
    - Express regrets and unreal past (j'aurais dû)
    grammar_topics:
    - conditionnel-passe
    prerequisites:
    - b1-si-clauses
    reference: clemence:day-91
  - id: b2-subjonctif-passe
    title: Le subjonctif passé
    kind: grammar
    objectives:
    - Form and use the past subjunctive
    grammar_topics:
    - subjonctif-passe
    prerequisites:
    - b1-indicatif-vs-subjonctif
    reference: clemence:day-92
  - id: b2-futur-anterieur
    title: Le futur antérieur
    kind: grammar
    objectives:
    - Express a future action completed before another
    grammar_topics:
    - futur-anterieur
    prerequisites:
    - a2-futur-simple
    reference: clemence:day-93
  - id: b2-subjonctif-imparfait
    title: Le subjonctif imparfait
    kind: grammar
    objectives:
    - Recognize the imperfect subjunctive in literary texts
    grammar_topics:
    - subjonctif-imparfait
    prerequisites:
    - b2-subjonctif-passe
    reference: clemence:day-94
  - id: b2-passe-simple
    title: Le passé simple
    kind: grammar
    objectives:
    - Recognize the passé simple in novels and stories
    grammar_topics:
    - passe-simple
    prerequisites:
    - a2-pc-vs-imparfait
    reference: clemence:day-95
  - id: b2-passe-anterieur
    title: Le passé antérieur
    kind: grammar
    objectives:
    - Recognize the passé antérieur
    grammar_topics:
    - passe-anterieur
    prerequisites:
    - b2-passe-simple
    reference: clemence:day-96
  - id: b2-tenses-review
    title: Révision de tous les temps
    kind: review
    objectives:
    - Choose the right tense and mood in connected texts
    grammar_topics:
    - tenses-review
    prerequisites:
    - b2-passe-anterieur
    reference: clemence:day-97
- id: b2-u02-structures
  title: Constructions avancées
  objectives:
  - Use causatives, complex relatives and discourse markers
  lessons:
  - id: b2-ce-qui-ce-que-ce-dont
    title: Ce qui, ce que et ce dont
    kind: grammar
    objectives:
    - Use ce qui, ce que, ce dont
    grammar_topics:
    - ce-qui-ce-que-ce-dont
    prerequisites:
    - b1-relative-pronouns
    reference: clemence:day-98
  - id: b2-faire-causative
    title: Le causatif avec faire
    kind: grammar
    objectives:
    - Use faire + infinitive (je fais réparer mon char)
    grammar_topics:
    - causative-faire
    prerequisites: []
    reference: clemence:day-99
  - id: b2-se-faire
    title: Le causatif avec se faire
    kind: grammar
    objectives:
    - Use se faire + infinitive (se faire couper les cheveux)
    grammar_topics:
    - causative-se-faire
    prerequisites:
    - b2-faire-causative
    reference: clemence:day-100
  - id: b2-se-laisser
    title: Le causatif avec se laisser
    kind: grammar
    objectives:
    - Use se laisser + infinitive
    grammar_topics:
    - causative-se-laisser
    prerequisites:
    - b2-se-faire
    reference: clemence:day-101
  - id: b2-discourse-markers
    title: Les marqueurs du discours
    kind: grammar
    objectives:
    - Structure an argument with tout d'abord, ensuite, de plus, cependant, bref
    grammar_topics:
    - discourse-markers
    prerequisites: []
    quebec_focus: 'Spoken Québec markers: « genre », « fait que », « en tout cas »'
    reference: clemence:day-102
  - id: b2-complex-inversion
    title: L'inversion complexe
    kind: grammar
    objectives:
    - Use complex inversion in formal questions (Marie vient-elle ?)
    grammar_topics:
    - complex-inversion
    prerequisites:
    - a1-questions
    reference: clemence:day-103
- id: b2-u03-precision
  title: La précision
  objectives:
  - Use advanced prepositions, adjectives and relative pronouns
  lessons:
  - id: b2-advanced-prepositions
    title: Les prépositions avancées
    kind: grammar
    objectives:
    - Use à partir de, dès, en attendant, d'ici, à l'égard de
    grammar_topics:
    - prepositions-advanced
    prerequisites:
    - b1-compound-prepositions
    reference: clemence:day-104
  - id: b2-advanced-adjectives
    title: Les adjectifs avancés
    kind: grammar
    objectives:
    - Use adjectives whose meaning changes with position (un ancien collègue)
    grammar_topics:
    - adjectives-advanced
    prerequisites:
    - a1-descriptive-adjectives
    reference: clemence:day-105
  - id: b2-irregular-plurals
    title: Les pluriels irréguliers
    kind: grammar
    objectives:
    - Form irregular plurals (-al/-aux, -ail, -eu, compound nouns)
    grammar_topics:
    - irregular-plurals
    prerequisites: []
    reference: clemence:day-106
  - id: b2-auquel
    title: Le pronom relatif auquel
    kind: grammar
    objectives:
    - Use auquel, à laquelle, auxquels
    grammar_topics:
    - relative-auquel-duquel
    prerequisites:
    - b1-relative-pronouns
    reference: clemence:day-107
  - id: b2-duquel
    title: Le pronom relatif duquel
    kind: grammar
    objectives:
    - Use duquel, de laquelle, desquels after compound prepositions
    grammar_topics:
    - relative-auquel-duquel
    prerequisites:
    - b2-auquel
    reference: clemence:day-108
  - id: b2-relatives-review
    title: Révision des pronoms relatifs
    kind: review
    objectives:
    - Choose the right relative pronoun in any sentence
    grammar_topics:
    - relatives-review
    prerequisites:
    - b2-duquel
    reference: clemence:day-109
- id: b2-u04-review
  title: Révisions et pronoms
  objectives:
  - Consolidate articles and pronouns and master subtle structures
  lessons:
  - id: b2-articles-review
    title: Révision des articles
    kind: review
    objectives:
    - Choose definite, indefinite, partitive or no article
    grammar_topics:
    - articles-review
    prerequisites:
    - a2-partitive-articles
    reference: clemence:day-110
  - id: b2-y-en-advanced
    title: Les emplois avancés de y et en
    kind: grammar
    objectives:
    - Use y and en in idioms (s'en aller, j'y pense, ça y est)
    grammar_topics:
    - y-en-advanced
    prerequisites:
    - b1-pronoun-en
    reference: clemence:day-111
  - id: b2-ne-expletif
    title: Le ne explétif
    kind: grammar
    objectives:
    - Recognize expletive ne (avant qu'il ne parte)
    grammar_topics:
    - ne-expletif
    prerequisites:
    - b1-indicatif-vs-subjonctif
    reference: clemence:day-112
  - id: b2-ceci-cela-ca
    title: Ceci, cela, ça
    kind: grammar
    objectives:
    - Use ceci, cela, ça and ce in context
    grammar_topics:
    - ceci-cela-ca
    prerequisites:
    - a2-demonstrative-pronouns
    reference: clemence:day-113
  - id: b2-cest-vs-il-est
    title: C'est ou il est ?
    kind: grammar
    objectives:
    - Choose c'est or il/elle est
    grammar_topics:
    - cest-vs-il-est
    prerequisites: []
    reference: clemence:day-114
- id: b2-u05-words-style
  title: Les mots et le style
  objectives:
  - Build words, punctuate correctly and refine style
  lessons:
  - id: b2-prefixes
    title: Les préfixes
    kind: vocabulary
    objectives:
    - Build and understand words with common prefixes
    grammar_topics:
    - prefixes
    vocabulary_theme: word-formation
    prerequisites: []
    reference: clemence:day-115
  - id: b2-suffixes
    title: Les suffixes
    kind: vocabulary
    objectives:
    - Build and understand words with common suffixes
    grammar_topics:
    - suffixes
    vocabulary_theme: word-formation
    prerequisites:
    - b2-prefixes
    reference: clemence:day-116
  - id: b2-verbs-sen
    title: Les verbes avec s'en
    kind: grammar
    objectives:
    - Use s'en aller, s'en sortir, s'en vouloir, s'en faire
    grammar_topics:
    - verbs-sen
    prerequisites:
    - b2-y-en-advanced
    quebec_focus: « Inquiète-toi pas », « Fais-toi-en pas » in Québec speech
    reference: clemence:day-117
  - id: b2-punctuation
    title: La ponctuation
    kind: grammar
    objectives:
    - Punctuate and space French text correctly
    grammar_topics:
    - punctuation
    prerequisites: []
    quebec_focus: OQLF (Québec) spacing conventions before ; ! ? differ from France's
    reference: clemence:day-118
  - id: b2-on-vs-lon
    title: On et l'on
    kind: grammar
    objectives:
    - Recognize euphonic l'on in formal writing
    grammar_topics:
    - on-vs-lon
    prerequisites:
    - a1-subject-pronouns
    reference: clemence:day-119
  - id: b2-expressions-4
    title: Expressions québécoises (4)
    kind: expressions
    objectives:
    - Understand idioms common in Québec media and conversation
    grammar_topics: []
    vocabulary_theme: expressions
    prerequisites:
    - b1-expressions-3
    reference: clemence:day-120
