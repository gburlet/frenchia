# A2 curriculum outline: units and lesson skeletons. Sequencing follows the public
# Learn French with Clémence curriculum (reference: clemence:day-N); all text is original.
# Lesson content is generated by the local LLM and reviewed (see docs/content-authoring.md).
schema_version: 1
level: A2
title: Élémentaire
summary: Telling stories in the past, pronouns, the future and daily life.
units:
- id: a2-u01-past
  title: Raconter au passé
  objectives:
  - Tell stories about the past with the passé composé and imparfait
  lessons:
  - id: a2-passe-compose-er
    title: Le passé composé des verbes en -er
    kind: grammar
    objectives:
    - Form the passé composé with avoir for -er verbs
    grammar_topics:
    - passe-compose-avoir
    prerequisites:
    - a1-present-er
    reference: clemence:day-31
  - id: a2-passe-compose-ir
    title: Le passé composé des verbes en -ir
    kind: grammar
    objectives:
    - Form past participles of 2nd-group verbs (fini, choisi)
    grammar_topics:
    - passe-compose-avoir
    prerequisites:
    - a2-passe-compose-er
    reference: clemence:day-32
  - id: a2-passe-compose-irregular
    title: Les participes passés irréguliers
    kind: grammar
    objectives:
    - Use irregular participles (fait, pris, vu, eu, été, dit, mis)
    grammar_topics:
    - past-participles-irregular
    prerequisites:
    - a2-passe-compose-ir
    reference: clemence:day-33
  - id: a2-passe-compose-etre
    title: 'Le passé composé : être ou avoir ?'
    kind: grammar
    objectives:
    - Choose être for movement verbs and pronominal verbs
    - Make the participle agree with être
    grammar_topics:
    - passe-compose-etre
    prerequisites:
    - a2-passe-compose-irregular
    reference: clemence:day-34
  - id: a2-imparfait
    title: L'imparfait
    kind: grammar
    objectives:
    - Form the imparfait
    - Describe habits and backgrounds in the past
    grammar_topics:
    - imparfait
    prerequisites:
    - a2-passe-compose-etre
    reference: clemence:day-35
  - id: a2-pc-vs-imparfait
    title: Passé composé ou imparfait ?
    kind: grammar
    objectives:
    - Choose between completed events and background or habits
    grammar_topics:
    - pc-vs-imparfait
    prerequisites:
    - a2-imparfait
    reference: clemence:day-36
- id: a2-u02-pronouns-comparisons
  title: Pronoms et comparaisons
  objectives:
  - Replace nouns with pronouns and compare things
  lessons:
  - id: a2-direct-object-pronouns
    title: Les pronoms COD
    kind: grammar
    objectives:
    - Use me, te, le, la, nous, vous, les before the verb
    grammar_topics:
    - direct-object-pronouns
    prerequisites:
    - a1-present-irregular
    reference: clemence:day-37
  - id: a2-indirect-object-pronouns
    title: Les pronoms COI
    kind: grammar
    objectives:
    - Use me, te, lui, nous, vous, leur with verbs like parler à, donner à
    grammar_topics:
    - indirect-object-pronouns
    prerequisites:
    - a2-direct-object-pronouns
    reference: clemence:day-38
  - id: a2-comparatives
    title: Les comparatifs
    kind: grammar
    objectives:
    - Compare with plus, moins, aussi… que and meilleur/mieux
    grammar_topics:
    - comparatives
    prerequisites:
    - a1-descriptive-adjectives
    reference: clemence:day-39
  - id: a2-superlatives
    title: Les superlatifs
    kind: grammar
    objectives:
    - Say the most / the least (le plus…, le meilleur)
    grammar_topics:
    - superlatives
    prerequisites:
    - a2-comparatives
    reference: clemence:day-40
  - id: a2-demonstrative-adjectives
    title: Les adjectifs démonstratifs
    kind: grammar
    objectives:
    - Use ce, cet, cette, ces
    grammar_topics:
    - demonstrative-adjectives
    prerequisites: []
    quebec_focus: Spoken Québec French often adds -là (« ce char-là »)
    reference: clemence:day-41
  - id: a2-demonstrative-pronouns
    title: Les pronoms démonstratifs
    kind: grammar
    objectives:
    - Use celui, celle, ceux, celles (+ -ci/-là, qui, de)
    grammar_topics:
    - demonstrative-pronouns
    prerequisites:
    - a2-demonstrative-adjectives
    reference: clemence:day-42
- id: a2-u03-future-habits
  title: L'avenir, les consignes et les habitudes
  objectives:
  - Talk about the future, give instructions and describe routines
  lessons:
  - id: a2-futur-simple
    title: Le futur simple
    kind: grammar
    objectives:
    - Form the futur simple, including irregular stems (ir-, ser-, aur-, fer-)
    grammar_topics:
    - futur-simple
    prerequisites:
    - a1-futur-proche
    reference: clemence:day-43
  - id: a2-adverbs-frequency
    title: Les adverbes de fréquence
    kind: grammar
    objectives:
    - Say how often with toujours, souvent, parfois, rarement, jamais
    grammar_topics:
    - adverbs-frequency
    prerequisites: []
    reference: clemence:day-44
  - id: a2-imperatif
    title: L'impératif
    kind: grammar
    objectives:
    - Give instructions and advice
    - Place pronouns in affirmative and negative commands
    grammar_topics:
    - imperatif
    prerequisites:
    - a2-indirect-object-pronouns
    reference: clemence:day-45
  - id: a2-gerondif
    title: Le gérondif
    kind: grammar
    objectives:
    - Use en + present participle for simultaneous actions
    grammar_topics:
    - gerondif
    prerequisites:
    - a2-imparfait
    reference: clemence:day-46
  - id: a2-reflexive-verbs
    title: Les verbes pronominaux
    kind: grammar
    objectives:
    - Conjugate reflexive verbs in the present and passé composé
    - Describe a daily routine
    grammar_topics:
    - reflexive-verbs
    prerequisites:
    - a2-passe-compose-etre
    reference: clemence:day-47
  - id: a2-relative-qui-que
    title: Les pronoms relatifs qui et que
    kind: grammar
    objectives:
    - Join sentences with qui and que
    grammar_topics:
    - relative-qui-que
    prerequisites:
    - a2-direct-object-pronouns
    reference: clemence:day-48
  - id: a2-depuis-pendant-pour
    title: Depuis, pendant et pour
    kind: grammar
    objectives:
    - Express duration with depuis + présent, pendant and pour
    grammar_topics:
    - depuis-pendant-pour
    prerequisites:
    - a2-pc-vs-imparfait
    reference: clemence:day-49
- id: a2-u04-precision
  title: Préciser
  objectives:
  - Use larger numbers, ordinals and more precise determiners
  lessons:
  - id: a2-numbers-large
    title: Les grands nombres
    kind: vocabulary
    objectives:
    - Read and say numbers up to a billion, years and prices
    grammar_topics:
    - numbers
    vocabulary_theme: numbers
    prerequisites:
    - a1-numbers-0-100
    reference: clemence:day-50
  - id: a2-ordinal-numbers
    title: Les nombres ordinaux
    kind: vocabulary
    objectives:
    - Use premier, deuxième… for floors, rankings and centuries
    grammar_topics:
    - numbers
    vocabulary_theme: numbers
    prerequisites:
    - a2-numbers-large
    reference: clemence:day-51
  - id: a2-adverbs-manner
    title: Les adverbes de manière
    kind: grammar
    objectives:
    - Form -ment adverbs and use bien, mal, vite
    grammar_topics:
    - adverbs-manner
    prerequisites:
    - a2-adverbs-frequency
    reference: clemence:day-52
  - id: a2-partitive-articles
    title: Les articles partitifs
    kind: grammar
    objectives:
    - Use du, de la, de l', des for quantities
    - Use de after negation and quantities
    grammar_topics:
    - partitive-articles
    prerequisites:
    - a1-articles
    reference: clemence:day-53
  - id: a2-possessive-pronouns
    title: Les pronoms possessifs
    kind: grammar
    objectives:
    - Use le mien, la tienne, les siens…
    grammar_topics:
    - possessive-pronouns
    prerequisites:
    - a1-possessive-adjectives
    reference: clemence:day-54
- id: a2-u05-life
  title: La vie de tous les jours
  objectives:
  - Talk about hobbies, clothes, animals, work and getting around
  lessons:
  - id: a2-sports-hobbies
    title: Les sports et les loisirs
    kind: vocabulary
    objectives:
    - Talk about sports and free time (jouer à, faire de)
    grammar_topics:
    - partitive-articles
    vocabulary_theme: hobbies
    prerequisites: []
    quebec_focus: Hockey, le chalet, le camping, faire du ski de fond
    reference: clemence:day-55
  - id: a2-clothing
    title: Les vêtements
    kind: vocabulary
    objectives:
    - Describe clothing and shop for clothes
    grammar_topics: []
    vocabulary_theme: clothing
    prerequisites: []
    quebec_focus: 'Québec words: les bas (socks), la tuque, les mitaines, le chandail, magasiner'
    reference: clemence:day-56
  - id: a2-animals
    title: Les animaux
    kind: vocabulary
    objectives:
    - Name domestic and wild animals
    grammar_topics: []
    vocabulary_theme: animals
    prerequisites: []
    quebec_focus: 'Canadian wildlife: l''orignal, le castor, le huard, le maringouin'
    reference: clemence:day-57
  - id: a2-jobs
    title: Les métiers et les professions
    kind: vocabulary
    objectives:
    - Talk about jobs and workplaces
    - Use feminine job titles
    grammar_topics: []
    vocabulary_theme: work
    prerequisites: []
    quebec_focus: Québec feminine titles (la professeure, l'ingénieure, l'autrice) and « une job » (familiar)
    reference: clemence:day-58
  - id: a2-transport
    title: Les moyens de transport
    kind: vocabulary
    objectives:
    - Talk about getting around (en/à + transport)
    grammar_topics:
    - transport-prepositions
    vocabulary_theme: transport
    prerequisites: []
    quebec_focus: L'autobus, le métro, le traversier, le stationnement; le char (familiar)
    reference: clemence:day-59
  - id: a2-expressions-2
    title: Expressions québécoises (2)
    kind: expressions
    objectives:
    - Understand 10 more everyday expressions heard in Québec
    grammar_topics: []
    vocabulary_theme: expressions
    prerequisites:
    - a1-expressions-1
    reference: clemence:day-60
    quebec_focus: Québec-specific expressions only from the verified lexicon, never invented ones; the rest are common idioms used in Québec and France (region common). No vulgar expressions.
